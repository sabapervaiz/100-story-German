t: Sie versprechen dir den Himmel und liefern dir den Keller“, sagt Bodo und stellt die Tüten ab. „Warum fragst du?“", "„Ich habe 250 gebucht. Speedtests zeigen mir 50, manchmal 70. Nie mehr als 80.“", "„Hast du beim Anbieter angerufen?“", "„Zweimal. Beim ersten Mal haben sie gesagt, ich soll den Router neu starten. Beim zweiten Mal, dass es am WLAN liegt.“", "„Hm. Das kann sein. Aber das prüfen wir richtig. Hast du ein Netzwerkkabel?“", "Eine halbe Stunde später sitzt Bodo an Zofias Schreibtisch. Ihr Laptop ist mit einem Kabel direkt am Router angeschlossen.", "„So. Jetzt installieren wir die Breitbandmessung der Bundesnetzagentur. Das ist die offizielle App. Normale Speedtests aus dem Internet zählen für den Anbieter nicht. Die hier schon.“", "„Und dann einfach einmal messen?“", "„Nein. Ein ganzes Messprotokoll. Dreißig Messungen, verteilt auf drei verschiedene Tage. Mit Pausen dazwischen. Und immer über Kabel, damit keiner sagen kann, es liegt am WLAN. Das Programm sagt dir genau, wann du messen musst.“", "„Und wozu das alles?“", "„Wenn das Ergebnis deutlich unter dem liegt, was im Vertrag als normalerweise verfügbare Geschwindigkeit steht, hast du Rechte. Du kannst den Preis mindern. Oder ohne Frist kündigen. Das steht im Telekommunikationsgesetz.“", "Zofia misst. Drei Tage lang, morgens, mittags, abends. Die Kurve bleibt flach. Durchschnitt: dreiundsechzig Mbit/s. Am Ende zeigt das Programm in roter Schrift an: Die Abweichung ist erheblich. Sie können das Protokoll speichern.", "Am Sonntag sitzen sie wieder zusammen. Bodo hat eine Tasse Kaffee und Zofia einen leeren Bildschirm.", "„Und jetzt rufe ich an?“", "„Nein. Jetzt schreiben wir. Schriftlich ist besser. Dann haben sie es schwarz auf weiß und können nicht sagen, sie wüssten nichts.“", "„Wie fange ich an? ‚Sehr geehrte Damen und Herren, ich bin sehr wütend‘?“", "Bodo lacht. „Wütend darfst du sein. Aber in den Brief gehört es nicht. Sachlich, kurz, mit Fakten. Und mit einer klaren Forderung und einer Frist.“", "Sie schreiben gemeinsam. Bodo diktiert, Zofia formuliert um, wenn es zu altmodisch klingt.", "„Betreff: Reklamation wegen erheblicher Abweichung der Datenübertragungsrate, Kundennummer …“", "„Klingt sehr deutsch“, sagt Zofia.", "„Genau richtig. Weiter: ‚Laut Vertrag beträgt die normalerweise zur Verfügung stehende Geschwindigkeit 200 Mbit/s. Mit der Breitbandmessung der Bundesnetzagentur habe ich in einem vollständigen Messprotokoll eine durchschnittliche Geschwindigkeit von 63 Mbit/s festgestellt. Das Protokoll liegt bei.‘“", "„Und dann?“", "„Dann die Forderung. Was willst du eigentlich? Schnelleres Internet oder weniger zahlen?“", "Zofia überlegt. „Ehrlich? Schnelleres Internet. Ich brauche es für meine Arbeit.“", "„Dann schreib: ‚Ich fordere Sie auf, die vertraglich vereinbarte Leistung bis zum … herzustellen. Andernfalls werde ich die monatliche Zahlung entsprechend mindern beziehungsweise von meinem Sonderkündigungsrecht Gebrauch machen.‘ Zwei Wochen Frist sind fair.“", "„Klingt ziemlich streng.“", "„Klingt wie jemand, der seine Rechte kennt. Das wirkt.“", "Sie schickt den Brief per Einschreiben und zusätzlich über das Kundenportal. Zehn Tage später ruft ein Mann von der Technik an.", "„Frau Marciniak? Wir haben Ihr Messprotokoll geprüft. Sie haben recht. Wir haben festgestellt, dass Ihre Leitung an einem alten Verteiler hängt, der für diese Geschwindigkeit nicht ausgelegt ist. Wir können das leider erst in einigen Monaten technisch lösen.“", "„Und bis dahin?“", "„Wir bieten Ihnen an, Sie in den Tarif mit 100 Mbit/s umzustellen. Das kostet neunundzwanzig Euro statt neunundvierzig. Die zu viel bezahlten Beträge der letzten Monate schreiben wir Ihnen gut. Und sobald der Ausbau fertig ist, können Sie kostenlos wieder hochstufen.“", "Zofia rechnet schnell. Zwanzig Euro weniger im Monat, die Rückzahlung, und eigentlich hat sie nie mehr als sechzig bekommen.", "„Das klingt fair. Bitte schicken Sie mir das schriftlich.“", "„Natürlich. Und, Frau Marciniak – Ihr Brief war vorbildlich. So etwas bearbeiten wir gern.“", "Am Abend klingelt sie bei Bodo und bringt eine Flasche Wein.", "„Wir haben gewonnen. Weniger Geld, Rückzahlung und später schnelleres Internet.“", "„Siehst du“, sagt Bodo. „Nicht schreien. Messen und schreiben.“", "„Wo hast du das alles gelernt?“", "„Vierzig Jahre bei der Post. Ich war auf der anderen Seite der Briefe.“"], "gl": [["die Reklamation", "complaint"], ["der Internetanbieter", "internet service provider"], ["die Videocutterin", "video editor (f.)"], ["der Nachrichtentechniker", "telecommunications engineer"], ["das Netzwerkkabel", "network cable"], ["die Breitbandmessung", "broadband measurement (official tool)"], ["das Messprotokoll", "measurement log"], ["mindern", "to reduce (price)"], ["die Abweichung", "deviation"], ["erheblich", "considerable / significant"], ["schwarz auf weiß", "in black and white"], ["sachlich", "objective / matter-of-fact"], ["die Forderung", "demand / claim"], ["der Betreff", "subject line"], ["die Datenübertragungsrate", "data transfer rate"], ["das Sonderkündigungsrecht", "special right of termination"], ["das Einschreiben", "registered letter"], ["ausgelegt sein für", "to be designed for"], ["gutschreiben", "to credit"], ["vorbildlich", "exemplary"]], "q": [["Was ist Zofias Problem?", "Sie bekommt viel weniger Geschwindigkeit als gebucht.", "250 gebucht, etwa 60 bekommen."], ["Warum misst Bodo mit Kabel?", "Damit niemand sagen kann, es liegt am WLAN.", "Und nur die offizielle Messung zählt."], ["Wie funktioniert das Messprotokoll?", "Dreißig Messungen an drei verschiedenen Tagen.", "Mit der App der Bundesnetzagentur."], ["Was gehört laut Bodo in den Brief?", "Fakten, eine klare Forderung und eine Frist.", "Keine Wut."], ["Welche Lösung bietet der Anbieter an?", "Günstigerer Tarif, Rückzahlung, später kostenloses Hochstufen.", "Der alte Verteiler ist das Problem."]], "say": ["Was heißt eigentlich ‚bis zu‘?", "Schriftlich ist besser.", "Das Protokoll liegt bei.", "Ich fordere Sie auf, die vereinbarte Leistung herzustellen.", "Bitte schicken Sie mir das schriftlich."]}, {"id": 76, "title": "Verspätung am Flughafen", "level": "B2", "topic": "Reisen & Fluggastrechte", "rt": "ca. 6 Min.", "teaser": "Hilal und ihr Vater wollen nach Antalya. Das Flugzeug hat einen technischen Defekt, die Anzeigetafel springt von „verspätet“ auf „verspätet“. Und Hilal kennt ihre Rechte.", "body": ["Samstag, 5:40 Uhr, Flughafen Stuttgart. Hilal Aydoğan schiebt einen Gepäckwagen mit zwei Koffern durch die Halle. Neben ihr geht ihr Vater Ömer, vierundsiebzig, in seinem besten Sakko. Er fliegt zur Hochzeit seines Neffen in Antalya. Hilal begleitet ihn, weil er nicht mehr allein reisen möchte.", "„Abflug 7:15 Uhr“, sagt Ömer und schaut auf seine Bordkarte. „Wir sind viel zu früh.“", "„Lieber zu früh als zu spät, Baba.“", "Nach der Sicherheitskontrolle setzen sie sich an Gate 4. Um 6:50 Uhr sollte das Boarding beginnen. Um 6:50 Uhr passiert nichts. Um 7:05 Uhr springt die Anzeige um: Verspätet. Neue Abflugzeit: 9:00.", "„Was ist los?“, fragt Ömer.", "Hilal geht zum Schalter. Dort steht schon eine Schlange. Eine Mitarbeiterin der Fluggesellschaft mit müdem Gesicht erklärt immer wieder dasselbe.", "„Es gibt ein technisches Problem an der Maschine. Die Techniker sind dran. Wir informieren Sie, sobald wir mehr wissen.“", "„Wie lange ungefähr?“, fragt Hilal.", "„Das kann ich Ihnen leider noch nicht sagen.“", "Um 9:00 Uhr steht auf der Anzeige: Verspätet. Neue Abflugzeit: 11:30. Ömer wird unruhig.", "„Die Hochzeit ist heute Abend. Um acht. Wenn wir um halb zwölf fliegen, sind wir um vier in Antalya. Das geht noch. Aber wenn es später wird …“", "„Ganz ruhig, Baba. Wir schaffen das.“", "Hilal hat in der Nacht vor der Reise im Internet über Fluggastrechte gelesen. Sie geht noch einmal zum Schalter.", "„Entschuldigung. Wir warten jetzt über drei Stunden. Mein Vater ist vierundsiebzig und hat seit fünf Uhr nichts gegessen. Gibt es Verpflegung?“", "Die Mitarbeiterin nickt. „Ja, natürlich. Sie bekommen Gutscheine.“ Sie reicht ihr zwei Zettel: zwölf Euro pro Person für Essen und Getränke in den Restaurants am Gate.", "„Danke. Und eine Frage: Was ist mit einer Entschädigung, wenn wir mehr als drei Stunden zu spät ankommen?“", "„Dafür müssen Sie nach der Reise einen Antrag stellen. Über unsere Website.“", "„Und der Grund ist ein technischer Defekt? Nicht das Wetter, kein Streik?“", "Die Mitarbeiterin zögert einen Moment. „Ein technischer Defekt, ja.“", "„Danke. Das ist alles, was ich wissen wollte.“", "Zurück bei ihrem Vater gibt sie ihm einen Gutschein. „Komm, Baba. Wir frühstücken.“", "„Mit Papier bezahlen? Ist das ein Trick?“", "„Kein Trick. Das ist unser Recht. Wenn ein Flug lange verspätet ist, muss die Fluggesellschaft für Essen und Trinken sorgen. Und vielleicht bekommen wir später sogar Geld.“", "„Geld? Wofür?“", "„Wenn wir mehr als drei Stunden zu spät am Ziel ankommen, gibt es nach EU-Recht eine Entschädigung. Für eine Strecke wie nach Antalya sind das vierhundert Euro pro Person.“", "Ömer stellt seinen Tee ab. „Vierhundert? Das ist mehr als das Ticket gekostet hat!“", "„Genau. Aber nur, wenn es keine außergewöhnlichen Umstände gibt. Bei Unwetter oder bei Streik der Fluglotsen zahlt die Airline meistens nicht. Ein technisches Problem gehört in der Regel nicht dazu. Deshalb habe ich gefragt.“", "„Du bist wie deine Mutter“, sagt Ömer und lächelt. „Die hat auch immer alles gefragt.“", "Um 11:30 Uhr beginnt endlich das Boarding. Um 11:55 Uhr hebt das Flugzeug ab. Ömer schläft nach zehn Minuten ein. Hilal macht Fotos von der Bordkarte, der Anzeigetafel und den Gutscheinen. Sie schreibt die Uhrzeiten auf: geplante Ankunft 11:20 Uhr Ortszeit, tatsächliche Ankunft 16:05 Uhr.", "In Antalya wartet ihr Cousin Okan mit dem Auto. „Endlich! Wir dachten schon, ihr kommt gar nicht!“", "„Technischer Defekt“, sagt Ömer. „Aber wir haben gut gefrühstückt. Auf Kosten der Fluggesellschaft.“", "Sie kommen um 19:30 Uhr zur Hochzeit. Ömer tanzt bis zwei Uhr morgens.", "Zwei Wochen später, wieder zu Hause in Göppingen, sitzt Hilal am Laptop und füllt das Formular auf der Website der Fluggesellschaft aus. Flugnummer, Buchungsnummer, Ankunftszeit, Fotos. Sie schreibt sachlich und kurz.", "Nach drei Wochen kommt eine Antwort: Man bedauere die Unannehmlichkeiten. Als Geste biete man jedem Passagier einen Reisegutschein über hundertfünfzig Euro an.", "Hilal liest die Mail laut vor. Ömer schüttelt den Kopf. „Hundertfünfzig? Du hast doch gesagt vierhundert.“", "„Ja. Und genau das schreibe ich ihnen jetzt.“", "Sie tippt und liest dabei laut mit. „Sehr geehrte Damen und Herren, vielen Dank für Ihr Angebot. Den Gutschein lehne ich jedoch ab. Die Verspätung wurde durch einen technischen Defekt verursacht. Gemäß der europäischen Fluggastrechte-Verordnung bestehe ich daher auf einer Ausgleichszahlung von vierhundert Euro pro Person.“", "„Und wenn sie nicht zahlen?“, fragt Ömer.", "„Dann schreibe ich noch einen Satz.“ Sie tippt weiter. „Sollte die Zahlung nicht innerhalb von vierzehn Tagen eingehen, werde ich mich an die Schlichtungsstelle wenden.“", "„Klingt wie ein Anwalt“, sagt Ömer stolz.", "Elf Tage später sind achthundert Euro auf ihrem Konto.", "Hilal ruft ihren Vater an. „Baba, das Geld ist da.“", "„Alles?“", "„Alles. Achthundert.“", "Am anderen Ende ist es kurz still. Dann sagt Ömer: „Dann buchen wir nächstes Jahr wieder. Vielleicht ist das Flugzeug wieder kaputt.“", "„Baba!“", "„Ich mache nur Spaß. Aber das Frühstück war wirklich gut.“"], "gl": [["die Verspätung", "delay"], ["der Gepäckwagen", "luggage trolley"], ["das Sakko", "jacket"], ["die Bordkarte", "boarding pass"], ["die Sicherheitskontrolle", "security check"], ["die Fluggesellschaft", "airline"], ["die Maschine", "aircraft"], ["die Fluggastrechte", "air passenger rights"], ["die Verpflegung", "food and drink / catering"], ["die Entschädigung / Ausgleichszahlung", "compensation"], ["der Streik", "strike"], ["außergewöhnliche Umstände", "extraordinary circumstances"], ["der Fluglotse", "air traffic controller"], ["abheben", "to take off"], ["die Ortszeit", "local time"], ["bedauern", "to regret"], ["die Unannehmlichkeit", "inconvenience"], ["bestehen auf", "to insist on"], ["gemäß", "in accordance with"], ["die Schlichtungsstelle", "arbitration body"]], "q": [["Warum ist der Flug verspätet?", "Es gibt einen technischen Defekt.", "Die Abflugzeit wird zweimal verschoben."], ["Was bekommen die Passagiere am Flughafen?", "Gutscheine für Essen und Getränke.", "Bei langen Verspätungen muss die Airline dafür sorgen."], ["Warum fragt Hilal nach dem Grund der Verspätung?", "Bei außergewöhnlichen Umständen gibt es oft keine Entschädigung.", "Ein technischer Defekt zählt in der Regel nicht dazu."], ["Was dokumentiert Hilal?", "Bordkarte, Anzeigetafel, Gutscheine und Uhrzeiten.", "Als Beweis für den Antrag."], ["Warum lehnt Hilal den Reisegutschein ab?", "Sie hat Anspruch auf 400 € pro Person.", "Am Ende wird die volle Summe gezahlt."]], "say": ["Wie lange ungefähr?", "Gibt es Verpflegung?", "Was ist der Grund für die Verspätung?", "Lieber zu früh als zu spät.", "Ich bestehe auf der Ausgleichszahlung."]}, {"id": 77, "title": "Die Mitfahrgelegenheit", "level": "B2", "topic": "Reisen & Begegnungen", "rt": "ca. 6 Min.", "teaser": "Björn fährt von Freiburg nach Köln und nimmt drei Fremde mit. Eine Studentin, ein pensionierter Pfarrer und ein Mann, der zu spät kommt. Fünf Stunden, ein Auto, viele Meinungen.", "body": ["Freitag, 15:00 Uhr, Parkplatz am Freiburger Hauptbahnhof. Björn Wenke steht neben seinem blauen Kombi und schaut auf die App. Er fährt jedes zweite Wochenende nach Köln zu seiner Freundin und bietet die freien Plätze im Auto an. Zwanzig Euro pro Person. Damit bezahlt er fast das ganze Benzin.", "Die erste, die kommt, ist eine junge Frau mit einem riesigen Rucksack.", "„Hallo! Bist du Björn? Ich bin Esra. Ich habe den Platz vorne gebucht.“", "„Hallo Esra. Ja, genau. Der Rucksack passt hoffentlich in den Kofferraum.“", "„Der passt überall. Ich bin Studentin. Ich habe gelernt, alles in einen Rucksack zu packen.“", "Als Zweiter kommt ein älterer Herr mit weißen Haaren und einer kleinen Ledertasche. Er gibt Björn die Hand und verbeugt sich leicht.", "„Ludwig Brenninger. Guten Tag. Ich hoffe, ich störe nicht. Ich bin das erste Mal bei so etwas dabei. Meine Enkelin hat mir die App installiert.“", "„Sie stören gar nicht. Herzlich willkommen. Bitte setzen Sie sich hinten links.“", "Es ist 15:10 Uhr. Der vierte Mitfahrer fehlt. Björn schreibt ihm eine Nachricht. Keine Antwort. Um 15:20 Uhr ruft er an.", "„Ja? Sven hier.“", "„Hallo, hier ist Björn, von der Mitfahrgelegenheit nach Köln. Wir warten auf dich. Treffpunkt war um drei.“", "„Oh Mist! Ich bin noch in der Straßenbahn. Zehn Minuten! Bitte wartet!“", "Björn seufzt. Esra zuckt mit den Schultern. Herr Brenninger sagt: „Geduld ist eine Tugend. Und zehn Minuten sind nicht die Welt.“", "Um 15:35 Uhr kommt Sven angerannt, außer Atem, mit einer Sporttasche und einem Döner in der Hand.", "„Sorry, sorry! Die Bahn hatte Verspätung.“", "„Kein Problem“, sagt Björn, obwohl es eins ist. „Aber den Döner bitte erst essen, bevor wir losfahren. Nicht im Auto.“", "„Ernsthaft?“", "„Ernsthaft. Mein Auto, meine Regeln.“", "Sven isst den Döner in drei großen Bissen. Dann fahren sie los.", "Auf der A5 ist es zuerst ruhig. Esra hat Kopfhörer im Ohr, Sven schaut aufs Handy, Herr Brenninger schaut aus dem Fenster. Nach einer halben Stunde fragt er:", "„Darf ich fragen, was Sie alle in Köln machen?“", "Esra nimmt einen Kopfhörer heraus. „Ich besuche meine Eltern. Ich studiere Medizin in Freiburg. Fünftes Semester.“", "„Medizin! Wie schön. Und Sie, junger Mann?“", "„Konzert“, sagt Sven. „Morgen Abend. Und Sie?“", "„Ich fahre zur Taufe meiner Urenkelin. Ich darf sie taufen. Ich war vierzig Jahre Pfarrer in einem kleinen Dorf im Schwarzwald.“", "„Wow“, sagt Esra. „Und warum fahren Sie nicht mit dem Zug?“", "„Weil ich einmal im Leben eine Mitfahrgelegenheit ausprobieren wollte. Man lernt Menschen kennen, die man sonst nie treffen würde. In meinem Beruf war das immer das Schönste.“", "Bei Karlsruhe dreht Sven das Radio lauter. Es läuft Techno.", "„Sven“, sagt Björn ruhig. „Leiser bitte. Wir sind zu viert im Auto.“", "„Ist doch gute Musik.“", "„Für dich vielleicht. Wir können abwechseln. Jeder darf mal eine halbe Stunde aussuchen.“", "„Und was hören Sie, Herr Brenninger?“, fragt Esra.", "„Ich? Bach. Aber ich glaube, das wäre für die anderen eine Strafe.“", "Alle lachen. Sie einigen sich: Erst eine halbe Stunde Svens Musik, leise. Dann Esras Podcast über berühmte Kriminalfälle. Dann Herr Brenningers Bach. Und zum Schluss Björns Radio.", "Hinter Frankfurt gibt es Stau. Sven wird ungeduldig. „Können wir nicht über die Landstraße? Mein Handy sagt, das geht schneller.“", "„Dein Handy sagt das, weil alle anderen auch über die Landstraße fahren“, sagt Björn. „Dann ist da auch Stau.“", "Bei der Pause an einer Raststätte kauft Herr Brenninger für alle einen Kaffee.", "„Das müssen Sie nicht“, sagt Esra.", "„Doch. Sie haben mir heute mehr über Medizin erklärt als mein Hausarzt in zehn Jahren. Und Sven hat mir gezeigt, was Techno ist. Das ist eine Bildungsreise.“", "Sven wird ein bisschen rot. „Sorry übrigens wegen vorhin. Mit der Verspätung und dem Döner.“", "„Schon vergessen“, sagt Björn. „Aber nächstes Mal schreibst du, wenn du später kommst. Dann warten wir nicht umsonst.“", "„Versprochen.“", "Um 21:10 Uhr kommen sie in Köln an. Björn lässt alle am Hauptbahnhof aussteigen. Esra und Sven zahlen per App. Herr Brenninger holt einen Umschlag aus der Ledertasche.", "„Ich weiß, man bezahlt in der App. Aber meine Enkelin hat es nicht geschafft, mir das zu erklären. Hier sind zwanzig Euro. Und fünf für die Geduld.“", "„Das ist nicht nötig.“", "„Doch. Und wenn Sie wieder zurück nach Freiburg fahren – ich fahre am Montag.“", "Björn lacht. „Ich fahre am Sonntag. Aber ich kann für Sie eine Ausnahme machen.“", "Am Sonntagabend hat Björn eine neue Bewertung in der App. Fünf Sterne. „Bester Fahrer. Pünktlich, ruhig, mit klaren Regeln. Und tolle Musik-Demokratie. Esra.“", "Darunter eine zweite: „Hab gelernt, dass Bach gar nicht so schlecht ist. Sven.“"], "gl": [["die Mitfahrgelegenheit", "ride share"], ["der Kofferraum", "boot / trunk"], ["sich verbeugen", "to bow"], ["der Mitfahrer", "passenger (ride share)"], ["der Treffpunkt", "meeting point"], ["die Tugend", "virtue"], ["nicht die Welt sein", "not a big deal"], ["außer Atem", "out of breath"], ["ernsthaft", "seriously"], ["der Biss", "bite"], ["die Taufe / taufen", "baptism / to baptise"], ["die Urenkelin", "great-granddaughter"], ["der Pfarrer", "pastor / priest"], ["abwechseln", "to take turns"], ["sich einigen", "to agree"], ["die Landstraße", "country road"], ["die Raststätte", "service area"], ["die Bildungsreise", "educational trip"], ["umsonst", "in vain / for nothing"], ["die Ausnahme", "exception"]], "q": [["Warum bietet Björn Mitfahrplätze an?", "So bezahlt er fast das ganze Benzin.", "Er fährt jedes zweite Wochenende nach Köln."], ["Warum ist Björn mit Sven unzufrieden?", "Er kommt 35 Minuten zu spät und ohne Nachricht.", "Und er will im Auto Döner essen."], ["Warum fährt Herr Brenninger mit?", "Er will einmal fremde Menschen kennenlernen.", "Das war in seinem Beruf das Schönste."], ["Wie lösen sie den Streit über die Musik?", "Jeder darf eine halbe Stunde aussuchen.", "Erst Sven, dann Esra, dann Herr Brenninger, dann Björn."], ["Was soll Sven nächstes Mal tun?", "Eine Nachricht schreiben, wenn er später kommt.", "Dann warten die anderen nicht umsonst."]], "say": ["Treffpunkt war um drei.", "Mein Auto, meine Regeln.", "Wir können abwechseln.", "Geduld ist eine Tugend.", "Nächstes Mal schreibst du, wenn du später kommst."]}, {"id": 78, "title": "Die Gehaltsverhandlung", "level": "C1", "topic": "Arbeitswelt & Verhandeln", "rt": "ca. 7 Min.", "teaser": "Marta weiß, dass sie gut ist – aber nicht, was sie wert ist. Mit einer Mentorin, einer Auskunft nach dem Entgelttransparenzgesetz und einer gut gesetzten Pause verhandelt sie zum ersten Mal richtig.", "body": ["Marta Ziegler arbeitet seit drei Jahren als Produktmanagerin bei einem Medizintechnikunternehmen in Tuttlingen. Sie hat zwei Produkteinführungen verantwortet, ein neues Team aufgebaut und im letzten Jahr ein Projekt gerettet, das alle schon aufgegeben hatten. Ihr Gehalt hat sich in dieser Zeit um genau zwei Prozent erhöht – den Inflationsausgleich, den alle bekommen haben.", "Nächsten Donnerstag hat sie ihr Jahresgespräch. Am Wochenende trifft sie sich mit Ulrike Albers, ihrer früheren Chefin und heutigen Mentorin, in einem Café am Donauufer.", "„Ich will dieses Mal mehr Geld“, sagt Marta. „Aber ich weiß nicht, wie viel ich verlangen kann, ohne unverschämt zu wirken.“", "„Das ist die falsche Frage“, sagt Ulrike und rührt in ihrem Cappuccino. „Die richtige Frage lautet: Was ist dein Marktwert? Und wie belegst du ihn? Hast du recherchiert?“", "„Ich habe Gehaltsvergleichsportale angeschaut. Für meine Position in der Region liegt die Spanne zwischen 68.000 und 82.000 Euro. Ich verdiene 63.000.“", "„Das heißt, du liegst unter dem Markt. Gut zu wissen. Und intern? Dein Unternehmen hat über zweihundert Beschäftigte, oder?“", "„Etwa achthundert.“", "„Dann hast du nach dem Entgelttransparenzgesetz einen Auskunftsanspruch. Du kannst erfahren, was Kollegen des anderen Geschlechts in einer vergleichbaren Tätigkeit im Mittel verdienen. Den Median, nicht einzelne Gehälter.“", "Marta zögert. „Ist das nicht … ein bisschen konfrontativ? So, als würde ich unterstellen, dass man mich benachteiligt?“", "„Es ist dein gutes Recht, und es ist eine Information, kein Vorwurf. Wie du sie nutzt, entscheidest du. Ich würde sie nicht als Waffe einsetzen, sondern als Fakt.“", "Marta stellt die Anfrage noch am Montag beim Betriebsrat. Die Antwort kommt erstaunlich schnell: Der Median der männlichen Kollegen in vergleichbarer Position liegt bei 71.500 Euro.", "Am Mittwochabend probt sie mit Ulrike am Telefon.", "„Wichtig ist der Einstieg“, sagt Ulrike. „Fang nicht mit Geld an. Fang mit deinem Beitrag an. Konkret, mit Zahlen. Was hat das Unternehmen durch dich gewonnen?“", "„Die Produkteinführung im Frühjahr hat im ersten Halbjahr 4,2 Millionen Umsatz gebracht, zwanzig Prozent über Plan. Und das Projekt Atlas hätte ohne mein Eingreifen eine Vertragsstrafe von rund 300.000 Euro gekostet.“", "„Perfekt. Dann nennst du deine Zahl. Und zwar zuerst. Wer die erste Zahl nennt, setzt den Anker. Und du nennst nicht die Zahl, mit der du zufrieden wärst, sondern eine, die ambitioniert, aber begründbar ist.“", "„Ich hatte an 70.000 gedacht.“", "„Was wäre die obere Grenze, die du noch sachlich begründen kannst?“", "„Der interne Median liegt bei 71.500. Der Markt geht bis 82.000. Ich würde sagen … 76.000.“", "„Dann sag 76.000. Und dann – das ist das Schwierigste – sag nichts mehr. Halte die Pause aus. Wer zuerst redet, verliert an Position.“", "Am Donnerstag sitzt Marta ihrem Vorgesetzten gegenüber, Clemens Vossberg, Bereichsleiter Produktmanagement. Nach zwanzig Minuten über Ziele und Projekte lehnt er sich zurück.", "„Gibt es von Ihrer Seite noch etwas, das Sie ansprechen möchten?“", "„Ja. Ich möchte über meine Vergütung sprechen.“ Sie spürt, wie ihr Puls steigt, und zwingt sich, langsamer zu sprechen. „Im letzten Jahr habe ich die Einführung von Linea verantwortet, die zwanzig Prozent über Plan liegt, und das Projekt Atlas so umgesteuert, dass wir eine Vertragsstrafe in sechsstelliger Höhe vermieden haben. Gleichzeitig liegt mein Gehalt deutlich unter dem Marktniveau und unter dem internen Vergleichswert. Ich halte vor diesem Hintergrund ein Jahresgehalt von 76.000 Euro für angemessen.“", "Dann schweigt sie.", "Herr Vossberg schaut auf seine Unterlagen. Fünf Sekunden. Zehn. Es fühlt sich an wie eine Minute. Marta schaut ihm ruhig in die Augen und sagt nichts.", "„Das ist ein deutlicher Sprung“, sagt er schließlich. „Über zwanzig Prozent.“", "„Das ist mir bewusst. Er spiegelt aber auch wider, dass mein Gehalt in den letzten drei Jahren nicht mit meiner Verantwortung gewachsen ist.“", "„Sie sprachen vom internen Vergleichswert. Darf ich fragen, woher Sie den haben?“", "„Ich habe eine Auskunft nach dem Entgelttransparenzgesetz eingeholt. Der Median meiner männlichen Kollegen liegt bei 71.500 Euro.“", "Herr Vossberg hebt die Augenbrauen, dann nickt er langsam. „Das war mir in dieser Form nicht bekannt. Und, ehrlich gesagt, es ist nicht schön zu hören. Ich kann Ihnen heute keine Zusage über 76.000 geben, das liegt außerhalb meines Budgetrahmens. Was ich Ihnen anbieten kann: 72.000 ab dem nächsten Quartal. Und wir nehmen Sie in das Programm für Nachwuchsführungskräfte auf, mit dem Ziel, Sie in achtzehn Monaten auf die Teamleitung zu befördern. Dann sprechen wir erneut über das Gehalt.“", "Marta denkt an Ulrikes letzten Rat: Nimm nie das erste Angebot sofort an, aber lehne ein gutes auch nicht aus Stolz ab.", "„Das ist ein ernstzunehmendes Angebot, danke. Ich hätte zwei Bitten. Erstens, dass die 72.000 rückwirkend ab Jahresbeginn gelten. Zweitens, dass wir die Beförderung und die nächste Gehaltsstufe schriftlich mit Zielen festhalten.“", "Herr Vossberg lächelt zum ersten Mal. „Ab Januar kann ich nicht zusagen. Aber rückwirkend ab April kann ich durchsetzen. Und die Vereinbarung mit Zielen bekommen Sie bis Ende nächster Woche.“", "„Dann sind wir uns einig.“", "Am Abend ruft sie Ulrike an.", "„Und?“", "„Zweiundsiebzig, rückwirkend ab April, Führungsprogramm, schriftliche Ziele.“", "„Gratuliere. Wie lang war die Pause?“", "„Gefühlt eine Ewigkeit. Laut meiner Uhr zwölf Sekunden.“", "„Das“, sagt Ulrike, „waren die bestbezahlten zwölf Sekunden deines Lebens.“"], "gl": [["die Gehaltsverhandlung", "salary negotiation"], ["die Produkteinführung", "product launch"], ["verantworten", "to be responsible for"], ["der Inflationsausgleich", "inflation adjustment"], ["unverschämt", "impertinent / outrageous"], ["der Marktwert", "market value"], ["belegen", "to substantiate / prove"], ["die Spanne", "range"], ["das Entgelttransparenzgesetz", "Pay Transparency Act"], ["der Auskunftsanspruch", "right to information"], ["unterstellen", "to insinuate"], ["benachteiligen", "to disadvantage"], ["der Betriebsrat", "works council"], ["den Anker setzen", "to set the anchor (negotiation)"], ["begründbar", "justifiable"], ["die Vergütung", "remuneration"], ["widerspiegeln", "to reflect"], ["angemessen", "appropriate"], ["rückwirkend", "retroactively"], ["die Nachwuchsführungskraft", "junior executive / future leader"]], "q": [["Warum ist Martas Ausgangslage schwierig?", "Ihr Gehalt ist kaum gestiegen und liegt unter dem Markt.", "Trotz großer Erfolge."], ["Was erlaubt das Entgelttransparenzgesetz?", "Auskunft über den Median vergleichbarer Kollegen des anderen Geschlechts.", "In Betrieben mit über 200 Beschäftigten."], ["Warum soll Marta die erste Zahl nennen?", "Wer zuerst eine Zahl nennt, setzt den Anker.", "Die Zahl soll ambitioniert, aber begründbar sein."], ["Welche Funktion hat das Schweigen?", "Den Druck beim Gegenüber lassen.", "Wer zuerst redet, verliert an Position."], ["Wie verbessert Marta das Angebot noch?", "Rückwirkende Geltung und schriftliche Ziele.", "Sie nimmt es nicht sofort unverändert an."]], "say": ["Ich möchte über meine Vergütung sprechen.", "Ich halte ein Jahresgehalt von … für angemessen.", "Das ist mir bewusst.", "Das ist ein ernstzunehmendes Angebot, danke.", "Dann sind wir uns einig."]}, {"id": 79, "title": "Das Meeting, das keins hätte sein müssen", "level": "C1", "topic": "Arbeitswelt & Organisationskultur", "rt": "ca. 7 Min.", "teaser": "Jeden Montag 90 Minuten, 14 Teilnehmende, keine Entscheidungen. Fiete beschließt, den heiligen Jour fixe infrage zu stellen – mit einer Rechnung, die niemand hören will.", "body": ["Montag, 9:00 Uhr, Konferenzraum „Elbe“ in einer Hamburger Versicherung. Vierzehn Menschen sitzen um einen ovalen Tisch, acht davon mit aufgeklapptem Laptop, drei mit dem Handy unter der Tischkante. Es ist der wöchentliche Jour fixe der Abteilung Digitale Services. Er dauert offiziell sechzig Minuten. Seit Fiete Johannsen vor einem Jahr in die Abteilung gekommen ist, hat er noch nie weniger als neunzig gedauert.", "„So“, sagt Abteilungsleiter Volker Behrends und klickt die erste Folie an. „Dann machen wir mal die übliche Runde. Jeder sagt kurz, woran er gerade arbeitet.“", "Kurz bedeutet in dieser Runde durchschnittlich sechs Minuten pro Person. Fiete schaut auf die Uhr, rechnet und schreibt eine Zahl in sein Notizbuch.", "Um 10:28 Uhr ist die Runde vorbei. Unter „Sonstiges“ entbrennt eine zwanzigminütige Diskussion darüber, ob die Kaffeemaschine im dritten Stock durch ein Modell mit Milchaufschäumer ersetzt werden sollte. Eine Entscheidung wird vertagt.", "Nach dem Meeting bleibt Fiete mit seiner Kollegin Pauline in der Teeküche stehen.", "„Weißt du, was dieses Meeting kostet?“, fragt er.", "„Nerven?“", "„Auch. Aber ich meine Geld. Vierzehn Leute, neunzig Minuten. Wenn man einen durchschnittlichen internen Stundensatz von achtzig Euro annimmt, sind das knapp tausendsiebenhundert Euro. Pro Woche. Rund achtzigtausend im Jahr. Für ein Meeting, in dem wir uns gegenseitig vorlesen, was in unseren Tickets steht.“", "Pauline pfeift leise. „Hast du das gerade ausgerechnet?“", "„Während Matthias über die Migration der Kundendatenbank referiert hat. Zum dritten Mal in Folge mit denselben Folien.“", "„Und was willst du mit der Zahl machen? Sie Volker unter die Nase reiben?“", "„Bloß nicht. Dann verteidigt er das Meeting, und wir sind keinen Schritt weiter. Ich will ihm etwas anbieten, nicht etwas wegnehmen.“", "Am Mittwoch bittet Fiete um ein kurzes Gespräch. Volker Behrends hat ein Büro mit Blick auf den Hafen und eine Vorliebe für klare Ansagen.", "„Herr Johannsen. Was kann ich für Sie tun?“", "„Ich habe einen Vorschlag zum Montagsmeeting. Darf ich offen sein?“", "„Ich bitte darum.“", "„Ich habe den Eindruck, dass das Meeting im Moment zwei Funktionen gleichzeitig erfüllen soll: Information und Abstimmung. Für die Information ist es zu lang, für die Abstimmung zu groß. Am Ende gehen wir alle mit dem Gefühl raus, viel geredet und wenig entschieden zu haben.“", "Volker verschränkt die Arme. Fiete merkt, dass er sich auf dünnem Eis bewegt.", "„Das Meeting gibt es seit acht Jahren“, sagt Volker. „Es ist der einzige Termin, bei dem das ganze Team zusammenkommt. Ich lege Wert darauf, dass alle wissen, was die anderen tun.“", "„Das Ziel teile ich voll und ganz. Gerade deshalb möchte ich vorschlagen, es anders zu erreichen. Die Statusrunde könnte asynchron laufen: Jeder trägt bis Freitag drei Sätze in ein gemeinsames Dokument ein. Was ist erledigt, was steht an, wo brauche ich Hilfe. Das liest man in fünf Minuten.“", "„Und das Meeting fällt weg?“", "„Nein. Es wird kürzer und schärfer. Dreißig Minuten. Mit einer Agenda, die am Freitag verschickt wird. Nur Punkte, bei denen eine Entscheidung nötig ist oder bei denen jemand ausdrücklich Hilfe braucht. Jeder Punkt mit einer verantwortlichen Person und einem Zeitlimit. Und am Ende ein kurzes Protokoll: Was wurde entschieden, wer macht was bis wann.“", "Volker schweigt. Dann fragt er: „Und warum sollte ich das tun?“", "Fiete holt tief Luft. „Weil ich glaube, dass Ihnen gerade Ihre besten Leute in diesem Meeting innerlich verloren gehen. Die Hälfte arbeitet nebenher an ihren Laptops. Nicht aus Respektlosigkeit, sondern weil sie das Gefühl haben, ihre Zeit sinnvoller nutzen zu können. Mit einem kürzeren Format hätten Sie wieder ihre volle Aufmerksamkeit.“", "Er lässt die Zahl mit den achtzigtausend Euro bewusst weg.", "Volker steht auf, geht zum Fenster und schaut eine Weile auf die Containerkräne.", "„Wissen Sie, was mich ärgert?“, sagt er schließlich. „Dass Sie recht haben. Ich habe mich auch schon gefragt, warum Herr Tiedemann jeden Montag seine E-Mails beantwortet, während ich rede. Ich hatte es auf seine Arbeitsmoral geschoben.“", "„Vielleicht liegt es eher am Format als an den Menschen.“", "„Vielleicht.“ Er dreht sich um. „Gut. Wir testen es. Sechs Wochen. Sie erstellen die Vorlage für das Dokument und moderieren die ersten drei Sitzungen. Danach machen wir eine anonyme Umfrage. Wenn das Team es schlechter findet, gehen wir zurück.“", "„Einverstanden.“", "„Und, Herr Johannsen – die Kaffeemaschine kommt trotzdem auf die Agenda.“", "Fiete lacht. „Mit Zeitlimit. Fünf Minuten.“", "Sechs Wochen später liegt das Ergebnis der Umfrage auf dem Tisch. Zwölf von vierzehn Personen bewerten das neue Format als „deutlich besser“. Das Meeting dauert im Schnitt sechsundzwanzig Minuten. In drei Sitzungen wurden mehr Entscheidungen getroffen als im gesamten Quartal davor.", "Nur ein Kommentar ist kritisch. Er lautet: „Mir fehlt der persönliche Austausch.“", "Volker liest ihn laut vor und schaut in die Runde. „Berechtigter Punkt. Ich schlage vor, dass wir einmal im Monat gemeinsam frühstücken gehen. Ohne Agenda, ohne Laptops.“", "„Und ohne Protokoll?“, fragt Pauline.", "„Ausdrücklich ohne Protokoll.“", "Am Abend schreibt Fiete in sein Notizbuch, unter die durchgestrichene Zahl von damals: Nicht jedes Meeting ist überflüssig. Aber jedes Meeting braucht einen Grund."], "gl": [["der Jour fixe", "regular weekly meeting"], ["die Tischkante", "edge of the table"], ["die übliche Runde", "the usual round (of updates)"], ["entbrennen", "to flare up"], ["vertagen", "to postpone"], ["der Stundensatz", "hourly rate"], ["referieren", "to give a presentation"], ["jemandem etwas unter die Nase reiben", "to rub sth in someone's face"], ["die klare Ansage", "clear statement"], ["die Abstimmung", "coordination / alignment"], ["sich auf dünnem Eis bewegen", "to be on thin ice"], ["Wert legen auf", "to attach importance to"], ["asynchron", "asynchronous"], ["anstehen", "to be pending / upcoming"], ["das Protokoll", "minutes"], ["innerlich verloren gehen", "to check out mentally"], ["etwas auf etwas schieben", "to blame sth on sth"], ["moderieren", "to facilitate / chair"], ["berechtigt", "justified"], ["überflüssig", "superfluous"]], "q": [["Was ist das Problem des Jour fixe?", "Zu lang, zu groß, kaum Entscheidungen.", "Statusberichte statt Abstimmung."], ["Warum verschweigt Fiete die Kostenrechnung?", "Sie würde Volker in die Verteidigung drängen.", "Er will etwas anbieten, nicht wegnehmen."], ["Wie soll das neue Format aussehen?", "Status asynchron, Meeting 30 Minuten mit Agenda und Protokoll.", "Nur Entscheidungs- und Hilfepunkte."], ["Welches Argument überzeugt Volker?", "Die Mitarbeitenden sind innerlich nicht dabei.", "Es liegt am Format, nicht an den Menschen."], ["Wie reagiert Volker auf die Kritik in der Umfrage?", "Er führt ein monatliches Frühstück ohne Agenda ein.", "Für den persönlichen Austausch."]], "say": ["Darf ich offen sein?", "Das Ziel teile ich voll und ganz.", "Vielleicht liegt es eher am Format als an den Menschen.", "Berechtigter Punkt.", "Jedes Meeting braucht einen Grund."]}, {"id": 80, "title": "Die Probezeit", "level": "C1", "topic": "Arbeitswelt & Feedback", "rt": "ca. 7 Min.", "teaser": "Fünf Monate im neuen Job, und Jannis hat keine Ahnung, ob er bleiben darf. Statt abzuwarten, bittet er um ein ehrliches Zwischengespräch – und bekommt mehr Kritik, als ihm lieb ist.", "body": ["Jannis Kröger ist seit fünf Monaten Projektingenieur bei einem Anlagenbauer in Bielefeld. Seine Probezeit endet in vier Wochen. Und je näher das Datum rückt, desto schlechter schläft er.", "Niemand hat ihm gesagt, dass er etwas falsch macht. Aber niemand hat ihm auch gesagt, dass er etwas richtig macht. Seine Vorgesetzte, Dagmar Reinholz, ist eine ruhige Frau, die in Meetings wenig sagt und E-Mails mit einem einzigen Wort beantwortet: „Danke.“ Oder: „Ok.“", "Am Freitagabend sitzt er mit seiner Freundin Ronja auf dem Balkon.", "„Ich halte das nicht mehr aus“, sagt er. „Ich weiß nicht, ob sie zufrieden ist. Ich weiß nicht mal, ob sie weiß, dass ich existiere.“", "„Hast du sie gefragt?“", "„Wie denn? ‚Frau Reinholz, mögen Sie mich?‘“", "Ronja lacht. „Nein. Aber du kannst um ein Feedbackgespräch bitten. Das ist in der Probezeit völlig normal. Und klug. Wenn es ein Problem gibt, erfährst du es jetzt, solange du noch etwas ändern kannst – und nicht erst mit der Kündigung.“", "„Und wenn sie mir dann sagt, dass es nicht passt?“", "„Dann weißt du es wenigstens vier Wochen früher. Ehrlich gesagt ist Unsicherheit schlimmer als jede Antwort.“", "Am Montag schreibt Jannis eine kurze Mail: Er würde sich über ein Gespräch freuen, um eine Zwischenbilanz zu ziehen und zu erfahren, wo er sich aus ihrer Sicht noch verbessern könne. Die Antwort kommt nach einer Stunde: „Gute Idee. Mittwoch, 14 Uhr.“", "Am Mittwoch sitzt er in ihrem Büro. Frau Reinholz hat einen Ausdruck vor sich, auf dem sie offenbar Notizen gemacht hat.", "„Herr Kröger, zunächst: Ich finde es gut, dass Sie von sich aus auf mich zukommen. Das machen nicht viele. Ich bin, das weiß ich, nicht die Gesprächigste. Das hat Sie vermutlich verunsichert.“", "„Ein bisschen“, gibt Jannis zu.", "„Das tut mir leid. Dann will ich es jetzt umso deutlicher machen. Fachlich bin ich sehr zufrieden. Ihre Berechnungen für das Kühlsystem in Gütersloh waren sauber, und die Lösung mit dem zweiten Wärmetauscher hat uns beim Kunden viel Ärger erspart.“", "Jannis spürt, wie die Anspannung aus seinen Schultern weicht.", "„Aber“, fährt sie fort, und die Anspannung kommt zurück, „es gibt einen Punkt, an dem Sie arbeiten müssen. Sie kommunizieren Probleme zu spät. Beim Projekt in Gütersloh wussten Sie zwei Wochen vor mir, dass sich die Lieferung der Pumpen verzögert. Ich habe es vom Kunden erfahren. Das war unangenehm.“", "Jannis will etwas sagen, schließt den Mund aber wieder. Sie hat recht.", "„Darf ich erklären, warum das passiert ist?“, fragt er schließlich.", "„Bitte.“", "„Ich wollte das Problem erst lösen, bevor ich Sie damit belaste. Ich dachte, eine gute Ingenieurin will Lösungen hören, keine Probleme.“", "Frau Reinholz nickt langsam. „Das verstehe ich. Und es ehrt Sie. Aber es ist ein Missverständnis. Ich will nicht jedes Problem von Ihnen gelöst bekommen. Ich will von jedem Problem wissen, solange es noch klein ist. Lösen können wir es dann gemeinsam. Wenn ich es vom Kunden höre, kann ich niemanden mehr schützen – weder Sie noch das Projekt.“", "„Das leuchtet mir ein. Wie hätten Sie es sich gewünscht?“", "„Eine Mail, drei Sätze: Was ist passiert, was bedeutet es für den Zeitplan, was schlage ich vor. Mehr nicht. Lieber eine Information zu viel als eine zu wenig.“", "„Das kann ich umsetzen.“", "„Davon gehe ich aus. Und damit Sie nicht wieder vier Wochen rätseln müssen: Ich werde die Probezeit nicht verlängern – das ginge rechtlich ohnehin nur in engen Grenzen – sondern Sie werden übernommen. Vorausgesetzt, Sie tun mir einen Gefallen.“", "Jannis hält den Atem an. „Welchen?“", "„Sagen Sie mir in Zukunft, wenn Sie etwas verunsichert. Ich bin keine Gedankenleserin. Und Sie offenbar auch nicht.“", "Jannis lacht, zum ersten Mal an diesem Tag. „Abgemacht.“", "Als er aufsteht, sagt sie noch etwas. „Noch eine Bitte. Ich weiß, dass meine Mails kurz sind. ‚Ok‘ heißt bei mir übrigens: Das ist gut so. Nicht: Mir ist das egal.“", "„Das hätte mir vor fünf Monaten sehr geholfen.“", "„Das glaube ich Ihnen. Ich schreibe es mir auf. Für die nächste neue Kollegin.“", "Am Abend erzählt er Ronja alles.", "„Und? Was war das Wichtigste?“", "Jannis überlegt. „Dass Schweigen nicht dasselbe ist wie Unzufriedenheit. Und dass ich Probleme nicht verstecken soll, nur weil ich sie noch nicht gelöst habe.“", "„Das gilt übrigens auch für Beziehungen“, sagt Ronja.", "„Ist das eine Andeutung?“", "„Das ist eine Information. Lieber eine zu viel als eine zu wenig.“", "Zwei Wochen später verzögert sich wieder eine Lieferung. Jannis schreibt noch am selben Nachmittag eine Mail. Drei Sätze. Die Antwort kommt nach zehn Minuten.", "„Danke. Ok.“", "Diesmal weiß er genau, was es bedeutet."], "gl": [["die Probezeit", "probation period"], ["der Anlagenbauer", "plant engineering company"], ["näher rücken", "to draw closer"], ["die Zwischenbilanz ziehen", "to take stock (interim review)"], ["von sich aus", "on one's own initiative"], ["gesprächig", "talkative"], ["verunsichern", "to unsettle"], ["sauber (fig.)", "clean / neat (work)"], ["der Wärmetauscher", "heat exchanger"], ["die Anspannung", "tension"], ["weichen", "to give way / recede"], ["sich verzögern", "to be delayed"], ["belasten", "to burden"], ["es ehrt Sie", "it does you credit"], ["einleuchten", "to make sense"], ["rätseln", "to puzzle / wonder"], ["übernehmen (Mitarbeiter)", "to take on permanently"], ["vorausgesetzt", "provided that"], ["die Gedankenleserin", "mind reader (f.)"], ["die Andeutung", "hint / insinuation"]], "q": [["Warum ist Jannis verunsichert?", "Er bekommt kaum Rückmeldung.", "Frau Reinholz schreibt sehr kurze Mails."], ["Warum rät Ronja zu einem Feedbackgespräch?", "Man kann Probleme noch rechtzeitig ändern.", "Unsicherheit ist schlimmer als jede Antwort."], ["Was kritisiert Frau Reinholz?", "Dass Jannis Probleme zu spät kommuniziert.", "Sie hat die Lieferverzögerung vom Kunden erfahren."], ["Warum hat Jannis das Problem verschwiegen?", "Er wollte es erst selbst lösen.", "Er dachte, sie wolle nur Lösungen hören."], ["Was bedeutet „Ok“ bei Frau Reinholz?", "„Das ist gut so.“", "Nicht: „Mir ist das egal.“"]], "say": ["Ich würde mich über ein Feedbackgespräch freuen.", "Darf ich erklären, warum das passiert ist?", "Das leuchtet mir ein.", "Wie hätten Sie es sich gewünscht?", "Lieber eine Information zu viel als eine zu wenig."]}, {"id": 81, "title": "Der Antrag auf Elterngeld", "level": "C1", "topic": "Familie & Behörden", "rt": "ca. 7 Min.", "teaser": "Basiselterngeld, ElterngeldPlus, Partnerschaftsbonus: Kübra und Henning sitzen nachts mit Baby und Formular am Küchentisch – und stellen fest, dass es eigentlich um die Frage geht, wer wie lange zu Hause bleibt.", "body": ["Es ist 23:40 Uhr. Die kleine Juna schläft endlich, nach drei Stunden Weinen, Wiegen und Singen. Kübra Demirtaş sitzt am Küchentisch in ihrer Wohnung in Bonn, vor sich den Laptop, daneben eine kalte Tasse Fencheltee. Auf dem Bildschirm ist das Online-Formular für das Elterngeld geöffnet. Seite 1 von 14.", "Henning kommt in die Küche, die Haare zerzaust, ein Spucktuch über der Schulter.", "„Machst du das jetzt? Um Mitternacht?“", "„Wann sonst? Tagsüber hat sie Hunger, nachts hat sie Hunger. Und der Antrag muss rein. Rückwirkend gibt es das Geld nur für drei Monate vor dem Antragsmonat. Juna ist sechs Wochen alt.“", "Henning setzt sich neben sie. „Okay. Wo stehen wir?“", "„Bei der Frage, wer wie viele Monate nimmt. Und in welcher Variante. Ich verstehe nur Bahnhof.“", "„Dann gehen wir das systematisch durch. Lies vor.“", "Kübra scrollt zur Erklärung. „Basiselterngeld: Zusammen gibt es höchstens vierzehn Monate, wenn beide Elternteile mindestens zwei Monate nehmen. Einer allein kann höchstens zwölf nehmen. Das Elterngeld beträgt in der Regel fünfundsechzig bis siebenundsechzig Prozent des Nettoeinkommens vor der Geburt.“", "„Und ElterngeldPlus?“", "„Das ist halb so viel pro Monat, aber doppelt so lang. Sinnvoll, wenn man in Teilzeit arbeitet. Und dann gibt es noch den Partnerschaftsbonus: Wenn beide gleichzeitig zwischen vierundzwanzig und zweiunddreißig Stunden pro Woche arbeiten, bekommen beide zusätzlich zwei bis vier Monate ElterngeldPlus.“", "Henning reibt sich die Augen. „Wer hat sich das ausgedacht?“", "„Jemand, der ausgeschlafen war.“", "Sie lachen leise, damit Juna nicht aufwacht.", "„Okay“, sagt Henning. „Vergessen wir für einen Moment die Formulare. Was wollen wir eigentlich?“", "Kübra schaut ihn an. Diese Frage haben sie in der Schwangerschaft oft angedeutet, aber nie wirklich besprochen.", "„Ehrlich?“, sagt sie. „Ich will nicht zwölf Monate allein zu Hause sitzen, während du zwei Monate nimmst und danach wieder Vollzeit arbeitest. So wie es alle machen. So wie es meine Schwester gemacht hat. Und dann hast du den Karrieresprung und ich die Lücke im Lebenslauf.“", "Henning schweigt einen Moment. „Ich dachte, du willst die ersten Monate bei ihr sein.“", "„Will ich auch. Die ersten sechs. Danach möchte ich zurück ins Labor, wenigstens in Teilzeit. Mein Forschungsprojekt läuft weiter, ob ich da bin oder nicht.“", "„Und ich?“", "„Das musst du sagen. Nicht ich.“", "Henning steht auf, macht zwei Gläser Wasser und setzt sich wieder.", "„Ich habe Angst, wenn ich ehrlich bin. Nicht vor Juna. Vor meinem Chef. In unserer Kanzlei hat noch nie ein Mann länger als zwei Monate Elternzeit genommen. Bei der letzten Weihnachtsfeier hat einer der Partner einen Witz darüber gemacht. Alle haben gelacht.“", "„Hast du auch gelacht?“", "„… Ja.“", "Kübra legt ihre Hand auf seine. „Und wenn du der Erste bist, der es anders macht?“", "„Dann bin ich der Erste, über den sie Witze machen.“", "„Vielleicht. Oder der Erste, nach dem es die anderen sich trauen.“", "Henning schaut lange auf den Bildschirm. Dann zieht er den Laptop zu sich.", "„Okay. Vorschlag: Du nimmst die ersten sechs Monate Basiselterngeld. Ich nehme in der Zeit die ersten zwei Monate mit, damit wir am Anfang zusammen sind. Dann, ab Monat sieben, nehme ich vier Monate allein. Und danach arbeiten wir beide Teilzeit, dreißig Stunden, und nehmen den Partnerschaftsbonus.“", "Kübra rechnet im Kopf. „Dann ist Juna fast anderthalb, bis wir beide wieder voll arbeiten. Und wir haben beide eine Lücke. Eine gleich große.“", "„Und beide können wir nachts nicht schlafen“, sagt Henning. „Gleichberechtigung.“", "„Und dein Chef?“", "„Elternzeit muss er gewähren. Das ist ein Recht, kein Gefallen. Ich muss sie nur rechtzeitig anmelden, schriftlich, sieben Wochen vorher. Was er darüber denkt, ist sein Problem.“", "„Das klingt mutiger, als du vorhin geklungen hast.“", "„Ich habe es auch gerade erst beschlossen.“", "Sie füllen das Formular zusammen aus. Lebensmonate, Einkommen der letzten zwölf Monate, Lohnabrechnungen als PDF, Geburtsurkunde, Steuer-ID, Bankverbindung. Bei Seite elf stockt das System. Bei Seite dreizehn fragt es nach einer Bescheinigung der Krankenkasse über das Mutterschaftsgeld.", "„Haben wir die?“", "„Im Ordner. Unter ‚Baby – Behörden‘.“", "„Wir haben einen Ordner, der ‚Baby – Behörden‘ heißt?“", "„Seit dem fünften Monat. Du hast es nie bemerkt.“", "Um 1:15 Uhr klicken sie auf „Absenden“. Im selben Moment fängt Juna an zu weinen.", "Henning steht auf. „Ich geh. Übung für Monat sieben.“", "Drei Wochen später kommt der Bewilligungsbescheid. Am selben Tag schreibt Henning die Mail an seine Kanzlei. Er braucht zwei Stunden für fünf Sätze.", "Die Antwort des Seniorpartners kommt am nächsten Morgen: „Zur Kenntnis genommen. Wir werden das organisieren.“", "Und eine Woche später fragt ihn ein jüngerer Kollege in der Kaffeeküche leise: „Sag mal … wie hast du das eigentlich mit dem Elterngeld gemacht?“"], "gl": [["das Elterngeld", "parental allowance"], ["der Antrag / beantragen", "application / to apply"], ["das Spucktuch", "burp cloth"], ["rückwirkend", "retroactively"], ["nur Bahnhof verstehen", "not to understand a thing"], ["das Basiselterngeld", "basic parental allowance"], ["das ElterngeldPlus", "extended parental allowance (part-time)"], ["der Partnerschaftsbonus", "partnership bonus"], ["andeuten", "to hint at"], ["die Lücke im Lebenslauf", "gap in one's CV"], ["die Kanzlei", "law firm"], ["der Partner (Kanzlei)", "partner (in a firm)"], ["sich trauen", "to dare"], ["die Gleichberechtigung", "equality"], ["die Elternzeit", "parental leave"], ["gewähren", "to grant"], ["das Mutterschaftsgeld", "maternity pay"], ["die Geburtsurkunde", "birth certificate"], ["der Bewilligungsbescheid", "notice of approval"], ["zur Kenntnis nehmen", "to take note of"]], "q": [["Warum füllen sie den Antrag nachts aus?", "Tagsüber ist keine Zeit, und es eilt.", "Rückwirkend gibt es Geld nur für drei Monate."], ["Was ist der Unterschied zwischen Basiselterngeld und ElterngeldPlus?", "ElterngeldPlus ist halb so hoch, aber doppelt so lang.", "Sinnvoll bei Teilzeit."], ["Was befürchtet Kübra?", "Allein die Karrierelücke zu haben.", "Wie bei ihrer Schwester."], ["Warum zögert Henning?", "Er hat Angst vor der Reaktion in seiner Kanzlei.", "Dort hat noch kein Mann länger Elternzeit genommen."], ["Was zeigt die Frage des jüngeren Kollegen?", "Hennings Beispiel ermutigt andere.", "Er ist der Erste, „nach dem es sich die anderen trauen“."]], "say": ["Ich verstehe nur Bahnhof.", "Was wollen wir eigentlich?", "Das musst du sagen, nicht ich.", "Das ist ein Recht, kein Gefallen.", "Wie hast du das eigentlich gemacht?"]}, {"id": 82, "title": "Die Nebenkostenabrechnung", "level": "C1", "topic": "Wohnen & Recht", "rt": "ca. 7 Min.", "teaser": "Achthundertvierzig Euro Nachzahlung. Rasmus will einfach überweisen. Seine Mitbewohnerin Konstanze will erst die Belege sehen – und findet einen Posten, der dort nichts verloren hat.", "body": ["Der Brief liegt seit drei Tagen auf dem Küchentisch der Wohngemeinschaft in Leipzig-Plagwitz. Absender: Hausverwaltung Kessling & Partner. Betreff: Betriebskostenabrechnung für das vergangene Kalenderjahr. Und ganz unten, fett gedruckt: Nachzahlung: 840,17 €. Zahlbar innerhalb von 30 Tagen.", "„Achthundertvierzig Euro“, sagt Rasmus und lässt sich auf einen Stuhl fallen. „Das sind zweihundertzehn pro Person. Ich überweise das einfach. Ich habe keine Lust auf Stress.“", "Konstanze, Jurastudentin im siebten Semester, nimmt ihm den Brief aus der Hand. „Rasmus. Niemals einfach überweisen. Erst prüfen.“", "„Was willst du da prüfen? Die werden schon wissen, was sie tun.“", "„Studien sagen, dass ein erheblicher Teil der Nebenkostenabrechnungen fehlerhaft ist. Das ist keine böse Absicht. Aber es passiert. Gib mir eine Stunde.“", "Sie setzt sich mit einem Textmarker an den Tisch. Rasmus macht Kaffee und schaut ihr skeptisch zu.", "„Erstens“, sagt sie nach ein paar Minuten, „die formalen Voraussetzungen. Der Abrechnungszeitraum war das letzte Kalenderjahr, also Januar bis Dezember. Die Abrechnung muss uns spätestens zwölf Monate nach Ende des Zeitraums zugegangen sein. Das ist der Fall, gerade so. Wäre sie später gekommen, müssten wir in der Regel gar nichts nachzahlen.“", "„Schade eigentlich.“", "„Zweitens: Ist die Abrechnung nachvollziehbar? Gesamtkosten, Verteilerschlüssel, unser Anteil, Abzug der Vorauszahlungen. Das ist alles da. Heizkosten nach Verbrauch, der Rest nach Wohnfläche. Unsere Wohnung hat 98 Quadratmeter, das ganze Haus 1.240. Passt.“", "„Siehst du. Alles korrekt.“", "„Moment. Drittens: Was wird überhaupt abgerechnet?“ Konstanze fährt mit dem Textmarker die Liste entlang. „Grundsteuer, Wasser, Abwasser, Müllabfuhr, Hausreinigung, Gartenpflege, Allgemeinstrom, Schornsteinfeger, Gebäudeversicherung, Hauswart … und hier.“ Sie markiert eine Zeile in Gelb. „Verwaltungskosten: 3.720 Euro.“", "„Und?“", "„Verwaltungskosten sind keine umlagefähigen Betriebskosten. Die darf der Vermieter nicht auf die Mieter abwälzen. Das Honorar für die Hausverwaltung muss er selbst bezahlen. Das steht in der Betriebskostenverordnung.“", "Rasmus beugt sich vor. „Und was macht das bei uns aus?“", "Konstanze tippt in den Taschenrechner. „3.720 geteilt durch 1.240, mal 98 … 294 Euro. Fast ein Drittel der Nachzahlung.“", "„Okay“, sagt Rasmus langsam. „Ich nehme alles zurück.“", "„Und dann ist da noch der Hauswart. 6.800 Euro. Das ist viel für ein Haus mit vierzehn Parteien. Hauswartkosten sind grundsätzlich umlagefähig, aber nur für die laufenden Arbeiten. Wenn der Hauswart auch Reparaturen macht oder Wohnungsübergaben, gehört dieser Teil nicht in die Nebenkosten. Das können wir hier nicht sehen. Dafür brauchen wir die Belege.“", "„Dürfen wir die einfach sehen?“", "„Wir haben ein Recht auf Belegeinsicht. Die Originalrechnungen, die Verträge. Normalerweise im Büro der Verwaltung.“", "Am nächsten Tag schreibt Konstanze einen Brief. Sie lässt Rasmus mitlesen.", "„Sehr geehrte Damen und Herren, wir haben Ihre Betriebskostenabrechnung erhalten und erheben hiermit fristgerecht Einwendungen. Erstens sind die unter Position 12 aufgeführten Verwaltungskosten nicht umlagefähig. Wir bitten um Korrektur. Zweitens bitten wir um Einsicht in die Belege zu den Positionen Hauswart und Gartenpflege, insbesondere in den Hauswartvertrag. Bis zur Klärung behalten wir uns vor, die Nachzahlung zurückzuhalten.“", "„Klingt, als würdest du sie verklagen wollen.“", "„Klingt, als wüsste ich, was ich tue. Das ist ein Unterschied. Und wir überweisen den unstrittigen Teil trotzdem. Damit niemand sagen kann, wir zahlen gar nicht.“", "Zwei Wochen später sitzen sie im Büro von Kessling & Partner in der Innenstadt. Ein freundlicher, etwas nervöser Sachbearbeiter, Herr Lindner-Pohl, legt ihnen zwei Aktenordner hin.", "„Bitte sehr. Sie können alles anschauen. Kopien kosten fünfundzwanzig Cent pro Seite. Fotografieren mit dem Handy ist auch in Ordnung.“", "Konstanze blättert. Nach zwanzig Minuten findet sie den Hauswartvertrag. Unter Paragraf 3 steht: Der Hauswart übernimmt neben der Reinigung und Kontrolle des Gebäudes auch kleinere Reparaturen sowie die Begleitung von Wohnungsübergaben. Vergütung pauschal.", "„Herr Lindner-Pohl, hier steht, dass der Hauswart auch Reparaturen und Wohnungsübergaben macht. Das sind Instandhaltungs- und Verwaltungsaufgaben. Die müssten aus den Kosten herausgerechnet werden. Gibt es eine Aufteilung?“", "Herr Lindner-Pohl schaut auf den Vertrag. Dann auf Konstanze. Dann seufzt er.", "„Nein. Gibt es nicht. Ehrlich gesagt sind Sie die Ersten, die danach fragen.“", "„Wie würden Sie vorschlagen, das zu lösen?“", "„Ich spreche mit dem Eigentümer. In vergleichbaren Fällen hat man sich auf einen pauschalen Abzug geeinigt. Ein Viertel vielleicht. Die Verwaltungskosten nehmen wir auf jeden Fall raus. Das war ein Fehler in unserer Software, der bei der Umstellung passiert ist. Er betrifft übrigens alle Mieter im Haus.“", "Rasmus schaut Konstanze an. „Alle vierzehn Wohnungen?“", "„Alle vierzehn“, bestätigt Herr Lindner-Pohl. „Wir werden allen eine korrigierte Abrechnung schicken.“", "Drei Wochen später kommt die neue Abrechnung. Nachzahlung: 391,40 Euro. Rasmus starrt auf die Zahl.", "„Vierhundertfünfzig Euro weniger. Für eine Stunde mit einem Textmarker.“", "„Und zwei Stunden in einem Büro, das nach Toner roch.“", "Am Abend klingelt es an der Wohnungstür. Davor steht Frau Gesine Albrecht-Wolff aus dem Erdgeschoss, siebenundachtzig Jahre alt, mit einem Teller voll Pflaumenkuchen.", "„Sind Sie die jungen Leute, die das mit den Nebenkosten gemacht haben? Ich habe gerade hundertdreißig Euro zurückbekommen. Das ist meine halbe Monatsrente für Lebensmittel.“", "Konstanze wird rot. Rasmus nimmt den Kuchen.", "„Kommen Sie rein, Frau Albrecht-Wolff. Wir machen Kaffee. Und nächstes Jahr prüfen wir Ihre Abrechnung gleich mit.“"], "gl": [["die Nebenkostenabrechnung / Betriebskostenabrechnung", "utility/service charge statement"], ["die Nachzahlung", "additional payment"], ["fehlerhaft", "faulty / incorrect"], ["der Abrechnungszeitraum", "billing period"], ["zugehen (Brief)", "to be received"], ["nachvollziehbar", "comprehensible / traceable"], ["der Verteilerschlüssel", "allocation formula"], ["die Vorauszahlung", "advance payment"], ["die Grundsteuer", "property tax"], ["der Allgemeinstrom", "electricity for common areas"], ["umlagefähig", "chargeable to tenants"], ["abwälzen", "to pass on (costs)"], ["der Hauswart", "caretaker"], ["die Wohnungsübergabe", "handover of a flat"], ["die Belegeinsicht", "inspection of receipts"], ["Einwendungen erheben", "to raise objections"], ["unstrittig", "undisputed"], ["die Instandhaltung", "maintenance / repair"], ["pauschal", "flat-rate"], ["die Rente", "pension"]], "q": [["Warum will Konstanze nicht sofort zahlen?", "Viele Abrechnungen sind fehlerhaft.", "Man sollte erst prüfen."], ["Welche Frist gilt für die Abrechnung?", "Sie muss innerhalb von zwölf Monaten nach dem Zeitraum kommen.", "Sonst muss man in der Regel nichts nachzahlen."], ["Welcher Posten ist eindeutig falsch?", "Die Verwaltungskosten.", "Sie sind nicht umlagefähig."], ["Was ist das Problem beim Hauswart?", "Er macht auch Reparaturen und Übergaben.", "Dieser Anteil darf nicht umgelegt werden."], ["Warum bringt Frau Albrecht-Wolff Kuchen?", "Sie bekommt auch Geld zurück.", "Der Fehler betraf alle Mieter im Haus."]], "say": ["Niemals einfach überweisen, erst prüfen.", "Ich nehme alles zurück.", "Wir erheben hiermit fristgerecht Einwendungen.", "Wir bitten um Einsicht in die Belege.", "Wie würden Sie vorschlagen, das zu lösen?"]}, {"id": 83, "title": "Die Hausversammlung", "level": "C1", "topic": "Wohneigentum & Mitbestimmung", "rt": "ca. 7 Min.", "teaser": "Die Eigentümerversammlung soll über eine Wärmepumpe entscheiden. Es geht um 380.000 Euro, alte Gewohnheiten und die Frage, wer eigentlich für wen entscheidet. Elena ist zum ersten Mal dabei.", "body": ["Elena Marchetti hat vor einem halben Jahr zusammen mit ihrem Mann eine Dreizimmerwohnung in einem Haus aus den Siebzigern in Augsburg gekauft. Zwölf Wohnungen, zwölf Eigentümer, eine Ölheizung von 1994. Heute Abend findet die jährliche Eigentümerversammlung statt, im Nebenzimmer einer Gaststätte. Ihr Mann ist auf Dienstreise. Er hat ihr eine schriftliche Vollmacht mitgegeben.", "Als sie den Raum betritt, sitzen schon neun Personen an einem langen Tisch. Am Kopfende sitzt Herr Haberkorn von der Hausverwaltung, neben ihm ein Projektor. Vor jedem Platz liegt die Tagesordnung.", "„Frau Marchetti, herzlich willkommen“, sagt Herr Haberkorn. „Unsere neue Eigentümerin. Haben Sie die Vollmacht Ihres Mannes dabei? Dann vertreten Sie beide Anteile.“", "Elena gibt ihm das Blatt und setzt sich neben eine Frau mit grauen Locken, die ihr freundlich zunickt.", "„Hedwig Sander. Dritter Stock. Seit 1981 hier. Sie werden sehen, das hier ist besser als jeder Fernsehkrimi.“", "Die ersten Tagesordnungspunkte gehen schnell: Genehmigung der Jahresabrechnung, Entlastung des Verwaltungsbeirats, Wirtschaftsplan. Hände gehen hoch, Herr Haberkorn protokolliert.", "Dann kommt Punkt sieben: Beschlussfassung über den Austausch der Heizungsanlage.", "Herr Haberkorn wirft eine Folie an die Wand. „Wie Sie wissen, ist unsere Ölheizung über dreißig Jahre alt. Der Schornsteinfeger hat letztes Jahr Mängel festgestellt, und Ersatzteile sind kaum noch zu bekommen. Wir haben drei Angebote eingeholt. Variante A: neue Ölheizung, rund 90.000 Euro. Variante B: Gas-Brennwertheizung, rund 110.000 Euro. Variante C: Luft-Wärmepumpe mit Anpassung der Heizkörper, rund 380.000 Euro, abzüglich staatlicher Förderung von voraussichtlich bis zu fünfzig Prozent.“", "Ein Raunen geht durch den Raum. Ein Mann mit Schnurrbart am anderen Ende des Tisches hebt sofort die Hand.", "„Reinhard Gölz, Erdgeschoss links. Dreihundertachtzigtausend? Das ist Wahnsinn. Ich bin einundachtzig. Bis sich das rechnet, bin ich tot. Ich stimme für Öl. Hat dreißig Jahre funktioniert.“", "Ein junger Mann im Kapuzenpullover meldet sich. „Tilman Rehberg, vierter Stock. Herr Gölz, bei allem Respekt: Wenn wir jetzt eine neue Ölheizung einbauen, zahlen wir in den nächsten Jahren immer höhere CO₂-Kosten. Und eine reine Ölheizung darf ab einem bestimmten Zeitpunkt sowieso nur noch eingeschränkt betrieben werden. Wir würden Geld in eine Sackgasse stecken.“", "„Das sagen Sie. Sie haben ja auch noch vierzig Jahre.“", "„Genau deshalb sage ich es.“", "Die Stimmung wird gereizt. Eine Frau beschwert sich, dass die Unterlagen zu spät gekommen seien. Ein anderer fragt, ob man nicht einfach noch ein Jahr warten könne.", "Elena hat sich vorbereitet. Sie hat das Energiegutachten gelesen, das der Einladung beilag, und mit einem Energieberater telefoniert. Ihr Herz klopft. Dann hebt sie die Hand.", "„Elena Marchetti, zweiter Stock. Darf ich etwas fragen, bevor wir abstimmen?“", "Herr Haberkorn nickt.", "„Herr Gölz, ich verstehe Ihre Sorge völlig. Darf ich fragen, was Sie am meisten beunruhigt: die Gesamtsumme oder der Betrag, den Sie persönlich auf einmal zahlen müssten?“", "Herr Gölz schaut sie überrascht an. „Der Betrag natürlich. Ich habe eine Rente, kein Aktiendepot.“", "„Genau das dachte ich. Wenn ich das Angebot richtig verstehe, würde die Wärmepumpe nach Förderung etwa 190.000 Euro kosten. Unsere Instandhaltungsrücklage liegt bei 85.000. Der Rest wären umgerechnet für Ihre Wohnung etwa 8.000 Euro. Herr Haberkorn, ist es möglich, das über eine Sonderumlage in Raten zu verteilen? Oder über einen Kredit der Gemeinschaft?“", "Herr Haberkorn blättert. „Beides ist rechtlich möglich. Eine Ratenzahlung über drei Jahre könnten wir beschließen. Auch einen KfW-Kredit für die Gemeinschaft haben andere Häuser schon aufgenommen.“", "„Und die laufenden Kosten?“, fragt Elena weiter. „Laut Gutachten sinken die Heizkosten mit der Wärmepumpe um etwa ein Drittel, wenn die Heizkörper angepasst werden. Herr Gölz, wie viel zahlen Sie im Moment im Jahr für Heizung?“", "„Um die zweitausend.“", "„Dann wären es mit der Wärmepumpe vielleicht dreizehnhundert. Siebenhundert Euro weniger pro Jahr. Das ist fast so viel wie eine Rate.“", "Herr Gölz lehnt sich zurück. Er sagt nichts. Hedwig Sander flüstert: „Sehr gut. Den hat seit zwanzig Jahren keiner zum Schweigen gebracht.“", "Herr Haberkorn räuspert sich. „Ich schlage vor, dass wir heute nicht über die Variante abstimmen, sondern einen Grundsatzbeschluss fassen: Wir planen einen Umstieg auf erneuerbare Wärme, prüfen eine Finanzierung mit Ratenzahlung und Förderung und beauftragen den Energieberater mit einer Detailplanung. Die endgültige Entscheidung treffen wir in einer außerordentlichen Versammlung in drei Monaten.“", "„Und die alte Heizung?“, fragt jemand.", "„Die wird so lange gewartet, dass sie bis dahin durchhält.“", "Die Abstimmung: zehn Ja, eine Enthaltung, eine Nein-Stimme. Die Nein-Stimme ist nicht Herr Gölz. Er hat sich enthalten.", "Nach der Versammlung, schon an der Garderobe, kommt er zu Elena.", "„Frau Marchetti. Sie haben mich nicht überzeugt. Aber Sie haben mir als Einzige zugehört. Dafür danke ich Ihnen.“", "„Mehr wollte ich gar nicht.“", "„Wenn diese Raten kommen“, sagt er und zieht den Mantel an, „dann hoffe ich, Sie haben recht mit den siebenhundert Euro.“", "„Ich hoffe es auch. Und wenn nicht, lade ich Sie zum Essen ein.“", "Herr Gölz lacht zum ersten Mal an diesem Abend. „Abgemacht. Aber zum Italiener. Ich mag Ihren Namen.“", "Auf dem Heimweg ruft Elena ihren Mann an. „Wir haben eine Wärmepumpe. Fast. Und ich habe einen neuen Freund im Erdgeschoss.“"], "gl": [["die Eigentümerversammlung", "owners' meeting"], ["die Vollmacht", "power of attorney / proxy"], ["die Tagesordnung", "agenda"], ["die Entlastung", "discharge (from liability)"], ["der Verwaltungsbeirat", "advisory board (of owners)"], ["der Wirtschaftsplan", "budget plan"], ["die Beschlussfassung", "passing of a resolution"], ["der Mangel", "defect"], ["die Brennwertheizung", "condensing boiler"], ["die Wärmepumpe", "heat pump"], ["die Förderung", "subsidy"], ["sich rechnen", "to pay off"], ["die Sackgasse", "dead end"], ["gereizt", "irritable / tense"], ["das Energiegutachten", "energy report"], ["die Instandhaltungsrücklage", "maintenance reserve"], ["die Sonderumlage", "special levy"], ["der Grundsatzbeschluss", "resolution in principle"], ["außerordentlich", "extraordinary"], ["die Enthaltung / sich enthalten", "abstention / to abstain"]], "q": [["Warum muss die Heizung ersetzt werden?", "Sie ist über 30 Jahre alt und hat Mängel.", "Ersatzteile gibt es kaum noch."], ["Was ist Tilmans Hauptargument gegen Öl?", "Steigende CO₂-Kosten und Einschränkungen.", "Eine neue Ölheizung wäre eine Sackgasse."], ["Welche Frage stellt Elena Herrn Gölz?", "Ob ihn die Gesamtsumme oder sein persönlicher Betrag stört.", "So findet sie seine eigentliche Sorge."], ["Welche Lösung bringt Elena ins Spiel?", "Ratenzahlung oder Kredit der Gemeinschaft.", "Und Einsparungen bei den Heizkosten."], ["Wie endet die Abstimmung?", "Mit einem Grundsatzbeschluss.", "Herr Gölz enthält sich und dankt Elena fürs Zuhören."]], "say": ["Darf ich etwas fragen, bevor wir abstimmen?", "Ich verstehe Ihre Sorge völlig.", "Was beunruhigt Sie am meisten?", "Wenn ich das Angebot richtig verstehe, …", "Sie haben mir als Einzige zugehört."]}, {"id": 84, "title": "Die Reha", "level": "C1", "topic": "Gesundheit & Rückkehr in den Beruf", "rt": "ca. 7 Min.", "teaser": "Nach einem Bandscheibenvorfall verbringt Viktor drei Wochen in einer Rehaklinik im Allgäu. Er hält das für Zeitverschwendung – bis er merkt, dass es um mehr geht als um seinen Rücken.", "body": ["Viktor Petrenko ist zweiundfünfzig, Lagerleiter bei einer Spedition in Ulm und hat in seinem Leben noch nie länger als eine Woche gefehlt. Dann kam der Morgen im Februar, an dem er sich nach einem heruntergefallenen Kugelschreiber bückte und nicht mehr aufstehen konnte. Bandscheibenvorfall. Operation. Und jetzt, sechs Wochen später, sitzt er mit einem Koffer in der Eingangshalle einer Rehaklinik bei Oberstdorf.", "„Drei Wochen“, sagt er zu seiner Frau am Telefon. „Drei Wochen Urlaub auf Kosten der Rentenversicherung. Und im Lager bricht alles zusammen.“", "„Das ist kein Urlaub, Viktor. Das ist eine Anschlussheilbehandlung. Die Ärztin hat gesagt, ohne Reha riskierst du den nächsten Vorfall.“", "„Ich weiß. Ich weiß.“", "Am ersten Tag gibt es ein Aufnahmegespräch mit der Stationsärztin, Dr. Felicitas Brandauer. Sie liest seinen Bericht, tastet seinen Rücken ab und lässt ihn ein paar Bewegungen machen.", "„Herr Petrenko, was erhoffen Sie sich von den nächsten drei Wochen?“", "„Dass ich schnell wieder arbeiten kann.“", "„Das ist ein gutes Ziel. Aber was heißt ‚arbeiten‘ für Sie konkret? Wie sieht ein normaler Arbeitstag aus?“", "„Zehn Stunden. Meistens elf. Viel stehen, viel laufen, manchmal selbst mit anpacken, wenn ein Mitarbeiter fehlt. Und viel Telefon.“", "„Mit anpacken heißt?“", "„Paletten umsetzen. Kartons heben. Wenn es schnell gehen muss.“", "Dr. Brandauer macht sich eine Notiz und schaut ihn über ihre Brille an. „Dann haben wir ein zweites Ziel. Nicht nur, dass Sie wieder arbeiten können. Sondern dass Sie so arbeiten, dass Sie nicht in zwei Jahren wieder hier sitzen.“", "Der Therapieplan ist dicht. Morgens Rückengymnastik in der Gruppe, danach Bewegungsbad, mittags Ergotherapie, nachmittags Gerätetraining und zweimal pro Woche ein Vortrag über Schmerz und Stress. Viktor findet die Vorträge überflüssig.", "„Ich bin doch nicht gestresst“, sagt er am dritten Tag beim Mittagessen zu seinem Tischnachbarn Arvid, einem Lehrer aus Kempten, der nach einer Hüftoperation hier ist.", "„Wie oft hast du heute schon aufs Handy geschaut?“, fragt Arvid.", "Viktor zögert. „Ein paar Mal. Das Lager.“", "„Ich habe mitgezählt. Neunzehnmal. Während des Frühstücks und der Gymnastik.“", "„Du hast mitgezählt?“", "„Ich bin Mathelehrer. Ich zähle immer.“", "In der Ergotherapie lernt Viktor, wie man richtig hebt: aus den Beinen, nah am Körper, ohne Drehung. Die Therapeutin, Frau Okafor-Lind, lässt ihn einen Karton mit Sand dreimal heben und filmt ihn dabei mit dem Tablet.", "„Schauen Sie mal.“", "Auf dem Video sieht Viktor sich selbst: Rücken rund, Knie fast gestreckt, beim Abstellen eine schnelle Drehung zur Seite.", "„So habe ich das dreißig Jahre gemacht.“", "„Und Ihr Rücken hat es dreißig Jahre ausgehalten. Er ist ein guter Rücken. Aber er möchte jetzt anders behandelt werden.“", "In der zweiten Woche hat Viktor ein Gespräch mit dem Sozialdienst der Klinik. Herr Löwenthal, ein ruhiger Mann mit Strickjacke, erklärt ihm die Möglichkeiten für die Rückkehr in den Beruf.", "„Viele Patienten denken, nach der Reha geht es am Montag wieder mit vollen Stunden los. Das ist oft keine gute Idee. Es gibt die stufenweise Wiedereingliederung, das sogenannte Hamburger Modell. Sie fangen mit wenigen Stunden pro Tag an und steigern langsam. In dieser Zeit sind Sie weiter krankgeschrieben und bekommen Übergangsgeld oder Krankengeld, nicht Ihr volles Gehalt.“", "„Vier Stunden am Tag? Das wird mein Chef nicht mitmachen.“", "„Ihr Arbeitgeber muss zustimmen, das stimmt. Aber die meisten tun es. Ein Mitarbeiter, der langsam zurückkommt, ist besser als einer, der nach drei Monaten wieder ausfällt. Wir empfehlen das im Entlassungsbericht. Und es gibt noch etwas: Ihr Arbeitgeber ist verpflichtet, Ihnen ein betriebliches Eingliederungsmanagement anzubieten, weil Sie länger als sechs Wochen ausgefallen sind. Da kann man besprechen, was sich am Arbeitsplatz ändern muss.“", "„Zum Beispiel?“", "„Zum Beispiel, dass der Lagerleiter keine Paletten mehr umsetzt.“", "Viktor lacht. Dann wird er ernst. „Und wenn ich ehrlich bin, ist das das eigentliche Problem. Ich kann nicht Nein sagen. Wenn jemand fehlt, springe ich ein. Wenn es brennt, bin ich da. Ich dachte immer, das macht einen guten Chef aus.“", "Herr Löwenthal nickt. „Ein guter Chef sorgt dafür, dass es nicht ständig brennt. Und dass das Lager auch funktioniert, wenn er drei Wochen in Oberstdorf ist.“", "Am Abend ruft Viktor seinen Stellvertreter an. Zum ersten Mal fragt er nicht, ob alles läuft. Er fragt, wie es Severin selbst geht.", "„Ehrlich?“, sagt Severin. „Es ist anstrengend. Aber es geht. Wir haben ein paar Sachen anders gemacht. Die Schichtplanung zum Beispiel. Ich wollte dir das eigentlich nicht erzählen, weil du es immer so machst, wie du es machst.“", "„Erzähl es mir. Ich will es wissen.“", "In der dritten Woche schafft Viktor beim Gerätetraining doppelt so viel Gewicht wie am Anfang. Beim Abschlussgespräch sagt Dr. Brandauer: „Ihr Rücken ist auf einem guten Weg. Wie sieht es mit dem Rest aus?“", "„Ich habe einen Plan“, sagt Viktor. „Hamburger Modell, sechs Wochen. Ein Gespräch mit meinem Chef über Eingliederungsmanagement. Severin bekommt mehr Verantwortung. Und ich lege das Handy beim Frühstück weg.“", "„Wer hat Ihnen das mit dem Handy beigebracht?“", "„Ein Mathelehrer aus Kempten.“", "Am letzten Tag tauscht er mit Arvid die Telefonnummern.", "„Melde dich in einem halben Jahr“, sagt Arvid. „Dann sagst du mir, wie oft du noch aufs Handy schaust.“", "„Du wirst mitzählen, oder?“", "„Ich zähle immer.“"], "gl": [["die Reha(bilitation)", "rehabilitation"], ["der Bandscheibenvorfall", "slipped disc"], ["sich bücken", "to bend down"], ["die Rentenversicherung", "pension insurance (funds rehab)"], ["die Anschlussheilbehandlung", "follow-up rehab after hospital"], ["das Aufnahmegespräch", "admission interview"], ["abtasten", "to palpate / feel"], ["mit anpacken", "to lend a hand"], ["die Ergotherapie", "occupational therapy"], ["das Bewegungsbad", "hydrotherapy pool"], ["überflüssig", "unnecessary"], ["gestreckt", "straight / extended"], ["der Sozialdienst", "social services department"], ["die stufenweise Wiedereingliederung", "gradual return to work"], ["das Übergangsgeld", "transitional allowance"], ["ausfallen", "to be absent / out"], ["das betriebliche Eingliederungsmanagement", "workplace reintegration management"], ["einspringen", "to step in"], ["der Stellvertreter", "deputy"], ["der Entlassungsbericht", "discharge report"]], "q": [["Warum hält Viktor die Reha zuerst für unnötig?", "Er denkt, das Lager bricht ohne ihn zusammen.", "Er nennt es „Urlaub“."], ["Was zeigt Arvids Zählen?", "Viktor ist gestresster, als er glaubt.", "Er schaut neunzehnmal aufs Handy."], ["Was lernt Viktor durch das Video?", "Er hebt seit Jahren falsch.", "Rund, mit gestreckten Knien und Drehung."], ["Was ist das Hamburger Modell?", "Eine stufenweise Rückkehr mit wenigen Stunden.", "Der Arbeitgeber muss zustimmen."], ["Was ist Viktors eigentliches Problem?", "Er kann nicht Nein sagen und springt überall ein.", "Ein guter Chef sorgt dafür, dass es nicht ständig brennt."]], "say": ["Was erhoffen Sie sich von den nächsten Wochen?", "So habe ich das dreißig Jahre gemacht.", "Das wird mein Chef nicht mitmachen.", "Erzähl es mir, ich will es wissen.", "Ich habe einen Plan."]}, {"id": 85, "title": "Der Familienstreit an Weihnachten", "level": "C1", "topic": "Familie & Generationen", "rt": "ca. 7 Min.", "teaser": "Gänsebraten, Kerzen, drei Generationen – und eine Bemerkung über das Erbe des Hauses, die alles kippen lässt. Liv versucht, den Heiligabend zu retten, bevor er endgültig eskaliert.", "body": ["Heiligabend, 19:30 Uhr, im Haus der Familie Strasser in einem Dorf bei Passau. Der Gänsebraten ist im Ofen, der Baum leuchtet, und im Wohnzimmer sitzen drei Generationen: Oma Ilse, achtundachtzig, im Sessel am Fenster. Ihr Sohn Jörg und seine Frau Beate. Jörgs jüngere Schwester Corinna, extra aus Berlin angereist. Und Liv, Jörgs Tochter, dreiundzwanzig, die in Wien studiert und sich vorgenommen hat, diesmal einfach nur einen friedlichen Abend zu erleben.", "Bis zum Nachtisch läuft es gut. Dann sagt Oma Ilse, während sie ihren Kaffee umrührt:", "„Ich habe übrigens im Herbst mit dem Notar gesprochen. Wegen des Hauses.“", "Es wird schlagartig still.", "„Mama“, sagt Jörg vorsichtig, „müssen wir das heute besprechen?“", "„Wann denn sonst? Ihr seid ja nur an Weihnachten alle zusammen. Ich möchte, dass das Haus an Jörg geht. Er wohnt im Dorf, er kümmert sich um alles. Corinna bekommt dafür einen Ausgleich, wenn es soweit ist.“", "Corinna stellt ihre Tasse ab. Etwas zu laut. „Einen Ausgleich. Interessant. Und wie hoch soll der sein? Und wer bestimmt den Wert des Hauses? Jörg?“", "„Corinna, das ist nicht fair“, sagt Beate.", "„Nicht fair? Ich habe dreißig Jahre gehört, dass ich in die Großstadt gezogen bin und die Familie im Stich gelassen habe. Und jetzt soll ich mich mit einem ‚Ausgleich‘ zufriedengeben, während Jörg das Elternhaus bekommt?“", "„Ich habe mich zwanzig Jahre um Mama gekümmert!“, sagt Jörg, und seine Stimme wird lauter. „Wer hat das Dach repariert? Wer fährt sie jeden Dienstag zum Arzt? Wer war da, als sie gestürzt ist? Du hast angerufen. Einmal im Monat.“", "„Weil ich in Berlin arbeite! Weil ich mir einen Beruf aufgebaut habe, den es hier nicht gibt!“", "„Das war deine Entscheidung.“", "„Und das Haus ist deine Belohnung dafür, dass du nie weggegangen bist?“", "Oma Ilse schaut auf ihre Hände. Liv sieht, dass sie zittern.", "Liv steht auf. Ihr Herz klopft. Sie hat in ihrem Psychologiestudium viel über Konfliktgespräche gelesen. Aber das hier ist ihre Familie, kein Fallbeispiel.", "„Darf ich etwas sagen?“", "Alle schauen sie an.", "„Ich glaube, hier reden gerade zwei Menschen über zwei verschiedene Dinge. Papa, du redest davon, dass du dich nicht gesehen fühlst. Für all die Dienstage und das Dach. Tante Corinna, du redest davon, dass du dich nicht gesehen fühlst. Dafür, dass du gegangen bist und trotzdem dazugehörst. Und über das Haus redet eigentlich keiner.“", "Stille. Jörg öffnet den Mund, schließt ihn wieder.", "Corinna schaut auf den Tisch. „Das ist … nicht ganz falsch.“", "„Und Oma“, sagt Liv sanfter und kniet sich neben den Sessel. „Ich glaube, du wolltest heute etwas regeln, damit es später keinen Streit gibt. Stimmt's?“", "Oma Ilse nickt langsam. Ihre Augen sind feucht. „Ich habe gesehen, wie es bei meinen Geschwistern war. Nach dem Tod unserer Eltern haben sie zehn Jahre nicht mehr miteinander geredet. Wegen eines Ackers. Ich wollte, dass das bei euch nicht passiert.“", "„Und jetzt passiert es gerade an Heiligabend“, sagt Corinna leise. „Entschuldige, Mama.“", "Jörg setzt sich wieder. Er reibt sich das Gesicht. „Corinna. Ich wusste nicht, dass du dir das all die Jahre anhören musstest. Das mit dem ‚im Stich lassen‘. Das kam nicht von mir.“", "„Aber du hast auch nie widersprochen.“", "„Nein. Hab ich nicht. Das tut mir leid.“", "Beate steht auf. „Ich mache neuen Kaffee. Und Liv, du setzt dich wieder hin. Du hast heute genug gearbeitet.“", "Als der Kaffee kommt, ist die Stimmung nicht gut, aber anders. Leiser. Corinna fragt Oma, was genau sie beim Notar besprochen hat. Oma erklärt es: Sie möchte das Haus noch zu Lebzeiten an Jörg übertragen, mit einem lebenslangen Wohnrecht für sich selbst. Corinna soll einen Betrag bekommen, den ein unabhängiger Gutachter bestimmt.", "„Ein unabhängiger Gutachter“, wiederholt Corinna. „Das wusste ich nicht. Das ist etwas anderes.“", "„Du hast mich ja nicht ausreden lassen“, sagt Oma Ilse, und zum ersten Mal an diesem Abend klingt sie ein bisschen streng. Und ein bisschen amüsiert.", "„Ich schlage etwas vor“, sagt Jörg. „Wir machen das nicht heute. Wir machen im Januar einen Termin beim Notar, alle zusammen. Corinna kommt, und wenn sie will, bringt sie einen eigenen Berater mit. Und alles wird schwarz auf weiß festgehalten.“", "„Einverstanden“, sagt Corinna. „Und noch etwas. Ich möchte mehr da sein. Nicht wegen des Hauses. Wegen Mama. Vielleicht kann ich jeden zweiten Monat ein Wochenende kommen. Dann musst du nicht alle Dienstage allein machen.“", "Jörg schaut seine Schwester lange an. „Das wäre schön. Wirklich.“", "Gegen elf Uhr gehen alle zusammen zur Christmette in die Dorfkirche. Es schneit leicht. Liv geht neben Oma Ilse und hält sie am Arm.", "„Danke, Kind“, flüstert Oma. „Wo hast du das gelernt?“", "„Im Studium. Aber ehrlich gesagt war es das erste Mal, dass ich es wirklich ausprobiert habe.“", "„Bei uns nennt man das nicht Psychologie“, sagt Oma. „Bei uns nennt man das: Weihnachten gerettet.“", "Vor ihnen gehen Jörg und Corinna. Sie reden nicht viel. Aber an der Kirchentür hält Jörg seiner Schwester die Tür auf, und sie legt ihm im Vorbeigehen kurz die Hand auf die Schulter."], "gl": [["der Heiligabend", "Christmas Eve"], ["der Gänsebraten", "roast goose"], ["sich etwas vornehmen", "to resolve to do sth"], ["schlagartig", "suddenly"], ["der Notar", "notary"], ["der Ausgleich", "compensation / settlement"], ["im Stich lassen", "to leave in the lurch"], ["sich zufriedengeben mit", "to settle for"], ["die Belohnung", "reward"], ["das Fallbeispiel", "case study"], ["dazugehören", "to belong"], ["etwas regeln", "to settle / arrange sth"], ["der Acker", "field"], ["widersprechen", "to contradict"], ["zu Lebzeiten", "during one's lifetime"], ["übertragen", "to transfer"], ["das Wohnrecht", "right of residence"], ["der Gutachter", "appraiser / assessor"], ["ausreden lassen", "to let someone finish"], ["die Christmette", "Christmas Eve mass"]], "q": [["Was löst den Streit aus?", "Omas Plan, das Haus an Jörg zu geben.", "Corinna soll einen Ausgleich bekommen."], ["Worum geht es Jörg und Corinna eigentlich?", "Beide fühlen sich nicht gesehen.", "Liv formuliert das für beide."], ["Warum wollte Oma die Sache regeln?", "Ihre Geschwister haben sich wegen eines Erbes zerstritten.", "Das wollte sie verhindern."], ["Was ändert sich durch den Gutachter?", "Corinna fühlt sich fairer behandelt.", "Ein unabhängiger Experte bestimmt den Wert."], ["Welche Lösung finden sie?", "Ein gemeinsamer Notartermin im Januar.", "Und Corinna will öfter kommen."]], "say": ["Müssen wir das heute besprechen?", "Darf ich etwas sagen?", "Ich glaube, hier reden zwei Menschen über zwei verschiedene Dinge.", "Du hast mich ja nicht ausreden lassen.", "Das wäre schön, wirklich."]}, {"id": 86, "title": "Die Patchwork-Familie", "level": "C1", "topic": "Familie & Zusammenleben", "rt": "ca. 7 Min.", "teaser": "Imke und Raphael ziehen zusammen – mit ihrer Tochter Smilla, seinem Sohn Mats und einem Wochenplan, der an der Kühlschranktür hängt. Nach drei Wochen kracht es. Nicht zwischen den Erwachsenen.", "body": ["Der Wochenplan hängt an der Kühlschranktür, laminiert, in vier Farben. Grün für Smilla, Imkes Tochter, vierzehn. Blau für Mats, Raphaels Sohn, neun. Gelb für die Wochenenden, an denen Mats bei seiner Mutter in Darmstadt ist. Rot für die Tage, an denen Smilla bei ihrem Vater Thorsten übernachtet. Raphael hat ihn am ersten Abend in der neuen Wohnung in Mainz aufgehängt und gesagt: „So. Jetzt kann nichts mehr schiefgehen.“", "Drei Wochen später, an einem Sonntagabend, geht etwas schief.", "„Er war in meinem Zimmer!“ Smilla steht im Flur, das Gesicht rot vor Wut, in der Hand ein Notizbuch mit zerrissenem Einband. „Er hat mein Tagebuch gelesen! Und dann hat er es kaputt gemacht!“", "Mats steht in der Tür zum Wohnzimmer und starrt auf den Boden. „Ich hab's nicht gelesen. Ich wollte nur den Stift. Und dann ist
