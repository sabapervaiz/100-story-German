e Woche gefragt, ob du zur Fasnet kommst.“", "Aiko schaut auf die Brezel in ihrer Hand. „Herr Kessler? Der ruhige Herr Kessler, der in Meetings nie lacht?“", "„An Fasnet sind die ruhigsten Menschen die wildesten Narren. Das ganze Jahr sind sie ordentlich und pünktlich. Und ein paar Tage im Jahr dürfen sie alles auf den Kopf stellen.“", "Der Narrensprung dauert fast zwei Stunden. Danach gehen Franziska und Aiko in eine Wirtschaft. Drinnen ist es warm und laut. An den Tischen sitzen Narren, die ihre Masken hochgeschoben haben und Kaffee mit Schnaps trinken. Ohne Masken sehen sie aus wie ganz normale Leute: Rentner, junge Frauen, Familienväter.", "„Darf ich hier ein Foto machen?“, fragt Aiko leise.", "„Klar. Aber nur von Narren mit Maske. Ohne Maske sind sie Privatleute.“", "„Warum feiert man das eigentlich?“, fragt Aiko.", "„Ursprünglich vor der Fastenzeit. Ab Aschermittwoch durfte man vierzig Tage kein Fleisch essen und nicht feiern. Also hat man vorher noch einmal richtig gefeiert. Und es heißt auch, die Narren vertreiben den Winter.“", "„Mit Glocken?“", "„Mit Glocken. Würdest du bleiben, wenn so ein Lärm vor deiner Tür wäre?“", "Am Aschermittwoch sitzt Aiko wieder im Büro in Villingen. Um neun Uhr kommt Herr Kessler herein, im grauen Anzug, ordentlich gekämmt, mit seiner Kaffeetasse in der Hand. Er nickt ihr zu.", "„Guten Morgen, Frau Tanabe. Hatten Sie ein schönes Wochenende?“", "„Sehr schön, danke. Ich war in Rottweil. Beim Narrensprung.“", "„So? Und wie hat es Ihnen gefallen?“", "„Sehr gut. Ein Narr hat mir eine Brezel geschenkt. Er wusste, wo ich arbeite.“", "Herr Kessler verzieht keine Miene. „Interessant. Die Narren wissen eben alles.“ Er dreht sich um und geht zu seinem Schreibtisch.", "Aber als er sich setzt, sieht Aiko etwas. An seinem Handgelenk, halb unter dem Hemdsärmel, ist noch ein kleiner Rest bunter Schminke.", "Sie sagt nichts. Sie lächelt nur. Und im nächsten Jahr, das weiß sie schon jetzt, wird sie wieder um sieben in der Kälte stehen."], "gl": [["die Fasnet (schwäb.-alem.)", "Swabian-Alemannic carnival"], ["der Rosenmontag", "Shrove Monday"], ["der Umzug", "parade"], ["die Kamelle (rhein.)", "sweets thrown at carnival"], ["geheimnisvoll", "mysterious(ly)"], ["die Gestalt", "figure"], ["geschnitzt", "carved"], ["scheppern", "to clatter / jangle"], ["der Narrensprung", "Rottweil fool's parade"], ["der Narr", "fool / jester (carnival figure)"], ["die Larve", "(wooden carnival) mask"], ["vererben", "to pass down / bequeath"], ["mit verstellter Stimme", "in a disguised voice"], ["erstarren", "to freeze"], ["kichern", "to giggle"], ["das Aufsagen", "teasing recitation by fools"], ["auf den Kopf stellen", "to turn upside down"], ["die Fastenzeit", "Lent"], ["vertreiben", "to drive away"], ["keine Miene verziehen", "to keep a straight face"]], "q": [["Wie unterscheidet sich die Fasnet vom Kölner Karneval?", "Keine Kamelle, keine Schlager, sondern Holzmasken und Glocken.", "Und es beginnt sehr früh am Morgen."], ["Was sind Larven?", "Handgeschnitzte Holzmasken.", "Sie werden in Familien weitervererbt."], ["Was ist das Aufsagen?", "Narren erzählen Leuten, was sie über sie wissen.", "Es ist nicht böse gemeint."], ["Warum feiert man die Fasnet?", "Vor der Fastenzeit und um den Winter zu vertreiben.", "Ab Aschermittwoch wurde früher gefastet."], ["Woran erkennt Aiko, wer der Narr war?", "An bunter Schminke an Herrn Kesslers Handgelenk.", "Er verrät natürlich nichts."]], "say": ["Woher wissen Sie das?", "Das ist nicht böse gemeint.", "Niemand soll wissen, wer drunter steckt.", "Wie hat es Ihnen gefallen?", "Die Narren wissen eben alles."]}, {"id": 64, "title": "Das Cannstatter Wasen", "level": "B2", "topic": "Feste & Freizeit", "rt": "ca. 6 Min.", "teaser": "Das Team geht zum Volksfest. Ravi trinkt keinen Alkohol, Torben hat zu viel Dirndl-Begeisterung, und im Festzelt gelten Regeln, die niemand erklärt hat.", "body": ["„Teamevent auf dem Wasen! Freitag, 17 Uhr, Festzelt Göckelesmaier. Tracht erwünscht, aber nicht Pflicht!“", "So steht es in der Einladung, die Ravi Subramanian an einem Montag im September im Postfach findet. Ravi arbeitet seit einem halben Jahr als Softwaretester bei einer Versicherung in Stuttgart. Er weiß, dass das Cannstatter Volksfest so etwas wie das Oktoberfest der Schwaben ist. Mehr weiß er nicht.", "In der Kaffeeküche fragt er seinen Kollegen Benno.", "„Muss ich wirklich Lederhosen tragen?“", "„Musst du nicht. Aber du wirst der Einzige ohne sein. Außer Frau Pfister aus der Buchhaltung, die kommt immer im Hosenanzug.“", "„Und ich trinke keinen Alkohol. Ist das ein Problem?“", "„Im Festzelt?“ Benno überlegt. „Es wird ein paar Leute geben, die es komisch finden. Aber das ist deren Problem, nicht deins. Bestell einfach eine Maß Spezi. Die sieht genauso aus wie Bier, nur dunkler.“", "„Eine Maß?“", "„Ein Liter. Im Glaskrug. Der wiegt mit Inhalt über zwei Kilo. Trainier schon mal den Arm.“", "Am Freitag leiht Ravi sich eine Lederhose von Bennos Bruder. Sie ist ein bisschen zu kurz, und das Hemd mit den kleinen rot-weißen Karos fühlt sich an wie ein Kostüm. Aber als er aus der Stadtbahn am Wasen steigt, merkt er: Hier sieht jeder so aus. Tausende Menschen in Dirndl und Lederhosen strömen über die Brücke, zwischen Achterbahnen, Riesenrad und Ständen mit gebrannten Mandeln.", "Das Festzelt ist riesig. Lange Holztische, eine Blaskapelle auf einer Bühne, und es riecht nach Hähnchen und Bier. Das Team sitzt schon. Torben aus dem Vertrieb trägt ein Hemd mit Hirschen darauf und einen Hut mit einer Feder.", "„Ravi! Wie siehst du denn aus? Super! Ein echter Schwabe!“", "„Ich fühle mich wie verkleidet.“", "„Das sind wir alle. Setz dich! Wir haben schon bestellt.“", "Eine Bedienung im Dirndl kommt mit zehn Maßkrügen gleichzeitig. Sie trägt fünf in jeder Hand. Ravi schaut fasziniert zu.", "„Wie macht sie das?“", "„Jahrelanges Training“, sagt Benno. „Die ist stärker als wir alle zusammen.“", "„Ich könnte nicht mal zwei tragen“, sagt Ravi.", "„Musst du auch nicht. Du musst nur eine heben. Und die wird leichter, je länger der Abend dauert.“", "Die Bedienung stellt die Krüge ab. „So, wer hatte die Spezi?“", "„Ich“, sagt Ravi.", "Torben dreht sich um. „Spezi? Auf dem Wasen? Komm schon, Ravi, eine Maß wirst du doch schaffen! Nur eine!“", "„Nein, danke. Ich trinke keinen Alkohol.“", "„Aus religiösen Gründen?“", "„Aus persönlichen Gründen.“", "„Ach komm, nur ein Schluck! Zum Anstoßen!“", "Bevor Ravi antworten kann, mischt sich Frau Pfister ein. Sie sitzt tatsächlich im Hosenanzug am Tischende, mit einem Glas Wasser.", "„Torben. Er hat zweimal Nein gesagt. Beim dritten Mal wird es peinlich. Für dich.“", "Torben hebt die Hände. „Okay, okay. War nicht so gemeint. Sorry, Ravi.“", "„Kein Problem“, sagt Ravi und nickt Frau Pfister dankbar zu.", "Die Kapelle spielt einen Tusch, und plötzlich stehen alle im Zelt auf und singen: „Ein Prosit, ein Prosit der Gemütlichkeit!“ Ravi steht auch auf, ohne den Text zu kennen. Alle stoßen an. Er stößt mit seiner Spezi an.", "„Wichtig“, flüstert Benno. „Beim Anstoßen in die Augen schauen. Sonst sieben Jahre schlechter Sex. Sagt man.“", "„Das sagt man?“", "„Ich kenne Leute, die nehmen das sehr ernst“, sagt Frau Pfister trocken. „Schauen Sie mir lieber in die Augen, Herr Subramanian.“", "„Das sagt man. Ich übernehme keine Verantwortung.“", "Nach einer Stunde stehen die ersten Leute auf den Bänken und tanzen. Ravi bleibt sitzen.", "„Darf man auf den Bänken stehen?“, fragt er.", "„Auf den Bänken ja. Auf den Tischen nein. Wer auf dem Tisch tanzt, fliegt raus. Da sind die Ordner streng.“", "„Und wenn ich nicht tanzen will?“", "„Dann klatschst du im Takt. Das reicht völlig. Keiner schaut so genau hin.“", "Gegen acht wird Torben sehr laut. Er hat drei Maß getrunken und versucht, einen Jodler zu singen. Danach wird er sehr still und sehr blass.", "„Ich glaube, ich brauche frische Luft“, sagt er.", "Ravi steht auf. „Ich gehe mit.“", "Draußen setzt sich Torben auf eine Bank neben dem Riesenrad. Ravi holt ihm eine Flasche Wasser und eine große Brezel.", "„Iss das. Und trink das. Langsam.“", "Torben nickt dankbar und beißt in die Brezel. Nach zehn Minuten hat er wieder Farbe im Gesicht.", "„Ravi, das war echt dumm von mir vorhin. Mit dem Bier. Und jetzt bist du der Einzige, der sich um mich kümmert.“", "„Weil ich der Einzige bin, der noch geradeaus laufen kann.“", "Torben lacht, dann hält er sich den Kopf. „Aua. Nicht lachen.“", "„Willst du nach Hause?“", "„Ja. Aber vorher …“ Er zeigt auf das Riesenrad. „Fährst du mit? Ich war seit zwanzig Jahren nicht mehr drauf.“", "„Bist du sicher? In deinem Zustand?“", "„Es fährt langsam. Und von oben sieht man ganz Stuttgart.“", "Sie fahren. Von oben sieht man tatsächlich alles: die Lichter der Zelte, den Neckar, den Fernsehturm in der Ferne. Torben ist still und schaut hinunter.", "„Weißt du was“, sagt er. „Nächstes Jahr trinke ich auch Spezi. Zumindest die erste Maß.“", "Am Montag liegt auf Ravis Schreibtisch ein kleines Lebkuchenherz. Darauf steht in Zuckerschrift: „Bester Kollege.“ Daneben ein Zettel: „Danke für die Brezel. T.“"], "gl": [["der Wasen", "Stuttgart fairground (Cannstatter Volksfest)"], ["das Festzelt", "beer tent"], ["die Tracht", "traditional costume"], ["erwünscht", "desired / welcome"], ["die Lederhose", "leather trousers"], ["die Maß", "litre (of beer)"], ["der Krug", "tankard / jug"], ["das Spezi", "cola-orange soft drink"], ["kariert / das Karo", "checked / check"], ["strömen", "to stream / pour"], ["die Achterbahn", "rollercoaster"], ["das Riesenrad", "Ferris wheel"], ["die Blaskapelle", "brass band"], ["die Bedienung", "waiter / waitress"], ["anstoßen", "to clink glasses"], ["sich einmischen", "to intervene"], ["der Tusch", "fanfare"], ["die Gemütlichkeit", "cosiness, conviviality"], ["der Ordner", "steward"], ["der Zustand", "state / condition"]], "q": [["Was ist eine Maß?", "Ein Liter in einem Glaskrug.", "Mit Inhalt über zwei Kilo."], ["Warum bestellt Ravi Spezi?", "Er trinkt keinen Alkohol.", "Aus persönlichen Gründen."], ["Wie hilft Frau Pfister?", "Sie sagt Torben, er soll ein Nein akzeptieren.", "Nach dem dritten Mal werde es peinlich."], ["Was darf man im Festzelt, was nicht?", "Auf Bänken stehen ja, auf Tischen tanzen nein.", "Die Ordner sind streng."], ["Wie kümmert sich Ravi um Torben?", "Er bringt Wasser und eine Brezel.", "Und er bleibt bei ihm."]], "say": ["Muss ich wirklich Lederhosen tragen?", "Nein, danke. Ich trinke keinen Alkohol.", "Er hat zweimal Nein gesagt.", "Ich brauche frische Luft.", "Iss das und trink das, langsam."]}, {"id": 65, "title": "Silvester mit Hindernissen", "level": "B2", "topic": "Feste & Bräuche", "rt": "ca. 6 Min.", "teaser": "Raclette, Bleigießen ohne Blei, „Dinner for One“ – Merle will Mateusz ein perfektes deutsches Silvester zeigen. Dann fällt um 23:15 Uhr der Strom aus.", "body": ["„Okay, die Liste“, sagt Merle und hält einen Zettel hoch. „Raclette: check. Sekt: check. Wachsgießen: check. Glücksbringer: check. Und um 18 Uhr ‚Dinner for One‘ im Fernsehen.“", "Mateusz schaut von der Couch auf. „Was ist ‚Dinner for One‘?“", "Merle starrt ihn an, als hätte er gefragt, was Weihnachten ist. „Du kennst ‚Dinner for One‘ nicht? Ein englischer Sketch aus den Sechzigern. Schwarz-weiß. Ein Butler, eine alte Dame und vier Gäste, die gar nicht da sind. Jedes Jahr an Silvester kommt er im Fernsehen. Jedes Jahr. Seit Jahrzehnten.“", "„Und in England ist er auch berühmt?“", "„Nein. Da kennt ihn fast keiner. Nur in Deutschland. Frag nicht, warum. Es ist einfach so.“", "Mateusz kommt aus Krakau. Es ist sein erstes Silvester mit Merle in ihrer Wohnung in Heilbronn. Ihre Freunde Joscha und Sinem kommen auch.", "Um 18 Uhr sitzen alle vor dem Fernseher. Der Butler stolpert immer wieder über einen Tigerkopf auf dem Boden. Die alte Dame sagt: „The same procedure as every year, James.“ Merle, Joscha und Sinem sprechen den Satz mit. Mateusz lacht, obwohl er nicht genau weiß, warum.", "„Okay“, sagt er danach. „Ich verstehe es nicht. Aber ich mag es.“", "„Das ist genau die richtige Einstellung“, sagt Joscha.", "Dann wird der Raclette-Grill angeschaltet. In der Mitte des Tisches steht ein kleiner Grill mit acht Pfännchen darunter. Jeder füllt sein Pfännchen mit Kartoffeln, Pilzen, Paprika und legt Käse darauf.", "„Bei uns in Polen isst man an Silvester eher …“, beginnt Mateusz.", "„Psst“, sagt Sinem. „Erst essen. Dann erzählen. Sonst verbrennt dein Käse.“", "Zu spät. Sein Käse ist schwarz.", "Nach dem Essen holt Merle eine kleine Schachtel. Darin: Wachsstücke, ein Löffel, eine Kerze und ein Heft mit Bildern.", "„Früher hat man Blei gegossen“, erklärt sie. „Man macht das Blei auf einem Löffel über der Kerze flüssig und schüttet es in kaltes Wasser. Dann entsteht eine Figur, und die sagt dir, was im nächsten Jahr passiert.“", "„Mit Blei? Ist das nicht giftig?“", "„Genau. Deshalb ist Blei für so etwas seit ein paar Jahren in der EU verboten. Jetzt nimmt man Wachs. Funktioniert genauso.“", "Mateusz hält seinen Löffel über die Kerze und schüttet das flüssige Wachs ins Wasser. Es zischt. Heraus kommt eine merkwürdige Form mit zwei runden Teilen.", "„Was ist das?“", "Merle schaut ins Heft. „Das ist … ein Herz. Oder eine Brezel. Herz bedeutet Liebe. Brezel bedeutet … hier steht: ‚Du wirst ein guter Bäcker.‘“", "„Ich sage Herz“, sagt Mateusz und schaut sie an. Merle wird rot.", "„Und du?“, fragt Mateusz. „Was hast du gegossen?“", "„Ein Schiff“, sagt Merle. „Das heißt: Reisen. Vielleicht nach Krakau?“", "„Meine Mutter wird sich freuen.“", "Um 23:15 Uhr gibt es einen leisen Knall. Dann ist es dunkel. Der Fernseher ist aus, die Lichterkette ist aus, der Raclette-Grill ist aus.", "„Was war das?“, fragt Sinem.", "Joscha schaut aus dem Fenster. „Im ganzen Haus ist es dunkel. Die Nachbarn auch. Nur die Straßenlaternen brennen noch.“", "„Vielleicht die Sicherung“, sagt Mateusz. „Wo ist der Sicherungskasten?“", "„Im Keller. Aber da ist für das ganze Haus der Hauptschalter. Ich weiß nicht, ob wir da ran dürfen.“", "Merle holt Kerzen. Mateusz geht mit der Taschenlampe vom Handy ins Treppenhaus. Dort steht schon der Nachbar aus dem Erdgeschoss, ein älterer Herr im Bademantel.", "„Bei Ihnen auch?“, fragt er.", "„Bei allen. Haben Sie eine Idee?“", "„Ich habe mit meinem Sohn telefoniert. Im ganzen Viertel ist der Strom weg. Irgendein Problem im Umspannwerk. Die Stadtwerke arbeiten dran.“", "Mateusz kommt zurück. „Das ganze Viertel. Wir können nichts machen.“", "„Und der Countdown?“, fragt Sinem. „Wir wissen ja nicht mal, wann Mitternacht ist!“", "„Doch“, sagt Joscha und hält sein Handy hoch. „Akku vierzig Prozent. Die Uhr funktioniert.“", "„Und der Sekt ist im Kühlschrank. Der bleibt eine Stunde kalt“, sagt Merle.", "Sie sitzen bei Kerzenlicht am Tisch. Ohne Fernseher, ohne Musik, ohne Handys, die sie sparen wollen. Erst ist es seltsam still. Dann fängt Mateusz an zu erzählen.", "„Bei uns in Polen gibt es an Silvester einen großen Ball. Meine Eltern gehen jedes Jahr hin. Mein Vater tanzt furchtbar, aber er tanzt bis vier Uhr morgens.“", "„Bei uns in Izmir ist die ganze Familie zusammen, mit einer Tombola“, erzählt Sinem. „Und ich“, sagt Joscha, „habe mit sechzehn Silvester auf einer Insel in der Nordsee verbracht und am nächsten Morgen die Fähre zurück verpasst.“", "Um 23:58 Uhr steht Joscha auf. „Gläser hoch! Zwei Minuten!“", "Sie zählen gemeinsam auf Oles Handy die letzten zehn Sekunden. „Drei … zwei … eins … Frohes neues Jahr!“", "In genau diesem Moment geht das Licht wieder an. Der Fernseher springt an, mitten in eine Silvestershow. Die Lichterkette blinkt. Der Raclette-Grill brummt.", "Alle schreien gleichzeitig. Draußen explodiert das Feuerwerk über Heilbronn, und aus allen Fenstern im Viertel hört man Jubel.", "„Das war das beste Timing der Welt“, sagt Sinem.", "„Das waren die Stadtwerke“, sagt Joscha. „Die haben bestimmt auch auf Mitternacht gewartet.“", "Mateusz nimmt Jules Hand. „Weißt du, was das schönste an diesem Silvester war?“", "„Der Sketch?“", "„Die dunkle Stunde. Ohne Fernseher. Wir haben nur geredet.“", "Merle lächelt. „Dann machen wir das nächstes Jahr wieder. Mit Absicht.“", "„The same procedure as every year?“, fragt Mateusz.", "„The same procedure as every year, James.“"], "gl": [["Silvester", "New Year's Eve"], ["das Hindernis", "obstacle"], ["das Wachsgießen / Bleigießen", "wax / lead pouring (New Year custom)"], ["der Glücksbringer", "lucky charm"], ["stolpern", "to trip"], ["die Einstellung", "attitude"], ["das Pfännchen", "small pan"], ["verbrennen", "to burn"], ["flüssig", "liquid"], ["giftig", "poisonous / toxic"], ["zischen", "to hiss"], ["merkwürdig", "strange / odd"], ["die Lichterkette", "fairy lights"], ["der Sicherungskasten", "fuse box"], ["der Hauptschalter", "main switch"], ["das Umspannwerk", "electrical substation"], ["die Stadtwerke", "municipal utilities"], ["seltsam", "strange"], ["die Tombola", "raffle"], ["mit Absicht", "on purpose"]], "q": [["Was ist das Besondere an „Dinner for One“?", "Es läuft in Deutschland jedes Jahr an Silvester.", "In England kennt ihn kaum jemand."], ["Warum gießt man heute kein Blei mehr?", "Blei ist giftig und dafür in der EU verboten.", "Man nimmt jetzt Wachs."], ["Warum ist der Strom weg?", "Problem im Umspannwerk, das ganze Viertel ist betroffen.", "Die Stadtwerke arbeiten daran."], ["Was machen die Freunde ohne Strom?", "Sie erzählen bei Kerzenlicht Geschichten.", "Über Silvester in ihren Herkunftsländern."], ["Was gefällt Mateusz am besten?", "Die dunkle Stunde, in der sie nur geredet haben.", "Ohne Fernseher und Handys."]], "say": ["Ich verstehe es nicht, aber ich mag es.", "Ist das nicht giftig?", "Bei Ihnen auch?", "Wir können nichts machen.", "Frohes neues Jahr!"]}, {"id": 66, "title": "Der Maibaum", "level": "B2", "topic": "Dorfleben & Tradition", "rt": "ca. 6 Min.", "teaser": "Arjen ist neu im Dorf und tritt dem Musikverein bei. Am 30. April muss der Maibaum bewacht werden – denn die Burschen aus dem Nachbardorf wollen ihn stehlen.", "body": ["Arjen de Vries wohnt seit vier Monaten in Untergruppenbach, einem Dorf mit dreitausend Einwohnern in der Nähe von Heilbronn. Er spielt Trompete, und im Februar hat er sich beim örtlichen Musikverein angemeldet. Nach der ersten Probe hat der Vorsitzende, ein kräftiger Mann namens Gottfried, ihm die Hand geschüttelt.", "„Willkommen. Und am dreißigsten April hast du Nachtwache.“", "„Nachtwache? Wofür?“", "„Für den Maibaum natürlich.“", "„Was für ein Maibaum?“", "„Das wirst du schon sehen. Bring eine warme Jacke mit. Und gute Nerven.“", "Arjen hat damals genickt, ohne zu verstehen. Jetzt ist der 30. April, 21 Uhr, und er steht mit fünf jungen Männern und zwei Frauen vom Musikverein auf dem Dorfplatz neben einem riesigen Baumstamm. Er ist fast dreißig Meter lang, ohne Rinde, und liegt auf Holzböcken. Daneben steht ein großer Kranz aus Tannenzweigen mit bunten Bändern.", "„Also“, sagt Gottfried. „Morgen früh um zehn stellen wir den Baum auf. Heute Nacht bewachen wir ihn. Bis morgen früh. Schichten von je drei Stunden. Arjen, du hast die Schicht von zwölf bis drei. Zusammen mit Romy und Kilian.“", "„Entschuldigung“, sagt Arjen. „Ich verstehe es immer noch nicht. Wer will denn einen dreißig Meter langen Baum stehlen?“", "Alle lachen. Romy, eine junge Frau mit kurzen Haaren und einer Thermoskanne, erklärt es ihm.", "„Die Burschen aus Abstatt. Das ist das Nachbardorf. Es ist eine alte Tradition. In der Nacht zum ersten Mai versuchen die jungen Leute aus einem Dorf, den Maibaum vom anderen Dorf zu klauen.“", "„Und das ist erlaubt?“", "„Es gibt Regeln“, sagt Kilian. „Ungeschriebene Regeln. Der Baum darf nicht beschädigt werden. Keine Gewalt. Und wenn die Wächter den Baum berühren, bevor er weggetragen ist, gilt der Diebstahl als gescheitert. Dann müssen die Diebe abziehen.“", "„Und wenn sie es schaffen?“", "„Dann müssen wir ihn auslösen. Mit Bier und Vesper für das ganze Nachbardorf. Das ist teuer. Und peinlich. Vor drei Jahren ist es passiert. Darüber redet man hier heute noch.“", "Um Mitternacht beginnt Arjens Schicht. Die anderen sind nach Hause gegangen oder schlafen im Feuerwehrhaus nebenan. Es ist kühl. Romy gießt Kaffee in drei Becher. Kilian hat ein Fernglas und eine Taschenlampe.", "„Darf ich fragen, warum ihr das macht?“, sagt Arjen. „Warum stellt man einen Baum auf?“", "„Der Maibaum ist ein Zeichen für den Frühling“, sagt Romy. „Und für das Dorf. Die Schilder an den Seiten zeigen die Vereine und Handwerke im Ort. Bäcker, Schreiner, Feuerwehr, der Musikverein. Es zeigt: Wir sind eine Gemeinschaft.“", "„In Holland haben wir so etwas nicht. Wir haben Königstag. Da tragen alle Orange und verkaufen alte Sachen auf der Straße.“", "„Und was macht ihr da den ganzen Tag?“, fragt Romy.", "„Feiern, handeln und Pommes essen.“", "„Das klingt auch schön“, sagt Kilian. „Weniger anstrengend.“", "Um 1:30 Uhr hört Arjen hinter der Kirche ein leises Knacken. „Habt ihr das auch gehört? Da ist doch jemand!“", "Kilian schaut durch das Fernglas. „Da bewegt sich was. Hinter dem Pfarrhaus. Drei, vier Leute.“", "„Was machen wir?“", "„Ruhig bleiben“, flüstert Romy. „Sie wollen uns ablenken. Das ist der Trick. Ein paar machen hinten Lärm, und die anderen kommen von vorne.“", "Und tatsächlich: Hinter dem Pfarrhaus fängt jemand laut an zu singen. Gleichzeitig sieht Arjen von der Hauptstraße her sechs dunkle Gestalten, die sich leise auf den Baumstamm zubewegen.", "„Von vorne!“, ruft Arjen.", "Kilian rennt los, Romy auch. Arjen rennt hinterher. Die Gestalten haben den Stamm schon an einem Ende angehoben. Arjen springt, stolpert über einen Holzbock und landet mit beiden Händen auf der Rinde des Baumstamms.", "„Berührt!“, ruft Romy. „Er hat ihn berührt! Der Baum bleibt hier!“", "Die sechs Gestalten lassen den Stamm langsam wieder auf die Böcke sinken. Einer nimmt seine Mütze ab. Es ist ein junger Mann mit rotem Bart.", "„Mist. Wer ist denn das?“, fragt er und zeigt auf Arjen. „Den kenne ich nicht.“", "„Habt ihr wirklich gedacht, wir schlafen alle?“, fragt Kilian grinsend.", "„Ehrlich gesagt, ja. Letztes Mal hat eure Wache Karten gespielt.“", "„Der Neue“, sagt Kilian stolz. „Aus Holland. Unser Trompeter.“", "Der Mann mit dem roten Bart lacht und gibt Arjen die Hand. „Respekt. Erster Mai und gleich ein Held. Ich bin Valentin aus Abstatt. Ihr habt gewonnen. Fair ist fair.“", "„Und jetzt?“, fragt Arjen, noch außer Atem.", "„Jetzt“, sagt Romy und holt eine Kiste Bier aus dem Feuerwehrhaus, „trinken wir zusammen. Das gehört auch zur Tradition.“", "Sie sitzen bis halb vier mit den Burschen aus Abstatt auf dem Dorfplatz. Valentin erzählt, wie sie vor drei Jahren den Baum geklaut haben. Gottfried, der inzwischen aufgewacht ist, erzählt, wie er vor dreißig Jahren den Baum von Abstatt geklaut hat.", "Am nächsten Morgen um zehn spielt der Musikverein auf dem Dorfplatz. Zwanzig Männer stellen den Baum mit langen Holzstangen auf, Zentimeter für Zentimeter, ohne Kran, so wie es immer war. Das ganze Dorf schaut zu und klatscht, als der Baum endlich steht.", "Arjen spielt Trompete. Er hat nur drei Stunden geschlafen, und seine Hände tun von der Rinde weh. Nach dem letzten Lied kommt Gottfried zu ihm.", "„Das hast du gut gemacht heute Nacht. Das Dorf redet schon darüber.“", "„Ich bin nur gestolpert.“", "„Das musst du niemandem erzählen“, sagt Gottfried und zwinkert. „Ab heute bist du kein Neuer mehr.“"], "gl": [["der Maibaum", "maypole"], ["der Musikverein", "village brass band club"], ["die Probe", "rehearsal"], ["der/die Vorsitzende", "chairperson"], ["die Nachtwache", "night watch"], ["der Baumstamm", "tree trunk"], ["die Rinde", "bark"], ["der Kranz", "wreath"], ["bewachen / der Wächter", "to guard / guard"], ["die Burschen", "young men (of a village)"], ["klauen", "to nick / steal"], ["ungeschrieben", "unwritten"], ["scheitern", "to fail"], ["auslösen", "to ransom / redeem"], ["das Vesper (schwäb.)", "snack / light meal"], ["das Fernglas", "binoculars"], ["die Gemeinschaft", "community"], ["ablenken", "to distract"], ["das Pfarrhaus", "vicarage"], ["zwinkern", "to wink"]], "q": [["Warum muss der Maibaum bewacht werden?", "Das Nachbardorf versucht, ihn zu stehlen.", "Das ist eine alte Tradition."], ["Welche ungeschriebenen Regeln gibt es?", "Kein Schaden, keine Gewalt.", "Berührt ein Wächter den Baum, ist der Diebstahl gescheitert."], ["Was passiert, wenn der Baum gestohlen wird?", "Man muss ihn mit Bier und Vesper auslösen.", "Das ist teuer und peinlich."], ["Was ist der Trick der Abstatter?", "Hinten Lärm machen, vorne den Baum holen.", "Romy erkennt das Ablenkungsmanöver."], ["Wie wird Arjen zum Helden?", "Er stolpert und berührt den Baum.", "Gottfried sagt, das müsse niemand wissen."]], "say": ["Wer will denn einen Baum stehlen?", "Habt ihr das gehört?", "Ruhig bleiben.", "Fair ist fair.", "Ab heute bist du kein Neuer mehr."]}, {"id": 67, "title": "Das Weinfest", "level": "B2", "topic": "Feste & Region", "rt": "ca. 6 Min.", "teaser": "Auf dem Weinfest bestellt Grace ein „Viertele Trollinger“ und lernt, was ein Besen ist. Ihr Gastgeber Siegfried hat ein Geheimnis: Er mag eigentlich keinen Wein.", "body": ["Es ist der zweite Samstag im September, und in Fellbach findet das Herbstfest statt. Zwischen Fachwerkhäusern und Weinbergen stehen Holzbuden und lange Tische, und überall hängen Lichterketten. Grace Owusu ist seit drei Wochen in Deutschland. Sie macht ein Praktikum bei einer Gartenbaufirma, und ihr Ausbilder, Siegfried Nägele, hat sie eingeladen.", "„Hier gibt es das Beste, was Württemberg zu bieten hat“, sagt Siegfried, als sie sich an einen Tisch setzen. „Wein aus der Region. Und Zwiebelkuchen.“", "„Was trinkt man hier?“, fragt Grace.", "„Ein Viertele. Einen Viertelliter Wein in einem Glas mit Henkel. Rot oder weiß?“", "„Was empfehlen Sie?“", "„Trollinger. Das ist ein leichter Rotwein, typisch für hier. In Württemberg trinken die Leute mehr Wein pro Kopf als irgendwo sonst in Deutschland. Der Trollinger ist sozusagen das Wasser der Schwaben.“", "Eine Frau mit Schürze kommt an den Tisch. „Was darf's sein?“", "„Ein Viertele Trollinger, bitte“, sagt Grace stolz. Sie hat das Wort geübt.", "„Und für Sie, Siegfried?“", "„Für mich eine Apfelschorle. Groß.“", "Grace schaut ihn überrascht an. „Sie trinken keinen Wein? Auf dem Weinfest?“", "Siegfried lächelt verlegen und schaut sich um, als hätte er ein Geheimnis. „Psst. Nicht so laut. Ich mag keinen Wein. Habe ich noch nie gemocht.“", "„Aber Sie haben doch gesagt, es ist das Beste, was Württemberg zu bieten hat!“", "„Für die anderen. Ich komme wegen des Zwiebelkuchens und der Leute. Aber das darf hier keiner wissen. Mein Bruder ist Winzer.“", "Grace lacht laut. Die Frau bringt die Getränke und zwei Stücke Zwiebelkuchen, noch warm, mit Speck und Kümmel.", "„Und dazu gehört eigentlich ein Neuer Wein“, sagt Siegfried. „Federweißer. Der ist noch nicht fertig, er gärt noch. Er ist trüb und süß und hat wenig Alkohol. Aber Vorsicht: Er schmeckt wie Saft, und am nächsten Tag weiß man, dass es kein Saft war.“", "Grace probiert ihr Viertele. „Er ist leicht. Ein bisschen wie Kirschen.“", "„Sehr gut! Sie haben eine feine Zunge. Mein Bruder wird Sie lieben.“", "In diesem Moment setzt sich ein älteres Paar zu ihnen an den Tisch. Der Mann hat ein rotes Gesicht und eine Mütze mit einem Weinblatt darauf.", "„Ist hier noch frei?“", "„Freilich, setzen Sie sich“, sagt Siegfried.", "Der Mann schaut auf Siegfrieds Glas. „Siegfried Nägele mit einer Apfelschorle? Auf dem Herbstfest? Dass ich das noch erleben darf!“", "Siegfried wird rot. „Ich muss noch fahren, Eugen.“", "„Du wohnst zweihundert Meter von hier.“", "„Ich fahre mit dem Fahrrad.“", "Alle lachen. Eugen gibt Grace die Hand. „Eugen Bauknecht. Und das ist meine Frau Hilde. Woher kommen Sie, junge Frau?“", "„Aus Ghana. Aus Kumasi.“", "„Ghana! Und wie gefällt es Ihnen bei uns?“", "„Sehr gut. Die Leute sind am Anfang ein bisschen zurückhaltend. Aber wenn man an einem Tisch sitzt, reden alle.“", "„Das ist der Wein“, sagt Hilde. „Ohne Viertele sind wir Schwaben ziemlich stumm.“", "„Gibt es bei Ihnen auch Wein?“, fragt Eugen.", "„Palmwein. Man zapft ihn direkt aus der Palme. Er ist weiß und süß, und am Abend ist er schon sauer. Man muss ihn am selben Tag trinken.“", "„Wie unser Federweißer!“, ruft Eugen begeistert. „Hilde, hörst du? Die haben in Ghana auch Federweißer!“", "Nach dem zweiten Viertele erzählt Eugen von seinem Lieblingsbesen.", "„Ein Besen?“, fragt Grace. „Zum Putzen?“", "„Nein“, lacht Siegfried. „Eine Besenwirtschaft. Ein Winzer darf ein paar Monate im Jahr seinen eigenen Wein in seinem Haus ausschenken, ohne richtiges Restaurant. Dann hängt er einen Besen vor die Tür. So weiß jeder: Hier ist geöffnet.“", "„Und was gibt es da?“", "„Wein, Schlachtplatte, Maultaschen, Käsespätzle. Einfaches Essen. Man sitzt mit Fremden am Tisch, und nach einer Stunde kennt man ihre ganze Familiengeschichte.“", "„Wie hier.“", "„Genau wie hier.“", "Gegen zehn Uhr wird Musik gespielt. Eine kleine Band spielt alte Schlager, und Hilde zieht Eugen zum Tanzen. Siegfried und Grace bleiben sitzen.", "„Darf ich etwas fragen?“, sagt Grace. „Warum haben Sie mich eingeladen? Ich bin nur die Praktikantin.“", "Siegfried überlegt. „Als ich vor vierzig Jahren meine Lehre gemacht habe, war ich achtzehn und kam von der Alb. Ich kannte hier niemanden. Mein Meister hat mich am ersten Wochenende auf das Herbstfest mitgenommen. Da habe ich die halbe Stadt kennengelernt. Seitdem mache ich das mit jedem Lehrling und jedem Praktikanten.“", "„Hat Ihr Meister auch Apfelschorle getrunken?“", "„Nein“, lacht Siegfried. „Der hat für uns beide getrunken.“", "Am Montag kommt Grace in die Gärtnerei. Auf ihrem Schreibtisch steht eine Flasche Trollinger mit einer Karte: „Für die feine Zunge aus Kumasi. Herzliche Grüße vom Weingut Nägele. PS: Mein Bruder sagt, Sie sollen ihn im Besen besuchen. Er trinkt dann eine Apfelschorle mit Ihnen.“"], "gl": [["das Weinfest / das Herbstfest", "wine festival / autumn festival"], ["die Holzbude", "wooden stall"], ["der Ausbilder", "trainer / supervisor"], ["das Viertele (schwäb.)", "quarter litre of wine"], ["der Henkel", "handle"], ["der Trollinger", "Trollinger (red wine grape)"], ["die Apfelschorle", "apple juice spritzer"], ["der Winzer", "winegrower"], ["der Zwiebelkuchen", "onion tart"], ["der Kümmel", "caraway"], ["der Federweißer / Neuer Wein", "new, partially fermented wine"], ["gären", "to ferment"], ["trüb", "cloudy"], ["freilich (südd.)", "of course"], ["zurückhaltend", "reserved"], ["stumm", "silent / mute"], ["zapfen", "to tap"], ["die Besenwirtschaft / der Besen", "seasonal wine tavern"], ["ausschenken", "to serve (drinks)"], ["der Lehrling / die Lehre", "apprentice / apprenticeship"]], "q": [["Was ist ein Viertele?", "Ein Viertelliter Wein im Glas mit Henkel.", "Typisch in Württemberg."], ["Was ist Siegfrieds Geheimnis?", "Er mag keinen Wein.", "Obwohl sein Bruder Winzer ist."], ["Warum soll man beim Federweißer vorsichtig sein?", "Er schmeckt wie Saft, hat aber Alkohol.", "Er gärt noch."], ["Was ist eine Besenwirtschaft?", "Ein Winzer schenkt zeitweise seinen Wein zu Hause aus.", "Ein Besen vor der Tür zeigt: geöffnet."], ["Warum hat Siegfried Grace eingeladen?", "Er macht das mit jedem Lehrling und Praktikanten.", "Sein Meister hat es früher mit ihm genauso gemacht."]], "say": ["Ein Viertele Trollinger, bitte.", "Was empfehlen Sie?", "Ist hier noch frei?", "Freilich, setzen Sie sich.", "Darf ich etwas fragen?"]}, {"id": 68, "title": "Der Streit im Treppenhaus", "level": "B2", "topic": "Nachbarschaft & Hausordnung", "rt": "ca. 6 Min.", "teaser": "Ein Kinderwagen, ein Schuhregal und eine Nachbarin mit Brandschutz-Broschüre: Im Treppenhaus der Uhlandstraße 9 wird es laut. Bis die Hausverwaltung eine Idee hat.", "body": ["Im Erdgeschoss der Uhlandstraße 9 in Reutlingen steht seit drei Wochen ein Kinderwagen. Er gehört Ida Konstantin aus dem zweiten Stock, die vor einem Monat ihren Sohn Emil bekommen hat. Neben dem Kinderwagen steht seit drei Jahren ein Schuhregal. Es gehört Hanno Riedel aus dem ersten Stock. Und seit gestern hängt an der Haustür ein Zettel.", "„An die Bewohner! Das Treppenhaus ist ein Fluchtweg und keine Abstellkammer! Bitte entfernen Sie Ihre Gegenstände bis Freitag. Mit freundlichen Grüßen, B. Seitz, 3. OG“", "Ida liest den Zettel mit Emil auf dem Arm. Hinter ihr geht die Tür auf, und Frau Seitz kommt mit ihrem Einkaufstrolley herein. Sie ist Mitte siebzig, trägt eine akkurate Dauerwelle und eine Broschüre in der Hand.", "„Ah, Frau Konstantin. Haben Sie meinen Zettel gelesen?“", "„Ja, gerade eben. Meinen Sie damit den Kinderwagen?“", "„Den Kinderwagen und das Schuhregal. Wissen Sie, was passiert, wenn es brennt? Dann kommt die Feuerwehr hier nicht durch. Hier, lesen Sie das.“ Sie hält ihr die Broschüre hin: Brandschutz im Mehrfamilienhaus.", "„Frau Seitz, ich wohne im zweiten Stock, ohne Aufzug. Ich habe ein vier Wochen altes Baby und einen Kaiserschnitt hinter mir. Ich kann den Kinderwagen nicht jeden Tag zwei Stockwerke hochtragen.“", "„Das verstehe ich ja. Aber Regeln sind Regeln. In der Hausordnung steht es auch.“", "In diesem Moment kommt Hanno Riedel die Treppe herunter, in Laufkleidung. Er sieht den Zettel und verdreht die Augen.", "„Ist das wegen meinem Schuhregal? Das steht hier seit drei Jahren. Da hat sich noch nie jemand beschwert.“", "„Doch“, sagt Frau Seitz. „Ich. Zweimal. Sie haben nur nie reagiert.“", "„Weil das Unsinn ist. Das Regal ist dreißig Zentimeter breit. Da kommt jeder vorbei.“", "„Und Ihre Laufschuhe riechen bis in den dritten Stock.“", "„Jetzt wird es persönlich“, sagt Hanno und wird rot.", "Emil fängt an zu weinen. Ida wiegt ihn hin und her. „Können wir das vielleicht später besprechen? Und etwas leiser?“", "Am Abend schreibt Hanno eine E-Mail an die Hausverwaltung. Frau Seitz ruft dort an. Ida schreibt auch eine Mail, aber freundlicher. Zwei Tage später kommt eine Antwort an alle drei: Herr Baumann von der Hausverwaltung schlägt einen Termin vor. Donnerstag, 18 Uhr, im Treppenhaus.", "Herr Baumann ist ein ruhiger Mann mit Klemmbrett. Er schaut sich den Flur an, misst mit einem Zollstock die Breite und hört allen zu, ohne zu unterbrechen.", "„Also“, sagt er dann. „Frau Seitz hat grundsätzlich recht. Fluchtwege müssen frei sein. Das ist Brandschutz, da gibt es keinen Spielraum.“", "Frau Seitz nickt zufrieden.", "„Aber“, fährt Herr Baumann fort, „Gerichte haben in vielen Fällen entschieden, dass Mieter einen Kinderwagen im Hausflur abstellen dürfen, wenn es keine zumutbare Alternative gibt und der Weg nicht blockiert ist. Ein Kinderwagen ist kein Möbelstück. Er gehört zum Alltag einer Familie.“", "„Und mein Regal?“, fragt Hanno.", "„Ihr Regal ist ein Möbelstück. Das darf da nicht stehen. Schuhe gehören in die Wohnung. Tut mir leid.“", "„Das ist doch ungerecht. Das Baby darf, und ich darf nicht?“", "„Das Baby darf nichts“, sagt Ida trocken. „Es kann noch nicht mal den Kopf halten.“", "Hanno muss gegen seinen Willen lachen.", "„Ich habe einen Vorschlag“, sagt Herr Baumann. „Unten neben dem Fahrradkeller gibt es einen kleinen Raum mit dem alten Öltank. Der Tank ist seit dem Heizungsumbau leer und wird nächste Woche ausgebaut. Danach haben wir da sechs Quadratmeter. Mit einem Schloss für alle Mieter.“", "„Für Kinderwagen?“, fragt Ida.", "„Für Kinderwagen, Rollatoren, vielleicht auch ein Regal für Laufschuhe“, sagt er und schaut Hanno an. „Wenn sie nicht durch die Wände riechen.“", "„Das ist eine faire Lösung“, sagt Frau Seitz langsam. „Wann ist der Raum fertig?“", "„In etwa drei Wochen. Bis dahin bleibt der Kinderwagen hier, an der Wand, so dass ein Meter zwanzig frei bleibt. Und das Regal zieht bis Sonntag um.“", "Hanno seufzt. „Okay. Einverstanden.“", "Als Herr Baumann weg ist, stehen die drei noch einen Moment unschlüssig im Flur.", "„Frau Konstantin“, sagt Frau Seitz plötzlich leiser. „Das mit dem Kaiserschnitt wusste ich nicht. Ich hätte nicht so einen Zettel schreiben sollen. Ich hätte klingeln sollen.“", "„Danke. Und ich hätte vielleicht vorher fragen sollen, bevor ich den Wagen hinstelle.“", "„Wissen Sie, mein Mann war vierzig Jahre bei der Freiwilligen Feuerwehr. Er hat mir so viele Geschichten erzählt. Von Treppenhäusern voller Gerümpel. Seitdem bin ich da ein bisschen … streng.“", "„Das verstehe ich jetzt besser.“", "Hanno räuspert sich. „Und ich trage die Schuhe ab heute auf den Balkon. Das mit dem Geruch … war vielleicht nicht ganz falsch.“", "„Vielleicht?“, fragt Frau Seitz und hebt eine Augenbraue.", "„Okay. Es war nicht falsch.“", "Drei Wochen später ist der Raum neben dem Fahrradkeller fertig. Darin stehen ein Kinderwagen, ein Rollator von Frau Seitz und ein kleines Regal mit Laufschuhen. An der Tür hängt ein neuer Zettel, in ordentlicher Handschrift:", "„Gemeinschaftsraum. Bitte Ordnung halten. Bei Fragen klingeln, nicht Zettel schreiben. B. Seitz, I. Konstantin, H. Riedel“"], "gl": [["das Treppenhaus", "stairwell"], ["der Fluchtweg", "escape route"], ["die Abstellkammer", "storage room"], ["entfernen", "to remove"], ["die Dauerwelle", "perm"], ["der Brandschutz", "fire safety"], ["der Kaiserschnitt", "Caesarean section"], ["die Hausordnung", "house rules"], ["sich beschweren", "to complain"], ["wiegen (ein Baby)", "to rock (a baby)"], ["der Zollstock", "folding ruler"], ["der Spielraum", "leeway"], ["zumutbar", "reasonable"], ["das Möbelstück", "piece of furniture"], ["ungerecht", "unfair"], ["der Öltank", "oil tank"], ["der Rollator", "walking frame"], ["das Gerümpel", "junk"], ["streng", "strict"], ["der Gemeinschaftsraum", "communal room"]], "q": [["Warum schreibt Frau Seitz den Zettel?", "Das Treppenhaus ist ein Fluchtweg.", "Ihr geht es um Brandschutz."], ["Warum stellt Ida den Kinderwagen unten ab?", "Sie kann ihn nach dem Kaiserschnitt nicht hochtragen.", "Es gibt keinen Aufzug."], ["Warum darf der Kinderwagen bleiben, das Regal aber nicht?", "Ein Kinderwagen gehört zum Alltag, ein Regal ist ein Möbelstück.", "Der Weg muss trotzdem frei bleiben."], ["Welche Lösung schlägt Herr Baumann vor?", "Ein Gemeinschaftsraum im ehemaligen Öltankraum.", "Für Kinderwagen, Rollatoren und Schuhe."], ["Warum ist Frau Seitz so streng?", "Ihr Mann war bei der Freiwilligen Feuerwehr.", "Er hat ihr von zugestellten Treppenhäusern erzählt."]], "say": ["Haben Sie meinen Zettel gelesen?", "Können wir das später besprechen?", "Jetzt wird es persönlich.", "Das ist eine faire Lösung.", "Ich hätte klingeln sollen."]}, {"id": 69, "title": "Heimweh", "level": "B2", "topic": "Gefühle & Ankommen", "rt": "ca. 6 Min.", "teaser": "November in Konstanz: grau, nass, dunkel um fünf. Lorena aus Medellín vermisst ihre Familie so sehr, dass sie nicht mehr aufstehen will. Bis ihre Vermieterin klopft.", "body": ["Es ist der vierte Tag ohne Sonne. Lorena Restrepo sitzt in ihrem kleinen Zimmer unter dem Dach eines Hauses in Konstanz und schaut aus dem Fenster. Der Bodensee ist nicht zu sehen. Nur Nebel. Es ist halb fünf am Nachmittag, und es wird schon dunkel.", "Seit vierzehn Monaten macht sie hier ihre Doktorarbeit in Biologie. Im Sommer war alles wunderbar: Schwimmen im See, Grillen mit den Kollegen, lange helle Abende. Aber seit Oktober ist etwas anders. Sie schläft schlecht. Sie isst nur noch Nudeln. Und heute Morgen ist sie gar nicht ins Labor gegangen.", "Ihr Handy vibriert. Ein Videoanruf. Ihre Mutter.", "„¡Hola, mi amor! Wie geht es dir? Du siehst müde aus.“", "„Mir geht es gut, Mama. Es ist nur dunkel hier.“", "Im Hintergrund hört Lorena Musik, Stimmen, Lachen. Hinter ihrer Mutter sieht sie die Terrasse, voller Menschen, und hellen Sonnenschein.", "„Wir feiern heute den Geburtstag von Tía Gloria. Alle sind da. Warte, ich zeige dir!“", "Ihre Mutter dreht das Handy. Lorena sieht ihre Tante, ihre Cousins, ihren kleinen Neffen, der seit dem letzten Mal so viel gewachsen ist. Alle winken und rufen ihren Namen. Jemand hält einen Teller Empanadas in die Kamera.", "„Wir vermissen dich! Wann kommst du nach Hause?“", "„Bald“, sagt Lorena. „Im Sommer vielleicht.“", "Nach dem Anruf legt sie das Handy weg und weint. Lange. Sie weint, bis sie keine Kraft mehr hat, und dann legt sie sich ins Bett, obwohl es erst sechs Uhr ist.", "Am nächsten Morgen klopft es an ihrer Tür. Es ist Bärbel Pfeiffer, ihre Vermieterin, die unten im Haus wohnt. Sie ist Anfang siebzig, pensionierte Lehrerin und normalerweise sehr diskret.", "„Lorena? Entschuldigung, dass ich störe. Ich habe Sie seit zwei Tagen nicht gehört. Normalerweise höre ich morgens Ihre Dusche und Ihre Musik. Ist alles in Ordnung?“", "Lorena öffnet die Tür. Sie trägt noch den Schlafanzug. Ihre Augen sind rot.", "„Es geht mir nicht so gut, Frau Pfeiffer.“", "Bärbel schaut sie lange an. Dann sagt sie: „Ziehen Sie sich etwas Warmes an. Wir gehen spazieren. Danach gibt es Kaffee bei mir. Keine Widerrede.“", "Sie gehen am Seeufer entlang. Der Nebel ist ein bisschen dünner geworden. Möwen sitzen auf den Pfählen im Wasser.", "„Darf ich raten?“, sagt Bärbel. „Heimweh.“", "„Ist es so offensichtlich?“", "„Ich habe es selbst erlebt. Neunzehnhundertvierundsiebzig war ich ein Jahr als Lehrerin in Schottland. Im Sommer war alles herrlich. Im November habe ich drei Wochen lang jeden Abend geweint. Ich hätte alles gegeben für ein Stück Schwarzwälder Kirschtorte und die Stimme meiner Mutter.“", "Lorena muss lächeln. „Was haben Sie gemacht?“", "„Erst habe ich mich versteckt. Das war falsch. Dann hat mich eine schottische Kollegin zum Ceilidh eingeladen, einem Tanzabend. Ich bin hingegangen, obwohl ich keine Lust hatte. Und es war das erste Mal seit Wochen, dass ich gelacht habe.“", "„Bei mir ist es nicht nur die Familie“, sagt Lorena leise. „Es ist das Licht. Bei uns ist es das ganze Jahr hell. Hier ist es um fünf dunkel, und ich fühle mich, als würde ich langsam ausgehen. Wie eine Kerze.“", "Bärbel nickt ernst. „Das ist nicht nur Heimweh. Viele Menschen werden im Winter hier traurig. Besonders die, die aus dem Süden kommen. Das hat sogar einen Namen: Winterdepression. Sie sollten mit jemandem reden. Die Universität hat eine psychologische Beratungsstelle. Kostenlos. Und Ihr Hausarzt kann auch helfen.“", "„Ich dachte, ich muss das allein schaffen. Ich will nicht schwach sein.“", "„Lorena. Hilfe holen ist nicht schwach. Es ist klug. Wenn Sie sich das Bein brechen, gehen Sie auch zum Arzt.“", "Bei Bärbel gibt es Kaffee und Apfelkuchen. Ihre Wohnung ist warm, an den Wänden hängen alte Landkarten und Fotos aus Schottland.", "„Was essen Sie zu Hause, wenn Sie glücklich sind?“, fragt Bärbel.", "„Arepas. Maisfladen. Mit Käse und Avocado. Meine Oma hat sie jeden Sonntag gemacht.“", "„Kann man die hier machen?“", "„Man braucht ein spezielles Maismehl. Das gibt es hier nicht.“", "„Sind Sie sicher? In der Altstadt gibt es einen kleinen Laden mit Lebensmitteln aus Lateinamerika. Mein Enkel kauft da immer Chilisoße.“", "Lorena schaut sie an. „Wirklich?“", "„Wirklich. Und ich schlage einen Handel vor. Sie zeigen mir am Sonntag, wie man Arepas macht. Und ich zeige Ihnen, wie man Schwarzwälder Kirschtorte backt. Dann haben wir beide ein Stück Heimat.“", "Am Montag geht Lorena zur Beratungsstelle der Universität. Eine Psychologin hört ihr zu, ohne sie zu unterbrechen. Sie empfiehlt eine Tageslichtlampe für morgens, regelmäßige Spaziergänge in der Mittagspause und eine Gesprächsgruppe für internationale Studierende, die sich jeden Mittwoch trifft.", "Am Sonntag steht Lorena in Bärbels Küche, die Hände voller Maisteig. Die Arepas werden etwas zu dick, aber sie riechen genau wie bei ihrer Oma. Lorena macht ein Foto und schickt es ihrer Mutter.", "Die Antwort kommt nach einer Minute: „¡Qué lindo! Wer ist die Dame neben dir?“", "Lorena schreibt zurück: „Meine deutsche Familie.“", "Draußen ist es immer noch grau. Aber in der Küche ist es warm und hell. Und zum ersten Mal seit Wochen freut sich Lorena auf den nächsten Tag."], "gl": [["das Heimweh", "homesickness"], ["der Nebel", "fog"], ["die Doktorarbeit", "doctoral thesis"], ["vermissen", "to miss"], ["die Vermieterin", "landlady"], ["pensioniert", "retired"], ["diskret", "discreet"], ["Keine Widerrede!", "No arguments!"], ["die Möwe", "seagull"], ["der Pfahl", "post / pile"], ["offensichtlich", "obvious"], ["sich verstecken", "to hide"], ["ausgehen (Licht)", "to go out"], ["die Winterdepression", "seasonal affective disorder"], ["die Beratungsstelle", "counselling service"], ["schwach", "weak"], ["der Maisfladen", "corn flatbread"], ["der Handel", "deal"], ["die Tageslichtlampe", "daylight lamp"], ["der Teig", "dough"]], "q": [["Warum geht es Lorena im November schlecht?", "Es ist dunkel und sie vermisst ihre Familie.", "Der Videoanruf vom Geburtstag macht es schlimmer."], ["Woran merkt Bärbel, dass etwas nicht stimmt?", "Sie hört Lorena seit zwei Tagen nicht.", "Normalerweise hört sie Dusche und Musik."], ["Welche Erfahrung teilt Bärbel?", "Sie hatte selbst Heimweh in Schottland.", "Ein Tanzabend hat ihr geholfen."], ["Was rät Bärbel Lorena?", "Mit jemandem reden, z. B. bei der Beratungsstelle.", "Hilfe holen ist nicht schwach, sondern klug."], ["Welchen Handel schlägt Bärbel vor?", "Arepas gegen Schwarzwälder Kirschtorte.", "So haben beide ein Stück Heimat."]], "say": ["Es geht mir nicht so gut.", "Ist es so offensichtlich?", "Ich will nicht schwach sein.", "Hilfe holen ist nicht schwach.", "Dann haben wir beide ein Stück Heimat."]}, {"id": 70, "title": "Lampenfieber", "level": "B2", "topic": "Gefühle & Auftreten", "rt": "ca. 6 Min.", "teaser": "Selin ist Trauzeugin und soll bei der Hochzeit ihrer besten Freundin eine Rede halten. Vor 120 Gästen. Auf Deutsch. Ihr Kopf ist leer.", "body": ["„Du schaffst das“, sagt Selin zu ihrem Spiegelbild. „Du bist eine erwachsene Frau. Du hast ein Studium abgeschlossen. Du kannst fünf Minuten reden.“", "Ihr Spiegelbild sieht nicht überzeugt aus.", "In drei Wochen heiratet ihre beste Freundin Annika. Selin ist Trauzeugin. Und Annika hat sie gefragt, ob sie beim Abendessen eine Rede hält. Vor hundertzwanzig Gästen. Auf Deutsch. Selin ist in Bursa aufgewachsen und vor acht Jahren nach Deutschland gekommen. Ihr Deutsch ist gut. Aber sobald mehr als drei Leute sie anschauen, vergisst sie jedes Wort.", "Am Abend sitzt sie mit ihrem Mitbewohner Theo in der Küche. Theo ist Schauspieler an einem kleinen Theater in Freiburg.", "„Theo, ich muss die Rede absagen. Ich kann das nicht.“", "„Was genau kannst du nicht?“", "„Vor so vielen Leuten reden. Mein Herz rast, meine Hände schwitzen, meine Stimme zittert. Und dann denke ich: Alle merken, dass ich Ausländerin bin. Dass ich die Artikel verwechsle. Dass ich ‚der Liebe‘ sage statt ‚die Liebe‘.“", "Theo lacht. „Selin, das heißt Lampenfieber. Das habe ich vor jeder Vorstellung. Seit fünfzehn Jahren.“", "„Du? Du bist doch Profi.“", "„Gerade deshalb. Wer kein Lampenfieber hat, dem ist es egal. Lampenfieber heißt nur: Es ist dir wichtig.“", "„Und was machst du dagegen?“", "„Nichts dagegen. Ich mache etwas damit. Willst du ein paar Tricks lernen?“", "„Bitte.“", "„Erstens: Schreib die Rede nicht wie einen Aufsatz. Schreib sie, wie du sprichst. Kurze Sätze. Keine komplizierten Wörter, die du nur auf dem Papier benutzt.“", "„Okay.“", "„Zweitens: Fang mit einer Geschichte an. Nicht mit ‚Liebe Gäste, ich freue mich, heute hier zu sein‘. Das sagen alle. Erzähl, wie du Annika kennengelernt hast.“", "Selin überlegt. „Wir haben uns im Deutschkurs kennengelernt. Sie war die Lehrerin. Also, die Praktikantin. Und ich habe in meinem ersten Satz zu ihr gesagt: ‚Ich bin sehr heiß auf diesen Kurs.‘“", "Theo verschluckt sich an seinem Tee. „Was?“", "„Ich wollte sagen, dass ich mich sehr freue. Ich hatte im Wörterbuch ‚heiß auf etwas sein‘ gefunden. Die ganze Klasse hat gelacht. Annika auch. Und dann hat sie mir nach dem Kurs erklärt, was ich gesagt habe. Und wir waren Kaffee trinken. Seitdem sind wir Freundinnen.“", "„Selin. Das ist der perfekte Anfang. Alle werden lachen. Und dann ist die Spannung weg.“", "„Aber dann lachen sie über mich.“", "„Nein. Sie lachen mit dir. Das ist ein großer Unterschied. Wenn du selbst über deinen Fehler lachst, kann dich niemand auslachen.“", "In den nächsten zwei Wochen übt Selin jeden Abend. Theo gibt ihr weitere Tipps.", "„Nicht alles auswendig lernen. Schreib Stichwörter auf Karteikarten. Wenn du den Faden verlierst, schaust du drauf.“", "„Und wenn ich trotzdem alles vergesse?“", "„Dann atmest du. Tief in den Bauch. Vier Sekunden ein, vier halten, sechs aus. Niemand merkt eine Pause von drei Sekunden. Für dich fühlt es sich an wie eine Ewigkeit. Für das Publikum ist es nur eine Pause.“", "„Und wohin soll ich schauen? Hundertzwanzig Gesichter!“", "„Such dir drei freundliche Gesichter. Eins links, eins in der Mitte, eins rechts. Schau abwechselnd zu ihnen. Und zu Annika.“", "Am Abend vor der Hochzeit macht Theo eine Generalprobe. Er setzt fünf Freunde in die Küche, und Selin hält die Rede. Ihre Stimme zittert am Anfang. Aber als sie bei der Geschichte mit dem Deutschkurs ist, lachen alle. Und sie lacht mit.", "Dann ist der Tag da. Das Fest findet in einem alten Gutshof bei Staufen statt. Nach dem Hauptgang klopft der Bräutigam an sein Glas. „Und jetzt hat Selin, Annikas Trauzeugin, noch ein paar Worte für uns.“", "Selin steht auf. Ihre Knie sind weich. Hundertzwanzig Gesichter drehen sich zu ihr. Für einen Moment ist ihr Kopf völlig leer.", "Sie atmet. Vier ein. Vier halten. Sechs aus. Sie sucht Theo – links, an Tisch vier. Er nickt ihr zu.", "„Liebe Annika, lieber Jasper, liebe Gäste. Vor acht Jahren habe ich in einem Deutschkurs einen Satz gesagt, den ich nie vergessen werde. Ich habe zu meiner Lehrerin gesagt: ‚Ich bin sehr heiß auf diesen Kurs.‘“", "Der ganze Saal lacht. Annika hält sich die Hand vor das Gesicht und lacht Tränen.", "„Ich wusste damals nicht, was das bedeutet. Aber ich weiß heute: Es war der wichtigste Fehler meines Lebens. Denn diese Lehrerin hat mich nach dem Kurs nicht ausgelacht. Sie hat mich zum Kaffee eingeladen. Und sie hat mir in acht Jahren nicht nur die deutschen Artikel erklärt, sondern auch, was Freundschaft bedeutet.“", "Die Rede dauert vier Minuten. Einmal verliert Selin den Faden und schaut auf die Karteikarte. Niemand merkt es. Am Ende hebt sie das Glas.", "„Auf Annika und Jasper. Und auf alle Fehler, die zu etwas Gutem führen.“", "Die Gäste stehen auf und klatschen. Annika kommt zu ihr, umarmt sie lange und flüstert: „Das war die schönste Rede, die ich je gehört habe. Und es heißt übrigens die Liebe. Du hast es richtig gesagt.“", "Später am Abend kommt eine ältere Frau zu Selin. Es ist Annikas Oma.", "„Junge Frau, Ihr Deutsch ist besser als das von meinem Sohn. Und der ist hier geboren.“", "Selin lacht. Ihr Herz klopft immer noch schnell. Aber jetzt fühlt es sich gut an."], "gl": [["das Lampenfieber", "stage fright"], ["die Trauzeugin", "maid of honour / witness"], ["die Rede", "speech"], ["absagen", "to cancel"], ["rasen (Herz)", "to race"], ["zittern", "to tremble"], ["verwechseln", "to mix up"], ["die Vorstellung", "performance"], ["der Aufsatz", "essay"], ["heiß auf etwas sein (ugs.)", "to be keen on sth (colloquial, can sound suggestive)"], ["die Spannung", "tension"], ["auslachen / mitlachen", "to laugh at / laugh with"], ["auswendig lernen", "to learn by heart"], ["das Stichwort", "keyword / cue"], ["die Karteikarte", "index card"], ["den Faden verlieren", "to lose the thread"], ["die Ewigkeit", "eternity"], ["die Generalprobe", "dress rehearsal"], ["der Gutshof", "estate / manor farm"], ["der Bräutigam", "bridegroom"]], "q": [["Warum will Selin die Rede absagen?", "Sie hat große Angst vor Publikum.", "Und sie fürchtet Fehler im Deutschen."], ["Was bedeutet Lampenfieber laut Theo?", "Dass einem etwas wichtig ist.", "Auch Profis haben es."], ["Warum ist die Geschichte vom Deutschkurs ein guter Anfang?", "Alle lachen, und die Spannung ist weg.", "Selin lacht mit, so kann sie niemand auslachen."], ["Welche Atemtechnik empfiehlt Theo?", "Vier Sekunden ein, vier halten, sechs aus.", "Eine kurze Pause merkt niemand."], ["Was passiert, als Selin den Faden verliert?", "Sie schaut auf die Karteikarte.", "Niemand merkt es."]], "say": ["Ich muss die Rede absagen.", "Was machst du dagegen?", "Wenn ich den Faden verliere, schaue ich auf die Karte.", "Auf Annika und Jasper!", "Das war die schönste Rede, die ich je gehört habe."]}, {"id": 71, "title": "Der Handwerker kommt", "level": "B2", "topic": "Wohnen & Dienstleistungen", "rt": "ca. 6 Min.", "teaser": "„Zwischen acht und vierzehn Uhr.“ Malik nimmt sich frei, wartet auf den Installateur – und lernt viel über Anfahrtspauschalen, Kleinreparaturen und Angebote „ohne Rechnung“.", "body": ["Seit einer Woche tropft der Wasserhahn in Maliks Küche. Erst nur nachts, dann den ganzen Tag. Tropf. Tropf. Tropf. Malik Rahimi, Grafikdesigner aus Darmstadt, hat ein Video im Internet angeschaut, eine Zange gekauft und es selbst versucht. Seitdem tropft es schneller.", "Er ruft bei der Firma Maurer Haustechnik an.", "„Maurer, guten Tag.“", "„Guten Tag, Rahimi. Mein Wasserhahn in der Küche tropft. Ich habe versucht, ihn selbst zu reparieren, aber ich glaube, ich habe es schlimmer gemacht.“", "„Das hören wir oft“, sagt die Frau am Telefon freundlich. „Wann passt es Ihnen? Ich hätte nächsten Dienstag.“", "„Dienstag geht. Um wie viel Uhr?“", "„Zwischen acht und vierzehn Uhr.“", "„Sechs Stunden? Geht es nicht genauer?“", "„Leider nicht. Unsere Monteure fahren von einem Auftrag zum nächsten, und man weiß nie, wie lange einer dauert. Er ruft Sie aber eine halbe Stunde vorher an.“", "„Und was kostet das ungefähr?“", "„Die Anfahrtspauschale beträgt neununddreißig Euro. Dann die Arbeitszeit, achtundsechzig Euro pro Stunde, abgerechnet in Viertelstunden. Und das Material. Wenn es nur eine Dichtung ist, sind Sie mit hundertzwanzig Euro dabei.“", "Malik schluckt. „Okay. Dienstag.“", "Am Abend erzählt er es seiner Nachbarin Kerstin, die im Hausflur ihre Post holt.", "„Hundertzwanzig Euro für einen Wasserhahn? Warte mal. Wohnst du zur Miete?“", "„Ja, natürlich.“", "„Dann schau mal in deinen Mietvertrag. Normalerweise muss der Vermieter Reparaturen bezahlen. Außer es gibt eine Kleinreparaturklausel. Dann zahlst du kleine Sachen selbst. Aber nur bis zu einem bestimmten Betrag. Bei mir sind es hundert Euro pro Reparatur.“", "„Und wenn es teurer ist?“", "„Dann zahlt der Vermieter alles. Nicht nur den Rest, sondern alles. Aber Achtung: Du musst ihn vorher informieren. Und wenn du es selbst kaputt gemacht hast …“", "„… dann zahle ich. Ich weiß.“ Malik schaut auf seine Zange.", "Er findet den Mietvertrag. Paragraf zwölf: Kleinreparaturen bis fünfundachtzig Euro im Einzelfall, höchstens zweihundert Euro im Jahr. Er schreibt seiner Vermieterin, Frau Haug, eine kurze Mail. Sie antwortet am nächsten Tag: „Danke für die Info. Bitte schicken Sie mir die Rechnung. Wir klären das dann.“", "Am Dienstag sitzt Malik ab acht Uhr zu Hause. Um neun trinkt er den dritten Kaffee. Um elf hat er alle E-Mails beantwortet. Um zwölf denkt er, dass niemand mehr kommt. Um 12:40 Uhr klingelt das Handy.", "„Hier ist Uwe von der Firma Maurer. Ich bin in zwanzig Minuten bei Ihnen. Hat ein bisschen länger gedauert, heute Morgen war ein Rohrbruch.“", "Uwe ist ein großer Mann mit grauem Bart und einer schweren Werkzeugtasche. Er schaut sich den Wasserhahn an und dann Malik.", "„Haben Sie da selbst rumgeschraubt?“", "„Ein bisschen. Mit einem Video aus dem Internet.“", "„Mhm. Die Dichtung ist kaputt, das war das ursprüngliche Problem. Aber jetzt ist auch das Gewinde beschädigt. Sie haben zu fest angezogen. Die Kartusche muss raus. Ich empfehle eine neue Armatur. Die alte ist zwanzig Jahre alt.“", "„Was kostet das?“", "„Mit Einbau ungefähr zweihundertvierzig Euro.“", "Malik schluckt. „Das muss ich mit meiner Vermieterin absprechen. Kann ich kurz anrufen?“", "„Klar. Ich warte.“", "Frau Haug ist am Telefon schnell einverstanden. „Die Armatur ist wirklich alt. Machen Sie das. Aber das Gewinde – ist das wegen Ihnen kaputt?“", "Malik zögert. Dann sagt er ehrlich: „Ich glaube schon. Zum Teil.“", "„Dann machen wir es so: Die Armatur zahle ich. Die Arbeitszeit teilen wir. Einverstanden?“", "„Das ist sehr fair. Danke.“", "Uwe baut die neue Armatur ein. Es dauert fünfzig Minuten. Als er fertig ist, läuft das Wasser glatt, und kein Tropfen fällt mehr.", "„So. Fertig“, sagt Uwe und packt seine Tasche. Dann senkt er die Stimme. „Ich hätte da noch ein Angebot für Sie. Ihre Duschabtrennung im Bad ist auch nicht mehr dicht. Das könnte ich am Samstag machen. Privat. Ohne Rechnung. Für die Hälfte.“", "Malik schaut ihn an. „Ohne Rechnung? Das ist doch Schwarzarbeit.“", "„Nennen wir es Nachbarschaftshilfe.“", "„Danke, aber nein. Wenn dann etwas schiefgeht, habe ich keine Gewährleistung. Und die Kosten kann ich nicht bei der Steuer angeben. Handwerkerleistungen kann man nämlich absetzen. Nur mit Rechnung und Überweisung.“", "Uwe hebt die Hände und grinst. „Sie kennen sich aus. Dann rufen Sie halt im Büro an und machen einen offiziellen Termin.“", "„Mache ich. Zwischen acht und vierzehn Uhr, nehme ich an?“", "„Sie lernen schnell“, sagt Uwe und lacht.", "Eine Woche später kommt die Rechnung: Anfahrt, eine Stunde Arbeit, Material. Malik überweist seinen Teil und schickt eine Kopie an Frau Haug. Dann legt er die Rechnung in einen Ordner mit der Aufschrift „Steuer“.", "Die Zange legt er ganz nach hinten in die Schublade. Daneben klebt er einen Zettel: „Erst anrufen. Dann schrauben. Oder besser gar nicht.“"], "gl": [["der Handwerker", "tradesman"], ["tropfen", "to drip"], ["die Zange", "pliers"], ["der Installateur / Monteur", "plumber / fitter"], ["der Auftrag", "job / order"], ["die Anfahrtspauschale", "call-out fee"], ["abrechnen", "to bill"], ["die Dichtung", "seal / washer"], ["die Kleinreparaturklausel", "minor repairs clause"], ["im Einzelfall", "in each case"], ["der Rohrbruch", "burst pipe"], ["herumschrauben (ugs.)", "to tinker"], ["das Gewinde", "thread (screw)"], ["anziehen (Schraube)", "to tighten"], ["die Armatur", "tap / fitting"], ["der Einbau", "installation"], ["dicht", "watertight"], ["die Schwarzarbeit", "undeclared work"], ["die Gewährleistung", "warranty"], ["absetzen (Steuer)", "to deduct"]], "q": [["Warum ist das Problem schlimmer geworden?", "Malik hat selbst repariert und das Gewinde beschädigt.", "Er hat zu fest angezogen."], ["Was ist eine Kleinreparaturklausel?", "Der Mieter zahlt kleine Reparaturen selbst.", "Bei Malik bis 85 € pro Fall, 200 € pro Jahr."], ["Warum ruft Malik die Vermieterin an?", "Die neue Armatur kostet mehr als die Grenze.", "Sie muss vorher informiert werden."], ["Wie teilen sie die Kosten?", "Vermieterin zahlt die Armatur, Arbeitszeit wird geteilt.", "Weil Malik teilweise schuld ist."], ["Warum lehnt Malik das Angebot ohne Rechnung ab?", "Es ist Schwarzarbeit.", "Keine Gewährleistung, keine Steuerabsetzung."]], "say": ["Geht es nicht genauer?", "Was kostet das ungefähr?", "Das muss ich mit meiner Vermieterin absprechen.", "Ohne Rechnung? Das ist doch Schwarzarbeit.", "Erst anrufen, dann schrauben."]}, {"id": 72, "title": "Die Reparatur in der Werkstatt", "level": "B2", "topic": "Auto & Dienstleistungen", "rt": "ca. 6 Min.", "teaser": "Piotrs Auto muss zur Hauptuntersuchung. Die Werkstatt findet „noch ein paar Kleinigkeiten“. Plötzlich steht auf dem Kostenvoranschlag eine Zahl, die größer ist als der Wert des Autos.", "body": ["Piotr Nowicki fährt einen silbernen Kombi, Baujahr 2011, mit hundertneunzigtausend Kilometern auf dem Tacho. Er nennt ihn „Opa“. Opa ist nicht schön, aber er springt jeden Morgen an, und er hat Piotr schon dreimal nach Breslau und zurück gebracht.", "Diese Woche muss Opa zum TÜV. Die Plakette auf dem Kennzeichen zeigt den Monat an, und der Monat ist fast vorbei.", "Am Montagmorgen bringt Piotr das Auto in die Werkstatt Kunz in Ludwigshafen. Am Empfang steht der Meister, Detlef Kunz, ein Mann mit ölverschmierten Händen und Lesebrille.", "„Guten Morgen. Nowicki. Ich habe einen Termin für die Hauptuntersuchung.“", "„Morgen. Ja, der Kombi. Wir machen vorher eine Durchsicht, damit er beim Prüfer nicht durchfällt. Der Prüfer kommt um zwei. Wenn wir was finden, rufe ich Sie an.“", "„Gut. Aber bitte rufen Sie mich an, bevor Sie etwas reparieren. Ich möchte vorher wissen, was es kostet.“", "„Natürlich. Ohne Ihre Freigabe machen wir nichts.“", "Um elf Uhr klingelt Piotrs Handy im Büro.", "„Kunz hier. Also, wir haben uns Ihr Auto angeschaut. Es gibt ein paar Kleinigkeiten.“", "„Was für Kleinigkeiten?“", "„Die Bremsscheiben vorne sind runter. Die Bremsbeläge auch. Der Auspuff hat ein Loch, hinten am Endtopf. Ein Querlenker hat Spiel. Und links vorne ist das Abblendlicht kaputt.“", "„Das klingt nicht nach Kleinigkeiten.“", "„Na ja. Die Lampe ist eine Kleinigkeit.“", "„Und was kostet das alles?“", "„Ich schicke Ihnen einen Kostenvoranschlag per Mail. Dann können Sie in Ruhe schauen.“", "Zehn Minuten später kommt die Mail. Piotr öffnet sie und muss zweimal hinschauen. Gesamtbetrag: eintausendsiebenhundertachtzig Euro.", "In der Mittagspause zeigt er die Mail seinem Kollegen Marek.", "„Siebzehnhundert Euro? Für Opa? Was ist dein Auto noch wert?“", "„Vielleicht zweitausend. Wenn man nett fragt.“", "„Dann frag dich, ob sich das lohnt. Und frag die Werkstatt, was davon wirklich für den TÜV nötig ist. Werkstätten listen manchmal alles auf, was irgendwann mal gemacht werden muss. Das ist nicht unbedingt alles heute dringend.“", "Piotr ruft zurück.", "„Herr Kunz, ich habe den Kostenvoranschlag gesehen. Darf ich fragen: Was davon ist wirklich nötig, damit das Auto heute die Plakette bekommt? Und was kann warten?“", "Am anderen Ende ist es kurz still. „Gute Frage. Ehrlich gesagt: Für den TÜV brauchen Sie die Bremsen, den Auspuff und das Licht. Ohne diese drei fällt er durch. Der Querlenker ist noch im grünen Bereich. Den würde ich in einem halben Jahr machen.“", "„Und was kostet das ohne Querlenker?“", "„Tausendzweihundertzehn.“", "„Immer noch viel. Kann man beim Auspuff sparen? Muss es ein Originalteil sein?“", "„Muss nicht. Ein Nachbauteil in guter Qualität kostet etwa die Hälfte. Hält vielleicht nicht ganz so lange, aber bei dem Alter vom Auto ist das vernünftig.“", "„Dann bitte das. Und die Bremsen – müssen alle vier Räder gemacht werden?“", "„Nur vorne. Hinten ist noch genug drauf.“", "„Dann geben Sie mir bitte frei für: Bremsen vorne, Auspuff mit Nachbauteil, Abblendlicht. Was kostet das?“", "Herr Kunz tippt etwas. „Neunhundertvierzig. Inklusive Hauptuntersuchung.“", "„Gut. Machen Sie das bitte. Und bitte schicken Sie mir die Freigabe noch einmal schriftlich, damit wir beide dieselben Zahlen haben.“", "„Mache ich. Sie sind gründlich.“", "„Ich habe einmal eine Rechnung bekommen, die doppelt so hoch war wie abgesprochen. Seitdem bin ich gründlich.“", "Um halb fünf ruft Herr Kunz wieder an. „Ihr Auto ist fertig. Der Prüfer hat die Plakette gegeben. Zwei Jahre Ruhe.“", "Als Piotr das Auto abholt, liegt die Rechnung schon auf dem Tresen. Neunhundertachtundfünfzig Euro.", "„Herr Kunz, hier steht achtzehn Euro mehr als besprochen.“", "„Ah ja. Die Glühbirne für das Abblendlicht war eine andere als gedacht. Bei Ihrem Modell muss man die ganze Scheinwerfereinheit lockern. Das hat länger gedauert. Ich hätte anrufen sollen, Sie haben recht.“", "Piotr überlegt kurz. Achtzehn Euro. Ein Missverständnis, kein Trick.", "„Okay. Das ist in Ordnung. Aber beim nächsten Mal bitte kurz Bescheid geben.“", "„Versprochen. Und ich schreibe Ihnen den Querlenker in den Kalender. In sechs Monaten erinnern wir Sie.“", "„Und ehrlich, Herr Kunz: Lohnt sich das noch bei dem Auto?“", "Herr Kunz klopft auf das Dach des Kombis. „Der Motor ist gut. Die Karosserie hat kaum Rost. Wenn Sie ihn pflegen, fährt er noch drei, vier Jahre. Ein neues Auto kostet zwanzigtausend. Rechnen Sie selbst.“", "Auf dem Heimweg fährt Piotr langsamer als sonst. Die neuen Bremsen greifen weich. Der Auspuff ist leise. Und das linke Licht leuchtet wieder.", "Zu Hause schreibt er seinem Vater in Breslau: „Opa hat den TÜV geschafft. Noch zwei Jahre.“", "Sein Vater antwortet mit einem Daumen. Und dann: „Und die Werkstatt? Haben sie dich über den Tisch gezogen?“", "Piotr schreibt zurück: „Nein. Ich habe Fragen gestellt.“"], "gl": [["die Werkstatt", "garage / workshop"], ["der Kombi", "estate car"], ["der Tacho", "speedometer / odometer"], ["der TÜV / die Hauptuntersuchung", "vehicle inspection (MOT)"], ["die Plakette", "inspection sticker"], ["die Durchsicht", "inspection / check"], ["durchfallen", "to fail"], ["die Freigabe", "approval"], ["die Bremsscheibe / der Bremsbelag", "brake disc / brake pad"], ["der Auspuff / der Endtopf", "exhaust / rear silencer"], ["der Querlenker", "control arm"], ["das Abblendlicht", "dipped headlight"], ["der Kostenvoranschlag", "cost estimate"], ["im grünen Bereich", "within acceptable limits"], ["das Nachbauteil", "aftermarket part"], ["gründlich", "thorough"], ["der Tresen", "counter"], ["die Karosserie", "body (of a car)"], ["der Rost", "rust"], ["über den Tisch ziehen", "to rip off"]], "q": [["Was sagt Piotr am Anfang zum Meister?", "Er soll vor jeder Reparatur anrufen.", "Ohne Freigabe nichts machen."], ["Welchen Rat gibt Marek?", "Fragen, was für den TÜV wirklich nötig ist.", "Nicht alles im Kostenvoranschlag ist sofort dringend."], ["Wie spart Piotr Geld?", "Querlenker später, Nachbauteil für den Auspuff, nur vordere Bremsen.", "Von 1.780 € auf 940 €."], ["Warum ist die Rechnung höher?", "Die Lampe war aufwendiger zu wechseln.", "Der Meister hätte anrufen müssen."], ["Warum lohnt sich die Reparatur laut Kunz?", "Motor und Karosserie sind gut.", "Ein neues Auto kostet viel mehr."]], "say": ["Bitte rufen Sie mich an, bevor Sie etwas reparieren.", "Was davon ist wirklich nötig?", "Was kann warten?", "Bitte schicken Sie mir die Freigabe schriftlich.", "Hier steht mehr als besprochen."]}, {"id": 73, "title": "Der Anruf beim Kundenservice", "level": "B2", "topic": "Verbraucher & Kommunikation", "rt": "ca. 6 Min.", "teaser": "Seit neun Tagen kein Internet. Arne arbeitet im Homeoffice und hängt zum vierten Mal in der Warteschleife. Diesmal will er nicht nur einen Techniker – sondern sein Geld.", "body": ["„Herzlich willkommen beim Kundenservice von Netzwelt. Wenn Sie Fragen zu Ihrer Rechnung haben, drücken Sie die Eins. Bei technischen Problemen drücken Sie die Zwei.“", "Arne Lindholm drückt die Zwei. Zum vierten Mal in neun Tagen.", "„Bitte nennen Sie in wenigen Worten Ihr Anliegen.“", "„Kein Internet“, sagt Arne laut und deutlich.", "„Ich habe verstanden: Kein Interesse. Möchten Sie Ihren Vertrag kündigen?“", "„NEIN! Kein INTERNET!“", "„Einen Moment bitte. Sie werden mit dem nächsten freien Mitarbeiter verbunden. Die voraussichtliche Wartezeit beträgt … zweiundzwanzig … Minuten.“", "Arne legt das Handy auf den Schreibtisch, stellt den Lautsprecher an und lehnt sich zurück. Er ist Übersetzer und arbeitet von zu Hause in Kiel. Seit neun Tagen sitzt er mit seinem Laptop im Café um die Ecke, weil der Router zu Hause nur rot blinkt. Er hat schon dreimal angerufen. Jedes Mal hieß es: „Wir haben eine Störung in Ihrem Gebiet. Ein Techniker ist informiert.“", "Seine Freundin Linnea kommt mit zwei Tassen Tee ins Zimmer.", "„Wieder Warteschleife?“", "„Zweiundzwanzig Minuten. Diesmal bleibe ich ruhig. Ich habe mir alles aufgeschrieben.“ Er zeigt auf einen Zettel: Ticketnummern, Daten, Uhrzeiten der letzten Anrufe.", "„Und was willst du diesmal erreichen?“", "„Drei Dinge. Einen festen Termin für den Techniker. Eine Gutschrift für die Tage ohne Internet. Und ich will wissen, was meine Rechte sind.“", "„Hast du dich informiert?“", "„Bei der Bundesnetzagentur. Wenn das Internet komplett ausfällt, muss der Anbieter die Störung schnell beheben. Und wenn das nicht passiert, gibt es ab einem bestimmten Tag eine Entschädigung pro Tag. Außerdem darf man den Preis mindern, wenn die Leistung dauerhaft viel schlechter ist als vereinbart.“", "Nach neunzehn Minuten knackt es in der Leitung.", "„Netzwelt Kundenservice, mein Name ist Frau Ritter. Was kann ich für Sie tun?“", "„Guten Tag, Frau Ritter. Lindholm, Kundennummer 5520-117. Ich habe seit neun Tagen kein Internet. Das ist mein vierter Anruf. Die Ticketnummer ist T-883412.“", "„Einen Moment, ich schaue mir das an.“ Man hört Tippen. „Ja, ich sehe Ihre Meldungen. Es gibt eine Störung im Verteilerkasten in Ihrer Straße. Ein Techniker ist informiert.“", "Arne atmet ruhig. „Frau Ritter, das hat man mir auch am zweiten, am fünften und am siebten Tag gesagt. Ich weiß, dass Sie die Störung nicht persönlich verursacht haben. Aber ich arbeite von zu Hause und kann seit neun Tagen nicht richtig arbeiten. Ich brauche heute einen festen Termin.“", "„Ich verstehe Ihren Ärger. Lassen Sie mich schauen, ob ich etwas machen kann.“", "Musik. Zwei Minuten. Dann ist sie wieder da.", "„Ich habe mit der Technik gesprochen. Der Verteilerkasten wurde bei Bauarbeiten beschädigt. Das Ersatzteil ist gestern gekommen. Der Techniker ist morgen zwischen zehn und zwölf bei Ihnen in der Straße. Danach müsste es wieder funktionieren.“", "„Danke. Das ist das erste Mal, dass ich einen konkreten Termin höre. Können Sie mir das bitte schriftlich bestätigen?“", "„Ich schicke Ihnen gleich eine SMS und eine E-Mail.“", "„Sehr gut. Dann der zweite Punkt. Ich habe neun Tage für einen Dienst bezahlt, den ich nicht bekommen habe. Ich möchte eine Gutschrift.“", "„Das kann ich verstehen. Ich kann Ihnen eine Gutschrift über die anteilige Grundgebühr für die Ausfalltage anbieten.“", "„Und die gesetzliche Entschädigung? Soweit ich weiß, steht mir bei einem kompletten Ausfall nach einer bestimmten Zeit eine Entschädigung pro Tag zu.“", "Kurze Pause. „Da haben Sie recht. Ich sehe, dass Sie Ihre Störung am ersten Tag gemeldet haben. Dann haben Sie Anspruch darauf. Ich trage das ein. Die Entschädigung wird mit der nächsten Rechnung verrechnet.“", "„Wie viel ist das ungefähr?“", "„Das wird nach den gesetzlichen Vorgaben berechnet. Sie bekommen die genaue Zahl mit der Abrechnung. Wenn Sie nicht einverstanden sind, können Sie sich an die Schlichtungsstelle wenden. Das steht auch in der Mail.“", "„Gut. Und eine letzte Frage: Kann ich in der Zwischenzeit irgendwie arbeiten?“", "„Ich kann Ihnen einen mobilen Hotspot schicken. Mit unbegrenztem Datenvolumen, bis die Leitung wieder läuft. Der kommt morgen per Express. Kostenlos.“", "Arne schaut Linnea an. Sie hebt beide Daumen.", "„Frau Ritter, warum hat mir das niemand vor neun Tagen angeboten?“", "„Ehrlich gesagt: Weil Sie heute der Erste sind, der so gut vorbereitet ist. Und so freundlich bleibt. Die meisten schreien mich nach zwei Minuten an.“", "„Das tut mir leid. Das ist sicher ein schwerer Job.“", "„Manchmal. Aber Anrufe wie Ihrer machen ihn leichter. Gibt es sonst noch etwas?“", "„Nein. Vielen Dank. Wirklich.“", "Am nächsten Tag um 11:20 Uhr hört das Lämpchen am Router auf, rot zu blinken. Es leuchtet grün. Arne schickt sofort eine E-Mail an seine Auftraggeber. Dann schreibt er eine kurze Bewertung für den Kundenservice: „Neun Tage Ärger, ein sehr gutes Gespräch. Danke, Frau Ritter.“", "Den Zettel mit den Ticketnummern hängt er an die Pinnwand. „Für das nächste Mal“, sagt er zu Linnea.", "„Hoffentlich gibt es kein nächstes Mal.“", "„Hoffentlich. Aber wenn doch: Ich weiß jetzt, wie es geht.“"], "gl": [["der Kundenservice", "customer service"], ["das Anliegen", "concern / request"], ["kündigen", "to cancel (a contract)"], ["verbinden", "to connect / put through"], ["der Router", "router"], ["die Störung", "fault / outage"], ["die Ticketnummer", "ticket / reference number"], ["die Gutschrift", "credit (note)"], ["die Bundesnetzagentur", "Federal Network Agency"], ["der Anbieter", "provider"], ["beheben", "to fix / remedy"], ["die Entschädigung", "compensation"], ["mindern", "to reduce (price)"], ["der Verteilerkasten", "street cabinet"], ["das Ersatzteil", "spare part"], ["anteilig", "proportional"], ["die Grundgebühr", "basic fee"], ["verrechnen", "to offset"], ["die Schlichtungsstelle", "arbitration board"], ["das Datenvolumen", "data allowance"]], "q": [["Was ist schon beim ersten Versuch schiefgegangen?", "Der Sprachcomputer versteht „kein Interesse“.", "Er fragt, ob Arne kündigen will."], ["Wie bereitet sich Arne vor?", "Mit Ticketnummern, Daten und Uhrzeiten.", "Und er informiert sich über seine Rechte."], ["Welche drei Ziele hat Arne?", "Festen Termin, Gutschrift/Entschädigung, Infos zu seinen Rechten.", "Er erreicht alle drei."], ["Was bekommt Arne zusätzlich?", "Einen kostenlosen mobilen Hotspot.", "Bis die Leitung wieder funktioniert."], ["Warum hilft Frau Ritter so gut?", "Arne ist vorbereitet und bleibt freundlich.", "Die meisten schreien sie an."]], "say": ["Ich habe seit neun Tagen kein Internet.", "Ich brauche heute einen festen Termin.", "Können Sie mir das schriftlich bestätigen?", "Ich möchte eine Gutschrift.", "Das ist sicher ein schwerer Job."]}, {"id": 74, "title": "Das Fitnessstudio kündigen", "level": "B2", "topic": "Verträge & Verbraucherrechte", "rt": "ca. 6 Min.", "teaser": "Halil war seit acht Monaten nicht mehr im Fitnessstudio, zahlt aber jeden Monat. Kündigen sollte einfach sein. Doch an der Theke wartet ein sehr motivierter Trainer.", "body": ["Halil Öztürk hat einen Kontoauszug in der Hand und rechnet. Neununddreißig Euro neunzig im Monat. Seit acht Monaten. Und in diesen acht Monaten war er genau zweimal im Fitnessstudio „PowerFit“. Einmal im Januar, voller guter Vorsätze. Und einmal im Februar, um sein Handtuch zu holen, das er im Januar vergessen hatte.", "„Das sind über dreihundert Euro für zwei Besuche“, sagt er zu seiner Schwester Nuray, die gerade zum Kaffee vorbeigekommen ist. „Ich kündige. Heute noch.“", "„Das sagst du seit Mai.“", "„Diesmal wirklich. Wie lange läuft der Vertrag eigentlich noch?“", "Nuray nimmt den Vertrag in die Hand und liest. „Mindestlaufzeit vierundzwanzig Monate. Abgeschlossen vor zweieinhalb Jahren. Die sind also schon vorbei.“", "„Und jetzt? Verlängert er sich nicht automatisch um ein Jahr? Das hat mir ein Kollege erzählt.“", "„Früher war das oft so. Aber bei neueren Verträgen gilt: Nach der Mindestlaufzeit verlängert sich der Vertrag nur noch auf unbestimmte Zeit, und du kannst jederzeit mit einer Frist von einem Monat kündigen. Das ist ein Gesetz von 2022. Dein Vertrag ist von danach, also gilt es für dich.“", "„Und wie kündige ich? Muss ich einen Brief schreiben?“", "„Schau mal auf die Website. Unternehmen, die Verträge online anbieten, müssen auch einen Kündigungsbutton haben. Aber ehrlich gesagt würde ich persönlich hingehen. Dann kannst du dir die Bestätigung gleich geben lassen.“", "Am Nachmittag steht Halil an der Theke von PowerFit. Hinter ihm dröhnt Musik, vor ihm steht ein junger Mann mit sehr großen Armen und einem sehr breiten Lächeln. Auf seinem T-Shirt steht: Coach Dominik.", "„Hey! Was kann ich für dich tun? Training?“", "„Nein, danke. Ich möchte meine Mitgliedschaft kündigen.“", "Das Lächeln wird ein bisschen kleiner. „Oh. Schade. Darf ich fragen, warum?“", "„Ich komme nicht. Seit acht Monaten nicht.“", "„Verstehe. Das geht vielen so. Weißt du, was ich dir anbieten kann? Wir können deine Mitgliedschaft pausieren. Drei Monate kostenlos. Dann hast du Zeit, wieder reinzukommen.“", "„Danke, aber ich will nicht pausieren. Ich will kündigen.“", "„Okay. Aber wir hätten auch ein Personal Training. Drei Einheiten. Mit mir. Dann bekommst du einen individuellen Plan. Viele Leute brauchen einfach einen Startschuss.“", "Halil merkt, wie er unsicher wird. Coach Dominik ist sehr nett. Und vielleicht hat er recht? Dann denkt er an den Kontoauszug.", "„Das ist ein nettes Angebot. Aber nein. Ich möchte heute kündigen, zum nächstmöglichen Zeitpunkt.“", "Dominik seufzt und tippt in den Computer. „Okay. Deine Mindestlaufzeit ist vorbei. Dann kannst du mit einem Monat Frist kündigen. Letzter Trainingstag wäre dann der dreißigste des nächsten Monats.“", "„Super. Kann ich eine schriftliche Bestätigung bekommen?“", "„Die schicken wir dir per E-Mail. Das dauert ein paar Tage.“", "„Ich hätte sie gern jetzt. Ausgedruckt oder per Mail, während ich hier stehe. Mit Datum und dem Enddatum des Vertrags.“", "Dominik schaut kurz überrascht, dann nickt er. „Klar. Moment.“ Der Drucker summt. Er reicht Halil ein Blatt. Kündigungsbestätigung. Vertragsende: 30. des nächsten Monats.", "„Und die Lastschrift? Wird die automatisch beendet?“", "„Ja, mit dem Vertragsende. Die letzte Abbuchung ist für den nächsten Monat.“", "„Danke. Wirklich.“", "Dominik lehnt sich auf die Theke. „Darf ich dir noch was sagen? Ganz ehrlich, nicht als Verkäufer?“", "„Klar.“", "„Wenn du wieder Sport machen willst, such dir etwas, das dir Spaß macht. Nicht etwas, wovon du denkst, dass du es machen solltest. Bei vielen ist das Studio nicht das Richtige. Die gehen lieber laufen oder schwimmen. Oder in einen Verein.“", "Halil ist überrascht. „Das ist ein guter Rat. Danke.“", "„Und wenn du doch zurückkommst – Personal Training ist immer noch drin.“", "Halil lacht. „Natürlich.“", "Zu Hause zeigt er Nuray die Bestätigung.", "„Und?“, fragt sie. „Hat er versucht, dich zu überreden?“", "„Zweimal. Pause und Personal Training. Fast hätte ich ja gesagt.“", "„Aber?“", "„Aber ich hatte den Kontoauszug im Kopf.“", "Zwei Wochen später sieht Nuray auf Instagram ein Foto von ihrem Bruder. Er steht in Sportkleidung auf einem Fußballplatz, zusammen mit zehn anderen Männern. Darunter steht: „Erstes Training bei den Alten Herren vom SV Wiesloch. Kostet zehn Euro im Monat. Und macht Spaß.“", "Sie schreibt einen Kommentar: „Zehn Euro! Und wie oft warst du schon?“", "Er antwortet: „Zweimal. Diese Woche.“"], "gl": [["kündigen / die Kündigung", "to cancel / cancellation"], ["der Kontoauszug", "bank statement"], ["der gute Vorsatz", "(New Year's) resolution"], ["die Mindestlaufzeit", "minimum term"], ["sich verlängern", "to be extended / renew"], ["auf unbestimmte Zeit", "indefinitely"], ["die Frist", "notice period"], ["der Kündigungsbutton", "online cancellation button"], ["die Bestätigung", "confirmation"], ["dröhnen", "to boom / blare"], ["die Mitgliedschaft", "membership"], ["pausieren", "to pause"], ["die Einheit", "session / unit"], ["der Startschuss", "kick-off"], ["zum nächstmöglichen Zeitpunkt", "at the earliest possible date"], ["die Lastschrift", "direct debit"], ["die Abbuchung", "debit"], ["überreden", "to persuade"], ["der Verein", "club"], ["die Alten Herren", "veterans' team (football)"]], "q": [["Warum will Halil kündigen?", "Er war in acht Monaten nur zweimal da.", "Er zahlt trotzdem jeden Monat."], ["Was gilt nach der Mindestlaufzeit?", "Bei neueren Verträgen: monatlich kündbar.", "Keine automatische Verlängerung um ein Jahr mehr."], ["Welche Alternativen bietet Dominik an?", "Eine Pause und Personal Training.", "Halil lehnt beides ab."], ["Warum besteht Halil auf einer sofortigen Bestätigung?", "Damit er einen Nachweis mit Enddatum hat.", "Eine Mail \"in ein paar Tagen\" ist unsicher."], ["Welchen ehrlichen Rat gibt Dominik?", "Sport machen, der Spaß macht.", "Nicht das, was man machen sollte."]], "say": ["Ich möchte meine Mitgliedschaft kündigen.", "Danke, aber ich will nicht pausieren.", "Zum nächstmöglichen Zeitpunkt, bitte.", "Kann ich eine schriftliche Bestätigung bekommen?", "Das ist ein guter Rat, danke."]}, {"id": 75, "title": "Die Reklamation beim Internetanbieter", "level": "B2", "topic": "Verbraucherrechte & Schriftverkehr", "rt": "ca. 6 Min.", "teaser": "Zofia zahlt für 250 Mbit/s und bekommt 60. Statt anzurufen, misst sie – dreißigmal, an drei Tagen. Dann schreibt sie mit ihrem Nachbarn einen Brief, der Wirkung zeigt.", "body": ["Zofia Marciniak ist Videocutterin und arbeitet oft von zu Hause in Bremen. Vor einem halben Jahr hat sie einen neuen Internetvertrag abgeschlossen: „bis zu 250 Mbit/s“, neunundvierzig Euro im Monat. Seitdem dauert das Hochladen eines Films nicht kürzer, sondern länger.", "Heute Abend sitzt sie im Treppenhaus auf der Stufe, weil ihr Nachbar Bodo gerade seine Einkäufe hochträgt. Bodo ist pensionierter Nachrichtentechniker und hilft allen im Haus mit Computern.", "„Bodo, kannst du mir eine Frage beantworten? Was heißt eigentlich ‚bis zu‘ beim Internet?“", "„Das heiß
