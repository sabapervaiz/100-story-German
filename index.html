"„Ich hatte keine Liste.“", "„Was hast du denn gebraucht?“", "Henrike denkt nach. „Eigentlich … eine Winterjacke. Meine hat ein Loch.“", "„Und hast du eine Winterjacke gekauft?“", "Henrike schaut auf ihre fünf Tüten. Dann auf Dilaras eine Tüte. Dann lacht sie und legt die Stirn auf den Tisch.", "„Ich habe hundertsechzig Euro ausgegeben. Und ich friere immer noch.“", "„Aber du hast eine Ananas-Lampe.“", "„Eine sehr schöne Ananas-Lampe“, murmelt Henrike in den Tisch.", "„Weißt du was? Die meisten Sachen kannst du zurückbringen. Die T-Shirts und die Sandalen waren nicht reduziert, oder? Und der Pullover?“", "„Reduziert. Ausgeschlossen vom Umtausch.“", "„Dann bleibt der Pullover. Und du nimmst wirklich zwei Kilo ab“, sagt Dilara grinsend.", "Am nächsten Samstag gehen sie noch einmal los. Diesmal hat Henrike eine Liste. Darauf steht nur ein Wort, dreimal unterstrichen: WINTERJACKE.", "Sie findet eine, rot, warm, um vierzig Prozent reduziert. Sie prüft die Nähte und vergleicht den Preis online. Erst dann bezahlt sie.", "„Ich bin stolz auf dich“, sagt Dilara.", "„Ich auch“, sagt Henrike. „Aber die Ananas-Lampe behalte ich. Die macht mich glücklich. Und das ist auch etwas wert.“"], "gl": [["der Schlussverkauf / der Sale", "clearance sale"], ["das Schnäppchen", "bargain"], ["Alles muss raus!", "Everything must go!"], ["dehnbar", "stretchy / flexible"], ["der Kleiderständer", "clothes rack"], ["der Bügel", "hanger"], ["leuchtend", "bright"], ["anstrengend", "exhausting / tiresome"], ["schlicht", "plain / simple"], ["reduziert", "reduced"], ["der Preisvergleich", "price comparison"], ["der Rabatt", "discount"], ["mittlerweile", "by now / meanwhile"], ["der Ausverkaufspreis", "sale price"], ["vom Umtausch ausgeschlossen", "not exchangeable"], ["die Naht", "seam"], ["der Knopf", "button"], ["abnehmen", "to lose weight"], ["frieren", "to be cold / freeze"], ["unterstreichen", "to underline"]], "q": [["Warum hat Dilara eine Liste?", "Damit sie keine spontanen Käufe macht.", "Wintermantel, Stiefel, eventuell eine Tasche."], ["Wann ist ein Rabatt für Dilara kein Schnäppchen?", "Wenn man es auch zum vollen Preis nicht kaufen würde.", "Wie das orange Kleid."], ["Warum scannt Dilara den Barcode?", "Für einen Preisvergleich.", "Manche „Statt“-Preise sind künstlich hoch."], ["Was bedeutet „vom Umtausch ausgeschlossen“?", "Man kann nicht zurückgeben, nur weil es nicht gefällt.", "Bei einem Fehler gilt die Gewährleistung trotzdem."], ["Was ist Henrikes Problem am Ende?", "Sie hat viel gekauft, aber keine Winterjacke.", "Sie friert immer noch."]], "say": ["Ich habe mir eine Liste gemacht.", "Würdest du das zum vollen Preis kaufen?", "Ist das nicht verboten?", "Kann ich das zurückbringen?", "Das ist auch etwas wert."]}, {"id": 52, "title": "Der Fehlkauf", "level": "B2", "topic": "Online-Shopping & Widerruf", "rt": "ca. 6 Min.", "teaser": "Der Schreibtisch aus dem Internet ist riesig, schwer und passt nicht ins Zimmer. Konrad hat 14 Tage Zeit – und ein Paket von 38 Kilo.", "body": ["Um 9:15 Uhr klingelt es. Vor der Tür steht ein Paketbote, rot im Gesicht, und neben ihm ein Karton, der größer ist als Konrads Kühlschrank.", "„Wendler? Ihr Schreibtisch. Achtunddreißig Kilo. Wo soll der hin?“", "„Oh. Ins Arbeitszimmer. Zweiter Stock. Ich helfe Ihnen.“", "Zu zweit tragen sie den Karton die Treppe hoch. Als der Bote wieder weg ist, steht Konrad im Arbeitszimmer und schaut von dem Karton zur Wand und zurück.", "Er hatte den höhenverstellbaren Schreibtisch nachts um eins bestellt, nach einem langen Tag mit Rückenschmerzen. Elektrisch, mit Memory-Funktion, Eichendekor. Vierhundertneunundzwanzig Euro. Auf dem Foto sah er elegant aus.", "Am Abend kommt seine Freundin Sanna vorbei. Der Tisch ist aufgebaut. Er nimmt das halbe Zimmer ein.", "„Konrad. Das ist kein Schreibtisch. Das ist ein Flugzeugträger.“", "„Ich habe ‚160 × 80‘ gelesen und gedacht, das sind Zentimeter wie bei einem normalen Tisch.“", "„Das sind Zentimeter. Das ist ja das Problem. Dein Zimmer ist zwei Meter zwanzig breit. Du kommst nicht mehr ans Fenster.“", "„Ich weiß. Und das Eichendekor sieht in echt aus wie Plastik. Und wenn er hochfährt, macht er ein Geräusch wie ein Zahnarztbohrer.“", "„Dann schick ihn zurück.“", "„Ich habe ihn schon aufgebaut. Mit Schrauben. Ich habe den Karton zerschnitten.“", "Sanna setzt sich auf den Bürostuhl. „Bei Online-Käufen hast du vierzehn Tage Widerrufsrecht. Ohne Grund. Wann ist das Paket gekommen?“", "„Heute Morgen.“", "„Dann hast du vierzehn Tage ab heute. Lies mal die Bedingungen im Shop.“", "Konrad öffnet den Laptop. Unter „Widerrufsbelehrung“ liest er laut vor:", "„Sie haben das Recht, binnen vierzehn Tagen ohne Angabe von Gründen diesen Vertrag zu widerrufen … Wir tragen die Kosten der Rücksendung nicht. Die Kosten werden auf höchstens etwa neunzig Euro geschätzt.“", "„Neunzig Euro?“", "„Für eine Speditionsware. Weil sie so schwer ist.“", "„Das ist viel Geld für einen Fehler um ein Uhr nachts“, sagt Sanna. „Was steht da noch?“", "„‚Sie müssen für einen etwaigen Wertverlust der Waren nur aufkommen, wenn dieser Wertverlust auf einen Umgang mit ihnen zurückzuführen ist, der zur Prüfung der Beschaffenheit, Eigenschaften und Funktionsweise nicht notwendig war.‘“", "„Übersetzung bitte.“", "„Ich glaube: Ich darf ihn ausprobieren, wie im Laden. Aber wenn ich ihn kaputt mache oder benutze, als wäre es meiner, muss ich vielleicht etwas bezahlen.“", "„Aufbauen ist okay, denke ich. Im Laden würdest du ja auch prüfen, ob er hochfährt. Aber du musst ihn ordentlich zurückschicken. Ohne Kratzer.“", "„Und der Karton?“", "„Die Originalverpackung ist keine Pflicht. Aber er muss gut verpackt sein.“", "Am nächsten Tag ruft Konrad beim Kundenservice an. Nach zehn Minuten Warteschleife meldet sich ein Mann namens Herr Jablonski.", "„Guten Tag. Ich möchte von meinem Widerrufsrecht Gebrauch machen. Ich habe einen Schreibtisch bestellt, Bestellnummer 4471-883. Er ist leider zu groß für mein Zimmer.“", "„Das tut mir leid. Darf ich fragen, ob der Tisch aufgebaut wurde?“", "„Ja, zum Testen. Er ist unbeschädigt. Ich baue ihn wieder ab.“", "„In Ordnung. Den Widerruf habe ich notiert, Sie bekommen gleich eine Bestätigung per E-Mail. Die Abholung durch die Spedition kostet Sie neunundachtzig Euro, die ziehen wir von der Erstattung ab.“", "Konrad atmet tief durch. „Darf ich etwas vorschlagen? Auf Ihrer Seite gibt es dasselbe Modell in 120 × 70, in Weiß. Das hätte ich eigentlich bestellen sollen. Wenn ich das stattdessen kaufe – könnten Sie die Rücksendekosten übernehmen?“", "Kurze Pause. „Das ist kein Umtausch im rechtlichen Sinne. Aber einen Moment, ich frage meine Teamleitung.“", "Nach drei Minuten Musik ist er wieder da. „Wir können Folgendes machen: Die Spedition holt den großen Tisch ab und bringt gleichzeitig den kleinen. Dann fällt nur eine Fahrt an, und wir verzichten auf die Rücksendekosten. Der kleine kostet dreihundertneunundsiebzig Euro. Sie bekommen die Differenz von fünfzig Euro zurück.“", "„Das ist sehr fair. Vielen Dank.“", "„Gern. Kleiner Tipp, ganz privat: Vor dem Bestellen mit Malerkrepp die Maße auf den Boden kleben. Das machen viele Kunden inzwischen.“", "Am Abend klebt Konrad mit Sanna ein Rechteck aus blauem Klebeband auf den Boden: 120 × 70. Es passt neben das Fenster. Man kann noch vorbeigehen.", "„Siehst du“, sagt Sanna. „Viel besser.“", "„Ich habe drei Dinge gelernt“, sagt Konrad. „Erstens: Vierzehn Tage Widerruf, aber die Rücksendung kann teuer sein. Zweitens: Fragen kostet nichts. Und drittens …“", "„… nachts um eins bestellt man keine Möbel.“", "„Genau. Nachts um eins bestellt man höchstens Pizza.“"], "gl": [["der Fehlkauf", "bad purchase"], ["der Paketbote", "parcel courier"], ["höhenverstellbar", "height-adjustable"], ["das Eichendekor", "oak-effect finish"], ["der Flugzeugträger", "aircraft carrier"], ["das Widerrufsrecht", "right of withdrawal"], ["die Widerrufsbelehrung", "cancellation policy"], ["binnen", "within"], ["die Rücksendung", "return shipment"], ["die Speditionsware", "freight-delivered goods"], ["der Wertverlust", "loss of value"], ["aufkommen für", "to pay for"], ["die Beschaffenheit", "condition / nature"], ["der Kratzer", "scratch"], ["Gebrauch machen von", "to make use of"], ["unbeschädigt", "undamaged"], ["die Erstattung", "refund"], ["verzichten auf", "to waive / do without"], ["die Differenz", "difference"], ["das Malerkrepp", "masking tape"]], "q": [["Warum ist der Schreibtisch ein Fehlkauf?", "Er ist zu groß für das Zimmer.", "Außerdem sieht er billig aus und ist laut."], ["Wie lange hat Konrad Zeit für den Widerruf?", "Vierzehn Tage ab Erhalt.", "Er muss keinen Grund nennen."], ["Wer zahlt normalerweise die Rücksendung?", "Laut Shop Konrad, etwa 90 Euro.", "Weil es Speditionsware ist."], ["Darf er den Tisch aufbauen?", "Ja, zum Prüfen wie im Laden.", "Er muss ihn aber unbeschädigt zurückgeben."], ["Welche Lösung findet der Kundenservice?", "Austausch gegen ein kleineres Modell ohne Rücksendekosten.", "Konrad bekommt 50 Euro Differenz zurück."]], "say": ["Ich möchte von meinem Widerrufsrecht Gebrauch machen.", "Er ist leider zu groß für mein Zimmer.", "Darf ich etwas vorschlagen?", "Könnten Sie die Kosten übernehmen?", "Fragen kostet nichts."]}, {"id": 53, "title": "Stau auf der A8", "level": "B2", "topic": "Verkehr & Reisen", "rt": "ca. 6 Min.", "teaser": "Familie Hollmann will zu Omas 80. nach München. Am Drackensteiner Hang geht nichts mehr – Zeit für Rettungsgasse, Geduld und ein Ratespiel.", "body": ["Freitag, 14:30 Uhr. Der Kofferraum ist voll, die Kinder sind angeschnallt, und Rüdiger Hollmann startet den Motor.", "„So. Zweieinhalb Stunden nach München. Um fünf sind wir bei Oma.“", "Seine Frau Sevgi schaut von ihrem Handy auf. „Freitagnachmittag. Ferienbeginn in Baden-Württemberg. Auf der A8. Bist du sicher?“", "„Ganz sicher. Ich habe extra Urlaub genommen, damit wir früh fahren.“", "Auf der Rückbank fragt Ella, sieben Jahre alt: „Sind wir bald da?“", "„Ella, wir sind noch nicht mal aus der Garage raus.“", "Bis Kirchheim läuft alles gut. Dann zeigt die Anzeigetafel über der Autobahn: Stau zwischen Aichelberg und Mühlhausen, 12 km. Kurz darauf blinken vor ihnen die Warnblinker.", "„Na toll“, murmelt Rüdiger und schaltet ebenfalls den Warnblinker ein.", "„Papa, warum machst du das Blinklicht an?“, fragt Jonte, zehn.", "„Damit die Autos hinter uns wissen, dass wir bremsen. Am Stauende passieren die meisten Unfälle.“", "Nach zehn Minuten stehen sie. Ganz. Sevgi öffnet die Navi-App.", "„Unfall am Albaufstieg. Vollsperrung in Richtung München. Voraussichtliche Verzögerung: neunzig Minuten.“", "„Neunzig Minuten?“, ruft Ella. „Dann verpassen wir den Kuchen!“", "„Oma hebt dir ein Stück auf. Ganz bestimmt.“", "Plötzlich hört man von weit hinten eine Sirene. Rüdiger schaut in den Rückspiegel.", "„Rettungsgasse! Alle nach außen!“", "Er lenkt so weit nach links, wie es geht. Auf der rechten Spur fahren die Autos nach rechts. In der Mitte entsteht ein Korridor.", "„Warum fährst du nach links? Wir sind doch auf der linken Spur“, fragt Jonte.", "„Genau deshalb. Die Regel ist: Wer ganz links fährt, fährt nach links. Alle anderen fahren nach rechts. Dann ist die Gasse zwischen der linken und der mittleren Spur.“", "„Und wenn es nur zwei Spuren gibt?“", "„Dann links nach links, rechts nach rechts. Und das muss man schon machen, wenn es stockt. Nicht erst, wenn das Blaulicht kommt.“", "Ein Notarztwagen rast durch die Gasse. Dann ein Feuerwehrauto. Dann noch eins.", "„Und was ist mit dem?“, fragt Sevgi und zeigt nach vorn. Ein schwarzer Geländewagen hat sich hinter das Feuerwehrauto gesetzt und fährt in der Rettungsgasse mit.", "„Unglaublich“, sagt Rüdiger. „Das ist verboten. Da gibt es ein hohes Bußgeld und Fahrverbot.“", "Fünfhundert Meter weiter steht der Geländewagen am Rand. Daneben ein Polizeiauto. Ein Polizist schreibt etwas auf.", "„Ha!“, sagt Jonte zufrieden.", "Nach einer halben Stunde steigen die ersten Leute aus. Ein Mann im Auto neben ihnen macht Dehnübungen auf dem Seitenstreifen. Eine Frau verteilt Gummibärchen an Kinder in den Nachbarautos.", "„Darf ich auch aussteigen?“, fragt Ella.", "„Nein, Schatz“, sagt Sevgi. „Man bleibt besser im Auto oder hinter der Leitplanke. Wenn es plötzlich weitergeht, ist es auf der Fahrbahn gefährlich.“", "„Mir ist langweilig.“", "„Dann spielen wir was“, sagt Rüdiger. „Ich sehe was, was du nicht siehst, und das ist … gelb.“", "„Der Lkw!“", "„Nein.“", "„Das Schild!“", "„Nein.“", "„Mamas Gummibärchen!“", "„Was für Gummibärchen?“, fragt Sevgi unschuldig, aber Ella hat die Tüte in ihrer Handtasche schon gesehen.", "Rüdiger ruft seine Mutter an.", "„Mama, wir stehen im Stau bei Aichelberg. Vollsperrung. Es wird später, vielleicht sieben.“", "„Ach, Rüdiger! Ich habe es gerade im Radio gehört. Ist bei euch alles in Ordnung?“", "„Ja, uns geht es gut. Es ist vorne ein Unfall passiert. Die Rettungskräfte sind alle durch.“", "„Hauptsache, euch ist nichts passiert. Fahrt vorsichtig, wenn es weitergeht. Und sag Ella, ich habe die Sahnetorte in den Kühlschrank gestellt.“", "Um 16:50 Uhr kommt Bewegung in die Kolonne. Erst langsam, dann schneller. Am Unfallort sind zwei Autos ineinander verkeilt, die Feuerwehr fegt Glas von der Straße. Viele Fahrer werden langsamer und schauen hin. Manche halten sogar das Handy hoch.", "„Schaut nicht hin, Kinder“, sagt Sevgi. „Und Papa auch nicht.“", "„Ich schaue nach vorne“, sagt Rüdiger. „Gaffen ist nicht nur unhöflich, es ist auch gefährlich. Und Fotos von Unfallopfern machen ist sogar strafbar.“", "Am Drackensteiner Hang geht es in Serpentinen den Berg hinauf, dann fließt der Verkehr wieder. Um 19:20 Uhr klingeln sie bei Oma in München.", "Die Tür geht auf, und es riecht nach Braten und Kaffee.", "„Da seid ihr endlich! Ich habe mir solche Sorgen gemacht.“", "„Oma! Wir haben eine Rettungsgasse gemacht! Und die Polizei hat einen bösen Mann erwischt!“, ruft Ella.", "„Und ich habe beim Ich-sehe-was-Spiel elfmal gewonnen“, sagt Jonte.", "„Und ich“, sagt Rüdiger müde, „fahre nie wieder am ersten Ferientag auf der A8.“", "Sevgi gibt ihm einen Kuss auf die Wange. „Das hast du letztes Jahr auch gesagt.“"], "gl": [["der Stau", "traffic jam"], ["der Kofferraum", "boot / trunk"], ["angeschnallt", "buckled up"], ["die Anzeigetafel", "display board"], ["der Warnblinker", "hazard lights"], ["die Vollsperrung", "full closure"], ["die Verzögerung", "delay"], ["die Rettungsgasse", "emergency corridor"], ["stocken", "to come to a standstill"], ["das Blaulicht", "blue (emergency) light"], ["der Geländewagen", "SUV / off-roader"], ["das Bußgeld", "fine"], ["das Fahrverbot", "driving ban"], ["der Seitenstreifen", "hard shoulder"], ["die Leitplanke", "crash barrier"], ["die Rettungskräfte", "emergency services"], ["die Kolonne", "line of vehicles"], ["verkeilt", "wedged together"], ["gaffen", "to rubberneck"], ["strafbar", "punishable (by law)"]], "q": [["Warum schaltet Rüdiger den Warnblinker ein?", "Um die Autos hinter ihm zu warnen.", "Am Stauende passieren viele Unfälle."], ["Wie bildet man eine Rettungsgasse?", "Ganz links nach links, alle anderen nach rechts.", "Schon, wenn der Verkehr stockt."], ["Was passiert mit dem Geländewagen?", "Die Polizei hält ihn an.", "Durch die Rettungsgasse fahren ist verboten."], ["Warum sollen die Kinder nicht aussteigen?", "Es kann plötzlich weitergehen.", "Auf der Fahrbahn ist das gefährlich."], ["Warum soll man am Unfallort nicht gaffen?", "Es ist unhöflich und gefährlich.", "Fotos von Unfallopfern sind sogar strafbar."]], "say": ["Sind wir bald da?", "Rettungsgasse, alle nach außen!", "Es wird später, vielleicht sieben.", "Hauptsache, euch ist nichts passiert.", "Das hast du letztes Jahr auch gesagt."]}, {"id": 54, "title": "Die Fahrkartenkontrolle", "level": "B2", "topic": "Öffentlicher Nahverkehr", "rt": "ca. 6 Min.", "teaser": "Ilkas Handy-Akku ist leer – und mit ihm das Semesterticket. Ausgerechnet heute steigen die Kontrolleure ein.", "body": ["Es ist 7:52 Uhr in der Stadtbahn U14 Richtung Hauptbahnhof. Ilka Thorsen sitzt am Fenster, die Augen halb geschlossen. Sie studiert Architektur im dritten Semester und hat um halb neun eine Prüfung in Baukonstruktion.", "Sie zieht ihr Handy aus der Tasche, um noch einmal ihre Notizen anzuschauen. Der Bildschirm bleibt schwarz. Sie drückt auf den Knopf. Nichts. Akku leer.", "„Oh nein“, flüstert sie. Gestern Abend hat sie bis eins gelernt und vergessen, das Handy ans Ladekabel zu hängen.", "In diesem Moment geht vorn die Tür zu, und zwei Personen in dunkelblauen Jacken stehen auf. Eine Frau und ein Mann, beide mit kleinen Geräten in der Hand.", "„Guten Morgen, die Fahrausweise bitte!“", "Ilka spürt, wie ihr Herz schneller schlägt. Ihr Semesterticket ist auf dem Handy. Auf dem toten Handy.", "Der Kontrolleur kommt zuerst zu einem jungen Mann zwei Reihen vor ihr. Der Mann hat Kopfhörer auf und tut so, als würde er nichts hören.", "„Entschuldigung, Ihren Fahrausweis bitte.“", "„Was? Ah. Ich … habe ihn vergessen. Zu Hause.“", "„Haben Sie ein Abo oder ein persönliches Ticket?“", "„Äh … nein. Ich wollte gleich am Automaten …“", "„Sie sind seit vier Haltestellen in der Bahn, ich habe Sie einsteigen sehen. Dann muss ich Ihnen leider ein erhöhtes Beförderungsentgelt ausstellen. Sechzig Euro. Ihren Ausweis bitte.“", "Der junge Mann seufzt und gibt seinen Ausweis. Ilka beobachtet alles und wird immer nervöser. Dann steht die Kontrolleurin vor ihr. Auf ihrem Namensschild steht: Frau Gümüş.", "„Guten Morgen. Ihren Fahrausweis bitte.“", "„Guten Morgen. Ich habe ein Semesterticket. Aber mein Handy ist gerade ausgegangen. Der Akku ist leer.“", "Ilka hält das schwarze Handy hoch, als wäre es ein Beweis.", "„Das hören wir öfter“, sagt Frau Gümüş, aber nicht unfreundlich. „Haben Sie eine Powerbank dabei? Dann können wir kurz warten.“", "„Nein. Leider nicht.“", "„Haben Sie Ihren Studierendenausweis dabei?“", "„Ja!“ Ilka sucht in ihrem Rucksack und findet die Karte zwischen zwei Büchern. „Hier.“", "Frau Gümüş schaut sich die Karte an. „Das Ticket kann ich so leider nicht prüfen. Der Studierendenausweis allein ist bei uns kein Fahrausweis. Ich muss erst mal einen Vorgang aufnehmen.“", "„Muss ich jetzt sechzig Euro bezahlen? Ich bin Studentin, ich …“", "„Moment, hören Sie mir kurz zu. Weil Sie ein persönliches, nicht übertragbares Ticket haben, gibt es eine Sonderregel. Ich stelle Ihnen jetzt die Fahrpreisnacherhebung aus. Wenn Sie innerhalb von vierzehn Tagen im Kundenzentrum zeigen, dass Ihr Ticket heute gültig war, müssen Sie nur eine Bearbeitungsgebühr bezahlen. Sieben Euro.“", "Ilka atmet aus. „Sieben statt sechzig?“", "„Genau. Aber nur, wenn Sie das Ticket nachweisen. Wenn Sie nicht kommen, bleiben es sechzig. Das steht alles hier.“ Sie tippt in ihr Gerät, und ein kleiner Beleg kommt heraus.", "„Kann ich das Ticket auch per E-Mail schicken?“", "„Bei manchen Verkehrsverbünden geht das online. Bei uns steht auf der Rückseite, wie es funktioniert. Lesen Sie das bitte genau.“", "Der junge Mann mit den Kopfhörern hat zugehört. „Warum zahlt sie nur sieben Euro und ich sechzig?“", "Frau Gümüş dreht sich um. „Weil sie ein gültiges Ticket hat, das sie gerade nicht zeigen kann. Und Sie haben keins.“", "„Das ist unfair.“", "„Nein“, sagt der Kontrolleur ruhig. „Das ist der Unterschied zwischen vergessen und nicht gekauft.“", "An der nächsten Haltestelle steigt Ilka aus. Sie kommt pünktlich zur Prüfung, schreibt drei Stunden und vergisst die Bahn für den Rest des Vormittags.", "Am Nachmittag geht sie mit geladenem Handy ins Kundenzentrum am Hauptbahnhof. Vor ihr warten fünf Leute. Hinter der Theke sitzt ein älterer Mann mit Halbglatze.", "„Guten Tag. Ich wurde heute Morgen kontrolliert und konnte mein Semesterticket nicht zeigen. Der Akku war leer. Hier ist der Beleg.“", "Er nimmt den Beleg und schaut auf ihr Handy. Ilka öffnet die App und zeigt das Ticket mit dem Gültigkeitszeitraum und ihrem Namen.", "„Haben Sie den Studierendenausweis auch dabei? Ich muss den Namen abgleichen.“", "„Hier.“", "Er vergleicht, tippt, stempelt. „In Ordnung. Sieben Euro Bearbeitungsgebühr, bitte. Bar oder Karte?“", "„Karte.“", "„Und ein kleiner Tipp: Viele Studierende machen einen Screenshot vom Ticket. Das hilft aber nichts, wenn der Akku leer ist. Besser ist eine kleine Powerbank im Rucksack.“", "„Habe ich mir schon gekauft“, sagt Ilka und zeigt eine Tüte vom Elektromarkt. „Auf dem Weg hierher.“", "Der Mann lacht. „Dann sehe ich Sie hoffentlich nie wieder.“", "„Das hoffe ich auch. Nichts gegen Sie.“", "Am Abend erzählt sie ihrer Mitbewohnerin alles.", "„Und die Prüfung?“, fragt die.", "„Ich glaube, gut. Aber ehrlich gesagt war ich heute in der Bahn nervöser als im Hörsaal.“"], "gl": [["die Fahrkartenkontrolle", "ticket inspection"], ["die Stadtbahn", "light rail / tram"], ["der Akku", "battery"], ["das Ladekabel", "charging cable"], ["der Fahrausweis", "ticket (official)"], ["der Kontrolleur / die Kontrolleurin", "ticket inspector"], ["das erhöhte Beförderungsentgelt", "penalty fare"], ["ausstellen", "to issue"], ["der Beweis", "proof / evidence"], ["der Studierendenausweis", "student ID"], ["einen Vorgang aufnehmen", "to open a case"], ["nicht übertragbar", "non-transferable"], ["die Fahrpreisnacherhebung", "penalty fare notice"], ["die Bearbeitungsgebühr", "processing fee"], ["nachweisen", "to prove"], ["der Verkehrsverbund", "transport association"], ["das Kundenzentrum", "customer centre"], ["der Gültigkeitszeitraum", "period of validity"], ["abgleichen", "to compare / match"], ["der Hörsaal", "lecture hall"]], "q": [["Warum kann Ilka ihr Ticket nicht zeigen?", "Ihr Handy-Akku ist leer.", "Sie hat vergessen, es zu laden."], ["Was ist der Unterschied zum jungen Mann?", "Er hat gar kein Ticket gekauft.", "Er muss 60 Euro zahlen."], ["Warum zahlt Ilka nur 7 Euro?", "Sie hat ein persönliches Ticket und weist es nach.", "Innerhalb von 14 Tagen im Kundenzentrum."], ["Was braucht Ilka im Kundenzentrum?", "Das Ticket auf dem Handy und den Studierendenausweis.", "Der Name wird abgeglichen."], ["Welchen Tipp bekommt Ilka?", "Eine Powerbank mitnehmen.", "Ein Screenshot hilft bei leerem Akku nicht."]], "say": ["Die Fahrausweise bitte!", "Mein Akku ist leer.", "Muss ich jetzt sechzig Euro bezahlen?", "Ich konnte mein Ticket nicht zeigen.", "Das ist der Unterschied zwischen vergessen und nicht gekauft."]}, {"id": 55, "title": "Mit dem Fahrrad durch Stuttgart", "level": "B2", "topic": "Mobilität & Stadtleben", "rt": "ca. 6 Min.", "teaser": "Kofi will mit dem Rad zur Arbeit. Kollegin Wiebke warnt: Stuttgart ist ein Kessel. Eine Probefahrt mit Hügeln, Stäffele und einer Begegnung mit der Polizei.", "body": ["Kofi Mensah ist vor drei Wochen aus Amsterdam nach Stuttgart gezogen. Er arbeitet als Ingenieur in einem Büro in Bad Cannstatt und wohnt im Westen. Jeden Morgen steht er zwanzig Minuten in einer vollen Stadtbahn.", "„Ich fahre ab nächster Woche mit dem Fahrrad“, sagt er in der Kaffeeküche. „In Amsterdam bin ich jeden Tag geradelt.“", "Seine Kollegin Wiebke verschluckt sich fast an ihrem Kaffee.", "„Kofi. Amsterdam ist flach wie ein Pfannkuchen. Stuttgart liegt in einem Kessel. Egal wohin du willst, irgendwann musst du bergauf.“", "„So schlimm kann es nicht sein.“", "„Weißt du was? Ich fahre am Samstag mit dir die Strecke ab. Dann siehst du es selbst.“", "Am Samstagmorgen treffen sie sich am Feuersee. Kofi hat sein schwarzes Hollandrad dabei, schwer, mit drei Gängen und Korb vorne. Wiebke kommt auf einem schlanken Pedelec.", "„Du hast einen Motor“, sagt Kofi vorwurfsvoll.", "„Ich bin nicht verrückt. Ich wohne in Degerloch.“", "„Gilt das nicht als Betrug?“", "„In Stuttgart gilt das als Überlebensstrategie. Fast jedes zweite Rad hier hat einen Akku. Komm, wir fahren erst mal flach. Richtung Innenstadt.“", "Die ersten Kilometer sind angenehm. Sie fahren über eine Fahrradstraße, wo Autos nur zu Gast sind, dann ein Stück auf einem breiten roten Radweg.", "„Das ist ja wie zu Hause“, ruft Kofi.", "„Warte ab.“", "Am Rotebühlplatz wird es eng. Der Radweg hört plötzlich auf, ein Schild zeigt einen Fahrradfahrer und darunter: Ende. Kofi bremst.", "„Und jetzt? Wo soll ich fahren?“", "„Auf der Straße. Mit den Autos. Oder du schiebst über den Gehweg.“", "„Darf ich nicht einfach auf dem Gehweg fahren? Da ist doch Platz.“", "„Nein. Erwachsene dürfen nicht auf dem Gehweg radeln, außer es ist extra erlaubt. Kinder bis acht müssen dort fahren, aber du siehst nicht aus wie acht.“", "Kofi fährt auf die Straße. Ein Bus überholt ihn knapp. Er hält den Lenker so fest, dass seine Finger weiß werden.", "„Der war aber nah!“", "„Autos müssen innerorts eigentlich anderthalb Meter Abstand halten. Nicht jeder macht das. Fahr nicht zu weit rechts. Wenn du ganz am Rand fährst, überholen sie noch enger.“", "Am Schlossplatz machen sie Pause. Kofi trinkt seine halbe Wasserflasche aus.", "„Okay, die Stadt ist machbar. Und jetzt Cannstatt?“", "„Cannstatt ist der einfache Teil. Fast flach am Neckar entlang. Das Problem ist der Rückweg. Du wohnst im Westen, und der Westen liegt am Hang.“", "Auf dem Rückweg biegt Wiebke in eine schmale Straße ab. Die Häuser stehen eng, und am Ende der Straße beginnt eine lange Treppe.", "„Was ist das?“", "„Das sind die Stäffele. Die Treppen von Stuttgart. Es gibt hunderte davon. Früher sind die Weingärtner hier zu ihren Weinbergen hochgestiegen.“", "„Und da soll ich hoch? Mit dem Rad?“", "„Nein, um die Treppe fahren wir außen herum. Ich wollte dir nur zeigen, warum die Leute hier Treppen lieben und Fahrräder fürchten.“", "Die Straße außen herum ist steil. Sehr steil. Kofi tritt in den ersten Gang, steht aus dem Sattel und keucht. Wiebke fährt neben ihm, ohne zu schwitzen.", "„Alles gut?“, fragt sie freundlich.", "„Ich … hasse … dich … ein bisschen.“", "„Das sagen alle beim ersten Mal.“", "Oben angekommen, stellt er das Rad ab und setzt sich auf eine Mauer. Unter ihnen liegt die ganze Stadt: der Fernsehturm, die Weinberge, der Neckar in der Ferne.", "„Okay“, sagt er, noch außer Atem. „Die Aussicht ist es wert.“", "In diesem Moment hält ein Polizeiauto. Ein Beamter steigt aus und kommt auf sie zu.", "„Guten Tag. Ist das Ihr Fahrrad?“", "„Ja“, sagt Kofi unsicher. „Habe ich etwas falsch gemacht?“", "„Ihr Rücklicht funktioniert nicht. Das habe ich unten an der Ampel gesehen. Tagsüber ist das kein großes Problem, aber in der Dämmerung sieht man Sie nicht. Bitte reparieren Sie das.“", "„Natürlich. Danke für den Hinweis. Muss ich etwas bezahlen?“", "„Diesmal nicht. Heute nur eine Ermahnung. Und noch etwas: Unten an der Kreuzung hatten Sie das Handy in der Hand.“", "Kofi wird rot. „Ich habe nur kurz auf die Karte geschaut.“", "„Auch kurz ist verboten. Kaufen Sie sich eine Halterung für den Lenker. Wenn Sie mit Handy in der Hand erwischt werden, kostet das ein Bußgeld.“", "„Verstanden. Danke.“", "Als das Polizeiauto weg ist, lacht Wiebke. „Willkommen in Deutschland. Hier wird auch das Fahrrad kontrolliert.“", "Am Montag hat Kofi ein neues Rücklicht und eine Handyhalterung. Am Dienstag ist er mit dem Rad zur Arbeit gefahren und war zwei Minuten schneller als die Stadtbahn. Auf dem Rückweg hat er die Stadtbahn genommen – mit dem Rad. Und am Freitag hat er im Fahrradladen eine Probefahrt gemacht. Auf einem Pedelec.", "„Na?“, fragt Wiebke, als sie das Foto sieht. „Überlebensstrategie?“", "„Nein“, schreibt Kofi zurück. „Integration.“"], "gl": [["radeln", "to cycle"], ["sich verschlucken", "to choke (on a drink)"], ["der Kessel", "basin / valley (lit. cauldron)"], ["bergauf", "uphill"], ["das Hollandrad", "Dutch bike"], ["der Gang", "gear"], ["das Pedelec / E-Bike", "e-bike"], ["vorwurfsvoll", "reproachfully"], ["die Fahrradstraße", "bicycle street"], ["der Gehweg", "pavement / sidewalk"], ["schieben", "to push"], ["überholen", "to overtake"], ["der Lenker", "handlebars"], ["innerorts", "in built-up areas"], ["der Hang", "slope"], ["die Stäffele (schwäb.)", "the (Stuttgart) stairs"], ["der Sattel", "saddle"], ["das Rücklicht", "rear light"], ["die Ermahnung", "warning / caution"], ["die Halterung", "mount / holder"]], "q": [["Warum ist Wiebke skeptisch?", "Stuttgart liegt in einem Kessel.", "Man muss fast immer bergauf fahren."], ["Dürfen Erwachsene auf dem Gehweg fahren?", "Nein, außer es ist ausdrücklich erlaubt.", "Kinder bis acht müssen dort fahren."], ["Warum soll Kofi nicht ganz rechts fahren?", "Sonst überholen Autos noch enger.", "Innerorts gilt eigentlich 1,5 m Abstand."], ["Was sind die Stäffele?", "Die Treppen von Stuttgart.", "Früher nutzten sie die Weingärtner."], ["Warum hält die Polizei Kofi an?", "Defektes Rücklicht und Handy in der Hand.", "Diesmal gibt es nur eine Ermahnung."]], "say": ["So schlimm kann es nicht sein.", "Wo soll ich hier fahren?", "Habe ich etwas falsch gemacht?", "Danke für den Hinweis.", "Die Aussicht ist es wert."]}, {"id": 56, "title": "Der Flixbus nach Berlin", "level": "B2", "topic": "Reisen & Begegnungen", "rt": "ca. 6 Min.", "teaser": "Neun Stunden im Fernbus, ein kaputtes WLAN und eine Sitznachbarin, die Hörspiele liebt. Fabian erwartet die längste Fahrt seines Lebens.", "body": ["Freitag, 22:40 Uhr, Busbahnhof am Flughafen Stuttgart. Fabian Kühn steht mit einem Rucksack und einer Tüte Brezeln an Bussteig 5. Der Nachtbus nach Berlin fährt um 22:55 Uhr. Ankunft laut Ticket: 7:50 Uhr. Preis: neunzehn Euro neunundneunzig.", "Mit dem ICE hätte die Fahrt hundertzwanzig gekostet. Fabian ist Student, und sein bester Kumpel feiert morgen in Berlin seinen Geburtstag. Die Rechnung war einfach.", "Der grüne Bus fährt pünktlich vor. Der Fahrer steigt aus, ein kräftiger Mann mit Schnurrbart, und öffnet den Gepäckraum.", "„Guten Abend! Großes Gepäck hier unten, Handgepäck mit nach oben. Ticket bitte auf dem Handy bereithalten und Ausweis dazu.“", "„Muss ich den Ausweis wirklich zeigen?“, fragt Fabian.", "„Bei uns schon, ja. Das Ticket ist personalisiert. Danke. Platz 23, am Fenster. Gute Fahrt.“", "Fabian setzt sich. Auf Platz 24 sitzt bereits eine ältere Dame mit silbernen Haaren, einem Kissen in Form eines Hörnchens und einer Thermoskanne.", "„Guten Abend“, sagt sie. „Sie sind dann wohl mein Nachbar für die Nacht. Ich bin Frau Engelhardt. Hannelore.“", "„Fabian. Freut mich.“", "„Fahren Sie öfter mit dem Bus?“", "„Zum ersten Mal über Nacht. Und Sie?“", "„Jeden Monat. Meine Tochter wohnt in Berlin, mit meinen zwei Enkeln. Ich bin siebenundsiebzig, und ich habe gelernt: Der Nachtbus ist billiger als ein Hotel. Man muss nur wissen, wie.“", "Fabian lächelt höflich. Er hat seine Kopfhörer schon in der Hand. Er möchte eigentlich schlafen.", "Der Bus fährt los. Nach einer halben Stunde versucht Fabian, sich ins WLAN einzuloggen. „Verbindung fehlgeschlagen“. Er versucht es noch einmal. Nichts.", "„Das WLAN funktioniert selten“, sagt Frau Engelhardt, ohne von ihrem Strickzeug aufzuschauen. „Und die Steckdose an Ihrem Platz auch nicht. Ich habe es letzten Monat ausprobiert. Nehmen Sie lieber meine Powerbank, wenn Sie Strom brauchen.“", "„Danke. Woher wissen Sie, dass ich …?“", "„Weil Sie schon dreimal auf die Steckdose geschaut haben.“", "Gegen Mitternacht wird es im Bus dunkel. Fabian lehnt den Kopf an das Fenster. Die Autobahn brummt unter ihm. Er schläft nicht. Vor ihm schnarcht jemand. Hinter ihm telefoniert eine junge Frau leise auf Spanisch.", "Um 1:30 Uhr hält der Bus an einer Raststätte bei Nürnberg.", "„Fünfzehn Minuten Pause!“, ruft der Fahrer durch das Mikrofon. „Bitte pünktlich zurück, ich warte nicht!“", "Fabian steigt aus, um sich die Beine zu vertreten. Frau Engelhardt kommt auch mit.", "„Ein kleiner Tipp“, sagt sie. „Merken Sie sich das Kennzeichen vom Bus. Hier stehen nachts manchmal drei grüne Busse nebeneinander. Letztes Jahr ist ein junger Mann in den Bus nach München eingestiegen.“", "„Ehrlich?“", "„Er hat es erst in Ingolstadt gemerkt.“", "Fabian lacht und fotografiert das Nummernschild.", "Zurück im Bus kann er immer noch nicht schlafen. Frau Engelhardt bemerkt es.", "„Kann ich Ihnen etwas anbieten? Ich habe Pfefferminztee in der Thermoskanne. Und ein Hörspiel. Krimi. Mit dem schlafe ich immer ein.“", "„Ein Hörspiel? Wie für Kinder?“", "„Junger Mann, Hörspiele sind nicht nur für Kinder. Das ist eine deutsche Kunstform. Probieren Sie es.“", "Sie gibt ihm einen Kopfhörer, sie behält den anderen. Ein Sprecher mit tiefer Stimme erzählt von einem Mord in einem Leuchtturm an der Nordsee. Fabian hört zu. Der Tee ist warm. Irgendwann fallen ihm die Augen zu.", "Er wacht auf, weil der Bus bremst. Draußen ist es hell. Auf einem Schild steht: Berlin Südkreuz.", "„Gut geschlafen?“, fragt Frau Engelhardt. Sie ist schon wach, das Kissen ist eingepackt.", "„Wie ein Stein. Wer war denn der Mörder?“", "„Das verrate ich nicht. Sie müssen eben auf der Rückfahrt weiterhören.“", "Der Fahrer meldet sich durch das Mikrofon: „Meine Damen und Herren, wir haben fünfunddreißig Minuten Verspätung. Wegen einer Baustelle bei Leipzig. Ich bitte um Entschuldigung.“", "„Fünfunddreißig Minuten?“, sagt Fabian. „Kann man da eine Entschädigung bekommen? Wie bei der Bahn?“", "„Bei Fernbussen gibt es erst ab längeren Verspätungen etwas zurück, ab zwei Stunden, glaube ich“, sagt Frau Engelhardt. „Bei einer halben Stunde bekommen Sie nur eine Entschuldigung. Die haben Sie ja jetzt.“", "Am Zentralen Omnibusbahnhof steigen sie aus. Unten am Gepäckraum wartet eine Frau mit zwei kleinen Kindern, die laut „Oma!“ rufen.", "„Das sind meine“, sagt Frau Engelhardt stolz. „Wann fahren Sie zurück?“", "„Sonntagabend. Mit dem Nachtbus um 22:30.“", "„Ich auch. Platz 24.“", "Fabian grinst. „Dann buche ich mir jetzt Platz 23. Ich muss ja wissen, wer der Mörder war.“", "„Bringen Sie diesmal eigenen Tee mit“, sagt sie und winkt. „Und Brezeln. Ihre haben sehr gut gerochen.“"], "gl": [["der Fernbus", "long-distance coach"], ["der Busbahnhof / ZOB", "bus station"], ["der Bussteig", "bus bay"], ["der Kumpel", "buddy"], ["der Gepäckraum", "luggage hold"], ["bereithalten", "to have ready"], ["personalisiert", "personalised"], ["das Strickzeug", "knitting"], ["die Steckdose", "socket"], ["schnarchen", "to snore"], ["die Raststätte", "motorway service area"], ["sich die Beine vertreten", "to stretch one's legs"], ["das Kennzeichen / Nummernschild", "licence plate"], ["das Hörspiel", "radio play / audio drama"], ["die Kunstform", "art form"], ["der Leuchtturm", "lighthouse"], ["verraten", "to give away / reveal"], ["die Verspätung", "delay"], ["die Baustelle", "roadworks"], ["die Entschädigung", "compensation"]], "q": [["Warum fährt Fabian mit dem Bus?", "Er ist viel billiger als der ICE.", "19,99 € statt etwa 120 €."], ["Warum muss Fabian seinen Ausweis zeigen?", "Das Ticket ist personalisiert.", "Der Fahrer prüft beides."], ["Welchen Tipp gibt Frau Engelhardt an der Raststätte?", "Das Kennzeichen des Busses merken.", "Sonst steigt man in den falschen Bus."], ["Wie schläft Fabian endlich ein?", "Mit Pfefferminztee und einem Krimi-Hörspiel.", "Frau Engelhardt teilt beides mit ihm."], ["Gibt es Entschädigung für 35 Minuten Verspätung?", "Nein, nur eine Entschuldigung.", "Laut Frau Engelhardt erst ab längeren Verspätungen."]], "say": ["Fahren Sie öfter mit dem Bus?", "Bitte pünktlich zurück, ich warte nicht!", "Kann ich Ihnen etwas anbieten?", "Das verrate ich nicht.", "Kann man da eine Entschädigung bekommen?"]}, {"id": 57, "title": "Die Schwiegereltern kommen", "level": "B2", "topic": "Familie & Kulturen", "rt": "ca. 6 Min.", "teaser": "Zum ersten Mal besuchen Moritz' Eltern aus dem Allgäu das Paar in Heidelberg. Zahra hat drei Tage geputzt und gekocht – und dann kommt alles anders.", "body": ["Zahra Karimi steht seit sechs Uhr morgens in der Küche. Auf dem Herd köchelt Ghormeh Sabzi, ein persischer Kräutereintopf, im Ofen bräunt ein Reis mit Kruste, und auf dem Tisch stehen drei Schüsseln mit Salaten. Es ist Samstag, und um zwölf kommen zum ersten Mal Moritz' Eltern aus dem Allgäu.", "„Zahra, es reicht“, sagt Moritz, als er in die Küche kommt. „Das ist Essen für zwanzig Leute. Es kommen zwei.“", "„Bei uns zu Hause ist es eine Schande, wenn die Gäste nicht mehr essen können als sie wollen. Was mögen deine Eltern eigentlich? Ich habe dich das schon fünfmal gefragt.“", "„Mein Vater isst alles. Meine Mutter isst … na ja, eigentlich auch alles. Außer Koriander. Und scharfes Essen. Und Lamm.“", "Zahra lässt den Löffel fallen. „Moritz! Im Eintopf ist Lamm! Und auf dem Salat ist Koriander!“", "„Oh. Dann … isst sie den Reis. Der Reis ist super.“", "„Ich bringe dich um.“", "Um 11:55 Uhr klingelt es. Vor der Tür stehen Gisela und Hubert Brandstetter. Gisela trägt eine Jacke mit Trachtenknöpfen und hält einen Kuchen in der Hand. Hubert hat einen Korb dabei, aus dem eine Flasche und ein großes Stück Käse ragen.", "„Grüß Gott! Du musst die Zahra sein!“, sagt Gisela und umarmt sie herzlich. „Endlich lernen wir dich kennen! Moritz erzählt ja nie was.“", "„Herzlich willkommen, Frau Brandstetter. Herr Brandstetter. Bitte kommen Sie rein.“", "„Ach was, Frau Brandstetter! Gisela. Und das ist der Hubert. Bei uns im Allgäu duzt man sich, sobald man zusammen am Tisch sitzt.“", "„Bei uns im Iran“, sagt Zahra lächelnd, „siezt man die Eltern des Partners am Anfang aus Respekt. Aber ich versuche es. Gisela.“", "Hubert drückt ihr den Korb in die Hand. „Ein bissle was aus der Heimat. Bergkäse von unserem Nachbarn, selbstgemachte Marmelade und ein Obstler. Für die Verdauung.“", "Im Wohnzimmer schaut sich Gisela mit großen Augen um. Zahra hat die beste Tischdecke ausgelegt und frische Blumen hingestellt.", "„Das ist aber schön hier. Und es riecht so gut! Was gibt es denn?“", "Zahra wirft Moritz einen schnellen Blick zu. „Ein persisches Gericht. Ghormeh Sabzi. Mit Kräutern und … Lammfleisch. Moritz hat mir leider erst heute gesagt, dass Sie kein Lamm mögen. Es tut mir sehr leid. Ich mache Ihnen gern schnell etwas anderes.“", "Gisela schaut ihren Sohn streng an. „Moritz. Das mit dem Lamm war vor zwanzig Jahren. Als du klein warst, hatten wir ein Lamm auf dem Hof, das hieß Lotte. Seitdem konnte ich keins mehr essen.“", "„Und jetzt?“, fragt Moritz kleinlaut.", "„Jetzt bin ich neugierig. Wer drei Tage kocht, dem sagt man nicht nein.“", "Sie setzen sich an den Tisch. Zahra serviert den Reis zuerst, mit der goldenen Kruste oben.", "„Das ist Tahdig“, erklärt sie. „Die Kruste unten im Topf. Bei uns streiten sich die Kinder darum.“", "Hubert probiert und schließt die Augen. „Das ist ja wie Kässpätzle. Das Beste ist immer das, was am Topf klebt.“", "Gisela probiert vorsichtig vom Eintopf. Dann noch einmal. Dann nimmt sie sich einen großen Löffel nach.", "„Zahra, das ist ganz wunderbar. Ich schmecke Zitrone. Ist da Zitrone drin?“", "„Getrocknete Limetten. Meine Mutter schickt sie mir aus Schiras.“", "„Kannst du mir das Rezept aufschreiben? Unsere Nachbarin im Dorf wird staunen.“", "Moritz lehnt sich erleichtert zurück. Doch dann sagt Hubert in die Stille: „Und, wann wollt ihr heiraten?“", "Moritz verschluckt sich am Wasser. Zahra wird rot.", "„Hubert!“, sagt Gisela. „Das fragt man doch nicht beim ersten Besuch!“", "„Warum nicht? Ich frage ja nur. Wir sind nicht mehr die Jüngsten.“", "Zahra fasst sich als Erste. „Wir haben darüber gesprochen. Aber es ist kompliziert. Meine Familie würde gern eine Hochzeit im Iran feiern, mit dreihundert Gästen. Moritz möchte etwas Kleines am Bodensee.“", "„Dreihundert Gäste?“, fragt Hubert. „Wir sind im Dorf nur achthundert Einwohner.“", "„Bei uns ist das eine kleine Hochzeit“, sagt Zahra, und alle lachen.", "„Wisst ihr was?“, sagt Gisela. „Macht doch zwei. Eine im Iran und eine bei uns im Allgäu. Mit Blasmusik. Dann lernen sich alle kennen.“", "„Mama, wir haben noch nicht mal …“", "„Ich sag ja nur.“", "Nach dem Essen gibt es Giselas Kuchen und persischen Tee aus kleinen Gläsern. Hubert schenkt jedem einen Obstler ein. Zahra trinkt keinen Alkohol und lehnt höflich ab.", "„Kein Problem“, sagt Hubert sofort. „Dann trinkst du Tee und ich trinke deinen Obstler. Das ist Integration in beide Richtungen.“", "Am Abend, als die beiden gehen, umarmt Gisela Zahra noch einmal lange.", "„Du musst mal zu uns kommen. Im Sommer, wenn die Kühe auf der Alm sind.“", "„Sehr gern. Und ich koche dann für euch.“", "„Nur, wenn du mir zeigst, wie man diese Kruste macht.“", "Als die Tür zu ist, lässt sich Zahra auf das Sofa fallen.", "„Und?“, fragt Moritz vorsichtig.", "„Deine Eltern sind wunderbar. Und du bist ein Idiot. Lotte, das Lamm! Warum erzählst du mir so was nicht?“", "„Ich hatte Lotte vergessen.“", "„Deine Mutter nicht. Und jetzt“, sagt Zahra und zeigt auf die vollen Töpfe, „essen wir eine Woche lang Ghormeh Sabzi.“"], "gl": [["die Schwiegereltern", "parents-in-law"], ["köcheln", "to simmer"], ["der Eintopf", "stew"], ["die Kruste", "crust"], ["die Schande", "disgrace / shame"], ["der Koriander", "coriander"], ["die Trachtenknöpfe", "traditional costume buttons"], ["Grüß Gott!", "Hello! (southern German)"], ["herzlich", "warmly"], ["ein bissle (schwäb./allgäu.)", "a little bit"], ["der Bergkäse", "mountain cheese"], ["der Obstler", "fruit brandy"], ["die Verdauung", "digestion"], ["kleinlaut", "sheepish(ly)"], ["neugierig", "curious"], ["getrocknet", "dried"], ["staunen", "to be amazed"], ["sich fassen", "to compose oneself"], ["die Blasmusik", "brass band music"], ["die Alm", "alpine pasture"]], "q": [["Warum ist Zahra wütend auf Moritz?", "Er sagt zu spät, was seine Mutter nicht isst.", "Im Essen sind Lamm und Koriander."], ["Welche kulturellen Unterschiede gibt es beim Duzen?", "Im Allgäu duzt man sich schnell.", "Im Iran siezt man die Schwiegereltern zuerst aus Respekt."], ["Warum hat Gisela früher kein Lamm gegessen?", "Wegen eines Lamms namens Lotte auf dem Hof.", "Das war vor zwanzig Jahren."], ["Welche unangenehme Frage stellt Hubert?", "Wann das Paar heiraten will.", "Gisela findet die Frage zu früh."], ["Wie löst Hubert die Situation mit dem Obstler?", "Zahra trinkt Tee, er trinkt ihren Obstler.", "Er nennt es „Integration in beide Richtungen“."]], "say": ["Herzlich willkommen, bitte kommen Sie rein.", "Ich mache Ihnen gern schnell etwas anderes.", "Kannst du mir das Rezept aufschreiben?", "Das fragt man doch nicht beim ersten Besuch!", "Bei uns ist das eine kleine Hochzeit."]}, {"id": 58, "title": "Der Umzug des besten Freundes", "level": "B2", "topic": "Freundschaft & Abschied", "rt": "ca. 6 Min.", "teaser": "Seit der fünften Klasse sind Elias und Bastian unzertrennlich. Jetzt zieht Bastian nach Hamburg. Beim Kistenpacken fällt das Wichtigste schwer: Tschüss sagen.", "body": ["Der Umzugswagen ist für Samstag um acht bestellt. Am Freitagabend sitzt Elias auf dem Boden von Bastians fast leerer Wohnung in Tübingen, zwischen Kartons, Klebeband und einer Pizza, die langsam kalt wird.", "„Ich verstehe immer noch nicht, wie ein Mensch so viele Kabel besitzen kann“, sagt Elias und hält einen Knoten aus mindestens zwanzig Ladekabeln hoch.", "„Die braucht man alle“, sagt Bastian.", "„Wofür ist das hier?“", "„Keine Ahnung. Aber wenn ich es wegwerfe, brauche ich es nächste Woche.“", "„Das hast du über deine CDs auch gesagt. Wann hast du zuletzt eine gehört?“", "„Das ist eine Frage der Ehre, nicht der Technik.“", "Elias wirft den Knoten in einen Karton mit der Aufschrift „Krimskrams“. Es ist der vierte Karton mit dieser Aufschrift.", "Bastian hat eine Stelle als Schiffbauingenieur in Hamburg bekommen. Sein Traumjob, seit er zwölf war und im Urlaub an der Nordsee die großen Containerschiffe gesehen hat. Elias hat sich für ihn gefreut. Er hat gratuliert, er hat beim Kistenpacken geholfen, er hat sogar die Abschiedsparty organisiert. Aber heute Abend, in der leeren Wohnung, fühlt es sich anders an.", "„Weißt du noch, wie wir uns kennengelernt haben?“, fragt Bastian plötzlich.", "„Fünfte Klasse. Du hast dich neben mich gesetzt, weil sonst kein Platz frei war.“", "„Und du hast mir in der ersten Stunde dein Lineal geliehen.“", "„Und es nie zurückbekommen.“", "Bastian lacht, steht auf und wühlt in einem Karton. Dann zieht er ein altes, gelbes Holzlineal heraus. Auf der Rückseite steht in Kinderschrift: ELIAS B.", "„Das gibt es nicht. Du hast es immer noch?“", "„Ich hab es nie geschafft, es dir zurückzugeben. Erst war es mir peinlich, dann war es Tradition.“", "Elias nimmt das Lineal in die Hand. Er sagt eine Weile nichts.", "„Behalt es“, sagt er dann. „In Hamburg brauchst du was, womit du gerade Linien ziehen kannst. Du bist doch jetzt Ingenieur.“", "Sie packen weiter. Bücher, Teller, ein Fußball mit Unterschriften von ihrer alten Mannschaft. Bei jedem Gegenstand gibt es eine Geschichte. Bei den meisten Geschichten war Elias dabei.", "Gegen Mitternacht macht Bastian zwei Flaschen Bier auf und setzt sich neben ihn auf den Boden.", "„Darf ich dir was sagen? Ohne dass du komisch wirst?“", "„Ich werde nie komisch.“", "„Du wirst immer komisch. Aber egal. Ich habe ein bisschen Angst.“", "„Vor Hamburg?“", "„Vor allem. Neue Stadt, neue Kollegen, niemand kennt mich. Hier weiß ich, wo der beste Döner ist, wen ich anrufen kann, wenn das Auto nicht anspringt. In Hamburg kenne ich genau eine Person, und das ist die Frau von der Personalabteilung.“", "Elias dreht die Flasche in den Händen. „Ehrlich gesagt habe ich auch ein bisschen Angst.“", "„Du? Wovor? Du bleibst doch hier.“", "„Genau deshalb. Du bist seit zwanzig Jahren der, den ich als Erstes anrufe. Wenn was Gutes passiert und wenn was Schlechtes passiert. Und ich habe Angst, dass das langsam aufhört. Erst telefonieren wir jede Woche, dann jeden Monat, und irgendwann schreiben wir uns nur noch zum Geburtstag.“", "Bastian schweigt einen Moment. „So wie mit Jonathan?“", "„So wie mit Jonathan.“", "Jonathan war der Dritte in ihrer Gruppe. Er ist vor fünf Jahren nach Kanada gegangen. Inzwischen wissen sie nur noch aus dem Internet, dass er zwei Kinder hat.", "„Dann machen wir es anders“, sagt Bastian entschlossen. „Wir machen Regeln.“", "„Regeln? Für Freundschaft?“", "„Warum nicht? Für alles Wichtige gibt es Regeln. Erstens: Jeden Sonntagabend telefonieren wir. Nicht schreiben. Telefonieren.“", "„Auch wenn nichts passiert ist?“", "„Gerade dann. Zweitens: Einmal im Quartal besucht einer den anderen. Abwechselnd. Und drittens: Wir gucken jedes Spiel vom VfB zusammen. Mit Video.“", "„Das ist viel Fußball.“", "„Das ist Freundschaft.“", "Elias muss lachen. „Okay. Und viertens: Wenn einer von uns heiratet, ist der andere Trauzeuge.“", "„Das war doch sowieso klar.“", "„Ich wollte es nur schriftlich haben.“", "Bastian nimmt einen Edding und schreibt die vier Regeln auf einen leeren Karton. Darunter unterschreiben beide.", "Am nächsten Morgen um acht ist der Umzugswagen da. Vier Stunden später ist die Wohnung leer. Bastians Freundin Marie fährt schon voraus, Bastian fährt den Transporter.", "Sie stehen vor dem Haus. Keiner weiß so richtig, was er sagen soll.", "„Na dann“, sagt Bastian.", "„Na dann“, sagt Elias.", "Dann umarmen sie sich, lange und fest, mit Schulterklopfen, wie Männer in ihrer Familie das immer gemacht haben, wenn sie nicht weinen wollten.", "„Sonntag, acht Uhr“, sagt Bastian.", "„Sonntag, acht Uhr.“", "Der Transporter biegt um die Ecke. Elias bleibt noch eine Weile stehen. Dann geht er nach Hause.", "Am Sonntag um 19:58 Uhr klingelt sein Handy.", "„Du bist zu früh“, sagt Elias.", "„Ich konnte nicht warten“, sagt Bastian. „Hamburg ist riesig. Es regnet. Und ich habe den besten Fischbrötchenstand der Stadt gefunden. Du musst unbedingt kommen.“", "Auf Elias' Schreibtisch liegt der Karton mit den Regeln. Er hat ihn behalten. Er schreibt mit Bleistift eine fünfte Regel darunter: Fischbrötchen im Oktober."], "gl": [["der Umzugswagen", "removal van"], ["das Klebeband", "adhesive tape"], ["der Knoten", "knot"], ["der Krimskrams", "odds and ends"], ["der Schiffbauingenieur", "naval engineer"], ["die Abschiedsparty", "farewell party"], ["das Lineal", "ruler"], ["leihen", "to lend / borrow"], ["wühlen", "to rummage"], ["die Mannschaft", "team"], ["anspringen (Auto)", "to start (car)"], ["entschlossen", "determined(ly)"], ["abwechselnd", "alternately"], ["das Quartal", "quarter (of a year)"], ["der Trauzeuge", "best man / witness"], ["schriftlich", "in writing"], ["der Edding", "marker pen"], ["der Transporter", "van"], ["das Schulterklopfen", "pat on the back"], ["das Fischbrötchen", "fish sandwich"]], "q": [["Warum zieht Bastian nach Hamburg?", "Er hat dort seinen Traumjob.", "Als Schiffbauingenieur."], ["Was ist die Geschichte mit dem Lineal?", "Elias hat es Bastian in der 5. Klasse geliehen.", "Bastian hat es nie zurückgegeben."], ["Wovor haben beide Angst?", "Dass die Freundschaft langsam aufhört.", "Wie bei Jonathan, der nach Kanada ging."], ["Welche Regeln machen sie?", "Sonntagstelefonat, Besuche, VfB-Spiele, Trauzeuge.", "Sie schreiben sie auf einen Karton."], ["Was zeigt das Ende?", "Die erste Regel funktioniert.", "Bastian ruft sogar zu früh an."]], "say": ["Darf ich dir was sagen?", "Ehrlich gesagt habe ich auch ein bisschen Angst.", "Dann machen wir es anders.", "Das war doch sowieso klar.", "Du musst unbedingt kommen."]}, {"id": 59, "title": "Geschwister unter sich", "level": "B2", "topic": "Familie & Verantwortung", "rt": "ca. 6 Min.", "teaser": "Der Vater ist gestürzt und kann nicht mehr allein wohnen. Drei Geschwister, drei Meinungen – und alte Rollen, die plötzlich wieder da sind.", "body": ["Die drei Geschwister Ostertag sitzen zum ersten Mal seit Jahren zusammen am Küchentisch ihres Elternhauses in Schwäbisch Hall. Nicht zu Weihnachten, nicht zu einem Geburtstag. Sondern weil ihr Vater vor zwei Wochen auf der Kellertreppe gestürzt ist.", "Erwin Ostertag ist zweiundachtzig, seit drei Jahren Witwer und hat sich den Oberschenkelhals gebrochen. Jetzt ist er in der Reha. In zehn Tagen soll er entlassen werden.", "„Also“, sagt Katrin, die Älteste. Sie ist Lehrerin, sie hat einen Block vor sich und einen Kugelschreiber in der Hand. „Wir müssen entscheiden, wie es weitergeht. Ich habe mal eine Liste gemacht.“", "„Natürlich hast du eine Liste gemacht“, sagt Florian, der Jüngste, und verdreht die Augen.", "„Hast du eine bessere Idee?“", "„Ich hab noch gar nichts gesagt.“", "„Genau. Wie immer.“", "Stefan, der Mittlere, hebt die Hände. „Leute. Bitte. Wir sind nicht mehr zwölf. Es geht um Papa.“", "Katrin atmet durch und liest vor. „Möglichkeit eins: Papa zieht in ein Pflegeheim. Möglichkeit zwei: Er bleibt zu Hause, mit einem Pflegedienst. Möglichkeit drei: Er zieht zu einem von uns.“", "„Pflegeheim kommt nicht in Frage“, sagt Florian sofort. „Das würde ihn umbringen. Er hat sein ganzes Leben in diesem Haus gewohnt.“", "„Das Haus hat drei Stockwerke und eine steile Kellertreppe“, sagt Katrin. „Genau da ist er gestürzt.“", "„Dann baut man eben einen Treppenlift ein.“", "„Und wer bezahlt den Treppenlift? Und wer kommt, wenn er nachts wieder fällt? Du wohnst in Berlin, Florian. Du bist sechs Stunden weg.“", "Florian wird rot. „Das ist unfair. Ich kann nichts dafür, dass mein Job in Berlin ist.“", "„Ich sage ja nicht, dass du schuld bist. Ich sage nur, dass immer ich diejenige bin, die hinfährt. Ich war jeden Tag im Krankenhaus. Ich habe mit der Reha telefoniert. Ich habe den Antrag auf einen Pflegegrad gestellt.“", "Stille. Stefan schaut auf den Tisch.", "„Du hast recht“, sagt er leise. „Du hast die letzten drei Jahre fast alles allein gemacht. Seit Mama gestorben ist. Das haben wir nie richtig gesagt. Danke.“", "Katrin blinzelt schnell. Sie hatte mit Streit gerechnet, nicht damit.", "„Ich will kein Danke“, sagt sie, aber ihre Stimme klingt anders. „Ich will, dass wir das gemeinsam tragen.“", "„Okay“, sagt Florian. „Dann sag mir, was ich tun kann. Von Berlin aus. Ehrlich.“", "Katrin schaut ihn überrascht an. „Du könntest dich um den ganzen Papierkram kümmern. Pflegekasse, Krankenkasse, Anträge. Das geht alles online oder per Telefon. Ich habe dafür nach der Schule einfach keine Kraft mehr.“", "„Das kann ich. Ich arbeite den ganzen Tag mit Verwaltung. Das ist mein Ding.“", "„Und du, Stefan?“", "„Ich wohne in Crailsheim. Zwanzig Minuten. Ich kann zweimal die Woche nach ihm schauen. Und am Wochenende, abwechselnd mit dir.“", "„Und das Pflegeheim?“, fragt Florian.", "„Was sagt denn eigentlich Papa?“, fragt Stefan. „Hat ihn schon jemand gefragt?“", "Die drei sehen sich an. Keiner hat ihn gefragt.", "Am nächsten Tag fahren sie zusammen in die Reha-Klinik. Erwin sitzt im Rollstuhl am Fenster und macht ein Kreuzworträtsel.", "„Alle drei? Ist jemand gestorben?“, fragt er misstrauisch.", "„Nein, Papa“, sagt Katrin. „Wir wollen mit dir besprechen, wie es nach der Reha weitergeht.“", "„Ich gehe nach Hause. Was gibt es da zu besprechen?“", "Stefan setzt sich neben ihn. „Papa, die Treppe. Du weißt, was passiert ist.“", "Erwin legt den Stift hin. Er schaut lange aus dem Fenster.", "„Ich weiß. Ich bin nicht dumm. Ich habe nachts hier viel nachgedacht.“", "„Und?“", "„Ich will nicht ins Heim. Aber ich will auch nicht, dass Katrin jeden Tag kommt und sich kaputt macht. Ich habe gesehen, wie müde sie ist.“", "Katrin schluckt.", "„Unten im Haus gibt es das alte Arbeitszimmer von Mama“, fährt Erwin fort. „Mit dem kleinen Bad daneben. Wenn ich da unten schlafe, brauche ich die Treppe nicht. Und dann einen Pflegedienst, morgens und abends. Und einen Notrufknopf. So einen zum Umhängen. Den Rest schaffe ich.“", "Die Geschwister sehen sich an.", "„Das ist eigentlich eine gute Lösung“, sagt Florian.", "„Natürlich ist das eine gute Lösung“, sagt Erwin. „Ich war fünfunddreißig Jahre Bauingenieur. Ich kann Probleme lösen. Ihr hättet mich nur früher fragen müssen.“", "Auf dem Parkplatz bleibt Katrin stehen.", "„Wisst ihr, was komisch ist? Wir haben gestern zwei Stunden gestritten, wer was besser weiß. Und die beste Idee hatte der, den wir nicht gefragt haben.“", "„Typisch Ostertag“, sagt Stefan.", "„Ab jetzt“, sagt Florian, „fragen wir ihn zuerst. Und wir haben eine Familiengruppe. Jeden Sonntag ein Update. Damit Katrin nicht wieder alles allein weiß.“", "„Und du schreibst die Updates“, sagt Katrin.", "„Ich schreibe die Updates. Mit Liste.“", "Zum ersten Mal an diesem Wochenende lachen alle drei gleichzeitig."], "gl": [["die Geschwister", "siblings"], ["stürzen", "to fall"], ["der Witwer", "widower"], ["der Oberschenkelhals", "femoral neck"], ["die Reha", "rehabilitation (clinic)"], ["entlassen werden", "to be discharged"], ["die Augen verdrehen", "to roll one's eyes"], ["das Pflegeheim", "care home"], ["der Pflegedienst", "home care service"], ["nicht in Frage kommen", "to be out of the question"], ["der Treppenlift", "stairlift"], ["der Pflegegrad", "care level"], ["gemeinsam tragen", "to share (a burden)"], ["die Pflegekasse", "long-term care insurance"], ["die Verwaltung", "administration"], ["nach jemandem schauen", "to check on someone"], ["misstrauisch", "suspicious(ly)"], ["sich kaputt machen", "to wear oneself out"], ["der Notrufknopf", "emergency call button"], ["typisch", "typical"]], "q": [["Warum treffen sich die Geschwister?", "Ihr Vater ist gestürzt und in der Reha.", "Er kann vielleicht nicht mehr allein wohnen."], ["Warum ist Katrin wütend?", "Sie hat bisher fast alles allein gemacht.", "Seit dem Tod der Mutter."], ["Wie kann Florian aus Berlin helfen?", "Er übernimmt den Papierkram.", "Anträge bei Pflege- und Krankenkasse."], ["Welche Lösung schlägt der Vater vor?", "Unten im Haus wohnen, mit Pflegedienst und Notrufknopf.", "So braucht er die Treppe nicht."], ["Was lernen die Geschwister?", "Den Vater zuerst fragen.", "Die beste Idee kam von ihm."]], "say": ["Wir sind nicht mehr zwölf.", "Das kommt nicht in Frage.", "Dann sag mir, was ich tun kann.", "Hat ihn schon jemand gefragt?", "Ihr hättet mich nur früher fragen müssen."]}, {"id": 60, "title": "Das erste Date", "level": "B2", "topic": "Liebe & Kennenlernen", "rt": "ca. 6 Min.", "teaser": "Drei Wochen haben Leon und Selma in einer App geschrieben. Jetzt treffen sie sich in der Boulderhalle – und merken, dass Nachrichten und echte Menschen nicht ganz dasselbe sind.", "body": ["Leon Hartwig steht vor dem Spiegel im Flur und wechselt zum dritten Mal das T-Shirt. Das blaue sieht zu langweilig aus, das schwarze zu ernst, das mit dem Dinosaurier zu albern.", "„Nimm das graue“, ruft sein Mitbewohner Quentin vom Sofa, ohne aufzuschauen. „Das graue ist neutral. Neutral ist beim ersten Date gut.“", "„Seit wann bist du Experte?“", "„Seit ich sieben erste Dates hatte und null zweite. Ich weiß genau, was man nicht machen sollte.“", "Leon zieht das graue an. Seit drei Wochen schreibt er mit Selma. Sie haben sich über eine Dating-App kennengelernt. Er hat ihr Profilfoto gesehen, sie lachend auf einem Berg, und unter „Hobbys“ stand: Bouldern, schlechte Wortspiele, Pflanzen am Leben halten.", "Sie haben über alles geschrieben. Über Bücher, über ihre Jobs, über die beste Pizza in Freiburg. Selma hat vorgeschlagen, sich nicht im Café zu treffen, sondern in einer Boulderhalle.", "„Beim Klettern kann man nicht lügen“, hat sie geschrieben. „Da sieht man sofort, wie jemand mit Problemen umgeht.“", "Leon hat noch nie geklettert.", "Um 18 Uhr steht er vor der Halle in der Nähe vom Güterbahnhof. Drinnen hört man Musik und das dumpfe Geräusch von Menschen, die auf weiche Matten springen. Dann sieht er sie. Selma steht am Eingang, kleiner als er gedacht hatte, mit einer Mütze und Kreide an den Händen.", "„Leon?“", "„Selma. Hallo. Du siehst … genau aus wie auf dem Foto. Nur ohne Berg.“", "Sie lacht. „Und du siehst älter aus als auf deinem Foto. Wie alt war das denn?“", "„Ehrlich? Vier Jahre. Es war das einzige, auf dem ich nicht blinzle.“", "„Gut, dass du es zugibst. Ich habe nämlich geschummelt. Ich bin nicht eins siebzig, sondern eins zweiundsechzig.“", "„Dann sind wir quitt.“", "Sie leiht ihm Kletterschuhe aus. Sie sind so eng, dass Leon das Gefühl hat, seine Zehen hätten einen Knoten.", "„Die müssen so sein“, erklärt Selma. „Sonst rutscht man ab. Nach zehn Minuten merkst du es nicht mehr.“", "„Und nach elf Minuten?“", "„Dann tut es wieder weh. Komm, wir fangen mit Gelb an. Das ist am leichtesten.“", "Die erste gelbe Route schafft Leon. Bei der zweiten rutscht er nach zwei Griffen ab und landet auf dem Rücken auf der Matte. Er liegt da und schaut an die Decke.", "„Alles okay?“, fragt Selma und beugt sich über ihn.", "„Mein Stolz ist verletzt. Der Rest lebt.“", "„Versuch es nochmal. Diesmal mit den Beinen, nicht nur mit den Armen. Die meisten Anfänger ziehen sich nur hoch. Aber die Kraft kommt von unten.“", "Er versucht es noch einmal. Und noch einmal. Beim vierten Versuch kommt er oben an. Selma klatscht.", "„Siehst du! Du gibst nicht auf. Das ist ein gutes Zeichen.“", "„War das ein Test?“", "„Alles ist ein Test“, sagt sie und grinst. „Aber den hast du bestanden.“", "Nach anderthalb Stunden sitzen sie im kleinen Café der Halle. Leons Arme zittern so sehr, dass er die Tasse mit beiden Händen halten muss.", "„Darf ich dich was fragen?“, sagt Selma. „Warum hast du nicht gesagt, dass du noch nie geklettert bist? Ich habe es nach zwei Minuten gemerkt.“", "„Ich wollte nicht, dass du denkst, ich bin langweilig. Du hast so viele Hobbys. Ich habe … ich lese viel. Und ich koche.“", "„Leon. Lesen und kochen ist nicht langweilig. Lügen ist langweilig.“", "„Das war keine Lüge. Das war eine … Lücke in der Information.“", "„Eine sehr große Lücke. Mit Kletterschuhen drin.“", "Er lacht. „Okay. Dann ganz ehrlich: Ich war so nervös, dass ich dreimal das T-Shirt gewechselt habe.“", "„Wirklich? Ich habe meine Mütze aufgesetzt, weil ich heute keine Zeit mehr zum Haarewaschen hatte.“", "„Sie steht dir.“", "„Danke. Das graue T-Shirt steht dir auch. Sehr neutral.“", "„Das war die Idee von meinem Mitbewohner.“", "„Sag ihm, er hat recht gehabt.“", "Sie reden noch eine Stunde. Über ihre Familien, über Selmas Arbeit als Försterin im Schwarzwald, über Leons Job in einer Buchhandlung. Manchmal gibt es kleine Pausen, in denen keiner etwas sagt. Sie fühlen sich nicht unangenehm an.", "„Weißt du, was komisch ist?“, sagt Selma. „Wir haben drei Wochen geschrieben, und ich dachte, ich kenne dich. Aber heute habe ich mehr über dich gelernt als in hundert Nachrichten.“", "„Weil man beim Klettern nicht lügen kann?“", "„Weil du auf der Matte lagst und gelacht hast, statt dich zu ärgern.“", "Draußen vor der Halle stehen sie unschlüssig nebeneinander. Keiner weiß, ob jetzt eine Umarmung kommt oder ein Handschlag.", "„Also“, sagt Leon. „Ich würde dich gern wiedersehen. Aber diesmal bei mir. Ich koche. Da bin ich nämlich wirklich gut.“", "„Ist das eine Lücke in der Information oder die Wahrheit?“", "„Die Wahrheit. Mein Risotto hat schon Freundschaften gerettet.“", "„Dann nehme ich die Einladung an. Nächsten Samstag?“", "„Nächsten Samstag.“", "Sie umarmt ihn kurz. Dann geht sie zu ihrem Fahrrad, dreht sich noch einmal um und ruft: „Und Leon! Lösch das alte Foto aus der App. Du siehst in echt besser aus.“", "Zu Hause liegt Quentin immer noch auf dem Sofa.", "„Und? Zweites Date?“", "„Zweites Date.“", "Quentin setzt sich auf. „Wie hast du das gemacht?“", "„Ich bin viermal von der Wand gefallen.“", "„Das“, sagt Quentin, „verstehe ich nicht.“"], "gl": [["das Date", "date"], ["albern", "silly"], ["das Wortspiel", "pun"], ["die Boulderhalle / bouldern", "bouldering gym / to boulder"], ["dumpf", "dull / muffled"], ["die Matte", "mat"], ["die Kreide", "chalk"], ["schummeln", "to cheat (a little)"], ["quitt sein", "to be even / square"], ["eng", "tight"], ["abrutschen", "to slip off"], ["der Griff", "hold / grip"], ["der Stolz", "pride"], ["verletzt", "hurt / injured"], ["aufgeben", "to give up"], ["die Lücke", "gap"], ["stehen (Kleidung)", "to suit"], ["die Försterin", "forester (f.)"], ["unschlüssig", "undecided"], ["eine Einladung annehmen", "to accept an invitation"]], "q": [["Warum schlägt Selma eine Boulderhalle vor?", "Beim Klettern kann man nicht lügen.", "Man sieht, wie jemand mit Problemen umgeht."], ["Was haben beide in der App geschummelt?", "Leon ein altes Foto, Selma ihre Größe.", "Sie sind deshalb quitt."], ["Welchen Tipp gibt Selma beim Klettern?", "Mit den Beinen arbeiten, nicht nur mit den Armen.", "Die Kraft kommt von unten."], ["Was stört Selma mehr als ein langweiliges Hobby?", "Wenn jemand lügt.", "Leon nennt es eine „Lücke in der Information“."], ["Was gefällt Selma besonders an Leon?", "Er hat gelacht, statt sich zu ärgern.", "Und er hat nicht aufgegeben."]], "say": ["Du siehst genau aus wie auf dem Foto.", "Dann sind wir quitt.", "Mein Stolz ist verletzt, der Rest lebt.", "Ich würde dich gern wiedersehen.", "Dann nehme ich die Einladung an."]}, {"id": 61, "title": "Streit und Versöhnung", "level": "B2", "topic": "Beziehung & Kommunikation", "rt": "ca. 6 Min.", "teaser": "Es fängt mit einer Spülmaschine an und endet mit der Frage, wer in der Beziehung eigentlich an alles denkt. Leyla und Jakob lernen, richtig zu streiten.", "body": ["Es ist Dienstagabend, 21:30 Uhr. Leyla Aksoy kommt aus der Spätschicht im Labor nach Hause. Sie ist müde, ihre Füße tun weh, und sie hat nur einen Wunsch: eine Tasse Tee und das Sofa.", "Sie öffnet die Küchentür. Auf der Arbeitsfläche stehen die Teller vom Frühstück. Daneben ein Topf mit angetrockneten Nudeln. Die Spülmaschine ist voll – mit sauberem Geschirr, das niemand ausgeräumt hat.", "Im Wohnzimmer sitzt Jakob mit Kopfhörern vor dem Computer und spielt.", "„Jakob.“", "Keine Reaktion.", "„JAKOB!“", "Er nimmt einen Kopfhörer ab. „Oh, hey! Du bist schon da. Wie war die Schicht?“", "„Die Küche sieht aus wie ein Schlachtfeld.“", "„Ah. Ja. Ich wollte das gleich machen.“", "„Gleich. Du wolltest es gestern auch gleich machen. Und am Sonntag.“", "Jakob dreht sich auf dem Stuhl um. „Leyla, ich habe heute zehn Stunden gearbeitet. Ich wollte nur eine halbe Stunde abschalten.“", "„Und ich habe zwölf Stunden gearbeitet. Und jetzt muss ich erst die Spülmaschine ausräumen, bevor ich mir einen Tee machen kann, weil keine einzige saubere Tasse im Schrank ist.“", "„Dann nimm doch eine aus der Spülmaschine.“", "„Darum geht es nicht!“", "„Worum geht es dann? Um eine Tasse?“", "„Es geht darum, dass ich immer an alles denken muss!“, sagt Leyla, lauter, als sie wollte. „Wann der Müll rausmuss. Wann deine Mutter Geburtstag hat. Dass wir kein Klopapier mehr haben. Dass die Nebenkostenabrechnung bezahlt werden muss. Ich bin nicht deine Sekretärin!“", "Jakob steht auf. „Das ist jetzt unfair. Ich mache auch viel. Ich habe letzte Woche das Fahrrad repariert und die Lampe im Flur aufgehängt.“", "„Einmal! Das waren einmalige Sachen. Ich rede von den Dingen, die jeden Tag passieren. Die sieht man nicht, aber sie hören nie auf.“", "„Dann sag mir doch einfach, was ich machen soll!“", "„Genau das ist das Problem! Ich will es dir nicht sagen müssen! Wenn ich es dir sagen muss, muss ich ja trotzdem daran denken!“", "Stille. Jakob öffnet den Mund, schließt ihn wieder. Leyla dreht sich um, geht ins Schlafzimmer und macht die Tür zu. Nicht laut. Aber zu.", "Jakob bleibt im Wohnzimmer stehen. Dann setzt er sich hin, nimmt das Handy und ruft seine Schwester Theresa an.", "„Hey, Kleiner. Es ist zehn. Ist was passiert?“", "„Leyla und ich haben uns gestritten. Wegen der Spülmaschine. Glaube ich.“", "„Wegen der Spülmaschine. Glaubst du.“", "Er erzählt alles. Theresa hört zu, ohne ihn zu unterbrechen. Dann sagt sie:", "„Jakob. Es ging nicht um die Spülmaschine. Es ging um das, was sie gesagt hat: dass sie an alles denken muss. Das nennt man Mental Load. Das unsichtbare Organisieren.“", "„Aber ich helfe doch, wenn sie mich fragt.“", "„Genau das ist es. Du hilfst. Als wäre es ihr Haushalt und du ihr Assistent. Es ist aber euer Haushalt. Und das Denken gehört auch dazu.“", "Jakob schweigt lange.", "„Was soll ich jetzt machen?“", "„Erstens: Räum die Küche auf. Jetzt. Nicht gleich. Zweitens: Entschuldige dich, aber nicht mit ‚Tut mir leid, dass du dich ärgerst‘. Sondern für das, was du gemacht hast. Und drittens: Hör ihr zu. Ohne dich zu verteidigen.“", "Um 23 Uhr klopft Jakob an die Schlafzimmertür. In der Hand hält er eine Tasse Tee. Pfefferminz, mit einem Löffel Honig, so wie Leyla ihn mag.", "„Darf ich reinkommen?“", "Leyla liegt auf dem Bett und liest. Sie schaut auf, sagt nichts, aber sie nickt.", "Er setzt sich auf die Bettkante und gibt ihr den Tee.", "„Die Küche ist sauber. Die Spülmaschine ist ausgeräumt und wieder eingeräumt. Und ich wollte sagen: Es tut mir leid. Nicht, dass du sauer bist, sondern dass ich so lange nicht gesehen habe, wie viel du im Kopf hast. Du hast recht. Ich habe immer gewartet, bis du mir etwas sagst. Das war bequem für mich und anstrengend für dich.“", "Leyla hält die Tasse mit beiden Händen. Ihre Augen sind feucht.", "„Ich wollte auch nicht so laut werden. Es war nicht nur die Küche. Es war die ganze Woche. Ich war einfach am Ende.“", "„Ich weiß. Ich hätte es merken sollen.“", "„Was hat dich auf einmal so … klug gemacht?“", "Jakob grinst verlegen. „Theresa.“", "Leyla muss lachen, obwohl sie gerade noch geweint hat. „Natürlich. Grüß sie von mir.“", "„Ich habe einen Vorschlag“, sagt Jakob. „Wir setzen uns am Sonntag hin und schreiben alles auf, was im Haushalt passieren muss. Alles. Auch die unsichtbaren Sachen. Und dann teilen wir auf. Nicht, wer hilft, sondern wer verantwortlich ist. Ich übernehme ganz die Küche und den Einkauf. Mit Liste. Die ich selbst schreibe.“", "„Und die Geburtstage deiner Mutter?“", "„Die auch. Ich trage sie in meinen Kalender ein. Mit Erinnerung.“", "Leyla stellt die Tasse ab und lehnt den Kopf an seine Schulter.", "„Weißt du, was ich gelernt habe? Wenn wir streiten, sagen wir die Dinge, die wir schon lange denken. Nur zu laut und zu spät.“", "„Dann streiten wir in Zukunft früher“, sagt Jakob. „Und leiser.“", "„Und mit Tee.“", "„Immer mit Tee.“"], "gl": [["die Versöhnung / sich versöhnen", "reconciliation / to make up"], ["die Spätschicht", "late shift"], ["die Arbeitsfläche", "worktop"], ["angetrocknet", "dried-on"], ["ausräumen / einräumen", "to unload / load"], ["das Schlachtfeld", "battlefield"], ["abschalten", "to switch off / unwind"], ["das Klopapier", "toilet paper"], ["einmalig", "one-off"], ["unterbrechen", "to interrupt"], ["der Mental Load", "mental load"], ["unsichtbar", "invisible"], ["der Haushalt", "household / housework"], ["sich verteidigen", "to defend oneself"], ["die Bettkante", "edge of the bed"], ["bequem", "convenient / comfortable"], ["am Ende sein", "to be exhausted"], ["verlegen", "embarrassed"], ["aufteilen", "to divide up"], ["verantwortlich", "responsible"]], "q": [["Womit beginnt der Streit?", "Mit der unaufgeräumten Küche und der Spülmaschine.", "Leyla kommt müde von der Spätschicht."], ["Worum geht es Leyla wirklich?", "Dass sie an alles denken muss.", "Theresa nennt das Mental Load."], ["Warum reicht „Sag mir doch, was ich machen soll“ nicht?", "Dann muss Leyla trotzdem daran denken.", "Sie will nicht die Organisatorin sein."], ["Welche drei Tipps gibt Theresa?", "Aufräumen, richtig entschuldigen, zuhören.", "Ohne sich zu verteidigen."], ["Was schlägt Jakob am Ende vor?", "Alle Aufgaben aufschreiben und Verantwortung teilen.", "Er übernimmt Küche, Einkauf und Geburtstage."]], "say": ["Darum geht es nicht!", "Ich will es dir nicht sagen müssen.", "Darf ich reinkommen?", "Es tut mir leid, dass ich das nicht gesehen habe.", "Dann streiten wir in Zukunft früher – und leiser."]}, {"id": 62, "title": "Blind Date im Café", "level": "B2", "topic": "Liebe & Freundschaft", "rt": "ca. 6 Min.", "teaser": "Ihre Freundinnen haben ein Blind Date für Nesrin organisiert. Erkennungszeichen: ein gelber Schal. Leider tragen an diesem Tag zwei Männer im Café einen.", "body": ["„Ein gelber Schal“, sagt Nesrin ins Handy. „Das ist das Erkennungszeichen? Ernsthaft? Wir sind doch nicht in einem Agentenfilm.“", "„Es ist romantisch“, sagt ihre Freundin Carlotta am anderen Ende. „Du hast kein Foto von ihm, er hat keins von dir. Ihr lernt euch ganz ohne Vorurteile kennen. Er heißt Hendrik, er ist Tierarzt, er ist ein Cousin von Tims Kollegen, und er ist sehr nett. Mehr verrate ich nicht.“", "„Und woran erkennt er mich?“", "„Du trägst eine rote Mütze. Habe ich ihm geschrieben.“", "„Ich habe keine rote Mütze.“", "„Doch. Ich habe sie dir gestern in den Briefkasten gesteckt.“", "Am Sonntag um drei steht Nesrin mit roter Mütze vor dem Café Herzog in der Altstadt von Esslingen. Es ist voll. Es riecht nach Zimtschnecken und frischem Kaffee. Sie schaut sich um. Am Fenster sitzt ein Mann mit gelbem Schal und liest Zeitung. Erleichtert geht sie hin.", "„Hallo. Ich glaube, wir sind verabredet. Ich bin Nesrin.“", "Der Mann schaut auf. Er ist ungefähr fünfundsechzig, hat einen weißen Bart und freundliche Augen.", "„Oh. Das ist aber eine nette Überraschung. Ich bin Günther. Aber ich fürchte, ich bin nicht der, den Sie suchen. Ich warte auf meine Frau. Sie ist nur kurz auf der Toilette.“", "Nesrin wird knallrot. „Entschuldigung! Ich habe ein Blind Date, und das Erkennungszeichen ist ein gelber Schal.“", "Günther lacht herzlich. „Dann wünsche ich Ihnen viel Glück. Und wenn er nicht kommt, setzen Sie sich zu uns. Meine Frau liebt solche Geschichten.“", "Nesrin dreht sich um. In der hinteren Ecke, neben dem Kuchenbuffet, sitzt ein zweiter Mann mit gelbem Schal. Er ist etwa so alt wie sie, hat lockige Haare und schaut nervös auf die Tür. Als er die rote Mütze sieht, steht er auf.", "„Nesrin?“", "„Hendrik? Gott sei Dank. Ich habe gerade einen verheirateten Rentner angesprochen.“", "„Ich hab's gesehen“, sagt Hendrik und grinst. „Ich wollte gerade rüberkommen und ihn zum Duell fordern.“", "Sie setzen sich. Eine Kellnerin kommt. Nesrin bestellt einen Chai Latte, Hendrik einen Cappuccino und zwei Stück Käsekuchen.", "„Zwei? Für dich allein?“", "„Eins für dich. Carlotta hat Tim gesagt, du liebst Käsekuchen. Und Tim hat es seinem Kollegen gesagt, und der hat es mir gesagt.“", "„Stille Post“, sagt Nesrin. „Und? Was haben sie dir noch über mich erzählt?“", "„Dass du Grundschullehrerin bist. Nein, warte, Bauingenieurin. Oder warst du die mit den Pferden?“", "„Keins davon. Ich bin Logopädin. Ich arbeite mit Kindern, die Probleme mit dem Sprechen haben.“", "„Oh. Dann kommt bei der Stillen Post wirklich nicht viel an.“", "Sie lachen beide. Die Nervosität wird kleiner.", "„Und du bist Tierarzt?“, fragt Nesrin.", "„Fast. Ich bin Tierarzt für Nutztiere. Kühe, Schweine, Schafe. Also kein süßer Hund, der auf dem Tisch sitzt. Ich stehe meistens um fünf Uhr morgens in einem Stall.“", "„Klingt anstrengend.“", "„Es ist anstrengend. Aber ehrlich gesagt mag ich Kühe lieber als die meisten Menschen. Sie lügen nie.“", "„Und warum machst du dann ein Blind Date?“", "Hendrik zögert. „Weil mein Cousin gesagt hat, wenn ich noch ein Jahr nur mit Kühen rede, vergesse ich, wie das geht. Und weil ich keine Lust mehr auf Apps habe. Da wischt man Menschen nach links und rechts, als wären sie Fotos in einem Katalog.“", "„Das kenne ich“, sagt Nesrin. „Ich habe meine Dating-App letzten Monat gelöscht. Ich hatte drei Dates. Einer hat nur über seine Ex geredet. Einer hat die ganze Zeit aufs Handy geschaut. Und der dritte hat mir am Ende gesagt, er hätte mich nach den Fotos größer erwartet.“", "„Wie groß bist du denn?“", "„Eins achtundfünfzig.“", "„Perfekt. Ich bin eins vierundsiebzig. Dann muss ich mich beim Reden nicht so weit runterbeugen.“", "„Charmant.“", "Der Käsekuchen kommt. Er ist noch lauwarm. Nesrin nimmt einen Bissen und schließt die Augen.", "„Okay, Carlotta hatte recht. Mit dem Käsekuchen. Mit dir weiß ich es noch nicht.“", "„Fair“, sagt Hendrik. „Ich habe noch eine Stunde, um dich zu überzeugen.“", "„Nur eine Stunde?“", "„Um fünf muss ich zu einer Kuh in Plochingen. Sie bekommt ein Kalb. Kühe halten sich leider nicht an Verabredungen.“", "Sie reden. Über ihre Familien, über Nesrins Eltern aus Damaskus, die sie schon seit Jahren verheiraten wollen. Über Hendriks Großvater, der einen Bauernhof auf der Alb hatte. Über Bücher. Es stellt sich heraus, dass beide denselben Krimi gerade lesen und beide den Mörder schon auf Seite fünfzig erraten haben.", "Um 16:40 Uhr schaut Hendrik auf die Uhr. „Ich muss leider los. Die Kuh.“", "„Ich weiß. Die Kuh.“", "Er steht auf, setzt sich wieder hin. „Darf ich ehrlich sein? Ich würde dich gern wiedersehen. Ohne Schal und ohne Mütze. Mit Namen und Telefonnummer.“", "Nesrin tut so, als würde sie nachdenken. „Unter einer Bedingung. Ich will das Kalb sehen.“", "„Das Kalb?“", "„Ich war noch nie in einem Stall. Und wenn du um fünf Uhr morgens bei Kühen bist, will ich wissen, warum.“", "Hendrik strahlt. „Abgemacht. Nächsten Samstag. Zieh Gummistiefel an.“", "Er bezahlt und geht. An der Tür dreht er sich noch einmal um und winkt.", "Am Fenster winkt Günther. Neben ihm sitzt inzwischen eine kleine Frau mit grauen Locken.", "„Und?“, ruft Günther durch das halbe Café. „Ist es der Richtige?“", "„Weiß ich noch nicht“, ruft Nesrin zurück. „Aber nächsten Samstag gehe ich in einen Kuhstall.“", "Die Frau von Günther klatscht begeistert. „So hat es bei uns auch angefangen! Nur mit Schweinen!“", "Am Abend schreibt Nesrin an Carlotta: „Danke für die Mütze. Ich behalte sie.“"], "gl": [["das Blind Date", "blind date"], ["das Erkennungszeichen", "identifying sign"], ["ernsthaft", "seriously"], ["das Vorurteil", "prejudice"], ["verabredet sein", "to have arranged to meet"], ["knallrot werden", "to turn bright red"], ["der Rentner", "pensioner"], ["jemanden ansprechen", "to approach / speak to someone"], ["zum Duell fordern", "to challenge to a duel"], ["die Stille Post", "Chinese whispers"], ["die Logopädin", "speech therapist (f.)"], ["das Nutztier", "farm animal"], ["der Stall", "barn / stable"], ["wischen", "to swipe"], ["lauwarm", "lukewarm"], ["überzeugen", "to convince"], ["das Kalb", "calf"], ["sich herausstellen", "to turn out"], ["erraten", "to guess"], ["die Gummistiefel", "wellies / rubber boots"]], "q": [["Was ist das Erkennungszeichen?", "Ein gelber Schal für ihn, eine rote Mütze für sie.", "Fotos gibt es keine."], ["Was passiert Nesrin zuerst?", "Sie spricht den falschen Mann an.", "Günther wartet auf seine Frau."], ["Warum stimmen die Infos über Nesrin nicht?", "Sie wurden über viele Personen weitergegeben.", "Wie bei der Stillen Post."], ["Warum hat Hendrik keine Lust mehr auf Apps?", "Man wischt Menschen wie Katalogfotos.", "Auch Nesrin hat ihre App gelöscht."], ["Welche Bedingung stellt Nesrin für ein zweites Treffen?", "Sie will das Kalb im Stall sehen.", "Sie war noch nie in einem Stall."]], "say": ["Ich glaube, wir sind verabredet.", "Ich fürchte, ich bin nicht der, den Sie suchen.", "Was haben sie dir noch über mich erzählt?", "Darf ich ehrlich sein?", "Unter einer Bedingung."]}, {"id": 63, "title": "Fasnet in Rottweil", "level": "B2", "topic": "Feste & Tradition", "rt": "ca. 6 Min.", "teaser": "Aiko denkt bei Karneval an Köln und Kamelle. Doch die schwäbisch-alemannische Fasnet ist anders: Holzmasken, Glocken, Narrensprung – und ein Narr, der ihren Namen kennt.", "body": ["Es ist Rosenmontag, sieben Uhr morgens, und es ist eiskalt. Aiko Tanabe steht in der Hauptstraße von Rottweil zwischen tausenden Menschen und reibt sich die Hände. Neben ihr steht ihre Kollegin Franziska, eingepackt in eine dicke Jacke, mit einer Thermoskanne Kaffee.", "„Warum so früh?“, fragt Aiko. „In Köln fangen die Umzüge doch mittags an. Das habe ich im Fernsehen gesehen.“", "„Das hier ist nicht Köln“, sagt Franziska ernst. „Das hier ist Fasnet. Schwäbisch-alemannisch. Das ist etwas ganz anderes. Bei uns wirft niemand Kamelle, und niemand singt Schlager.“", "„Was passiert dann?“", "„Warte ab. Um Punkt acht geht es los. Und wenn sie kommen, bleib ganz ruhig.“", "„Wer ist ‚sie‘?“", "Franziska lächelt geheimnisvoll.", "Um acht Uhr schlägt die Kirchturmuhr. Für einen Moment ist es still. Dann öffnet sich das Schwarze Tor am Ende der Straße, und ein unglaublicher Lärm beginnt. Hunderte Gestalten springen durch das Tor. Sie tragen geschnitzte Holzmasken mit starren, lächelnden Gesichtern und bunte Kostüme aus Leinen. An ihren Gürteln hängen große Glocken, die bei jedem Sprung laut scheppern.", "Aiko hält sich die Ohren zu. „Was ist das?“", "„Der Narrensprung!“, ruft Franziska. „Die Narren springen durch die ganze Altstadt. Das machen sie seit Jahrhunderten.“", "„Warum tragen sie Masken aus Holz?“", "„Die nennt man Larven. Die werden von Hand geschnitzt und in der Familie weitervererbt. Manche sind über hundert Jahre alt. Der Narr hinter der Maske ist anonym. Niemand soll wissen, wer drunter steckt.“", "Ein Narr mit einem riesigen Federhut tanzt vorbei. Er macht große, elegante Sprünge, fast wie ein Balletttänzer.", "„Darf man die Narren anfassen?“, fragt Aiko.", "„Lieber nicht. Aber wenn dir einer etwas schenkt, nimmst du es. Das bringt Glück.“", "„Das ist der Federahannes“, erklärt Franziska. „Der wichtigste Narr in Rottweil. Er hat einen Stab und springt so hoch er kann. Wer das gut kann, ist eine Legende.“", "Plötzlich bleibt ein Narr direkt vor Aiko stehen. Er trägt ein weißes Kostüm, bemalt mit bunten Figuren, und eine Maske mit einem roten Mund und runden Wangen. Er hält einen Korb mit Brezeln und schaut sie lange an. Die Glocken an seinem Gürtel sind jetzt still.", "„Du bisch it vo do, gell?“, sagt er mit verstellter, hoher Stimme.", "Aiko schaut Franziska hilflos an. „Was hat er gesagt?“", "„Er sagt auf Schwäbisch: ‚Du bist nicht von hier, oder?‘“", "„Nein“, sagt Aiko vorsichtig zu der Maske. „Ich komme aus Osaka. Ich wohne seit einem Jahr in Deutschland.“", "„Und du schaffsch bei de Firma Hummel in Villingen, gell? In dr Konstruktion.“", "Aiko erstarrt. „Woher wissen Sie das?“", "Der Narr kichert, gibt ihr eine Brezel aus dem Korb und tippt ihr mit dem Finger auf die Nase. Dann springt er weiter, die Glocken scheppern, und er ist in der Menge verschwunden.", "„Franziska! Woher weiß der, wo ich arbeite?“", "Franziska lacht so sehr, dass sie Kaffee verschüttet. „Das nennt man Aufsagen. Die Narren erzählen den Leuten Dinge, die sie von ihnen wissen. Kleine Peinlichkeiten, Geschichten aus dem Dorf. Es ist ein Teil der Tradition. Und es ist nicht böse gemeint.“", "„Aber wer war das?“", "„Keine Ahnung. Das ist ja der Witz. Es kann jeder sein. Dein Nachbar, der Bäcker, dein Chef.“", "„Mein Chef wohnt in Rottweil.“", "„Siehst du. Und er hat letzt
