en nach zwanzig Uhr. Keine Fotos von anderen ohne Erlaubnis. Wer etwas Gemeines liest, schreibt einem Erwachsenen. Und kein Kind wird aus der Gruppe geworfen, als Strafe. Die Kinder haben die Regeln selbst unterschrieben. Das war ihnen viel wichtiger als unsere.“", "Frau Seidenfaden nickt langsam. „Das wäre etwas für die Klassenratsstunde. Ich könnte das mit den Kindern erarbeiten. Wenn die Eltern das zu Hause unterstützen.“", "„Und mein Sohn ohne Handy?“, fragt der Vater.", "„Dann gibt es Informationen für die Klasse nicht nur im Chat“, sagt Svetlana. „Sondern auch auf Papier oder über die Schul-App. Damit niemand ausgeschlossen ist, nur weil er kein Handy hat.“", "Einige Eltern klatschen. Svetlana wird rot.", "„Wunderbar“, sagt Frau Seidenfaden, und in ihren Augen funkelt etwas. „Damit kommen wir zu Punkt vier. Die Wahl der Elternvertretung. Gibt es Vorschläge?“", "Achtundzwanzig Augenpaare richten sich auf Svetlana.", "„Nein, nein“, sagt sie schnell. „Ich bin neu. Ich kenne das System nicht. Ich habe nur …“", "„Sie haben gerade in fünf Minuten einen Streit gelöst, an dem ich seit drei Wochen scheitere“, sagt Frau Seidenfaden. „Das System lernen Sie in einem Abend. Die Elternvertretung vermittelt zwischen Eltern, Klasse und Schule. Und es gibt immer eine Stellvertretung.“", "Die Mutter am Fenster hebt die Hand. „Ich mache die Stellvertretung. Wenn Sie vorne sind. Ich bin Gudrun Lohmann. Ich kenne das System seit vier Kindern.“", "Svetlana schaut sie an. Gudrun lächelt aufmunternd.", "„Okay“, sagt Svetlana. „Aber nur, wenn wir zu zweit sind. Und wenn mir jemand erklärt, was eine Gesamtelternbeiratssitzung ist.“", "Die Wahl ist einstimmig, bei einer Enthaltung. Es ist Svetlanas eigene Stimme.", "Zu Hause sitzt Alina noch wach im Schlafanzug am Küchentisch.", "„Mama, wie war es?“", "„Interessant. Ich bin jetzt Elternvertreterin.“", "Alina reißt die Augen auf. „Du? Du wolltest doch nichts sagen!“", "„Wollte ich auch nicht. Aber manchmal muss man.“ Sie setzt sich zu ihr. „Und nächste Woche schreibt ihr in der Klasse Regeln für euren Chat. Ihr selbst.“", "Alina überlegt. „Darf ich eine Regel vorschlagen? Niemand macht sich über einen Akzent lustig.“", "„Das ist die wichtigste Regel von allen“, sagt Svetlana und küsst ihre Tochter auf die Stirn."], "gl": [["der Elternabend", "parents' evening"], ["die Elternvertretung", "parent representative(s)"], ["die Tagesordnung", "agenda"], ["lebhaft", "lively"], ["die Jugendherberge", "youth hostel"], ["happig (ugs.)", "steep (price)"], ["das Bildungs- und Teilhabepaket", "education and participation benefit"], ["der Förderverein", "school support association"], ["vertraulich", "confidential(ly)"], ["gereizt", "tense / irritable"], ["der Ranzen", "school bag"], ["ausgeschlossen", "excluded"], ["untergehen (Stimme)", "to be drowned out"], ["nachmachen", "to imitate / mimic"], ["gemein", "mean"], ["der Klassenrat", "class council"], ["vermitteln", "to mediate"], ["die Stellvertretung", "deputy"], ["aufmunternd", "encouraging(ly)"], ["einstimmig", "unanimous(ly)"]], "q": [["Was passiert, wenn eine Familie die Klassenfahrt nicht bezahlen kann?", "Es gibt Zuschüsse und Hilfe vom Förderverein.", "Kein Kind bleibt wegen Geld zu Hause."], ["Was ist das eigentliche Handy-Problem?", "Der Ton im Klassenchat.", "Ein Kind war nach Nachrichten sehr traurig."], ["Welche zwei Fragen trennt Svetlana?", "Ab wann ein Handy und wie die Kinder im Chat sprechen.", "Die erste entscheidet jede Familie, die zweite alle gemeinsam."], ["Wie sollen Kinder ohne Handy einbezogen werden?", "Informationen auch auf Papier oder per Schul-App.", "Damit niemand ausgeschlossen ist."], ["Warum wird Svetlana gewählt?", "Sie hat den Streit geschickt gelöst.", "Gudrun übernimmt die Stellvertretung."]], "say": ["Darf ich etwas sagen?", "Ich glaube, wir streiten über zwei Fragen gleichzeitig.", "Das muss jede Familie selbst entscheiden.", "Aber nur, wenn wir zu zweit sind.", "Manchmal muss man."]}, {"id": 98, "title": "Die Bürgerinitiative", "level": "C1", "topic": "Gesellschaft & Mitbestimmung", "rt": "ca. 7 Min.", "teaser": "Die Stadt will die Bäume in der Lindenallee fällen, um Parkplätze zu bauen. Mariam gründet eine Bürgerinitiative – und merkt bald, dass Wut allein im Gemeinderat nichts bewirkt.", "body": ["An einem Montagmorgen im Februar hängt an jeder Linde in der Lindenallee in Schorndorf ein laminierter Zettel: „Bekanntmachung. Fällung der Bäume im Zuge der Neugestaltung der Verkehrsfläche. Beginn: 1. März.“ Vierzehn Linden, manche über achtzig Jahre alt. An ihrer Stelle sollen zweiundzwanzig Parkplätze entstehen.", "Mariam Sadeghi wohnt seit sechs Jahren in Nummer 17. Sie ist Landschaftsarchitektin, und sie liest den Zettel dreimal. Dann klingelt sie bei ihrem Nachbarn Ewald Pfisterer, einem pensionierten Richter, der jeden Morgen unter den Linden seinen Hund ausführt.", "„Herr Pfisterer, haben Sie das gesehen?“", "„Habe ich. Ich habe heute Nacht nicht geschlafen.“", "„Wir müssen etwas tun. Eine Petition, eine Demo, irgendetwas.“", "Herr Pfisterer bittet sie herein und setzt Kaffee auf. „Frau Sadeghi, darf ich Ihnen aus Erfahrung etwas sagen? Ich habe vierzig Jahre lang Menschen erlebt, die wütend in einen Gerichtssaal kamen. Die Wütenden haben selten gewonnen. Die Vorbereiteten fast immer.“", "„Und was heißt vorbereitet?“", "„Erstens: Wir müssen wissen, wer entschieden hat und auf welcher Grundlage. Zweitens: Wir brauchen eine Alternative, keinen bloßen Protest. Und drittens: Wir brauchen Verbündete, auch solche, die anders denken als wir.“", "Am Abend treffen sich elf Nachbarinnen und Nachbarn in Mariams Wohnzimmer. Sie gründen die „Bürgerinitiative Lindenallee“. Mariam übernimmt die Fachargumente, Herr Pfisterer das Rechtliche, ein Student namens Levin die sozialen Medien.", "„Ich habe im Ratsinformationssystem nachgesehen“, berichtet Herr Pfisterer eine Woche später. „Der Gemeinderat hat das im November beschlossen. Öffentliche Sitzung, aber kaum jemand war da. Die Begründung: Der Einzelhandel in der Innenstadt klagt über fehlende Parkplätze.“", "„Der Einzelhandel“, sagt Levin. „Also sind die Geschäftsleute unsere Gegner.“", "„Nicht unbedingt“, sagt Mariam. „Sie haben ein echtes Problem. Wir müssen ihr Problem lösen, ohne die Bäume zu opfern.“", "Sie verbringt drei Nächte mit Plänen. Dann hat sie eine Idee: Auf dem Gelände der ehemaligen Post, zweihundert Meter entfernt, steht seit Jahren ein leeres Grundstück. Dort hätten fünfunddreißig Parkplätze Platz. Mehr als in der Allee.", "Sie gehen zu Frau Reutter, die das Schuhgeschäft am Marktplatz führt und im Gewerbeverein sitzt.", "„Ich verstehe Sie“, sagt Frau Reutter misstrauisch. „Bäume sind schön. Aber meine Kundschaft ist über sechzig und will nicht weit laufen.“", "„Zweihundert Meter“, sagt Mariam. „Und wir schlagen vor, dass dort auch Behindertenparkplätze und Fahrradbügel entstehen. Mehr Plätze als geplant. Und die Allee bleibt der schönste Weg zu Ihrem Laden.“", "Frau Reutter schaut lange auf den Plan. „Wenn das so kommt, unterschreibe ich. Und ich rede mit den anderen im Gewerbeverein.“", "Die Initiative sammelt in drei Wochen über zweitausend Unterschriften. Herr Pfisterer stellt einen Antrag auf eine Einwohnerversammlung. Dann kommt der Abend der Gemeinderatssitzung.", "Der Saal ist voll. Viele tragen grüne Schals. Oberbürgermeister Haselmaier eröffnet die Sitzung und lässt Mariam fünf Minuten sprechen. Ihre Hände zittern, aber ihre Stimme nicht.", "„Meine Damen und Herren, wir sind nicht gegen Parkplätze. Wir sind für eine bessere Lösung. Das Postgelände bietet fünfunddreißig Plätze statt zweiundzwanzig. Die Kosten sind laut Kostenschätzung eines unabhängigen Büros vergleichbar. Und die Linden kühlen die Straße im Sommer um mehrere Grad. Das hat einen Wert, der in keiner Parkplatzrechnung steht.“", "Ein Stadtrat hebt die Hand. „Das Postgelände gehört nicht der Stadt. Wie wollen Sie das lösen?“", "„Mit einem Pachtvertrag. Wir haben mit dem Eigentümer gesprochen. Er wäre bereit, es für zehn Jahre zu verpachten.“", "Es wird unruhig im Saal. Der Oberbürgermeister klopft mit dem Stift. „Das sind neue Informationen. Ich schlage vor, den Beschluss vom November auszusetzen und die Verwaltung mit einer Prüfung zu beauftragen.“", "Die Abstimmung: einundzwanzig dafür, sieben dagegen.", "Draußen vor dem Rathaus umarmen sich Fremde. Levin filmt alles. Frau Reutter kommt zu Mariam.", "„Gut gemacht. Aber wenn die Parkplätze nicht kommen, stehe ich nächstes Jahr wieder hier. Auf der anderen Seite.“", "„Das ist fair“, sagt Mariam. „Dann haben wir etwas falsch gemacht.“", "Herr Pfisterer klopft ihr auf die Schulter. „Wissen Sie, was Sie heute gewonnen haben? Nicht die Bäume. Noch nicht. Sie haben gewonnen, dass man Ihnen zuhört. Das ist in der Demokratie das Wichtigste.“", "Im Juni beginnen die Bauarbeiten auf dem Postgelände. Die Linden blühen. Und an einer von ihnen hängt ein neuer Zettel, diesmal von der Initiative: „Danke, dass ihr geblieben seid.“"], "gl": [["die Bürgerinitiative", "citizens' action group"], ["die Bekanntmachung", "public notice"], ["die Fällung / fällen", "felling / to fell"], ["die Neugestaltung", "redesign"], ["der Richter", "judge"], ["die Petition", "petition"], ["die Grundlage", "basis"], ["der Verbündete", "ally"], ["das Ratsinformationssystem", "council information system"], ["der Gemeinderat", "municipal council"], ["der Einzelhandel", "retail trade"], ["das Grundstück", "plot of land"], ["misstrauisch", "suspicious"], ["der Gewerbeverein", "local business association"], ["die Einwohnerversammlung", "residents' assembly"], ["der Oberbürgermeister", "mayor"], ["die Kostenschätzung", "cost estimate"], ["der Pachtvertrag / verpachten", "lease / to lease"], ["aussetzen", "to suspend"], ["beauftragen", "to commission"]], "q": [["Was soll mit den Linden passieren?", "Sie sollen für Parkplätze gefällt werden.", "Vierzehn Bäume, 22 Parkplätze."], ["Welchen Rat gibt Herr Pfisterer?", "Vorbereitet statt wütend sein.", "Grundlage kennen, Alternative bieten, Verbündete suchen."], ["Warum sieht Mariam die Geschäftsleute nicht als Gegner?", "Sie haben ein echtes Problem.", "Man muss es lösen, ohne die Bäume zu opfern."], ["Was ist die Alternative?", "Parkplätze auf dem alten Postgelände.", "35 statt 22 Plätze."], ["Was hat Mariam laut Herrn Pfisterer gewonnen?", "Dass man ihr zuhört.", "Das ist in der Demokratie das Wichtigste."]], "say": ["Wir müssen etwas tun.", "Wir sind nicht gegen Parkplätze, wir sind für eine bessere Lösung.", "Wie wollen Sie das lösen?", "Wenn das so kommt, unterschreibe ich.", "Dann haben wir etwas falsch gemacht."]}, {"id": 99, "title": "Der Trauerfall", "level": "C1", "topic": "Abschied & Anteilnahme", "rt": "ca. 7 Min.", "teaser": "Der Vater ihrer Kollegin Johanna ist gestorben. Darja weiß nicht, was man sagt, was man schreibt und ob man zur Beerdigung gehen darf. Ein älterer Kollege hilft ihr – und erzählt von seinem eigenen Vater.", "body": ["Die Nachricht kommt am Mittwoch per Mail an das ganze Team: „Liebe Kolleginnen und Kollegen, der Vater von Johanna Kerber ist am Montag nach kurzer, schwerer Krankheit verstorben. Johanna ist bis auf Weiteres nicht im Büro. Die Trauerfeier findet am Dienstag um 14 Uhr auf dem Waldfriedhof statt.“", "Darja Iwanowa sitzt an ihrem Schreibtisch im Planungsbüro in Pforzheim und liest die Mail zweimal. Johanna sitzt ihr gegenüber. Sie haben in den letzten zwei Jahren fast jeden Mittag zusammen gegessen. Darja weiß, dass Johannas Vater Schreiner war, dass er Kirschkuchen liebte und dass Johanna ihn jeden Sonntag besucht hat.", "Und sie weiß nicht, was sie jetzt tun soll.", "In der Teeküche trifft sie Bernhard Gutekunst, den ältesten Kollegen im Büro, kurz vor der Rente.", "„Bernhard, darf ich dich etwas fragen? Es ist mir ein bisschen peinlich.“", "„Frag ruhig.“", "„Wegen Johanna. Was macht man in Deutschland in so einer Situation? Bei uns in Russland ruft man an, man bringt Essen, man sitzt zusammen. Aber hier … Ich habe Angst, dass ich zu viel mache. Oder zu wenig.“", "Bernhard stellt seine Tasse ab. „Das ist keine peinliche Frage. Das ist eine sehr gute. Die meisten Leute fragen nicht und machen dann gar nichts, weil sie Angst haben, etwas falsch zu machen. Das ist das Schlimmste.“", "„Und was ist richtig?“", "„Erst mal eine Karte. Eine Trauerkarte, mit der Hand geschrieben. Das ist hier noch sehr üblich. Wir sammeln auch im Team, für einen Kranz oder eine Spende. Das organisiert meistens die Teamleitung.“", "„Was schreibt man in so eine Karte? Ich habe Angst, dass mein Deutsch zu einfach klingt.“", "„Einfach ist gut. Niemand will in so einem Moment schöne Formulierungen lesen. Er will lesen, dass jemand an ihn denkt. Schreib nicht ‚Ich weiß, wie du dich fühlst‘. Das weiß keiner. Und schreib nicht ‚Er hat es jetzt besser‘. Das hören Trauernde nicht gern. Schreib, was du von ihm weißt. Und dass du da bist.“", "„Was ich von ihm weiß?“", "„Johanna hat doch oft von ihm erzählt, oder? Der Kirschkuchen. Die Werkstatt. Schreib eine Erinnerung auf. Das ist das Wertvollste, was man einem Trauernden schenken kann: einen Beweis, dass der Mensch Spuren hinterlassen hat.“", "Darja schweigt eine Weile. „Und die Beerdigung? Darf ich hingehen? Ich kannte ihn ja nicht.“", "„Wenn die Trauerfeier in der Anzeige oder in der Mail genannt wird, sind alle willkommen. Du gehst nicht für ihn hin. Du gehst für Johanna. Dunkle Kleidung, nicht unbedingt schwarz. Danach gibt es oft einen Leichenschmaus, also Kaffee und Kuchen im Gasthaus. Dahin gehst du nur, wenn die Familie dich ausdrücklich einlädt.“", "„Leichenschmaus“, wiederholt Darja. „Was für ein Wort.“", "„Ja. Klingt schrecklich. Ist aber oft das erste Mal, dass die Familie wieder lacht.“", "Bernhard schaut aus dem Fenster. Dann sagt er leiser: „Als mein Vater gestorben ist, war ich dreißig. Im Büro hat damals niemand etwas gesagt. Kein Wort. Als ich nach einer Woche zurückkam, haben alle so getan, als wäre nichts passiert. Ich glaube, sie wollten mich schonen. Aber ich habe mich gefühlt, als wäre mein Vater unsichtbar gewesen.“", "„Das tut mir leid.“", "„Nur eine Kollegin hat mir einen Zettel auf den Schreibtisch gelegt. Darauf stand nur: ‚Ich habe an dich gedacht. Wenn du reden willst, ich bin da. Wenn nicht, auch gut.‘ Den Zettel habe ich heute noch.“", "Am Abend schreibt Darja die Karte. Sie braucht drei Entwürfe. Am Ende steht da: „Liebe Johanna, es tut mir so leid. Ich denke an deinen Vater, der den besten Kirschkuchen gebacken hat und von dem du immer mit so viel Liebe erzählt hast. Ich bin für dich da. Wenn du reden willst, oder auch nur zusammen schweigen. Deine Darja.“", "Am Dienstag steht sie auf dem Waldfriedhof, ganz hinten, in ihrem dunkelblauen Mantel. Nach der Feier geht sie nicht nach vorne, um Johanna nicht zu bedrängen. Doch Johanna sieht sie und kommt durch die Menschen zu ihr. Sie umarmt sie lange.", "„Danke für die Karte. Das mit dem Kirschkuchen. Ich habe so geweint. Und dann gelacht. Kommst du noch mit ins Gasthaus? Meine Mutter würde dich gern kennenlernen.“", "„Wenn ich darf, gern.“", "Im Gasthaus erzählt Johannas Mutter, wie ihr Mann einmal eine ganze Küche falsch herum eingebaut hat. Alle lachen. Bernhard hatte recht.", "Zwei Wochen später kommt Johanna zurück ins Büro. Auf ihrem Schreibtisch steht ein kleiner Blumentopf, ohne Absender. Darja fragt nicht, und Johanna fragt nicht. Aber als Bernhard an diesem Morgen an ihrem Platz vorbeigeht, sagt Johanna leise: „Danke, Bernhard.“", "Er nickt nur. Und am Mittag gehen Darja und Johanna wie früher zusammen essen. Sie reden über die Arbeit, über das Wetter, über nichts. Und einmal, ganz kurz, über einen Kirschkuchen."], "gl": [["der Trauerfall", "bereavement"], ["die Anteilnahme", "sympathy / condolence"], ["versterben", "to pass away"], ["bis auf Weiteres", "until further notice"], ["die Trauerfeier", "funeral service"], ["die Trauerkarte", "condolence card"], ["der Kranz", "wreath"], ["die Spende", "donation"], ["der/die Trauernde", "bereaved person"], ["Spuren hinterlassen", "to leave traces / a mark"], ["die Beerdigung", "burial / funeral"], ["die Traueranzeige", "death notice"], ["der Leichenschmaus", "funeral reception"], ["ausdrücklich", "explicitly"], ["schonen", "to spare / protect"], ["der Entwurf", "draft"], ["bedrängen", "to crowd / press"], ["der Absender", "sender"], ["der Schreiner", "carpenter / joiner"], ["schweigen", "to be silent"]], "q": [["Warum ist Darja unsicher?", "Sie kennt die deutschen Gepflogenheiten bei Trauerfällen nicht.", "Sie hat Angst, zu viel oder zu wenig zu tun."], ["Was ist laut Bernhard das Schlimmste?", "Aus Angst gar nichts zu machen.", "Trauernde fühlen sich dann allein."], ["Was soll man nicht in eine Trauerkarte schreiben?", "„Ich weiß, wie du dich fühlst“ oder „Er hat es jetzt besser“.", "Besser eine persönliche Erinnerung."], ["Wann geht man zum Leichenschmaus?", "Nur bei ausdrücklicher Einladung der Familie.", "Zur Trauerfeier dürfen alle kommen."], ["Warum erzählt Bernhard von seinem Vater?", "Damals hat niemand im Büro etwas gesagt.", "Nur ein kleiner Zettel hat ihm geholfen."]], "say": ["Es tut mir so leid.", "Ich habe an dich gedacht.", "Wenn du reden willst, bin ich da.", "Darf ich zur Trauerfeier kommen?", "Wenn ich darf, gern."]}, {"id": 100, "title": "Das Jubiläum", "level": "C1", "topic": "Arbeit & Rückblick", "rt": "ca. 7 Min.", "teaser": "Zehn Jahre IT-Support bei derselben Firma. Saba soll beim Jubiläum ein paar Worte sagen. Sie weiß nicht, ob sie über Drucker, Passwörter oder etwas ganz anderes sprechen soll.", "body": ["Es ist Freitagnachmittag in Nussloch. In der Kantine hängen Luftballons, auf einem Tisch steht ein Blech Butterkuchen, und auf einem Banner über der Tür steht in großen Buchstaben: „10 Jahre Saba – danke!“", "Saba steht im Flur und schaut durch die Glastür. Sie arbeitet seit zehn Jahren im IT-Support. Damals sprach sie kaum Deutsch. Heute soll sie eine kleine Rede halten. Vor dem ganzen Standort.", "Ihr Kollege Dennis kommt mit zwei Bechern Kaffee um die Ecke. „Na, Lampenfieber?“", "„Ein bisschen. Ich weiß nicht, was ich sagen soll. Über Drucker? Über Passwörter? Das ist doch langweilig.“", "„Weißt du, was die Leute hören wollen?“, sagt Dennis. „Nicht, was du repariert hast. Sondern was du erlebt hast. Erzähl eine Geschichte.“", "„Welche denn? Es gibt so viele.“", "„Die vom ersten Tag vielleicht?“", "Saba muss lachen. Sie erinnert sich genau.", "Um vier Uhr ist die Kantine voll. Ihr Chef, Herr Hollerbach, hält eine kurze Ansprache. Er erzählt, dass Saba in zehn Jahren ungefähr achtzehntausend Tickets bearbeitet hat. Dann reicht er ihr das Mikrofon.", "„Liebe Kolleginnen und Kollegen“, beginnt Saba. Ihre Stimme zittert ein bisschen. „Achtzehntausend Tickets. Das klingt viel. Aber ich will euch von meinem allerersten Anruf erzählen.“", "Es wird still.", "„Es war mein erster Tag. Ich saß am Telefon, mein Deutsch war noch sehr schlecht. Das Telefon klingelt. Ein Mann aus der Buchhaltung sagt: ‚Mei Maus isch hin. Machen Sie hopp, gell?‘ Ich habe nichts verstanden. Maus? Ein Tier? Hopp? Gell? Ich dachte, er spricht eine andere Sprache.“", "Die Leute lachen. In der ersten Reihe wird ein älterer Herr rot. Es ist Herr Brunner.", "„Ich bin trotzdem hingegangen, mit meinem Wörterbuch in der Tasche. Die Maus war gar nicht kaputt. Sie war kabellos – und die Batterie war leer. Herr Brunner wusste nicht einmal, dass seine Maus eine Batterie hat. Er war so peinlich berührt, dass er mir am nächsten Tag eine Brezel gebracht hat. Und mir erklärt hat, was ‚gell‘ heißt.“", "„Und was heißt es?“, ruft jemand von hinten.", "„Es heißt: Ich mag dich eigentlich, aber ich bin gerade gestresst“, sagt Saba. Die ganze Kantine lacht, Herr Brunner am lautesten.", "„In zehn Jahren habe ich viel gelernt. Nicht nur über Technik. Ich habe gelernt, dass ‚Das geht nicht‘ oft heißt: ‚Ich habe Angst, etwas kaputt zu machen.‘ Ich habe gelernt, dass die meisten Probleme fünf Minuten dauern, aber die Menschen danach eine halbe Stunde reden wollen. Und ich habe gelernt, dass ‚Haben Sie es schon mal aus- und wieder eingeschaltet?‘ nicht nur für Computer gilt. Manchmal auch für Menschen. Nach dem Urlaub zum Beispiel.“", "Wieder Lachen. Saba atmet durch. Jetzt kommt der schwierige Teil.", "„Als ich hier angefangen habe, hatte ich große Angst. Angst, dass man mich nicht versteht. Angst, dass ich nicht dazugehöre. Ihr habt mir nie das Gefühl gegeben, dass ich zu langsam spreche. Ihr habt gewartet, bis ich das richtige Wort gefunden habe. Manchmal habt ihr mir das Wort geschenkt. Dafür möchte ich danken. Mehr als für jede Brezel.“", "Sie schaut zu Herrn Brunner. „Na gut. Fast mehr als für jede Brezel.“", "Applaus. Lange. Ein paar Leute stehen auf.", "Danach kommen viele zu ihr. Annette aus dem Personalbereich umarmt sie. Ein junger Azubi aus dem Lager fragt schüchtern, ob er sie mal zum Thema Ausbildung im IT-Bereich fragen darf.", "„Natürlich. Komm am Montag vorbei. Ich habe immer Kaffee.“", "Herr Brunner wartet, bis die meisten gegangen sind. Er hat eine Papiertüte in der Hand.", "„Frau Pervaiz. Zehn Jahre. Und Sie erzählen die Geschichte mit der Maus vor allen Leuten.“", "„Es tut mir leid, Herr Brunner. War das zu viel?“", "„Nein, nein. Ich habe mich gefreut. Wirklich. Wissen Sie, ich gehe nächstes Jahr in Rente. Und das ist die schönste Geschichte, die man über mich erzählen kann. Dass ich der Erste war, der Ihnen ein schwäbisches Wort beigebracht hat.“", "Er reicht ihr die Tüte. Darin: eine Brezel. Und ein kleiner Zettel, in ordentlicher Handschrift: „Für die beste IT der Welt. Machen Sie weiter so, gell?“", "Saba lacht und hat gleichzeitig Tränen in den Augen.", "„Herr Brunner, eine Frage noch. Ihre Maus. Funktioniert die eigentlich?“", "„Die Batterie ist seit gestern leer“, sagt Herr Brunner und grinst. „Aber das kann bis Montag warten. Ersatzbatterien hab ich ja. Seit zehn Jahren in der Schublade.“", "Am Abend sitzt Saba zu Hause und schreibt in ihr Notizbuch. Sie hat in zehn Jahren viele Wörter gesammelt. Ganz unten fügt sie ein neues hinzu: „Jubiläum – Wenn man merkt, dass man längst angekommen ist.“"], "gl": [["das Jubiläum", "anniversary (at work)"], ["das Blech", "baking tray"], ["das Banner", "banner"], ["der Standort", "site / location"], ["das Lampenfieber", "stage fright"], ["die Ansprache", "short speech"], ["bearbeiten", "to process / handle"], ["hopp (ugs.)", "quick! / hurry up"], ["gell (schwäb.)", "right? / isn't it?"], ["kabellos", "wireless"], ["peinlich berührt", "embarrassed"], ["dazugehören", "to belong"], ["jemandem ein Wort schenken", "to give someone a word"], ["der Applaus", "applause"], ["der Azubi", "trainee / apprentice"], ["schüchtern", "shy(ly)"], ["in Rente gehen", "to retire"], ["beibringen", "to teach"], ["ordentlich", "neat"], ["angekommen sein (fig.)", "to feel at home / settled"]], "q": [["Welchen Rat gibt Dennis für die Rede?", "Eine Geschichte erzählen.", "Nicht über Reparaturen, sondern über Erlebnisse."], ["Welche Geschichte erzählt Saba?", "Ihren ersten Anruf wegen einer „kaputten“ Maus.", "Sie verstand „hopp“ und „gell“ nicht – und die Batterie war nur leer."], ["Was hat Saba über Menschen gelernt?", "Probleme dauern fünf Minuten, Gespräche länger.", "„Das geht nicht“ heißt oft: Angst, etwas kaputt zu machen."], ["Wofür dankt Saba den Kollegen am meisten?", "Dass sie geduldig auf ihre Worte gewartet haben.", "Sie gaben ihr das Gefühl, dazuzugehören."], ["Was bedeutet das Geschenk von Herrn Brunner?", "Eine Erinnerung an den ersten Tag.", "Er ist stolz, ihr das erste schwäbische Wort beigebracht zu haben."]], "say": ["Ich weiß nicht, was ich sagen soll.", "Ich will euch von meinem ersten Anruf erzählen.", "Dafür möchte ich danken.", "War das zu viel?", "Das kann bis Montag warten."]}];

function sheet(w,sp){if(sp===undefined)sp=true;var c=cl(w),m=look(w),yes=st.wl.indexOf(c)>=0,e=document.getElementById('sheet');e.innerHTML='<div class="si"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.2rem">'+esc(c||w)+'</b><button data-a="xc">\u2715</button></div><p>'+(m?esc(m):'<i>Eigenname \u2013 wird vorgelesen</i>')+'</p><button data-a="sp" data-w="'+esc(c)+'">\uD83D\uDD0A H\u00f6ren</button> <button data-a="mk" data-w="'+esc(c)+'">'+(yes?'\u2605 Gemerkt':'\u2606 Merken')+'</button></div>';e.className='op';if(sp)say(c||w)}
function hide(){var e=document.getElementById('sheet');e.className='';e.innerHTML=''}
function wrap(t){var p=t.split(/(\s+)/),o='';for(var i=0;i<p.length;i++){if(/^\s*$/.test(p[i])){o+=p[i];continue}var c=cl(p[i]);o+='<span class="w'+(c&&st.wl.indexOf(c)>=0?' sv':'')+'" data-w="'+esc(p[i])+'">'+esc(p[i])+'</span>'}return o}
function B(l){return '<span class="bdg '+l+'">'+l+'</span>'}
function lib(){var w=0;for(var i=0;i<S.length;i++)if(rd(S[i].id))w++;var h='<p class="muted">\uD83D\uDCDA Geschrieben: '+S.length+' / 100 \u00b7 \u2705 Gelesen: '+w+' / '+S.length+'</p><p>';var F=['alle','B1','B2','C1'];for(i=0;i<4;i++)h+='<button data-a="fl" data-x="'+F[i]+'"'+(st.fl==F[i]?' style="background:#2563eb;color:#fff"':'')+'>'+(F[i]=='alle'?'Alle':F[i])+'</button> ';h+='</p>';for(i=0;i<S.length;i++){var s=S[i];if(st.fl!='alle'&&s.level!=st.fl)continue;h+='<div class="card" data-a="op" data-id="'+s.id+'">'+B(s.level)+' <span class="muted">'+esc(s.topic)+'</span>'+(rd(s.id)?' \u2705':'')+'<h3>'+s.id+'. '+esc(s.title)+'</h3><p class="muted">'+esc(s.teaser)+'</p><p class="muted">\uD83D\uDD52 '+s.rt+'</p></div>'}A.innerHTML=h}
function toc(){var h='<h2>Inhaltsverzeichnis \u2014 100</h2><p class="muted">Alle 100 Geschichten sind fertig.</p>';var L=['B1','B2','C1'];for(var x=0;x<3;x++){h+='<h3>'+L[x]+'</h3><ul class="toc">';for(var i=0;i<T.length;i++){if(T[i][2]!=L[x])continue;var wr=!!story(T[i][0]);h+='<li class="'+(wr?'':'todo')+'"'+(wr?' data-a="op" data-id="'+T[i][0]+'"':'')+'><span class="num">'+T[i][0]+'</span>'+B(T[i][2])+'<span>'+esc(T[i][1])+'</span></li>'}h+='</ul>'}A.innerHTML=h}
function wl(){var h='<h2>Meine W\u00f6rter \u2605</h2>';if(!st.wl.length){A.innerHTML=h+'<p class="muted">Noch leer. Tippe im Text ein Wort an und dann \u201e\u2606 Merken\u201c.</p>';return}for(var i=st.wl.length-1;i>=0;i--){var c=st.wl[i],m=look(c);h+='<div class="box" style="display:flex;justify-content:space-between"><span><b>'+esc(c)+'</b> <span class="muted">'+(m?esc(m):'')+'</span></span><span><button data-a="sp" data-w="'+esc(c)+'">\uD83D\uDD0A</button> <button data-a="rm" data-w="'+esc(c)+'">\uD83D\uDDD1\uFE0F</button></span></div>'}A.innerHTML=h}
function show(){var s=story(st.id);if(!s){st.v='lib';route();return}gm(s);var h='<button data-a="v" data-x="lib">\u25c0 Bibliothek</button><h1>'+s.id+'. '+esc(s.title)+'</h1><p>'+B(s.level)+' <span class="muted">'+esc(s.topic)+' \u00b7 \uD83D\uDD52 '+s.rt+'</span></p><p class="muted"><i>'+esc(s.teaser)+'</i></p><p><button data-a="rs">\uD83D\uDD0A Ganze Geschichte</button> <button data-a="stp">\u23f9</button> <button data-a="tr">'+(rd(s.id)?'\u2705 Gelesen':'\u25fb Als gelesen')+'</button></p><p class="muted">\uD83D\uDCA1 Tippe ein Wort an f\u00fcr Bedeutung + Aussprache.</p>';for(var i=0;i<s.body.length;i++)h+='<p><button data-a="rp" data-i="'+i+'">\u25b6</button> '+wrap(s.body[i])+'</p>';h+='<div class="box"><h3>\uD83D\uDCD6 Glossar</h3><table>';for(i=0;i<s.gl.length;i++)h+='<tr><td><span class="w" data-w="'+esc(s.gl[i][0])+'">'+esc(s.gl[i][0])+'</span></td><td>'+esc(s.gl[i][1])+'</td></tr>';h+='</table></div><div class="box"><h3>\u2753 Fragen</h3>';for(i=0;i<s.q.length;i++)h+='<details><summary>'+(i+1)+'. '+esc(s.q[i][0])+'</summary><p><b>Antwort:</b> '+esc(s.q[i][1])+'<br><b>Erkl\u00e4rung:</b> '+esc(s.q[i][2])+'</p></details>';h+='</div><div class="box"><h3>\uD83D\uDDE3\uFE0F Das kannst du selbst sagen</h3>';for(i=0;i<s.say.length;i++)h+='<p>'+esc(s.say[i])+' <button data-a="sp" data-w="'+esc(s.say[i])+'">\uD83D\uDD0A</button></p>';h+='</div>';A.innerHTML=h;scrollTo(0,0)}
function route(){setUi();if(st.v=='lib')lib();else if(st.v=='toc')toc();else if(st.v=='wl')wl();else show()}
document.addEventListener('click',function(e){var t=e.target,b=t.closest?t.closest('[data-a]'):null,wd=t.closest?t.closest('.w'):null;if(b){var a=b.getAttribute('data-a');if(a=='v'){st.v=b.getAttribute('data-x');st.id=null;hide();route();return}if(a=='fl'){st.fl=b.getAttribute('data-x');lib();return}if(a=='op'){st.id=+b.getAttribute('data-id');st.v='st';hide();route();return}if(a=='rp'){var s=story(st.id);if(s)say(s.body[+b.getAttribute('data-i')]);return}if(a=='rs'){var s2=story(st.id);if(s2)sayN(s2.body);return}if(a=='stp'){try{speechSynthesis.cancel()}catch(x){}return}if(a=='tr'){var k=st.rd.indexOf(st.id);if(k>=0)st.rd.splice(k,1);else st.rd.push(st.id);SV('rd',st.rd);show();return}if(a=='dk'){st.dk=!st.dk;SV('dk',st.dk);setUi();return}if(a=='f'){st.f=Math.max(14,Math.min(28,st.f+(+b.getAttribute('data-x'))*2));SV('f',st.f);setUi();return}if(a=='sp'){say(b.getAttribute('data-w'));return}if(a=='xc'){hide();return}if(a=='mk'){var c=b.getAttribute('data-w'),j=st.wl.indexOf(c);if(j>=0)st.wl.splice(j,1);else st.wl.push(c);SV('wl',st.wl);if(st.v=='st')show();if(st.v=='wl')wl();sheet(c,false);return}if(a=='rm'){var c2=b.getAttribute('data-w'),j2=st.wl.indexOf(c2);if(j2>=0)st.wl.splice(j2,1);SV('wl',st.wl);wl();return}}if(wd){sheet(wd.getAttribute('data-w'));return}if(!(t.closest&&t.closest('#sheet')))hide()});
document.addEventListener('change',function(e){if(e.target&&e.target.id=='spd'){st.sp=parseFloat(e.target.value);SV('sp',st.sp)}});
setUi();route();

</script></body></html>
