ler gemacht?“", "Anja schaut über seine Schulter. „Steuerklasse vier. Vorher warst du in Klasse eins.“", "„Und was bedeutet das?“", "„Wenn man heiratet, kommt man automatisch in die Vier. Beide. Eigentlich ändert sich da nicht viel.“", "„Aber bei mir ändert sich dreihundert Euro viel.“", "„Dann stimmt irgendwas nicht. Geh doch zum Finanzamt. Die haben eine Infothek. Da kann man ohne Termin hin.“", "Am Dienstagmorgen steht Chidi im Foyer des Finanzamts. Es riecht nach Bohnerwachs. An der Infothek zieht er eine Nummer: 147. Auf dem Bildschirm steht 131.", "Vierzig Minuten später sitzt er vor Frau Dreher, einer Sachbearbeiterin mit Lesebrille und erstaunlich freundlichem Lächeln.", "„Guten Morgen. Was kann ich für Sie tun?“", "„Guten Morgen. Ich habe im Sommer geheiratet und seitdem weniger Gehalt. Ich verstehe nicht, warum. Meine Frau sagt, das ist die Steuerklasse.“", "„Haben Sie Ihre Steuer-Identifikationsnummer dabei?“", "„Ja, hier.“ Er schiebt einen Brief über den Tisch.", "Frau Dreher tippt. „Ah, ich sehe es schon. Sie und Ihre Frau sind beide in Steuerklasse vier. Darf ich fragen, ob Sie beide ungefähr gleich viel verdienen?“", "„Nein, gar nicht. Ich arbeite Vollzeit als Ingenieur. Meine Frau macht gerade ihren Master und arbeitet zwanzig Stunden als Werkstudentin.“", "„Dann ist Ihre Kombination nicht optimal. Die Vier-Vier-Kombination passt am besten, wenn beide ähnlich verdienen. Bei großen Unterschieden wählen viele Paare Drei und Fünf. Der Partner mit dem höheren Einkommen nimmt die Drei, der andere die Fünf.“", "„Und dann habe ich wieder mehr netto?“", "„Monatlich ja, deutlich mehr. Aber ich muss Sie auf etwas hinweisen. Die Steuerklasse bestimmt nur, wie viel jeden Monat vom Lohn einbehalten wird. Die tatsächliche Steuer wird am Ende des Jahres berechnet. Bei Drei und Fünf sind Sie verpflichtet, eine Steuererklärung abzugeben. Und es kann sein, dass Sie dann etwas nachzahlen müssen.“", "„Moment. Also bekomme ich das Geld jetzt, und vielleicht muss ich es später zurückzahlen?“", "„Genau. Unterm Strich zahlen Sie als Ehepaar gleich viel Steuern, egal welche Klassen Sie wählen. Es geht nur um die Verteilung über das Jahr.“", "Chidi lehnt sich zurück. „Das ist … sehr deutsch.“", "Frau Dreher lacht. „Das höre ich öfter. Es gibt übrigens noch eine dritte Möglichkeit: Vier mit Faktor. Da wird das Verhältnis Ihrer Einkommen berücksichtigt. Das ist genauer, und die Nachzahlung am Ende ist meistens kleiner.“", "„Was würden Sie mir empfehlen?“", "„Eine Steuerberatung darf ich Ihnen nicht geben. Aber ich kann Ihnen sagen, dass es auf der Seite des Finanzministeriums einen Rechner gibt. Da können Sie Ihre Zahlen eingeben und vergleichen.“", "„Und wie ändere ich die Klasse?“", "„Mit einem Antrag auf Steuerklassenwechsel. Das geht über ELSTER, das Online-Portal. Oder mit dem Formular auf Papier. Wichtig: Sie müssen ihn beide unterschreiben, denn es betrifft Sie beide.“", "„Haben Sie das Formular hier?“", "Frau Dreher zieht ein Blatt aus einer Schublade. „Bitte schön. Wenn Sie es bis Ende des Monats abgeben, gilt die neue Klasse ab dem nächsten Monat.“", "„Und den Betrag, den ich seit Juli zu viel bezahlt habe?“", "„Den bekommen Sie mit der Steuererklärung zurück. Es geht nichts verloren. Das Finanzamt behält nichts, was ihm nicht zusteht.“", "„Das klingt beruhigend.“", "„Das soll es auch. Ach, und noch ein Tipp: Heben Sie Belege auf. Arbeitsmittel, Fahrtkosten, Fortbildungen. Das hilft bei der Erklärung.“", "Chidi faltet das Formular sorgfältig zusammen. „Vielen Dank, Frau Dreher. Ehrlich gesagt hatte ich Angst vor diesem Besuch.“", "„Das geht vielen so. Dabei beißen wir gar nicht. Wir sprechen nur manchmal eine eigene Sprache.“", "„Das habe ich gemerkt. Einbehalten, Nachzahlung, Faktorverfahren …“", "„Dann haben Sie heute schon drei Wörter gelernt, die viele Deutsche nicht kennen.“", "Am Abend sitzen Chidi und Anja mit dem Laptop auf dem Sofa. Sie haben den Rechner geöffnet und tippen ihre Zahlen ein.", "„Drei und Fünf bringt dir monatlich am meisten“, sagt Anja. „Aber dann müssen wir wahrscheinlich nachzahlen.“", "„Und Vier mit Faktor?“", "„Etwas weniger jeden Monat, aber am Ende kaum eine Überraschung.“", "Chidi überlegt. „Ich mag keine Überraschungen vom Finanzamt. Nehmen wir den Faktor.“", "„Romantisch“, sagt Anja. „Unsere erste gemeinsame Finanzentscheidung.“", "„Unsere erste gemeinsame Unterschrift nach der Hochzeitsurkunde.“", "Sie unterschreiben beide. Am nächsten Morgen wirft Chidi den Umschlag in den Briefkasten des Finanzamts, zwei Wochen vor der Frist."], "gl": [["die Gehaltsabrechnung", "payslip"], ["netto / brutto", "net / gross"], ["die Steuerklasse", "tax class"], ["die Infothek", "information desk"], ["das Bohnerwachs", "floor polish"], ["die Sachbearbeiterin", "case officer (f.)"], ["die Steuer-Identifikationsnummer", "tax ID number"], ["der Werkstudent / die Werkstudentin", "working student"], ["einbehalten", "to withhold"], ["verpflichtet sein", "to be obliged"], ["die Steuererklärung", "tax return"], ["nachzahlen / die Nachzahlung", "to pay arrears / additional payment"], ["unterm Strich", "all in all / bottom line"], ["das Faktorverfahren", "factor method"], ["der Antrag", "application"], ["die Schublade", "drawer"], ["zustehen", "to be entitled to"], ["der Beleg", "receipt / proof"], ["die Fortbildung", "further training"], ["die Frist", "deadline"]], "q": [["Warum hat Chidi weniger netto?", "Er ist nach der Hochzeit in Steuerklasse 4.", "Vorher war er in Klasse 1."], ["Wann passt die Kombination 4/4 am besten?", "Wenn beide ähnlich viel verdienen.", "Chidi und Anja verdienen sehr unterschiedlich."], ["Was ist der Nachteil von 3/5?", "Man muss eine Steuererklärung machen und eventuell nachzahlen.", "Monatlich gibt es aber mehr netto."], ["Warum gibt Frau Dreher keine klare Empfehlung?", "Sie darf keine Steuerberatung geben.", "Sie verweist auf den Rechner des Finanzministeriums."], ["Wofür entscheiden sich Chidi und Anja?", "Steuerklasse 4 mit Faktor.", "Chidi mag keine Überraschungen vom Finanzamt."]], "say": ["Was kann ich für Sie tun?", "Ich verstehe nicht, warum.", "Was würden Sie mir empfehlen?", "Wie ändere ich die Steuerklasse?", "Unterm Strich zahlen wir gleich viel."]}, {"id": 41, "title": "Die Steuererklärung", "level": "B2", "topic": "Finanzen & Paarleben", "rt": "ca. 6 Min.", "teaser": "Malte schiebt die Steuererklärung seit Monaten vor sich her. Ines hat einen Plan: ein Sonntag, ein Schuhkarton voller Belege und ELSTER.", "body": ["Es ist Sonntag, zehn Uhr morgens. Auf dem Küchentisch in Freiburg steht ein Schuhkarton. Darin: Kassenbons, Rechnungen, eine Bescheinigung von der Krankenkasse und ein Zettel, auf dem nur „wichtig?“ steht.", "„Malte“, sagt Ines und stellt zwei Tassen Kaffee daneben. „Heute ist der Tag.“", "„Welcher Tag?“", "„Der Tag, an dem du endlich deine Steuererklärung machst. Du schiebst das seit Februar vor dir her.“", "„Ich schiebe nichts vor mir her. Ich warte auf den richtigen Moment.“", "„Der richtige Moment war vor vier Monaten. Komm, ich helfe dir. Wir machen das zusammen über ELSTER.“", "Malte seufzt und klappt den Laptop auf. „Na gut. Aber nur, weil du Kaffee gemacht hast.“", "Er meldet sich im Portal an. Nach zwei Versuchen findet er die richtige Zertifikatsdatei und das Passwort.", "„Okay, ich bin drin. Und jetzt?“", "„Zuerst die Belegabruf-Funktion. Dann holt ELSTER die Daten vom Arbeitgeber und von der Krankenkasse automatisch rein. Das spart viel Tipparbeit.“", "„Moment, das geht automatisch? Warum habe ich dann einen Schuhkarton?“", "„Weil nicht alles automatisch geht. Die Lohnsteuerbescheinigung ja. Aber deine Werbungskosten musst du selbst eintragen.“", "„Werbungskosten? Ich mache doch keine Werbung.“", "Ines lacht. „Das hat nichts mit Werbung zu tun. Das sind Kosten, die du für deinen Job hast. Fahrtkosten, Arbeitsmittel, Fortbildungen. Die kannst du absetzen.“", "„Absetzen heißt, ich bekomme Geld zurück?“", "„Nicht direkt. Sie verringern dein zu versteuerndes Einkommen. Dann zahlst du weniger Steuern. Und weil dein Arbeitgeber schon jeden Monat Steuern abgezogen hat, bekommst du die Differenz zurück.“", "„Klingt kompliziert. Fangen wir mit dem Einfachsten an.“", "„Fahrtkosten. Wie weit ist es zu deiner Arbeit?“", "„Dreiundzwanzig Kilometer. Einfache Strecke.“", "„Und an wie vielen Tagen warst du im Büro?“", "Malte öffnet seinen Kalender. „Ich war ja oft im Homeoffice. Ungefähr … hundertfünfzig Tage im Büro?“", "„Und die anderen Tage zu Hause?“", "„Ungefähr achtzig.“", "„Super. Dann trägst du die Bürotage als Entfernungspauschale ein und die Homeoffice-Tage als Tagespauschale. Beides zusammen am selben Tag geht übrigens nicht.“", "„Wer hat sich das ausgedacht?“", "„Ein Gesetzgeber mit viel Zeit. Weiter. Hast du dir letztes Jahr etwas für die Arbeit gekauft?“", "Malte wühlt im Schuhkarton. „Hier! Ein Bürostuhl für das Homeoffice. Und ein zweiter Monitor.“", "„Perfekt. Arbeitsmittel. Und der Englischkurs an der Volkshochschule?“", "„Den habe ich gemacht, weil wir jetzt viele Kunden in England haben. Zählt das?“", "„Wenn er beruflich nötig ist, ja. Das ist eine Fortbildung.“", "Eine Stunde später ist der Tisch voller Stapel. Malte tippt Beträge ein und schaut regelmäßig auf die Zahl oben rechts auf dem Bildschirm: die voraussichtliche Erstattung.", "„Ines. Ines! Da steht jetzt sechshundertachtzig Euro.“", "„Siehst du. Und du wolltest es nicht machen.“", "„Ich nehme alles zurück. Was ist das hier noch? ‚Haushaltsnahe Dienstleistungen‘?“", "„Hatten wir einen Handwerker in der Wohnung? Oder eine Reinigungskraft?“", "„Der Schornsteinfeger war da. Und der Mann, der die Heizung repariert hat.“", "„Dann such die Rechnungen. Aber Achtung: Nur die Arbeitskosten zählen, nicht das Material. Und du musst überwiesen haben. Bar bezahlt zählt nicht.“", "Malte findet die Rechnung vom Heizungsmonteur. Darunter ist ein handgeschriebener Zettel: „Bar bezahlt, danke!“", "„Mist. Die zählt nicht.“", "„Nächstes Jahr überweisen. Merk dir das.“", "„Ich schreibe es auf einen Zettel. Für den Schuhkarton.“", "Kurz nach eins drückt Malte auf „Prüfen“. Das Programm meldet zwei Hinweise: Bei der Bankverbindung fehlt ein Häkchen, und beim Monitor muss er angeben, ob er über achthundert Euro gekostet hat.", "„Hat er nicht. Zweihundertneunzig.“", "„Dann kannst du ihn sofort komplett absetzen. Sehr gut.“", "Er korrigiert beides und klickt auf „Absenden“. Eine Bestätigung erscheint: Ihre Erklärung wurde erfolgreich übermittelt.", "„Das war’s?“, fragt Malte. „Kein Stempel? Keine Unterschrift?“", "„Keine. Der Bescheid kommt in ein paar Wochen digital. Dann prüfst du, ob das Finanzamt alles anerkannt hat. Wenn nicht, kannst du innerhalb eines Monats Einspruch einlegen.“", "„Einspruch. Wieder so ein Wort.“", "„Du kannst es. Du hast heute auch Werbungskosten gelernt.“", "Malte schließt den Laptop und schaut auf den leeren Schuhkarton.", "„Weißt du, was ich mit den sechshundertachtzig Euro mache?“", "„Einen neuen Schuhkarton kaufen?“", "„Ich lade dich zum Essen ein. Als Honorar für meine Steuerberaterin.“", "„Annehmen“, sagt Ines. „Aber nächstes Jahr machst du es im März. Allein.“", "„Im März“, verspricht Malte. „Mit Ordner statt Schuhkarton.“"], "gl": [["etwas vor sich herschieben", "to put sth off"], ["der Kassenbon", "receipt"], ["die Krankenkasse", "health insurance fund"], ["ELSTER", "German online tax portal"], ["der Belegabruf", "automatic data retrieval"], ["die Lohnsteuerbescheinigung", "annual wage tax statement"], ["die Werbungskosten", "work-related expenses"], ["absetzen", "to deduct (from tax)"], ["das zu versteuernde Einkommen", "taxable income"], ["die Entfernungspauschale", "commuting allowance"], ["die Tagespauschale", "daily (home office) allowance"], ["das Arbeitsmittel", "work equipment"], ["voraussichtlich", "expected / estimated"], ["die Erstattung", "refund"], ["haushaltsnahe Dienstleistungen", "household-related services"], ["der Schornsteinfeger", "chimney sweep"], ["überweisen", "to transfer (money)"], ["übermitteln", "to transmit / submit"], ["der Steuerbescheid", "tax assessment"], ["Einspruch einlegen", "to file an objection"]], "q": [["Was holt die Belegabruf-Funktion automatisch?", "Daten vom Arbeitgeber und von der Krankenkasse.", "Werbungskosten muss Malte selbst eintragen."], ["Was sind Werbungskosten?", "Kosten, die man für den Job hat.", "Zum Beispiel Fahrtkosten, Arbeitsmittel, Fortbildungen."], ["Warum zählt die Heizungsrechnung nicht?", "Malte hat bar bezahlt.", "Bei Handwerkerleistungen zählt nur Überweisung."], ["Warum kann Malte den Monitor sofort komplett absetzen?", "Er hat weniger als 800 Euro gekostet.", "Er kostete 290 Euro."], ["Was kann Malte tun, wenn der Bescheid falsch ist?", "Innerhalb eines Monats Einspruch einlegen.", "Erst muss er den Bescheid prüfen."]], "say": ["Ich schiebe das seit Monaten vor mir her.", "Fangen wir mit dem Einfachsten an.", "Zählt das auch?", "Ich nehme alles zurück.", "Nächstes Jahr mache ich es im März."]}, {"id": 42, "title": "Beim Jobcenter", "level": "B2", "topic": "Behörden & Arbeit", "rt": "ca. 6 Min.", "teaser": "Rania hat in Syrien als Apothekerin gearbeitet. Im Jobcenter soll sie einen Kooperationsplan unterschreiben – und merkt, dass sie mitreden darf.", "body": ["Rania sitzt im Wartebereich des Jobcenters in Pforzheim und hält eine blaue Mappe auf dem Schoß. Darin: ihr Lebenslauf, ihr B2-Zertifikat, die Übersetzung ihres Uni-Abschlusses aus Damaskus und ein Brief mit der Überschrift „Einladung“. Unter der freundlichen Überschrift stand ein Satz, der weniger freundlich klang: Wenn Sie ohne wichtigen Grund nicht erscheinen, kann das Folgen für Ihre Leistungen haben.", "„Frau Al-Hassan, bitte in Zimmer 214.“", "Zimmer 214 ist klein. Am Fenster steht eine Grünpflanze, die bessere Tage gesehen hat. Hinter dem Schreibtisch sitzt ein Mann um die fünfzig mit grauem Pullover.", "„Guten Tag, Frau Al-Hassan. Kowalski, ich bin ab heute Ihr Ansprechpartner. Setzen Sie sich bitte.“", "„Guten Tag, Herr Kowalski.“", "„Bevor wir anfangen: Haben Sie Fragen zu dem Brief? Viele Leute erschrecken, wenn sie ihn bekommen.“", "„Ehrlich gesagt ja. Der Satz mit den Folgen hat mir Angst gemacht.“", "„Das verstehe ich. Der Satz steht in jedem Brief, das ist Vorschrift. Aber Sie sind ja gekommen, also ist alles in Ordnung. Heute wollen wir zusammen einen Kooperationsplan machen. Wissen Sie, was das ist?“", "„Ein Vertrag?“", "„Nicht ganz. Früher gab es eine Eingliederungsvereinbarung, die war eher wie ein Vertrag. Der Kooperationsplan ist ein gemeinsamer Plan. Wir schreiben auf, was Ihr Ziel ist, welche Schritte Sie machen und wie wir Sie dabei unterstützen. Es ist Ihr Plan genauso wie meiner.“", "„Mein Ziel ist klar“, sagt Rania. „Ich bin Apothekerin. Ich habe in Damaskus acht Jahre in einer Apotheke gearbeitet. Ich möchte wieder als Apothekerin arbeiten.“", "Herr Kowalski nickt und macht sich eine Notiz. „Das ist ein gutes, klares Ziel. Und ich will ehrlich sein: Es ist auch ein langer Weg. Apotheker ist in Deutschland ein reglementierter Beruf. Sie brauchen eine Approbation.“", "„Das weiß ich. Ich habe schon gelesen. Ich muss eine Kenntnisprüfung machen. Und eine Fachsprachprüfung.“", "„Sie haben sich gut vorbereitet. Haben Sie Ihre Unterlagen schon bei der zuständigen Stelle eingereicht?“", "„Nein. Ich wusste nicht, wer zuständig ist. Und die Gebühren für die Anerkennung sind hoch. Ich habe das Geld nicht.“", "„Da kann ich Ihnen helfen. Für die Anerkennung gibt es Förderung, und es gibt Beratungsstellen, die Sie Schritt für Schritt begleiten. Die Kosten können unter bestimmten Bedingungen übernommen werden. Das schreiben wir in den Plan.“", "Rania richtet sich auf. „Wirklich? Das wusste ich nicht.“", "„Deshalb sitzen wir hier. Jetzt eine schwierige Frage: Die Anerkennung dauert vermutlich ein bis zwei Jahre. Was machen Sie in der Zwischenzeit?“", "„Ich möchte arbeiten. Ich will nicht nur zu Hause sitzen und warten.“", "„Was halten Sie von einer Stelle als pharmazeutisch-technische Assistentin? Oder als Helferin in einer Apotheke? Dann sind Sie im Beruf, lernen die Fachsprache im Alltag und haben ein Einkommen.“", "Rania zögert. „Das ist eine Stufe unter meiner Qualifikation.“", "„Das stimmt. Ich will Sie nicht kleinmachen. Aber denken Sie an die Fachsprachprüfung. Wer jeden Tag mit Kunden über Wechselwirkungen und Dosierungen spricht, besteht sie leichter. Und eine Apotheke, die Sie kennt, stellt Sie später vielleicht als Apothekerin ein.“", "„Das ist ein Argument“, sagt Rania langsam. „Aber ich möchte es nur als Übergang. Nicht für immer.“", "„Genau so schreiben wir es auf. Übergangsweise. Ihr Hauptziel bleibt die Approbation.“", "Er dreht den Bildschirm zu ihr, damit sie mitlesen kann. Gemeinsam formulieren sie den Plan: Antrag auf Anerkennung in den nächsten vier Wochen, Termin bei einer Anerkennungsberatung, Bewerbungen bei Apotheken in der Region, ein berufsbezogener Deutschkurs mit medizinischem Schwerpunkt.", "„Und was macht das Jobcenter?“, fragt Rania.", "„Wir prüfen die Kostenübernahme für die Anerkennung und für den Kurs. Und ich schicke Ihnen passende Stellenangebote. Wenn eine Apotheke Sie einstellen will, gibt es eventuell auch einen Zuschuss für den Arbeitgeber.“", "„Und wenn ich einen Schritt nicht schaffe? Zum Beispiel, wenn ich in vier Wochen nicht alle Dokumente habe?“", "„Dann melden Sie sich bei mir, bevor die Frist abläuft. Das ist das Wichtigste. Wer sich meldet, mit dem findet man eine Lösung. Probleme gibt es meistens nur, wenn jemand einfach nicht mehr reagiert.“", "„Das verstehe ich.“", "„Lesen Sie den Plan bitte in Ruhe durch. Wenn Sie etwas ändern möchten, sagen Sie es.“", "Rania liest. Dann zeigt sie auf eine Zeile. „Hier steht ‚Bewerbungen: mindestens fünf pro Monat‘. Aber in Pforzheim gibt es nicht so viele Apotheken. Können wir die Region größer machen? Karlsruhe und Stuttgart sind mit dem Zug nicht so weit.“", "Herr Kowalski lächelt. „Das ist genau die Art von Mitarbeit, die ich mir wünsche. Ich ändere das: Region Nordschwarzwald, Karlsruhe und Stuttgart.“", "Er druckt den Plan aus. Rania bekommt eine Kopie und steckt sie in die blaue Mappe.", "„Nächster Termin in sechs Wochen. Und, Frau Al-Hassan – Ihr Deutsch ist wirklich gut. Die Fachsprachprüfung schaffen Sie.“", "„Danke. Und danke, dass Sie mir zugehört haben. Ich hatte ehrlich gesagt etwas anderes erwartet.“", "„Was denn?“", "„Jemanden, der mir sagt, was ich tun muss.“", "„Das passiert auch manchmal“, gibt Herr Kowalski zu. „Aber es funktioniert schlechter.“", "Drei Monate später schickt Rania eine kurze Mail an Zimmer 214: Sie hat eine Stelle als Helferin in einer Apotheke in Karlsruhe. Der Apotheker unterstützt ihre Anerkennung. Der Antrag ist eingereicht."], "gl": [["das Jobcenter", "job centre (Bürgergeld)"], ["der Lebenslauf", "CV"], ["der Abschluss", "degree"], ["erscheinen", "to appear / attend"], ["die Leistungen", "benefits"], ["der Ansprechpartner", "contact person"], ["die Vorschrift", "regulation"], ["der Kooperationsplan", "cooperation plan"], ["die Eingliederungsvereinbarung", "integration agreement (former)"], ["reglementierter Beruf", "regulated profession"], ["die Approbation", "licence to practise"], ["die Kenntnisprüfung", "knowledge test"], ["zuständig", "responsible / competent"], ["die Anerkennung", "recognition"], ["die Förderung", "funding / support"], ["die Wechselwirkung", "(drug) interaction"], ["übergangsweise / der Übergang", "temporarily / transition"], ["die Kostenübernahme", "assumption of costs"], ["der Zuschuss", "subsidy"], ["die Frist abläuft", "the deadline expires"]], "q": [["Warum hat Rania Angst vor dem Termin?", "Wegen des Satzes über Folgen im Brief.", "Herr Kowalski erklärt, dass das Vorschrift ist."], ["Was ist der Unterschied zur alten Eingliederungsvereinbarung?", "Der Kooperationsplan ist ein gemeinsamer Plan.", "Früher war es eher wie ein Vertrag."], ["Was braucht Rania, um als Apothekerin zu arbeiten?", "Eine Approbation.", "Dafür Kenntnisprüfung und Fachsprachprüfung."], ["Warum schlägt Herr Kowalski eine Stelle als Helferin vor?", "Sie lernt die Fachsprache und hat ein Einkommen.", "Als Übergang, nicht für immer."], ["Was ändert Rania am Plan?", "Die Region für Bewerbungen wird größer.", "Karlsruhe und Stuttgart kommen dazu."]], "say": ["Der Satz hat mir Angst gemacht.", "Mein Ziel ist klar.", "Das ist eine Stufe unter meiner Qualifikation.", "Können wir das ändern?", "Ich melde mich, bevor die Frist abläuft."]}, {"id": 43, "title": "Termin bei der Ausländerbehörde", "level": "B2", "topic": "Behörden & Aufenthalt", "rt": "ca. 6 Min.", "teaser": "Vikrams Aufenthaltstitel läuft in drei Wochen ab, und es gibt keinen Termin. Ein Gespräch mit seiner Personalabteilung und ein Wort lösen das Problem: Fiktionsbescheinigung.", "body": ["Vikram Iyer arbeitet seit fast vier Jahren als Datenanalyst in Karlsruhe. Er hat eine Blaue Karte EU, eine Wohnung mit Balkon und seit Kurzem einen Platz im örtlichen Cricketverein. Was er nicht hat: einen Termin bei der Ausländerbehörde.", "Seine Blaue Karte läuft in drei Wochen ab. Seit zwei Monaten schreibt er E-Mails, ruft an und lädt jeden Morgen um sieben das Online-Terminportal neu. Jedes Mal dieselbe Meldung: Derzeit sind keine Termine verfügbar.", "In der Mittagspause erzählt er es seiner Kollegin Ruth.", "„Ruth, ich glaube, ich werde illegal. In drei Wochen.“", "„Was? Wieso?“", "„Meine Blaue Karte läuft ab, und ich bekomme keinen Termin zur Verlängerung. Ich habe sieben Mails geschrieben. Keine Antwort. Am Telefon geht niemand ran.“", "Ruth stellt ihren Salat ab. „Hast du einen Antrag gestellt? Also schriftlich, nicht nur nach einem Termin gefragt?“", "„Was ist der Unterschied?“", "„Ein großer. Soweit ich weiß, gilt dein Aufenthalt als erlaubt, wenn du die Verlängerung beantragst, bevor der alte Titel abläuft. Auch wenn die Behörde noch nicht entschieden hat. Dafür gibt es so ein Papier – eine Fiktionsbescheinigung.“", "„Fiktion? Wie im Roman?“", "„So ähnlich. Rechtlich tut man so, als wäre dein Titel noch gültig. Aber frag lieber bei der Personalabteilung nach. Die haben das bestimmt schon hundertmal gemacht.“", "Am Nachmittag sitzt Vikram bei Emre aus der Personalabteilung. Emre betreut alle internationalen Mitarbeitenden.", "„Vikram, warum kommst du erst jetzt? Das hätten wir vor zwei Monaten lösen können.“", "„Ich dachte, ich schaffe das allein. Und ich wollte niemanden stören.“", "„Du störst nicht, das ist mein Job. Also: Ruth hat recht. Wir schicken heute noch einen vollständigen Antrag auf Verlängerung. Per Post mit Einschreiben und zusätzlich über das Kontaktformular. Hast du die Unterlagen?“", "„Welche genau?“", "Emre holt eine Checkliste aus der Schublade. „Ausgefülltes Antragsformular, aktuelles biometrisches Passfoto, Pass, die alte Blaue Karte als Kopie, Arbeitsvertrag, die letzten drei Gehaltsabrechnungen, Mietvertrag, Nachweis über Krankenversicherung. Und von uns eine Arbeitgeberbescheinigung. Die mache ich dir sofort.“", "„Das ist viel.“", "„Das ist Deutschland. Aber du hast fast alles digital, oder?“", "„Ja. Nur das Passfoto nicht.“", "„Unten im Drogeriemarkt gibt es einen Fotoautomaten. Zehn Minuten.“", "Am nächsten Morgen ist der Antrag unterwegs. Eine Woche später kommt eine E-Mail von der Ausländerbehörde: Ihr Antrag ist eingegangen. Ihr Termin: in sechs Wochen.", "„In sechs Wochen?“, sagt Vikram zu Emre. „Dann ist meine Karte seit drei Wochen abgelaufen.“", "„Lies weiter.“", "Unter dem Termin steht ein zweiter Absatz: Bis zur Entscheidung gilt Ihr Aufenthaltstitel gemäß § 81 Abs. 4 AufenthG als fortbestehend. Eine Fiktionsbescheinigung wird Ihnen per Post zugesandt.", "„Was heißt ‚fortbestehend‘?“", "„Dass alles weitergilt. Du darfst arbeiten, du darfst hier wohnen. Nur zum Reisen solltest du vorsichtig sein, bis du das Papier hast. Mit der Fiktionsbescheinigung kannst du in der Regel auch wieder einreisen, aber frag lieber bei der Behörde nach, bevor du einen Flug buchst.“", "„Meine Schwester heiratet im Herbst in Chennai.“", "„Dann sprich das beim Termin an. Bis dahin hast du den neuen Titel hoffentlich längst.“", "Sechs Wochen später sitzt Vikram im Wartebereich der Ausländerbehörde. Die Wände sind hellgrün, auf den Stühlen sitzen Menschen aus allen Teilen der Welt. Neben ihm füllt eine Frau aus Brasilien ein Formular aus und flucht leise auf Portugiesisch.", "„Herr Iyer, Zimmer 3.07.“", "Die Sachbearbeiterin heißt Frau Sommerfeld. Sie blättert schnell durch seine Unterlagen.", "„Sie sind seit knapp vier Jahren mit der Blauen Karte hier. Haben Sie schon einmal über die Niederlassungserlaubnis nachgedacht?“", "„Die unbefristete? Ich dachte, dafür ist es noch zu früh.“", "„Mit Blauer Karte geht das unter bestimmten Bedingungen schneller. Mit Deutschkenntnissen auf B1-Niveau sogar deutlich schneller. Haben Sie ein Zertifikat?“", "„Ja. B2. Seit letztem Jahr.“", "Frau Sommerfeld schaut auf. „Und das erzählen Sie mir erst jetzt? Dann wandeln wir Ihren Antrag um. Sie bekommen keine Verlängerung, sondern eine Niederlassungserlaubnis. Dann müssen Sie nicht mehr alle paar Jahre hierherkommen.“", "Vikram braucht einen Moment. „Unbefristet? Einfach so?“", "„Nicht einfach so. Weil Sie die Voraussetzungen erfüllen. Ich brauche noch Ihren Rentenversicherungsverlauf, den können Sie online anfordern. Und die Gebühr. Dann nehmen wir die Fingerabdrücke, und in einigen Wochen holen Sie die Karte ab.“", "„Und die Hochzeit meiner Schwester im Herbst?“", "„Mit dieser Fiktionsbescheinigung und Ihrem Pass sollte die Wiedereinreise kein Problem sein. Ich vermerke es aber trotzdem. Und wahrscheinlich haben Sie die neue Karte bis dahin.“", "Als Vikram aus dem Gebäude kommt, ruft er sofort Ruth an.", "„Ich gehe doch nicht in die Illegalität. Ich bekomme eine Niederlassungserlaubnis.“", "„Was? Glückwunsch! Siehst du – manchmal muss man einfach nur fragen.“", "„Und manchmal muss man jemandem sagen, dass man ein B2-Zertifikat hat“, lacht Vikram. „Am Freitag lade ich dich und Emre zum Essen ein. Indisch. Ich koche.“"], "gl": [["die Ausländerbehörde", "immigration office"], ["die Blaue Karte EU", "EU Blue Card"], ["ablaufen", "to expire"], ["verfügbar", "available"], ["die Verlängerung", "extension / renewal"], ["der Aufenthaltstitel", "residence permit"], ["gültig", "valid"], ["die Fiktionsbescheinigung", "certificate of continued legal residence"], ["das Einschreiben", "registered mail"], ["biometrisch", "biometric"], ["der Nachweis", "proof"], ["die Arbeitgeberbescheinigung", "employer's certificate"], ["der Fotoautomat", "photo booth"], ["fortbestehend", "continuing to exist"], ["einreisen / die Wiedereinreise", "to enter / re-entry"], ["die Niederlassungserlaubnis", "permanent settlement permit"], ["unbefristet", "permanent / unlimited"], ["umwandeln", "to convert"], ["die Voraussetzung", "prerequisite"], ["der Fingerabdruck", "fingerprint"]], "q": [["Warum ist Vikram in Panik?", "Seine Blaue Karte läuft ab, und er bekommt keinen Termin.", "Seit zwei Monaten ohne Erfolg."], ["Was ist der Unterschied zwischen Termin und Antrag?", "Ein rechtzeitiger Antrag sichert den Aufenthalt.", "Bis zur Entscheidung gilt der Titel als fortbestehend."], ["Was ist eine Fiktionsbescheinigung?", "Ein Papier, das bestätigt, dass der Titel weiter gilt.", "Er darf weiter arbeiten und wohnen."], ["Warum bekommt Vikram eine Niederlassungserlaubnis?", "Blaue Karte plus gute Deutschkenntnisse.", "Er hat sogar ein B2-Zertifikat."], ["Was lernt Vikram aus der Geschichte?", "Früh fragen und Hilfe annehmen.", "Die Personalabteilung hätte schon früher helfen können."]], "say": ["Ich bekomme keinen Termin.", "Was genau brauche ich dafür?", "Was heißt das genau?", "Und das erzählen Sie mir erst jetzt?", "Manchmal muss man einfach nur fragen."]}, {"id": 44, "title": "Die Wohnungsbesichtigung", "level": "B2", "topic": "Wohnen & Mietmarkt", "rt": "ca. 6 Min.", "teaser": "Zwei Zimmer, Balkon, bezahlbar – und vierzig andere Interessenten im Treppenhaus. Sinan und Paulina brauchen mehr als Glück.", "body": ["Samstag, 10:55 Uhr, Stuttgart-Ost. Vor einem Altbau mit grüner Haustür stehen ungefähr vierzig Menschen. Manche halten Mappen in der Hand, einige telefonieren, ein Paar diskutiert leise auf Französisch.", "„Das kann nicht dein Ernst sein“, flüstert Paulina. „Die sind alle wegen derselben Wohnung hier?“", "„Zwei Zimmer, Balkon, neunhundertzwanzig warm“, sagt Sinan. „Für Stuttgart ist das ein Schnäppchen. Natürlich sind die alle hier.“", "Paulina und Sinan suchen seit fünf Monaten. Sie haben siebenundsechzig Anfragen geschrieben und genau drei Einladungen bekommen. Bei zwei Besichtigungen war die Wohnung schon vergeben, bevor sie ankamen.", "Um Punkt elf öffnet eine Frau mit Klemmbrett die Tür. „Guten Morgen! Zimmermann, ich bin von der Hausverwaltung. Wir gehen in Gruppen von zehn Personen hoch. Bitte nicht drängeln, jeder kommt dran.“", "Sinan und Paulina sind in der zweiten Gruppe. Im Treppenhaus riecht es nach frischer Farbe. Die Wohnung liegt im dritten Stock, ohne Aufzug.", "„Hohe Decken“, sagt Paulina leise. „Und schau mal, der Holzboden!“", "„Und der Balkon geht nach Süden“, flüstert Sinan zurück. „Nicht zu begeistert gucken. Die anderen sollen nicht merken, dass wir sie unbedingt wollen.“", "„Ich glaube, das merken die sowieso. Die wollen sie alle unbedingt.“", "Frau Zimmermann steht in der Küche und beantwortet Fragen. Ein junger Mann im Anzug fragt nach der Nebenkostenabrechnung, eine Frau nach Haustieren. Sinan wartet, bis er dran ist.", "„Entschuldigung, eine Frage zur Küche. Gehört die zur Wohnung, oder will der Vormieter eine Ablöse?“", "„Gute Frage. Der Vormieter möchte für die Küche zweitausendfünfhundert Euro. Das ist aber eine Sache zwischen Ihnen und ihm. Die Hausverwaltung hat damit nichts zu tun.“", "„Zweitausendfünfhundert?“ Paulina schaut sich die Küche genauer an. „Die ist ja mindestens zehn Jahre alt. Die Spülmaschine hat einen Sprung in der Tür.“", "„Das können Sie mit ihm verhandeln“, sagt Frau Zimmermann neutral. „Ich gebe Ihnen gerne seine Nummer, falls Sie in die engere Wahl kommen.“", "„Und wie geht es jetzt weiter? Wann entscheiden Sie?“, fragt Sinan.", "„Wer Interesse hat, schickt mir bis Montag zwölf Uhr die vollständigen Unterlagen. Mieterselbstauskunft, Schufa-Auskunft, die letzten drei Gehaltsnachweise und eine Kopie des Ausweises. Unvollständige Bewerbungen kann ich leider nicht berücksichtigen.“", "„Wir haben alles dabei“, sagt Paulina und hält ihre Mappe hoch. „Können wir sie Ihnen gleich geben?“", "Frau Zimmermann lächelt zum ersten Mal. „Das sieht man selten. Ja, gerne.“", "Draußen auf dem Gehweg atmet Sinan tief durch.", "„Meinst du, die Mappe hilft?“", "„Sie hat gelächelt“, sagt Paulina. „Das ist mehr als bei den letzten drei.“", "„Und die Ablöse? Zweitausendfünfhundert für eine kaputte Küche?“", "„Wenn wir die Wohnung bekommen, verhandeln wir. Und ehrlich gesagt: Wenn das der Preis ist, um endlich aus deinem WG-Zimmer rauszukommen, dann zahle ich auch zweitausend.“", "„Hey! Mein WG-Zimmer ist gemütlich.“", "„Es ist vierzehn Quadratmeter groß, und dein Mitbewohner übt Schlagzeug.“", "Am Montag um zehn ruft Frau Zimmermann an. Sinan ist gerade in einem Meeting und geht trotzdem ran.", "„Herr Arslan? Sie und Frau Wójcik sind in der engeren Wahl. Drei Bewerbungen sind übrig. Der Eigentümer möchte Sie gerne kurz persönlich kennenlernen. Hätten Sie morgen um achtzehn Uhr Zeit?“", "„Ja! Natürlich. Also – ja, das passt.“", "Der Eigentümer heißt Herr Wegmann, ist über siebzig und wohnt im Erdgeschoss desselben Hauses. Sie sitzen in seinem Wohnzimmer, zwischen Bücherregalen und einem alten Klavier.", "„Ich will ehrlich sein“, sagt er. „Auf dem Papier sind alle drei Bewerbungen gut. Aber ich wohne hier selbst. Ich möchte wissen, wer über mir wohnt. Was machen Sie beruflich?“", "„Ich bin Tontechnikerin am Staatstheater“, sagt Paulina. „Ich arbeite oft abends. Deshalb bin ich manchmal tagsüber zu Hause und schlafe lange.“", "„Und ich bin Elektroniker bei einem Zulieferer in Feuerbach“, sagt Sinan. „Ich bin eher der leise Typ. Außer beim Fußball.“", "Herr Wegmann lacht. „VfB?“", "„Was sonst?“", "„Gute Antwort. Spielt einer von Ihnen ein Instrument?“", "Paulina und Sinan sehen sich an. „Nein“, sagt Sinan. „Aber wir kennen jemanden, der Schlagzeug spielt. Deshalb suchen wir.“", "Herr Wegmann lacht so laut, dass er husten muss. Dann wird er ernst.", "„Eine Frage noch. Die Kaution beträgt drei Monatsmieten kalt. Das sind zweitausendvierhundert Euro. Ist das ein Problem?“", "„Nein. Das haben wir zur Seite gelegt. Wir könnten die Kaution auch auf ein Mietkautionskonto einzahlen, wenn Ihnen das lieber ist.“", "„Sehr gut. Sie haben sich informiert. Das gefällt mir.“", "Am Mittwochabend kommt eine E-Mail von Frau Zimmermann mit dem Betreff „Zusage“. Paulina liest sie dreimal, bevor sie Sinan anruft.", "„Wir haben sie. Wir haben die Wohnung!“", "„Was? Wirklich? Ich glaube es erst, wenn ich den Mietvertrag unterschrieben habe.“", "Den unterschreiben sie eine Woche später. Mit dem Vormieter einigen sie sich auf tausendzweihundert Euro für die Küche, und er lässt ihnen die Waschmaschine noch dazu.", "Am Einzugstag klingelt Herr Wegmann und bringt Brot und Salz.", "„Das macht man bei uns so“, sagt er. „Damit Sie im neuen Zuhause nie Hunger haben. Und bitte – wenn der VfB gewinnt, dürfen Sie auch mal laut sein.“"], "gl": [["die Besichtigung", "viewing"], ["der Altbau", "old building (pre-war)"], ["warm / kalt (Miete)", "incl. / excl. utilities"], ["das Schnäppchen", "bargain"], ["vergeben sein", "to be taken"], ["die Hausverwaltung", "property management"], ["drängeln", "to push / jostle"], ["die Nebenkostenabrechnung", "utilities statement"], ["der Vormieter", "previous tenant"], ["die Ablöse", "transfer fee (for fittings)"], ["der Sprung", "crack"], ["verhandeln", "to negotiate"], ["in die engere Wahl kommen", "to be shortlisted"], ["die Mieterselbstauskunft", "tenant self-disclosure form"], ["die Schufa-Auskunft", "credit report"], ["berücksichtigen", "to take into account"], ["der Eigentümer", "owner / landlord"], ["der Zulieferer", "supplier (industry)"], ["die Kaution", "deposit"], ["die Zusage", "acceptance / confirmation"]], "q": [["Warum ist die Konkurrenz so groß?", "Die Wohnung ist für Stuttgart günstig.", "Rund vierzig Leute kommen zur Besichtigung."], ["Was ist eine Ablöse?", "Geld, das der Vormieter z. B. für die Küche verlangt.", "Das ist eine Sache zwischen Vor- und Nachmieter."], ["Warum lächelt Frau Zimmermann?", "Das Paar hat die Unterlagen schon komplett dabei.", "Unvollständige Bewerbungen werden nicht berücksichtigt."], ["Warum will Herr Wegmann das Paar kennenlernen?", "Er wohnt selbst im Haus.", "Er will wissen, wer über ihm wohnt."], ["Wie endet die Verhandlung mit dem Vormieter?", "1.200 € statt 2.500 € für die Küche.", "Dazu bekommen sie die Waschmaschine."]], "say": ["Gehört die Küche zur Wohnung?", "Wie geht es jetzt weiter?", "Wir haben alle Unterlagen dabei.", "Das haben wir zur Seite gelegt.", "Ich glaube es erst, wenn ich unterschrieben habe."]}, {"id": 45, "title": "Der Wasserschaden", "level": "B2", "topic": "Wohnen & Versicherung", "rt": "ca. 6 Min.", "teaser": "Nachts tropft es durch die Decke. Leni muss den Nachbarn wecken, die Hausverwaltung erreichen und lernen, welche Versicherung wofür zahlt.", "body": ["Es ist halb drei in der Nacht, als Leni von einem Geräusch aufwacht. Tock. Tock. Tock. Erst denkt sie, es regnet. Dann merkt sie, dass das Geräusch aus ihrem Zimmer kommt.", "Sie macht das Licht an. Über dem Schrank hat die Decke einen dunklen Fleck, so groß wie eine Pizza. Aus der Mitte fallen Wassertropfen direkt auf ihren Koffer.", "„Nein, nein, nein …“", "Sie stellt einen Eimer unter die Stelle, zieht einen Pullover über und läuft die Treppe hoch in den dritten Stock. Dort wohnt Herr Petrović. Sie klingelt. Nichts. Sie klingelt noch einmal, länger.", "Endlich geht die Tür auf. Herr Petrović steht im Bademantel da, die Haare zerzaust.", "„Frau Hartung? Was ist los? Es ist mitten in der Nacht!“", "„Entschuldigung, dass ich Sie wecke. Aber bei mir tropft Wasser durch die Decke. Genau unter Ihrem Bad, glaube ich.“", "„Wasser? Bei mir ist alles trocken. Warten Sie.“", "Er geht ins Bad. Leni hört ihn fluchen. Dann ruft er: „Kommen Sie mal!“", "Hinter der Waschmaschine steht das Wasser zwei Zentimeter hoch. Der Schlauch hat sich gelöst.", "„Ich habe sie gestern Abend noch angestellt. Nachtstrom, ist billiger“, sagt Herr Petrović verlegen. „Oh Gott. Das tut mir so leid.“", "„Zuerst den Wasserhahn zudrehen“, sagt Leni. „Wo ist der Absperrhahn?“", "„Hier unten, glaube ich.“ Er kniet sich hin und dreht. Das Rauschen hört auf.", "Zusammen wischen sie mit allen Handtüchern, die sie finden können. Um vier Uhr ist der Boden halbwegs trocken. Unten in Lenis Zimmer tropft es nur noch langsam.", "„Was machen wir jetzt?“, fragt Herr Petrović. „Rufen wir jemanden an?“", "„Die Hausverwaltung hat einen Notdienst. Die Nummer hängt unten im Flur.“", "Leni ruft an. Eine müde Männerstimme meldet sich.", "„Notdienst Hausverwaltung Haas, guten Morgen.“", "„Guten Morgen. Hartung, Silcherstraße 12, zweiter Stock. Wir haben einen Wasserschaden. Bei meinem Nachbarn ist der Schlauch der Waschmaschine abgegangen, und bei mir kommt das Wasser durch die Decke.“", "„Ist das Wasser abgestellt?“", "„Ja, schon seit einer Stunde.“", "„Gut. Kommt noch Wasser in die Elektrik? Lampen, Steckdosen?“", "„Die Deckenlampe ist ein Stück weit weg. Aber ich habe die Sicherung für das Zimmer vorsichtshalber ausgeschaltet.“", "„Sehr gut gemacht. Dann ist es kein akuter Notfall mehr. Ich schicke Ihnen morgen früh jemanden für die Trocknung. Und bitte machen Sie Fotos von allem. Decke, Boden, beschädigte Gegenstände. Das brauchen die Versicherungen.“", "Am Morgen kommt Frau Haas persönlich vorbei, die Chefin der Hausverwaltung, zusammen mit einem Handwerker. Er hält ein Messgerät an die Decke.", "„Ziemlich feucht. Da muss ein Trocknungsgerät rein, zwei bis drei Wochen. Das ist laut, das sage ich Ihnen gleich.“", "„Zwei bis drei Wochen?“, fragt Leni. „In meinem Schlafzimmer?“", "„Sonst kommt Schimmel“, sagt Frau Haas. „Und Schimmel ist viel schlimmer als Lärm, glauben Sie mir.“", "„Und wer bezahlt das alles? Die Decke, mein Koffer, der Teppich?“", "„Das ist ein bisschen kompliziert“, sagt Frau Haas und setzt sich an den Küchentisch. „Die Decke gehört zum Gebäude. Das übernimmt die Gebäudeversicherung des Eigentümers. Darum kümmern wir uns.“", "„Und meine Sachen?“", "„Für Ihre Sachen ist zunächst Ihre Hausratversicherung zuständig. Haben Sie eine?“", "„Ja. Zum Glück. Meine Mutter hat darauf bestanden.“", "„Kluge Mutter. Melden Sie den Schaden heute noch. Mit Fotos und einer Liste. Wenn möglich mit Kaufbelegen.“", "„Aber eigentlich ist doch Herr Petrović schuld. Oder seine Waschmaschine.“", "„Wenn er fahrlässig gehandelt hat, kann seine Haftpflichtversicherung zahlen. Das klären die Versicherungen dann untereinander. Für Sie ist der Weg über die eigene Hausratversicherung meistens am schnellsten.“", "Am Nachmittag klingelt Herr Petrović bei Leni. Er hat einen Kuchen in der Hand und sieht aus, als hätte er nicht geschlafen.", "„Frau Hartung, ich wollte mich noch einmal entschuldigen. Ich habe meine Haftpflichtversicherung schon angerufen. Die Nummer vom Schaden habe ich hier aufgeschrieben. Falls Ihre Versicherung sie braucht.“", "„Danke, das ist sehr nett. Und kommen Sie rein, der Kuchen sieht gut aus.“", "„Ich habe ihn selbst gebacken. Um sechs Uhr morgens. Ich konnte sowieso nicht mehr schlafen.“", "Sie sitzen in der Küche, während im Schlafzimmer das Trocknungsgerät brummt.", "„Wissen Sie, was das Schlimmste ist?“, sagt Herr Petrović. „Ich wollte mit dem Nachtstrom zwanzig Cent sparen.“", "„Und jetzt zahlen drei Versicherungen.“", "„Genau. Ab jetzt wasche ich tagsüber. Und ich habe einen Wasserstopp bestellt. So ein kleines Ventil, das automatisch zumacht, wenn ein Schlauch platzt.“", "„Können Sie mir den Link schicken? Ich habe auch eine Waschmaschine.“", "Drei Wochen später ist die Decke trocken und frisch gestrichen. Die Hausratversicherung hat den Koffer und den Teppich bezahlt. Und Leni weiß jetzt nicht nur, was ein Absperrhahn ist, sondern auch, dass ihr Nachbar den besten Marmorkuchen im ganzen Haus backt."], "gl": [["der Wasserschaden", "water damage"], ["der Fleck", "stain"], ["zerzaust", "tousled"], ["der Schlauch", "hose"], ["sich lösen", "to come loose"], ["verlegen", "embarrassed"], ["der Absperrhahn", "stopcock"], ["der Notdienst", "emergency service"], ["die Sicherung", "fuse"], ["vorsichtshalber", "as a precaution"], ["die Trocknung / das Trocknungsgerät", "drying / dehumidifier"], ["feucht", "damp"], ["der Schimmel", "mould"], ["die Gebäudeversicherung", "buildings insurance"], ["die Hausratversicherung", "contents insurance"], ["auf etwas bestehen", "to insist on sth"], ["der Kaufbeleg", "proof of purchase"], ["fahrlässig", "negligent(ly)"], ["die Haftpflichtversicherung", "personal liability insurance"], ["das Ventil", "valve"]], "q": [["Was ist die Ursache des Wasserschadens?", "Der Schlauch der Waschmaschine hat sich gelöst.", "Herr Petrović hat nachts gewaschen."], ["Was macht Leni als Erstes in seiner Wohnung?", "Sie lässt das Wasser abdrehen.", "Am Absperrhahn."], ["Warum lobt der Notdienst Leni?", "Sie hat die Sicherung ausgeschaltet.", "So kommt kein Wasser in die Elektrik."], ["Welche Versicherung zahlt was?", "Gebäudeversicherung: Decke; Hausrat: Lenis Sachen.", "Eventuell zahlt auch Petrović’ Haftpflicht."], ["Warum muss ein Trocknungsgerät rein?", "Sonst entsteht Schimmel.", "Es läuft zwei bis drei Wochen."]], "say": ["Entschuldigung, dass ich Sie wecke.", "Wo ist der Absperrhahn?", "Wir haben einen Wasserschaden.", "Wer bezahlt das alles?", "Melden Sie den Schaden heute noch."]}, {"id": 46, "title": "Streit um den Stellplatz", "level": "B2", "topic": "Nachbarschaft & Konflikte", "rt": "ca. 6 Min.", "teaser": "Seit Wochen steht ein fremdes Auto auf Gregors gemietetem Stellplatz. Er will abschleppen lassen – bis er erfährt, wem es gehört.", "body": ["Gregor Wendt zahlt jeden Monat fünfundsechzig Euro für einen Stellplatz im Hof seines Wohnhauses in Mannheim-Neckarstadt. Stellplatz Nummer 12, mit einem kleinen weißen Schild an der Wand. Und seit drei Wochen steht dort fast jeden Morgen ein silberner Kleinwagen, der nicht ihm gehört.", "Am ersten Tag dachte er an ein Versehen. Am dritten Tag klebte er einen höflichen Zettel an die Windschutzscheibe: „Dies ist ein privater, vermieteter Stellplatz. Bitte nicht parken. Danke!“ Am zehnten Tag war der Zettel nicht mehr höflich.", "Heute ist Montag. Gregor kommt um 7:20 Uhr mit dem Autoschlüssel in der Hand in den Hof. Er muss um acht bei einem Kunden in Heidelberg sein. Auf Platz 12: der silberne Kleinwagen.", "Er ruft seinen Schwager Holger an, der Anwalt ist.", "„Holger, ich habe genug. Kann ich das Auto abschleppen lassen?“", "„Grundsätzlich ja. Es ist dein gemieteter Platz, und der Fahrer hat da nichts verloren. Du kannst einen Abschleppdienst rufen und die Kosten vom Halter zurückverlangen.“", "„Perfekt. Dann mache ich das jetzt.“", "„Moment. Grundsätzlich heißt bei Juristen immer: Es gibt ein Aber. Mach vorher Fotos, mit Datum und Uhrzeit. Und frag dich, ob du den Ärger wirklich willst. Der Abschleppdienst will das Geld oft erst mal von dir, und du musst es dir dann zurückholen. Wenn der Fahrer nicht zahlt, wird es ein langer Weg.“", "„Und was soll ich sonst machen? Weiter jeden Morgen auf der Straße parken?“", "„Hast du schon mal versucht, herauszufinden, wem das Auto gehört? Wenn es jemand aus dem Haus ist, ist ein Gespräch oft schneller als jeder Anwalt. Sagt dir ein Anwalt, das solltest du dir merken.“", "Gregor parkt wieder einmal auf der Straße, zwei Blocks weiter, und kommt zu spät zum Kunden.", "Am Abend wartet er. Um 19:45 Uhr öffnet sich die Tür zum Hinterhaus, und eine Frau in blauer Kleidung kommt heraus, mit einem Rucksack und müden Augen. Sie geht direkt auf den silbernen Wagen zu.", "„Entschuldigung! Ist das Ihr Auto?“", "Die Frau bleibt stehen. „Ja. Gibt es ein Problem?“", "„Allerdings. Das ist mein Stellplatz. Ich bezahle dafür. Und seit drei Wochen kann ich ihn morgens nicht benutzen. Haben Sie meine Zettel nicht gesehen?“", "Die Frau schaut auf das weiße Schild an der Wand, dann auf Gregor. Sie wird rot.", "„Doch. Ich habe sie gesehen. Es tut mir leid. Ich weiß, dass das nicht in Ordnung ist.“", "„Warum machen Sie es dann?“", "Sie zögert. „Ich heiße Miriam Achterberg. Ich wohne seit einem Monat im Hinterhaus. Ich bin Pflegerin in der Notaufnahme im Theresienkrankenhaus und arbeite gerade im Nachtdienst. Ich komme morgens um halb sieben nach Hause, und um diese Zeit finde ich in der ganzen Straße keinen Parkplatz. Ich habe zwanzig Minuten gesucht, jeden Morgen. Und Ihr Platz war immer frei.“", "„Er war frei, weil ich nachts schlafe und morgens damit wegfahre.“", "„Ich weiß. Ich habe gehofft, dass ich früh genug wieder weg bin. Aber ich schlafe dann so tief, dass ich den Wecker nicht höre. Ehrlich, das war nicht fair von mir.“", "Gregor merkt, wie sein Ärger kleiner wird. Er hat sich die Person hinter dem Auto ganz anders vorgestellt.", "„Nachtdienst. Wie lange noch?“", "„Diesen Block noch zwei Wochen. Dann habe ich Frühdienst. Dann ist das Problem andersherum: Ich fahre um fünf los.“", "Gregor denkt kurz nach. „Moment. Um fünf fahren Sie los, und Sie kommen wann zurück?“", "„Gegen vierzehn Uhr.“", "„Ich fahre um halb acht los und komme gegen achtzehn Uhr zurück. Im Nachtdienst kommen Sie um halb sieben, und ich fahre um halb acht.“", "„Sie meinen …?“", "„Ich meine, dass wir den Platz vielleicht teilen können. Nicht gleichzeitig, aber nacheinander. Wir müssen uns nur absprechen.“", "Miriam schaut ihn ungläubig an. „Sie würden das machen? Nach all den Zetteln?“", "„Die Zettel waren, bevor ich wusste, dass Sie Leute in der Notaufnahme versorgen. Ich arbeite im Vertrieb. Wenn ich zu spät komme, stirbt niemand.“", "Sie lacht zum ersten Mal. „Normalerweise auch nicht bei mir. Aber danke.“", "„Eine Bedingung“, sagt Gregor. „Wir tauschen Handynummern. Wenn ich mal früher los muss, schreibe ich Ihnen am Abend vorher. Und Sie stellen sich einen zweiten Wecker.“", "„Abgemacht. Und ich beteilige mich an der Miete. Die Hälfte. Zweiunddreißig fünfzig.“", "„Das müssen Sie nicht.“", "„Doch. Sonst fühle ich mich schlecht. Und ich will Ihnen nicht noch einmal einen Grund für einen Zettel geben.“", "Gregor ruft den Vermieter an, um zu fragen, ob die Untervermietung des Stellplatzes in Ordnung ist. Der Vermieter hat nichts dagegen, solange Gregor der Mieter bleibt und für alles verantwortlich ist.", "In den nächsten Wochen funktioniert der Plan erstaunlich gut. Einmal schreibt Gregor um 22 Uhr: „Morgen muss ich schon um 6:30 los. Sorry!“ Und am nächsten Morgen steht der silberne Wagen auf der Straße und Platz 12 ist frei.", "Einen Monat später findet Gregor einen Zettel an seiner eigenen Windschutzscheibe. Er erkennt die Handschrift sofort.", "„Lieber Nachbar vom Platz 12, danke für Ihre Geduld. Unten im Hof steht eine Dose Plätzchen für Sie. Die Kollegen auf Station sagen, Sie sind ein Held. Gruß, M.“", "Gregor muss lachen. Er klebt den Zettel in sein Handschuhfach. Holger wird er davon erzählen. Und auch, dass ein Gespräch tatsächlich schneller war als jeder Anwalt."], "gl": [["der Stellplatz", "parking space"], ["das Versehen", "oversight / mistake"], ["die Windschutzscheibe", "windscreen"], ["der Schwager", "brother-in-law"], ["abschleppen lassen", "to have (a car) towed"], ["grundsätzlich", "in principle"], ["nichts verloren haben", "to have no business being somewhere"], ["der Halter", "(registered) keeper"], ["zurückverlangen", "to demand back"], ["das Hinterhaus", "rear building"], ["der Nachtdienst", "night shift"], ["andersherum", "the other way round"], ["sich absprechen", "to coordinate / agree"], ["ungläubig", "incredulous"], ["versorgen", "to care for"], ["die Bedingung", "condition"], ["sich beteiligen an", "to contribute to"], ["die Untervermietung", "subletting"], ["verantwortlich", "responsible"], ["das Handschuhfach", "glove compartment"]], "q": [["Was hat Gregor schon versucht?", "Zettel an der Windschutzscheibe.", "Erst höflich, später nicht mehr."], ["Warum rät Holger vom Abschleppen ab?", "Man muss oft erst selbst zahlen und das Geld zurückholen.", "Ein Gespräch sei oft schneller."], ["Warum parkt Miriam auf Platz 12?", "Nach dem Nachtdienst findet sie keinen Parkplatz.", "Sie verschläft dann den Wecker."], ["Welche Lösung finden die beiden?", "Sie teilen den Stellplatz zeitversetzt.", "Mit Absprache per Handy."], ["Was klärt Gregor mit dem Vermieter?", "Ob die Untervermietung erlaubt ist.", "Gregor bleibt Mieter und verantwortlich."]], "say": ["Ist das Ihr Auto?", "Ich weiß, dass das nicht in Ordnung ist.", "Wir müssen uns nur absprechen.", "Ich beteilige mich an der Miete.", "Ein Gespräch ist oft schneller als jeder Anwalt."]}, {"id": 47, "title": "Die Krankschreibung", "level": "B2", "topic": "Arbeit & Gesundheit", "rt": "ca. 6 Min.", "teaser": "Mateo ist in der Probezeit und hat Fieber. Muss er zur Arbeit? Muss er dem Chef sagen, was er hat? Und wo ist eigentlich der gelbe Schein?", "body": ["Mateo Ruiz ist seit sieben Wochen Junior-Controller bei einem Logistikunternehmen in Ulm. Er ist in der Probezeit, er will einen guten Eindruck machen – und am Mittwochmorgen hat er neununddreißig Komma zwei Grad Fieber.", "Er sitzt auf der Bettkante und schreibt seiner Freundin Valentina eine Nachricht. Dann löscht er sie wieder und ruft sie an.", "„Valentina, ich glaube, ich muss trotzdem hin. Heute ist das Monatsreporting.“", "„Mateo, du klingst wie ein kaputter Staubsauger. Du gehst nirgendwohin.“", "„Aber ich bin in der Probezeit. Wenn ich jetzt fehle, denken die, ich bin unzuverlässig.“", "„Wenn du alle ansteckst, denken die, du bist unvernünftig. Ruf deine Chefin an. Jetzt. Bevor der Arbeitstag anfängt.“", "Mateo atmet tief durch und wählt die Nummer von Frau Lehmann, seiner Teamleiterin.", "„Lehmann.“", "„Guten Morgen, Frau Lehmann, hier ist Mateo Ruiz. Es tut mir leid, ich bin krank. Ich habe hohes Fieber und kann heute leider nicht kommen.“", "„Oh je, das hört man. Gute Besserung! Danke, dass Sie so früh Bescheid geben.“", "„Das Reporting … Ich könnte vielleicht von zu Hause …“", "„Herr Ruiz. Wer krank ist, arbeitet nicht. Auch nicht von zu Hause. Herr Mertens übernimmt das Reporting, er kennt es seit Jahren. Gehen Sie bitte zum Arzt.“", "„Muss ich gleich heute zum Arzt? Ich dachte, man braucht erst ab dem dritten Tag eine Bescheinigung.“", "„Bei uns im Vertrag steht: ab dem ersten Tag. Das darf der Arbeitgeber so regeln. Schauen Sie mal in Ihren Arbeitsvertrag, Paragraf neun.“", "„Oh. Das wusste ich nicht. Dann gehe ich heute.“", "Die Hausarztpraxis hat eine Infektsprechstunde ab neun. Mateo sitzt mit Maske in einem separaten Wartezimmer. Nach vierzig Minuten ruft ihn Dr. Kaya auf.", "„Was fehlt Ihnen denn?“", "„Fieber seit gestern Abend, Gliederschmerzen, Halsschmerzen. Und ich bin sehr müde.“", "Dr. Kaya hört ihn ab, schaut in den Hals und macht einen Schnelltest.", "„Ein grippaler Infekt. Nichts Gefährliches, aber Sie brauchen Ruhe. Ich schreibe Sie bis Freitag krank. Wenn es am Wochenende nicht besser wird, kommen Sie am Montag wieder.“", "„Und den gelben Schein, bekomme ich den hier?“", "Dr. Kaya lächelt. „Den gelben Schein gibt es so nicht mehr. Seit 2023 ist die Krankschreibung elektronisch. Wir schicken die Arbeitsunfähigkeitsbescheinigung direkt an Ihre Krankenkasse. Ihr Arbeitgeber ruft sie dort ab.“", "„Und ich muss gar nichts machen?“", "„Doch, zwei Dinge. Erstens: Ihrem Arbeitgeber Bescheid sagen, dass Sie krank sind und wie lange voraussichtlich. Das ist Ihre Pflicht. Die Bescheinigung allein reicht nicht. Zweitens: Sie bekommen von mir einen Ausdruck für Ihre Unterlagen. Den heben Sie auf.“", "„Steht da drauf, was ich habe? Meine Chefin fragt bestimmt.“", "„Nein. Auf der Bescheinigung für den Arbeitgeber steht keine Diagnose. Nur der Zeitraum. Und Sie sind auch nicht verpflichtet, Ihrem Arbeitgeber zu sagen, was Sie haben. Wenn Sie es erzählen wollen, dürfen Sie das natürlich.“", "Zu Hause schreibt Mateo eine kurze Mail an Frau Lehmann: Er sei bis einschließlich Freitag krankgeschrieben, die Bescheinigung liege bei der Krankenkasse vor. Dann schläft er vierzehn Stunden.", "Am Donnerstagnachmittag ruft sein Kollege Jannik an.", "„Na, lebst du noch? Ich soll dir von allen gute Besserung sagen.“", "„Danke. Langsam geht's. Sag mal, redet jemand über mich? Weil ich in der Probezeit krank bin?“", "„Was? Nein. Mertens hat das Reporting gemacht und sich nur beschwert, dass deine Excel-Tabellen viel ordentlicher sind als seine. Das ist ein Kompliment.“", "„Ich hatte echt Angst, dass das Konsequenzen hat.“", "„Mateo, jeder wird mal krank. Ehrlich gesagt ist es schlimmer, wenn jemand krank kommt und das halbe Büro ansteckt. Letzten Winter hatten wir einen Kollegen, der war stolz darauf, nie zu fehlen. Am Ende waren sechs Leute zwei Wochen weg.“", "Am Montag ist Mateo wieder fit. Als er ins Büro kommt, steht auf seinem Schreibtisch eine Flasche Orangensaft mit einem Post-it: „Willkommen zurück – Team Controlling.“", "Frau Lehmann kommt kurz vorbei.", "„Schön, dass Sie wieder da sind. Wie geht es Ihnen?“", "„Viel besser, danke. Und danke, dass Sie am Mittwoch so verständnisvoll waren. Ich hatte Angst, wegen der Probezeit.“", "„Herr Ruiz, Ihre Probezeit beurteile ich nach Ihrer Arbeit. Nicht nach einem Fieber. Und dass Sie sich sofort gemeldet haben, war genau richtig.“", "„Darf ich noch etwas fragen? Wenn ich nächstes Mal nur leicht erkältet bin – darf ich dann im Homeoffice arbeiten statt mich krankzumelden?“", "„Wenn Sie arbeitsfähig sind und nur andere nicht anstecken wollen: ja, gern nach Absprache. Wenn Sie arbeitsunfähig sind: nein. Dann sind Sie krank, egal wo Sie sitzen.“", "Am Abend erzählt Mateo Valentina alles.", "„Siehst du“, sagt sie. „Und du wolltest mit Fieber ins Büro.“", "„Ich habe drei Dinge gelernt: Paragraf neun lesen. Früh anrufen. Und nicht jedes deutsche Wort für ‚Schein‘ ist noch aus Papier.“"], "gl": [["die Krankschreibung / krankschreiben", "sick note / to sign off sick"], ["die Probezeit", "probation period"], ["unzuverlässig", "unreliable"], ["anstecken", "to infect"], ["Bescheid geben", "to let someone know"], ["Gute Besserung!", "Get well soon!"], ["die Infektsprechstunde", "consultation hours for infections"], ["die Gliederschmerzen", "aching limbs"], ["abhören", "to listen (with stethoscope)"], ["der grippale Infekt", "flu-like infection"], ["der gelbe Schein", "sick note (colloquial, formerly yellow)"], ["die Arbeitsunfähigkeitsbescheinigung (AU)", "certificate of incapacity for work"], ["abrufen", "to retrieve"], ["die Pflicht", "duty / obligation"], ["der Ausdruck", "printout"], ["die Diagnose", "diagnosis"], ["einschließlich", "inclusive"], ["ordentlich", "tidy / neat"], ["beurteilen", "to assess"], ["arbeitsfähig / arbeitsunfähig", "fit / unfit for work"]], "q": [["Warum will Mateo trotz Fieber zur Arbeit?", "Er hat Angst wegen der Probezeit.", "Außerdem ist Monatsreporting."], ["Warum muss er schon am ersten Tag zum Arzt?", "So steht es in seinem Arbeitsvertrag.", "Arbeitgeber dürfen das früher verlangen."], ["Wie kommt die Krankschreibung zum Arbeitgeber?", "Elektronisch über die Krankenkasse.", "Der Arbeitgeber ruft sie dort ab."], ["Muss Mateo seiner Chefin die Diagnose sagen?", "Nein.", "Auf der Bescheinigung steht nur der Zeitraum."], ["Was ist der Unterschied zwischen erkältet und arbeitsunfähig?", "Wer arbeitsfähig ist, kann nach Absprache im Homeoffice arbeiten.", "Wer arbeitsunfähig ist, arbeitet gar nicht."]], "say": ["Ich bin krank und kann heute leider nicht kommen.", "Danke, dass Sie so früh Bescheid geben.", "Ich bin bis einschließlich Freitag krankgeschrieben.", "Muss ich sagen, was ich habe?", "Wer krank ist, arbeitet nicht."]}, {"id": 48, "title": "Der Termin beim Facharzt", "level": "B2", "topic": "Gesundheit & Gesundheitssystem", "rt": "ca. 6 Min.", "teaser": "Die Hautärztin hat erst in fünf Monaten Zeit. Nils will seiner Oma helfen – und entdeckt die Terminservicestelle und den Dringlichkeitscode.", "body": ["Edith Brückner ist einundachtzig, wohnt allein in einer kleinen Wohnung in Göppingen und ist sehr stolz darauf, dass sie „noch alles selber macht“. Deshalb sagt sie ihrem Enkel Nils auch erst am Sonntag beim Kaffee, dass sie seit Wochen einen Fleck am Unterarm hat, der ihr nicht gefällt.", "„Zeig mal, Oma.“", "Sie schiebt den Ärmel hoch. Der Fleck ist dunkelbraun, ungefähr so groß wie ein Fingernagel, mit unregelmäßigem Rand.", "„Seit wann hast du den?“", "„Seit dem Frühjahr. Aber er ist größer geworden. Und manchmal juckt er.“", "Nils versucht, ruhig zu klingen. „Warst du damit beim Arzt?“", "„Beim Doktor Hellwig, ja. Der hat gesagt, das muss sich eine Hautärztin anschauen. Er hat mir eine Überweisung gegeben.“", "„Und? Hast du einen Termin?“", "Edith steht auf und holt einen Zettel vom Kühlschrank. „Ich habe bei drei Hautärzten angerufen. Zwei nehmen keine neuen Patienten. Und die dritte hat im März Zeit. In fünf Monaten.“", "„Fünf Monate? Oma, das ist viel zu lang.“", "„Was soll ich machen? Ich will mich nicht vordrängeln. Andere Leute sind auch krank.“", "Nils nimmt die Überweisung in die Hand. Oben rechts ist ein kleines Feld, in dem eine Buchstaben- und Zahlenkombination steht.", "„Was ist das hier? Dieser Code?“", "„Keine Ahnung. Der Doktor hat was von ‚dringend‘ gesagt und ein Kreuz gemacht.“", "Nils sucht auf dem Handy. Nach zwei Minuten schaut er auf.", "„Oma, das ist ein Dringlichkeitscode. Wenn der Hausarzt den auf die Überweisung schreibt, hast du Anspruch darauf, dass dir die Terminservicestelle einen Facharzttermin vermittelt. Innerhalb von wenigen Wochen, nicht Monaten.“", "„Was ist eine Terminservicestelle?“", "„Eine Stelle der Kassenärztlichen Vereinigung. Man ruft die Nummer 116117 an, oder man macht es online. Die suchen dir dann einen Termin bei einem Facharzt in der Region.“", "„Und warum hat mir das niemand gesagt?“", "„Vielleicht hat es der Doktor gesagt und du hast es vergessen?“", "„Ich vergesse nichts“, sagt Edith empört. Dann, leiser: „Na ja. Vielleicht ein bisschen.“", "Am Montagmorgen sitzt Nils neben ihr am Küchentisch, das Handy auf Lautsprecher. Die Warteschleife spielt Klaviermusik.", "„Wie lange dauert das denn?“, fragt Edith nach zwölf Minuten.", "„Das ist der Preis für einen schnellen Termin. Ein bisschen Geduld am Telefon.“", "Endlich meldet sich eine Stimme. „Terminservicestelle, mein Name ist Schäfer. Was kann ich für Sie tun?“", "„Guten Morgen“, sagt Nils. „Ich rufe für meine Großmutter an, sie sitzt neben mir. Sie hat eine Überweisung zum Hautarzt mit Dringlichkeitscode.“", "„Sehr gut. Darf ich kurz mit Ihrer Großmutter sprechen? Ich brauche ihr Einverständnis.“", "Edith beugt sich zum Handy und spricht sehr laut und deutlich. „Ja, hier ist Edith Brückner. Mein Enkel darf das für mich machen.“", "„Danke, Frau Brückner. Dann lesen Sie mir bitte den Code vor. Und ich brauche Ihre Versichertennummer von der Gesundheitskarte.“", "Nils liest beides vor. Man hört die Frau tippen.", "„So. Ich habe einen Termin für Sie. Hautarztpraxis Dr. Ostermann in Esslingen, nächsten Donnerstag um 10:40 Uhr. Passt das?“", "„Esslingen?“, fragt Edith. „Das ist weit. Ich fahre nicht mehr Auto.“", "„Die Terminservicestelle vermittelt Termine in zumutbarer Entfernung. Wenn Sie einen Termin ablehnen, kann es sein, dass Sie keinen neuen über uns bekommen.“", "Nils schaut seine Oma an. „Ich fahre dich, Oma. Ich nehme mir den Vormittag frei.“", "„Dann nehmen wir den Termin“, sagt Edith. „Vielen Dank, Frau Schäfer.“", "„Gern. Sie bekommen gleich eine SMS zur Bestätigung. Bitte bringen Sie die Überweisung und die Gesundheitskarte mit. Und falls Sie doch nicht können, sagen Sie bitte ab. Dann bekommt jemand anderes den Termin.“", "Am Donnerstag sitzen sie im Wartezimmer von Dr. Ostermann. Es ist hell, modern, auf dem Tisch liegen Hochglanzmagazine.", "„Schöner als bei Doktor Hellwig“, flüstert Edith. „Da liegen nur Zeitschriften von 2015.“", "Dr. Ostermann ist eine ruhige Frau um die fünfzig. Sie betrachtet den Fleck mit einem kleinen Gerät, das wie eine Lupe mit Licht aussieht.", "„Gut, dass Sie gekommen sind, Frau Brückner. Das sieht nicht gefährlich aus, aber ich möchte sicher sein. Ich würde den Fleck gern entfernen und untersuchen lassen. Das ist ein kleiner Eingriff mit örtlicher Betäubung. Wir können das heute noch machen.“", "„Heute? Einfach so?“", "„Zwanzig Minuten. Sie spüren nur den Pieks von der Spritze.“", "Edith schaut Nils an. Er nickt.", "„Na gut. Dann weg mit dem Ding.“", "Eine Woche später ruft Dr. Ostermann an. Der Befund ist gutartig. Kein Grund zur Sorge, aber Edith soll ab jetzt einmal im Jahr zum Hautkrebs-Screening kommen.", "Am Sonntag gibt es bei Edith Käsekuchen. Sie hat für Nils extra ein großes Stück abgeschnitten.", "„Für meinen Chauffeur und Sekretär“, sagt sie. „Und weißt du was? Ich habe mir die 116117 auf den Kühlschrank geschrieben. Gleich neben die Nummer vom Pizzaservice.“", "„Wofür brauchst du den Pizzaservice, Oma?“", "„Für den Fall, dass du mal wieder fünf Monate nicht zum Kaffee kommst.“"], "gl": [["der Facharzt / die Fachärztin", "specialist (doctor)"], ["der Enkel", "grandson"], ["unregelmäßig", "irregular"], ["jucken", "to itch"], ["die Hautärztin", "dermatologist (f.)"], ["die Überweisung", "referral"], ["sich vordrängeln", "to jump the queue"], ["der Dringlichkeitscode", "urgency code"], ["der Anspruch", "entitlement / right"], ["die Terminservicestelle", "appointment service centre"], ["vermitteln", "to arrange / broker"], ["die Kassenärztliche Vereinigung", "Association of Statutory Health Insurance Physicians"], ["die Warteschleife", "hold queue"], ["das Einverständnis", "consent"], ["die Gesundheitskarte", "health insurance card"], ["zumutbar", "reasonable"], ["der Eingriff", "(minor) procedure"], ["die örtliche Betäubung", "local anaesthetic"], ["der Befund / gutartig", "findings / benign"], ["das Screening", "screening"]], "q": [["Warum macht sich Nils Sorgen?", "Der Fleck ist größer geworden und hat einen unregelmäßigen Rand.", "Und er juckt manchmal."], ["Was bedeutet der Code auf der Überweisung?", "Es ist ein Dringlichkeitscode.", "Damit vermittelt die Terminservicestelle schnell einen Termin."], ["Wie erreicht man die Terminservicestelle?", "Unter 116117 oder online.", "Sie gehört zur Kassenärztlichen Vereinigung."], ["Warum nimmt Edith den Termin in Esslingen an?", "Wer ablehnt, bekommt eventuell keinen neuen.", "Nils fährt sie hin."], ["Was ist das Ergebnis?", "Der Befund ist gutartig.", "Edith soll jährlich zum Screening."]], "say": ["Ich will mich nicht vordrängeln.", "Ich rufe für meine Großmutter an.", "Mein Enkel darf das für mich machen.", "Ist das weit?", "Gut, dass Sie gekommen sind."]}, {"id": 49, "title": "Reklamation im Elektromarkt", "level": "B2", "topic": "Verbraucherrechte", "rt": "ca. 6 Min.", "teaser": "Nach acht Monaten geht Joannas Kaffeevollautomat kaputt. Der Verkäufer redet von Garantie, Joanna von Gewährleistung. Wer hat recht?", "body": ["Joanna Nowak ist kein Morgenmensch. Ohne Kaffee spricht sie nicht, denkt sie nicht und lächelt sie nicht. Deshalb hat sie sich im Frühjahr einen teuren Kaffeevollautomaten gekauft: sechshundertneunundvierzig Euro, Milchschaum auf Knopfdruck, zwölf Kaffeesorten.", "Acht Monate lang war die Maschine ihre beste Freundin. Bis zu diesem Dienstag. Joanna drückt auf „Cappuccino“, die Maschine brummt, piept dreimal – und auf dem Display erscheint: Fehler 8.", "Sie schaltet aus und wieder an. Fehler 8. Sie entkalkt. Fehler 8. Sie liest das Handbuch, Seite 47: Fehler 8 – Brüheinheit blockiert. Bitte wenden Sie sich an den Kundendienst.", "Am Samstag trägt sie die Maschine im Originalkarton in den Elektromarkt. Sie ist schwerer, als sie aussieht.", "„Guten Tag“, sagt sie an der Servicetheke zu einem jungen Verkäufer mit Namensschild: Herr Seidel. „Ich möchte etwas reklamieren. Diesen Kaffeevollautomaten habe ich vor acht Monaten bei Ihnen gekauft. Er zeigt Fehler 8 und funktioniert nicht mehr.“", "„Oh, ärgerlich. Haben Sie den Kassenbon?“", "„Ja, hier. Und die Bestellbestätigung per E-Mail.“", "Herr Seidel tippt in den Computer. „Okay, gekauft im März. Da sind Sie noch in der Herstellergarantie. Die beste Lösung ist: Sie schicken das Gerät direkt an den Hersteller. Die Adresse steht im Garantieheft. Das dauert drei bis vier Wochen.“", "„Drei bis vier Wochen ohne Kaffee? Und das Paket muss ich selbst schicken?“", "„Der Hersteller schickt Ihnen ein Versandlabel. Das ist eigentlich ganz einfach.“", "Joanna stellt den Karton auf die Theke. Sie hat sich zu Hause vorbereitet.", "„Entschuldigung, aber ich möchte nicht die Garantie des Herstellers nutzen. Ich möchte meine gesetzliche Gewährleistung bei Ihnen geltend machen. Ich habe die Maschine bei Ihnen gekauft, also ist mein Vertragspartner der Händler, nicht der Hersteller.“", "Herr Seidel blinzelt. „Das … ist richtig. Die Gewährleistung haben Sie bei uns, zwei Jahre.“", "„Und soweit ich weiß, wird im ersten Jahr nach dem Kauf vermutet, dass der Mangel schon beim Kauf da war. Ich muss also nicht beweisen, dass ich die Maschine nicht kaputt gemacht habe.“", "„Das stimmt auch“, sagt Herr Seidel langsam. „Sie kennen sich aus.“", "„Ich habe gestern Abend zwei Stunden auf der Seite der Verbraucherzentrale gelesen. Ohne Kaffee.“", "Herr Seidel lacht. „Okay. Einen Moment, ich hole meine Kollegin.“", "Er kommt mit einer Frau Mitte vierzig zurück. Auf ihrem Schild steht: Frau Reiter, Teamleitung Service.", "„Frau Nowak? Mein Kollege hat mir erzählt, worum es geht. Sie haben völlig recht, die Gewährleistung läuft über uns. Was wünschen Sie sich denn – Reparatur oder ein neues Gerät?“", "„Was ist schneller?“", "„Eine Reparatur dauert bei uns auch zwei bis drei Wochen, weil das Gerät zum Hersteller geht. Ein Austauschgerät könnte ich Ihnen heute mitgeben. Das gleiche Modell ist auf Lager.“", "„Dann bitte ein neues Gerät.“", "„Einverstanden. Ich muss nur kurz prüfen, ob es sichtbare Schäden gibt. Darf ich?“", "Frau Reiter öffnet den Karton, schaut sich die Maschine von allen Seiten an und zieht die Brüheinheit heraus.", "„Hm. Die Brüheinheit ist ziemlich verschmutzt. Reinigen Sie die regelmäßig?“", "Joanna wird ein bisschen rot. „Ehrlich gesagt … Ich wusste nicht, dass man die rausnehmen kann.“", "„Das wissen viele nicht. Es steht auf Seite 31. Einmal pro Woche unter fließendem Wasser abspülen.“", "„Bedeutet das jetzt, dass es meine Schuld ist?“", "„Nicht unbedingt. Fehler 8 kann viele Ursachen haben. Und im ersten Jahr müssten wir Ihnen nachweisen, dass Sie den Defekt verursacht haben. Das kann ich hier nicht. Deshalb bekommen Sie das Austauschgerät.“", "„Das ist fair. Danke.“", "„Aber ich gebe Ihnen einen Rat“, sagt Frau Reiter und lächelt. „Lesen Sie Seite 31. Sonst sehen wir uns in acht Monaten wieder.“", "„Versprochen. Seite 31.“", "Herr Seidel bringt einen neuen Karton aus dem Lager und druckt einen Umtauschbeleg aus.", "„Ich habe heute was gelernt“, sagt er, als er Joanna den Beleg gibt. „Die meisten Kunden nehmen einfach den Weg über den Hersteller.“", "„Das ist manchmal auch in Ordnung. Aber man sollte wissen, dass man eine Wahl hat.“", "„Darf ich fragen, was Sie beruflich machen? Juristin?“", "„Nein“, lacht Joanna. „Ich bin Grundschullehrerin. Ich erkläre den ganzen Tag Regeln. Da lese ich sie eben auch.“", "Zu Hause stellt sie die neue Maschine auf und macht sich einen Cappuccino. Dann klebt sie einen gelben Zettel an die Seite: Freitag = Brüheinheit! Seite 31.", "Am Abend schreibt sie ihrer Schwester in Breslau: „Heute habe ich mit Paragrafen um meinen Kaffee gekämpft. Und gewonnen.“"], "gl": [["die Reklamation / reklamieren", "complaint / to make a complaint"], ["der Kaffeevollautomat", "bean-to-cup coffee machine"], ["entkalken", "to descale"], ["die Brüheinheit", "brewing unit"], ["der Kundendienst", "customer service"], ["ärgerlich", "annoying"], ["die Herstellergarantie", "manufacturer's warranty"], ["das Versandlabel", "shipping label"], ["die gesetzliche Gewährleistung", "statutory warranty"], ["geltend machen", "to assert / claim"], ["der Vertragspartner", "contracting party"], ["der Mangel", "defect"], ["vermuten", "to presume"], ["sich auskennen", "to know one's way around"], ["die Verbraucherzentrale", "consumer advice centre"], ["auf Lager sein", "to be in stock"], ["verschmutzt", "dirty / soiled"], ["verursachen", "to cause"], ["nachweisen", "to prove"], ["der Umtauschbeleg", "exchange receipt"]], "q": [["Was schlägt Herr Seidel zuerst vor?", "Das Gerät an den Hersteller zu schicken.", "Das wäre die Herstellergarantie."], ["Warum möchte Joanna lieber die Gewährleistung?", "Ihr Vertragspartner ist der Händler.", "Die Gewährleistung gilt gesetzlich zwei Jahre."], ["Was gilt im ersten Jahr nach dem Kauf?", "Man vermutet, dass der Mangel schon beim Kauf da war.", "Der Händler müsste das Gegenteil beweisen."], ["Warum wird Joanna rot?", "Sie hat die Brüheinheit nie gereinigt.", "Das steht auf Seite 31 im Handbuch."], ["Was bekommt Joanna am Ende?", "Ein neues Austauschgerät.", "Das gleiche Modell war auf Lager."]], "say": ["Ich möchte etwas reklamieren.", "Ich möchte meine Gewährleistung geltend machen.", "Was ist schneller?", "Bedeutet das, dass es meine Schuld ist?", "Man sollte wissen, dass man eine Wahl hat."]}, {"id": 50, "title": "Umtausch ohne Kassenbon", "level": "B2", "topic": "Einkaufen & Verbraucherrechte", "rt": "ca. 6 Min.", "teaser": "Tante Gerlindes Pullover ist zwei Nummern zu groß, und der Kassenbon ist weg. Oskar lernt den Unterschied zwischen Recht und Kulanz.", "body": ["Oskar Lindqvist hat zum Geburtstag einen Pullover bekommen. Er ist dunkelgrün, aus feiner Wolle, sehr weich – und mindestens zwei Nummern zu groß. Als er ihn anprobiert, sieht er aus wie ein Kind, das sich die Kleidung seines Vaters ausgeliehen hat.", "Am Telefon bedankt er sich trotzdem herzlich bei seiner Tante Gerlinde.", "„Er ist wunderschön, Tante Gerlinde. Wirklich. Nur … ein kleines bisschen groß.“", "„Ach, Junge, das habe ich mir schon gedacht. Die Verkäuferin hat gesagt, die fallen klein aus. Tausch ihn einfach um. Er ist von Hagemann in der Königstraße.“", "„Hast du vielleicht noch den Kassenbon?“", "Kurze Stille. „Den Bon … Den hab ich, glaube ich, mit dem Geschenkpapier weggeworfen. Ist das schlimm?“", "„Nein, nein. Das kriege ich schon hin“, sagt Oskar, obwohl er sich da gar nicht so sicher ist.", "Am Samstagvormittag steht er mit der Tüte an der Kasse im ersten Stock des Modehauses. Eine Verkäuferin mit kurzen grauen Haaren und einer großen Brille lächelt ihn an. Auf ihrem Namensschild steht: Frau Jahnke.", "„Guten Morgen. Was kann ich für Sie tun?“", "„Guten Morgen. Ich habe diesen Pullover geschenkt bekommen, aber er ist mir leider zu groß. Ich würde ihn gern gegen eine kleinere Größe umtauschen.“", "„Gern. Haben Sie den Kassenbon dabei?“", "„Leider nein. Meine Tante hat ihn weggeworfen. Aber das Etikett ist noch dran, und er war nie getragen.“", "Frau Jahnke nimmt den Pullover in die Hand und schaut sich das Etikett an. „Ohne Bon wird es schwierig. Sie müssen wissen: Einen Umtausch, nur weil etwas nicht passt oder nicht gefällt, schreibt das Gesetz im Laden gar nicht vor. Das ist bei uns freiwillig. Kulanz nennt man das.“", "„Wirklich? Ich dachte, man hat immer vierzehn Tage Rückgaberecht.“", "„Das gilt beim Online-Kauf, beim Widerruf. Im Geschäft nicht. Wenn die Ware einen Mangel hat, ist das etwas anderes. Aber zu groß ist kein Mangel.“", "Oskar seufzt. „Dann habe ich wohl Pech.“", "„Moment, so schnell geben wir nicht auf“, sagt Frau Jahnke. „Wir tauschen bei uns innerhalb von dreißig Tagen um, wenn wir sehen können, dass die Ware bei uns gekauft wurde. Wissen Sie, wann Ihre Tante ihn gekauft hat? Und wie sie bezahlt hat?“", "„Ich glaube, Anfang des Monats. Wie sie bezahlt hat, weiß ich nicht. Aber ich kann sie anrufen.“", "„Tun Sie das. Wenn sie mit Karte bezahlt hat, kann ich den Kauf vielleicht im System finden. Mit Datum und Betrag.“", "Oskar geht ein paar Schritte zur Seite und ruft an.", "„Tante Gerlinde, ich bin im Laden. Weißt du noch, wie du den Pullover bezahlt hast?“", "„Mit meiner EC-Karte, natürlich. Ich zahle doch nicht bar, ich bin ja nicht von gestern. Am dritten, an einem Dienstag. Neunundachtzig Euro neunzig.“", "„Du bist unglaublich. Danke!“", "Er geht zurück zur Kasse und gibt die Informationen weiter. Frau Jahnke tippt, scrollt und nickt.", "„Da haben wir ihn. Dritter des Monats, 11:42 Uhr, ein Pullover Merinowolle, grün, Größe XL, neunundachtzig neunzig. Perfekt. Dann ist das kein Problem. Welche Größe brauchen Sie?“", "„M, denke ich. Darf ich ihn vorher anprobieren?“", "„Natürlich. Die Umkleiden sind gleich da hinten.“", "Nach fünf Minuten kommt Oskar zurück. Er sieht unglücklich aus.", "„M passt, aber in Grün gibt es nur noch XL und XXL. Und die anderen Farben … sind ehrlich gesagt nicht so meins.“", "„Das ist schade. Dann kann ich Ihnen einen Gutschein anbieten. Über den vollen Betrag. Den können Sie im ganzen Haus einlösen.“", "„Kann ich nicht einfach das Geld zurückbekommen?“", "Frau Jahnke schüttelt freundlich den Kopf. „Bei Kulanz entscheidet das Geschäft, wie es den Umtausch macht. Bei uns gibt es ohne Mangel kein Geld zurück, nur Ware oder einen Gutschein. Und das Geld würde sowieso an Ihre Tante gehen, nicht an Sie. Sie hat ja bezahlt.“", "„Das stimmt. Wie lange ist der Gutschein gültig?“", "„Drei Jahre, gerechnet ab Ende dieses Jahres. Das ist die gesetzliche Verjährungsfrist. Sie haben also genug Zeit.“", "„Gut. Dann nehme ich den Gutschein.“", "Frau Jahnke druckt ihn aus und legt ihn in einen kleinen Umschlag. „Ein Tipp für das nächste Mal: Wenn man Kleidung verschenkt, kann man an der Kasse um einen Geschenkbeleg bitten. Da steht der Preis nicht drauf, aber man kann damit umtauschen.“", "„Das sage ich meiner Tante. Sie schenkt jedes Jahr Pullover.“", "„Dann sehen wir uns ja wieder“, sagt Frau Jahnke und lacht.", "Oskar geht mit dem Gutschein durch das Modehaus. Im Erdgeschoss findet er einen Schal in genau demselben dunklen Grün. Er kauft ihn, dazu Handschuhe – und vom Rest des Gutscheins kauft er eine kleine Dose Pralinen.", "Am Sonntag besucht er Tante Gerlinde. Er trägt den Schal.", "„Oh, der ist aber schön! Wo hast du den her?“", "„Von dir. Indirekt. Und die Pralinen sind auch von dir. Sozusagen.“", "Tante Gerlinde schaut ihn verwirrt an, dann versteht sie und lacht laut.", "„Und nächstes Jahr“, sagt Oskar, „bittest du an der Kasse um einen Geschenkbeleg. Und kaufst Größe M.“", "„Nächstes Jahr“, sagt Tante Gerlinde und öffnet die Pralinen, „schenke ich dir einen Gutschein. Dann musst du gar nichts mehr umtauschen.“"], "gl": [["umtauschen / der Umtausch", "to exchange / exchange"], ["klein ausfallen", "to run small (sizes)"], ["das Geschenkpapier", "wrapping paper"], ["das Etikett", "label / tag"], ["vorschreiben", "to prescribe / require"], ["freiwillig", "voluntary"], ["die Kulanz", "goodwill (gesture)"], ["das Rückgaberecht", "right of return"], ["der Widerruf", "withdrawal (from contract)"], ["die Ware", "goods"], ["nicht von gestern sein", "not to be born yesterday"], ["die Umkleide", "changing room"], ["nicht so meins sein", "not really my thing"], ["der Gutschein", "voucher"], ["einlösen", "to redeem"], ["gültig", "valid"], ["die Verjährungsfrist", "limitation period"], ["der Geschenkbeleg", "gift receipt"], ["verschenken", "to give as a present"], ["sozusagen", "so to speak"]], "q": [["Warum will Oskar den Pullover umtauschen?", "Er ist zwei Nummern zu groß.", "Die Tante dachte, die Größen fallen klein aus."], ["Muss ein Geschäft Ware umtauschen, die nur nicht passt?", "Nein, das ist freiwillige Kulanz.", "Anders ist es bei einem Mangel oder beim Online-Kauf."], ["Wie findet Frau Jahnke den Kauf ohne Bon?", "Über Datum und Betrag der Kartenzahlung.", "Die Tante hat mit EC-Karte bezahlt."], ["Warum bekommt Oskar kein Geld zurück?", "Das Geschäft bietet bei Kulanz nur Ware oder Gutschein an.", "Außerdem hat die Tante bezahlt."], ["Welchen Tipp gibt Frau Jahnke?", "Beim Schenken um einen Geschenkbeleg bitten.", "Darauf steht kein Preis, aber man kann umtauschen."]], "say": ["Ich würde ihn gern umtauschen.", "Leider habe ich den Kassenbon nicht mehr.", "Darf ich ihn vorher anprobieren?", "Kann ich nicht einfach das Geld zurückbekommen?", "Könnte ich bitte einen Geschenkbeleg bekommen?"]}, {"id": 51, "title": "Schnäppchenjagd im Schlussverkauf", "level": "B2", "topic": "Einkaufen & Konsum", "rt": "ca. 6 Min.", "teaser": "„Bis zu 70 % reduziert!“ Dilara und Henrike stürzen sich in den Schlussverkauf – und merken, dass nicht jedes Schnäppchen eins ist.", "body": ["Es ist der erste Samstag im Januar, und die Königstraße in Stuttgart ist voller Menschen. In fast jedem Schaufenster hängen rote Schilder: SALE. Bis zu 70 %. Alles muss raus!", "„Ich liebe diesen Tag“, sagt Dilara und reibt sich die Hände. „Ich habe eine Liste gemacht.“", "„Du hast eine Liste für den Schlussverkauf?“, fragt Henrike. „Ich dachte, beim Schnäppchenjagen geht es um spontane Entscheidungen.“", "„Genau deshalb habe ich eine Liste. Damit ich keine spontanen Entscheidungen treffe. Wintermantel, schwarze Stiefel, eventuell eine Handtasche. Mehr nicht.“", "„Eventuell?“", "„Eventuell ist ein sehr dehnbares Wort.“", "Im ersten Kaufhaus ist es heiß und laut. An den Kleiderständern drängeln sich die Leute. Eine Frau zieht so fest an einem Pullover, dass der Bügel durch die Luft fliegt.", "„Schau mal hier“, ruft Henrike. „Ein Kleid für neunzehn Euro! Vorher neunundachtzig.“", "Dilara nimmt das Kleid in die Hand. Es ist leuchtend orange, mit großen lila Blumen.", "„Henrike. Würdest du dieses Kleid für neunundachtzig Euro kaufen?“", "„Nie im Leben. Es ist furchtbar.“", "„Dann ist es kein Schnäppchen. Dann sind es neunzehn Euro für etwas Furchtbares.“", "Henrike hängt das Kleid zurück. „Du bist heute anstrengend, weißt du das?“", "„Ich bin heute vernünftig. Das ist ein Unterschied.“", "Im dritten Stock findet Dilara die Mäntel. Ein dunkelblauer Wollmantel, schlicht und warm, reduziert von zweihundertneunundvierzig auf hundertneunundvierzig Euro.", "„Der ist schön“, sagt Henrike. „Probier ihn an.“", "Vor der Umkleide ist eine Schlange von zwölf Personen. Dilara probiert den Mantel einfach vor dem Spiegel im Gang an. Er passt perfekt.", "„Hundert Euro gespart“, sagt Henrike.", "„Warte.“ Dilara holt ihr Handy heraus und scannt den Barcode auf dem Etikett.", "„Was machst du da?“", "„Preisvergleich. Manche Läden schreiben einen hohen ‚Statt‘-Preis auf das Schild, zu dem das Teil nie wirklich verkauft wurde. Damit der Rabatt größer aussieht.“", "„Ist das nicht verboten?“", "„Mittlerweile muss beim Rabatt der niedrigste Preis der letzten dreißig Tage als Vergleich stehen. Aber man sollte trotzdem selbst schauen.“", "Sie scrollt. „Online kostet er beim Hersteller auch hundertneunundvierzig. Das ist also ein normaler Ausverkaufspreis. Kein Trick. Gut.“", "„Und?“", "„Und ich habe ihn auf meiner Liste. Ich nehme ihn.“", "An der Kasse hängt ein Schild: „Reduzierte Ware ist vom Umtausch ausgeschlossen.“", "„Das heißt, ich kann ihn nicht zurückbringen?“, fragt Dilara die Kassiererin.", "„Nicht, wenn er Ihnen nicht mehr gefällt. Wenn ein Fehler dran ist, natürlich schon. Die Gewährleistung gilt immer, auch im Sale.“", "„Danke. Dann schaue ich ihn mir noch einmal genau an.“", "Sie prüft die Nähte, die Knöpfe, das Futter. Alles in Ordnung. Sie bezahlt.", "Zwei Stunden später sitzen sie im Café. Dilara hat eine Tüte. Henrike hat fünf.", "„Zeig mal her“, sagt Dilara.", "Henrike packt aus: Ein Pullover, der ihr ein bisschen zu eng ist. „Der war so billig, ich nehme einfach zwei Kilo ab.“ Ein Paar Sandalen. „Für den Sommer.“ Drei T-Shirts im Paket. „Weil ein einzelnes fast genauso viel gekostet hätte.“ Eine Lampe in Form einer Ananas. „Die war einfach lustig.“", "„Und was stand auf deiner Liste?“",
