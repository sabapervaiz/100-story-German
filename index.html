es runtergefallen.“", "„Lüg nicht! Die Seite mit Joris war aufgeschlagen!“", "„Ich weiß gar nicht, wer Joris ist!“", "Imke und Raphael kommen gleichzeitig aus der Küche. Imke geht zu Smilla, Raphael zu Mats. Es ist ein Reflex, und beiden fällt es erst auf, als sie sich über die Köpfe ihrer Kinder hinweg ansehen. Jeder steht auf seiner Seite.", "„Mats, hast du gefragt, bevor du in Smillas Zimmer gegangen bist?“, fragt Raphael.", "„Nein. Aber sie geht auch in mein Zimmer und nimmt sich das Ladekabel.“", "„Das ist was ganz anderes!“, ruft Smilla.", "„Ist es nicht!“", "„Okay“, sagt Imke ruhig, aber bestimmt. „Smilla, du gehst bitte in dein Zimmer. Mats, du auch. Wir reden in einer halben Stunde. Alle zusammen.“", "Als die Türen zu sind, sitzen Imke und Raphael in der Küche. Keiner sagt etwas. Dann Raphael:", "„Ist dir aufgefallen, was wir gerade gemacht haben?“", "„Jeder hat sein Kind verteidigt.“", "„Genau. Wie zwei Anwälte vor Gericht.“ Er reibt sich die Stirn. „Ich dachte, wenn wir die Organisation gut hinkriegen, klappt der Rest von allein. Der Plan, die Zimmer, die Fahrdienste. Aber über so etwas haben wir nie gesprochen. Wer darf wen erziehen? Darf ich Smilla sagen, dass sie etwas falsch gemacht hat? Darfst du das bei Mats?“", "Imke denkt nach. „Ehrlich gesagt habe ich Angst davor. Smilla hat mir schon zweimal gesagt: ‚Du bist nicht Mats' Mutter, also hör auf, so zu tun.‘ Und ich glaube, sie meint eigentlich: Du bist auch nicht mehr nur meine Mutter.“", "„Mats hat mich gestern gefragt, ob ich Smilla jetzt lieber mag als ihn. Weil ich ihr bei Mathe geholfen habe.“", "Sie sehen sich an. Imke greift nach seiner Hand.", "„Wir haben einen Plan für die Termine. Aber keinen für die Gefühle.“", "„Und keinen für die Regeln. Bei dir dürfen Kinder bis zehn aufbleiben, bei mir bis neun. Bei dir wird beim Essen nicht aufs Handy geschaut, bei mir schon, wenn es um die Schule geht. Die Kinder merken das. Und sie spielen uns gegeneinander aus. Nicht mal absichtlich.“", "Eine halbe Stunde später sitzen alle vier am Küchentisch. Smilla mit verschränkten Armen. Mats mit gesenktem Kopf.", "„Wir fangen anders an“, sagt Raphael. „Nicht mit der Frage, wer schuld ist. Sondern damit, dass Imke und ich einen Fehler gemacht haben.“", "Smilla schaut überrascht auf.", "„Wir haben euch in eine Wohnung gesetzt und gedacht, das läuft schon“, sagt Imke. „Aber wir haben nie mit euch besprochen, was eigentlich gilt. Wem gehört was? Wer darf wohin? Was passiert, wenn man sich streitet?“", "„In meinem Zimmer gilt: Keiner kommt rein, ohne zu klopfen“, sagt Smilla sofort. „Und das Tagebuch fasst niemand an. Nie.“", "„In meinem Zimmer auch“, sagt Mats leise. „Auch nicht wegen Ladekabeln.“", "Smilla öffnet den Mund. Dann schließt sie ihn wieder. „Okay. Fair. Sorry wegen der Kabel.“", "Mats schaut auf. „Ich hab's wirklich nicht gelesen. Ich kann nicht mal deine Schrift lesen. Die ist voll schnörkelig.“", "Smilla muss gegen ihren Willen lachen.", "Sie schreiben eine neue Liste. Nicht laminiert, sondern mit Kugelschreiber auf einem großen Blatt: Klopfen vor jedem Zimmer. Was einem anderen gehört, nur mit Erlaubnis. Gleiche Schlafenszeiten unter der Woche, egal wessen Kind. Und eine Regel, die Smilla vorschlägt: Wenn es Streit gibt, darf jeder Erwachsene etwas sagen. Aber Strafen gibt es nur vom eigenen Elternteil.", "„Ist das okay für dich?“, fragt Imke Raphael.", "„Für den Anfang. Wenn wir uns alle besser kennen, können wir es ändern.“", "„Und noch was“, sagt Mats. „Einmal im Monat machen nur wir zwei was, Papa. Ohne die anderen.“", "„Und wir auch“, sagt Smilla zu ihrer Mutter. „Ich will nicht immer teilen müssen.“", "„Das ist eine sehr gute Regel“, sagt Raphael.", "Später, als die Kinder im Bett sind, kommt Smilla noch einmal in die Küche. Sie hält das kaputte Notizbuch in der Hand.", "„Raphael? Kannst du das kleben? Du hast doch so Werkzeug.“", "Raphael nimmt es vorsichtig, ohne es aufzuschlagen. „Ich kann es versuchen. Ich lese auch nicht rein. Versprochen.“", "„Weiß ich“, sagt Smilla. „Mats würde es auch nicht lesen. Der kann ja meine Schrift nicht.“", "Als sie weg ist, schaut Imke Raphael an. „Hast du das gehört? Sie hat dich gefragt. Nicht mich.“", "Raphael lächelt. „Das ist der erste Eintrag, der nicht auf dem Plan steht.“"], "gl": [["die Patchwork-Familie", "blended family"], ["laminiert", "laminated"], ["schiefgehen", "to go wrong"], ["der Einband", "cover (of a book)"], ["das Tagebuch", "diary"], ["aufgeschlagen", "open (book)"], ["der Reflex", "reflex"], ["verteidigen", "to defend"], ["hinkriegen (ugs.)", "to manage / sort out"], ["erziehen", "to bring up / discipline"], ["aufbleiben", "to stay up"], ["gegeneinander ausspielen", "to play off against each other"], ["absichtlich", "on purpose"], ["mit verschränkten Armen", "with arms folded"], ["den Kopf senken", "to lower one's head"], ["schnörkelig", "full of flourishes"], ["gegen den eigenen Willen", "against one's will"], ["die Erlaubnis", "permission"], ["das Elternteil", "parent"], ["der Eintrag", "entry"]], "q": [["Was löst den Streit aus?", "Mats war ohne zu fragen in Smillas Zimmer.", "Das Tagebuch ist dabei kaputtgegangen."], ["Was merken Imke und Raphael an ihrer eigenen Reaktion?", "Jeder verteidigt reflexhaft sein eigenes Kind.", "„Wie zwei Anwälte vor Gericht.“"], ["Was fehlt laut Imke in der neuen Familie?", "Ein Plan für Gefühle und gemeinsame Regeln.", "Organisatorisch ist alles geplant."], ["Welche Regel schlägt Smilla für Streit vor?", "Strafen nur vom eigenen Elternteil.", "Sagen darf aber jeder Erwachsene etwas."], ["Warum ist das Ende bedeutsam?", "Smilla bittet Raphael um Hilfe.", "Ein erstes Zeichen von Vertrauen."]], "say": ["Ist dir aufgefallen, was wir gerade gemacht haben?", "Wir haben einen Plan für die Termine, aber keinen für die Gefühle.", "Wir fangen anders an.", "Was einem anderen gehört, nur mit Erlaubnis.", "Für den Anfang ist das okay."]}, {"id": 87, "title": "Die Fernbeziehung", "level": "C1", "topic": "Liebe & Lebensentscheidungen", "rt": "ca. 7 Min.", "teaser": "Nora forscht in Freiburg, Farid arbeitet seit einem Jahr in Montreal. Sechs Stunden Zeitverschiebung, ein Videoanruf am Sonntag – und eine Stelle, die nur einer von beiden aufgeben kann.", "body": ["Sonntag, 21:00 Uhr in Freiburg, 15:00 Uhr in Montreal. Seit elf Monaten ist das ihre feste Zeit. Nora sitzt mit einer Tasse Tee am Schreibtisch, der Laptop ist aufgeklappt, das Licht so eingestellt, dass sie nicht zu müde aussieht. Um 21:02 Uhr erscheint Farids Gesicht auf dem Bildschirm. Hinter ihm Schnee auf einem Balkongeländer.", "„Salut, ma belle. Wie war deine Woche?“", "„Lang. Der Antrag für die Drittmittel ist raus. Und deine?“", "„Auch lang. Hör mal, ich muss dir etwas erzählen. Und ich will, dass du erst bis zum Ende zuhörst, bevor du etwas sagst. Okay?“", "Nora stellt die Tasse ab. In elf Monaten hat Farid diesen Satz noch nie gesagt.", "„Okay.“", "„Mein Vertrag hier läuft im Juni aus. Das weißt du. Und eigentlich war der Plan, dass ich dann zurückkomme und mir in Deutschland etwas suche. Aber am Freitag hat mir die Institutsleitung eine unbefristete Stelle angeboten. Als Gruppenleiter. Mit eigenem Labor.“", "Nora sagt nichts. Sie hat versprochen, bis zum Ende zuzuhören.", "„Ich habe noch nicht zugesagt. Ich habe gesagt, ich brauche zwei Wochen. Weil das keine Entscheidung ist, die ich allein treffe. Und weil ich weiß, was es für dich bedeuten würde.“", "„Bist du fertig?“", "„Ja.“", "Nora atmet tief durch. „Glückwunsch. Ehrlich. Das ist genau das, wofür du die letzten zehn Jahre gearbeitet hast.“", "„Danke. Aber?“", "„Aber du weißt, dass ich hier gerade meine Habilitation mache. Dass ich in zwei Jahren vielleicht eine Professur bekomme. Wenn ich jetzt nach Kanada gehe, fange ich wieder bei null an. Ohne Netzwerk, ohne Französisch, das für eine Universität in Québec reicht.“", "„Ich weiß. Deshalb frage ich ja.“", "„Und wenn du nein sagst, dann sagst du nein zu der besten Stelle, die du je bekommen wirst. Und irgendwann, in fünf Jahren, bei einem Streit über den Abwasch, wirst du daran denken.“", "Farid schweigt. Dann sagt er leise: „Das ist genau meine Angst. Nur umgekehrt. Dass du in fünf Jahren beim Abwasch an deine Professur denkst.“", "Sie sehen sich an, über sechstausend Kilometer und einen leicht verpixelten Bildschirm.", "„Können wir eins festhalten?“, sagt Nora schließlich. „Wir entscheiden das nicht heute Abend. Und wir entscheiden es nicht danach, wer mehr opfert. Das ist eine Rechnung, bei der am Ende beide verlieren.“", "„Einverstanden. Wonach dann?“", "„Danach, wie wir leben wollen. Nicht nur, wo wir arbeiten.“", "In den folgenden zehn Tagen telefonieren sie jeden Abend. Nicht nur sonntags. Sie machen Listen, streichen sie wieder durch, schreiben neue. Nora spricht mit ihrer Doktormutter, Professorin Edda Varga-Holm, die selbst jahrelang zwischen Basel und Boston gependelt ist.", "„Darf ich Ihnen etwas sagen, das nicht in Ratgebern steht?“, sagt die Professorin. „Eine Fernbeziehung ist kein Zustand, sondern ein Übergang. Sie funktioniert, solange beide wissen, wann und wie sie endet. Das Gefährliche ist nicht die Entfernung. Das Gefährliche ist ein Übergang ohne Enddatum.“", "„Und wenn man das Enddatum nicht festlegen kann?“", "„Dann legt man eins fest, für das Gespräch darüber. Das ist auch ein Datum.“", "Am zehnten Abend erzählt Nora Farid davon.", "„Ein Datum für das Gespräch“, wiederholt er. „Das gefällt mir. Weil ich nämlich auch nachgedacht habe. Und ich habe die Institutsleitung gefragt, ob die Stelle wirklich sofort besetzt werden muss.“", "„Und?“", "„Sie würden ein Jahr warten. Wenn ich bis dahin regelmäßig remote mitarbeite und zweimal im Jahr vor Ort bin. Mein jetziger Projektleiter würde die Gruppe übergangsweise führen.“", "Nora richtet sich auf. „Das heißt, du könntest im Juni nach Freiburg kommen? Und trotzdem die Stelle behalten?“", "„Für ein Jahr. Dann muss ich mich entscheiden. Oder wir beide. Und in diesem Jahr kannst du deine Habilitation abschließen, und wir schauen, ob es in Montreal oder in Europa eine Möglichkeit für dich gibt. Oder ob ich in Deutschland etwas finde, das mir genauso wichtig ist. Mit offenen Karten.“", "„Und wenn es nach dem Jahr immer noch nicht passt?“", "„Dann reden wir wieder. Mit Datum.“", "Nora lacht und wischt sich gleichzeitig eine Träne aus dem Augenwinkel. „Du hast meiner Doktormutter zugehört, ohne sie zu kennen.“", "„Ich habe dir zugehört. Das reicht.“", "Sie schreiben das Datum in beide Kalender: den ersten Sonntag im nächsten April. Darunter steht, in beiden Kalendern, dasselbe Wort, das Farid vorgeschlagen hat: „Entscheidung – zusammen.“", "Nach dem Gespräch klappt Nora den Laptop zu und bleibt noch eine Weile sitzen. Draußen ist es dunkel, in Montreal scheint jetzt noch die Sonne auf den Schnee. Zum ersten Mal seit elf Monaten fühlt sich die Entfernung nicht wie ein Problem an, sondern wie eine Strecke mit einem Ziel."], "gl": [["die Fernbeziehung", "long-distance relationship"], ["die Zeitverschiebung", "time difference"], ["die Drittmittel", "third-party funding"], ["auslaufen (Vertrag)", "to expire"], ["unbefristet", "permanent"], ["zusagen", "to accept"], ["die Habilitation", "postdoctoral qualification"], ["die Professur", "professorship"], ["bei null anfangen", "to start from scratch"], ["umgekehrt", "the other way round"], ["verpixelt", "pixelated"], ["festhalten", "to establish / fix"], ["opfern", "to sacrifice"], ["die Doktormutter", "doctoral supervisor (f.)"], ["pendeln", "to commute"], ["der Ratgeber", "self-help guide"], ["der Übergang", "transition"], ["vor Ort", "on site"], ["mit offenen Karten", "with all cards on the table"], ["der Augenwinkel", "corner of the eye"]], "q": [["Welche Nachricht hat Farid?", "Ihm wird eine unbefristete Stelle in Montreal angeboten.", "Als Gruppenleiter mit eigenem Labor."], ["Warum ist das für Nora schwierig?", "Sie steht kurz vor der Habilitation in Freiburg.", "In Kanada müsste sie neu anfangen."], ["Wonach wollen sie nicht entscheiden?", "Danach, wer mehr opfert.", "Das wäre eine Rechnung mit zwei Verlierern."], ["Was rät die Doktormutter?", "Eine Fernbeziehung braucht ein Enddatum.", "Oder zumindest ein Datum für das Gespräch."], ["Welche Lösung finden sie?", "Farid kommt für ein Jahr nach Freiburg und behält die Stelle.", "Im April entscheiden sie gemeinsam."]], "say": ["Ich will, dass du erst bis zum Ende zuhörst.", "Das ist keine Entscheidung, die ich allein treffe.", "Können wir eins festhalten?", "Wir entscheiden es nicht danach, wer mehr opfert.", "Mit offenen Karten."]}, {"id": 88, "title": "Der Heiratsantrag", "level": "C1", "topic": "Liebe & Erwartungen", "rt": "ca. 7 Min.", "teaser": "Lennart hat alles geplant: Sonnenuntergang auf dem Hohentwiel, ein Ring, ein Fotograf hinter dem Felsen. Nur hat er Pia nie gefragt, was sie von einem Heiratsantrag hält.", "body": ["Der Ring liegt seit drei Wochen in Lennarts Sockenschublade, in einer kleinen dunkelblauen Schachtel. Weißgold, ein schmaler Saphir, weil Pia einmal gesagt hat, Diamanten seien ihr zu kalt. Lennart hat diesen Satz vor zwei Jahren gehört und nie vergessen.", "Der Plan steht. Samstag, Wanderung auf den Hohentwiel bei Singen. Oben auf der Festungsruine, kurz vor Sonnenuntergang, mit Blick auf den Bodensee. Sein bester Freund Tamino versteckt sich mit Kamera hinter einer Mauer. Danach ein Tisch im Restaurant unten im Ort, reserviert auf „Überraschung“.", "Am Donnerstagabend erzählt er alles seiner Schwester Wanda am Telefon.", "„Lennart, das klingt wunderschön. Wirklich. Darf ich trotzdem eine blöde Frage stellen?“", "„Klar.“", "„Weißt du, wie Pia über Heiratsanträge denkt? Nicht über dich. Über die Sache an sich.“", "„Was meinst du? Sie liebt mich. Wir wohnen seit vier Jahren zusammen.“", "„Das meine ich nicht. Manche Menschen finden einen öffentlichen Antrag mit Fotograf romantisch. Andere finden ihn übergriffig. Weil man vor Publikum quasi nicht nein sagen kann. Ich hatte eine Kollegin, die hat auf einem Konzert ja gesagt, weil der ganze Saal geklatscht hat. Ein halbes Jahr später war die Verlobung vorbei.“", "Lennart schweigt. „Pia ist nicht so.“", "„Vielleicht nicht. Aber habt ihr jemals über Heiraten gesprochen? Ob sie es überhaupt will?“", "Er denkt nach. Sie haben über Kinder gesprochen, irgendwann, vielleicht. Über eine größere Wohnung. Über eine Reise nach Japan. Aber über Heiraten? Einmal, auf einer Hochzeit von Freunden, hat Pia gesagt: „Die vielen Reden würde ich nicht aushalten.“ Er hatte das für einen Witz gehalten.", "„Ich weiß es nicht“, sagt er schließlich.", "„Dann frag sie. Nicht die große Frage. Die kleine davor.“", "Am Freitagabend sitzen Lennart und Pia auf dem Sofa. Im Fernsehen läuft eine Serie, in der gerade jemand auf einem Flughafen einen Heiratsantrag macht, mit Blumen und einer Menschenmenge. Lennart nimmt die Fernbedienung und drückt auf Pause.", "„Darf ich dich was fragen?“", "„Klar.“", "„Was hältst du davon? Von so einem Antrag?“", "Pia verzieht das Gesicht. „Ehrlich? Ich fände es furchtbar. Ich würde vor Scham im Boden versinken. Lauter Fremde, die einen anstarren, und man muss in drei Sekunden die wichtigste Entscheidung seines Lebens treffen. Mit Kamera.“", "Lennart spürt, wie ihm warm wird. „Und … abgesehen vom Flughafen? Was hältst du vom Heiraten überhaupt?“", "Pia schaut ihn an. Lange. Dann setzt sie sich auf.", "„Warum fragst du das?“", "„Weil ich gemerkt habe, dass wir nie darüber geredet haben. Und weil ich es wissen möchte. Ehrlich.“", "„Okay. Ehrlich.“ Sie zieht die Beine unter sich. „Ich habe lange gedacht, Heiraten brauche ich nicht. Meine Eltern haben geheiratet und sich nach zwölf Jahren scheiden lassen, und das Einzige, was von der Ehe übrig blieb, war ein Streit um das Haus. Für mich war Heiraten immer etwas, das man macht, weil man es so macht.“", "„Und jetzt?“", "„Jetzt … ist es anders. Seit wir zusammenwohnen, denke ich manchmal darüber nach. Nicht wegen eines Kleides oder einer Feier. Sondern weil ich mich entscheiden will. Bewusst. Nicht, weil man es so macht, sondern weil ich es mit dir will.“", "Lennart muss schlucken. „Und wie müsste so etwas für dich aussehen? Rein theoretisch.“", "Pia lächelt. „Rein theoretisch? Ohne Publikum. Ohne Fotograf. Irgendwo, wo es still ist. Und ich hätte gerne die Möglichkeit, zu sagen: Lass uns morgen darüber reden. Ohne dass es ein Drama wird.“", "„Und die Hochzeit?“", "„Standesamt, zwanzig Leute, gutes Essen. Keine Reden. Höchstens eine. Von Wanda, weil die lustig ist.“", "Lennart lacht. Dann steht er auf. „Warte kurz.“", "Er geht ins Schlafzimmer, öffnet die Sockenschublade, nimmt die Schachtel heraus. Dann schreibt er Tamino eine Nachricht: „Samstag fällt aus. Erkläre ich dir später. Danke trotzdem.“ Er storniert den Tisch im Restaurant.", "Als er zurückkommt, hat Pia den Fernseher ausgeschaltet. Er setzt sich neben sie, ohne niederzuknien, und legt die Schachtel zwischen sie auf das Sofa. Geschlossen.", "„Kein Publikum. Kein Fotograf. Ziemlich still hier, finde ich.“", "Pia schaut auf die Schachtel. Dann auf ihn. Ihre Augen werden groß.", "„Lennart …“", "„Du musst heute nichts sagen. Du kannst sie aufmachen oder liegen lassen. Und wenn du morgen darüber reden willst, reden wir morgen. Ohne Drama. Ich wollte nur, dass du weißt: Ich will es auch. Bewusst.“", "Pia nimmt die Schachtel in die Hand, öffnet sie aber nicht. Sie dreht sie zwischen den Fingern.", "„Seit wann hast du die?“", "„Drei Wochen. Ich hatte eigentlich einen ganz anderen Plan. Mit Hohentwiel und Sonnenuntergang. Und Tamino hinter einem Felsen.“", "„Mit Tamino hinter einem Felsen?“ Pia fängt an zu lachen, mit Tränen in den Augen. „Gott sei Dank hast du mich vorher gefragt.“", "Dann öffnet sie die Schachtel. Sieht den Saphir. Schweigt einen Moment.", "„Du hast dir gemerkt, dass ich Diamanten zu kalt finde.“", "„Ich merke mir fast alles, was du sagst. Nur das mit den Reden auf Hochzeiten habe ich falsch verstanden.“", "„Ja“, sagt Pia leise. „Die Antwort ist ja. Und morgen reden wir trotzdem. Über die zwanzig Gäste.“", "Am Samstag wandern sie trotzdem auf den Hohentwiel. Zu zweit, ohne Fotograf. Oben macht Pia ein einziges Foto: ihre Hand mit dem Ring auf der alten Steinmauer, dahinter der See. Sie schickt es an Wanda. Darunter schreibt sie: „Du hältst die Rede.“"], "gl": [["der Heiratsantrag", "marriage proposal"], ["die Sockenschublade", "sock drawer"], ["die Festungsruine", "fortress ruin"], ["übergriffig", "intrusive / overstepping"], ["die Verlobung", "engagement"], ["aushalten", "to bear / endure"], ["vor Scham im Boden versinken", "to want the ground to swallow you up"], ["anstarren", "to stare at"], ["abgesehen von", "apart from"], ["sich scheiden lassen", "to get divorced"], ["bewusst", "consciously / deliberately"], ["schlucken", "to swallow"], ["rein theoretisch", "purely hypothetically"], ["das Standesamt", "registry office"], ["stornieren", "to cancel"], ["niederknien", "to kneel down"], ["das Drama", "drama / fuss"], ["sich etwas merken", "to remember sth"], ["die Steinmauer", "stone wall"], ["eine Rede halten", "to give a speech"]], "q": [["Was hat Lennart geplant?", "Einen Antrag auf dem Hohentwiel mit Fotograf.", "Und danach ein Restaurant."], ["Welche Frage stellt Wanda?", "Wie Pia über Heiratsanträge denkt.", "Öffentliche Anträge können Druck machen."], ["Warum hat Pia ein schwieriges Verhältnis zum Heiraten?", "Die Ehe ihrer Eltern endete im Streit.", "Heiraten war für sie Konvention."], ["Was wünscht sich Pia für einen Antrag?", "Ohne Publikum, still, mit Bedenkzeit.", "Ohne Drama, wenn sie nicht sofort antwortet."], ["Wie macht Lennart den Antrag schließlich?", "Er legt die geschlossene Schachtel aufs Sofa.", "Pia darf sich Zeit lassen."]], "say": ["Darf ich trotzdem eine blöde Frage stellen?", "Was hältst du davon?", "Rein theoretisch: Wie müsste das für dich aussehen?", "Du musst heute nichts sagen.", "Gott sei Dank hast du mich vorher gefragt."]}, {"id": 89, "title": "Zivilcourage in der Bahn", "level": "C1", "topic": "Gesellschaft & Verantwortung", "rt": "ca. 7 Min.", "teaser": "In der S-Bahn wird eine junge Frau mit Kopftuch beschimpft. Alle schauen auf ihre Handys. Soraya weiß, was man in solchen Momenten tun sollte – theoretisch. Heute muss sie es praktisch wissen.", "body": ["Dienstagabend, 22:15 Uhr, S-Bahn Richtung Bietigheim. Der Wagen ist halb voll. Soraya Hashemi, Sozialarbeiterin, sitzt am Fenster und liest ihre Unterlagen für morgen. Vor einem Monat hat sie ein Seminar über Deeskalation gegeben.", "Bis ein Mann in Zuffenhausen einsteigt.", "Er ist etwa vierzig, stämmig, riecht nach Bier und setzt sich gegenüber von einer jungen Frau mit hellblauem Kopftuch, die in ein Pharmazie-Lehrbuch schaut.", "„Na? Lernst du schön?“ Seine Stimme ist laut. „Für was denn? Damit du uns dann die Jobs wegnimmst?“", "Die junge Frau nimmt einen Kopfhörer heraus. „Entschuldigung?“", "„Hast schon verstanden. Ihr kommt hierher, kriegt alles bezahlt, und dann …“ Der Rest ist ein Satz, den Soraya nicht wiederholen will.", "Die junge Frau senkt den Blick. Im Wagen wird es still. Alle schauen weg.", "Soraya spürt ihr Herz im Hals. Sie kennt den Zuschauereffekt aus ihrem Seminar: Je mehr Menschen zusehen, desto weniger fühlt sich der Einzelne verantwortlich. Jetzt sitzt sie mittendrin.", "Sie steht auf. Ihre Knie sind weich. Aber sie geht nicht auf den Mann zu, sondern auf die junge Frau.", "„Hey! Da bist du ja!“, sagt sie laut und freundlich, als würde sie eine alte Bekannte treffen. „Ich hab dich vorne gesucht. Komm, setz dich zu mir, da ist mehr Platz.“", "Die junge Frau schaut sie verwirrt an. Soraya zwinkert ihr kaum sichtbar zu. Dann versteht sie, nimmt ihr Buch und steht auf.", "Der Mann dreht sich um. „Was soll das denn jetzt? Mischt du dich ein, oder was?“", "Soraya schaut ihn nicht an. Kein Blickkampf, kein Duzen, keine Beleidigung. Sie spricht ruhig, aber laut genug für den ganzen Wagen.", "„Ich setze mich nur mit meiner Bekannten hin. Schönen Abend noch.“", "Dann dreht sie sich zu den anderen Fahrgästen.", "„Sie, mit dem Hut, würden Sie bitte den Notrufknopf neben der Tür drücken? Und du mit dem grauen Pullover – kannst du bitte die Polizei anrufen und sagen, wir sind in der S5, kurz vor Kornwestheim?“", "Für einen Moment passiert nichts. Dann steht der ältere Mann mit Hut auf. Langsam, aber bestimmt geht er zur Tür und drückt den Knopf. Der Student im grauen Pullover zieht sein Handy heraus. „Ja. Hallo? Ich bin in der S-Bahn …“", "Plötzlich schauen den Mann sechs Menschen an.", "„Ihr seid doch alle verrückt“, murmelt er. In Kornwestheim steigt er aus, bevor die Türen ganz offen sind.", "Die junge Frau sitzt neben Soraya und atmet zitternd aus.", "„Danke“, flüstert sie. „Ich … ich wusste nicht, was ich machen soll.“", "„Du musstest gar nichts machen. Das war nicht deine Aufgabe. Wie heißt du?“", "„Yasmin.“", "„Ich bin Soraya. Geht es dir gut? Sollen wir zusammen bis zu deiner Haltestelle fahren?“", "„Ich muss bis Ludwigsburg. Mein Bruder holt mich ab.“", "„Dann fahre ich mit bis Ludwigsburg.“", "Der Mann mit Hut kommt dazu. „Entschuldigen Sie“, sagt er zu Yasmin. „Ich hätte früher etwas tun müssen. Ich habe einfach nicht gewusst, was. Ich bin dreiundsiebzig. Ich dachte, was soll ich alter Mann denn machen?“", "„Sie haben den Knopf gedrückt“, sagt Soraya. „Das war genau richtig. Niemand muss ein Held sein. Man muss nur eine Sache tun.“", "In Ludwigsburg wartet Yasmins Bruder am Bahnsteig. Er gibt Soraya die Hand.", "„Danke. Sie wissen gar nicht, wie oft so was passiert. Und meistens macht niemand etwas.“", "„Doch, ich weiß es“, sagt Soraya leise. „Leider.“", "Auf der Rückfahrt zittern ihre Hände. Sie ruft ihre Freundin Frauke an.", "„Frauke? Hast du kurz Zeit? Mir ist gerade was passiert.“", "„Klar. Du klingst komisch. Alles okay?“", "„Jetzt ja. In der S-Bahn hat ein Typ eine junge Frau mit Kopftuch beschimpft. Und alle haben weggeschaut. Ich auch, am Anfang.“", "„Und dann?“", "„Dann habe ich genau das gemacht, was ich im Seminar immer erzähle. Nicht den Täter angesprochen, sondern sie. So getan, als wären wir Bekannte. Und dann einzelne Leute um Hilfe gebeten. Mit Kleidung und mit einer konkreten Aufgabe.“", "„Und das hat funktioniert?“", "„Erstaunlich gut. Sobald einer aufgestanden ist, sind die anderen mitgezogen. Die wollten alle helfen. Sie wussten nur nicht, wie.“", "„Soraya, du bist verrückt. Und großartig. Hattest du keine Angst?“", "„Doch. Riesige. Meine Knie sind immer noch aus Pudding. Aber weißt du, was schlimmer gewesen wäre? Nach Hause zu fahren und zu wissen, dass ich es eigentlich gewusst hätte.“", "„Und jetzt?“", "„Jetzt ergänze ich meine Folien. Ganz oben, in großen Buchstaben: Das Opfer ansprechen, nicht den Täter. Einzelne um Hilfe bitten, nicht alle. Und den Satz: Ich habe es ausprobiert.“", "Zwei Wochen später bekommt sie eine Mail von der Polizei. Der Mann wurde identifiziert, gegen ihn läuft ein Verfahren wegen Volksverhetzung und Beleidigung. Die Aussage des älteren Herrn mit Hut sei besonders hilfreich gewesen."], "gl": [["die Zivilcourage", "moral courage"], ["die Deeskalation", "de-escalation"], ["stämmig", "stocky"], ["das Kopftuch", "headscarf"], ["den Blick senken", "to lower one's gaze"], ["der Zuschauereffekt", "bystander effect"], ["mittendrin", "right in the middle"], ["sich einmischen", "to interfere / step in"], ["provozieren", "to provoke"], ["der Blickkampf", "staring contest"], ["beleidigen / die Beleidigung", "to insult / insult"], ["gezielt", "specifically / deliberately"], ["der Notrufknopf", "emergency button"], ["murmeln", "to mumble"], ["die Haltestelle", "stop"], ["der Held", "hero"], ["der Täter / das Opfer", "perpetrator / victim"], ["identifizieren", "to identify"], ["die Volksverhetzung", "incitement to hatred"], ["die Aussage", "statement / testimony"]], "q": [["Was ist der Zuschauereffekt?", "Je mehr Zuschauer, desto weniger fühlt sich jeder verantwortlich.", "Jeder denkt, ein anderer hilft."], ["Warum spricht Soraya zuerst die junge Frau an?", "Um sie aus der Situation zu holen, ohne den Täter zu provozieren.", "Sie tut so, als wären sie Bekannte."], ["Wie bittet Soraya um Hilfe?", "Sie spricht Einzelne gezielt mit einer Aufgabe an.", "Nicht einfach „alle“."], ["Was sagt Soraya zum älteren Mann?", "Niemand muss ein Held sein.", "Man muss nur eine Sache tun."], ["Was ergänzt Soraya in ihrem Seminar?", "Das Opfer ansprechen und Einzelne um Hilfe bitten.", "Sie hat es selbst ausprobiert."]], "say": ["Da bist du ja! Komm, setz dich zu mir.", "Würden Sie bitte den Notrufknopf drücken?", "Kannst du bitte die Polizei anrufen?", "Das war nicht deine Aufgabe.", "Niemand muss ein Held sein."]}, {"id": 90, "title": "Mut zur Lücke", "level": "C1", "topic": "Studium & Perfektionismus", "rt": "ca. 7 Min.", "teaser": "Noch neun Tage bis zum Staatsexamen, und Yannick hat erst die Hälfte des Stoffs wiederholt. Seine WG-Mitbewohnerin, eine Ärztin im Praktischen Jahr, rät ihm etwas, das er für Wahnsinn hält.", "body": ["Es ist 2:40 Uhr nachts, und in der Küche der WG in Tübingen brennt noch Licht. Yannick sitzt vor einem Turm aus Karteikarten, drei Lehrbüchern und einem Lernplan, der so viele rote Markierungen hat, dass er aussieht wie ein Fieberthermometer. In neun Tagen schreibt er das erste juristische Staatsexamen. Er hat erst die Hälfte des Stoffs wiederholt.", "Die Küchentür geht auf. Matilda kommt herein, im Kittel, die Haare zu einem unordentlichen Knoten gebunden. Sie ist im Praktischen Jahr an der Uniklinik und kommt gerade aus dem Nachtdienst.", "„Du schon wieder“, sagt sie und macht den Wasserkocher an. „Wie lange sitzt du schon?“", "„Seit acht Uhr morgens. Mit Pausen.“", "„Wie viele Pausen?“", "„Zwei. Zum Essen.“", "Matilda setzt sich ihm gegenüber und schaut auf den Lernplan. „Was bedeuten die roten Kreuze?“", "„Themen, die ich noch nicht wiederholt habe. Sachenrecht, Familienrecht, Erbrecht, das halbe Verwaltungsrecht. Ich schaffe das nie. Ich falle durch. Ich weiß es.“", "„Yannick. Darf ich dir etwas sagen, was du nicht hören willst?“", "„Wenn du schon so fragst.“", "„Du wirst nicht alles schaffen. Niemand schafft alles. Und je länger du versuchst, alles zu schaffen, desto weniger bleibt von dem hängen, was du schon kannst.“", "„Super. Sehr motivierend.“", "„Ich bin noch nicht fertig. Bei uns in der Medizin gibt es einen Spruch vor dem Examen: Mut zur Lücke. Das heißt nicht, dass man faul ist. Das heißt, dass man bewusst entscheidet, was man weglässt. Statt aus Panik alles halb zu machen.“", "Yannick lacht bitter. „Mut zur Lücke? In Jura? Was, wenn genau das drankommt, was ich weglasse?“", "„Dann hast du Pech bei einer Aufgabe. Wenn du stattdessen völlig übermüdet in die Prüfung gehst, hast du Pech bei allen Aufgaben. Wie viele Klausuren schreibst du?“", "„Sechs. An verschiedenen Tagen.“", "„Und welche Rechtsgebiete kommen garantiert dran?“", "Yannick zögert. „Zivilrecht, Strafrecht und Öffentliches Recht. Aber die Schwerpunkte innerhalb sind unterschiedlich. Es gibt Themen, die fast jedes Jahr drankommen. Allgemeines Schuldrecht zum Beispiel. Oder Grundrechte.“", "„Und Erbrecht?“", "„Selten. Vielleicht alle paar Jahre eine Teilfrage.“", "„Dann ist Erbrecht deine Lücke.“", "„Das kann ich nicht machen!“", "Matilda gießt Tee in zwei Tassen und schiebt ihm eine hin. „Okay. Dann frage ich dich anders. Was würdest du einem Mandanten raten, der neun Tage Zeit hat, um zehn Aufgaben zu erledigen, aber realistisch nur sechs schafft?“", "Yannick schaut sie lange an. „Die sechs wichtigsten gut zu machen. Und für die anderen eine Notlösung zu haben.“", "„Und warum gilt das nicht für dich?“", "„Weil … ich Angst habe.“ Es ist das erste Mal, dass er es laut sagt. „Wenn ich alles lerne und durchfalle, habe ich wenigstens alles versucht. Wenn ich etwas weglasse und durchfalle, bin ich selbst schuld.“", "Matilda nickt langsam. „Das kenne ich. Das ist Perfektionismus. Er fühlt sich an wie Fleiß, aber eigentlich ist er Angst mit einem guten Anzug.“", "Yannick muss gegen seinen Willen lachen. „Angst mit einem guten Anzug. Das schreibe ich mir auf.“", "„Schreib dir lieber einen neuen Lernplan auf. Morgen. Nach acht Stunden Schlaf.“", "Am nächsten Tag, ausgeschlafen, setzt sich Yannick mit einem leeren Blatt hin. Er teilt die Themen in drei Spalten. Links: Themen, die fast immer kommen und die er sicher können muss. Mitte: Themen, die oft kommen und die er in den Grundzügen kennen sollte. Rechts: Themen, die selten kommen. Seine Lücke.", "In die rechte Spalte schreibt er: Erbrecht, Teile des Familienrechts, Nebengebiete des Verwaltungsrechts. Für jedes dieser Themen nimmt er sich genau eine Stunde, um die wichtigsten Grundbegriffe zu kennen. Nicht mehr.", "Er ruft seinen Repetitor an, Herrn Dr. Hauke Brömmel, der ihn seit einem Jahr begleitet.", "„Herr Dr. Brömmel, ich habe meinen Plan geändert. Ich lasse Erbrecht weitgehend weg. Ist das verrückt?“", "„Verrückt wäre, es nicht zu tun. Ich sage das jedes Jahr, und jedes Jahr hören die wenigsten zu. Die meisten fallen nicht durch, weil sie zu wenig wissen, sondern weil sie in der Klausur keine Struktur mehr haben. Weil sie müde sind und alles durcheinanderwerfen. Schlafen Sie. Machen Sie Probeklausuren unter Zeitdruck. Und wenn ein Thema drankommt, das Sie nicht können: Argumentieren Sie sauber mit dem Gesetz. Auch dafür gibt es Punkte.“", "Die neun Tage vergehen. Yannick schläft sieben Stunden pro Nacht. Er geht jeden Abend eine halbe Stunde spazieren. Er schreibt vier Probeklausuren.", "Am dritten Prüfungstag, in der zweiten Zivilrechtsklausur, liest er den Sachverhalt. Eine Erblasserin. Ein Testament. Ein Streit unter Geschwistern.", "Für einen Moment wird ihm schwarz vor Augen. Dann atmet er tief durch. Er erinnert sich an die eine Stunde, die er für Erbrecht hatte. An die Grundbegriffe. Er schlägt das Gesetz auf, liest die Paragrafen genau und argumentiert, Schritt für Schritt, so sauber er kann.", "Vier Monate später kommen die Ergebnisse. Bestanden. Mit einer Note, die besser ist, als er je zu hoffen gewagt hat. In der Erbrechtsklausur hat er die schlechteste Note von allen. Sie reicht trotzdem.", "Am Abend stellt er Matilda eine Flasche Sekt auf den Küchentisch.", "„Was ist das?“", "„Für die Ärztin, die mich nachts um drei behandelt hat. Diagnose: Angst mit einem guten Anzug.“", "„Und die Therapie?“", "„Mut zur Lücke. Und Schlaf.“"], "gl": [["Mut zur Lücke", "courage to leave gaps (in learning)"], ["das Staatsexamen", "state examination"], ["der Stoff", "subject matter / material"], ["die Karteikarte", "index card"], ["der Kittel", "(white) coat"], ["das Praktische Jahr", "final clinical year (medical students)"], ["durchfallen", "to fail (an exam)"], ["hängen bleiben", "to stick (in memory)"], ["drankommen", "to come up (in an exam)"], ["übermüdet", "overtired"], ["das Rechtsgebiet", "area of law"], ["der Mandant", "client (of a lawyer)"], ["die Notlösung", "stopgap solution"], ["der Fleiß", "diligence"], ["die Grundzüge", "basic outlines"], ["der Repetitor", "exam crammer / tutor"], ["die Probeklausur", "practice exam"], ["der Sachverhalt", "facts of the case"], ["die Erblasserin", "testator (f.)"], ["zu hoffen wagen", "to dare to hope"]], "q": [["Warum ist Yannick verzweifelt?", "Er hat erst die Hälfte des Stoffs wiederholt.", "In neun Tagen ist das Examen."], ["Was bedeutet „Mut zur Lücke“?", "Bewusst entscheiden, was man weglässt.", "Statt aus Panik alles halb zu machen."], ["Was steckt laut Matilda hinter Yannicks Verhalten?", "Perfektionismus.", "„Angst mit einem guten Anzug“."], ["Wie teilt Yannick die Themen ein?", "In sicher können, Grundzüge kennen und Lücke.", "Für Lückenthemen nur eine Stunde."], ["Was passiert in der Prüfung?", "Ausgerechnet Erbrecht kommt dran.", "Er argumentiert sauber mit dem Gesetz und besteht."]], "say": ["Darf ich dir etwas sagen, was du nicht hören willst?", "Das kann ich nicht machen!", "Ich habe Angst.", "Ist das verrückt?", "Verrückt wäre, es nicht zu tun."]}, {"id": 91, "title": "Der Stromanbieterwechsel", "level": "C1", "topic": "Verbraucher & Energie", "rt": "ca. 7 Min.", "teaser": "Der Abschlag soll von 89 auf 146 Euro steigen. Gunnar ist seit 31 Jahren beim selben Stadtwerk. Seine Enkelin Doris will ihn zum Wechsel überreden – und lernt dabei selbst etwas über Bonusfallen.", "body": ["Gunnar Brodersen hält den Brief schon zum dritten Mal unter die Leselampe. „Preisanpassung zum 1. des übernächsten Monats“, steht da. Und weiter unten: „Ihr neuer monatlicher Abschlag: 146,00 Euro.“ Bisher waren es 89.", "„Siebenundfünfzig Euro mehr“, sagt er zu seiner Enkelin Doris, die zum Sonntagskaffee in seine Wohnung in Kiel gekommen ist. „Im Monat. Das sind fast siebenhundert im Jahr. Von meiner Rente.“", "Doris, sechsundzwanzig, Betriebswirtin, nimmt ihm den Brief aus der Hand. „Opa, wie lange bist du schon bei diesem Anbieter?“", "„Seit 1993. Seit wir hier eingezogen sind. Die Stadtwerke. Da kenne ich noch den Herrn am Schalter.“", "„Der Herr am Schalter ist vermutlich längst in Rente. Und du bist wahrscheinlich in der Grundversorgung. Das ist oft der teuerste Tarif.“", "„Grundversorgung? Ich habe nie etwas anderes gehabt.“", "„Genau das meine ich. Wenn man nie wechselt, landet man automatisch dort. Darf ich mal vergleichen?“", "Gunnar zögert. „Ich weiß nicht. Am Ende habe ich keinen Strom, weil irgendein Anbieter pleitegeht. So wie letztes Jahr bei den Nachbarn.“", "„Das kann nicht passieren. Wenn ein Anbieter pleitegeht, fällst du automatisch in die Ersatzversorgung beim örtlichen Grundversorger zurück. Der Strom fließt weiter. Du sitzt nie im Dunkeln.“", "„Wirklich?“", "„Wirklich. Das ist gesetzlich geregelt.“", "Doris holt ihren Laptop heraus und öffnet ein Vergleichsportal. „Wie viel Strom verbrauchst du im Jahr? Das steht auf der letzten Jahresabrechnung.“", "Gunnar holt einen Ordner aus dem Schrank. Ordentlich beschriftet: „Strom 2015 bis heute“. „Hier. 1.840 Kilowattstunden.“", "Doris tippt die Postleitzahl und den Verbrauch ein. Nach ein paar Sekunden erscheint eine lange Liste.", "„Schau mal. Der günstigste Tarif kostet im ersten Jahr nur siebenhundertzwanzig Euro. Das wären sechzig Euro im Monat.“", "„Sechzig! Dann nehmen wir den.“", "„Moment, Opa. Ich schaue mir das genauer an.“ Sie klickt auf die Details. Dann runzelt sie die Stirn. „Hier steht ein Neukundenbonus von zweihundert Euro. Der wird mit dem Preis verrechnet. Ohne Bonus kostet der Tarif neunhundertzwanzig. Und den Bonus bekommst du erst nach zwölf Monaten, wenn du nicht vorher kündigst.“", "„Und im zweiten Jahr?“", "„Im zweiten Jahr zahlst du den vollen Preis. Und eine Preisgarantie gibt es nur für sechs Monate. Danach können sie erhöhen.“", "„Das klingt wie ein Trick.“", "„Ist es auch, ein bisschen. Ganz legal, aber man muss es durchschauen. Ich stelle den Filter um: ohne Bonus, Preisgarantie mindestens zwölf Monate, Vertragslaufzeit höchstens ein Jahr, keine Vorkasse.“", "Die Liste wird kürzer. Ganz oben steht jetzt ein regionaler Anbieter aus Schleswig-Holstein mit Ökostrom. Achthundertsechzig Euro im Jahr, ohne Bonus. Zwölf Monate Preisgarantie. Monatlich kündbar nach dem ersten Jahr.", "„Das wären etwa zweiundsiebzig Euro im Monat“, sagt Doris. „Nicht ganz so billig wie der Lockvogel, aber ehrlich gerechnet. Und gegenüber den neuen 146 sparst du über achthundert Euro im Jahr.“", "Gunnar lehnt sich zurück. „Achthundert Euro. Davon hätte ich deiner Oma jedes Jahr eine Reise nach Sylt bezahlen können.“", "Doris legt ihm kurz die Hand auf den Arm. Seine Frau ist vor drei Jahren gestorben. Er redet nicht oft über sie.", "„Und was muss ich jetzt tun? Muss ich bei den Stadtwerken anrufen und kündigen? Das ist mir unangenehm. Die waren immer nett.“", "„Musst du nicht. Der neue Anbieter kündigt den alten Vertrag für dich. Und wegen der Preiserhöhung hast du sowieso ein Sonderkündigungsrecht. Bis zum Tag, an dem der neue Preis gilt.“", "„Und der Zählerstand?“", "„Den liest du am Wechseltag ab und machst ein Foto. Mit Datum. Dann kann niemand etwas anderes behaupten.“", "Gunnar holt seine Lesebrille. „Gut. Aber ich will das selbst machen. Du sagst mir, wo ich klicken muss.“", "„Gerne.“", "Es dauert vierzig Minuten. Gunnar tippt mit zwei Fingern seinen Namen, seine Adresse, seine Zählernummer, seine IBAN. Bei der Frage nach dem Lieferbeginn fragt er dreimal nach. Am Ende klickt er auf „Zahlungspflichtig bestellen“ und hält kurz die Luft an.", "„Fertig?“", "„Fertig. In ein paar Tagen bekommst du eine Bestätigung. Und dann einen Brief von den Stadtwerken, dass der Vertrag endet.“", "Am Abend, als Doris schon im Zug nach Hamburg sitzt, bekommt sie eine Nachricht von ihrem Großvater. Er schreibt selten Nachrichten. Diese ist länger als sonst.", "„Liebe Doris, danke für heute. Ich habe gerade nachgeschaut: Beim Gas bin ich auch in der Grundversorgung. Seit 1993. Nächsten Sonntag gibt es Kuchen. Bring deinen Laptop mit. Dein Opa.“", "Doris lacht laut im Zug. Dann schaut sie in ihre eigene Banking-App. Ihr Handyvertrag läuft seit vier Jahren. Ohne Vergleich. Sie seufzt und öffnet ein neues Fenster."], "gl": [["der Stromanbieter", "electricity supplier"], ["die Preisanpassung", "price adjustment"], ["der Abschlag", "monthly instalment / advance payment"], ["die Betriebswirtin", "business economist (f.)"], ["die Grundversorgung", "default (basic) supply tariff"], ["pleitegehen", "to go bust"], ["die Ersatzversorgung", "substitute supply"], ["das Vergleichsportal", "comparison website"], ["die Kilowattstunde", "kilowatt hour"], ["der Neukundenbonus", "new customer bonus"], ["verrechnen", "to offset"], ["die Preisgarantie", "price guarantee"], ["durchschauen", "to see through"], ["die Vorkasse", "payment in advance"], ["der Ökostrom", "green electricity"], ["der Lockvogel", "bait / loss leader"], ["das Sonderkündigungsrecht", "special right of termination"], ["der Zählerstand", "meter reading"], ["ablesen", "to read (a meter)"], ["zahlungspflichtig bestellen", "to order with obligation to pay"]], "q": [["Warum ist Gunnar beunruhigt?", "Sein Abschlag steigt von 89 auf 146 Euro.", "Das sind fast 700 € mehr im Jahr."], ["Was ist die Grundversorgung?", "Der Standardtarif, in dem man landet, wenn man nie wechselt.", "Oft der teuerste Tarif."], ["Was passiert, wenn ein neuer Anbieter pleitegeht?", "Man fällt in die Ersatzversorgung.", "Der Strom fließt weiter."], ["Warum ist der billigste Tarif eine Falle?", "Der Preis enthält einen Bonus für das erste Jahr.", "Im zweiten Jahr wird es deutlich teurer."], ["Was muss Gunnar beim Wechsel selbst tun?", "Den Zählerstand am Wechseltag ablesen und fotografieren.", "Kündigen übernimmt der neue Anbieter."]], "say": ["Darf ich mal vergleichen?", "Das klingt wie ein Trick.", "Ich will das selbst machen.", "Du sagst mir, wo ich klicken muss.", "Bring deinen Laptop mit."]}, {"id": 92, "title": "Ehrenamt bei der Tafel", "level": "C1", "topic": "Gesellschaft & Würde", "rt": "ca. 7 Min.", "teaser": "Ahmad wartet auf die Anerkennung seines Ingenieurdiploms und hilft solange bei der Tafel. Am dritten Samstag steht eine Kundin vor ihm, die lieber unsichtbar wäre.", "body": ["Samstag, 8:30 Uhr, ein ehemaliges Gemeindehaus in Pforzheim. Auf langen Tischen stehen Kisten mit Joghurt kurz vor dem Ablaufdatum, Brot vom Vortag, Paprika mit kleinen Druckstellen. Ahmad Nouri bindet sich eine grüne Schürze um. Es ist sein dritter Samstag als Ehrenamtlicher bei der Tafel.", "In Syrien war er Bauingenieur, zwölf Jahre lang. In Deutschland wartet er seit acht Monaten auf die Anerkennung seines Diploms. „Ich kann nicht nur zu Hause sitzen und Formulare anstarren“, hat er bei seiner Anmeldung gesagt.", "Renate Ebert, die Leiterin der Ausgabestelle, eine pensionierte Grundschulrektorin mit kurzen grauen Haaren, klatscht in die Hände.", "„Leute, kurze Einweisung für die Neuen. Wir öffnen um neun. Die Kundinnen und Kunden ziehen eine Nummer und zeigen ihren Berechtigungsausweis. Wir fragen nicht, warum jemand hier ist. Wir kommentieren nicht, was jemand nimmt oder nicht nimmt. Und wir sagen nie: ‚Sie können froh sein, dass Sie überhaupt etwas bekommen.‘ Verstanden?“", "„Verstanden“, sagt Ahmad.", "„Ahmad, du machst heute Obst und Gemüse. Pro Haushalt zwei Teile Obst, drei Teile Gemüse. Bei Familien mit Kindern etwas mehr. Wenn am Ende noch etwas übrig ist, gibt es eine zweite Runde.“", "Um neun öffnet sich die Tür. Die Schlange reicht bis auf den Parkplatz. Eine junge Mutter mit Zwillingen im Kinderwagen. Ein Student mit Rucksack. Ein älterer Herr im Anzug, der jeden Samstag kommt und sich bei jedem bedankt. Ahmad füllt Tüten, lächelt, wünscht ein schönes Wochenende.", "Gegen halb elf steht eine Frau vor ihm, etwa sechzig, mit einem eleganten Wollmantel, der an den Ärmeln abgewetzt ist. Sie schaut nicht auf das Gemüse, sondern auf den Boden.", "„Guten Morgen“, sagt Ahmad. „Was darf es sein? Wir haben heute schöne Äpfel. Und Lauch.“", "Die Frau hebt den Kopf. Dann wird sie blass.", "„Herr Nouri?“", "Ahmad erkennt sie im selben Moment. Frau Ziemer. Sie war seine Lehrerin im Integrationskurs, vor fünf Jahren. Sie hat ihm den Unterschied zwischen ‚seit‘ und ‚seid‘ beigebracht und ihm bei seiner ersten Bewerbung geholfen.", "„Frau Ziemer. Guten Morgen.“", "„Das ist mir jetzt sehr unangenehm“, flüstert sie. „Ich … ich gehe besser.“", "„Bitte nicht“, sagt Ahmad leise. „Bitte. Sie haben eine Nummer gezogen wie alle anderen. Das hier ist Ihr Platz in der Schlange.“", "Sie zögert. Hinter ihr wartet ein Mann mit einem Kleinkind. Sie nimmt zwei Äpfel und einen Lauch, schnell, ohne ihn anzusehen, und geht weiter zur Brottheke.", "In der Mittagspause sitzt Ahmad auf einer Bierbank hinter dem Haus. Renate setzt sich neben ihn und gibt ihm einen Kaffee.", "„Ich habe gesehen, dass du jemanden kennst.“", "„Meine alte Deutschlehrerin. Sie hat mir so viel geholfen. Und jetzt …“ Er schüttelt den Kopf. „Ich verstehe nicht, wie das passieren kann. Eine Lehrerin.“", "„Weißt du, wie viele Lehrkräfte in Integrationskursen jahrelang auf Honorarbasis gearbeitet haben? Ohne feste Stelle, ohne richtige Rentenansprüche?“, sagt Renate. „Dann kommt eine Krankheit, oder eine Scheidung, oder die Miete steigt. Und plötzlich reicht die Rente nicht. Die Hälfte unserer Kundschaft hat ein ganzes Leben gearbeitet.“", "„Sie hat sich geschämt. Vor mir.“", "„Natürlich. Scham ist das Schwerste hier. Nicht der Hunger. Viele, die einen Anspruch hätten, kommen nie. Weil sie Angst haben, dass jemand sie sieht.“", "„Was soll ich tun? Soll ich so tun, als würde ich sie nicht kennen?“", "Renate denkt nach. „Das entscheidest nicht du. Das entscheidet sie. Wenn sie Abstand will, gib ihr Abstand. Wenn sie reden will, sei da. Und behandle sie genauso wie jeden anderen. Nicht besser und nicht schlechter. Das ist Würde.“", "Am nächsten Samstag steht Frau Ziemer wieder in der Schlange. Ahmad sieht sie von Weitem und sagt nichts. Als sie an der Reihe ist, sagt er nur: „Guten Morgen. Heute gibt es Birnen.“", "„Danke“, sagt sie. Dann, nach einer kleinen Pause: „Herr Nouri, haben Sie nach der Ausgabe einen Moment Zeit?“", "Nach Feierabend gehen sie ein Stück zusammen Richtung Bahnhof.", "„Ich wollte mich entschuldigen“, sagt Frau Ziemer. „Letzte Woche bin ich einfach weggelaufen. Das war unhöflich.“", "„Das war nicht unhöflich. Das war menschlich.“", "„Wissen Sie, das Schlimmste war nicht, dass Sie mich gesehen haben. Das Schlimmste war, dass ich gedacht habe: Jetzt bin ich nicht mehr die Lehrerin. Jetzt bin ich nur noch die Frau von der Tafel.“", "Ahmad bleibt stehen. „Frau Ziemer, Sie haben mir beigebracht, dass man im Deutschen sagt: Ich bin Ingenieur. Nicht: Ich war Ingenieur. Weil man den Beruf im Kopf behält, auch wenn man gerade nicht arbeitet. Ich habe das jeden Tag gesagt, acht Monate lang, während ich Formulare ausgefüllt habe. Sie sind Lehrerin.“", "Sie sieht ihn lange an. Dann lacht sie, ein bisschen zittrig. „Das habe ich wirklich gesagt?“", "„Wörtlich. In der dritten Woche. Mit Kreide an der Tafel.“", "Zwei Monate später hängt im Gemeindehaus ein neuer Zettel am Schwarzen Brett: „Deutsch-Sprechstunde nach der Ausgabe. Für alle, die Briefe von Ämtern nicht verstehen. Kostenlos. Leitung: Frau Ziemer, Lehrerin.“", "Ahmad bringt jeden Samstag Kaffee vorbei. Und an einem Dienstag im Frühling kommt endlich der Brief, auf den er so lange gewartet hat: Anerkennung erteilt. Er liest ihn zuerst Frau Ziemer vor. Sie korrigiert ihm nur ein einziges Wort."], "gl": [["das Ehrenamt / ehrenamtlich", "voluntary work / voluntary"], ["die Tafel", "food bank"], ["das Ablaufdatum", "expiry date"], ["die Druckstelle", "bruise (on fruit)"], ["die Anerkennung", "recognition (of qualifications)"], ["die Ausgabestelle", "distribution point"], ["die Einweisung", "briefing / induction"], ["der Berechtigungsausweis", "eligibility card"], ["abgewetzt", "worn / threadbare"], ["der Integrationskurs", "integration course"], ["unangenehm", "embarrassing"], ["auf Honorarbasis", "freelance / on a fee basis"], ["der Rentenanspruch", "pension entitlement"], ["sich schämen / die Scham", "to be ashamed / shame"], ["der Anspruch", "entitlement"], ["der Abstand", "distance"], ["die Würde", "dignity"], ["an der Reihe sein", "to be one's turn"], ["zittrig", "shaky"], ["erteilen", "to grant"]], "q": [["Warum engagiert sich Ahmad bei der Tafel?", "Er wartet auf die Anerkennung seines Diploms.", "Er will nicht nur Formulare anstarren."], ["Welche Regeln nennt Renate?", "Nicht fragen, warum jemand kommt, und nichts kommentieren.", "Respekt vor allen Kundinnen und Kunden."], ["Warum ist die Begegnung für Frau Ziemer schwer?", "Sie schämt sich vor ihrem ehemaligen Schüler.", "Sie fühlt sich nicht mehr als Lehrerin."], ["Was bedeutet Würde laut Renate?", "Jeden gleich behandeln, nicht besser, nicht schlechter.", "Und die Person entscheiden lassen, wie viel Nähe sie will."], ["Wie verändert sich Frau Ziemers Rolle?", "Sie bietet eine Deutsch-Sprechstunde an.", "Sie ist wieder als Lehrerin aktiv."]], "say": ["Das hier ist Ihr Platz in der Schlange.", "Das entscheidest nicht du, das entscheidet sie.", "Das war nicht unhöflich, das war menschlich.", "Haben Sie einen Moment Zeit?", "Nicht besser und nicht schlechter."]}, {"id": 93, "title": "Die Bank und der Kredit", "level": "C1", "topic": "Finanzen & Selbstständigkeit", "rt": "ca. 7 Min.", "teaser": "Cem will einen Foodtruck mit anatolischer Küche eröffnen. Die Bankberaterin will einen Businessplan, Sicherheiten und eine ehrliche Antwort auf die Frage: Was, wenn es schiefgeht?", "body": ["Cem Akbulut hat einen Ordner unter dem Arm, so dick wie ein Telefonbuch. Darin: drei Kostenvoranschläge für einen umgebauten Lieferwagen, ein Hygienekonzept, eine Liste mit Standorten in Karlsruhe und vierzig Fotos von Gerichten, die seine Großmutter in Gaziantep gekocht hat. Er ist einunddreißig, gelernter Koch, und arbeitet seit neun Jahren in Hotelküchen. Heute will er zweiundsiebzigtausend Euro.", "Die Filiale der Sparkasse riecht nach neuem Teppich. Die Firmenkundenberaterin, Frau Wehrle, Mitte vierzig, mit Lesebrille an einer Kette, führt ihn in ein gläsernes Besprechungszimmer.", "„Herr Akbulut, schön, dass Sie da sind. Ich habe Ihre Unterlagen vorab gelesen. Erzählen Sie mir trotzdem in zwei Minuten, was Sie vorhaben. So, als würden Sie es einem Gast am Truck erklären.“", "Cem atmet durch. „Anatolisches Streetfood. Keine Dönerbude. Lahmacun aus dem Steinofen, Linsensuppe, Gerichte aus der Region meiner Großmutter. Mittags an Gewerbegebieten, abends auf Märkten und Festivals. Alles frisch, kleine Karte, schneller Service.“", "„Gut. Das war klar. Und jetzt die unangenehme Frage: Warum sollte das funktionieren?“", "„Weil ich das Essen seit Jahren für Freunde und Kollegen koche. Weil ich bei drei Streetfood-Festivals als Aushilfe gearbeitet habe und weiß, was sich verkauft. Und weil es in Karlsruhe nichts Vergleichbares gibt. Ich habe nachgeschaut.“", "Frau Wehrle blättert zur Umsatzplanung. „Sie rechnen im ersten Jahr mit hundertvierzigtausend Euro Umsatz. Das sind etwa vierhundert Portionen pro Woche. Wie kommen Sie auf diese Zahl?“", "„Ich habe mit einem anderen Truckbetreiber gesprochen, der Burger verkauft. Er macht an guten Tagen hundertfünfzig Portionen. Ich habe vorsichtiger gerechnet.“", "„Vorsichtiger ist gut. Ich würde Ihnen trotzdem raten, ein drittes Szenario einzubauen: das schlechte. Was passiert, wenn Sie im ersten Winter nur die Hälfte verkaufen? Reicht dann das Geld, um die Raten zu bezahlen?“", "Cem zögert. „Darüber habe ich ehrlich gesagt nicht genau nachgedacht. Ich dachte, die Bank will sehen, dass ich optimistisch bin.“", "Frau Wehrle lächelt. „Die Bank will sehen, dass Sie realistisch sind. Optimisten haben wir viele. Wer einen Plan für den schlechten Fall hat, bekommt bei mir eher einen Kredit als jemand mit einer schönen Kurve, die nur nach oben geht.“", "„Verstanden.“", "„Zweiter Punkt: Eigenkapital. Wie viel bringen Sie selbst mit?“", "„Achtzehntausend Euro. Erspart in sechs Jahren.“", "„Das ist ein guter Anteil, ungefähr zwanzig Prozent. Damit zeigen Sie, dass Sie selbst ein Risiko tragen. Und Sicherheiten? Eine Immobilie, eine Bürgschaft?“", "„Keine Immobilie. Mein Onkel hat angeboten, zu bürgen.“", "Frau Wehrle legt den Stift hin. „Herr Akbulut, darf ich Ihnen etwas sagen, das nicht im Formular steht? Überlegen Sie sich das mit der Bürgschaft gut. Wenn der Truck scheitert, haftet Ihr Onkel mit seinem eigenen Vermögen. Ich habe erlebt, wie Familien daran zerbrochen sind. Es gibt eine Alternative.“", "„Welche?“", "„Förderkredite für Gründer, zum Beispiel über die Förderbank des Landes. Wir beantragen das für Sie als Hausbank. Die Bürgschaftsbank kann einen Teil des Risikos übernehmen. Die Zinsen sind niedriger, und am Anfang gibt es oft tilgungsfreie Jahre. Dann zahlen Sie im ersten Jahr nur Zinsen, keine Raten. Das hilft genau in dem Winter, über den wir gerade gesprochen haben.“", "Cem richtet sich auf. „Und mein Onkel müsste nicht bürgen?“", "„Im besten Fall nicht. Aber dafür brauchen wir eine Stellungnahme von einer fachkundigen Stelle zu Ihrem Businessplan. Die IHK oder ein Gründungsberater. Und Ihre Schufa-Auskunft.“", "„Die habe ich mitgebracht.“ Er zieht ein Blatt aus dem Ordner. „Sauber. Ich habe nicht mal einen Handyvertrag mit Ratenzahlung.“", "„Sehr gut. Dann noch etwas: Haben Sie schon mit dem Ordnungsamt wegen der Standorte gesprochen? Für öffentliche Plätze brauchen Sie eine Sondernutzungserlaubnis. Und eine Reisegewerbekarte, wenn Sie den Standort wechseln.“", "Cem macht sich Notizen. Seine Hand schreibt schneller als sonst.", "„Was ich heute mitnehme“, sagt er schließlich, „ist: Ein Plan für den schlechten Fall, Förderkredit statt Bürgschaft, Stellungnahme von der IHK, Genehmigungen klären. Habe ich etwas vergessen?“", "„Nur eins.“ Frau Wehrle nimmt ein Foto aus dem Ordner. Es zeigt eine alte Frau in einer kleinen Küche, die Teig ausrollt. „Wer ist das?“", "„Meine Großmutter. Sie hat mir alles beigebracht. Sie ist letztes Jahr gestorben.“", "„Das Foto gehört auf den Truck. Nicht in den Ordner. Die Leute kaufen nicht nur Essen, sie kaufen eine Geschichte.“", "Sechs Wochen später sitzt Cem wieder im gläsernen Zimmer. Diesmal mit einem dünneren Ordner. Drei Szenarien, Stellungnahme der IHK, Zusage der Förderbank mit Haftungsfreistellung. Frau Wehrle schiebt ihm den Kreditvertrag hin.", "„Lesen Sie ihn in Ruhe durch. Zu Hause. Sie haben vierzehn Tage Bedenkzeit.“", "„Ich habe schon lange genug nachgedacht.“", "„Dann lesen Sie ihn trotzdem. Ein guter Unternehmer unterschreibt nichts, was er nicht gelesen hat.“", "Im Mai steht der Truck zum ersten Mal vor einem Gewerbepark im Karlsruher Osten. Auf der Seite, groß und in Farbe: das Foto einer alten Frau mit Teig an den Händen. Darunter der Name des Trucks: „Nenes Küche“. Am ersten Tag verkauft Cem achtundneunzig Portionen. Eine davon an eine Frau mit Lesebrille an einer Kette, die in der Mittagspause extra vorbeigekommen ist."], "gl": [["der Kredit", "loan"], ["der Kostenvoranschlag", "cost estimate"], ["die Firmenkundenberaterin", "business customer adviser (f.)"], ["vorab", "in advance"], ["das Gewerbegebiet", "industrial estate"], ["der Umsatz", "turnover"], ["das Szenario", "scenario"], ["die Rate", "instalment"], ["das Eigenkapital", "equity / own funds"], ["die Sicherheit", "collateral"], ["die Bürgschaft / bürgen", "guarantee / to act as guarantor"], ["haften", "to be liable"], ["der Förderkredit", "subsidised loan"], ["die Hausbank", "main bank"], ["tilgungsfrei", "repayment-free"], ["die Stellungnahme", "expert statement / opinion"], ["die Schufa-Auskunft", "credit report"], ["die Sondernutzungserlaubnis", "special use permit"], ["die Haftungsfreistellung", "release from liability"], ["die Bedenkzeit", "time to think it over"]], "q": [["Was will die Beraterin zuerst hören?", "Die Idee kurz und klar in zwei Minuten.", "So wie für einen Gast am Truck."], ["Warum soll Cem ein schlechtes Szenario einbauen?", "Die Bank will Realismus, nicht nur Optimismus.", "Reicht das Geld auch in einem schwachen Winter?"], ["Warum rät Frau Wehrle von der Bürgschaft des Onkels ab?", "Der Onkel würde mit seinem Vermögen haften.", "Das kann Familien zerstören."], ["Welche Vorteile hat ein Förderkredit?", "Niedrigere Zinsen und tilgungsfreie Anfangszeit.", "Teile des Risikos kann die Bürgschaftsbank übernehmen."], ["Welchen letzten Rat gibt sie?", "Das Foto der Großmutter auf den Truck.", "Kunden kaufen eine Geschichte."]], "say": ["Ich habe Ihre Unterlagen vorab gelesen.", "Wie kommen Sie auf diese Zahl?", "Darüber habe ich nicht genau nachgedacht.", "Habe ich etwas vergessen?", "Ein guter Unternehmer unterschreibt nichts, was er nicht gelesen hat."]}, {"id": 94, "title": "Der Buchclub", "level": "C1", "topic": "Freizeit & Gesprächskultur", "rt": "ca. 7 Min.", "teaser": "Seit elf Jahren trifft sich der Buchclub jeden ersten Mittwoch bei Ingrid. Seit elf Jahren redet Harald am meisten. Dann kommt Kateryna dazu – und stellt eine Frage, die niemand stellen wollte.", "body": ["Erster Mittwoch im Monat, 19:30 Uhr, Ingrid Seebachs Wohnzimmer in Heidelberg-Neuenheim. Auf dem Couchtisch stehen Salzstangen, eine Flasche Riesling und sieben Exemplare desselben Romans, manche mit bunten Klebezetteln gespickt, manche verdächtig unberührt.", "Der Buchclub existiert seit elf Jahren. Die Besetzung ist fast immer dieselbe: Ingrid, pensionierte Bibliothekarin und Gastgeberin. Harald, emeritierter Germanistikprofessor. Gabi, Steuerberaterin, die vor allem wegen des Weins kommt, wie sie selbst sagt. Kurt und Helga, ein Ehepaar, das sich über jedes Buch uneinig ist. Und Finn, Doktorand, der jüngste.", "Heute gibt es ein neues Gesicht. Kateryna Bondar, Anfang dreißig, Übersetzerin, seit einem Jahr in Heidelberg. Ingrid hat sie in der Stadtbücherei kennengelernt.", "„Herzlich willkommen“, sagt Ingrid. „Wir sind ganz harmlos. Fast immer.“", "„Dann fangen wir an“, sagt Harald, bevor jemand anderes etwas sagen kann. „Ich habe mir ein paar Gedanken zur Erzählstruktur gemacht.“", "Die Gedanken dauern zweiundzwanzig Minuten: unzuverlässige Erzähler, Anspielungen auf Thomas Mann, ein Rezensent, der alles missverstanden habe. Kurt nickt. Helga schaut auf ihre Fingernägel. Gabi schenkt nach.", "Kateryna hört zu. Als Harald eine Pause macht, um einen Schluck Wein zu trinken, hebt sie die Hand. Wie in der Schule.", "„Darf ich etwas fragen?“", "„Natürlich“, sagt Ingrid schnell.", "„Ich bin neu, deshalb verstehe ich vielleicht etwas falsch. Aber wie funktioniert das hier? Gibt es eine Reihenfolge? Ich würde gern wissen, was die anderen über das Buch denken. Nicht nur über die Struktur, sondern ob es ihnen gefallen hat.“", "Es wird sehr still im Wohnzimmer. Harald stellt sein Glas ab.", "„Ich wollte niemanden unterbrechen“, sagt er langsam. „Wenn jemand etwas sagen möchte, kann er das jederzeit tun.“", "„Kann er?“, fragt Helga. Es ist das Erste, was sie heute sagt.", "„Helga“, murmelt Kurt.", "„Nein, Kurt. Sie hat recht. Seit elf Jahren läuft das so. Harald hält einen Vortrag, wir nicken, und am Ende reden wir zehn Minuten über das, was uns wirklich bewegt hat. Und dann ist es zehn Uhr, und alle gehen nach Hause.“", "Harald sieht sich um. Niemand widerspricht. Ingrid schaut auf ihre Hände. Finn räuspert sich.", "„Ich habe jedes Mal Notizen“, sagt er leise. „Aber ich traue mich nie. Weil Sie das alles so viel besser wissen. Sie waren der Professor meiner Professorin.“", "Harald nimmt die Brille ab und reibt sich die Augen. Einen Moment lang sieht er sehr alt aus.", "„Das war mir nicht klar“, sagt er schließlich. „Ich dachte, ich gebe euch etwas. Hintergrund, Zusammenhänge. Ich dachte, das erwartet man von mir.“", "„Das tun Sie auch“, sagt Ingrid sanft. „Aber vielleicht nicht zweiundzwanzig Minuten lang.“", "Kateryna fühlt sich schuldig. „Es tut mir leid. Ich wollte keinen Streit anfangen. In meinem Buchclub in Kiew war es so: Jede Person sagt am Anfang drei Minuten, was das Buch mit ihr gemacht hat. Nur das Gefühl, keine Analyse. Und erst danach diskutieren wir. Dann hat jeder schon gesprochen, und niemand fühlt sich klein.“", "Gabi stellt ihr Glas ab. „Drei Minuten? Das schaffe ich sogar ohne das Buch gelesen zu haben.“", "Alle lachen, auch Harald.", "„Gut“, sagt er. „Probieren wir es. Aber ich fange nicht an. Ich will einmal als Letzter reden.“", "Ingrid holt eine kleine Sanduhr aus der Küche, die sie sonst zum Eierkochen benutzt. Drei Minuten.", "„Finn, fang du an“, sagt Ingrid.", "„Okay. Mich hat das Buch an meinen Opa erinnert. Er hat nie über den Krieg gesprochen. Beim Lesen habe ich zum ersten Mal verstanden, warum.“", "„Ich habe es gehasst“, sagt Helga. „Die Hauptfigur wartet das ganze Buch lang. Auf einen Mann, auf einen Brief, auf das Leben.“", "„Und genau deshalb habe ich es geliebt“, sagt Kurt. „Warten ist auch eine Form von Stärke.“", "„Kurt, das sagst du nur, weil du immer auf mich wartest.“", "„Vierzig Jahre schon“, sagt Kurt, und zum ersten Mal seit Jahren streiten die beiden mit Vergnügen.", "„Ich gebe zu: Ich habe nur die Hälfte gelesen und das Ende gegoogelt“, sagt Gabi. „Aber die erste Hälfte war gut.“", "„Ich kenne die ukrainische Übersetzung“, sagt Kateryna. „Manche Sätze klingen dort viel härter. Ich habe mich gefragt, welche Version die ehrlichere ist.“", "Dann ist Harald dran. Er dreht die Sanduhr um.", "„Ich habe das Buch zweimal gelesen. Beim ersten Mal habe ich nach Strukturen gesucht. Beim zweiten Mal habe ich geweint, auf Seite zweihundertvierzehn. Ich habe euch das nicht erzählt, weil ein Germanist nicht weint. Das war dumm von mir.“", "Niemand sagt etwas. Dann legt Ingrid ihm die Hand auf den Arm.", "Um 22:40 Uhr, eine Dreiviertelstunde später als sonst, stehen alle im Flur und ziehen ihre Jacken an.", "„Wer wählt das nächste Buch?“, fragt Finn.", "„Neue Regel“, sagt Harald. „Wir wechseln. Jedes Mal jemand anderes. Und diesmal Kateryna. Etwas, das wir nicht kennen.“", "Kateryna lächelt. „Dann eine ukrainische Autorin. Auf Deutsch übersetzt. Und Sie, Herr Professor, dürfen beim nächsten Mal etwas zur Übersetzung sagen. Drei Minuten.“", "„Fünf“, sagt Harald.", "„Vier“, sagt Ingrid. „Und ich halte die Sanduhr.“"], "gl": [["der Buchclub", "book club"], ["das Exemplar", "copy"], ["gespickt mit", "studded with / full of"], ["die Besetzung", "line-up / cast"], ["emeritiert", "emeritus (retired professor)"], ["die Germanistik", "German studies"], ["harmlos", "harmless"], ["der unzuverlässige Erzähler", "unreliable narrator"], ["die Anspielung", "allusion"], ["der Rezensent", "reviewer"], ["nachschenken", "to top up (a drink)"], ["die Reihenfolge", "order / sequence"], ["bewegen (emotional)", "to move / touch"], ["sich trauen", "to dare"], ["die Zusammenhänge", "context / connections"], ["sich schuldig fühlen", "to feel guilty"], ["die Sanduhr", "hourglass / egg timer"], ["mit Vergnügen", "with pleasure"], ["zugeben", "to admit"], ["widersprechen", "to contradict"]], "q": [["Was ist das Problem im Buchclub?", "Harald redet sehr lange, die anderen kommen kaum zu Wort.", "Seit elf Jahren läuft es so."], ["Welche Frage stellt Kateryna?", "Ob es eine Reihenfolge gibt und was die anderen denken.", "Sie fragt nach Gefühlen, nicht nur nach Struktur."], ["Warum sagt Finn sonst nichts?", "Er traut sich nicht neben Harald.", "Harald war der Professor seiner Professorin."], ["Welche Methode bringt Kateryna aus Kiew mit?", "Jeder spricht zuerst drei Minuten über sein Gefühl.", "Erst danach wird analysiert."], ["Was gesteht Harald?", "Er hat beim zweiten Lesen geweint.", "Er dachte, ein Germanist dürfe das nicht zeigen."]], "say": ["Darf ich etwas fragen?", "Gibt es eine Reihenfolge?", "Ich wollte keinen Streit anfangen.", "Das war mir nicht klar.", "Ich will einmal als Letzter reden."]}, {"id": 95, "title": "Das Jobangebot aus München", "level": "C1", "topic": "Karriere & Familie", "rt": "ca. 7 Min.", "teaser": "Dreißig Prozent mehr Gehalt, ein Titel, ein Dienstwagen. Sascha will sofort zusagen. Merve rechnet nach: Miete, Kita, Schule, Schwiegermutter. Eine Familie, eine Tabelle und ein Wochenende in München.", "body": ["Die Mail kommt an einem Dienstagnachmittag. Betreff: „Unser Angebot“. Sascha Reuter, Leiter Einkauf bei einem Maschinenbauer in Heilbronn, liest sie dreimal. Ein Automobilzulieferer in München bietet ihm die Position des Head of Procurement an. Dreißig Prozent mehr Gehalt. Dienstwagen. Ein Team von vierzig Leuten statt zwölf. Start in drei Monaten.", "Am Abend, als die Kinder schlafen, legt er Merve den Ausdruck auf den Küchentisch.", "„Lies das mal.“", "Merve liest. Sie ist Physiotherapeutin, hat seit vier Jahren eine eigene Praxis mit zwei Angestellten in der Heilbronner Innenstadt. Ihr Gesicht verändert sich langsam.", "„Wow. Gratuliere. Das ist großartig.“ Eine Pause. „Und?“", "„Und ich will zusagen. Merve, so ein Angebot kommt nicht zweimal. Ich bin dreiundvierzig. Wenn nicht jetzt, wann dann?“", "„Und ich? Und meine Praxis? Und Henri und Fenja?“", "„Die Kinder sind sieben und vier. In dem Alter gewöhnen sich Kinder schnell um. Und Physiotherapeuten werden in München überall gesucht. Du findest sofort etwas.“", "„Etwas finden. Als Angestellte. Nachdem ich vier Jahre lang eine eigene Praxis aufgebaut habe.“", "Sascha merkt, dass er etwas Falsches gesagt hat. „So meinte ich das nicht.“", "„Ich weiß, wie du es meintest. Du meintest: Dein Angebot ist die Hauptsache, und der Rest wird sich schon fügen.“", "Sie schweigen. Der Kühlschrank brummt. Dann steht Merve auf, holt ihren Laptop und öffnet eine leere Tabelle.", "„Okay. Lass uns das nicht mit Gefühlen entscheiden. Nicht nur. Lass uns rechnen.“", "Sie machen zwei Spalten: Heilbronn und München. Und dann Zeilen. Gehalt. Miete. Kita. Schule. Pendelzeit. Familie. Freunde. Merves Einkommen.", "„Gehalt“, sagt Sascha. „Plus dreißig Prozent. Brutto ungefähr fünfunddreißigtausend mehr im Jahr.“", "„Netto?“", "Er rechnet. „Vielleicht achtzehntausend.“", "„Miete. Wir zahlen hier für hundertzehn Quadratmeter mit Garten tausendvierhundert warm. In München?“", "Sascha öffnet ein Immobilienportal. Er scrollt. Er scrollt weiter. „Vergleichbares im Stadtgebiet … zweitausendneunhundert. Mindestens. Im Umland, mit einer Stunde S-Bahn, vielleicht zweitausenddreihundert.“", "„Das sind im Umland neunhundert Euro mehr im Monat. Zehntausendachthundert im Jahr. Bleiben von deinen achtzehntausend noch etwa siebentausend. Minus mein Einkommen, wenn ich als Angestellte weniger verdiene als jetzt mit der Praxis.“", "„Dann bleibt fast nichts übrig“, sagt Sascha leise.", "„Und in die Tabelle passt noch etwas nicht“, sagt Merve. „Deine Mutter.“", "Saschas Mutter wohnt drei Straßen weiter. Sie holt Fenja zweimal pro Woche aus der Kita ab, kocht donnerstags für alle und hat seit ihrer Knieoperation im Frühjahr selbst öfter Hilfe gebraucht.", "„Sie würde es nie sagen“, sagt Merve. „Aber sie würde uns fehlen. Und wir ihr.“", "Sascha lehnt sich zurück und schaut an die Decke. „Und trotzdem. Ich habe das Gefühl, ich bleibe stehen, wenn ich hierbleibe. Ich mache seit acht Jahren denselben Job.“", "Merve schließt den Laptop halb. „Das ist der eigentliche Punkt, oder? Nicht das Geld.“", "„Ja. Es ist nicht das Geld. Es ist, dass mich jemand will. Für etwas Größeres.“", "„Dann reden wir darüber. Nicht über München.“", "Am Samstag fahren sie trotzdem nach München. Mit den Kindern, ohne Entscheidung. Sie schauen sich zwei Wohnungen in Freising an, essen im Englischen Garten, und Henri fragt im Auto auf dem Rückweg: „Wohnen wir dann ganz weit weg von Oma?“", "Am Montag ruft Sascha den Personalchef des Zulieferers an.", "„Herr Reuter, schön, dass Sie sich melden. Haben Sie sich entschieden?“", "„Fast. Ich habe eine Frage. Wäre es möglich, die Stelle mit zwei Tagen mobilem Arbeiten pro Woche zu besetzen? Und einem späteren Start, damit meine Frau ihre Praxis nicht überstürzt aufgeben muss?“", "Eine Pause. „Zwei Tage mobil ist bei uns für Führungskräfte nicht vorgesehen. Einen Monat später starten – darüber könnten wir reden.“", "„Dann bedanke ich mich sehr für das Angebot und das Vertrauen. Aber ich werde es nicht annehmen.“", "Als er auflegt, sitzt Merve neben ihm. Sie sagt nichts, sie nimmt nur seine Hand.", "„Bereust du es?“, fragt sie nach einer Weile.", "„Ein bisschen. Und gleichzeitig bin ich erleichtert. Das ist komisch.“", "„Das ist nicht komisch. Das ist eine echte Entscheidung. Bei echten Entscheidungen verliert man immer etwas.“", "Am nächsten Tag geht Sascha zu seinem Geschäftsführer. Er erzählt ihm offen von dem Angebot und warum er abgelehnt hat. Nicht um zu verhandeln, sondern, wie er sagt, „damit Sie wissen, dass ich mehr Verantwortung will“.", "Drei Monate später übernimmt er zusätzlich den Aufbau eines neuen Standorts in Polen. Mehr Arbeit, mehr Reisen, ein bisschen mehr Gehalt. Und jeden Donnerstag, wenn er nicht in Polen ist, isst er bei seiner Mutter zu Abend."], "gl": [["das Jobangebot", "job offer"], ["der Automobilzulieferer", "car parts supplier"], ["der Dienstwagen", "company car"], ["zusagen / ablehnen", "to accept / to decline"], ["sich umgewöhnen", "to readjust"], ["sich fügen", "to fall into place"], ["die Spalte / die Zeile", "column / row"], ["brutto / netto", "gross / net"], ["das Immobilienportal", "property website"], ["das Umland", "surrounding area"], ["warm (Miete)", "including heating costs"], ["jemandem fehlen", "to be missed by someone"], ["stehen bleiben (fig.)", "to stagnate"], ["mobiles Arbeiten", "remote / mobile working"], ["überstürzt", "rushed"], ["vorgesehen sein", "to be planned / intended"], ["bereuen", "to regret"], ["erleichtert", "relieved"], ["die Verantwortung", "responsibility"], ["der Standort", "location / site"]], "q": [["Was bietet die Firma in München?", "Mehr Gehalt, Dienstwagen, größeres Team.", "Dreißig Prozent mehr Gehalt."], ["Was verletzt Merve?", "Sascha nimmt ihre Praxis nicht ernst.", "„Du findest sofort etwas“ klingt abwertend."], ["Was zeigt die Rechnung?", "Nach höherer Miete bleibt kaum mehr Geld.", "Und Merves Einkommen könnte sinken."], ["Worum geht es Sascha eigentlich?", "Er will mehr Verantwortung und Anerkennung.", "Nicht um das Geld."], ["Was macht Sascha nach der Absage?", "Er sagt seinem Chef offen, dass er mehr Verantwortung will.", "Nicht um zu verhandeln."]], "say": ["Lass uns das nicht nur mit Gefühlen entscheiden.", "So meinte ich das nicht.", "Dann reden wir darüber.", "Wäre es möglich, …?", "Bei echten Entscheidungen verliert man immer etwas."]}, {"id": 96, "title": "Die Kündigung", "level": "C1", "topic": "Arbeitswelt & Abschied", "rt": "ca. 7 Min.", "teaser": "Nach zwölf Jahren kündigt Petra Holzapfel. Der Brief ist geschrieben, die neue Stelle unterschrieben. Was fehlt, ist der Mut, ihrem Chef in die Augen zu sehen – und die Antwort auf seine Frage: Warum?", "body": ["Der Brief liegt seit Freitag in Petras Schreibtischschublade. Eine Seite, drei Sätze. „Hiermit kündige ich mein Arbeitsverhältnis fristgerecht zum 31. März. Ich bitte um die Ausstellung eines qualifizierten Arbeitszeugnisses. Für die gute Zusammenarbeit in den vergangenen zwölf Jahren bedanke ich mich herzlich.“ Darunter ihre Unterschrift, mit Kugelschreiber, nicht eingescannt. Eine Kündigung per E-Mail wäre ohnehin unwirksam, das hat sie nachgelesen.", "Petra Holzapfel ist Teamleiterin in der Personalabteilung eines Logistikunternehmens in Ludwigsburg. Vor zwei Wochen hat sie einen neuen Vertrag unterschrieben: Personalleiterin bei einer Stiftung in Stuttgart. Weniger Gehalt, mehr Sinn, wie sie ihrer Schwester erklärt hat.", "Am Montagmorgen klopft sie an die Tür von Rainer Kaltenbach, Geschäftsführer, sechzig Jahre alt, der sie vor zwölf Jahren eingestellt hat.", "„Frau Holzapfel! Kommen Sie rein. Kaffee?“", "„Nein, danke. Herr Kaltenbach, ich muss Ihnen etwas sagen, und es fällt mir nicht leicht.“", "Er lehnt sich zurück. Sein Lächeln wird vorsichtiger. „Das klingt nicht gut.“", "Petra legt den Brief auf den Tisch. „Ich kündige. Zum 31. März. Ich habe eine neue Stelle angenommen.“", "Herr Kaltenbach liest den Brief. Langsam. Dann legt er ihn hin und schaut aus dem Fenster.", "„Zwölf Jahre“, sagt er. „Sie waren eine der Ersten, die ich selbst eingestellt habe. Damals, als wir noch achtzig Leute waren.“", "„Ich weiß. Und ich bin dankbar dafür. Sehr.“", "„Darf ich fragen, wohin?“", "„Zu einer Stiftung. Kinder- und Jugendhilfe. Als Personalleiterin.“", "„Personalleiterin.“ Er nickt. „Das hätten Sie hier auch werden können. In zwei, drei Jahren, wenn Herr Behnke in Rente geht.“", "„Das hat mir niemand gesagt.“", "Herr Kaltenbach hält inne. „Nein. Vermutlich nicht. Ich dachte, das sei klar.“", "„Es war nicht klar. Und ehrlich gesagt ist es nicht nur das.“ Petra atmet tief durch. Sie hat sich vorgenommen, ehrlich zu sein, aber nicht verletzend. „In den letzten Jahren habe ich vor allem Entlassungen begleitet. Zwei Restrukturierungen. Ich habe Gespräche mit Leuten geführt, die fünfundzwanzig Jahre hier waren. Ich kann das. Aber ich möchte die nächsten zwanzig Jahre lieber Menschen einstellen als verabschieden.“", "Herr Kaltenbach schweigt lange. Dann sagt er leise: „Das verstehe ich. Besser, als Sie denken.“", "„Ich wollte nicht, dass Sie es von jemand anderem erfahren.“", "„Danke. Das rechne ich Ihnen hoch an.“ Er räuspert sich. „Gibt es etwas, das Sie umstimmen könnte? Mehr Gehalt? Die Stelle von Herrn Behnke schon nächstes Jahr? Ich kann mit dem Beirat sprechen.“", "Petra hat mit dieser Frage gerechnet. Sie hat sie mit ihrer Schwester geübt.", "„Das ist sehr freundlich. Und vor einem Jahr hätte es mich vielleicht umgestimmt. Aber ich habe meine Entscheidung nicht wegen des Geldes getroffen. Und ich habe der Stiftung zugesagt. Ich möchte mein Wort halten.“", "„Das passt zu Ihnen“, sagt er mit einem kleinen, traurigen Lächeln. „Gut. Dann machen wir es ordentlich.“", "Sie besprechen das Praktische. Petras Kündigungsfrist beträgt drei Monate zum Monatsende, das steht in ihrem Vertrag. Sie hat noch vierzehn Tage Resturlaub.", "„Möchten Sie den Urlaub nehmen oder ausbezahlt bekommen?“", "„Nehmen, wenn es geht. Aber erst nach der Übergabe. Ich will, dass mein Team gut weiterarbeiten kann.“", "„Wen würden Sie als Nachfolge vorschlagen?“", "Petra muss nicht lange überlegen. „Frau Acar. Sie ist seit drei Jahren in meinem Team, sie ist ruhig, klug und die Leute vertrauen ihr. Sie würde sich nie selbst vorschlagen. Deshalb tue ich es.“", "Herr Kaltenbach macht sich eine Notiz. „Und das Zeugnis?“", "„Ich würde Ihnen gern einen Entwurf schreiben, wenn Sie einverstanden sind. Das ist üblich. Sie können natürlich alles ändern.“", "„Einverstanden. Aber eine Bedingung: Schreiben Sie nicht zu bescheiden. Ich kenne Sie.“", "Petra lacht zum ersten Mal an diesem Morgen.", "Am Nachmittag sagt sie es ihrem Team. Frau Acar wird blass, als sie hört, dass Petra sie vorgeschlagen hat. Ein junger Kollege, Marc, fragt sofort: „Und wer schreibt jetzt die Dienstpläne so, dass alle zufrieden sind?“", "„Ihr“, sagt Petra. „Zusammen. Ich zeige euch, wie.“", "Die drei Monate vergehen schneller als gedacht. Petra schreibt Übergabedokumente, führt Frau Acar in jedes Gespräch mit, räumt ihren Schreibtisch Stück für Stück leer. Ihr Arbeitszeugnis bekommt sie in der vorletzten Woche. Herr Kaltenbach hat ihren Entwurf kaum geändert. Nur einen Satz am Ende hat er hinzugefügt: „Wir bedauern ihr Ausscheiden außerordentlich und würden sie jederzeit wieder einstellen.“", "„Das ist die beste Formulierung, die es in einem deutschen Arbeitszeugnis gibt“, sagt Frau Acar, als Petra es ihr zeigt. „Wissen Sie das?“", "„Ich weiß. Ich habe sie zwölf Jahre lang für andere geschrieben. Ich wusste nur nicht, wie sie sich anfühlt.“", "An ihrem letzten Tag steht auf ihrem Schreibtisch ein Strauß Tulpen und eine Karte vom Team. Darunter, in Herrn Kaltenbachs steiler Handschrift: „Die Tür bleibt offen. In beide Richtungen.“"], "gl": [["die Kündigung / kündigen", "resignation / to resign"], ["fristgerecht", "with due notice"], ["das Arbeitszeugnis (qualifiziert)", "(detailed) employment reference"], ["unwirksam", "invalid"], ["die Stiftung", "foundation"], ["einstellen", "to hire"], ["innehalten", "to pause"], ["verletzend", "hurtful"], ["die Entlassung", "dismissal / redundancy"], ["die Restrukturierung", "restructuring"], ["jemandem etwas hoch anrechnen", "to appreciate sth greatly"], ["umstimmen", "to change sb's mind"], ["der Beirat", "advisory board"], ["sein Wort halten", "to keep one's word"], ["die Kündigungsfrist", "notice period"], ["der Resturlaub", "remaining holiday"], ["die Übergabe", "handover"], ["die Nachfolge", "succession / successor"], ["bescheiden", "modest"], ["das Ausscheiden", "departure (from a job)"]], "q": [["Warum kündigt Petra schriftlich auf Papier?", "Eine Kündigung per E-Mail wäre unwirksam.", "Sie braucht eine eigenhändige Unterschrift."], ["Was hat Herr Kaltenbach versäumt?", "Petra zu sagen, dass sie Personalleiterin werden könnte.", "Er dachte, das sei klar."], ["Was ist Petras eigentlicher Grund?", "Sie will nicht mehr vor allem Entlassungen begleiten.", "Sie möchte Menschen einstellen statt verabschieden."], ["Warum lehnt Petra das Gegenangebot ab?", "Sie hat der Stiftung zugesagt und will ihr Wort halten.", "Es ging nicht ums Geld."], ["Was bedeutet der letzte Satz im Zeugnis?", "Es ist die bestmögliche Bewertung.", "„Jederzeit wieder einstellen“ ist ein großes Lob."]], "say": ["Es fällt mir nicht leicht.", "Ich habe eine neue Stelle angenommen.", "Ich wollte nicht, dass Sie es von jemand anderem erfahren.", "Ich möchte mein Wort halten.", "Dann machen wir es ordentlich."]}, {"id": 97, "title": "Der Elternabend", "level": "C1", "topic": "Schule & Gemeinschaft", "rt": "ca. 7 Min.", "teaser": "Klasse 5c, erster Elternabend. Auf der Tagesordnung: Klassenfahrt, Handyregeln, Wahl der Elternvertretung. Niemand will das Amt – bis Svetlana die Hand hebt, um eigentlich etwas ganz anderes zu sagen.", "body": ["Dienstag, 19:30 Uhr, Raum 2.14 eines Gymnasiums in Esslingen. Die Stühle sind für Zehnjährige gebaut. Achtundzwanzig Erwachsene sitzen darauf mit angezogenen Knien und versuchen, würdevoll auszusehen. Vorne steht Frau Seidenfaden, Klassenlehrerin der 5c, Deutsch und Geschichte, mit einer Präsentation und einer Tüte Gummibärchen für alle.", "Svetlana Morozova sitzt in der dritten Reihe. Ihre Tochter Alina ist seit sechs Wochen auf dieser Schule. Svetlana ist zum ersten Mal bei einem deutschen Elternabend. Sie hat sich vorgenommen, zuzuhören und nichts zu sagen.", "„Guten Abend, liebe Eltern“, beginnt Frau Seidenfaden. „Wir haben heute vier Punkte. Erstens: Wie sind die Kinder angekommen? Zweitens: die Klassenfahrt im Mai. Drittens: Handys. Und viertens, das Schönste zum Schluss: die Wahl der Elternvertretung.“", "Ein leises Stöhnen geht durch den Raum.", "Punkt eins geht schnell. Die Klasse sei lebhaft, freundlich und habe sich gut gefunden. Punkt zwei dauert länger.", "„Die Klassenfahrt geht für drei Tage in eine Jugendherberge auf der Schwäbischen Alb. Kosten etwa hundertachtzig Euro pro Kind.“", "Ein Vater in der ersten Reihe hebt die Hand. „Hundertachtzig für drei Tage? Das finde ich ganz schön happig.“", "„Es gibt die Möglichkeit, über das Bildungs- und Teilhabepaket einen Zuschuss zu bekommen“, sagt Frau Seidenfaden. „Und der Förderverein der Schule hilft diskret, wenn es knapp ist. Sie können mich jederzeit vertraulich ansprechen. Kein Kind bleibt wegen Geld zu Hause.“", "Svetlana sieht, wie eine Mutter am Fenster kurz erleichtert ausatmet.", "Dann Punkt drei. Die Stimmung wird schlagartig gereizt.", "„Die Schule hat eine klare Regel: Handys bleiben während der Unterrichtszeit ausgeschaltet im Ranzen. Aber das eigentliche Problem“, sagt Frau Seidenfaden vorsichtig, „ist nicht der Unterricht. Es ist der Klassenchat. Am Wochenende gab es dort Nachrichten, über die ein Kind sehr traurig war.“", "„Mein Sohn hat noch gar kein Handy“, sagt ein Vater. „Und er ist der Einzige. Er fühlt sich ausgeschlossen.“", "„Und meine Tochter bekommt nachts um elf Nachrichten“, sagt eine Mutter. „Ich kann ja nicht jeden Abend ihr Handy kontrollieren.“", "„Warum nicht?“, fragt jemand.", "„Weil ich ihr vertrauen will!“", "Es wird laut. Drei, vier Eltern reden gleichzeitig. Frau Seidenfaden versucht, die Diskussion zu ordnen, aber ihre Stimme geht unter.", "Svetlana hebt die Hand. Sie weiß selbst nicht genau, warum. Vielleicht, weil Alina ihr am Sonntag weinend erzählt hat, dass jemand im Chat ihren Akzent nachgemacht hat. Frau Seidenfaden nickt ihr dankbar zu.", "„Entschuldigung. Darf ich etwas sagen? Mein Deutsch ist nicht perfekt.“", "Es wird ruhiger.", "„Ich glaube, wir streiten gerade über zwei Fragen gleichzeitig. Die eine Frage ist: Ab wann ein Handy? Das muss jede Familie selbst entscheiden. Die andere Frage ist: Wie sprechen die Kinder im Chat miteinander? Und das können wir gemeinsam entscheiden. In der Ukraine, in der Schule meiner Nichte, haben die Eltern zusammen Regeln für den Klassenchat geschrieben. Mit den Kindern. Nicht gegen sie.“", "„Was für Regeln?“, fragt der Vater aus der ersten Reihe, diesmal ohne Ironie.", "„Ganz einfache. Keine Nachricht
