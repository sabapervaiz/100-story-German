<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Deutsch im Alltag — B1–C1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:var(--fs,18px);line-height:1.6;background:var(--bg,#f4f5f7);color:var(--fg,#1d1d21)}body.dark{--bg:#14151a;--fg:#e9e9ee}.bar{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #ddd;padding:.5rem .7rem;z-index:9}body.dark .bar{background:#1d1f27;border-color:#333}button,select{font:inherit;font-size:.82rem;padding:.33rem .6rem;border:1px solid #bbb;border-radius:999px;background:transparent;color:inherit;cursor:pointer}main{max-width:800px;margin:0 auto;padding:1rem .9rem 5rem}.card{border:1px solid #ddd;border-radius:12px;padding:.8rem;margin:.6rem 0;cursor:pointer}body.dark .card,body.dark .box{border-color:#333}.bdg{font-size:.7rem;font-weight:700;color:#fff;padding:.1rem .4rem;border-radius:5px}.B1{background:#16a34a}.B2{background:#2563eb}.C1{background:#b4451c}.w{cursor:pointer;border-radius:4px}.w:hover{background:#dbe4ff}.w.sv{box-shadow:inset 0 -2px 0 #f0b429}.box{border:1px solid #ddd;border-radius:12px;padding:.8rem;margin:1rem 0}table{width:100%;border-collapse:collapse;font-size:.9rem}td{border-bottom:1px solid #ddd;padding:.3rem;vertical-align:top}.toc{list-style:none;padding:0}.toc li{display:flex;gap:.5rem;align-items:center;padding:.3rem 0;border-bottom:1px solid #eee;font-size:.88rem}body.dark .toc li{border-color:#2a2a2a}.todo{opacity:.4}.num{width:1.8rem;text-align:right;color:#888}#sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(120%);transition:.2s;z-index:20}#sheet.op{transform:none}.si{max-width:800px;margin:0 auto;background:#fff;border-radius:14px 14px 0 0;padding:.8rem 1rem 1.2rem;box-shadow:0 -6px 24px rgba(0,0,0,.2)}body.dark .si{background:#1d1f27}.muted{color:#888;font-size:.8rem}details{border-bottom:1px solid #ddd;padding:.4rem 0}summary{cursor:pointer;font-weight:600}</style></head><body><div class="bar"><b>🇩🇪 Deutsch im Alltag</b><span><button data-a="v" data-x="lib">Bibliothek</button> <button data-a="v" data-x="toc">Inhalt</button> <button data-a="v" data-x="wl">★</button></span><span><button data-a="f" data-x="-1">A−</button> <button data-a="f" data-x="1">A+</button> <button data-a="dk">🌙</button><select id="spd"><option value="0.6">🐢</option><option value="1" selected>▶</option><option value="1.4">🐇</option></select></span></div><main id="app"></main><div id="sheet"></div><script>
var S=[{"id": 1, "title": "Der Drucker streikt wieder", "level": "B1", "topic": "Arbeit & IT-Support", "rt": "ca. 5 Min.", "teaser": "Saba soll einen streikenden Drucker reparieren – doch das Problem sitzt ganz woanders.", "body": ["Es ist Montagmorgen, kurz nach acht. Saba sitzt im IT-Support und trinkt ihren ersten Kaffee, als das Telefon klingelt.", "„IT-Support, Pervaiz, guten Morgen.“", "„Ja, grüß Gott, hier ist Brunner aus der Buchhaltung. Der Drucker, der geht nicht. Schon wieder!“", "„Okay, kein Stress. Was macht er denn genau?“", "„Nichts macht er! Ich drück auf Drucken, und dann passiert halt einfach gar nichts. Null.“", "„Verstehe. Kommt denn eine Fehlermeldung?“", "„Eine was? Nee, da kommt nix. Der steht einfach nur blöd da und blinkt nicht mal.“", "Saba muss lächeln. Sie kennt Herrn Brunner. Er ist ein netter Kerl, aber mit Technik steht er halt ein bisschen auf Kriegsfuß.", "„Alles klar. Ich schau mal schnell vorbei. Zweiter Stock, oder?“", "„Genau, zweiter Stock, hinten rechts. Aber machen Sie hopp, gell? Ich muss die Rechnungen heute noch rausschicken. Das ist echt dringend.“", "Zwei Minuten später steht Saba vor dem Drucker. Das Display ist dunkel, komplett schwarz. Sie drückt eine Taste – nichts tut sich.", "„Komisch. Normalerweise leuchtet da zumindest ein kleines Lämpchen.“", "„Gell? Ich hab auch schon dran gewackelt, am Kabel und so. Hat nix gebracht.“", "„Haben Sie zufällig am Kabel gezogen oder was verschoben?“", "„Vielleicht. Kann schon sein. Ich hab halt überall mal rumgedrückt.“", "„Herr Brunner, haben Sie den heute schon mal an gehabt?“", "„Klar war der an! Der ist immer an. Den schalt ich doch nie aus.“", "„Hm. Und am Wochenende? War da vielleicht jemand zum Putzen hier?“", "„Die Putzfrau, ja, die war am Samstag da. Wieso? Die druckt doch nicht.“", "„Nein, aber vielleicht hat sie beim Saugen aus Versehen was ausgesteckt. Das kommt öfter vor, als man denkt.“", "„Meinen Sie? Also langsam wird mir das echt ein Rätsel.“", "Saba geht in die Hocke und schaut hinter den Schrank. Da liegt eine Steckdosenleiste. Und der kleine rote Schalter steht auf „Aus“.", "„Ah, da haben wir's ja. Die Leiste ist aus. Die wurde beim Saugen bestimmt mit dem Fuß erwischt.“", "„Im Ernst jetzt? Also war der Drucker die ganze Zeit einfach … aus?“", "„Sieht ganz so aus. Ich mach ihn mal wieder an. Moment.“", "Sie drückt den Schalter. Es summt, das Display leuchtet auf, der Drucker rattert. Und dann geht es los.", "Blatt um Blatt schießt aus dem Gerät. Eins, zwei, fünf, zehn Seiten. Herr Brunner reißt die Augen auf.", "„Ja sauber! Was kommt denn da alles raus?!“", "„Das sind Ihre ganzen Druckaufträge von heute Morgen. Die hingen in der Warteschlange fest, bis der Drucker wieder Strom hatte.“", "„Und ich hab gedacht, das Ding ist kaputt. Dabei war's bloß der Stecker. Mir ist das jetzt echt ein bisschen peinlich.“", "„Ach, machen Sie sich keinen Kopf. Das passiert ständig. Am Ende ist es oft die einfachste Sache der Welt.“", "„Da haben Sie wohl recht. Ich merk mir das: erst der Stecker, dann die Panik.“", "„Am besten gleich ganz ohne Panik. Bei neunzig Prozent der Fälle ist es wirklich eine Kleinigkeit.“", "„Trotzdem. Vielen Dank, dass Sie so schnell da waren. Darf ich Sie auf einen Kaffee einladen?“", "„Sehr gern. Aber erst schreib ich noch ein Ticket, sonst schimpft mein Chef.“", "„Ein Ticket? Für einen Stecker?“", "„Na ja, offiziell heißt das dann ‚Stromversorgung wiederhergestellt‘. Klingt doch gleich viel besser, oder?“", "Herr Brunner lacht laut. Dann sammelt er seine Rechnungen ein, die überall auf dem Boden liegen.", "„Wissen Sie was, Frau Pervaiz? Sie haben mir grad den Montag gerettet.“", "„Gern geschehen. Und wenn er wieder streikt: erst Stecker checken, dann anrufen. Versprochen?“", "„Versprochen. Ehrenwort.“", "„Und den Kaffee – lieber einen großen oder einen kleinen?“", "„Einen großen. Und mit extra viel Milch, wenn's geht.“", "„Geht klar. Den haben Sie sich jetzt aber auch verdient.“", "Saba geht zurück an ihren Platz. Ihr Kaffee ist inzwischen kalt. Aber sie hat jetzt eine Einladung auf einen frischen – und eine gute Geschichte für die Mittagspause."], "gl": [["streiken", "(here) to act up"], ["die Buchhaltung", "accounting dept."], ["halt", "(particle) just/simply"], ["die Fehlermeldung", "error message"], ["blöd", "stupid/silly"], ["auf Kriegsfuß stehen", "to be at odds with"], ["vorbeischauen", "to drop by"], ["hopp machen", "to get a move on"], ["gell", "right? (southern)"], ["die Steckdosenleiste", "power strip"], ["die Warteschlange", "queue"], ["der Druckauftrag", "print job"], ["peinlich", "embarrassing"], ["sich keinen Kopf machen", "not to worry"], ["das Ticket", "(support) ticket"], ["schimpfen", "to grumble"], ["das Ehrenwort", "word of honour"], ["der Stecker", "plug"], ["das Lämpchen", "little light"], ["die Taste", "key / button"]], "q": [["Warum ruft Herr Brunner an?", "Sein Drucker funktioniert nicht.", "Er drückt auf „Drucken“, aber nichts passiert."], ["Was ist das wahre Problem?", "Die Steckdosenleiste war aus.", "Beim Putzen mit dem Fuß erwischt."], ["Was passiert nach dem Einschalten?", "Viele Seiten drucken auf einmal.", "Die Aufträge hingen in der Warteschlange."], ["Wie reagiert Herr Brunner?", "Es ist ihm peinlich.", "Er dachte, der Drucker sei kaputt."], ["Warum schreibt Saba ein Ticket?", "Zur offiziellen Dokumentation.", "Scherz: „Stromversorgung wiederhergestellt“."]], "say": ["Kein Stress, ich schau mal schnell vorbei.", "Kommt denn eine Fehlermeldung?", "Haben Sie den Stecker schon mal geprüft?", "Machen Sie sich keinen Kopf, das passiert ständig.", "Vielen Dank, dass Sie so schnell da waren."]}, {"id": 2, "title": "Ein Termin beim Bürgeramt", "level": "B1", "topic": "Behörden & Alltag", "rt": "ca. 5 Min.", "teaser": "Lena will sich ummelden – aber ihr fehlt genau das eine Papier, auf das es ankommt.", "body": ["Lena steht am Eingang vom Bürgeramt und schaut auf ihren Zettel. Wartenummer B 47. Auf der großen Anzeige an der Wand leuchtet gerade erst B 31.", "Sie sucht sich einen Platz. Neben ihr sitzt ein älterer Herr mit einer dicken Mappe auf dem Schoß und blättert gelangweilt darin.", "„Entschuldigung, wissen Sie, ob das hier immer so lange dauert?“", "„Ach, mal so, mal so. Heute geht's eigentlich. Letzte Woche hab ich fast zwei Stunden gewartet.“", "„Zwei Stunden? Oje. Ich hab nämlich gleich noch einen anderen Termin.“", "„Dann drücken wir mal die Daumen. Was wollen Sie denn machen, wenn ich fragen darf?“", "„Ich muss mich ummelden. Bin letzten Monat umgezogen, und das muss man ja innerhalb von zwei Wochen machen.“", "„Zwei Wochen, genau. Haben Sie denn die Wohnungsgeberbestätigung dabei? Ohne die läuft hier gar nichts.“", "„Die … was? Die Bestätigung vom Vermieter, meinen Sie?“", "„Genau die. Das Papier, wo draufsteht, dass Sie da wirklich wohnen. Ohne das schicken die Sie wieder heim.“", "Lena wird ein bisschen blass und fängt an, in ihrer Tasche zu kramen.", "„Ich glaub … ich hab nur den Mietvertrag dabei. Reicht der denn nicht?“", "„Tja, mal ja, mal nein. Kommt ganz drauf an, wer gerade am Schalter sitzt.“", "Auf der Anzeige springt die Nummer plötzlich auf B 47. Schalter vier.", "„Viel Glück“, sagt der ältere Herr. „Und lächeln Sie. Das hilft manchmal mehr als jedes Formular.“", "„Oh, das bin ich ja schon. Wünschen Sie mir Glück.“", "Lena geht zum Schalter. Hinter der Glasscheibe sitzt eine freundliche Frau mit Brille und einem Stapel Akten.", "„Guten Tag, ich möchte mich gern ummelden.“", "„Guten Tag. Ihren Personalausweis bitte und die Wohnungsgeberbestätigung.“", "„Also, die Bestätigung hab ich leider nicht dabei. Aber ich hab hier meinen Mietvertrag.“", "„Hm. Eigentlich brauche ich das richtige Formular. Der Mietvertrag allein reicht normalerweise nicht.“", "„Das tut mir ehrlich leid. Ich hab das echt nicht gewusst. Muss ich jetzt noch mal kommen?“", "Die Sachbearbeiterin schaut sich den Vertrag genauer an und seufzt leise vor sich hin.", "„Moment. Stehen im Mietvertrag die Adresse, der Name vom Vermieter und eine Unterschrift?“", "„Ja, alles drin. Hier, schauen Sie mal.“", "„Also gut. Ich mache heute eine Ausnahme, weil wirklich alles Nötige drinsteht. Aber die Bestätigung muss Ihnen Ihr Vermieter ausfüllen – das ist sogar seine Pflicht. Beim nächsten Mal bringen Sie bitte das richtige Formular mit, ja?“", "„Ganz bestimmt. Vielen, vielen Dank. Sie retten mir gerade den Tag.“", "„Schon gut. Passiert den Leuten dauernd. Setzen Sie sich noch mal kurz hin, ich drucke Ihnen die neue Meldebestätigung.“", "Lena geht erleichtert zurück zu ihrem Platz. Der ältere Herr schaut neugierig auf.", "„Und? Hat's geklappt?“", "„Ja! Die Frau war total nett. Sie hat eine Ausnahme gemacht.“", "„Sehen Sie, Glück gehabt. Dann schaffen Sie Ihren anderen Termin ja doch noch.“", "„Gerade so. Ich glaub, das nächste Mal schreib ich mir vorher eine Liste, was ich alles mitnehmen muss.“", "„Gute Idee. Bei Ämtern gilt sowieso: lieber ein Blatt zu viel als eins zu wenig.“", "„Haben Sie denn heute auch einen Termin?“, fragt Lena.", "„Ich? Ich hole nur meinen neuen Reisepass ab. Zum dritten Mal, weil ich jedes Mal ein anderes Papier vergessen hab.“", "„Dann sind wir ja schon zwei.“", "„Eben. Deshalb der Tipp mit der Liste. Aus bitterer Erfahrung.“", "Von Schalter vier ertönt es wieder.", "„Frau Berger? Ihre Meldebestätigung ist fertig.“", "„Danke schön. Und einen schönen Tag noch!“", "„Ebenso. Und sagen Sie Ihrem Vermieter, er soll Ihnen beim nächsten Mal das Formular ausfüllen.“", "Lena lacht, steckt das Papier ein und eilt zur Tür. Draußen atmet sie einmal tief durch. Noch zwölf Minuten bis zum nächsten Termin – das passt gerade so.", "Im Gehen tippt sie sich schnell eine Notiz ins Handy: „Beim Amt immer: Ausweis, Mietvertrag, Wohnungsgeberbestätigung.“ Dieses eine Mal ist es gut gegangen. Ein zweites Mal will sie ihr Glück lieber nicht herausfordern."], "gl": [["sich ummelden", "to register new address"], ["die Wohnungsgeberbestätigung", "landlord's residence confirmation"], ["der Mietvertrag", "rental contract"], ["der Schalter", "service counter"], ["die Sachbearbeiterin", "clerk"], ["die Meldebestätigung", "registration confirmation"], ["die Wartenummer", "queue number"], ["die Mappe", "folder"], ["oje", "oh dear"], ["die Daumen drücken", "to cross fingers"], ["innerhalb", "within"], ["ausnahmsweise", "as an exception"], ["eine Ausnahme machen", "to make an exception"], ["nämlich", "you see"], ["seufzen", "to sigh"], ["das Formular", "form"], ["sein Glück herausfordern", "to push one's luck"], ["blass werden", "to go pale"], ["die Ausnahme", "exception"], ["die Pflicht", "duty / obligation"]], "q": [["Warum ist Lena beim Bürgeramt?", "Sie will sich nach dem Umzug ummelden.", "Das muss man innerhalb von zwei Wochen machen."], ["Welches Papier fehlt ihr?", "Die Wohnungsgeberbestätigung.", "Sie hat nur den Mietvertrag dabei."], ["Warum hilft die Sachbearbeiterin trotzdem?", "Im Mietvertrag steht alles Nötige.", "Adresse, Name und Unterschrift sind drin."], ["Was rät der ältere Herr?", "Lieber ein Blatt zu viel mitnehmen.", "Bei Ämtern braucht man oft viele Unterlagen."], ["Was macht Lena am Ende?", "Sie schreibt sich eine Notiz ins Handy.", "Damit sie beim nächsten Mal alles dabei hat."]], "say": ["Ich möchte mich gern ummelden.", "Reicht der Mietvertrag denn nicht?", "Muss ich jetzt noch mal kommen?", "Vielen Dank, Sie retten mir den Tag.", "Das nächste Mal bringe ich alles mit."]}, {"id": 3, "title": "Die Kehrwoche", "level": "B2", "topic": "Nachbarn & Schwäbische Kultur", "rt": "ca. 5 Min.", "teaser": "Ein Neu-Zugezogener aus Hamburg versteht nur Bahnhof, als die Nachbarin von der Kehrwoche spricht.", "body": ["Tom wohnt seit zwei Wochen in Stuttgart. Er kommt aus Hamburg und kennt die Stadt und ihre Eigenheiten noch nicht besonders gut. An einem Samstagmorgen klingelt es an seiner Wohnungstür.", "„Morgen. Sie sind der Neue, gell? Im zweiten Stock.“", "„Ja, genau, Tom Petersen. Guten Morgen.“", "„Vogt, von nebenan. Sagen Sie mal, haben Sie diese Woche an die Kehrwoche gedacht?“", "„An die … was, bitte? Entschuldigung, das Wort hab ich noch nie gehört.“", "„Kehrwoche! Das Treppenhaus putzen, kehren, wischen. Das macht bei uns jede Partei abwechselnd, immer eine Woche lang.“", "„Ah. Und das ist … Pflicht?“", "„Freilich ist das Pflicht. Des g'hört sich halt so hier. Steht sogar im Mietvertrag, schauen Sie ruhig mal nach.“", "Tom kratzt sich am Kopf. In Hamburg hat das immer eine Firma gemacht, da hat er sich nie Gedanken drüber gemacht.", "„Ehrlich gesagt versteh ich grad nur Bahnhof. Bei uns im Norden kam da einfach ein Reinigungsdienst.“", "„Ja, mei, hier nicht. Hier schwingt man den Besen noch selber. Und diese Woche sind nämlich Sie dran.“", "„Oh. Das wusste ich wirklich nicht. Und was muss ich da genau machen?“", "„Treppe kehren, Geländer abwischen und den Dreck vor der Haustür wegmachen. Momentle, ich zeig's Ihnen einfach.“", "Frau Vogt winkt ihn mit nach unten ins Treppenhaus. Sie deutet auf einen schmalen Schrank unter der Treppe.", "„Da drin ist alles: Besen, Eimer, Lappen. Und das Schild hier, das ‚Kehrwoche‘-Schild, das hängt man an seine Tür, wenn man dran ist.“", "„Ach, deshalb hängt bei der Nachbarin unten so ein gelbes Schild.“", "„Genau. Jetzt hängen Sie's an Ihre. Dann weiß jeder im Haus: der Petersen, der ist diese Woche zuständig.“", "„Und wenn ich's mal vergesse?“", "„Dann gibt's lange Gesichter im Haus, glauben Sie mir. Die Leut reden dann. Aber so schlimm sind wir auch wieder nicht.“", "Tom muss lachen. Die resolute, direkte Art von Frau Vogt gefällt ihm irgendwie auf Anhieb.", "„Also gut. Dann fang ich gleich mal an. Lieber richtig, bevor sich jemand ärgert.“", "„So gefallen Sie mir. Und keine Angst, das ist koi Hexerei. Nach zwei, drei Mal machen Sie das im Schlaf.“", "„‚Koi Hexerei‘ – das heißt wohl ‚keine Hexerei‘, also nicht schwer?“", "„Hajo, ganz genau. Sie lernen ja schnell. Bald schwätzen Sie noch Schwäbisch wie einer von uns.“", "„So weit würde ich jetzt nicht gehen. Aber das Treppenhaus krieg ich schon hin.“", "„Und wie oft ist man dran?“", "„Bei acht Parteien alle acht Wochen. Dazu gibt’s noch die große Kehrwoche, einmal im Monat: Gehweg, Hof und Mülltonnen. Aber die macht bei uns meistens der Herr Hägele aus dem Erdgeschoss. Der hat ja sonst nix zu tun.“", "„Das hab ich gehört!“, ruft eine Männerstimme von unten.", "Frau Vogt kichert wie ein Schulmädchen. „Sehen Sie? Hier hört jeder alles. Das gehört bei uns auch dazu.“", "Tom holt den Besen aus dem Schrank und fängt ganz oben an. Frau Vogt bleibt noch einen Moment an der Tür stehen und schaut ihm zu.", "„Gar nicht schlecht für einen Hamburger. Und wenn Sie fertig sind, kommen Sie auf einen Kaffee rüber. Mein Mann hat frischen Hefezopf vom Bäcker geholt.“", "„Das ist aber nett. Dann beeil ich mich.“", "„Und, Herr Petersen – das Schild geht am Sonntagabend an den nächsten Nachbarn weiter. Nicht vorher, nicht nachher.“", "„Sonntagabend. Notiert.“", "„Lassen Sie sich Zeit, aber machen Sie's gründlich. Schlampig geht bei der Kehrwoche nämlich gar nicht.“", "Eine halbe Stunde später glänzt das Treppenhaus, und es riecht nach Putzmittel. Tom hängt das gelbe Schild an seine Tür und betrachtet es fast ein bisschen stolz.", "Dann klopft er bei Familie Vogt. Drinnen riecht es nach Kaffee und frischem Hefezopf. Vielleicht, denkt Tom, ist dieses Stuttgart doch gar nicht so kompliziert. Man muss nur wissen, wie der Hase läuft – oder eben, wie der Besen geht."], "gl": [["die Kehrwoche", "(Swabian) weekly cleaning rota"], ["gell", "right? (southern)"], ["freilich", "of course (southern)"], ["des g'hört sich so", "that's how it's done (Swabian)"], ["nur Bahnhof verstehen", "to not understand a thing"], ["ja mei", "oh well (southern)"], ["den Besen schwingen", "to wield the broom"], ["dran sein", "to be one's turn"], ["Momentle", "just a moment (Swabian)"], ["das Geländer", "banister"], ["zuständig", "responsible"], ["lange Gesichter", "long faces"], ["resolut", "no-nonsense"], ["koi Hexerei", "no big deal (Swabian)"], ["hajo", "yeah, sure (Swabian)"], ["schwätzen", "to chat (southern)"], ["der Hefezopf", "sweet braided bread"], ["wie der Hase läuft", "how things really work"], ["die große Kehrwoche", "(Swabian) monthly outdoor cleaning duty"], ["kichern", "to giggle"]], "q": [["Was ist die Kehrwoche?", "Das abwechselnde Putzen des Treppenhauses.", "Jede Partei ist eine Woche lang dran."], ["Warum kennt Tom das nicht?", "In Hamburg machte das eine Firma.", "Die Kehrwoche ist typisch für den Südwesten."], ["Woran erkennt man, wer dran ist?", "An einem gelben Schild an der Tür.", "Man hängt das „Kehrwoche“-Schild auf."], ["Wie reagiert Tom am Ende?", "Er macht mit und putzt gründlich.", "Er will keinen Ärger im Haus."], ["Was bedeutet „koi Hexerei“?", "Keine Hexerei, also nicht schwer.", "Frau Vogt spricht Schwäbisch."]], "say": ["Das Wort habe ich noch nie gehört.", "Ehrlich gesagt verstehe ich nur Bahnhof.", "Und was muss ich da genau machen?", "Lieber richtig, bevor sich jemand ärgert.", "Das ist aber nett, danke für die Einladung."]}, {"id": 4, "title": "Im Wartezimmer", "level": "B2", "topic": "Arzt & Gesundheit", "rt": "ca. 5 Min.", "teaser": "Zwei Fremde im Wartezimmer geraten über eine simple Frage aneinander: Wer war zuerst da?", "body": ["Das Wartezimmer von Dr. Sommer ist an diesem Morgen gut gefüllt. Herr Klein, Ende sechzig, blättert gelangweilt in einer alten Zeitschrift. Eine junge Frau kommt herein, meldet sich kurz an der Anmeldung und setzt sich ihm gegenüber.", "„Ist hier noch frei?“", "„Klar, setzen Sie sich ruhig. Viel los heute, gell?“", "„Allerdings. Ich hoffe, es geht halbwegs schnell. Ich hab um halb elf noch was.“", "„Da wär ich an Ihrer Stelle nicht so optimistisch. Ich sitz schon seit neun hier.“", "„Oh. Und es ist jetzt kurz vor zehn. Das kann ja heiter werden.“", "„So ist das eben beim Hausarzt. Erkältungszeit, da platzt die Praxis aus allen Nähten.“", "„Und Sie? Auch erkältet?“, fragt Herr Klein.", "„Nein, zum Glück nicht. Ich brauche nur eine Impfung. Nächsten Monat fliege ich nach Thailand.“", "„Thailand! Da war ich vor dreißig Jahren mit meiner Frau. Passen Sie bloß auf mit dem Essen, das ist scharf. Ich hab eine ganze Woche lang geschwitzt.“", "„Ich mag es scharf“, lacht die junge Frau.", "„Das hab ich damals auch gesagt.“", "Die junge Frau nickt und holt ihr Handy heraus. Nach ein paar Minuten öffnet sich die Tür zum Behandlungszimmer, und die Sprechstundenhilfe ruft in den Raum:", "„Der Nächste bitte!“", "Herr Klein und die junge Frau stehen im selben Moment auf. Beide zögern kurz, dann macht die Frau einen Schritt nach vorn.", "„Entschuldigung, aber ich glaube, ich war vor Ihnen dran.“", "„Wie bitte? Also, ich sitze hier schon seit einer ganzen Stunde, junge Frau.“", "„Das mag sein, aber ich hatte einen Termin um zehn. Vielleicht ruft sie ja nach Termin auf.“", "„Nach Termin? Pah. Hier gilt doch: wer zuerst kommt, mahlt zuerst.“", "„Das sehe ich anders. Sonst bräuchte man ja gar keine Termine zu machen.“", "Die Sprechstundenhilfe hebt beschwichtigend beide Hände.", "„Immer mit der Ruhe, die Herrschaften. Wie heißen Sie denn beide?“", "„Klein, Werner Klein.“", "„Und ich bin Mira Hoffmann. Ich hatte einen Termin um zehn Uhr.“", "Die Sprechstundenhilfe schaut auf ihren Bildschirm und tippt kurz etwas ein.", "„Also, Frau Hoffmann, Sie sind wegen der Impfung da, richtig? Das geht ganz fix, zwei Minuten. Und Herr Klein, Sie müssen heute noch zum Blutabnehmen, und dafür ist das Labor erst in zehn Minuten frei.“", "„Ach so. Dann war die ganze Aufregung ja für die Katz.“", "„Sieht so aus. Frau Hoffmann, kommen Sie kurz mit, dann haben Sie Ihren Termin pünktlich. Herr Klein, ich hol Sie gleich, versprochen.“", "Mira wirft Herrn Klein einen entschuldigenden Blick zu, bevor sie aufsteht.", "„Tut mir leid wegen vorhin. Ich wollte wirklich nicht drängeln.“", "„Ach, schon gut. Ich war wohl ein bisschen grantig. Man wird halt ungeduldig, wenn man so lang sitzt.“", "„Verstehe ich total. Soll ich Ihnen vielleicht einen Kaffee vom Automaten mitbringen, wenn ich fertig bin?“", "„Das ist aber freundlich. Wissen Sie was? Dann vertragen wir uns wieder. Schwarz, bitte, ohne Zucker.“", "„Geht klar. Bis gleich, Herr Klein.“", "Mira verschwindet im Behandlungszimmer. Herr Klein lehnt sich zurück und muss schmunzeln. So schnell kann das gehen: eben noch ein kleiner Streit, und jetzt bringt ihm die vermeintliche Gegnerin einen Kaffee.", "Als sie zwei Minuten später mit einem dampfenden Becher zurückkommt, ist er fast ein wenig gerührt.", "„Da, bitte schön. Und gute Besserung, oder was auch immer bei Ihnen heute ansteht.“", "„Danke, junge Frau. Und Ihnen alles Gute. War mir eine Lehre: erst fragen, dann aufregen.“", "„Wenn Sie aus Thailand zurück sind, müssen Sie mir erzählen, ob das Essen scharf war.“", "„Abgemacht. Falls wir uns hier wieder treffen.“", "„Beim Hausarzt trifft man sich immer wieder, glauben Sie mir. Spätestens bei der nächsten Grippewelle.“", "Die Tür geht wieder auf. „Herr Klein? Das Labor ist frei.“ Er steht auf, den warmen Becher in der Hand, und diesmal widerspricht ihm niemand."], "gl": [["das Wartezimmer", "waiting room"], ["die Anmeldung", "reception desk"], ["die Sprechstundenhilfe", "doctor's receptionist"], ["aus allen Nähten platzen", "to burst at the seams"], ["dran sein", "to be one's turn"], ["wer zuerst kommt, mahlt zuerst", "first come, first served"], ["beschwichtigen", "to placate"], ["immer mit der Ruhe", "take it easy"], ["die Herrschaften", "ladies and gentlemen"], ["die Impfung", "vaccination"], ["Blut abnehmen", "to take blood"], ["für die Katz sein", "to be for nothing"], ["drängeln", "to push / jostle"], ["grantig", "grumpy (southern)"], ["ungeduldig", "impatient"], ["sich vertragen", "to make up"], ["gute Besserung", "get well soon"], ["schmunzeln", "to smile to oneself"], ["die Grippewelle", "flu wave"], ["scharf", "spicy / hot"]], "q": [["Warum streiten Herr Klein und Mira?", "Beide denken, sie seien als Nächste dran.", "Er wartet länger, sie hat einen Termin."], ["Wie löst die Sprechstundenhilfe das Problem?", "Mira geht zuerst, ihre Impfung geht schnell.", "Herr Klein muss aufs Labor warten."], ["Wie verhält sich Mira nach dem Streit?", "Sie entschuldigt sich und bietet Kaffee an.", "Sie wollte nicht drängeln."], ["Warum war die Aufregung „für die Katz“?", "Beide kamen sowieso zügig dran.", "Der Streit war unnötig."], ["Was lernt Herr Klein?", "Erst fragen, dann sich aufregen.", "Er nennt es selbst „eine Lehre“."]], "say": ["Ist hier noch frei?", "Ich glaube, ich war vor Ihnen dran.", "Tut mir leid, ich wollte nicht drängeln.", "Soll ich Ihnen einen Kaffee mitbringen?", "Danke, und gute Besserung!"]}, {"id": 5, "title": "Der verpasste Anschluss", "level": "C1", "topic": "Bahn & Reisen", "rt": "ca. 5 Min.", "teaser": "Sekunden zu spät am Gleis – doch eine Zugbegleiterin verwandelt Daniels Pech in einen Glücksfall.", "body": ["Der ICE aus Frankfurt rollt mit zwanzig Minuten Verspätung in Mannheim ein. Daniel steht längst an der Tür, die Tasche umklammert, und starrt auf die Anzeige über dem Bahnsteig. Sein Anschluss nach Stuttgart ist für 18:04 angekündigt – und es ist bereits 18:03.", "Kaum hält der Zug, hetzt er über den Bahnsteig, zwei Stufen auf einmal die Treppe hinunter. Doch als er Gleis 4 erreicht, sieht er nur noch die roten Rücklichter des Regionalexpresses in der Ferne verschwinden.", "„Na wunderbar. Das hätte ich mir ja denken können.“", "Eine Zugbegleiterin, die gerade ihren Dienst beendet hat, bleibt neben ihm stehen.", "„Den um vier nach sechs verpasst, was?“", "„Ganz genau. Wäre der ICE pünktlich gewesen, hätte ich es locker geschafft. So stand ich praktisch schon mit einem Bein auf dem Trittbrett, als er losfuhr.“", "„Das kenne ich zur Genüge. Nichts ist ärgerlicher, als wenn es nur um Sekunden geht. Der nächste reguläre fährt leider erst um 18:49.“", "„Fast eine Stunde. Großartig. Und ich habe um acht in Stuttgart einen Tisch reserviert.“", "„Darf ich raten – ein Date?“", "„So in der Art. Ein erstes Treffen. Wenn ich zu spät komme, macht das natürlich keinen besonders charmanten Eindruck.“", "„Ein erstes Treffen in Stuttgart – und Sie kommen aus Frankfurt?“", "„Wir haben uns online kennengelernt. Sie wohnt in Stuttgart, ich arbeite in Frankfurt. Die Mitte wäre Mannheim gewesen. Aber sie meinte, ich soll mir mal ansehen, wie schön ihre Stadt ist.“", "„Dann wäre es wirklich schade, wenn Sie den ersten Eindruck verpassen.“", "„Dann lassen Sie uns schauen, ob wir das noch retten. Hätten Sie etwas gegen einen schnelleren Zug?“", "„Einen schnelleren? Ich dachte, vor dreiviertel sieben geht gar nichts.“", "„Es gäbe da einen ICE um 18:21, direkt nach Stuttgart. Wenn der Ihre Fahrkarte akzeptiert – und das muss er bei dieser Verspätung –, wären Sie sogar früher dort als ursprünglich geplant.“", "„Im Ernst? Das wäre die Rettung. Aber darf ich den überhaupt nehmen? Mein Ticket ist doch eigentlich zuggebunden.“", "„Bei einer Verspätung ab zwanzig Minuten dürfen Sie auf den nächsten geeigneten Zug ausweichen. Das nennt sich Fahrgastrechte. Ich schreib Ihnen das kurz auf, falls jemand nachfragt.“", "Sie kritzelt ein paar Zeilen auf einen Zettel und reicht ihn ihm.", "„Das ist unglaublich zuvorkommend von Ihnen. Hätte ich Sie nicht getroffen, würde ich jetzt noch eine geschlagene Stunde hier frieren.“", "„Dafür sind wir ja da. Und noch ein Tipp: Füllen Sie online das Fahrgastrechte-Formular aus. Ab sechzig Minuten Verspätung bekämen Sie einen Teil des Fahrpreises zurück; bei zwanzig leider noch nicht, aber den Versuch wäre es wert.“", "„Mach ich. Und wo finde ich den ICE jetzt?“", "„Gleis 2, direkt gegenüber. Sie haben noch gut fünfzehn Minuten. Diesmal ganz ohne Rennen.“", "„Das höre ich mit Freuden. Nach dem Sprint von eben reicht es mir für heute.“", "Daniel bedankt sich überschwänglich und geht hinüber zu Gleis 2. Während er wartet, vibriert sein Handy. Eine Nachricht von seiner Verabredung.", "„‚Komme leider fünfzehn Minuten später, die Bahn mal wieder …‘ – das darf doch nicht wahr sein.“", "Er muss lachen. Ausgerechnet. Hätte er den ersten Zug erwischt, wäre er nun pünktlich – und sie trotzdem zu spät. So aber passt es plötzlich wie angegossen.", "Er tippt zurück: „Kein Problem, bei mir ist es genauso gelaufen. Dann sind wir ja quitt.“", "Die Antwort kommt sofort: „Quitt. Und das erste Glas Wein geht auf die Bahn.“", "Der ICE fährt ein, pünktlich auf die Minute. Daniel steigt ein, sinkt in einen Sitz am Fenster und schaut hinaus, wie die Felder vorbeiziehen.", "Wäre der erste Zug nicht ohne ihn abgefahren, er hätte diesen schnelleren nie genommen. Manchmal, denkt Daniel, während Mannheim hinter ihm zurückbleibt, ist eine verpasste Verbindung am Ende die bessere Verbindung."], "gl": [["der Anschluss", "connection (train)"], ["die Verspätung", "delay"], ["die Zugbegleiterin", "train attendant"], ["hetzen", "to rush / dash"], ["das Rücklicht", "tail light"], ["zur Genüge", "more than enough"], ["zuggebunden", "valid only for a specific train"], ["ausweichen auf", "to switch to"], ["die Fahrgastrechte", "passenger rights"], ["zuvorkommend", "obliging / courteous"], ["eine geschlagene Stunde", "a whole hour"], ["überschwänglich", "effusive(ly)"], ["die Verabredung", "date / meeting"], ["wie angegossen passen", "to fit perfectly"], ["quitt sein", "to be even"], ["das Trittbrett", "running board"], ["geeignet", "suitable"], ["sich etw. denken können", "to have guessed sth"], ["online kennenlernen", "to meet online"], ["der erste Eindruck", "first impression"]], "q": [["Warum verpasst Daniel seinen Anschluss?", "Der ICE hatte zwanzig Minuten Verspätung.", "Er kam Sekunden zu spät ans Gleis."], ["Welche Lösung bietet die Zugbegleiterin?", "Einen schnelleren ICE um 18:21.", "Bei Verspätung darf er darauf ausweichen."], ["Was sind Fahrgastrechte hier?", "Das Recht, einen anderen Zug zu nehmen.", "Gilt ab zwanzig Minuten Verspätung."], ["Welche Überraschung bringt die SMS?", "Seine Verabredung kommt auch später.", "Die Verspätung passt plötzlich perfekt."], ["Was ist die Pointe am Ende?", "Eine verpasste Verbindung war die bessere.", "Sonst hätte er den schnelleren Zug nie genommen."]], "say": ["Wäre der Zug pünktlich gewesen, hätte ich es geschafft.", "Darf ich den denn überhaupt nehmen?", "Das ist wirklich sehr zuvorkommend von Ihnen.", "Dann sind wir ja quitt.", "Diesmal ganz ohne Rennen, zum Glück."]}, {"id": 6, "title": "Das Missverständnis beim Grillfest", "level": "C1", "topic": "Nachbarn & Gefühle", "rt": "ca. 5 Min.", "teaser": "Zwei unklare Sätze, zwei falsche Annahmen – und beinahe wäre ein netter Abend nie zustande gekommen.", "body": ["Im Innenhof der Wohnanlage riecht es nach Holzkohle und Grillwürsten. Markus, der das kleine Sommerfest organisiert hat, wendet gerade die Steaks, als er Amira Said sieht, die etwas unschlüssig am Rand des Hofes steht.", "„Amira! Schön, dass du doch noch kommst. Ich hatte schon gedacht, du hättest abgesagt.“", "„Abgesagt? Wie kommst du denn darauf? Ich war mir ehrlich gesagt nicht einmal sicher, ob ich überhaupt gemeint war.“", "„Wie, ob du gemeint warst? Ich hab dir doch extra geschrieben.“", "„Ja, aber in der Nachricht stand nur: ‚Wir grillen am Samstag, falls du magst.‘ Das klang eher so dahingesagt. Ich wollte mich nicht aufdrängen.“", "Markus lacht und legt die Grillzange beiseite.", "„Also, das war todernst als Einladung gemeint. ‚Falls du magst‘ heißt bei mir so viel wie: ‚Ich würde mich wirklich freuen.‘ Da hätte ich mich klarer ausdrücken sollen.“", "„Tja, im Nachhinein ist man immer schlauer. Und dann dachte ich außerdem, ihr hättet sowieso nur Fleisch, und ich esse ja kein Schweinefleisch.“", "„Ah, deswegen das Zögern. Da liegt wohl schon das zweite Missverständnis. Schau mal da hinten: ein extra Grill, nur mit Hähnchen und Gemüse. Den hab ich extra aufgestellt.“", "„Im Ernst? Das hast du gemacht, obwohl du dachtest, ich hätte längst abgesagt?“", "„Na ja, die Hoffnung stirbt zuletzt. Und selbst wenn du nicht gekommen wärst – ein, zwei Vegetarier finden sich hier immer.“", "Amira ist sichtlich berührt und tritt endlich näher an die Tische heran.", "„Das ist … wirklich aufmerksam. Ehrlich, ich bin ein bisschen gerührt. Ich hatte dich völlig falsch eingeschätzt.“", "„Kann ja passieren. Wir haben uns, seit du eingezogen bist, kaum mal richtig unterhalten. Immer nur ein schnelles ‚Hallo‘ im Treppenhaus.“", "„Stimmt. Und daraus bastelt man sich dann im Kopf seine eigene Geschichte zusammen. Ich dachte, die Nachbarn hier seien eher … reserviert.“", "„Reserviert? Wir? Warte, bis du Frau Keller mit zwei Gläsern Sekt erlebst. Dann redest du anders.“", "„Frau Keller? Die ältere Dame aus dem Erdgeschoss? Die grüßt mich immer so streng.“", "„Das ist nur ihr Gesicht. Innen drin ist sie ein Marshmallow. Letztes Jahr hat sie beim Grillfest Karaoke gesungen. Drei Lieder von Udo Jürgens.“", "„Das kann ich mir überhaupt nicht vorstellen.“", "„Warte ab. Spätestens um zehn sucht sie das Mikrofon.“", "Beide müssen lachen. Markus reicht ihr einen leeren Teller.", "„Komm, setz dich. Das Hähnchen ist in fünf Minuten so weit. Was möchtest du trinken?“", "„Eine Apfelschorle wäre großartig. Und … danke, Markus. Wirklich.“", "„Wofür denn? Fürs Grillen? Das mach ich doch gern.“", "„Nein. Dafür, dass du den zweiten Grill aufgestellt hast, obwohl du fest damit gerechnet hast, dass ich gar nicht auftauche. So etwas vergisst man nicht.“", "Markus winkt ab, aber man sieht ihm an, dass ihn das Lob freut.", "„Weißt du was? Dann machen wir es beim nächsten Mal andersherum. Dann lädst du ein, und ich bin derjenige, der grübelt, ob er überhaupt gemeint ist.“", "„Abgemacht. Aber ich verspreche dir: Meine Einladung wird so unmissverständlich, dass du gar nicht erst ins Grübeln kommst.“", "„Und darf ich dann für alle kochen? Bei uns im Libanon ist ein Fest ohne Hummus kein richtiges Fest.“", "„Ich bitte darum. Ich bringe die Getränke – und für dich eine Apfelschorle.“", "Später, als die Sonne hinter den Dächern versinkt und über dem Hof die Lichterketten angehen, sitzt Amira mitten in der Runde, einen Teller mit Hähnchen auf dem Schoß, und lacht über eine Geschichte von Frau Keller, die gerade das Mikrofon in der Hand hält.", "Ein kleines Missverständnis, zwei unklare Sätze – und beinahe wäre dieser Abend nie zustande gekommen. Manchmal, denkt Amira, entscheidet wirklich ein einziger Satz zu viel oder zu wenig darüber, ob aus Nachbarn Fremde bleiben oder Freunde werden."], "gl": [["unschlüssig", "undecided / hesitant"], ["absagen", "to cancel / decline"], ["dahingesagt", "said casually"], ["sich aufdrängen", "to impose oneself"], ["todernst", "dead serious"], ["im Nachhinein", "in hindsight"], ["das Missverständnis", "misunderstanding"], ["die Hoffnung stirbt zuletzt", "hope dies last"], ["berührt", "touched / moved"], ["gerührt", "moved to emotion"], ["jdn. falsch einschätzen", "to misjudge sb"], ["reserviert", "reserved / aloof"], ["die Apfelschorle", "apple juice spritzer"], ["jdm. etw. ansehen", "to tell from sb's face"], ["andersherum", "the other way round"], ["unmissverständlich", "unambiguous"], ["ins Grübeln kommen", "to start brooding"], ["zustande kommen", "to come about"], ["sich etwas vorstellen", "to imagine sth"], ["das Mikrofon", "microphone"]], "q": [["Warum zögert Amira, zum Fest zu kommen?", "Sie dachte, sie sei nicht wirklich eingeladen.", "Die Nachricht klang für sie nur dahingesagt."], ["Welches zweite Missverständnis gibt es?", "Amira dachte, es gäbe nur Fleisch.", "Markus hat extra einen zweiten Grill aufgestellt."], ["Warum ist Amira gerührt?", "Markus dachte an sie trotz vermuteter Absage.", "Der Hähnchen-Grill war nur für alle Fälle."], ["Was planen die beiden für die Zukunft?", "Beim nächsten Mal lädt Amira ein.", "Dann unmissverständlich, ohne Grübeln."], ["Was ist die Moral der Geschichte?", "Ein Satz zu viel oder zu wenig entscheidet viel.", "Fast wäre aus dem Abend nichts geworden."]], "say": ["Ich wollte mich wirklich nicht aufdrängen.", "Da hätte ich mich klarer ausdrücken sollen.", "Ich hatte dich völlig falsch eingeschätzt.", "So etwas vergisst man nicht.", "Meine Einladung wird beim nächsten Mal unmissverständlich."]}, {"id": 7, "title": "Der neue Kollege", "level": "B1", "topic": "Arbeit & Alltag", "rt": "ca. 5 Min.", "teaser": "Mehmets erster Arbeitstag steckt voller kleiner Fallen – zum Glück nimmt ihn eine Kollegin an die Hand.", "body": ["Mehmet steht um kurz vor acht etwas nervös vor der Bürotür und drückt seine Tasche an sich. Heute ist sein erster Arbeitstag in der neuen Firma. Eine Frau mit einer dampfenden Kaffeetasse kommt den Flur entlang auf ihn zu.", "„Du bist bestimmt der Neue, oder? Mehmet?“", "„Ja, genau. Mehmet Yıldız. Guten Morgen.“", "„Ich bin Steffi, wir sitzen im selben Team. Herzlich willkommen! Komm, ich zeig dir erst mal alles.“", "„Das ist nett, danke. Ehrlich gesagt bin ich ein bisschen aufgeregt.“", "„Völlig normal am ersten Tag. Das legt sich schnell, versprochen.“", "Steffi führt ihn zu einem Schreibtisch am Fenster, auf dem ein Rechner und ein Telefon stehen.", "„So, das hier ist dein Platz. Rechner, Monitor, Telefon. Das erste Passwort steht auf dem Zettel unter der Tastatur.“", "„Super. Und wo sitzt der Rest vom Team?“", "„Gleich nebenan. Der Chef, Herr Wagner, ist noch in einer Besprechung, aber er kommt gegen neun und sagt dir Hallo.“", "Mehmet will seine Tasche am nächstbesten Stuhl abstellen, doch Steffi hält ihn sanft zurück.", "„Ah, warte – das ist eigentlich Tinas Platz. Deiner ist der daneben, am Fenster.“", "„Oh, Entschuldigung! Wie peinlich.“", "„Ach, überhaupt nicht. Am ersten Tag verläuft sich jeder mal. Und ehrlich, der am Fenster ist sowieso der bessere, da hast du Licht.“", "„Und wer ist Tina?“", "„Unsere Grafikerin. Sie ist diese Woche im Urlaub, sonst hätte sie dich schon längst mit Gummibärchen begrüßt. Sie hat immer eine Tüte auf dem Tisch.“", "„Gummibärchen am Arbeitsplatz? Das gefällt mir.“", "„Aber Achtung: Wer sich bedient, bringt nächstes Mal eine neue Tüte mit. Das ist das Gesetz der Abteilung.“", "Sie gehen weiter in eine kleine Küche mit Kühlschrank und Kaffeemaschine.", "„Hier ist die Kaffeeküche. Kaffee, Tee, Wasser – bedien dich einfach. Nur eine Sache musst du kennen: die Kaffeekasse.“", "„Kaffeekasse? Wie funktioniert die denn?“", "„Ganz einfach: Jeder wirft pro Monat fünf Euro rein, und davon kaufen wir Kaffee und Milch. Freiwillig, aber fast alle machen mit.“", "„Klar, bin ich dabei. Fünf Euro sind fair.“", "„Und wenn die Milch alle ist, schreibt man's auf die Liste am Kühlschrank. Sonst gibt's jedes Mal eine Diskussion, wer schuld ist.“", "Mehmet lacht. Die Stimmung im Büro gefällt ihm jetzt schon.", "„Gehst du mittags eigentlich mit in die Kantine? Wir gehen meistens so gegen halb eins zusammen runter.“", "„Gern. Ist das Essen gut?“", "„Geht so. Montags gibt's Currywurst, die ist okay. Freitags nimmst du lieber was Vegetarisches, glaub mir einfach.“", "„Gut zu wissen. Danke für den Tipp.“", "„Und noch etwas“, sagt Steffi leiser. „Im Team duzen sich alle. Nur den Chef siezen wir. Er sagt zwar, wir dürfen ihn duzen, aber irgendwie hat sich das nie ergeben.“", "„Gut zu wissen. In meiner alten Firma haben sich alle gesiezt, sogar in der Kaffeeküche.“", "„Klingt anstrengend.“", "„War es auch. ‚Herr Yıldız, möchten Sie noch Zucker?‘ – jeden Morgen.“", "In dem Moment kommt ein Mann mittleren Alters herein, die Brille in die Haare geschoben.", "„Ah, der neue Kollege! Wagner, freut mich. Schön, dass Sie da sind. Hat Steffi Sie schon ein bisschen eingeweiht?“", "„Ja, sie war wirklich super. Ich glaub, ich find mich schon ganz gut zurecht.“", "„Perfekt. Bei Fragen einfach fragen, wir beißen nicht. Und Steffi, zeigst du ihm nachher noch das Ticketsystem?“", "„Und wenn ich etwas nicht weiß – wen frage ich zuerst?“", "„Steffi“, sagen Herr Wagner und Steffi gleichzeitig, und alle drei lachen.", "„Mach ich, Chef.“", "Am Nachmittag zeigt Steffi ihm das Ticketsystem. Mehmet schreibt sein erstes Ticket, fragt dreimal nach und bekommt jedes Mal eine geduldige Antwort.", "Als Mehmet am Abend nach Hause fährt, ist die Aufregung von morgens wie weggeblasen. Neuer Job, neue Leute – und schon jetzt das gute Gefühl, nicht mehr ganz fremd zu sein. Morgen, denkt er, findet er den Platz am Fenster bestimmt von allein."], "gl": [["aufgeregt", "nervous / excited"], ["sich legen", "(here) to subside"], ["die Besprechung", "meeting"], ["der nächstbeste", "the first available"], ["sich verlaufen", "to go to the wrong place"], ["peinlich", "embarrassing"], ["sich bedienen", "to help oneself"], ["die Kaffeekasse", "shared coffee fund"], ["freiwillig", "voluntary"], ["schuld sein", "to be at fault"], ["die Kantine", "canteen"], ["jdn. einweihen", "to show sb the ropes"], ["sich zurechtfinden", "to find one's way"], ["wir beißen nicht", "we don't bite"], ["das Ticketsystem", "ticketing system"], ["wie weggeblasen", "completely gone"], ["die Tastatur", "keyboard"], ["der Flur", "hallway / corridor"], ["duzen / siezen", "to say du / Sie"], ["die Grafikerin", "graphic designer (f.)"]], "q": [["Wie fühlt sich Mehmet am Morgen?", "Nervös und aufgeregt.", "Es ist sein erster Arbeitstag."], ["Welchen Fehler macht er zuerst?", "Er stellt sich an Tinas Platz.", "Steffi korrigiert ihn freundlich."], ["Wie funktioniert die Kaffeekasse?", "Jeder zahlt fünf Euro im Monat.", "Davon kauft das Team Kaffee und Milch."], ["Welchen Tipp gibt Steffi zur Kantine?", "Freitags lieber etwas Vegetarisches.", "Die Currywurst am Montag sei okay."], ["Wie fühlt sich Mehmet am Abend?", "Entspannt, die Aufregung ist weg.", "Er fühlt sich nicht mehr ganz fremd."]], "say": ["Ehrlich gesagt bin ich ein bisschen aufgeregt.", "Wo sitzt denn der Rest vom Team?", "Oh, Entschuldigung, wie peinlich.", "Klar, bin ich dabei.", "Danke, ich finde mich schon ganz gut zurecht."]}, {"id": 8, "title": "Das Passwort vergessen", "level": "B1", "topic": "Arbeit & IT-Support", "rt": "ca. 5 Min.", "teaser": "Nach dem Urlaub kommt Frau Okonkwo nicht mehr in den Rechner – und lernt einen Trick für sichere Passwörter.", "body": ["Lars sitzt am IT-Helpdesk, als sein Telefon klingelt. Erste Woche nach den Sommerferien – da ist erfahrungsgemäß immer besonders viel los.", "„IT-Helpdesk, Lars Hartl, guten Morgen.“", "„Guten Morgen, hier ist Frau Okonkwo aus dem Marketing. Ich komm nicht mehr in meinen Computer rein.“", "„Kein Problem, da finden wir eine Lösung. Was passiert denn genau?“", "„Ich tipp mein Passwort ein, und dann steht da immer: ‚Falsches Kennwort‘. Dabei bin ich mir so sicher.“", "„Waren Sie vielleicht länger im Urlaub? Nach ein paar Wochen muss man das Passwort oft ändern.“", "„Stimmt, ich war drei Wochen weg. Kann es wirklich daran liegen?“", "„Sehr wahrscheinlich sogar. Das Passwort läuft nach einer bestimmten Zeit ab. Dann meckert das System.“", "„Ah. Und was mach ich jetzt? Ich hab um zehn eine wichtige Präsentation.“", "„Dann setzen wir's schnell zurück. Ich muss nur kurz prüfen, ob Sie's wirklich sind. Sicherheit, Sie verstehen.“", "„Klar, fragen Sie ruhig.“", "„Nennen Sie mir bitte Ihre Personalnummer und die letzten vier Ziffern Ihrer Durchwahl.“", "„Personalnummer ist vier-vier-acht-eins-zwei, und die Durchwahl endet auf drei-drei-null-sieben.“", "„Danke, das stimmt alles überein. Ich setze Ihr Passwort jetzt zurück. Sie bekommen gleich ein Einmal-Passwort, das müssen Sie dann sofort ändern.“", "„Okay, ich warte. … Ah, da ist die E-Mail schon. Soll ich draufklicken?“", "„Genau. Melden Sie sich mit dem Einmal-Passwort an, dann fragt der Rechner nach einem neuen.“", "„Es klappt! Jetzt soll ich ein neues eingeben. Haben Sie einen Tipp?“", "„Nehmen Sie am besten einen ganzen Satz, den nur Sie kennen. ‚Mein Hund frisst gern blaue Socken‘ zum Beispiel. Lang und trotzdem leicht zu merken.“", "„Haha, blaue Socken. Das merk ich mir garantiert.“", "„Aber schreiben Sie den Satz bitte nirgends auf. Und erzählen Sie ihn auch nicht in der Kaffeeküche.“", "„Nicht mal meinem Hund?“", "„Ihr Hund darf ihn wissen. Der verrät nichts.“", "„Und wenn Sie sich oft Passwörter nicht merken können: Fragen Sie mal nach einem Passwortmanager. Der speichert alles sicher für Sie.“", "„Gute Idee. Ehrlich, ich hab für jedes Programm ein anderes und komm ständig durcheinander.“", "„Wie viele Passwörter haben Sie denn ungefähr?“", "„Puh. E-Mail, Computer, Zeiterfassung, das Grafikprogramm, das Intranet … mindestens acht. Und für jedes gelten andere Regeln. Mal mit Sonderzeichen, mal mit Zahl.“", "„Und wo bewahren Sie die auf?“", "Kurze Pause. „Ehrlich? Auf einem gelben Zettel unter der Tastatur.“", "Lars muss lachen, obwohl er es eigentlich nicht lustig findet. „Frau Okonkwo, unter der Tastatur sucht jeder zuerst. Den Zettel werfen Sie bitte heute noch weg. Versprochen?“", "„Versprochen. Ich schreddere ihn sogar.“", "„Damit sind Sie wirklich nicht allein. Genau dafür ist so ein Manager da.“", "„So, neues Passwort ist drin, und ich bin wieder im System. Sie haben mir echt den Vormittag gerettet.“", "„Gern geschehen. Und viel Erfolg nachher bei der Präsentation.“", "„Danke! Ich bin so nervös. Wenn jetzt auch noch der Beamer nicht geht …“", "„Dann rufen Sie einfach wieder an. Wir sind heute den ganzen Tag da.“", "„Danke! Und falls ich's wieder vergesse – Sie wissen ja jetzt, wie's geht.“", "„Klar. Aber mit dem Satz von eben passiert Ihnen das so schnell nicht mehr.“", "„Da haben Sie wohl recht. Blaue Socken vergisst man nicht.“", "„Eben. Einen schönen Tag noch, Frau Okonkwo.“", "„Ihnen auch, und noch mal vielen Dank.“", "Lars legt auf und tippt kurz ein Ticket: ‚Passwort nach Urlaub abgelaufen, zurückgesetzt. Gelben Zettel entsorgt.‘ Es ist schon der dritte Anruf dieser Art an diesem Morgen – und bestimmt nicht der letzte.", "Nach den Ferien, das weiß er inzwischen, sind abgelaufene Passwörter so sicher wie das Amen in der Kirche. Wer die Zeichen kennt, bleibt ruhig und löst das Problem in fünf Minuten.", "Er nimmt einen Schluck von seinem Kaffee, dann klingelt es schon wieder. Lars lächelt, atmet einmal durch und hebt ab: „IT-Helpdesk, guten Morgen …“"], "gl": [["der Helpdesk", "IT help desk"], ["das Kennwort", "password"], ["ablaufen", "to expire"], ["meckern", "to grumble / complain"], ["zurücksetzen", "to reset"], ["das Einmal-Passwort", "one-time password"], ["die Personalnummer", "staff/payroll number"], ["die Durchwahl", "(phone) extension"], ["übereinstimmen", "to match"], ["der Passwortmanager", "password manager"], ["durcheinanderkommen", "to get confused"], ["sich anmelden", "to log in"], ["garantiert", "guaranteed(ly)"], ["erfahrungsgemäß", "as experience shows"], ["so sicher wie das Amen in der Kirche", "as sure as eggs is eggs"], ["der Vormittag", "(late) morning"], ["die Präsentation", "presentation"], ["der Schluck", "sip / gulp"], ["der Haftzettel", "sticky note"], ["schreddern", "to shred"]], "q": [["Warum kommt Frau Okonkwo nicht in den Rechner?", "Ihr Passwort ist abgelaufen.", "Nach dem Urlaub verlangt das System ein neues."], ["Warum stellt Lars Sicherheitsfragen?", "Um zu prüfen, ob sie es wirklich ist.", "Er fragt Personalnummer und Durchwahl."], ["Wie läuft das Zurücksetzen ab?", "Sie bekommt ein Einmal-Passwort per E-Mail.", "Damit meldet sie sich an und wählt ein neues."], ["Welchen Tipp gibt Lars für Passwörter?", "Einen ganzen, leicht merkbaren Satz.", "Zum Beispiel „Mein Hund frisst gern blaue Socken“."], ["Was empfiehlt er bei vielen Passwörtern?", "Einen Passwortmanager.", "Der speichert alles sicher."]], "say": ["Ich komme nicht mehr in meinen Computer rein.", "Kann es daran liegen, dass ich im Urlaub war?", "Können Sie das Passwort zurücksetzen?", "Haben Sie einen Tipp für ein gutes Passwort?", "Sie haben mir echt den Vormittag gerettet."]}, {"id": 9, "title": "Krankmeldung per Telefon", "level": "B1", "topic": "Arbeit & Gesundheit", "rt": "ca. 5 Min.", "teaser": "Mit kratzigem Hals ruft Anna beim Chef an – und merkt, wie viel ein verständnisvolles Wort wert ist.", "body": ["Anna sitzt mit einer heißen Tasse Tee am Küchentisch. Ihre Nase ist komplett zu, der Hals kratzt bei jedem Schlucken. An Arbeit ist heute wirklich nicht zu denken. Sie greift zum Handy und wählt die Nummer ihres Chefs.", "„Feld, guten Morgen.“", "„Guten Morgen, Herr Feld, hier ist Anna Wenzel. Ich fühl mich leider gar nicht gut.“", "„Oh, das hört man auch. Sie klingen ja ganz schön verschnupft.“", "„Ja, ich hab mich wohl richtig erkältet. Kopf, Hals, Nase – alles dicht. Ich bleib heute besser zu Hause.“", "„Natürlich, das ist völlig in Ordnung. Kurieren Sie sich erst mal richtig aus.“", "„Danke. Ich wollte nur rechtzeitig Bescheid geben, bevor das Meeting um neun losgeht.“", "„Gut, dass Sie anrufen. Brauchen Sie denn eine Krankschreibung?“", "„Ab wann denn? Ich dachte, erst ab dem dritten Tag.“", "„Fast. Wenn Sie länger als drei Tage krank sind, brauche ich am vierten Tag eine Bescheinigung vom Arzt. Die Praxis schickt sie elektronisch an Ihre Krankenkasse, ich rufe sie dort ab. Sie müssen mir nur Bescheid sagen.“", "„Mach ich. Ich hoff ja, dass es nur so ein Zweitagesding ist.“", "„Das wünsch ich Ihnen. Sagen Sie, was ist eigentlich mit dem Angebot für Firma Krüger? Das war doch bei Ihnen.“", "„Stimmt. Das ist aber fast fertig. Es liegt im gemeinsamen Ordner unter ‚Krüger_Angebot‘. Es fehlen nur noch die Preise auf der letzten Seite.“", "„Prima. Kann das die Lea übernehmen, oder soll's liegen bleiben?“", "„Lea kennt das Projekt. Wenn sie die Preise aus der Liste von gestern einträgt, kann sie's rausschicken.“", "„Und das Meeting um neun?“, fragt Anna. „Ich sollte doch die Zahlen vom letzten Quartal vorstellen.“", "„Die Folien sind doch auch im Ordner, oder? Dann zeige ich sie selbst. Wenn Fragen kommen, schreibe ich sie auf. Die beantworten Sie, wenn Sie wieder gesund sind. Nicht vorher.“", "„Ich könnte auch von zu Hause kurz …“", "„Frau Wenzel. Nein. Wer krank ist, arbeitet nicht. Auch nicht ‚nur kurz‘. Das ist bei mir eine feste Regel.“", "Anna muss gleichzeitig husten und lachen. „Verstanden. Keine Arbeit.“", "„Alles klar, dann frag ich sie. Sie müssen sich um nichts kümmern. Hauptsache, Sie werden wieder gesund.“", "„Das ist wirklich lieb, danke. Dann meld ich mich morgen früh wieder, wie's mir geht.“", "„Machen Sie das. Und wenn's schlimmer wird, gehen Sie lieber gleich zum Arzt, nicht erst am vierten Tag.“", "„Versprochen. Ich trinke jetzt erst mal meinen Tee und leg mich wieder hin.“", "„Haben Sie denn genug Tee im Haus? Und Taschentücher?“", "„Tee ja. Taschentücher … nur noch eine halbe Packung.“", "„Dann fragen Sie Ihre Nachbarin. Oder lassen Sie sich etwas liefern. Nicht selbst zum Supermarkt laufen.“", "„Mach ich. Ich hab ja kein Fieber, nur eine sehr laute Nase.“", "„Die hört man bis hierher“, sagt Herr Feld, und Anna hört, dass er lächelt.", "„Gute Besserung, Frau Wenzel. Erholen Sie sich.“", "„Danke, Herr Feld. Bis morgen.“", "Anna legt auf und ist erleichtert. Sie hatte ein bisschen Angst gehabt, der Chef könnte genervt sein – schließlich ist heute viel zu tun. Stattdessen war er die Ruhe selbst.", "Kurz darauf piept ihr Handy. Eine Nachricht von Herrn Feld: „PS: Ihren Kundentermin um elf habe ich auf nächste Woche verschoben. Nicht antworten. Schlafen.“", "Sie schaltet das Handy auf lautlos und kuschelt sich mit der Teetasse unter die Decke. Ein verständnisvoller Chef, denkt sie, macht das Kranksein ein kleines bisschen erträglicher.", "Draußen regnet es leise gegen die Scheibe. Anna schließt die Augen. Morgen sieht die Welt bestimmt schon wieder ganz anders aus – und das Angebot für Firma Krüger ist in guten Händen.", "In der Mittagspause schreibt Lea ihr eine Nachricht: „Angebot ist raus! Gute Besserung, wir halten die Stellung.“ Anna schickt einen Daumen nach oben zurück und schläft sofort wieder ein."], "gl": [["die Krankmeldung", "calling in sick"], ["verschnupft", "having a cold / sniffly"], ["sich erkälten", "to catch a cold"], ["alles dicht", "everything blocked (nose)"], ["sich auskurieren", "to recover fully"], ["Bescheid geben", "to let sb know"], ["die Krankschreibung", "doctor's sick note"], ["länger als drei Tage", "more than three days"], ["das Zweitagesding", "(coll.) a two-day thing"], ["das Angebot", "offer / quote"], ["der gemeinsame Ordner", "shared folder"], ["übernehmen", "to take over"], ["liegen bleiben", "to be left undone"], ["sich um nichts kümmern", "not to worry about anything"], ["verständnisvoll", "understanding"], ["erträglich", "bearable"], ["sich hinlegen", "to lie down"], ["Hauptsache", "the main thing (is)"], ["die Folie", "slide"], ["die Stellung halten", "to hold the fort"]], "q": [["Warum ruft Anna ihren Chef an?", "Sie ist krank und bleibt zu Hause.", "Sie ist stark erkältet."], ["Wann braucht sie eine Krankschreibung?", "Wenn sie länger als drei Tage krank ist.", "Dann am vierten Tag; die Praxis schickt sie elektronisch an die Krankenkasse."], ["Was passiert mit dem Krüger-Angebot?", "Lea übernimmt es.", "Es fehlen nur noch die Preise."], ["Wie reagiert Herr Feld?", "Ruhig und verständnisvoll.", "Er sagt, sie solle sich auskurieren."], ["Wie fühlt sich Anna nach dem Anruf?", "Erleichtert.", "Sie hatte Angst, er sei genervt."]], "say": ["Ich fühle mich leider gar nicht gut.", "Ich bleibe heute besser zu Hause.", "Brauche ich eine Krankschreibung?", "Ich melde mich morgen früh wieder.", "Danke, das ist wirklich lieb von Ihnen."]}, {"id": 10, "title": "Feierabend um fünf", "level": "B1", "topic": "Arbeit & Grenzen", "rt": "ca. 5 Min.", "teaser": "Zwei Minuten vor Feierabend bittet ein Kollege um „nur kurz“ Hilfe – Jana findet einen fairen Mittelweg.", "body": ["Es ist zwei vor fünf. Jana fährt den Rechner herunter und greift nach ihrer Jacke. Da taucht Bert an ihrem Schreibtisch auf, einen Stapel Papier in der Hand.", "„Du, Jana, hast du noch kurz zehn Minuten? Ich komm mit der Tabelle einfach nicht klar.“", "„Oh, Bert … eigentlich wollt ich gerade los. Mein Zug fährt um Viertel nach.“", "„Ach, komm, nur ganz kurz. Du kennst dich mit den Formeln doch so gut aus.“", "„Das schon, aber ‚nur kurz‘ wird bei so was erfahrungsgemäß eine halbe Stunde.“", "„Diesmal wirklich nicht, versprochen. Mir fehlt bloß diese eine Summe unten.“", "„Bert, das hast du letzten Donnerstag auch gesagt. Da bin ich um sechs gegangen.“", "„Echt? Oh. Stimmt. Das war die Sache mit den Diagrammen.“", "„Genau die. Und mein Zug war weg, und ich stand vierzig Minuten im Regen am Bahnhof.“", "„Okay, okay. Ich bin schuldig.“", "Jana zögert, dann beugt sie sich noch mal über den Bildschirm.", "„Zeig mal her. … Ah, ich seh schon. Das ist nicht in zehn Minuten getan, Bert. Da stimmt die ganze Spalte nicht.“", "„Echt? Mist. Und ich muss das bis morgen früh abgeben.“", "„Bis morgen früh? Dann haben wir ja Zeit. Pass auf: Ich schaff's heute wirklich nicht mehr, ich bin verabredet.“", "„Verabredet? Mit wem denn, wenn ich fragen darf?“", "„Mit meiner Schwester. Sie hat heute Geburtstag, und ich hab versprochen, dass ich um sieben mit Kuchen vor der Tür stehe. Wenn ich zu spät komme, erzählt sie das noch an Weihnachten.“", "„Dann geh lieber. Mit Schwestern ist nicht zu spaßen. Ich hab drei.“", "„Drei? Dann weißt du ja, wovon ich rede.“", "„Und wie. Grüß sie schön von mir.“", "„Hm. Und was mach ich jetzt bloß?“", "„Wir machen's morgen gleich als Erstes. Ich bin um acht da, dann setzen wir uns eine halbe Stunde zusammen. Bis neun ist das sauber, und du gibst es locker rechtzeitig ab.“", "„Meinst du, das reicht?“", "„Klar reicht das. Eine halbe Stunde mit klarem Kopf ist mehr wert als eine Stunde um fünf, wenn wir beide schon durch sind.“", "„Und ehrlich gesagt mache ich um diese Uhrzeit selbst Fehler. Dann suchen wir morgen meine Fehler statt deine.“", "„Da ist was dran. Ich will dich auch gar nicht aufhalten, wenn du was vorhast.“", "„Danke, dass du's verstehst. Es ist nicht so, dass ich nicht helfen will – ich will's morgen nur besser machen.“", "„Nee, passt schon. Ich war ein bisschen in Panik, deswegen hab ich dich so überfallen.“", "„Kenn ich. Aber Panik ist ein schlechter Ratgeber. Markier dir die Stellen, die dir komisch vorkommen, dann sind wir morgen noch schneller.“", "„Und noch ein Tipp: Wenn du morgen vor mir da bist, mach schon mal Kaffee. Dann rechne ich doppelt so schnell.“", "„Deal. Zwei Tassen, schwarz, mit einem Keks.“", "„Siehst du, du kennst mich schon.“", "„Gute Idee. Mach ich. Dann einen schönen Feierabend, Jana. Und sorry wegen vorhin.“", "„Kein Thema. Bis morgen um acht. Und lass die Tabelle für heute einfach Tabelle sein.“", "Jana nimmt ihre Tasche und geht Richtung Ausgang. Im Treppenhaus schaut sie noch mal auf die Uhr: gerade genug Zeit für den Zug. Am Bahnhof holt sie beim Bäcker noch schnell einen Käsekuchen für ihre Schwester.", "Im Zug lehnt sie den Kopf ans Fenster und lächelt. Sie hat nicht Nein gesagt – nur ‚nicht jetzt‘. Das ist ein Unterschied, den sie lange nicht hinbekommen hat.", "Früher wäre sie geblieben, hätte den Zug verpasst und sich am Ende über sich selbst geärgert. Heute nicht. Und Bert, da ist sie sich sicher, wird morgen früh viel entspannter sein als heute um fünf.", "Am nächsten Morgen um acht steht auf ihrem Schreibtisch eine Tasse Kaffee, daneben ein Keks und ein Zettel: „Danke für ‚nicht jetzt‘. Bert.“ Um zwanzig nach acht ist die Tabelle fertig."], "gl": [["der Feierabend", "end of the working day"], ["nur kurz", "(coll.) just briefly"], ["mit etw. nicht klarkommen", "to not manage sth"], ["die Formel", "formula"], ["erfahrungsgemäß", "as experience shows"], ["die Spalte", "column"], ["abgeben", "to hand in"], ["verabredet sein", "to have plans / a date"], ["aufhalten", "to hold sb up"], ["jdn. überfallen", "(fig.) to spring sth on sb"], ["in Panik sein", "to be in a panic"], ["ein schlechter Ratgeber", "a poor adviser"], ["markieren", "to mark / highlight"], ["mit klarem Kopf", "with a clear head"], ["Kein Thema", "no problem"], ["etw. etw. sein lassen", "to leave sth be"], ["der Mittelweg", "middle ground / compromise"], ["durch sein", "(coll.) to be worn out"], ["schuldig", "guilty"], ["der Keks", "biscuit / cookie"]], "q": [["Worum bittet Bert kurz vor fünf?", "Um kurze Hilfe mit einer Tabelle.", "Ihm fehlt eine Summe, so denkt er."], ["Warum kann Jana nicht sofort helfen?", "Sie ist verabredet und muss zum Zug.", "Das Problem ist größer als zehn Minuten."], ["Welchen Kompromiss schlägt sie vor?", "Morgen früh um acht gemeinsam eine halbe Stunde.", "Mit klarem Kopf gehe es schneller."], ["Wie begründet Jana ihr Nein?", "Nicht „nein“, sondern „nicht jetzt“.", "Sie will morgen besser helfen."], ["Was lernt die Geschichte über Grenzen?", "Grenzen setzen ist nicht unfreundlich.", "Manchmal ist „morgen“ die bessere Hilfe."]], "say": ["Eigentlich wollte ich gerade los.", "Das ist nicht in zehn Minuten getan.", "Ich schaffe es heute wirklich nicht mehr.", "Wir machen es morgen gleich als Erstes.", "Danke, dass du es verstehst."]}, {"id": 11, "title": "Führerschein umtauschen", "level": "B1", "topic": "Behörden & Verkehr", "rt": "ca. 5 Min.", "teaser": "Nadia soll ihren alten „grauen Lappen“ umtauschen – und stolpert prompt über das vergessene Passfoto.", "body": ["Nadia hält einen alten grauen Führerschein in der Hand, als sie die Führerscheinstelle betritt. Ein Mitarbeiter winkt sie zu seinem Schreibtisch.", "„Guten Tag, was kann ich für Sie tun?“", "„Guten Tag. Meine Kollegin hat gesagt, ich muss meinen Führerschein umtauschen. Stimmt das?“", "„Zeigen Sie mal her. … Ah, der graue Lappen. Ja, der muss tatsächlich umgetauscht werden.“", "„‚Grauer Lappen‘ – so nennt man das wirklich?“", "„Und wieso eigentlich ‚Lappen‘?“", "„Weil er aus Papier ist und nach dreißig Jahren im Portemonnaie aussieht wie ein alter Putzlappen. Schauen Sie mal: Da ist sogar ein Kaffeefleck drauf.“", "„Der ist von 1998. Eine Raststätte bei Ulm.“", "„Sehen Sie. Ein Stück Geschichte.“", "„So sagt man, ja. Die alten Papierführerscheine werden alle nach und nach gegen EU-Kartenführerscheine getauscht. Je nach Geburtsjahr zu verschiedenen Fristen.“", "„Und wann ist meine Frist?“", "„Beim grauen Lappen ist sie leider schon abgelaufen – im Januar 2025. Wenn Sie damit in eine Kontrolle kommen, kostet das zehn Euro Verwarnungsgeld. Fahren dürfen Sie aber weiterhin.“", "„Zehn Euro? Na, dann lieber jetzt. Was brauchen Sie denn alles von mir?“", "„Ihren Personalausweis, ein aktuelles biometrisches Passfoto und den alten Führerschein. Haben Sie ein Foto dabei?“", "„Ein Foto … nein, das hab ich glatt vergessen. Mist.“", "„Kein Drama. Gleich um die Ecke ist ein Automat, da können Sie welche machen. Biometrisch, bitte, nicht das Urlaubsfoto.“", "Nadia muss lachen.", "„Verstanden, kein Strandfoto. Und wenn ich das Foto hab, geht's dann sofort?“", "„Dann nehme ich Ihren Antrag auf. Der neue Führerschein kommt aber nicht sofort, der wird extra gedruckt. In etwa drei bis vier Wochen können Sie ihn abholen.“", "„Drei bis vier Wochen? Und bis dahin? Darf ich noch fahren?“", "„Natürlich. Ihr alter gilt, bis der neue da ist. Sie kriegen nur Bescheid, wenn er fertig ist.“", "„Ah, gut. Ich dachte schon, ich müsste jetzt überall zu Fuß hin.“", "„Und brauche ich für den neuen eine neue Prüfung? Ich hab seit Jahren keine Theorie mehr gelernt.“", "„Nein, keine Sorge“, lacht der Mitarbeiter. „Es ist nur ein Umtausch. Ihre Fahrerlaubnis bleibt, nur das Dokument ist neu. Der Kartenführerschein gilt fünfzehn Jahre, danach tauschen Sie ihn einfach wieder um.“", "„Und dann wieder mit Prüfung?“", "„Nein. Dann nur mit einem neuen Foto.“", "„Keine Sorge. Holen Sie das Foto, dann machen wir den Rest in fünf Minuten.“", "Nadia geht kurz hinaus und kommt mit einem Streifen frischer Fotos zurück.", "„So, hier sind die Fotos. Gleich zehn Stück, ich brauch wohl nur eins?“", "„Eins reicht. Die anderen neun kleben Sie dann zu Hause ins Album.“", "„Sehr witzig. Also, hier bitte.“", "„Ihr Foto ist übrigens gut geworden. Biometrisch und trotzdem freundlich. Das schafft nicht jeder.“", "„Danke. Ich hab dreimal gedrückt, bis ich nicht mehr wie eine Verbrecherin ausgesehen hab.“", "„Danke. Unterschreiben Sie bitte hier … und hier. Die Gebühr beträgt fünfundzwanzig Euro dreißig, bar oder mit Karte.“", "„Mit Karte, bitte. … So. Und dann krieg ich Post?“", "„Genau. Sobald der Führerschein da ist, schicken wir Ihnen eine Benachrichtigung. Dann kommen Sie vorbei, bringen den alten mit und tauschen ihn ein.“", "„Super, das war ja viel einfacher als gedacht. Danke für die Geduld.“", "„Gern. Und denken Sie dran: beim nächsten Behördengang das Foto gleich mitbringen.“", "Nadia lacht und verspricht es. Draußen steckt sie den grauen Lappen noch einmal zurück ins Portemonnaie – zum letzten Mal, bevor er bald ausgedient hat.", "Auf dem Weg zum Bus denkt sie: So ein Amt ist halb so wild, wenn man weiß, was man braucht. Nur das mit dem Passfoto, das schreibt sie sich jetzt wirklich hinter die Ohren.", "Zu Hause zeigt sie ihrem Mann die übrigen neun Fotos. „Für unser Album“, sagt sie. Er lacht. „Endlich mal ein Foto, auf dem du ernst schaust.“"], "gl": [["der Führerschein", "driving licence"], ["umtauschen", "to exchange / swap"], ["der graue Lappen", "(coll.) old paper licence"], ["der EU-Kartenführerschein", "EU card licence"], ["die Frist", "deadline"], ["ablaufen", "to expire"], ["biometrisch", "biometric"], ["das Passfoto", "passport photo"], ["der Antrag", "application"], ["aufnehmen", "(here) to process / take down"], ["abholen", "to pick up"], ["Bescheid kriegen", "to be notified"], ["die Gebühr", "fee"], ["die Benachrichtigung", "notification"], ["der Behördengang", "trip to an office"], ["halb so wild", "not so bad"], ["sich etw. hinter die Ohren schreiben", "to note sth well"], ["ausgedient haben", "to have served its time"], ["das Verwarnungsgeld", "(small) fine / caution money"], ["die Fahrerlaubnis", "driving licence (the permission)"]], "q": [["Warum ist Nadia bei der Führerscheinstelle?", "Sie muss ihren alten Führerschein umtauschen.", "Ihre Kollegin hat sie erinnert – die Frist ist sogar schon abgelaufen."], ["Was hat sie vergessen?", "Ein biometrisches Passfoto.", "Sie holt es am Automaten um die Ecke."], ["Darf sie bis zum neuen Führerschein fahren?", "Ja, der alte gilt bis dahin.", "Der neue wird erst gedruckt."], ["Wie lange dauert es und was kostet es?", "Drei bis vier Wochen, 25,30 Euro.", "Danach kommt eine Benachrichtigung."], ["Was nimmt sich Nadia am Ende vor?", "Beim nächsten Mal das Foto mitbringen.", "Sie schreibt es sich hinter die Ohren."]], "say": ["Ich muss meinen Führerschein umtauschen.", "Was brauchen Sie denn alles von mir?", "Darf ich bis dahin noch fahren?", "Das war viel einfacher als gedacht.", "Danke für Ihre Geduld."]}, {"id": 12, "title": "Der verlorene Personalausweis", "level": "B1", "topic": "Behörden & Alltag", "rt": "ca. 5 Min.", "teaser": "Panisch meldet Paul seinen verlorenen Ausweis – und ein vorläufiges Dokument rettet seinen Flug.", "body": ["Paul durchwühlt zum dritten Mal seine Jackentaschen. Kein Personalausweis. Er ist sich ganz sicher: Gestern in der Bahn war er noch da, heute ist er wie vom Erdboden verschluckt. Also geht er schnurstracks zum Bürgeramt.", "„Guten Tag, ich glaub, ich hab meinen Personalausweis verloren.“", "„Guten Tag. Das ist ärgerlich, aber kein Weltuntergang. Wissen Sie ungefähr, wo?“", "„Vermutlich in der S-Bahn. Ich hab schon beim Fundbüro angerufen, aber da ist nichts abgegeben worden.“", "„Und bei den Verkehrsbetrieben? Die haben ein eigenes Fundbüro.“", "„Da hab ich heute Morgen angerufen. Fundsachen kommen dort manchmal erst nach ein, zwei Tagen an, sagen sie.“", "„Dann fragen Sie in ein paar Tagen noch mal. Falls er auftaucht, bringen Sie ihn bitte her. Dann wird er entwertet.“", "„Dann machen wir zweierlei: Wir melden den alten als verloren, und Sie beantragen gleich einen neuen. Einverstanden?“", "„Ja, klar. Muss ich den alten irgendwie sperren lassen?“", "„Gute Frage. Falls die Online-Funktion aktiv war, sperren wir die sicherheitshalber. Dann kann niemand damit Unfug treiben.“", "„Online-Funktion … ehrlich gesagt weiß ich gar nicht, ob ich die je benutzt hab.“", "„Macht nichts, wir sperren sie trotzdem. Lieber einmal zu viel als einmal zu wenig.“", "„Okay. Und was brauchen Sie sonst noch von mir?“", "„Ein biometrisches Foto und Ihren Reisepass oder die Geburtsurkunde, falls Sie sie dabeihaben. Die Meldeadresse haben wir ja im System.“", "„Einen Reisepass hab ich nicht. Aber die Geburtsurkunde hab ich zum Glück eingesteckt. Und ein Foto … nein, das hab ich nicht.“", "„Kein Problem. Das Foto machen wir hier direkt am Terminal im Flur. Papierfotos nehmen wir sowieso nicht mehr an, nur noch digitale.“", "Paul stellt sich vor das Terminal im Flur, schaut ernst in die Kamera und drückt auf „Fertig“.", "„So, das Foto ist gemacht. Ich hab versucht, nicht wie ein Bankräuber zu gucken.“", "„Perfekt. Ich nehme den Antrag auf. Der neue Ausweis dauert etwa zwei bis drei Wochen.“", "„Zwei, drei Wochen? Dumm nur, dass ich nächste Woche fliege. Ohne Ausweis komm ich doch gar nicht durch die Kontrolle.“", "„Dafür gibt's eine Lösung: einen vorläufigen Personalausweis. Den kriegen Sie heute sofort mit.“", "„Im Ernst? Das wäre die Rettung. Gilt der denn fürs Fliegen?“", "„Innerhalb der EU ja. Wo fliegen Sie denn hin?“", "„Nach Spanien, zu meiner Schwester.“", "„Dann passt das. Spanien ist in der EU, da reicht der vorläufige Ausweis völlig.“", "„Und wie lange gilt der vorläufige?“", "„Höchstens drei Monate. Bis dahin ist der neue längst da.“", "„Und meine PIN für die Online-Funktion?“", "„Die kommt mit einem eigenen Brief, ein paar Tage vor dem Ausweis. Bewahren Sie den gut auf – und bitte nicht in der Jackentasche.“", "Paul grinst schuldbewusst. „Ich hab’s verstanden.“", "„Puh, ein Glück. Was kostet mich der ganze Spaß?“", "„Der neue Ausweis sechsundvierzig Euro, der vorläufige zehn und das Foto am Terminal sechs. Zusammen also zweiundsechzig.“", "„Geht in Ordnung. Hauptsache, ich komm in den Flieger.“", "Paul bezahlt, und wenig später hält er den vorläufigen Ausweis in der Hand.", "„So, hier ist Ihr vorläufiger Ausweis. Und sobald der richtige da ist, bekommen Sie Post.“", "„Vielen Dank. Ehrlich, ich kam total nervös rein und geh jetzt ganz beruhigt wieder.“", "„Dafür sind wir ja da. Und tun Sie mir einen Gefallen: Stecken Sie den neuen in ein festes Fach, nicht lose in die Jacke.“", "„Gibt es eigentlich so eine Hülle zum Umhängen?“", "„Im Schreibwarenladen gegenüber. Kostet drei Euro und spart Ihnen beim nächsten Mal zweiundsechzig.“", "„Versprochen. Nie wieder lose in die Jackentasche.“", "Auf dem Weg nach draußen klopft Paul vorsichtshalber noch einmal auf seine Brusttasche. Diesmal ist alles da. Und der Flug nach Spanien ist gerettet.", "Am Abend schreibt er seiner Schwester: „Komme wie geplant. Mit einem Ausweis, der aussieht wie aus Papier, aber funktioniert.“ Sie antwortet mit drei lachenden Smileys und einem Foto vom Strand."], "gl": [["der Personalausweis", "national ID card"], ["durchwühlen", "to rummage through"], ["wie vom Erdboden verschluckt", "vanished into thin air"], ["schnurstracks", "straight / directly"], ["das Fundbüro", "lost and found office"], ["sperren lassen", "to have sth blocked"], ["sicherheitshalber", "to be on the safe side"], ["Unfug treiben", "to get up to mischief"], ["die Geburtsurkunde", "birth certificate"], ["der vorläufige Ausweis", "temporary ID card"], ["die Kontrolle", "(security) check"], ["gelten", "to be valid"], ["die Gebühr", "fee"], ["beruhigt", "reassured / calm"], ["einen Gefallen tun", "to do a favour"], ["ein festes Fach", "a secure compartment"], ["lose", "loose"], ["vorsichtshalber", "just to be safe"], ["entwerten", "to invalidate"], ["die Hülle", "sleeve / holder"]], "q": [["Was hat Paul verloren?", "Seinen Personalausweis.", "Vermutlich in der S-Bahn."], ["Was macht das Bürgeramt zuerst?", "Den alten Ausweis melden und sperren.", "Damit niemand Unfug treibt."], ["Welches Problem hat Paul mit dem Timing?", "Er fliegt nächste Woche nach Spanien.", "Der neue Ausweis dauert zwei bis drei Wochen."], ["Wie wird das Problem gelöst?", "Mit einem vorläufigen Personalausweis.", "Der gilt innerhalb der EU."], ["Was nimmt sich Paul für die Zukunft vor?", "Den Ausweis sicher zu verstauen.", "Nicht mehr lose in die Jacke."]], "say": ["Ich glaube, ich habe meinen Ausweis verloren.", "Muss ich den alten sperren lassen?", "Ich fliege aber nächste Woche.", "Gilt der vorläufige Ausweis fürs Fliegen?", "Ich kam nervös rein und gehe ganz beruhigt wieder."]}, {"id": 13, "title": "Nachtruhe ab zehn", "level": "B1", "topic": "Nachbarn & Wohnen", "rt": "ca. 5 Min.", "teaser": "Statt eines wütenden Zettels klopft Herr Degen einfach an – und aus Ärger wird fast eine Einladung.", "body": ["Es ist kurz nach zehn an einem Dienstagabend. Bei Lisa läuft Musik, nicht laut, findet sie – aber da klopft es an der Tür. Davor steht Herr Degen von unten, im Bademantel.", "„'n Abend, Herr Degen. Ist was?“", "„Guten Abend, Lisa. Sagen Sie, könnten Sie die Musik vielleicht ein bisschen leiser machen? Es ist schon nach zehn.“", "„Oh. Ist es wirklich so laut? Ich hab gar nicht auf die Uhr geschaut.“", "„Na ja, bei mir im Schlafzimmer wummert der Bass durch die Decke. Und ich muss morgen früh raus.“", "„Morgen früh? Wann müssen Sie denn raus?“", "„Um halb fünf. Ich bin Bäcker. Die ersten Brezeln müssen um sechs im Laden sein.“", "„Um halb fünf? Oh Gott. Da schlafe ich noch tief und fest.“", "„Ich weiß. Um die Zeit ist im ganzen Haus nur meine Kaffeemaschine wach.“", "„Das tut mir echt leid. Ich dreh sofort runter.“", "Lisa geht kurz rein und stellt die Musik leiser.", "„So besser?“", "„Viel besser, danke. Ab zehn ist ja Nachtruhe, wissen Sie. Da wird man schnell zum Spielverderber, ich weiß.“", "„Nein, nein, Sie haben völlig recht. Ich war's, die nicht aufgepasst hat.“", "„Ich will auch gar keinen Ärger. Ich klopf lieber einmal, bevor ich mich die halbe Nacht im Bett ärgere.“", "„Das ist mir sowieso viel lieber, als wenn Sie gleich zum Vermieter rennen.“", "„Ach wo, so bin ich nicht. Unter Nachbarn redet man doch erst mal miteinander.“", "„Finde ich auch. … Darf ich fragen – stört Sie die Musik öfter? Dann pass ich in Zukunft besser auf.“", "„Ehrlich gesagt nur abends. Tagsüber hör ich eh nichts, da bin ich auf der Arbeit.“", "„Und am Wochenende?“", "„Samstag backe ich auch. Nur der Sonntag ist frei. Da dürfen Sie meinetwegen tanzen, bis die Decke wackelt – aber bitte erst nach dem Mittagessen. Bis drei ist Mittagsruhe, steht jedenfalls in der Hausordnung.“", "„Mittagsruhe gibt’s auch? Ich lerne heute echt viel.“", "„Willkommen im Mietshaus“, sagt Herr Degen und lacht leise.", "„Dann machen wir's so: Nach zehn setz ich einfach die Kopfhörer auf. Dann hab ich meine Musik und Sie Ihre Ruhe.“", "„Das wär wirklich nett. Dann sind wir beide glücklich.“", "„Und wenn ich es doch mal vergesse, klopfen Sie einfach wieder. Ich bin Ihnen nicht böse.“", "Lisa kommt plötzlich eine Idee.", "„Wissen Sie was? Ich hab am Samstag ein paar Freunde da. Nichts Wildes, aber es könnte lauter werden. Kommen Sie doch einfach kurz vorbei, dann stört's Sie nicht, weil Sie ja dabei sind.“", "Herr Degen lacht.", "„Mich? Zu einer Studentenparty? Da wär ich ja der Opa vom Dienst.“", "„Quatsch. Auf ein Getränk, nur zum Kennenlernen. Und danach wissen Sie wenigstens, wer da eigentlich über Ihnen wohnt.“", "„Na gut, auf ein Glas vielleicht. Aber nur, wenn's wirklich recht ist.“", "„Und was soll ich mitbringen?“", "„Gar nichts. Oder … na ja, wenn Sie schon Bäcker sind …“", "„Ah, jetzt verstehe ich die Einladung“, sagt Herr Degen und grinst. „Ein Blech Butterbrezeln. Aber nur, wenn um zehn wirklich Schluss ist.“", "„Klar ist es recht. Und ich verspreche: um zehn mach ich leiser – auch am Samstag.“", "„Abgemacht. Dann gute Nacht, Lisa. Und danke fürs Verständnis.“", "„Gute Nacht, Herr Degen. Schlafen Sie gut.“", "Lisa macht die Tür zu und setzt sich die Kopfhörer auf. Diesmal hört die Musik nur sie allein.", "Und unten, das weiß sie jetzt, schläft ein Nachbar, der lieber einmal freundlich klopft, als wütend einen Zettel zu schreiben. Aus einem kleinen Ärgernis ist fast eine Einladung geworden – besser hätte der Abend kaum enden können.", "Am Samstag steht Herr Degen um acht vor der Tür, im Hemd statt im Bademantel, mit einem Blech duftender Butterbrezeln. Um zehn ist die Musik leise. Und um halb elf ist er der Letzte, der nach Hause geht."], "gl": [["die Nachtruhe", "(legally protected) quiet hours at night"], ["der Bademantel", "dressing gown"], ["wummern", "to boom / throb (bass)"], ["die Decke", "(here) ceiling"], ["leiser machen", "to turn down"], ["runterdrehen", "(coll.) to turn down"], ["der Spielverderber", "spoilsport"], ["aufpassen", "to pay attention"], ["der Ärger", "trouble / annoyance"], ["der Vermieter", "landlord"], ["die Kopfhörer", "headphones"], ["der Opa vom Dienst", "(coll.) the token old man"], ["Quatsch", "nonsense"], ["zum Kennenlernen", "to get to know each other"], ["Abgemacht", "agreed / it's a deal"], ["das Verständnis", "understanding"], ["das Ärgernis", "nuisance"], ["Nichts Wildes", "nothing crazy"], ["der Bäcker", "baker"], ["die Mittagsruhe", "midday quiet hours"]], "q": [["Warum klopft Herr Degen bei Lisa?", "Die Musik ist nach zehn zu laut.", "Der Bass wummert durch die Decke."], ["Wie reagiert Lisa?", "Sie entschuldigt sich und dreht leiser.", "Sie hatte nicht auf die Uhr geschaut."], ["Warum klopft Herr Degen, statt sich zu beschweren?", "Unter Nachbarn redet man miteinander.", "Er will keinen Ärger und keinen Vermieter."], ["Welche Lösung findet Lisa für die Zukunft?", "Nach zehn Kopfhörer aufsetzen.", "So haben beide, was sie wollen."], ["Wie endet der Abend überraschend?", "Lisa lädt Herrn Degen zur Feier ein.", "Aus Ärger wird fast eine Einladung."]], "say": ["Könnten Sie die Musik etwas leiser machen?", "Das tut mir leid, ich drehe sofort runter.", "Ab zehn ist ja Nachtruhe.", "Ich setze nach zehn einfach die Kopfhörer auf.", "Danke fürs Verständnis, gute Nacht."]}, {"id": 14, "title": "Der Umzug", "level": "B1", "topic": "Wohnen & Freunde", "rt": "ca. 6 Min.", "teaser": "Das neue Sofa passt partout nicht ums Treppenhaus – bis ein Nachbar einen überraschenden Tipp hat.", "body": ["Es ist Samstag, kurz nach neun. Vor dem Mehrfamilienhaus steht ein gemieteter Transporter. Lukas zieht heute in den zweiten Stock, und drei Freunde helfen ihm beim Schleppen.", "„So, Leute, das Sofa ist das letzte große Teil. Dann haben wir's gleich geschafft!“", "„Sag das bloß nicht zu früh“, stöhnt Can. „Das Ding ist schwer wie ein Klavier.“", "„Jetzt stell dich mal nicht so an. Zu viert kriegen wir das locker hoch.“", "„Na gut. Aber wenn ich morgen Rücken habe, lädst du mich zum Essen ein, gell?“", "„Versprochen. Pizza für alle, so viel ihr wollt. Und Getränke natürlich auch.“", "„Das lass ich mir gefallen. Also, wo soll ich anpacken?“", "„Du nimmst vorne die linke Ecke, Fabio rechts. Can und ich tragen hinten.“", "„Und wer passt auf, dass wir keine Wand ramponieren?“", "„Keiner. Wir sind einfach vorsichtig. Also los.“", "Sie packen an. Das Sofa ist riesig, ein richtiges Monster aus dem Möbelhaus. Im Erdgeschoss geht noch alles glatt.", "„Langsam, langsam … die erste Kurve kommt. Can, dreh mal nach links.“", "„Ich dreh ja schon. Fabio, heb deine Seite höher!“", "„Ich heb so hoch ich kann! Das passt doch nie um die Ecke.“", "„Doch, das wird schon. Noch ein Stück … und … oh.“", "Am Treppenabsatz im ersten Stock bleibt das Sofa stecken. Es geht weder vor noch zurück.", "„Na super“, keucht Lukas. „Jetzt steckt es fest. Komplett.“", "„Hab ich doch gleich gesagt. Das ist zu breit für die Kurve.“", "„Jammer nicht, denk lieber mit. Vielleicht kriegen wir es irgendwie gedreht.“", "„Ich kann nicht mehr, meine Finger rutschen. Lasst uns kurz absetzen.“", "„Okay, absetzen. Aber vorsichtig, nicht auf die Füße.“", "Sie stellen das Sofa ab und schnaufen. Keiner hat eine Idee. In diesem Moment geht eine Wohnungstür auf.", "Ein älterer Mann im Jogginganzug schaut heraus und mustert die Szene in aller Ruhe.", "„Grüß Gott, die Herren. Soll ich euch m
