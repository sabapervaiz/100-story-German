al einen Tipp geben?“", "„Sehr gern“, sagt Lukas. „Wir sind nämlich grad ein bisschen ratlos.“", "„Also: Stellt das Sofa hochkant. Senkrecht, nicht waagerecht. Und hängt oben die Wohnungstür aus, dann habt ihr mehr Platz.“", "„Die Tür aushängen? Geht das denn so einfach?“", "„Klar. Zwei Stifte raus, Tür ab, fertig. Ich helf euch, Moment. Ich hol nur schnell einen Hammer.“", "„Das ist jetzt echt nett. Wir wollten Sie gar nicht stören.“", "„Stören? Ihr steht seit zehn Minuten in meinem Treppenhaus und flucht. Da helf ich lieber mit.“", "Der Mann kommt in Hausschuhen heraus und packt mit an, als wäre es sein eigener Umzug.", "„So, die Tür ist ausgehängt. Und jetzt alle zusammen – hoch damit. Auf drei. Eins, zwei, drei!“", "Das Sofa dreht sich langsam senkrecht. Plötzlich gleitet es um die Ecke, als hätte es nie ein Problem gegeben.", "„Ja, Wahnsinn! Wie machen Sie das? Sind Sie vom Fach?“", "„Könnte man sagen. Ich hab vierzig Jahre für eine Spedition gearbeitet. Möbel schleppen kann ich im Schlaf.“", "„Das sieht man. Ohne Sie würden wir heut Abend noch hier stehen.“", "„Ach was. Man muss nur wissen, wie. Mit roher Kraft kommt man nicht weit, mit Köpfchen schon.“", "„Das schreib ich mir hinter die Ohren.“", "Oben angekommen, tragen sie das Sofa in die Wohnung und stellen es in die Mitte vom Wohnzimmer.", "Alle lassen sich erschöpft hineinfallen. Das Sofa knarzt, hält aber.", "„So, Nachbar, als Dank: Bleiben Sie zum Essen? Es gibt gleich Pizza.“", "„Ach, das muss doch nicht sein. Ihr habt doch selber Hunger.“", "„Doch, doch. Sie haben uns gerettet. Ohne Sie läge das Sofa noch im ersten Stock.“", "„Na gut, überredet. Aber nur ein Stück. Und beim nächsten Umzug fragt ihr mich vorher, verstanden?“", "„Abgemacht. Und willkommen im Haus – also eigentlich sind ja wir die Neuen.“", "Der Mann lacht. „Passt schon. Hauptsache, das Sofa steht. Die Tür hängen wir nachher wieder ein, keine Sorge.“", "„Und wie heißen Sie eigentlich, wenn ich fragen darf?“", "„Haller. Erich Haller, zweite Tür links. Und wenn mal was ist – einfach klingeln.“", "„Mach ich, Herr Haller. Und danke noch mal. Ehrlich.“", "„Schon gut. So, wo ist jetzt die Pizza? Tragen macht nämlich hungrig.“"], "gl": [["umziehen", "to move house"], ["der Transporter", "van"], ["sich anstellen", "to make a fuss"], ["locker", "easily"], ["gell", "right? (southern)"], ["schwer wie ein Klavier", "very heavy (idiom)"], ["keuchen", "to pant"], ["feststecken", "to be stuck"], ["jammern", "to moan"], ["ratlos", "clueless"], ["hochkant", "on end / upright"], ["die Tür aushängen", "to take the door off its hinges"], ["der Stift", "pin (of a hinge)"], ["vom Fach sein", "to be an expert"], ["die Spedition", "haulage firm"], ["mit Köpfchen", "using one's head"], ["sich etw. hinter die Ohren schreiben", "to take sth to heart (idiom)"], ["erschöpft", "exhausted"], ["überredet", "talked into it"], ["abgemacht", "it's a deal"]], "q": [["Warum helfen die Freunde Lukas?", "Er zieht in den zweiten Stock um.", "Sie tragen seine Möbel, u. a. das Sofa."], ["Was ist das Problem im Treppenhaus?", "Das Sofa bleibt an der Kurve stecken.", "Es ist zu breit für die Ecke."], ["Welchen Tipp gibt der Nachbar?", "Hochkant stellen und die Tür aushängen.", "So entsteht mehr Platz."], ["Warum kann er so gut helfen?", "Er war 40 Jahre bei einer Spedition.", "Er ist Profi im Möbeltragen."], ["Wie bedanken sich die Freunde?", "Sie laden Herrn Haller zum Essen ein.", "Als Dank fürs Helfen."]], "say": ["Zu viert kriegen wir das locker hoch.", "Jammer nicht, denk lieber mit.", "Soll ich euch mal einen Tipp geben?", "Ohne Sie würden wir noch hier stehen.", "Beim nächsten Umzug fragt ihr mich vorher."]}, {"id": 15, "title": "Der Paketdienst und der Nachbar", "level": "B1", "topic": "Nachbarn & Alltag", "rt": "ca. 6 Min.", "teaser": "Ein Paket liegt beim mürrischen Nachbarn – und aus dem Ärger wird fast eine kleine Freundschaft.", "body": ["Mara ist erst vor zwei Wochen eingezogen. Heute klebt ein gelber Zettel an ihrer Tür: „Paket beim Nachbarn abgegeben – Herr Scholz, Erdgeschoss.“", "Sie geht runter und klingelt. Eine Weile passiert nichts. Dann öffnet ein großer Mann mit Brille die Tür, nicht gerade freundlich.", "„Ja, bitte?“", "„Guten Tag, ich bin die Neue aus dem dritten Stock. Der Bote hat angeblich ein Paket für mich bei Ihnen gelassen.“", "„Ein Paket. Ja, die lassen hier ständig Pakete für die ganze Welt. Als wär ich hier die Packstation.“", "„Das tut mir leid. Ich hab's auch nicht so geplant, dass es bei Ihnen landet.“", "„Na ja. Kommen Sie halt rein, ich schau mal. Wie heißen Sie?“", "„Keles. Mara Keles.“", "„Moment.“ Herr Scholz verschwindet im Flur. Man hört ihn kramen. „Keles, Keles … hier liegt nix mit Keles.“", "„Sind Sie sicher? Auf dem Zettel steht ganz klar Ihr Name als Ablageort.“", "„Junge Frau, ich hab hier drei Pakete rumstehen, und auf keinem steht Keles. Sehen Sie selber.“", "Mara schaut auf die Pakete. Er hat recht. Keins trägt ihren Namen.", "„Komisch. Vielleicht hat der Bote sich vertan? Darf ich die Namen mal lesen?“", "„Bitte. Meier, Polat … und das dritte, das ist für mich selber.“", "„Polat? Das ist meine Nachbarin von gegenüber. Vielleicht hat der Bote da was verwechselt.“", "„Kann schon sein. Die drucken das heut so klein, da sieht ja keiner mehr was.“", "„Moment … dürfte ich kurz in das Paket von Frau Polat schauen? Also nur auf den Aufkleber?“", "„Von mir aus. Aber vorsichtig, ich will keinen Ärger mit den Nachbarn.“", "Mara dreht das Paket um. Unter dem großen Aufkleber klebt ein zweiter, kleiner. Und da steht: M. Keles.", "„Da haben wir's! Zwei Aufkleber. Der Bote hat den falschen oben draufgeklebt.“", "„Sieh mal einer an. Dann gehört das also doch Ihnen. Und ich such mir hier einen Wolf.“", "„Entschuldigung für die Mühe. Das sind nur Kopfhörer, nichts Dramatisches.“", "„Kopfhörer, aha. Na, Hauptsache, Sie haben Ihr Zeug. Ich mag's nämlich nicht, wenn Sachen rumliegen.“", "„Das versteh ich total. Wissen Sie was – ich bin tagsüber fast immer zu Hause, ich arbeite im Homeoffice.“", "„Und? Was wollen Sie mir damit sagen?“", "„Wenn mal ein Paket für Sie kommt und Sie nicht da sind, kann der Bote es ruhig bei mir lassen. Dann haben Sie Ihre Ruhe.“", "Herr Scholz schaut sie überrascht an. Zum ersten Mal wird sein Gesicht ein bisschen weicher.", "„Das … das wär tatsächlich nicht schlecht. Ich krieg nämlich dauernd was für meine Modelleisenbahn.“", "„Modelleisenbahn? Richtig mit Schienen und allem?“", "„Mit allem. Keller voll. Loks, Waggons, kleine Bäume, Häuschen. Wollen Sie mal schauen? Also, wenn Sie Zeit haben.“", "„Gern, wirklich. Meine Oma hatte früher auch eine, im Wohnzimmer unterm Tisch.“", "„Sehen Sie, dann wissen Sie ja, wie das süchtig macht.“", "„Aber jetzt bring ich erst mal meine Kopfhörer hoch, sonst steht das Paket wieder im Weg.“", "„Haha. Richtig so. Ordnung muss sein. Das sag ich meiner Frau auch immer.“", "„Dann grüßen Sie Ihre Frau von mir. Und danke, dass Sie so geduldig gesucht haben.“", "„Geduldig … na ja. Ich war erst ein bisschen brummig, geb ich zu.“", "„Ach, kein Problem. Jeder hat mal einen schlechten Moment.“", "„Übrigens, wenn Sie mal Fragen zur Gegend haben – ich wohn hier seit dreißig Jahren.“", "„Das ist gut zu wissen. Wo kauft man hier eigentlich am besten ein?“", "„Gehen Sie mittwochs auf den Markt. Frischer und billiger als jeder Supermarkt.“", "„Super Tipp, danke. Dann sieht man sich bestimmt mal dort.“", "„Bestimmt. Und … willkommen im Haus, Frau Keles. Hätt ich fast vergessen zu sagen.“", "„Danke, Herr Scholz. Das freut mich wirklich.“", "„So, und das nächste Paket, das für Sie kommt, stell ich gleich vor Ihre Tür. Versprochen.“", "„Und ich nehm Ihre Loks in Empfang. Abgemacht?“", "„Abgemacht. Ade – ich mein, schönen Tag noch.“", "Mara geht die Treppe hoch, das Paket unterm Arm, und muss lächeln. Der mürrische Nachbar war am Ende gar nicht so mürrisch."], "gl": [["mürrisch", "grumpy"], ["der Zettel", "note/slip"], ["abgeben", "to drop off"], ["die Packstation", "parcel locker"], ["kramen", "to rummage"], ["sich vertun", "to make a mistake"], ["der Aufkleber", "sticker/label"], ["verwechseln", "to mix up"], ["sich einen Wolf suchen", "to search forever (idiom)"], ["die Mühe", "effort/trouble"], ["die Kopfhörer", "headphones"], ["das Homeoffice", "working from home"], ["weich werden", "to soften up"], ["die Modelleisenbahn", "model railway"], ["die Schiene", "rail/track"], ["im Weg stehen", "to be in the way"], ["Ordnung muss sein", "there must be order (saying)"], ["brummig", "gruff/grumpy"], ["in Empfang nehmen", "to take receipt of"], ["willkommen", "welcome"]], "q": [["Warum klingelt Mara bei Herrn Scholz?", "Ein Zettel sagt, ihr Paket liege bei ihm.", "Der Bote hat es im Erdgeschoss abgegeben."], ["Warum findet er das Paket zuerst nicht?", "Auf keinem Paket steht ihr Name.", "Der Bote hat den falschen Aufkleber oben draufgeklebt."], ["Wie löst sich das Rätsel?", "Unter dem Aufkleber klebt ein zweiter mit „M. Keles“.", "Die Etiketten wurden vertauscht."], ["Was bietet Mara dem Nachbarn an?", "Pakete für ihn anzunehmen.", "Weil sie im Homeoffice fast immer da ist."], ["Wie ändert sich die Stimmung am Ende?", "Herr Scholz wird freundlich.", "Er lädt sie zur Modelleisenbahn ein und heißt sie willkommen."]], "say": ["Ich bin die Neue aus dem dritten Stock.", "Darf ich kurz auf den Aufkleber schauen?", "Entschuldigung für die Mühe.", "Ich bin tagsüber fast immer zu Hause.", "Danke, dass Sie so geduldig gesucht haben."]}, {"id": 16, "title": "Beim Zahnarzt", "level": "B1", "topic": "Gesundheit", "rt": "ca. 6 Min.", "teaser": "Deniz erwartet das Schlimmste – dabei ist sein Zahn-Drama am Ende halb so wild.", "body": ["Deniz sitzt im Wartezimmer und schwitzt. Seit Tagen zieht ein Zahn, und er hat sich endlich einen Termin geben lassen. Zahnärzte mag er überhaupt nicht.", "„Herr Aydın?“, ruft die Assistentin. „Sie können reinkommen.“", "„Schon? Ich meine … ja, klar. Komme.“", "Er setzt sich auf den großen Stuhl. Alles blinkt und piept. Dr. Vogel kommt herein und zieht sich Handschuhe an.", "„So, Herr Aydın. Was führt Sie zu mir?“", "„Ein Zahn hinten links. Der tut weh, besonders wenn ich was Kaltes trinke. Ich glaub, der ist komplett kaputt.“", "„Na, das schauen wir uns mal in Ruhe an. Machen Sie bitte den Mund auf.“", "„Muss das sein?“", "„Für einen Zahnarzt wäre es schon praktisch“, sagt Dr. Vogel und lächelt. „Keine Angst, ich tu Ihnen nicht weh.“", "Deniz macht den Mund auf. Der Arzt schaut mit einem kleinen Spiegel.", "„Hm. Aha. Ja. Tut das hier weh, wenn ich draufdrücke?“", "„Aua! Ja! Genau da!“", "„Gut. Also, die gute Nachricht: Der Zahn ist nicht kaputt. Sie haben nur ein kleines Loch. Ein Kariesloch.“", "„Nur ein Loch? Ich dachte schon, der muss raus.“", "„Um Gottes willen, nein. Da machen wir eine kleine Füllung rein, und dann ist Ruhe.“", "„Eine Füllung. Und … tut das weh?“", "„Sie kriegen eine Spritze, dann spüren Sie nichts. Ein kleiner Pieks, mehr nicht.“", "„Eine Spritze.“ Deniz wird blass. „Wissen Sie, ich bin bei sowas ein ziemlicher Angsthase.“", "„Das sind viele. Das ist überhaupt nicht schlimm. Atmen Sie einfach ruhig, und wenn was ist, heben Sie die Hand.“", "„Und wenn ich mittendrin Panik kriege?“", "„Dann machen wir eine Pause. Sie bestimmen das Tempo, nicht ich. Einverstanden?“", "„Okay. Das beruhigt mich schon mal. Ich vertrau Ihnen jetzt einfach.“", "Der Arzt gibt die Spritze. Deniz zuckt kurz, aber dann merkt er wirklich nichts mehr.", "„So, jetzt warten wir zwei Minuten, bis alles taub ist. Alles gut bei Ihnen?“", "„Überraschend gut. Das war ja gar nichts.“", "„Sehen Sie. Oft ist die Angst viel schlimmer als die Behandlung selber.“", "„Das sagt meine Frau auch immer. Jetzt muss ich ihr wohl recht geben.“", "Dr. Vogel arbeitet ruhig. Es summt ein bisschen, aber Deniz spürt keinen Schmerz. Nach zehn Minuten ist alles fertig.", "„Fertig. Sie können sich ausspülen. Die Füllung hält jetzt viele Jahre.“", "„Im Ernst, das war's? Ich hab mir das so schlimm vorgestellt.“", "„Das machen die meisten. Aber jetzt kommen Sie bitte regelmäßig zur Kontrolle, dann bleibt's auch bei Kleinigkeiten.“", "„Mach ich. Ehrlich. Ich war viel zu lange nicht hier, das war der Fehler.“", "„Wie lange denn, wenn ich fragen darf?“", "„Bestimmt vier Jahre. Ich hab's immer wieder aufgeschoben.“", "„Vier Jahre. Na, dann hatten Sie ja noch Glück, dass es nur ein kleines Loch ist.“", "„Zweimal im Jahr reicht, oder?“", "„Genau. Und einmal im Jahr eine professionelle Reinigung, dann haben wir unsere Ruhe.“", "„Noch etwas: Die Betäubung lässt in zwei Stunden nach. Bis dahin lieber nichts Heißes essen, sonst verbrennen Sie sich.“", "„Alles klar. Dann geh ich jetzt mit einem halben tauben Gesicht nach Hause.“", "„Eine Frage noch: Darf ich nachher Kaffee trinken?“", "„Kaffee ja, aber warten Sie, bis die Betäubung weg ist. Sonst kippt er Ihnen übers Kinn.“", "„Oh. Daran hätt ich gar nicht gedacht.“", "„Passiert den Besten. Und heut Abend auf der frischen Seite nur vorsichtig putzen.“", "„Verstanden. Kein heißer Kaffee, vorsichtig putzen. Ich merk es mir.“", "„Sehr gut. Sie sind ein Musterpatient, auch wenn Sie es selber nicht glauben.“", "„Danke, dass Sie so geduldig waren. Nicht jeder nimmt die Angst ernst.“", "„Gern. Und beim nächsten Mal kommen Sie hoffentlich etwas entspannter.“", "„Das versprech ich Ihnen. Bis in sechs Monaten, Herr Doktor.“", "„Bis dann, Herr Aydın. Und sagen Sie Ihrer Frau, sie hatte recht.“"], "gl": [["das Wartezimmer", "waiting room"], ["schwitzen", "to sweat"], ["ziehen", "(here) to ache"], ["der Handschuh", "glove"], ["draufdrücken", "to press on it"], ["das Loch", "hole"], ["die Karies", "tooth decay"], ["die Füllung", "filling"], ["die Spritze", "injection"], ["der Pieks", "little prick"], ["blass werden", "to go pale"], ["der Angsthase", "scaredy-cat"], ["taub", "numb"], ["die Behandlung", "treatment"], ["sich ausspülen", "to rinse (one's mouth)"], ["die Kontrolle", "check-up"], ["aufschieben", "to put off"], ["die Betäubung", "anaesthetic"], ["nachlassen", "to wear off"], ["entspannt", "relaxed"]], "q": [["Warum geht Deniz zum Zahnarzt?", "Ein Zahn tut weh, besonders bei Kälte.", "Er hat endlich einen Termin gemacht."], ["Was ist wirklich mit dem Zahn?", "Nur ein kleines Kariesloch.", "Er braucht nur eine Füllung, keine Entfernung."], ["Wovor hat Deniz am meisten Angst?", "Vor der Spritze.", "Er nennt sich selbst einen Angsthase."], ["Wie empfindet er die Behandlung?", "Überraschend harmlos, ohne Schmerz.", "„Das war ja gar nichts.“"], ["Welchen Rat gibt der Arzt am Ende?", "Regelmäßig zur Kontrolle kommen.", "Zweimal im Jahr plus eine Reinigung."]], "say": ["Der Zahn tut weh, wenn ich was Kaltes trinke.", "Ich bin bei sowas ein ziemlicher Angsthase.", "Und wenn ich mittendrin Panik kriege?", "Das war ja gar nichts.", "Danke, dass Sie so geduldig waren."]}, {"id": 17, "title": "In der Apotheke", "level": "B1", "topic": "Gesundheit & Einkaufen", "rt": "ca. 6 Min.", "teaser": "Frau Horvath will etwas Starkes gegen ihre Erkältung – und bekommt den besten Rat gratis dazu.", "body": ["Es ist Dienstagnachmittag. Frau Horvath betritt die Apotheke mit roter Nase und einem dicken Schal. Sie niest kräftig.", "„Gesundheit“, sagt die Apothekerin hinter dem Tresen. „Was kann ich für Sie tun?“", "„Danke. Ach, ich bin total erkältet. Ich brauch was Starkes. Am besten ein Antibiotikum.“", "„Ein Antibiotikum? Haben Sie denn ein Rezept vom Arzt?“", "„Nein, wieso? Kann ich das nicht einfach so kaufen?“", "„Leider nicht. Antibiotika gibt es nur auf Rezept. Und ehrlich gesagt würden sie Ihnen hier auch gar nichts bringen.“", "„Wie, gar nichts? Es ist doch stark, oder?“", "„Schon. Aber Antibiotika wirken nur gegen Bakterien. Eine Erkältung kommt fast immer von Viren. Da sind sie wirkungslos.“", "„Oh. Das wusste ich nicht. Und was mach ich jetzt gegen dieses Elend?“", "„Erzählen Sie mal: Was sind Ihre Hauptbeschwerden?“", "„Also, die Nase ist dicht, der Hals kratzt, und abends huste ich ein bisschen.“", "„Haben Sie auch Fieber oder Gliederschmerzen?“", "„Fieber kaum. Aber alles tut so ein bisschen weh, wissen Sie?“", "„Das klingt nach einer ganz normalen Erkältung. Unangenehm, aber harmlos.“", "„Harmlos sagt sich leicht, wenn man nicht selber die Nase voll hat.“", "„Da haben Sie recht“, lacht die Apothekerin. „Also, fangen wir vorne an. Für die Nase hätte ich ein Nasenspray.“", "„Gut. Und das hilft sofort?“", "„Ziemlich schnell, ja. Aber benutzen Sie es höchstens eine Woche, sonst gewöhnt sich die Nase dran.“", "„Okay, eine Woche, verstanden. Und gegen den Hals?“", "„Gegen den kratzigen Hals gibt es Lutschtabletten. Und für die Nacht ein pflanzlicher Hustensaft, der beruhigt.“", "„Das klingt langsam nach einer ganzen Tüte voll.“", "„Keine Sorge, das ist alles nicht teuer. Und das Wichtigste kostet sowieso nichts.“", "„Und das wäre?“", "„Ruhe. Viel trinken, warmer Tee, schlafen. Ihr Körper macht die eigentliche Arbeit, Sie müssen ihm nur Zeit geben.“", "„Da haben Sie wohl recht. Ich wollt halt schnell wieder fit sein, ich hab so viel zu tun.“", "„Das kenne ich. Aber wenn Sie sich jetzt schonen, sind Sie schneller gesund, als wenn Sie sich durchschleppen.“", "„Stimmt eigentlich. Sagen Sie, und wann sollte ich dann doch zum Arzt?“", "„Gute Frage. Wenn Sie hohes Fieber bekommen, wenn es nach einer Woche nicht besser wird, oder wenn Sie starke Schmerzen haben.“", "„Alles klar. Dann weiß ich Bescheid.“", "„Haben Sie denn heute schon Fieber gemessen?“", "„Heute Morgen: 37,8. Also nur leicht erhöht.“", "„Das ist noch harmlos. Beobachten Sie es einfach. Und ein kleiner Tipp: eine heiße Suppe wirkt manchmal Wunder.“", "„Hühnersuppe, wie bei meiner Oma?“", "„Genau wie bei Ihrer Oma. Die hatte da schon recht.“", "„Haha, das sag ich ihr weiter. Sie wird sich freuen, dass die Fachfrau ihr zustimmt.“", "„Unbedingt. Großmütter wissen oft mehr, als man denkt.“", "„Sagen Sie, und was ist mit Vitamin C? Meine Nachbarin schwört drauf.“", "„Schaden tut es nicht. Ein, zwei Orangen am Tag sind super. Ein Wundermittel ist es aber nicht.“", "„Also lieber Orangen essen als teure Tabletten schlucken?“", "„Genau. Das Geld sparen Sie sich. Essen Sie bunt, dann kriegt Ihr Körper alles, was er braucht.“", "„Das klingt vernünftig. Ich dachte immer, viel hilft viel.“", "„Ein verbreiteter Irrtum. Bei Vitaminen zählt die Regelmäßigkeit, nicht die Menge.“", "„Und wenn der Husten schlimmer wird statt besser?“", "„Dann kommen Sie noch mal vorbei. Es gibt auch stärkere Säfte, aber die heben wir uns für den Notfall auf.“", "„Wieder was gelernt. Dann kauf ich auf dem Heimweg gleich ein Netz Orangen.“", "„Gut. Was bin ich Ihnen schuldig? Nasenspray, Lutschtabletten und Hustensaft.“", "„Zusammen vierzehn Euro neunzig.“", "„Bitte schön. Und danke für die vielen Tipps, ehrlich. Beim Arzt hätt ich nur im Wartezimmer gesessen.“", "„Dafür sind wir ja da. Gute Besserung, Frau Horvath. Und heute Abend kümmern Sie sich nur um sich selbst, versprochen?“", "„Mach ich. Tee, Decke, Sofa. Schönen Tag noch!“"], "gl": [["die Erkältung", "cold (illness)"], ["niesen", "to sneeze"], ["der Tresen", "counter"], ["das Antibiotikum", "antibiotic"], ["das Rezept", "prescription"], ["die Bakterien", "bacteria"], ["das Virus", "virus"], ["wirkungslos", "ineffective"], ["die Beschwerden", "symptoms"], ["die Gliederschmerzen", "aching limbs"], ["die Nase ist dicht", "the nose is blocked"], ["kratzen", "to feel scratchy"], ["das Nasenspray", "nasal spray"], ["die Lutschtablette", "lozenge"], ["der Hustensaft", "cough syrup"], ["sich schonen", "to take it easy"], ["sich durchschleppen", "to struggle on"], ["erhöht", "(slightly) raised"], ["Wunder wirken", "to work wonders"], ["gute Besserung", "get well soon"]], "q": [["Was will Frau Horvath zuerst kaufen?", "Ein Antibiotikum.", "Sie denkt, es sei besonders stark."], ["Warum bekommt sie es nicht?", "Es braucht ein Rezept und hilft nicht gegen Viren.", "Antibiotika wirken nur gegen Bakterien."], ["Was empfiehlt die Apothekerin?", "Nasenspray, Lutschtabletten, Hustensaft und Ruhe.", "Plus viel trinken und schlafen."], ["Wann sollte sie zum Arzt?", "Bei hohem Fieber oder wenn es nicht besser wird.", "Oder bei starken Schmerzen."], ["Welcher Omatipp wird erwähnt?", "Eine heiße Hühnersuppe.", "Die Apothekerin sagt, die Oma habe recht."]], "say": ["Ich bin total erkältet.", "Brauche ich dafür ein Rezept?", "Was mach ich gegen dieses Elend?", "Wann sollte ich zum Arzt?", "Was bin ich Ihnen schuldig?"]}, {"id": 18, "title": "Beim Optiker", "level": "B1", "topic": "Einkaufen & Alltag", "rt": "ca. 6 Min.", "teaser": "Herr Wiedmann kann sich partout nicht für eine Brille entscheiden – bis die Optikerin ehrlich wird.", "body": ["Herr Wiedmann steht vor dem Spiegel beim Optiker und probiert die zehnte Brille auf. Neben ihm wartet die Optikerin, Frau Demir, geduldig.", "„Und? Was meinen Sie zu der hier?“", "„Ehrlich? Die ist Ihnen zu groß. Die rutscht Ihnen ständig auf die Nase.“", "„Finden Sie? Mir gefällt die Farbe aber.“", "„Die Farbe ist schön, keine Frage. Aber eine Brille muss auch passen, nicht nur gefallen.“", "„Hm. Dann die schwarze da?“", "„Die probieren wir mal. Moment … so. Nein, die macht Ihr Gesicht streng. Wie ein Mathelehrer.“", "„Oha. Also besser nicht. Ich will ja nicht, dass die Leute Angst vor mir haben.“", "„Keine Sorge, so weit kommt es nicht. Aber wir finden was Besseres.“", "„Wissen Sie, ich hab seit zwanzig Jahren die gleiche Brille. Ich bin das alles nicht gewohnt.“", "„Das merkt man. Aber Ihre alte ist wirklich durch, die Gläser sind total verkratzt.“", "„Stimmt. Und in letzter Zeit sehe ich beim Lesen alles verschwommen. Deswegen bin ich ja hier.“", "„Genau da muss ich Ihnen was sagen. Der Sehtest hat ergeben, dass Sie jetzt eine Gleitsichtbrille brauchen.“", "„Eine Gleitsicht? Also so eine Brille für … ältere Leute?“", "„Für Menschen, deren Augen sich mit der Zeit verändern. Das ist völlig normal ab einem gewissen Alter.“", "„Ach herrje. Werd ich jetzt alt?“", "„Willkommen im Club“, sagt Frau Demir und lacht. „Mir ging's mit vierzig genauso. Man gewöhnt sich dran.“", "„Na, wenn selbst die Optikerin eine trägt, kann's ja nicht so schlimm sein.“", "„Eben. Und keiner sieht der Brille an, dass es eine Gleitsicht ist. Das bleibt unser Geheimnis.“", "„Na gut. Dann zeigen Sie mir mal was Vernünftiges. Sie haben ja offensichtlich den besseren Blick dafür.“", "„Gerne. Probieren Sie mal die hier. Schmaler Rand, dezente Farbe, passt zu Ihrer Gesichtsform.“", "Herr Wiedmann setzt sie auf und schaut in den Spiegel. Er dreht den Kopf hin und her.", "„Oh. Die ist … gut. Die ist richtig gut. Warum haben Sie mir die nicht gleich gegeben?“", "„Weil Sie erst selber suchen wollten. Manche müssen das. Jetzt wissen Sie, was Sie nicht wollen.“", "„Da ist was dran. Meine Frau sagt das auch immer: erst alles ausprobieren, dann meckern.“", "„Kluge Frau. So, und was kostet der Spaß jetzt, mit diesen Gleitsicht-Gläsern?“", "„Kommt auf die Gläser an. Es gibt eine günstige Variante und eine mit Entspiegelung. Die teure ist bequemer.“", "„Und was würden Sie nehmen?“", "„An Ihrer Stelle die mit Entspiegelung. Sie sitzen viel am Computer, oder?“", "„Den ganzen Tag. Ich arbeite im Büro, immer vor dem Bildschirm.“", "„Dann unbedingt die Entspiegelung. Die verhindert, dass sich das Licht im Glas spiegelt. Das schont die Augen.“", "„Gut, dann die. Lieber einmal richtig als zweimal billig.“", "„Sehr vernünftig. Ich messe noch schnell den Abstand Ihrer Augen aus, dann kann ich die Gläser bestellen.“", "„Und wie lang dauert das?“", "„Etwa eine Woche. Ich ruf Sie an, sobald die Brille da ist.“", "„Perfekt. Und danke, dass Sie so ehrlich waren. Ein Verkäufer hätt mir einfach alles verkauft.“", "„Ach wissen Sie, eine Brille tragen Sie jeden Tag. Da bringt's nichts, wenn Sie am Ende unzufrieden sind.“", "„Gut gesprochen. Meine Frau wird staunen, dass ich mich sogar entschieden hab.“", "„Dann richten Sie ihr schöne Grüße aus. Und keine Sorge – die Gleitsicht macht Sie kein bisschen älter.“", "„Eine Sache noch: Muss ich mich an die Gleitsicht gewöhnen?“", "„Ja, ein paar Tage. Am Anfang kann es beim Treppensteigen etwas komisch sein. Das gibt sich.“", "„Treppensteigen? Da muss ich ja aufpassen, dass ich nicht stolpere.“", "„Gehen Sie die ersten Tage einfach langsam. Nach einer Woche denken Sie nicht mehr dran.“", "„Gut zu wissen. Dann üb ich das Treppensteigen eben ein bisschen.“", "„Das will ich hoffen. Bis nächste Woche, Frau Demir.“", "„Bis nächste Woche, Herr Wiedmann. Und tragen Sie die neue Brille mit Stolz.“"], "gl": [["der Optiker", "optician"], ["der Spiegel", "mirror"], ["aufprobieren", "to try on"], ["rutschen", "to slip/slide"], ["passen", "to fit/suit"], ["streng", "stern/strict"], ["durch sein", "(coll.) to be worn out"], ["verkratzt", "scratched"], ["verschwommen", "blurry"], ["der Sehtest", "eye test"], ["die Gleitsichtbrille", "varifocal glasses"], ["sich gewöhnen an", "to get used to"], ["der Rand", "frame/rim"], ["dezent", "subtle/understated"], ["die Gesichtsform", "face shape"], ["die Entspiegelung", "anti-glare coating"], ["der Bildschirm", "screen"], ["der Abstand", "distance/gap"], ["bestellen", "to order"], ["unzufrieden", "dissatisfied"]], "q": [["Warum ist Herr Wiedmann beim Optiker?", "Er sieht beim Lesen verschwommen.", "Seine alte Brille ist verkratzt und durch."], ["Was ergibt der Sehtest?", "Er braucht eine Gleitsichtbrille.", "Seine Augen haben sich mit dem Alter verändert."], ["Wie reagiert er darauf?", "Er fühlt sich plötzlich alt.", "Frau Demir beruhigt ihn: das sei normal."], ["Warum gab sie ihm die gute Brille nicht sofort?", "Er wollte erst selbst suchen.", "So weiß er, was er nicht will."], ["Welche Gläser nimmt er?", "Die mit Entspiegelung.", "Weil er den ganzen Tag am Bildschirm sitzt."]], "say": ["Mir gefällt die Farbe.", "Was würden Sie an meiner Stelle nehmen?", "Lieber einmal richtig als zweimal billig.", "Wie lange dauert das?", "Danke, dass Sie so ehrlich waren."]}, {"id": 19, "title": "An der Wursttheke", "level": "B1", "topic": "Einkaufen & Schwäbisch", "rt": "ca. 6 Min.", "teaser": "An der Theke lernt Frau Bauer ein bisschen Schwäbisch – und ihr Sohn bekommt das beste Wurststückle des Tages.", "body": ["Samstagvormittag im Supermarkt. An der Wursttheke ist viel los. Frau Bauer zieht eine Nummer: 47. Auf der Anzeige steht noch 43.", "Neben ihr steht ihr Sohn Linus, fünf Jahre alt, und zupft an ihrer Jacke.", "„Mama, dauert das noch lang?“", "„Ein bisschen, Schatz. Wir sind gleich dran. Schau, nur noch vier Nummern.“", "„Und dann gehen wir heim?“", "„Dann gehen wir heim. Aber erst kaufen wir was Leckeres, versprochen.“", "Endlich leuchtet die 47. Der Metzger hinter der Theke, ein freundlicher Mann mit weißer Schürze, winkt sie heran.", "„So, die 47. Was derf's denn sei?“", "„Einmal … Moment. Was möchten wir denn? Ich hätte gern Leberkäse.“", "„Fleischkäs, mein ich doch. Ha no. A ganze Scheibe oder a bissle dicker?“", "„Entschuldigung, was heißt ‚a bissle‘?“", "„Ach, Sie sind net von hier, gell? ‚A bissle‘ heißt ein bisschen. Und ‚Fleischkäs‘ ist unser Wort für Leberkäse.“", "„Ah, verstehe. Sie müssen entschuldigen, ich bin erst vor Kurzem hergezogen.“", "„Macht doch nix. Sie lerne's schon noch, des Schwäbische. Also, wie dick?“", "„Dann gern a bissle dicker, zwei Scheiben.“", "„Kommt sofort. Und a Weckle dazu? Also a Brötle, für unterwegs.“", "„Ein Weckle ist ein Brötchen, richtig?“", "„Genau so isch es. Sie lerne schnell, Respekt.“", "„Dann ja, ein Fleischkäsweckle. Das hab ich hier schon oft gesehen, wollte es immer mal probieren.“", "„Do mache Sie nix falsch. Des esse bei uns die Leut zum Vesper, morgens, mittags, immer.“", "„Zum Vesper? Das Wort hör ich auch dauernd.“", "„Vesper ist die kleine Zwischenmahlzeit. Brot, Wurst, Käse. Typisch bei uns im Schwabenland.“", "„Das klingt richtig gemütlich. Dann machen wir das. Und für meinen Sohn hätte ich noch etwas.“", "Der Metzger beugt sich über die Theke und schaut Linus an.", "„Na, junger Mann. Magsch a Stückle Lyoner?“", "Linus schaut seine Mama an. „Was ist Lyoner?“", "„Das ist so eine milde, feine Wurst. Die geben die netten Metzger den Kindern immer.“", "„Ganz genau“, sagt der Metzger und reicht Linus eine runde Scheibe über die Theke. „Für umsonst, extra für dich.“", "„Danke!“, strahlt Linus und beißt sofort rein.", "„Was sagt man?“, fragt Frau Bauer leise.", "„Hab ich doch gesagt: danke!“", "„Das ist aber lieb. Das machen die hier wirklich noch so?“", "„Freilich. Des g'hört sich so. A Kind an der Wurschttheke kriegt sei Stückle, basta.“", "„Herrlich. So was kenn ich aus der Großstadt gar nicht mehr.“", "„Ja mei, bei uns isch die Welt no a bissle gemütlicher. So, der Fleischkäs, zwei Weckle … sonst no was?“", "„Nein, das passt wunderbar. Ach, und Sie haben mir gerade drei schwäbische Wörter beigebracht.“", "„Gern gschehe. Nächstes Mal sage Sie selber ‚a Weckle‘ und ‚a bissle‘, dann glaubt keiner mehr, dass Sie zugezoge sind.“", "„Das üb ich. Versprochen.“", "„Sagen Sie, haben Sie auch was Vegetarisches? Mein Mann isst nämlich kein Fleisch.“", "„Freilich. A guata Käs hätt ich, und a frischer Kartoffelsalat.“", "„Dann nehm ich noch einen Becher Kartoffelsalat dazu.“", "„Guter Griff. Der isch heut frisch gmacht, mit Brühe, so wie sichs ghört.“", "„Mit Brühe? Nicht mit Mayonnaise?“", "„Um Gottes willen, nein! Bei uns kommt Brühe dran, basta. Mayonnaise isch was für die Nordlichter.“", "„Haha, verstanden. Dann also schwäbisch, mit Brühe.“", "„Und noch ein Stück Fleischkäs warm, direkt zum Reinbeißen?“", "„Freilich, den schneid ich Ihnen gleich warm ab. Der schmeckt am besten, wenn er noch dampft.“", "Linus zupft an ihrer Jacke. „Mama, ich will auch ein warmes Stück!“", "„Gern, dann zwei warme Stückle. Sie werden ja langsam a richtige Schwäbin, des gfällt mir.“", "„Und was macht das jetzt alles zusammen?“", "„Mit dem Kartoffelsalat und den warmen Stückle macht das neun Euro achtzig. Und die Lyoner für den Kleinen war ja umsonst.“", "„Bitte schön. Und vielen Dank – für die Wurst und die Sprachstunde.“", "„Immer gern. Ade, und kommet Se bald wieder!“", "Draußen kaut Linus zufrieden an seiner Wurst. „Mama, der Mann war nett.“", "„Ja, mein Schatz. Und weißt du was? Wir sagen jetzt auch ‚a bissle‘.“"], "gl": [["die Wursttheke", "deli / sausage counter"], ["eine Nummer ziehen", "to take a number"], ["zupfen", "to tug"], ["die Schürze", "apron"], ["heranwinken", "to wave over"], ["Was derf's sei?", "What would you like? (Swabian)"], ["der Fleischkäs", "= Leberkäse (Swabian)"], ["a bissle", "a little (Swabian)"], ["ha no", "well then (Swabian filler)"], ["das Weckle", "bread roll (Swabian)"], ["gell", "right? (southern)"], ["das Vesper", "snack / light meal (southern)"], ["der Lyoner", "a mild pork sausage"], ["für umsonst", "for free"], ["freilich", "of course (southern)"], ["des g'hört sich so", "that's how it should be (Swabian)"], ["zugezogen", "newly moved in"], ["gemütlich", "cosy/relaxed"], ["Ade (schwäb.)", "bye (Swabian)"], ["die Brühe", "broth / stock"]], "q": [["Wie funktioniert die Wursttheke?", "Man zieht eine Nummer und wartet.", "Frau Bauer hat die 47."], ["Was bedeutet „Fleischkäs“?", "Das schwäbische Wort für Leberkäse.", "Der Metzger erklärt es ihr."], ["Was ist ein „Weckle“?", "Ein Brötchen (schwäbisch).", "Dazu gibt es das Fleischkäsweckle."], ["Was bekommt Linus?", "Ein Stückle Lyoner, gratis.", "Der Metzger gibt es den Kindern traditionell."], ["Was nimmt Frau Bauer außer Wurst mit?", "Drei schwäbische Wörter / eine Sprachstunde.", "Sie will sie üben."]], "say": ["Dauert das noch lang?", "Entschuldigung, was heißt das?", "Das wollte ich immer mal probieren.", "Das ist aber lieb.", "Was macht das zusammen?"]}, {"id": 20, "title": "Der Wochenmarkt", "level": "B1", "topic": "Einkaufen & Alltag", "rt": "ca. 5 Min.", "teaser": "Saba will nur schnell Gemüse kaufen – doch am Marktstand wird aus „kurz mal“ ein kleines Gespräch über Tomaten, Wechselgeld und das Wetter.", "body": ["Samstagvormittag, halb neun. Auf dem Marktplatz riecht es nach Blumen, Käse und frischem Brot. Saba schiebt sich mit ihrem Korb durch die Menschen und bleibt am Gemüsestand von Herrn Kübler stehen.", "„Guten Morgen! Was darf's denn sein?“", "„Guten Morgen. Ich hätte gern ein Kilo Tomaten, aber richtig reife, bitte.“", "„Reife Tomaten? Da sind Sie bei mir genau richtig. Die hier sind von gestern, vom eigenen Feld. Riechen Sie mal.“", "„Mhm, die duften ja wirklich. Ganz anders als die aus dem Supermarkt.“", "„Gell? Supermarkttomaten schmecken doch nach gar nichts. Wie aus Wasser und Pappe.“", "Saba muss lachen. „Also gut, ein Kilo. Und haben Sie auch Gurken?“", "„Klar. Eine oder zwei?“", "„Zwei, bitte. Und ein Bund Radieschen, wenn Sie welche haben.“", "„Hab ich. Schön scharf sind die heute, passen super aufs Butterbrot.“", "Herr Kübler legt alles auf die Waage und tippt die Preise ein.", "„So, dann machen wir … Tomaten, Gurken, Radieschen … das macht zusammen vier Euro achtzig.“", "Saba kramt in ihrem Geldbeutel. Sie findet nur einen Zwanzig-Euro-Schein.", "„Oje, ich hab leider nur einen großen Schein. Haben Sie denn raus?“", "„Früh am Morgen wird's immer knapp mit dem Wechselgeld. Aber lassen Sie mich mal schauen.“", "Er öffnet die Kasse und zählt die Münzen.", "„Hm, Münzen hab ich kaum noch. Aber wissen Sie was? Geben Sie mir die achtzig Cent passend, dann geht’s glatt auf.“", "„Moment … ja, achtzig Cent hab ich. Hier, bitte.“", "„Perfekt. Dann kriegen Sie sechzehn Euro zurück. Ein Zehner, ein Fünfer und ein Euro. Stimmt’s?“", "„Stimmt genau. Sie rechnen ja schneller als die Kasse im Supermarkt.“", "„Vierzig Jahre auf dem Markt, da hat man das im Blut“, sagt er und zwinkert. „Da brauch ich keinen Computer für.“", "Eine ältere Dame hinter Saba mischt sich ein. „Der Herr Kübler rechnet immer richtig. Bei dem kauf ich schon seit zwanzig Jahren.“", "„Hören Sie, meine Stammkundschaft lügt nie“, lacht Herr Kübler. „Darf's sonst noch was sein? Die Erdbeeren sind heute ein Traum.“", "„Erdbeeren im Mai? Na gut, Sie haben mich überredet. Eine Schale.“", "„Gute Wahl. Die ersten aus der Region. Nächste Woche gibt's dann auch Spargel, falls Sie mögen.“", "„Oh ja, auf den warte ich schon. Dann komme ich nächsten Samstag wieder.“", "„Machen Sie das. Aber kommen Sie früh, der gute Spargel ist bis zehn Uhr weg.“", "„Sagen Sie, haben Sie auch frische Kräuter? Ein bisschen Basilikum vielleicht?“", "„Basilikum ist heute leider aus. Aber Schnittlauch und Petersilie, beides heute früh geschnitten.“", "„Dann nehme ich ein Bund Petersilie. Das passt gut zu den Kartoffeln heute Abend.“", "„Petersilie, sehr gern. Die leg ich Ihnen oben drauf, sonst geht sie unten kaputt.“", "„Und sagen Sie, hält das Wetter heute? Ich will nachher noch in den Garten.“", "„Der Himmel sieht gut aus. Vielleicht am Nachmittag ein Schauer, aber bis Mittag bleibt's trocken.“", "„Gut, dann beeil ich mich mit dem Garten“, lacht Saba.", "„Machen Sie das. Und bei Regen kommen Sie einfach zu mir unters Dach, da steht man trocken.“", "Er packt die Erdbeeren vorsichtig obendrauf, damit sie nicht zerdrücken. „Erdbeeren und Petersilie, das sind noch mal vier Euro.“ Diesmal zahlt Saba passend.", "„So, einmal alles. Und passen Sie auf die Erdbeeren auf, die sind empfindlich.“", "„Mach ich. Vielen Dank, Herr Kübler. Und schönes Wochenende!“", "„Ihnen auch! Und grüßen Sie den Spargel von mir, falls Sie doch woanders kaufen“, ruft er ihr hinterher.", "„Niemals! Bei Ihnen oder gar nicht“, ruft Saba zurück und winkt.", "Auf dem Heimweg nascht sie schon die erste Erdbeere. Süß, sonnenwarm, perfekt. Der Supermarkt, denkt sie, kann einpacken.", "Zu Hause stellt sie den Korb auf den Tisch und ruft ihrer Mitbewohnerin zu: „Defne, komm mal! Ich hab die besten Tomaten der Stadt.“", "„Schon wieder beim Herrn Kübler gewesen?“, ruft Defne aus der Küche.", "„Natürlich. Wo sonst? Der Mann ist eine Institution.“", "„Dann mach ich uns gleich einen Salat. Mit viel Tomaten.“", "„Und Radieschen aufs Brot. Die sind heute schön scharf, hat er gesagt.“", "„Siehst du“, lacht Defne, „deshalb liebe ich den Samstag.“"], "gl": [["der Wochenmarkt", "weekly (farmers') market"], ["der Korb", "basket"], ["reif", "ripe"], ["das Feld", "field"], ["duften", "to smell nice"], ["die Pappe", "cardboard"], ["das Bund", "bunch (of herbs/veg)"], ["die Waage", "scales"], ["der Geldbeutel", "wallet/purse"], ["der Schein", "(bank)note"], ["das Wechselgeld", "change (money)"], ["rausgeben", "to give change"], ["passend", "(here) exact (money)"], ["schulden", "to owe"], ["die Stammkundschaft", "regular customers"], ["überreden", "to talk sb into sth"], ["der Spargel", "asparagus"], ["empfindlich", "delicate/sensitive"], ["naschen", "to nibble/snack"], ["einpacken", "(here) to give up"]], "q": [["Was möchte Saba zuerst kaufen?", "Reife Tomaten.", "Sie wünscht sich ausdrücklich reife Tomaten, kein Supermarkt-Gemüse."], ["Warum gibt es ein Problem beim Bezahlen?", "Saba hat nur einen großen Schein.", "Herr Kübler hat früh am Morgen wenig Wechselgeld."], ["Wie lösen sie das Wechselgeld-Problem?", "Saba gibt achtzig Cent passend dazu.", "Dann geht es glatt auf: Sie bekommt 16 Euro zurück."], ["Was kauft Saba zusätzlich, obwohl sie es nicht geplant hat?", "Eine Schale Erdbeeren.", "Herr Kübler überredet sie mit den ersten Erdbeeren der Region."], ["Warum will Saba nächste Woche früh kommen?", "Wegen des Spargels.", "Der gute Spargel ist schon bis zehn Uhr ausverkauft."]], "say": ["Ich hätte gern ein Kilo Tomaten, bitte.", "Haben Sie denn raus? Ich habe nur einen großen Schein.", "Moment, achtzig Cent habe ich passend.", "Darf's sonst noch etwas sein?", "Vielen Dank und schönes Wochenende!"]}, {"id": 21, "title": "Pfandflaschen zurückgeben", "level": "B1", "topic": "Einkaufen & Alltag", "rt": "ca. 5 Min.", "teaser": "Der Pfandautomat spuckt eine Flasche wieder aus – und Saba lernt, warum nicht jede Flasche gleich viel Pfand bringt.", "body": ["Im Supermarkt steht Saba vor dem Pfandautomaten, eine große Tüte voller leerer Flaschen neben sich. Sie steckt die erste Flasche hinein. Es rattert, es piept, alles gut.", "„Okay, das läuft ja“, murmelt sie zufrieden.", "Flasche um Flasche verschwindet im Automaten. Doch dann, bei einer grünen Glasflasche, leuchtet plötzlich ein rotes Licht. Die Flasche kommt wieder heraus.", "„Ach, komm schon. Warum denn jetzt nicht?“", "Sie versucht es noch mal. Wieder das rote Licht, wieder die Flasche zurück. Hinter ihr beginnt sich eine kleine Schlange zu bilden.", "Ein junger Mitarbeiter mit Namensschild kommt vorbei. „Haben Sie ein Problem mit dem Automaten?“", "„Ja, Timo, genau. Diese Flasche nimmt er einfach nicht. Immer wieder spuckt er sie aus.“", "„Darf ich mal sehen? … Ah, ich glaube, ich weiß schon. Drehen Sie die Flasche mal um.“", "„Umdrehen? Wieso das denn?“", "„Der Automat liest den Strichcode. Wenn der zerkratzt oder dreckig ist, erkennt er die Flasche nicht.“", "„Und wenn der Code kaputt ist? Dann krieg ich kein Geld?“", "„Doch, doch. Aber dann müssen wir es per Hand machen. Moment, ich schau erst mal.“", "Er nimmt die Flasche, wischt kurz über den Code und steckt sie wieder hinein. Diesmal rattert der Automat zufrieden.", "„Sehen Sie? Es war nur ein bisschen Marmelade oder so auf dem Code.“", "„Echt jetzt? So wenig reicht schon?“", "„Oh ja. Die Dinger sind empfindlich. Manchmal reicht ein Tropfen Saft.“", "Saba steckt die letzten Flaschen hinein. Bei einer dünnen Weinflasche leuchtet wieder Rot.", "„Nein, nicht schon wieder. Timo, die hier auch nicht.“", "„Lassen Sie mal sehen … Ah nein, die ist anders. Auf die gibt's gar kein Pfand.“", "„Wie, kein Pfand? Ich hab die doch im Laden gekauft.“", "„Auf Wein- und Saftflaschen aus Glas gibt's oft kein Pfand. Nur auf bestimmte Flaschen mit diesem Zeichen hier.“", "Er zeigt auf ein kleines Symbol. „Sehen Sie, das Pfand-Zeichen? Das hat Ihre Weinflasche nicht.“", "„Das wusste ich gar nicht. Ich dachte, jede Flasche bringt Geld.“", "„Ein häufiger Irrtum. Einweg, Mehrweg, Glas, Plastik – da blickt am Anfang keiner durch.“", "„Und was mach ich jetzt mit der Weinflasche?“", "„Die kommt einfach in den Altglas-Container. Grünes Glas zu grünem Glas.“", "„Gut zu wissen. Dann nehm ich die wieder mit.“", "„Und was ist mit den Plastikflaschen in meiner Tüte? Nehmen die denselben Schlitz?“", "„Die kommen ins selbe Loch, ja. Der Automat erkennt von allein, ob Glas oder Plastik.“", "„Praktisch. Ich hatte immer Angst, ich mach was kaputt, wenn ich die falsche Flasche reinstecke.“", "„Keine Sorge. Kaputtmachen können Sie da nichts. Höchstens, dass er sie nicht annimmt.“", "„Und wenn der Automat mal ganz voll ist?“", "„Dann leuchtet oben ein Licht, und wir leeren ihn. Samstags ist eben viel los.“", "„Das merke ich. Hinter mir wird die Schlange auch schon länger“, sagt Saba und steckt schneller.", "„Lassen Sie sich nicht hetzen. Flasche für Flasche, dann klappt's“, sagt Timo ruhig.", "„Eine Frage noch: Kann ich die Flaschen auch in einem anderen Supermarkt zurückgeben?“", "„Einwegflaschen mit dem Pfand-Zeichen ja. Jeder Laden, der selbst Plastikflaschen verkauft, muss sie zurücknehmen. Bei Mehrwegflaschen aus Glas ist es anders: Die nimmt oft nur ein Laden, der die Sorte auch verkauft.“", "„Also die Bierflaschen von der kleinen Brauerei vielleicht nur hier?“", "„Genau. Aber Plastikflaschen mit dem Zeichen nimmt jeder Supermarkt. Da sind Sie flexibel.“", "Der Automat druckt einen Bon aus. Saba nimmt ihn und schaut drauf.", "„Drei Euro fünfundvierzig. Nicht schlecht für einen Sack alte Flaschen.“", "„Den Bon geben Sie einfach an der Kasse ab. Entweder Sie kriegen das Geld bar, oder es wird vom Einkauf abgezogen.“", "„Super. Dann zieh ich's gleich vom Einkauf ab. Vielen Dank, Timo, Sie haben mir echt geholfen.“", "„Kein Problem. Dafür bin ich ja da. Und beim nächsten Mal: erst den Code sauber wischen, dann einstecken.“", "„Mach ich. Und die Weinflaschen lass ich gleich zu Hause“, lacht Saba.", "„Gute Idee. Spart Ihnen den schweren Sack“, sagt Timo und geht zur nächsten Kundin, die schon winkt.", "An der Kasse legt Saba den Bon auf das Band. Die Kassiererin nickt. „Pfandbon, ja? Wird abgezogen. Macht dann zwölf Euro fünfzig.“", "„Perfekt“, sagt Saba. Zwölf Euro fuffzig, denkt sie, und ein kleines bisschen schlauer geworden ist sie auch noch."], "gl": [["der Pfandautomat", "bottle-deposit machine"], ["das Pfand", "deposit (on bottles)"], ["die Pfandflasche", "returnable bottle"], ["die Tüte", "bag"], ["rattern", "to clatter/rattle"], ["piepen", "to beep"], ["ausspucken", "to reject/spit out"], ["die Schlange", "(here) queue/line"], ["das Namensschild", "name badge"], ["der Strichcode", "barcode"], ["zerkratzt", "scratched"], ["per Hand", "manually/by hand"], ["der Irrtum", "mistake/error"], ["das Einweg", "single-use (one-way)"], ["das Mehrweg", "reusable (multi-use)"], ["das Altglas", "waste glass"], ["der Container", "(recycling) container"], ["der Bon", "receipt/voucher"], ["abziehen", "to deduct"], ["bar", "(in) cash"]], "q": [["Warum nimmt der Automat die erste Problemflasche nicht?", "Der Strichcode ist verschmutzt.", "Etwas Marmelade oder Saft auf dem Code; nach dem Abwischen klappt es."], ["Was ist mit der Weinflasche los?", "Darauf gibt es gar kein Pfand.", "Ihr fehlt das Pfand-Zeichen; nicht jede Glasflasche bringt Geld."], ["Wohin soll die Weinflasche stattdessen?", "In den Altglas-Container.", "Grünes Glas gehört zum grünen Altglas."], ["Was macht Saba mit dem Pfandbon?", "Sie lässt ihn vom Einkauf abziehen.", "Alternativ hätte sie das Geld auch bar bekommen können."], ["Welchen Tipp gibt Timo für das nächste Mal?", "Erst den Code sauber wischen, dann einstecken.", "So erkennt der Automat die Flasche sofort."]], "say": ["Dieser Automat nimmt meine Flasche nicht.", "Bekomme ich auf diese Flasche überhaupt Pfand?", "Kann man das auch per Hand machen?", "Wird der Pfandbon vom Einkauf abgezogen?", "Vielen Dank, Sie haben mir sehr geholfen."]}, {"id": 22, "title": "Das Deutschlandticket", "level": "B1", "topic": "Verkehr & Alltag", "rt": "ca. 6 Min.", "teaser": "Ein Monatsticket für ganz Deutschland – klingt einfach. Doch am Servicecenter hat Saba noch ein paar Fragen zu Abo, Kündigung und den kleinen Fallen.", "body": ["Im Servicecenter der Verkehrsbetriebe ist nicht viel los. Saba zieht eine Nummer und setzt sich. Nach zwei Minuten leuchtet ihre Zahl auf.", "„Die Vierundzwanzig, bitte zu Schalter drei.“", "„Guten Tag. Ich wollte mich mal zum Deutschlandticket beraten lassen.“", "„Gern. Mein Name ist Mahler. Was möchten Sie denn wissen?“", "„Also, ich fahre jeden Tag mit dem Bus zur Arbeit und manchmal am Wochenende mit dem Zug. Lohnt sich das für mich?“", "„Das kann sich durchaus lohnen. Mit dem Deutschlandticket fahren Sie in ganz Deutschland im Nahverkehr. Busse, Straßenbahnen, Regionalzüge.“", "„In ganz Deutschland? Also auch, wenn ich meine Schwester in Hamburg besuche?“", "„Genau. Nur nicht im Fernverkehr, also nicht im ICE oder IC. Aber im Regionalzug bis Hamburg, ja.“", "„Und was kostet der Spaß?“", "„Im Moment sind es dreiundsechzig Euro im Monat. Es ist ein Abo, das heißt, es verlängert sich automatisch.“", "„Automatisch? Da bin ich immer ein bisschen vorsichtig. Komme ich da wieder raus?“", "„Natürlich. Sie können monatlich kündigen. Wenn Sie bis zum zehnten eines Monats kündigen, endet das Abo zum Monatsende.“", "„Also nicht wie beim Fitnessstudio, wo man ein Jahr festhängt?“", "„Nein, zum Glück nicht“, lacht Herr Mahler. „Ein Monat, und Sie sind wieder frei.“", "„Das klingt fair. Und wie kriege ich das Ticket? Als Karte oder auf dem Handy?“", "„Beides geht. Entweder als Chipkarte oder als digitales Ticket in der App. Viele nehmen die App.“", "„Ich hätte es lieber auf dem Handy. Aber was, wenn der Akku leer ist und die Kontrolle kommt?“", "„Gute Frage. Dann haben Sie ein Problem. Ohne gültiges Ticket gilt man als Schwarzfahrer, auch wenn man eins hat.“", "„Oje. Das wäre mir ja peinlich.“", "„Deshalb der Tipp: Laden Sie den Akku, oder nehmen Sie eine Powerbank mit. Oder gleich die Chipkarte, die hat keinen Akku.“", "„Da ist was dran. Dann vielleicht doch die Karte. Und was ist mit meinem alten Monatsticket?“", "„Das können Sie kündigen, sobald das Deutschlandticket läuft. Meistens ist das neue günstiger.“", "„Und wenn ich mal einen Monat gar nicht fahre, im Urlaub zum Beispiel?“", "„Dann können Sie für den Monat pausieren, also kündigen und später neu bestellen. Ganz, wie Sie möchten.“", "„Das ist flexibel, das gefällt mir. Eine Frage noch: Darf ich jemanden mitnehmen?“", "„Das Ticket gilt nur für Sie persönlich. Kinder unter sechs fahren sowieso frei, aber einen Erwachsenen dürfen Sie nicht mitnehmen.“", "„Schade. Aber okay, verstanden. Dann hätte ich gern die Chipkarte, bitte.“", "„Sehr gern. Dann brauche ich nur Ihren Namen, Ihre Adresse und eine Bankverbindung für den monatlichen Einzug.“", "„Hier, mein Ausweis und meine Bankkarte.“", "„Perfekt. Ich trage das eben ein … so. Die Karte kommt in drei bis fünf Werktagen per Post.“", "„Und ab wann gilt sie?“", "„Ab dem Ersten des nächsten Monats. Bis dahin nutzen Sie einfach Ihr altes Ticket.“", "„Super. Und falls ich kündigen will, mache ich das hier am Schalter?“", "„Hier oder online in Ihrem Kundenkonto. Beides geht, ganz, wie es Ihnen lieber ist.“", "„Und wenn ich die Karte verliere? Ist dann das Geld weg?“", "„Nein, Sie sperren die alte und bekommen eine neue. Das Abo hängt ja an Ihrer Person, nicht an dem Stück Plastik.“", "„Beruhigend. Ich verliere nämlich öfter mal was“, lacht Saba.", "„Dann sind Sie mit der App vielleicht doch besser dran – die verliert man nicht so schnell wie eine Karte.“", "„Stimmt auch wieder. Wissen Sie was, ich nehme beides: die Karte und die App als Reserve.“", "„Kann man machen. Hauptsache, Sie haben im Zweifel immer etwas dabei.“", "„Wunderbar. Vielen Dank, Herr Mahler, Sie haben mir das richtig gut erklärt.“", "„Sehr gern. Und denken Sie an die Powerbank, falls Sie doch mal nur die App nehmen“, sagt er mit einem Lächeln.", "„Mach ich. Lieber einmal zu oft geladen als einmal zu wenig“, sagt Saba und steckt den Ausweis wieder ein.", "Draußen auf der Straße rechnet sie kurz im Kopf. Dreiundsechzig Euro, jeden Tag Bus, ab und zu Hamburg. Ja, denkt sie, das geht auf."], "gl": [["das Deutschlandticket", "nationwide monthly transit pass"], ["die Verkehrsbetriebe", "public transport company"], ["der Schalter", "(service) counter"], ["der Nahverkehr", "local/regional transport"], ["der Fernverkehr", "long-distance transport"], ["der Regionalzug", "regional train"], ["das Abo", "subscription"], ["sich verlängern", "to renew/extend"], ["kündigen", "to cancel/terminate"], ["die Chipkarte", "smart card"], ["das digitale Ticket", "digital ticket"], ["die Kontrolle", "(ticket) inspection"], ["der Schwarzfahrer", "fare dodger"], ["die Powerbank", "power bank"], ["pausieren", "to pause/suspend"], ["die Bankverbindung", "bank details"], ["der Einzug", "(direct) debit"], ["der Werktag", "working day"], ["das Kundenkonto", "customer account"], ["aufgehen", "(here) to add up"]], "q": [["Wo darf man mit dem Deutschlandticket fahren?", "Im Nahverkehr in ganz Deutschland.", "Busse, Straßenbahnen und Regionalzüge, aber nicht im ICE/IC."], ["Wie lange ist man an das Abo gebunden?", "Nur einen Monat.", "Man kann monatlich kündigen, anders als beim Fitnessstudio."], ["Welches Risiko nennt Herr Mahler beim Handy-Ticket?", "Ein leerer Akku bei der Kontrolle.", "Ohne vorzeigbares Ticket gilt man als Schwarzfahrer."], ["Warum ist der Kartenverlust nicht so schlimm?", "Das Abo hängt an der Person, nicht an der Karte.", "Man sperrt die alte Karte und bekommt eine neue."], ["Darf Saba eine erwachsene Person mitnehmen?", "Nein.", "Das Ticket gilt nur persönlich; nur Kinder unter sechs fahren frei."]], "say": ["Ich wollte mich mal zum Deutschlandticket beraten lassen.", "Komme ich da jederzeit wieder aus dem Abo raus?", "Kann ich das Ticket auf dem Handy haben?", "Ab wann gilt die Karte denn?", "Vielen Dank, Sie haben mir das gut erklärt."]}, {"id": 23, "title": "Falsch geparkt", "level": "B1", "topic": "Verkehr & Nachbarn", "rt": "ca. 5 Min.", "teaser": "Ein fremdes Auto steht auf Sabas Stellplatz. Bevor der Abschleppdienst kommt, versucht sie es mit einem Gespräch.", "body": ["Saba kommt von der Arbeit nach Hause und biegt in den Hof ein. Doch auf ihrem Stellplatz steht ein fremdes, blaues Auto. Mitten auf Platz Nummer sieben, ihrem Platz.", "„Na, das gibt's doch nicht“, murmelt sie und steigt aus.", "Sie schaut sich um. Kein Fahrer weit und breit. An der Windschutzscheibe klebt kein Zettel, keine Nummer, nichts.", "Gerade will sie ein Foto machen, da kommt ein älterer Herr mit einer Einkaufstüte um die Ecke.", "„Entschuldigung, gehört Ihnen vielleicht das blaue Auto da?“", "„Ja, das bin ich. Pohl, guten Tag. Stimmt was nicht?“", "„Also, das ist mein Stellplatz. Nummer sieben. Ich miete den extra zu meiner Wohnung.“", "„Oh. Oh je. Das wusste ich nicht. Ich bin zu Besuch bei meiner Tochter im dritten Stock.“", "„Das macht ja nichts, dass Sie zu Besuch sind. Aber die Plätze hier sind alle vermietet, jeder hat seine Nummer.“", "„Das tut mir wirklich leid. Ich dachte, hier darf man einfach parken. Es stand ja kein Schild.“", "„Doch, da vorne an der Wand. Aber ich geb zu, man sieht es leicht nicht.“", "„Entschuldigen Sie bitte vielmals. Ich fahre sofort weg. Wo soll ich denn hin?“", "„Auf der Straße ist es nach sechs frei, da können Sie stehen. Oder vorne der Besucherparkplatz, der zweite rechts.“", "„Ah, einen Besucherparkplatz gibt es? Den hab ich gar nicht gesehen.“", "„Ja, extra für Gäste. Da hätten Sie von Anfang an stehen dürfen.“", "„Da bin ich aber froh, dass Sie gekommen sind und nicht gleich der Abschleppdienst.“", "„Ehrlich gesagt war ich kurz davor, ein Foto zu machen. Aber abschleppen lassen – das wollte ich Ihnen nicht antun.“", "„Das rechne ich Ihnen hoch an. Meine Tochter hätte mich ausgelacht.“", "Saba muss lachen. „Na ja, das kann wirklich jedem passieren. Sie kennen sich hier ja nicht aus.“", "„Trotzdem. Beim nächsten Besuch frage ich sie vorher, wo ich hindarf.“", "„Gute Idee. Und sagen Sie Ihrer Tochter, sie soll Ihnen den Besucherplatz zeigen. Dann gibt's keinen Ärger.“", "„Mach ich. Warten Sie, ich fahr sofort rüber, dann haben Sie Ihren Platz.“", "„Lassen Sie sich Zeit, ich hab's nicht eilig. Hauptsache, wir haben's ohne Streit geklärt.“", "„Darf ich fragen, wie lange Sie schon hier wohnen?“", "„Jetzt sind es bald fünf Jahre. Man kennt sich im Haus, grüßt sich, hilft sich mal aus.“", "„Das ist schön. Meine Tochter sagt auch, die Nachbarn hier seien nett.“", "„Sind sie auch. Nur beim Parken, da ist jeder ein bisschen streng. Der Platz kostet ja Geld.“", "„Verstehe ich. Bei uns im Dorf parkt jeder, wo er will. Aber in der Stadt ist das eben anders.“", "„Genau. Hier hat alles seine Ordnung. Nicht immer bequem, aber meistens praktisch.“", "„Da ist tatsächlich was dran. Ich lerne noch dazu, auch mit über siebzig“, lacht Herr Pohl.", "„Fürs Dazulernen ist man nie zu alt“, sagt Saba freundlich.", "Herr Pohl steigt ein, startet den Motor und fährt vorsichtig rückwärts vom Platz.", "„So, Platz sieben ist wieder frei. Und nochmal: Entschuldigung für den Schreck.“", "„Kein Problem. Passen Sie auf beim Rückwärtsfahren, da hinten kommt manchmal ein Radfahrer.“", "„Danke für den Hinweis. Und danke für Ihre Geduld, junge Frau.“", "„Ach, gern. Und wenn Sie wieder da sind: Der Besucherplatz ist der mit dem grünen Schild, gleich neben den Fahrrädern.“", "„Das merke ich mir. Dann weiß ich fürs nächste Mal Bescheid.“", "„Genau. Und falls der Besucherplatz mal voll ist, klingeln Sie einfach bei Ihrer Tochter, die kennt die Regeln.“", "„Mache ich. Nochmals vielen Dank. Schönen Nachmittag, junge Frau.“", "„Schönen Nachmittag, Herr Pohl. Und grüßen Sie Ihre Tochter.“", "„Das mache ich. Auf Wiedersehen!“", "Er fährt langsam zum Besucherparkplatz. Saba stellt ihr Auto auf Platz sieben und schaut ihm kurz hinterher.", "Hätte sie gleich den Abschleppdienst gerufen, denkt sie, wäre das ein teurer, böser Nachmittag geworden. So war es nur ein kurzes Gespräch – und ein netter alter Herr mehr, den sie jetzt kennt."], "gl": [["der Stellplatz", "parking space"], ["der Hof", "(court)yard"], ["die Windschutzscheibe", "windscreen"], ["der Zettel", "note/slip of paper"], ["vermietet", "rented (out)"], ["mieten", "to rent"], ["das Schild", "sign"], ["der Besucherparkplatz", "visitor parking space"], ["der Abschleppdienst", "towing service"], ["abschleppen", "to tow (away)"], ["antun", "to do (sth bad) to sb"], ["hoch anrechnen", "to give sb credit"], ["auslachen", "to laugh at sb"], ["sich auskennen", "to know one's way around"], ["der Ärger", "trouble/annoyance"], ["der Schreck", "fright/shock"], ["rückwärtsfahren", "to reverse"], ["der Hinweis", "tip/note"], ["die Geduld", "patience"], ["klären", "to sort out/clarify"]], "q": [["Was stört Saba, als sie nach Hause kommt?", "Ein fremdes Auto steht auf ihrem Stellplatz.", "Platz Nummer sieben, den sie extra zur Wohnung mietet."], ["Warum hat Herr Pohl dort geparkt?", "Er wusste nicht, dass die Plätze vermietet sind.", "Er ist zu Besuch bei seiner Tochter und sah kein Schild."], ["Wo hätte Herr Pohl parken dürfen?", "Auf dem Besucherparkplatz.", "Der ist extra für Gäste; er hatte ihn nur nicht gesehen."], ["Warum ruft Saba nicht den Abschleppdienst?", "Sie will ihm das nicht antun.", "Ein Gespräch löst das Problem ohne Streit und Kosten."], ["Wie endet die Begegnung?", "Freundlich und ohne Ärger.", "Herr Pohl fährt um, Saba bekommt ihren Platz, beide bleiben höflich."]], "say": ["Entschuldigung, gehört Ihnen das blaue Auto?", "Das ist leider mein Stellplatz.", "Auf dem Besucherparkplatz dürfen Gäste stehen.", "Keine Sorge, wir klären das ohne Streit.", "Schönen Nachmittag noch und grüßen Sie Ihre Tochter."]}, {"id": 24, "title": "Ein Anruf von Oma", "level": "B1", "topic": "Familie & Alltag", "rt": "ca. 6 Min.", "teaser": "Sonntagmorgen klingelt das Telefon: Oma Gerda hat eine Einladung, tausend Fragen und ein kleines Problem mit der Fernbedienung.", "body": ["Es ist Sonntagmorgen, kurz nach neun. Jonas liegt noch halb im Bett, als sein Handy klingelt. Auf dem Display steht „Oma“.", "„Hallo Oma, guten Morgen.“", "„Jonas, mein Junge! Hab ich dich geweckt? Du schläfst doch nicht etwa noch?“", "„Ein bisschen. Aber macht nichts, ich wollte sowieso aufstehen.“", "„Gut, dass ich anrufe. Also, hör zu: Kommst du heute zum Mittagessen? Es gibt Rinderbraten mit Klößen.“", "„Rinderbraten? Oma, dafür steh ich sofort auf. Um wie viel Uhr denn?“", "„Halb eins, wie immer. Und komm hungrig, ich hab für eine ganze Fußballmannschaft gekocht.“", "„Das machst du doch jedes Mal. Letztes Mal hab ich drei Tage von den Resten gelebt.“", "„Besser zu viel als zu wenig. Du bist mir sowieso viel zu dünn. Isst du überhaupt richtig?“", "„Ja, Oma, ich esse richtig. Versprochen.“", "„Das sagst du immer. Und, bringst du die Mia mit? Die ist so ein nettes Mädchen.“", "„Mia kann heute nicht, die besucht ihre Eltern. Aber sie lässt dich grüßen.“", "„Ach, schade. Grüß sie zurück. So ein liebes Ding. Ihr passt gut zusammen, ihr zwei.“", "„Oma …“, sagt Jonas und muss lachen. „Fang nicht wieder davon an.“", "„Ich sag ja nichts. Ich freu mich nur. Übrigens, du musst mir nachher mit dem Fernseher helfen.“", "„Was ist denn mit dem Fernseher?“", "„Ich finde meinen Sender nicht mehr. Das Erste, du weißt schon. Da kommt nur noch so ein komisches Bild.“", "„Hast du vielleicht aus Versehen einen falschen Knopf gedrückt?“", "„Kann sein. Diese Fernbedienung hat ja tausend Knöpfe. Früher gab's einen zum An und einen zum Aus, fertig.“", "„Keine Sorge, das krieg ich hin. Das ist meistens nur die falsche Quelle.“", "„Die falsche was? Siehst du, du redest schon wieder so kompliziert wie dein Opa selig.“", "„Entschuldige. Ich mein: Ich drück nachher zwei Knöpfe, dann läuft dein Erstes wieder. Ganz einfach.“", "„Das wäre wunderbar. Sonst verpasse ich noch meine Sendung am Abend.“", "„Keine Panik, Oma. Deine Sendung rettet dein Enkel.“", "„Du bist ein guter Junge. Ach, und zieh dir was Warmes an, es ist kalt geworden draußen.“", "„Oma, es sind fünfzehn Grad.“", "„Trotzdem. Lieber eine Jacke zu viel als eine zu wenig. Man erkältet sich so schnell.“", "„Ich zieh eine Jacke an, versprochen. Nur für dich.“", "„Brav. Und fahr vorsichtig. Der Nachbar hat auch so einen bellenden Hund, der erschreckt die Autofahrer.“", "„Was hat der Hund mit dem Autofahren zu tun?“", "„Gar nichts. Mir fiel es nur gerade ein. Der bellt nämlich den ganzen Tag, ich werd noch verrückt.“", "„Dann sag's dem Nachbarn doch mal freundlich.“", "„Ach, der alte Sturkopf. Mit dem red ich nicht. Aber das ist eine andere Geschichte.“", "„Und bring mir bitte meine Lesebrille mit, wenn du sie findest. Ich hab sie bei dir liegen lassen.“", "„Die liegt hier auf dem Küchentisch, ja. Ich pack sie gleich ein.“", "„Gott sei Dank. Ich such sie schon seit drei Tagen und les die Zeitung mit der Lupe.“", "„Oma, du hast doch zwei Brillen. Wo ist denn die andere?“", "„Die andere? Die hab ich auf dem Kopf, glaub ich. Moment … ja, da ist sie.“", "„Siehst du. Problem schon halb gelöst“, lacht Jonas.", "„Lach du nur. Warte, bis du in meinem Alter bist. Dann suchst du auch die Brille auf dem Kopf.“", "„Da hast du wahrscheinlich recht“, gibt Jonas zu.", "Jonas grinst. Seine Oma ist wie ein kleines Radio, das von einem Thema zum nächsten springt.", "„Okay, Oma. Ich bin um halb eins da. Rinderbraten, Fernseher, warme Jacke. Hab ich alles.“", "„Perfekt, mein Schatz. Ich freu mich so. Dann deck ich schon mal den Tisch.“", "„Mach das. Und back nicht noch einen Kuchen extra, ich platze sonst.“", "„Einen kleinen nur. Apfelkuchen, dein Lieblingskuchen.“", "„Oma! Na gut. Aber wirklich nur einen kleinen.“", "„Versprochen. Also bis gleich, mein Junge. Und vergiss die Jacke nicht!“", "„Bis gleich, Oma. Hab dich lieb.“", "„Ich dich auch, mein Schatz. Fahr vorsichtig.“", "Jonas legt auf und lächelt. Dann steht er auf, sucht eine Jacke heraus – und freut sich schon jetzt auf Rinderbraten, Apfelkuchen und tausend neue Fragen."], "gl": [["wecken", "to wake sb up"], ["der Rinderbraten", "roast beef"], ["der Kloß", "dumpling"], ["die Reste", "leftovers"], ["dünn", "thin/skinny"], ["grüßen", "to send regards / greet"], ["die Fernbedienung", "remote control"], ["der Sender", "(TV) channel/station"], ["der Knopf", "button"], ["die Quelle", "(here) (input) source"], ["selig", "(the) late / blessed"], ["die Sendung", "(TV) programme"], ["der Enkel", "grandson"], ["sich erkälten", "to catch a cold"], ["bellen", "to bark"], ["der Sturkopf", "stubborn person"], ["grinsen", "to grin"], ["den Tisch decken", "to set the table"], ["platzen", "to burst"], ["der Lieblingskuchen", "favourite cake"]], "q": [["Warum ruft Oma Gerda an?", "Sie lädt Jonas zum Mittagessen ein.", "Es gibt Rinderbraten mit Klößen um halb eins."], ["Welches Problem hat Oma mit dem Fernseher?", "Sie findet ihren Sender nicht mehr.", "Wahrscheinlich hat sie die falsche Quelle eingestellt."], ["Wie beruhigt Jonas seine Oma wegen des Fernsehers?", "Er sagt, er drückt nachher nur zwei Knöpfe.", "Dann läuft ihr Sender wieder, ganz einfach."], ["Worum bittet Oma Jonas außerdem?", "Sich etwas Warmes anzuziehen.", "Sie hat Angst, dass er sich erkältet, obwohl es fünfzehn Grad hat."], ["Wie wirkt Omas Art zu reden?", "Sie springt von Thema zu Thema.", "Jonas vergleicht sie mit einem kleinen Radio."]], "say": ["Kommst du heute zum Mittagessen?", "Keine Sorge, das krieg ich hin.", "Ich ziehe eine Jacke an, versprochen.", "Back nicht noch einen Kuchen extra.", "Bis gleich, Oma. Hab dich lieb."]}, {"id": 25, "title": "Der Kindergeburtstag", "level": "B1", "topic": "Familie & Feste", "rt": "ca. 6 Min.", "teaser": "Max wird sieben, acht Kinder toben durch die Wohnung, und plötzlich fehlt eine Mitgebsel-Tüte. Zum Glück hat Nina einen kühlen Kopf – und Tobias hilft mit.", "body": ["Es ist Nachmittag, und in Ninas Wohnzimmer herrscht das pure Chaos. Acht Kinder rennen durcheinander, Luftballons fliegen, und irgendwo quietscht eine Trillerpfeife. Max wird heute sieben Jahre alt.", "„Tobias, kannst du mal die Musik leiser machen?“, ruft Nina aus der Küche.", "„Mach ich! Und soll ich das Spiel starten? Die Kinder drehen gleich durch.“", "„Ja, bitte. Topfschlagen, das kennen sie alle. Der Kochlöffel liegt auf dem Sofa.“", "„Alles klar. Kinder, kommt mal her! Wer will als Erster?“", "„Ich! Ich! Ich!“, schreien gleich fünf Kinder auf einmal.", "„Immer der Reihe nach“, lacht Tobias. „Max, du bist das Geburtstagskind, du darfst anfangen.“", "Sie binden Max die Augen mit einem Schal zu. Er kriecht auf allen vieren über den Boden und klopft mit dem Löffel.", "„Wärmer! Wärmer! Nein, jetzt kälter!“, rufen die anderen Kinder durcheinander.", "Endlich trifft Max den Topf. Darunter liegt eine kleine Tüte Gummibärchen.", "„Gefunden! Ich hab's gefunden!“, jubelt er und reißt sich den Schal von den Augen.", "Ein Kind nach dem anderen ist dran. Alle haben Spaß – bis auf den kleinen Lenny. Er sucht und sucht, findet den Topf aber einfach nicht und fängt an zu weinen.", "„Hey, Lenny, nicht weinen“, sagt Nina und kniet sich zu ihm. „Komm, ich helf dir. Wir machen das zusammen.“", "„Aber die anderen haben alle was gefunden“, schluchzt er.", "„Du findest ihn auch, ganz bestimmt. Hör genau hin, wo es anders klingt.“", "Mit Ninas Hilfe klopft Lenny noch einmal – und trifft. „Da ist er ja! Lenny hat ihn!“, ruft Tobias laut.", "Lenny strahlt über das ganze Gesicht und vergisst die Tränen sofort.", "Später sitzen alle am Tisch. Es gibt Kuchen mit sieben Kerzen. Die Kinder singen, Max pustet, und mit einem Mal sind alle Flammen aus.", "„Alles Gute, Max!“, rufen alle im Chor.", "Nach dem Kuchen will Nina die Mitgebsel verteilen – kleine Tüten mit Süßigkeiten und einem Spielzeug. Sie zählt und erschrickt.", "„Tobias, wir haben ein Problem. Ich hab nur sieben Tüten, aber es sind acht Kinder.“", "„Wie das? Ich dachte, es kommen sieben.“", "„Fiona ist spontan mitgekommen. Jetzt steht ein Kind ohne Tüte da. Das geht gar nicht.“", "„Ganz ruhig. Wir kriegen das hin. Was haben wir denn noch da?“", "„In der Schublade ist noch Max' Süßigkeitenvorrat. Und ein paar kleine Spielsachen vom letzten Jahr.“", "„Perfekt. Dann basteln wir schnell eine achte Tüte. Keiner merkt was.“", "Die beiden füllen heimlich eine neue Tüte. Gummibärchen, ein Stück Schokolade, ein kleiner Flummi – fertig.", "„Und was, wenn Max seinen Vorrat vermisst?“, flüstert Nina.", "„Dann sag ich ihm, dass ein echter Gastgeber auch mal teilt. Das lernt er am besten heute.“", "Als Max tatsächlich fragt, wo seine Bonbons sind, geht Nina in die Hocke.", "„Max, hör zu. Ein Kind hatte keine Tüte, und wir haben ein paar von deinen Sachen genommen. War das okay?“", "Max überlegt kurz. „Hat Fiona dann auch eine Tüte?“", "„Ja, hat sie.“", "„Dann ist gut. An meinem Geburtstag soll keiner traurig sein.“", "Nina schaut Tobias an, und beide müssen schlucken. „Siehst du“, flüstert Tobias, „so ein kleiner Kerl, und schon so ein großes Herz.“", "Am Ende gehen alle acht Kinder mit einer Tüte und einem Lächeln nach Hause. Die Wohnung sieht aus wie nach einem Sturm, überall Krümel und Luftschlangen.", "„Puh“, sagt Nina und lässt sich aufs Sofa fallen. „Geschafft.“", "„Und wie. Das war der lauteste, chaotischste, schönste Geburtstag seit Langem“, sagt Tobias.", "„Danke, dass du geholfen hast. Allein hätte ich das nie geschafft.“", "„Immer gern. Und beim nächsten Mal kaufen wir eine Tüte extra. Sicher ist sicher.“", "Max kommt angerannt, in der Hand seinen neuen Fußball. „Mama, das war der beste Geburtstag der Welt!“", "Nina drückt ihn fest. „Für mich auch, mein Großer. Für mich auch.“"], "gl": [["das Chaos", "chaos"], ["die Trillerpfeife", "whistle"], ["das Topfschlagen", "pot-banging (children's game)"], ["der Kochlöffel", "wooden spoon"], ["der Reihe nach", "one after another / in turn"], ["zubinden", "to tie (shut)"], ["kriechen", "to crawl"], ["jubeln", "to cheer"], ["schluchzen", "to sob"], ["die Kerze", "candle"], ["pusten", "to blow"], ["im Chor", "in unison / all together"], ["das Mitgebsel", "party-bag gift (for guests)"], ["erschrecken", "to be startled"], ["spontan", "spontaneously"], ["der Vorrat", "supply/stash"], ["der Gastgeber", "host"], ["der Flummi", "bouncy ball"], ["die Luftschlange", "party streamer"], ["der Krümel", "crumb"]], "q": [["Welches Spiel spielen die Kinder zuerst?", "Topfschlagen.", "Mit verbundenen Augen suchen sie mit dem Kochlöffel den Topf."], ["Warum weint der kleine Lenny?", "Er findet den Topf nicht.", "Alle anderen haben schon etwas gefunden; Nina hilft ihm."], ["Welches Problem gibt es bei den Mitgebseln?", "Es fehlt eine Tüte.", "Fiona kam spontan mit, so sind acht Kinder und nur sieben Tüten da."], ["Wie lösen Nina und Tobias das Problem?", "Sie basteln aus Max' Vorrat eine achte Tüte.", "So geht kein Kind leer aus."], ["Wie reagiert Max, als er davon erfährt?", "Er findet es gut, dass keiner traurig ist.", "Er teilt gern; Tobias lobt sein großes Herz."]], "say": ["Kannst du mal die Musik leiser machen?", "Immer der Reihe nach, bitte.", "Ganz ruhig, wir kriegen das hin.", "An meinem Geburtstag soll keiner traurig sein.", "Das war der beste Geburtstag der Welt!"]}, {"id": 26, "title": "Verliebt im Deutschkurs", "level": "B1", "topic": "Liebe & Sprache", "rt": "ca. 6 Min.", "teaser": "Ana und Karim sitzen im Deutschkurs nebeneinander – und üben die Modalverben lieber an einer echten Frage.", "body": ["Dienstagabend, Volkshochschule, Raum 214. Der Deutschkurs B1 beginnt um halb sieben. Ana kommt wie immer fünf Minuten zu spät, die Haare noch nass vom Regen.", "„Entschuldigung, Frau Lindner. Der Bus ist mir vor der Nase weggefahren.“", "„Schon gut, Ana. Setzen Sie sich, wir fangen gerade erst an. Heute machen wir Modalverben.“", "Der einzige freie Platz ist neben Karim. Karim kommt aus Tunesien, arbeitet als Krankenpfleger und schreibt immer alles in drei Farben mit.", "„Hi“, flüstert Ana. „Hab ich viel verpasst?“", "„Nur das Datum an der Tafel. Und dass Frau Lindner heute gute Laune hat.“", "„Gute Laune bei Modalverben? Das ist ja verdächtig.“", "Karim muss lachen und hält sich schnell die Hand vor den Mund.", "„So“, sagt Frau Lindner. „Partnerarbeit. Stellen Sie sich gegenseitig Fragen mit können, müssen, dürfen, wollen. Zehn Minuten. Los geht's.“", "Ana dreht sich zu Karim. „Okay. Erste Frage: Was musst du morgen machen?“", "„Ich muss um sechs Uhr im Krankenhaus sein. Frühdienst. Leider.“", "„Um sechs? Da schlafe ich noch tief und fest.“", "„Ich weiß. Du kommst ja sogar abends zu spät.“", "„Hey! Das war der Bus.“", "„Jedes Mal der Bus?“, fragt Karim und grinst.", "„Jedes Mal der Bus“, sagt Ana sehr ernst. „Jetzt du. Frag mich was mit dürfen.“", "Karim überlegt einen Moment. Dann schaut er auf sein Heft und wird ein bisschen rot.", "„Darf ich dich nach dem Kurs auf einen Tee einladen?“", "Ana blinzelt. „Ist das jetzt eine Übung oder eine echte Frage?“", "„Grammatisch ist sie korrekt. Der Rest … kommt auf deine Antwort an.“", "„Hm. Dann antworte ich auch grammatisch korrekt: Ja, du darfst.“", "„Gut. Dann muss ich jetzt nur noch neunzig Minuten Modalverben überleben.“", "„Das kannst du. Du hast ja drei Farben.“", "Frau Lindner geht durch die Reihen und bleibt bei den beiden stehen.", "„Na, wie läuft's hier? Haben Sie schöne Beispiele gefunden?“", "„Sehr schöne“, sagt Ana schnell. „Sehr … praktische Beispiele.“", "„Wunderbar. Lesen Sie doch mal eins vor.“", "Karim räuspert sich. „Ich muss morgen früh aufstehen.“", "„Prima. Und noch eins mit dürfen?“", "Ana und Karim schauen sich an. Ana beißt sich auf die Lippe, um nicht zu lachen.", "„Darf ich … das Fenster aufmachen?“, sagt Karim.", "„Sehr gut. Und ja, Sie dürfen, hier ist es wirklich stickig.“", "Als Frau Lindner weitergeht, flüstert Ana: „Gerettet. Das Fenster.“", "„Ich bin eben flexibel.“", "Um acht ist der Kurs zu Ende. Draußen hat der Regen aufgehört, die Straße glänzt im Licht der Laternen. Im kleinen Café gegenüber sind noch zwei Plätze am Fenster frei.", "Karim hält ihr die Tür auf. Drinnen ist es warm, und es riecht nach Zimt. Ana zieht ihre nasse Jacke aus und hängt sie über den Stuhl.", "„Was möchtest du?“, fragt Karim.", "„Pfefferminztee. Und du?“", "„Auch. Und ein Stück Apfelkuchen. Zum Teilen, wenn du willst.“", "„Ich will. Aber nur, weil wir heute so fleißig waren.“", "Sie reden über alles: über Anas Arbeit in der Bäckerei, über Karims Familie in Sfax, über Wörter, die sie beide nicht aussprechen können.", "„Mein schlimmstes Wort ist Eichhörnchen“, sagt Ana.", "„Meins ist Streichholzschächtelchen. Ich hab drei Wochen geübt.“", "„Sag mal vor!“", "„Streich… holz… schächtel… chen.“", "„Perfekt! Du solltest Deutschlehrer werden.“", "„Dann müsstest du ja jeden Tag pünktlich kommen.“", "„Dann nehme ich lieber das Fahrrad“, sagt Ana und lacht.", "Kurz vor zehn bringt Karim sie zur Bushaltestelle. Diesmal ist der Bus pünktlich.", "„Siehst du“, sagt er. „Es geht doch.“", "„Nächsten Dienstag komme ich pünktlich. Versprochen.“", "„Und danach? Wieder Tee?“", "Ana steigt ein, dreht sich in der Tür noch einmal um. „Das ist eine Frage mit Modalverb. Formulier sie richtig.“", "„Wollen wir nächsten Dienstag wieder Tee trinken?“", "„Ja, wir wollen“, ruft sie, bevor die Tür zugeht.", "Im Bus holt Ana ihr Heft heraus und schreibt ganz oben auf eine leere Seite: dürfen – wollen – können. Noch nie haben ihr Modalverben so gut gefallen."], "gl": [["die Volkshochschule", "adult education centre"], ["vor der Nase wegfahren", "to leave right in front of sb"], ["das Modalverb", "modal verb"], ["der Krankenpfleger", "(male) nurse"], ["die Tafel", "board (classroom)"], ["verdächtig", "suspicious"], ["die Partnerarbeit", "pair work"], ["gegenseitig", "mutually / each other"], ["der Frühdienst", "early shift"], ["tief und fest schlafen", "to sleep soundly"], ["rot werden", "to blush"], ["blinzeln", "to blink"], ["sich räuspern", "to clear one's throat"], ["stickig", "stuffy"], ["die Laterne", "street lamp"], ["fleißig", "hard-working"], ["das Eichhörnchen", "squirrel"], ["das Streichholzschächtelchen", "little matchbox"], ["formulieren", "to phrase"]], "q": [["Warum kommt Ana zu spät?", "Der Bus ist ihr weggefahren.", "Sie sagt, es sei jedes Mal der Bus."], ["Welches Thema hat der Kurs heute?", "Modalverben.", "Die Teilnehmer üben in Partnerarbeit Fragen."], ["Welche Frage stellt Karim mit „dürfen“?", "Ob er Ana auf einen Tee einladen darf.", "Es ist grammatisch eine Übung, aber auch ernst gemeint."], ["Wie rettet Karim die Situation vor der Lehrerin?", "Er fragt, ob er das Fenster aufmachen darf.", "So muss er die echte Frage nicht vorlesen."], ["Wie endet der Abend?", "Sie verabreden sich für nächsten Dienstag.", "Ana lässt ihn die Frage korrekt mit „wollen“ formulieren."]], "say": ["Hab ich viel verpasst?", "Darf ich dich auf einen Tee einladen?", "Ist das eine Übung oder eine echte Frage?", "Nächstes Mal komme ich pünktlich, versprochen.", "Wollen wir nächste Woche wieder etwas trinken?"]}, {"id": 27, "title": "Weihnachtsmarkt in Esslingen", "level": "B1", "topic": "Feste & Tradition", "rt": "ca. 6 Min.", "teaser": "Priya besucht zum ersten Mal den Mittelalter-Weihnachtsmarkt – und lernt, dass man für die Tasse Pfand bezahlt.", "body": ["Es ist ein kalter Samstagabend im Dezember. Priya ist erst seit September in Deutschland, und ihre Kollegin Sophie hat ihr versprochen: „Den Esslinger Weihnachtsmarkt musst du gesehen haben.“", "Am Bahnhof treffen sie sich. Sophie trägt eine dicke Mütze mit Bommel.", "„Bist du warm genug angezogen? Es soll heute minus drei Grad werden.“", "„Ich trage zwei Pullover und lange Unterwäsche. Ich glaube, ich bin bereit.“", "„Sehr gut. Dann los, es sind nur zehn Minuten zu Fuß.“", "Schon von Weitem hört Priya Musik: Trommeln, Flöten und eine laute Stimme. Dann stehen sie mitten auf dem Marktplatz zwischen alten Fachwerkhäusern.", "„Wow. Das sieht aus wie in einem Film. Warum tragen die Leute alle so komische Kleider?“", "„Das ist der Mittelaltermarkt. Die Händler sind verkleidet wie vor fünfhundert Jahren. Pass auf, gleich spricht dich einer an.“", "Tatsächlich ruft ein Mann mit Lederschürze: „Holde Maid! Wollt Ihr einen Becher heißen Met kosten?“", "Priya schaut Sophie hilflos an. „Was hat er gesagt? Ist das Deutsch?“", "„Altes Deutsch, sozusagen. Er fragt, ob du Met probieren willst. Das ist Honigwein.“", "„Ah. Dann sag ich … Ja, gerne, edler Herr?“", "Der Händler lacht laut. „So gefällt mir das! Drei Taler, bitte – also drei Euro fünfzig. Und drei Euro Pfand für den Becher.“", "„Pfand? Für eine Tasse? Wie bei den Flaschen im Supermarkt?“", "„Genau so“, erklärt Sophie. „Du bringst die Tasse zurück und bekommst das Geld wieder. Oder du behältst sie als Andenken. Jedes Jahr gibt es ein neues Motiv.“", "„Dann behalte ich sie. Meine Mutter sammelt Tassen.“", "Der Met ist süß und heiß. Priya hält den Becher mit beiden Händen fest.", "„Okay, jetzt verstehe ich, warum die Leute im Winter hierherkommen. Was gibt es noch?“", "„Alles Mögliche. Komm, ich zeige dir meinen Lieblingsstand.“", "Sie gehen an Ständen mit Kerzen, Holzspielzeug und handgemachten Messern vorbei. Es riecht nach gebrannten Mandeln, Zimt und Feuer.", "„Hier“, sagt Sophie und bleibt vor einem großen Pfannenstand stehen. „Dinnede. Das ist eine Art schwäbische Pizza. Dünner Teig, Speck, Zwiebeln.“", "„Speck esse ich leider nicht. Gibt es auch eine ohne Fleisch?“", "Die Verkäuferin beugt sich vor. „Freilich, mit Lauch und Käse. Die ist sowieso die beste, wenn Sie mich fragen.“", "„Dann zwei davon, bitte.“", "Während sie essen, kommt ein Feuerspucker vorbei. Eine große Flamme schießt in die Luft, und alle Kinder schreien begeistert.", "„Ist das nicht gefährlich?“, fragt Priya.", "„Der macht das seit zwanzig Jahren. Ich glaube, der ist feuerfest.“", "Später stehen sie vor einem Stand mit Christbaumschmuck. Kleine Glaskugeln glitzern in allen Farben.", "„Feiert ihr eigentlich Weihnachten bei dir zu Hause?“, fragt Sophie.", "„Nicht wirklich. Bei uns ist Diwali das große Lichterfest. Aber das hier erinnert mich ein bisschen daran: überall Lichter, Süßigkeiten, Familien.“", "„Das ist schön. Und dieses Jahr? Fliegst du nach Hause?“", "„Nein, zu teuer. Ich bleibe hier. Ehrlich gesagt habe ich ein bisschen Angst vor Heiligabend. Alles ist geschlossen, alle sind bei ihren Familien.“", "Sophie bleibt stehen. „Dann kommst du zu uns. Meine Eltern wohnen in Plochingen. Es gibt Kartoffelsalat mit Würstchen, ganz traditionell.“", "„Wirklich? Ich will mich aber nicht aufdrängen.“", "„Du drängst dich nicht auf. Meine Mutter kocht immer für zwanzig Leute. Sie wird sich freuen.“", "Priya ist so gerührt, dass sie kurz nichts sagen kann. Dann zeigt sie auf eine kleine goldene Glaskugel.", "„Dann kaufe ich die hier. Als Geschenk für deine Mutter. Darf ich das?“", "„Natürlich darfst du. Sie wird die Kugel lieben.“", "Auf dem Rückweg zum Bahnhof gehen sie an einem Chor vorbei, der „O du fröhliche“ singt. Priya summt mit, obwohl sie den Text nicht kennt.", "„Nächstes Jahr kennst du den Text“, sagt Sophie.", "„Nächstes Jahr bringe ich Diwali-Süßigkeiten mit. Dann lernst du auch etwas.“", "„Abgemacht. Ein Fest gegen ein anderes Fest.“", "Im Zug hält Priya die Tasse auf dem Schoß. Auf der Tasse ist ein kleines Fachwerkhaus mit Schnee gemalt. Ihre Mutter wird sie bekommen – und dazu eine lange Geschichte über heißen Honigwein, Feuer und eine Einladung, mit der sie nicht gerechnet hat."], "gl": [["der Weihnachtsmarkt", "Christmas market"], ["die Mütze mit Bommel", "bobble hat"], ["das Fachwerkhaus", "half-timbered house"], ["verkleidet", "dressed up / in costume"], ["das Mittelalter", "Middle Ages"], ["die Lederschürze", "leather apron"], ["der Met", "mead"], ["der Taler", "(old) coin, thaler"], ["das Pfand", "deposit"], ["das Andenken", "souvenir"], ["gebrannte Mandeln", "candied almonds"], ["der Zimt", "cinnamon"], ["der Speck", "bacon"], ["der Lauch", "leek"], ["der Feuerspucker", "fire-breather"], ["der Christbaumschmuck", "Christmas tree decorations"], ["Heiligabend", "Christmas Eve"], ["sich aufdrängen", "to impose oneself"], ["gerührt", "moved / touched"], ["summen", "to hum"]], "q": [["Was ist das Besondere am Esslinger Markt?", "Er ist ein Mittelaltermarkt.", "Die Händler sind verkleidet und sprechen altes Deutsch."], ["Warum zahlt Priya mehr als den Preis für den Met?", "Sie zahlt Pfand für den Becher.", "Man bekommt es zurück oder behält die Tasse als Andenken."], ["Was isst Priya und warum diese Variante?", "Dinnede mit Lauch und Käse.", "Sie isst keinen Speck."], ["Wovor hat Priya ein bisschen Angst?", "Vor Heiligabend allein.", "Alles ist geschlossen und alle sind bei ihrer Familie."], ["Was kauft Priya am Ende?", "Eine goldene Glaskugel für Sophies Mutter.", "Als Dank für die Einladung zu Heiligabend."]], "say": ["Ist das nicht gefährlich?", "Gibt es auch eine Variante ohne Fleisch?", "Ich will mich aber nicht aufdrängen.", "Bei uns ist Diwali das große Lichterfest.", "Abgemacht – ein Fest gegen ein anderes."]}, {"id": 28, "title": "Ostern bei der Familie", "level": "B1", "topic": "Familie & Feste", "rt": "ca. 6 Min.", "teaser": "Elif lernt an Ostern die Familie ihres Freundes kennen – inklusive Eiersuche, Lammkuchen und einer sehr neugierigen Tante.", "body": ["Ostersonntag, zehn Uhr morgens. Elif sitzt im Auto neben Felix und hält eine Schachtel Pralinen auf dem Schoß. Heute lernt sie zum ersten Mal seine ganze Familie kennen.", "„Bist du nervös?“, fragt Felix.", "„Ich? Nein. Nur ein bisschen. Okay, sehr.“", "„Musst du nicht sein. Meine Eltern sind ganz entspannt. Nur Tante Moni stellt viele Fragen.“", "„Wie viele Fragen?“", "„Alle Fragen. Aber sie meint es nicht böse.“", "Das Haus der Familie Brandt steht am Rand eines kleinen Dorfes. Im Garten blühen gelbe Narzissen, und an einem Strauch hängen bunt bemalte Eier.", "Die Tür geht auf, bevor sie klingeln können. Felix' Mutter umarmt erst ihren Sohn, dann Elif.", "„Du musst Elif sein! Ich bin Ursula. Komm rein, komm rein. Frohe Ostern!“", "„Frohe Ostern, Frau Brandt. Vielen Dank für die Einladung. Die
