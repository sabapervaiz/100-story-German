 Pralinen sind für Sie.“", "„Ach, das wäre doch nicht nötig gewesen! Und sag bitte Ursula. Bei uns duzt man sich.“", "Im Wohnzimmer ist der Tisch schon gedeckt. Es gibt Brötchen, Käse, gefärbte Eier und in der Mitte einen Kuchen in Form eines Lamms, mit Puderzucker bestreut.", "„Was ist das für ein süßes Schaf?“, fragt Elif.", "„Das ist ein Osterlamm. Ein Rührkuchen in einer Lammform. Das gibt es bei uns jedes Jahr“, erklärt Felix' Vater Günter.", "„Und man schneidet es wirklich auf? Das tut mir fast leid.“", "„Du gewöhnst dich dran“, lacht Günter. „Ich fange immer hinten an. Dann schaut es einen nicht so traurig an.“", "In diesem Moment kommt eine Frau mit roter Brille herein. Das muss Tante Moni sein.", "„So, so, das ist also die Freundin. Woher kommst du denn, Kind?“", "„Aus Heilbronn.“", "„Nein, ich meine ursprünglich.“", "„Ursprünglich aus Heilbronn“, sagt Elif freundlich. „Ich bin dort geboren. Meine Eltern kommen aus der Türkei.“", "„Ach so! Und feiert ihr dann auch Ostern?“", "„Nicht so richtig. Wir feiern Bayram, das Zuckerfest. Da gibt es auch viele Süßigkeiten und man besucht die Familie. Eigentlich ganz ähnlich.“", "„Interessant. Und was machst du beruflich?“", "„Moni“, sagt Ursula streng. „Lass sie doch erst mal ankommen.“", "„Ich frag doch nur! Man wird ja wohl fragen dürfen.“", "Elif muss lächeln. „Kein Problem. Ich bin Physiotherapeutin. Wenn Sie mal Rückenschmerzen haben, wissen Sie, wen Sie fragen können.“", "Tante Moni ist für einen Moment still. Dann lacht sie. „Rückenschmerzen hab ich immer. Ich glaube, wir werden Freundinnen.“", "Nach dem Frühstück kommen Felix' Nichten, Paula und Greta, in den Raum gerannt. Sie sind fünf und sieben.", "„Opa! Dürfen wir jetzt Eier suchen? Bitte, bitte!“", "„Der Osterhase war schon da. Aber er hat gesagt, dieses Jahr hilft Elif beim Suchen.“", "Elif schaut Felix überrascht an. „Ich? Ich hab noch nie Ostereier gesucht.“", "„Dann wird es Zeit“, sagt Felix. „Die Regeln sind einfach: Wer ein Ei findet, darf es behalten. Wer ein Schokoladenei findet, muss teilen.“", "„Das ist keine Regel, das hast du gerade erfunden“, ruft Greta empört.", "Im Garten ist das Gras noch nass. Die Mädchen nehmen Elif an die Hand und ziehen sie von Busch zu Busch.", "„Da! Unter der Gießkanne!“, ruft Paula.", "„Und hier im Blumentopf ist auch eins!“, sagt Elif und hält ein blaues Ei hoch.", "„Du bist gut“, sagt Greta anerkennend. „Besser als Onkel Felix. Der findet nie was.“", "„Weil ich sie früher immer selbst versteckt habe“, verteidigt sich Felix. „Dann ist es langweilig.“", "Nach einer halben Stunde sind die Körbchen voll. Nur ein Ei fehlt noch, sagt Ursula. Alle suchen, aber niemand findet es.", "„Vielleicht hat es der Hund gefressen“, meint Günter.", "„Ihr habt doch gar keinen Hund“, sagt Elif.", "„Eben. Deshalb ist es ja so ein Rätsel.“", "Am Nachmittag, beim Kaffee, schneidet Günter endlich das Osterlamm an – natürlich von hinten. Tante Moni setzt sich neben Elif.", "„Sag mal, kannst du mir mal zeigen, welche Übungen gut für den Rücken sind?“", "„Gern. Aber nicht nach drei Stück Kuchen.“", "Als Elif und Felix am Abend gehen, drückt Ursula ihr eine Tüte in die Hand. Darin: zwei bunte Eier und ein Stück Lammkuchen.", "„Für morgen. Und nächstes Jahr bringst du deine Eltern mit, ja? Und an Bayram kommen wir zu euch.“", "Im Auto fragt Felix: „Und? War es schlimm?“", "„Es war wunderschön. Und deine Tante ist mein neuer Fan.“", "Zwei Wochen später ruft Ursula an. Beim Rasenmähen hat Günter das letzte Ei gefunden – mitten im Rosenbeet, leicht zerbrochen, aber noch immer schön blau."], "gl": [["der Ostersonntag", "Easter Sunday"], ["die Schachtel", "box"], ["entspannt", "relaxed"], ["die Narzisse", "daffodil"], ["umarmen", "to hug"], ["Frohe Ostern", "Happy Easter"], ["sich duzen", "to use 'du' with each other"], ["gefärbt", "dyed"], ["der Puderzucker", "icing sugar"], ["das Osterlamm", "Easter lamb (cake)"], ["der Rührkuchen", "pound cake"], ["ursprünglich", "originally"], ["das Zuckerfest", "Eid al-Fitr"], ["die Physiotherapeutin", "physiotherapist (f.)"], ["die Nichte", "niece"], ["verstecken", "to hide"], ["empört", "indignant"], ["die Gießkanne", "watering can"], ["anerkennend", "approvingly"], ["das Rosenbeet", "rose bed"]], "q": [["Warum ist Elif nervös?", "Sie lernt Felix' Familie zum ersten Mal kennen.", "Es ist Ostersonntag bei Familie Brandt."], ["Was ist ein Osterlamm?", "Ein Rührkuchen in Lammform.", "Günter schneidet es immer von hinten an."], ["Wie reagiert Elif auf Tante Monis Fragen?", "Freundlich und mit Humor.", "Am Ende will Moni Rückenübungen lernen."], ["Welche Gemeinsamkeit sieht Elif mit Bayram?", "Süßigkeiten und Familienbesuche.", "Beide Feste bringen die Familie zusammen."], ["Was passiert mit dem letzten Ei?", "Günter findet es zwei Wochen später.", "Es lag beim Rasenmähen im Rosenbeet."]], "say": ["Vielen Dank für die Einladung.", "Bei uns duzt man sich.", "Ich bin dort geboren.", "Ich habe noch nie Ostereier gesucht.", "Nächstes Jahr kommt ihr zu uns."]}, {"id": 29, "title": "Der Tatort-Abend", "level": "B1", "topic": "Freizeit & Fernsehen", "rt": "ca. 6 Min.", "teaser": "Sonntag, 20:15 Uhr: In der WG wird ermittelt – vor dem Fernseher und bald auch in der eigenen Küche.", "body": ["Sonntag, 20:10 Uhr. In der Küche der Wohngemeinschaft in der Gutenbergstraße ist es plötzlich sehr ruhig. Hannah stellt eine Schüssel Chips auf den Tisch, Kemal bringt drei Flaschen Limo.", "„Ole! Fünf Minuten! Wo bleibst du?“, ruft Hannah.", "Ole kommt aus seinem Zimmer, im Schlafanzug und mit einer Decke um die Schultern.", "„Ich verstehe es immer noch nicht. Warum ist das so wichtig? Es ist doch nur ein Krimi.“", "Hannah und Kemal sehen sich an, als hätte er etwas Schlimmes gesagt.", "„Nur ein Krimi?“, sagt Kemal. „Ole, das ist der Tatort. Den gibt es seit über fünfzig Jahren. Halb Deutschland schaut den am Sonntag.“", "„Und jede Woche ist eine andere Stadt dran“, erklärt Hannah. „Münster, Köln, Wien, Stuttgart … Jede Stadt hat ihre eigenen Kommissare.“", "„Und heute?“", "„Heute ist Stuttgart. Das ist unser Heimspiel“, sagt Kemal und klatscht in die Hände.", "Ole setzt sich auf das Sofa. Er kommt aus Dänemark und wohnt erst seit einem Monat in der WG.", "„Okay. Gibt es Regeln?“", "„Eine einzige Regel“, sagt Hannah. „Während des Films redet niemand. Außer man hat einen Verdacht. Dann darf man ihn laut sagen.“", "„Und wer am Ende recht hat, muss nächste Woche nicht spülen“, ergänzt Kemal.", "„Jetzt wird es interessant“, sagt Ole.", "Die bekannte Musik beginnt. Auf dem Bildschirm sieht man ein Auge, ein Fadenkreuz und laufende Beine. Ole muss grinsen.", "„Die Musik ist ja uralt.“", "„Psst! Die ist Kult.“", "Der Fall beginnt: In einem Weinberg über Stuttgart wird ein Winzer tot aufgefunden. Neben ihm liegt eine leere Flasche.", "„Vergiftet“, sagt Kemal sofort. „Hundertprozentig.“", "„Das ist zu einfach“, meint Hannah. „Am Anfang ist es nie die offensichtliche Lösung.“", "Nach zwanzig Minuten gibt es drei Verdächtige: die Tochter, die das Weingut verkaufen will, den Nachbarn, der seit Jahren Streit hat, und den jungen Mitarbeiter, der immer sehr freundlich ist.", "„Der Nachbar war's“, sagt Ole. „Er hat so ein böses Gesicht.“", "„Gerade deshalb war er es nicht“, sagt Hannah. „Das ist ein Trick. Der Böse ist nie der Täter.“", "„Und der Nette?“", "„Der Nette ist verdächtig. Im Tatort ist der Nette oft verdächtig.“", "„Das ist ja ein komisches Land“, murmelt Ole und nimmt eine Handvoll Chips.", "Mitten in einer spannenden Szene – die Kommissarin öffnet langsam eine dunkle Kellertür – gibt es in der Küche einen lauten Knall. Alle drei springen auf.", "„Was war das?“, flüstert Hannah.", "„Ein Einbrecher?“, fragt Ole und hält ein Kissen hoch wie eine Waffe.", "„Mit einem Kissen? Wirklich?“, sagt Kemal.", "Langsam gehen sie zusammen in die Küche. Auf dem Boden liegt eine kaputte Schüssel. Daneben ist eine weiße Pfütze. Und auf dem Kühlschrank sitzt die Katze der Nachbarin und schaut sie unschuldig an.", "„Tatort Küche“, sagt Ole trocken. „Die Täterin ist gefunden.“", "„Die Milch!“, ruft Hannah. „Ich hab die Schüssel mit Milch für morgen hier stehen lassen.“", "„Und das Fenster war offen“, ergänzt Kemal. „Der Fall ist gelöst.“", "„Muss die Katze jetzt spülen?“, fragt Ole.", "Lachend wischen sie die Milch auf und bringen die Katze zur Nachbarin. Als sie zurückkommen, läuft schon die letzte Viertelstunde.", "„Mist! Was haben wir verpasst?“", "Auf dem Bildschirm sitzt der junge, freundliche Mitarbeiter im Verhörraum und weint.", "„Ha!“, ruft Hannah. „Hab ich doch gesagt! Der Nette!“", "„Moment“, sagt Kemal. „Hör doch mal zu.“", "Der Mitarbeiter gesteht etwas – aber nicht den Mord. Er hat nur heimlich Wein verkauft. Den Mord hat am Ende die Tochter begangen, mit Gift in der Flasche.", "„Vergiftet!“, ruft Kemal und springt auf das Sofa. „Ich hab es in der ersten Minute gesagt!“", "„Aber du hast nicht gesagt, wer es war“, protestiert Hannah.", "„Die Regel heißt: Wer recht hat. Und ich hatte recht.“", "Ole hebt die Hand. „Wenn ich etwas sagen darf: Ich hatte den Nachbarn. Falsch. Hannah hatte den Netten. Auch falsch. Kemal hatte das Gift. Halb richtig.“", "„Und was heißt das?“", "„Das heißt, die einzige, die heute den Fall wirklich gelöst hat, war die Katze. Sie hat uns zur Küche geführt.“", "Die drei sehen sich an und müssen lachen.", "„Also gut“, sagt Hannah. „Wir spülen alle zusammen. Und nächsten Sonntag machen wir das Fenster zu.“", "„Nächsten Sonntag?“, fragt Ole. „Ich dachte, ich mag keine Krimis.“", "„Und?“", "„Welche Stadt ist nächste Woche dran?“", "Kemal grinst. „Willkommen im Club. Du bist jetzt offiziell Tatort-Fan.“"], "gl": [["die Wohngemeinschaft (WG)", "shared flat"], ["der Krimi", "crime thriller"], ["der Tatort", "crime scene / German TV series"], ["der Kommissar", "detective inspector"], ["das Heimspiel", "home game"], ["der Verdacht", "suspicion"], ["spülen", "to do the dishes"], ["das Fadenkreuz", "crosshairs"], ["Kult sein", "to be cult"], ["der Weinberg", "vineyard"], ["der Winzer", "winegrower"], ["vergiftet", "poisoned"], ["offensichtlich", "obvious"], ["der/die Verdächtige", "suspect"], ["der Täter / die Täterin", "culprit"], ["der Einbrecher", "burglar"], ["die Pfütze", "puddle"], ["unschuldig", "innocent(ly)"], ["der Verhörraum", "interrogation room"], ["gestehen", "to confess"]], "q": [["Warum ist der Tatort für Hannah und Kemal so wichtig?", "Es ist eine Tradition am Sonntagabend.", "Die Serie gibt es seit über fünfzig Jahren."], ["Welche Regel gibt es in der WG?", "Nur Verdächtige darf man laut sagen.", "Wer recht hat, muss nicht spülen."], ["Was war der laute Knall?", "Die Katze hat eine Schüssel Milch umgeworfen.", "Das Küchenfenster war offen."], ["Wer war im Film die Täterin?", "Die Tochter, mit Gift in der Flasche.", "Der nette Mitarbeiter hat nur heimlich Wein verkauft."], ["Wie endet der Abend für Ole?", "Er wird Tatort-Fan.", "Er fragt schon nach der Stadt für nächste Woche."]], "say": ["Ich habe einen Verdacht.", "Am Anfang ist es nie die offensichtliche Lösung.", "Was haben wir verpasst?", "Hab ich doch gesagt!", "Welche Stadt ist nächste Woche dran?"]}, {"id": 30, "title": "Die Entschuldigung", "level": "B1", "topic": "Freundschaft & Gefühle", "rt": "ca. 6 Min.", "teaser": "Clara hat den Geburtstag ihrer besten Freundin vergessen. Eine Nachricht reicht nicht – sie muss persönlich vorbei.", "body": ["Es ist Freitagabend. Clara sitzt auf ihrem Bett und scrollt durch ihr Handy. Plötzlich bleibt ihr Daumen stehen. Auf Instagram sieht sie ein Foto: Jule mit einer Torte, auf der eine große Drei und eine Null stehen. Darunter: „Danke für den schönen Abend gestern!“", "Gestern. Jules dreißigster Geburtstag war gestern. Und Clara hat ihn komplett vergessen.", "„Nein. Nein, nein, nein“, sagt sie laut in das leere Zimmer.", "Sie öffnet den Chat mit Jule. Die letzte Nachricht ist von Mittwoch: „Kommst du Donnerstag? Nur ein paar Leute bei mir.“ Clara hatte mit einem Daumen geantwortet – und es dann in der Arbeitswoche völlig vergessen.", "Sofort ruft sie ihren Bruder Simon an.", "„Simon, ich bin der schlimmste Mensch der Welt.“", "„Hallo erst mal. Was ist passiert?“", "„Ich hab Jules Dreißigsten vergessen. Sie hat mich eingeladen, ich hab zugesagt, und ich bin einfach nicht gekommen.“", "„Oh. Das ist … nicht gut. Hat sie sich gemeldet?“", "„Nein. Gar nichts. Das ist ja das Schlimmste. Wenn sie sauer wäre, würde sie wenigstens schreiben.“", "„Dann schreib du ihr.“", "„Was soll ich schreiben? ‚Sorry, vergessen‘? Nach fünfzehn Jahren Freundschaft?“", "„Nein. Du gehst hin. Persönlich. Eine Nachricht ist zu wenig.“", "Clara seufzt. Simon hat recht, das weiß sie.", "Am Samstagvormittag steht sie vor Jules Wohnungstür. In der Hand hält sie einen Strauß Tulpen und eine kleine Tüte von Jules Lieblingsbäcker. Ihr Herz klopft laut. Sie klingelt.", "Jule öffnet. Sie trägt eine Jogginghose und hat noch Schminke von gestern unter den Augen. Als sie Clara sieht, wird ihr Gesicht ernst.", "„Ach. Hallo.“", "„Hallo, Jule. Darf ich kurz reinkommen? Ich muss dir was sagen.“", "Jule zögert einen Moment, dann geht sie zur Seite. In der Küche stehen noch leere Gläser und ein halber Kuchen.", "„Also?“, sagt Jule und verschränkt die Arme.", "„Ich hab deinen Geburtstag vergessen. Ich hab keine gute Ausrede. Ich hatte eine stressige Woche, aber das ist keine Entschuldigung. Ich hab dir zugesagt und bin nicht gekommen. Es tut mir wirklich, wirklich leid.“", "Jule schweigt. Dann setzt sie sich an den Tisch.", "„Weißt du, was am meisten wehgetan hat? Nicht, dass du nicht da warst. Sondern dass ich den ganzen Abend auf die Tür geschaut habe. Ich dachte, dir ist was passiert.“", "„Oh Gott. Daran hab ich gar nicht gedacht.“", "„Um elf hab ich dich angerufen. Du bist nicht rangegangen.“", "Clara schaut auf ihr Handy. Tatsächlich: ein verpasster Anruf, 23:04 Uhr. Sie hatte schon geschlafen.", "„Ich hab geschlafen. Das Handy war auf lautlos. Jule, ich schäme mich so.“", "„Ich war nicht nur traurig“, sagt Jule leise. „Ich war auch wütend. Und dann hab ich mir Sorgen gemacht. Und dann war ich wieder wütend.“", "„Das verstehe ich. Ich wäre auch wütend. Du darfst wütend sein.“", "„Danke für die Erlaubnis“, sagt Jule, aber ein kleines Lächeln ist in ihrer Stimme.", "Clara stellt die Tulpen auf den Tisch und öffnet die Bäckertüte.", "„Ich weiß, das macht es nicht wieder gut. Aber hier sind zwei Mohnschnecken. Von Bäckerei Hirsch.“", "„Du hast Mohnschnecken mitgebracht? Von Hirsch? Da musstest du ja um acht in der Schlange stehen.“", "„Halb acht. Die erste Kundin.“", "Jule lacht jetzt richtig. „Okay. Das ist ein guter Anfang. Aber ich bin noch nicht fertig mit dir.“", "„Was soll ich tun? Sag es einfach.“", "„Erstens: Du trägst mich in deinen Kalender ein. Mit Erinnerung. Eine Woche vorher und einen Tag vorher.“", "„Mache ich sofort.“ Clara tippt auf ihrem Handy. „Erledigt.“", "„Zweitens: Du hilfst mir jetzt beim Aufräumen. Die Gläser spülen sich nicht von allein.“", "„Mit Vergnügen.“", "„Und drittens: Nächstes Wochenende gehen wir zusammen essen. Du lädst ein. Mein Nachgeburtstag.“", "„Abgemacht. Du darfst das Restaurant aussuchen. Auch das teure Italienische.“", "„Oh, das teure Italienische. Jetzt fange ich an, dir zu verzeihen.“", "Sie spülen zusammen ab. Jule erzählt von der Party: wer da war, wer zu viel getrunken hat und wer mit wem geflirtet hat. Clara hört zu und lacht an den richtigen Stellen.", "Später sitzen sie mit Kaffee und Mohnschnecken auf dem Balkon.", "„Weißt du“, sagt Jule, „viele hätten nur eine Nachricht geschickt. Mit einem traurigen Smiley.“", "„Simon hat gesagt, das wäre zu wenig.“", "„Simon ist klüger, als er aussieht.“", "„Sag ihm das bloß nicht.“", "Als Clara am Nachmittag nach Hause geht, ist ihr Kopf viel leichter. Sie hat gelernt, dass eine echte Entschuldigung drei Dinge braucht: den Fehler zugeben, die Gefühle des anderen ernst nehmen – und etwas tun, damit es nicht wieder passiert. Und manchmal auch zwei Mohnschnecken."], "gl": [["der Daumen", "thumb"], ["zusagen", "to accept (an invitation)"], ["sich melden", "to get in touch"], ["sauer sein", "to be annoyed"], ["der Strauß", "bouquet"], ["die Schminke", "make-up"], ["die Arme verschränken", "to fold one's arms"], ["die Ausrede", "excuse"], ["schweigen", "to be silent"], ["wehtun", "to hurt"], ["rangehen (ans Telefon)", "to answer (the phone)"], ["lautlos", "silent (mode)"], ["sich schämen", "to be ashamed"], ["wütend", "angry"], ["sich Sorgen machen", "to worry"], ["die Erlaubnis", "permission"], ["die Mohnschnecke", "poppy-seed swirl pastry"], ["die Erinnerung", "reminder"], ["verzeihen", "to forgive"], ["zugeben", "to admit"]], "q": [["Wie merkt Clara ihren Fehler?", "Durch ein Foto auf Instagram.", "Jule hat den Geburtstag schon gestern gefeiert."], ["Welchen Rat gibt Simon?", "Persönlich hingehen.", "Eine Nachricht sei nach fünfzehn Jahren zu wenig."], ["Was hat Jule am meisten wehgetan?", "Sie hat gewartet und sich Sorgen gemacht.", "Sie dachte, Clara sei etwas passiert."], ["Welche drei Bedingungen stellt Jule?", "Kalendereintrag, Aufräumen helfen, Essen einladen.", "Ein Nachgeburtstag im Restaurant."], ["Was lernt Clara über Entschuldigungen?", "Fehler zugeben, Gefühle ernst nehmen, etwas ändern.", "Das zeigt der letzte Absatz."]], "say": ["Ich habe keine gute Ausrede.", "Es tut mir wirklich leid.", "Du darfst wütend sein.", "Was soll ich tun? Sag es einfach.", "Das kommt nicht wieder vor."]}, {"id": 31, "title": "Das Fundbüro", "level": "B1", "topic": "Behörden & Alltag", "rt": "ca. 6 Min.", "teaser": "Der Kuschelbär Bruno ist in der Straßenbahn geblieben. Ivana und ihre Tochter hoffen auf das Fundbüro – und auf einen ehrlichen Finder.", "body": ["Es ist Montagmorgen, kurz nach neun. Ivana steht mit ihrer Tochter Mila vor dem Fundbüro der Stadt. Mila ist vier Jahre alt und hat seit gestern Abend kaum geschlafen.", "„Mama, ist Bruno hier drin?“", "„Das wissen wir noch nicht, Spatz. Wir fragen jetzt einfach.“", "Bruno ist ein kleiner brauner Bär mit nur einem Ohr. Das andere hat Mila vor zwei Jahren abgekaut. Gestern ist Bruno in der Straßenbahn Linie 4 geblieben, auf dem Weg vom Zoo nach Hause.", "Im Fundbüro riecht es nach Papier und altem Kaffee. Hinter dem Schalter sitzt ein Mann mit grauem Bart und einer Lesebrille auf der Nase.", "„Guten Morgen. Was haben Sie denn verloren?“", "„Guten Morgen. Ein Kuscheltier. Einen Teddybären. Gestern Nachmittag in der Straßenbahn.“", "Der Mann nickt ernst, so als ginge es um eine wertvolle Uhr.", "„Verstehe. Das ist ein Notfall. Wie heißt der Bär denn?“", "Mila schaut vorsichtig über den Schalter. „Bruno.“", "„Bruno. Ein guter Name. Ich bin Herr Albrecht. Kannst du mir Bruno beschreiben?“", "„Er ist braun. Und er hat nur ein Ohr. Und er riecht nach mir.“", "„Nur ein Ohr, sehr gut. Das ist ein besonderes Merkmal. Das hilft uns sehr.“", "Er dreht sich zu seinem Computer und tippt.", "„Gestern war Sonntag. Fundsachen aus der Straßenbahn kommen normalerweise erst einen Tag später zu uns. Die Verkehrsbetriebe sammeln alles und bringen es am Montag.“", "„Also heute?“, fragt Ivana hoffnungsvoll.", "„Heute. Die Lieferung ist vor einer halben Stunde gekommen. Ich habe sie noch nicht ganz eingetragen. Warten Sie, ich schaue hinten nach.“", "Herr Albrecht verschwindet durch eine Tür. Mila hält die Hand ihrer Mutter ganz fest.", "„Mama, was ist, wenn jemand Bruno mitgenommen hat?“", "„Dann suchen wir weiter. Aber die meisten Menschen sind ehrlich. Die geben Sachen ab.“", "Durch die offene Tür sieht man lange Regale. Dort liegen Regenschirme, Rucksäcke, Handschuhe, ein Fahrradhelm und sogar eine Gitarre.", "„So viele Sachen“, staunt Mila. „Vergessen die Leute alles?“", "„Fast alles“, ruft Herr Albrecht von hinten. „Letzte Woche hatten wir ein Gebiss. Und einmal ein Hochzeitskleid.“", "„Ein Hochzeitskleid?“, fragt Ivana und muss lachen. „Hat die Braut es abgeholt?“", "„Nach drei Wochen. Die Hochzeit war schon vorbei, zum Glück hatte sie ein zweites.“", "Dann ist es kurz still. Mila hält den Atem an.", "Herr Albrecht kommt zurück. Seine Hände sind leer. Milas Unterlippe beginnt zu zittern.", "„In der Kiste mit den Kuscheltieren ist leider kein Bruno. Nur ein rosa Hase und eine Giraffe.“", "„Oh nein“, flüstert Ivana.", "„Aber“, sagt Herr Albrecht und hebt einen Finger, „es gibt noch eine zweite Möglichkeit. Manchmal geben Fahrgäste Sachen direkt beim Fahrer ab. Die bleiben dann im Depot der Straßenbahn.“", "„Und wie erfahren wir das?“", "„Ich rufe dort an. Ich kenne den Kollegen.“", "Er nimmt den Hörer und wählt.", "„Hallo Ralf, Albrecht hier vom Fundbüro. Sag mal, habt ihr gestern einen Teddy aus der Linie 4 bekommen? Braun, ein Ohr fehlt … Ja? … Wirklich? … Moment.“", "Er hält die Hand über den Hörer und schaut Mila an.", "„Hat Bruno vielleicht ein rotes Halstuch?“", "Mila nickt so schnell, dass ihre Zöpfe fliegen. „Ja! Oma hat es gestrickt!“", "„Er ist da“, sagt Herr Albrecht ins Telefon. „Kannst du ihn mit der nächsten Fahrt rüberschicken? … Super, danke dir.“", "Er legt auf und lächelt. „Bruno sitzt im Depot beim Fahrer auf dem Schreibtisch. Ein Fahrgast hat ihn gestern abgegeben. In einer Stunde ist er hier.“", "Mila jubelt so laut, dass ein Mann im Wartebereich von seiner Zeitung hochschaut.", "„Vielen, vielen Dank“, sagt Ivana. „Wissen Sie, wer ihn abgegeben hat? Ich würde mich gerne bedanken.“", "„Leider nicht. Der Finder hat keinen Namen hinterlassen. Das passiert oft. Viele wollen einfach nur helfen.“", "„Muss ich etwas bezahlen?“", "„Bei so kleinen Sachen gibt es eine kleine Gebühr. Drei Euro. Und Sie müssen hier unterschreiben, dass Sie die Besitzerin sind.“", "„Gerne. Und wenn ich etwas Größeres verliere?“", "„Dann bekommt der Finder normalerweise einen Finderlohn. Aber hoffen wir, dass Sie nichts mehr verlieren.“", "Ivana und Mila warten im Café nebenan. Mila malt in der Zeit ein Bild: ein brauner Bär mit einem Ohr, eine Straßenbahn und ein Mann mit grauem Bart.", "Eine Stunde später sitzt Bruno wieder in Milas Armen. Das rote Halstuch ist ein bisschen schmutzig, aber sonst ist alles in Ordnung.", "„Für Sie“, sagt Mila und gibt Herrn Albrecht das Bild.", "„Für mich? Das hänge ich an die Wand. Gleich neben den Regenschirmen.“", "„Und für den Finder?“, fragt Mila ihre Mutter.", "„Den kennen wir leider nicht.“", "Mila überlegt. Dann sagt sie: „Dann bin ich nächstes Mal auch ehrlich, wenn ich was finde. Das ist dann das Danke.“", "Herr Albrecht nimmt die Brille ab und putzt sie lange. Das, sagt er später zu seinen Kollegen, war der schönste Satz, den er seit Jahren am Schalter gehört hat."], "gl": [["das Fundbüro", "lost property office"], ["das Kuscheltier", "cuddly toy"], ["abkauen", "to chew off"], ["der Schalter", "counter"], ["wertvoll", "valuable"], ["der Notfall", "emergency"], ["beschreiben", "to describe"], ["das Merkmal", "feature / characteristic"], ["die Fundsache", "found item"], ["die Lieferung", "delivery"], ["eintragen", "to register / enter"], ["das Regal", "shelf"], ["das Gebiss", "dentures"], ["den Atem anhalten", "to hold one's breath"], ["zittern", "to tremble"], ["das Depot", "(tram) depot"], ["das Halstuch", "neckerchief / scarf"], ["stricken", "to knit"], ["die Besitzerin", "owner (f.)"], ["der Finderlohn", "finder's reward"]], "q": [["Was hat Mila verloren und wo?", "Ihren Bären Bruno, in der Straßenbahn Linie 4.", "Auf dem Rückweg vom Zoo."], ["Warum ist das fehlende Ohr wichtig?", "Es ist ein besonderes Merkmal.", "So kann man Bruno leicht erkennen."], ["Warum ist Bruno nicht in der Kiste im Fundbüro?", "Ein Fahrgast hat ihn beim Fahrer abgegeben.", "Er liegt deshalb im Depot der Straßenbahn."], ["Woran erkennt der Kollege im Depot Bruno sicher?", "Am roten Halstuch.", "Milas Oma hat es gestrickt."], ["Wie will Mila dem unbekannten Finder danken?", "Sie will selbst ehrlich sein, wenn sie etwas findet.", "Herr Albrecht ist davon sehr gerührt."]], "say": ["Ich habe gestern etwas in der Straßenbahn verloren.", "Kann ich es Ihnen beschreiben?", "Wie erfahren wir das?", "Muss ich etwas bezahlen?", "Ich würde mich gerne beim Finder bedanken."]}, {"id": 32, "title": "Die verlorene Geldbörse", "level": "B1", "topic": "Notfall & Alltag", "rt": "ca. 6 Min.", "teaser": "Dario merkt an der Supermarktkasse: Die Geldbörse ist weg. Karten sperren, Polizei, Panik – und dann eine Überraschung.", "body": ["Freitag, kurz nach sieben am Abend. Dario steht an der Kasse im Supermarkt. Auf dem Band liegen Nudeln, Tomaten, Parmesan und eine Flasche Rotwein. Heute Abend kocht er für seine Freundin Leonie.", "„Das macht dann siebzehn Euro achtzig“, sagt die Kassiererin.", "Dario greift in die rechte Jackentasche. Leer. Linke Tasche: nur der Schlüssel. Hosentaschen: ein Kaugummi und ein alter Kassenzettel.", "„Moment … Ich hatte sie doch eben noch.“", "Hinter ihm räuspert sich ein älterer Herr. Die Schlange wird länger.", "„Können Sie mit dem Handy bezahlen?“, fragt die Kassiererin freundlich.", "„Ja! Natürlich. Zum Glück.“ Dario hält das Handy an das Gerät. Es piept. Bezahlt. Aber sein Herz klopft trotzdem schnell.", "Draußen auf dem Parkplatz ruft er sofort Leonie an.", "„Leonie, meine Geldbörse ist weg.“", "„Was? Wo hast du sie zuletzt gehabt?“", "„Keine Ahnung. Heute Mittag in der Kantine, da hatte ich sie noch. Danach bin ich mit der S-Bahn nach Hause gefahren. Und jetzt ist sie weg.“", "„Okay, ganz ruhig. Was war alles drin?“", "„Meine Bankkarte, die Kreditkarte, der Personalausweis, der Führerschein, ungefähr vierzig Euro und … das Foto von uns aus Venedig.“", "„Das Foto ist im Moment nicht das Wichtigste, Schatz. Zuerst musst du die Karten sperren lassen. Sofort.“", "„Wie geht das? Muss ich zur Bank? Die hat doch schon zu.“", "„Nein. Es gibt eine Sperr-Notrufnummer. Eins-eins-sechs, eins-eins-sechs. Die funktioniert rund um die Uhr.“", "Dario wählt die Nummer. Eine Computerstimme begrüßt ihn, dann meldet sich eine Frau.", "„Sperr-Notruf, guten Abend. Was möchten Sie sperren lassen?“", "„Meine Bankkarte und meine Kreditkarte. Ich habe meine Geldbörse verloren. Oder sie wurde gestohlen, ich weiß es nicht.“", "„In Ordnung. Ich brauche Ihren Namen, Ihre Bank und wenn möglich Ihre IBAN.“", "Zum Glück hat Dario die Banking-App auf dem Handy. Er liest die lange Nummer vor, Buchstabe für Buchstabe. Nach fünf Minuten ist alles erledigt.", "„Beide Karten sind jetzt gesperrt. Neue Karten bekommen Sie in etwa einer Woche per Post. Ich empfehle Ihnen außerdem eine Anzeige bei der Polizei. Falls jemand die Karten benutzt hat, brauchen Sie das für die Bank.“", "„Vielen Dank. Sie haben mir sehr geholfen.“", "Zwanzig Minuten später steht Dario in der Polizeiwache am Marktplatz. Leonie ist inzwischen auch da und hält seine Hand.", "„Guten Abend“, sagt ein junger Polizist. „Wie kann ich helfen?“", "„Ich möchte einen Verlust melden. Meine Geldbörse ist weg. Mit Ausweis und Führerschein.“", "„Verloren oder gestohlen?“", "„Das ist ja das Problem. Ich weiß es nicht.“", "„Dann schreiben wir eine Verlustanzeige. Wenn Sie später merken, dass es ein Diebstahl war, können wir das ändern. Haben Sie ein anderes Dokument dabei? Reisepass vielleicht?“", "„Leider nicht. Der liegt zu Hause.“", "„Kein Problem. Ich kann Sie trotzdem aufnehmen. Wann haben Sie die Geldbörse zuletzt gesehen?“", "Dario erzählt alles: die Kantine, die S-Bahn, der Supermarkt. Der Polizist tippt langsam mit zwei Fingern.", "„So. Hier ist Ihre Bescheinigung. Damit gehen Sie zum Bürgerbüro und beantragen einen neuen Ausweis. Für die Zwischenzeit bekommen Sie dort auch einen vorläufigen Ausweis.“", "„Und der Führerschein?“", "„Den beantragen Sie bei der Führerscheinstelle neu. Das dauert leider ein paar Wochen.“", "Auf dem Heimweg ist Dario sehr still.", "„So viel Papierkram“, sagt er schließlich. „Und das Foto aus Venedig ist auch weg.“", "„Wir fahren einfach noch mal nach Venedig“, sagt Leonie. „Und machen ein neues Foto.“", "Zu Hause kocht Dario trotzdem. Die Pasta ist ein bisschen zu weich, weil er die ganze Zeit an die Geldbörse denkt. Nach dem Essen will Leonie ihm die Jacke abnehmen, um sie aufzuhängen.", "„Warte mal“, sagt sie und runzelt die Stirn. „Die Jacke ist auf einer Seite so schwer.“", "„Das ist nur das Handy.“", "„Das Handy liegt auf dem Tisch.“", "Sie tastet unten am Saum der Jacke entlang. Dann steckt sie die Hand in die rechte Tasche – und ihr Finger verschwindet durch ein Loch im Futter.", "„Dario. In deiner Tasche ist ein Loch.“", "Langsam schiebt sie etwas nach oben, zwischen Stoff und Futter. Und dann hält sie eine braune Geldbörse in der Hand.", "Dario starrt sie an. „Das … das kann nicht sein.“", "„Sie war die ganze Zeit bei dir. Im Futter von deiner Jacke.“", "Er öffnet sie. Alles ist da: die Karten, der Ausweis, der Führerschein, die vierzig Euro. Und das Foto aus Venedig.", "„Ich habe gerade zwei Karten gesperrt und eine Anzeige bei der Polizei gemacht“, sagt Dario. „Wegen einem Loch in der Tasche.“", "Leonie lacht so sehr, dass sie sich auf das Sofa setzen muss.", "„Und was machst du jetzt?“", "„Morgen rufe ich bei der Polizei an und sage, dass sie gefunden ist. Die Karten bleiben aber gesperrt. Die neuen kommen nächste Woche.“", "„Und bis dahin?“", "„Bis dahin bezahle ich mit dem Handy. Und du nähst mir die Tasche zu.“", "„Ich? Ich dachte, du kannst alles.“", "„Kochen ja. Nähen nein.“", "Am Samstag bringt Dario die Jacke zur Änderungsschneiderei. Die Schneiderin schaut sich das Loch an und lächelt.", "„Was haben Sie denn verloren?“", "„Eigentlich nichts“, sagt Dario. „Aber ich habe einen ganzen Abend gesucht.“"], "gl": [["die Geldbörse", "wallet"], ["das Band (an der Kasse)", "conveyor belt"], ["der Kassenzettel", "receipt"], ["die Schlange", "queue"], ["sperren lassen", "to have (a card) blocked"], ["der Sperr-Notruf", "card-blocking hotline"], ["rund um die Uhr", "around the clock"], ["stehlen", "to steal"], ["die Anzeige", "police report"], ["die Polizeiwache", "police station"], ["die Verlustanzeige", "report of loss"], ["der Diebstahl", "theft"], ["die Bescheinigung", "certificate / confirmation"], ["vorläufig", "provisional"], ["der Papierkram", "paperwork"], ["die Stirn runzeln", "to frown"], ["der Saum", "hem"], ["das Futter", "lining"], ["nähen", "to sew"], ["die Änderungsschneiderei", "alterations tailor"]], "q": [["Wie bezahlt Dario im Supermarkt?", "Mit dem Handy.", "Seine Geldbörse ist nicht da."], ["Was muss Dario zuerst tun?", "Die Karten sperren lassen.", "Über den Sperr-Notruf 116 116, rund um die Uhr."], ["Warum soll er zur Polizei gehen?", "Für eine Anzeige.", "Die braucht er für die Bank und für einen neuen Ausweis."], ["Wo war die Geldbörse wirklich?", "Im Futter seiner Jacke.", "Sie ist durch ein Loch in der Tasche gerutscht."], ["Warum bleiben die Karten trotzdem gesperrt?", "Eine Sperre kann man nicht einfach rückgängig machen.", "Die neuen Karten kommen per Post."]], "say": ["Ich hatte sie doch eben noch.", "Ich möchte meine Karte sperren lassen.", "Ich möchte einen Verlust melden.", "Wann haben Sie sie zuletzt gesehen?", "Da ist ein Loch in meiner Tasche."]}, {"id": 33, "title": "Beim Friseur", "level": "B1", "topic": "Dienstleistungen", "rt": "ca. 6 Min.", "teaser": "Zeynep will nur die Spitzen schneiden lassen. Aber zwischen „ein bisschen kürzer“ und „ein bisschen kürzer“ liegen manchmal zehn Zentimeter.", "body": ["Zeynep hat seit acht Monaten keinen Friseur gesehen. Ihre Haare sind lang, trocken und an den Enden kaputt. Am Samstag hat sie endlich einen Termin bei „Schnittstelle“, einem kleinen Salon in ihrer Straße.", "„Hallo, ich habe einen Termin um zehn. Auf den Namen Yilmaz.“", "Eine junge Frau mit kurzen, lila Haaren schaut in den Kalender. „Ja, genau. Ich bin Svenja. Möchtest du einen Kaffee, während du wartest? Oder ein Wasser?“", "„Ein Wasser, gern.“", "„Sagt man hier eigentlich zu allen du?“, fragt Zeynep. „Im Salon meiner Mutter in Mannheim hieß es immer ‚Frau Yilmaz‘ und ‚Möchten Sie‘.“", "„Bei uns schon“, sagt Svenja. „Aber wenn dir Sie lieber ist, sag es einfach. Ich bin da flexibel.“", "Nach fünf Minuten sitzt sie auf dem großen Stuhl vor dem Spiegel. Svenja legt ihr einen schwarzen Umhang um und nimmt die Haare in beide Hände.", "„So. Was machen wir heute?“", "„Nur die Spitzen, bitte. Ein bisschen kürzer.“", "„Ein bisschen kürzer. Wie viel ist ein bisschen für dich?“", "Zeynep überlegt. „Na ja … so, dass die kaputten Enden weg sind.“", "Svenja hebt eine Haarsträhne hoch und schaut sie gegen das Licht an. „Ehrlich gesagt sind die Enden ziemlich weit oben kaputt. Wenn alles Kaputte weg soll, sind das fast zehn Zentimeter.“", "„Zehn? Das ist viel. Geht nicht auch weniger?“", "„Klar geht das. Dann schneide ich vier oder fünf Zentimeter, und wir pflegen den Rest gut. Dann kommst du in zwei Monaten wieder.“", "„Das klingt gut. Lieber in kleinen Schritten.“", "„Sehr vernünftig. Möchtest du auch einen Stufenschnitt? Oder alles gerade?“", "„Was ist ein Stufenschnitt?“", "„Die Haare sind dann nicht alle gleich lang. Vorne etwas kürzer, hinten länger. Das gibt mehr Bewegung. Bei so dicken Haaren wie deinen sieht das oft leichter aus.“", "„Hm. Ich weiß nicht. Ich möchte nicht, dass es zu modern aussieht. Ich arbeite in einer Steuerkanzlei.“", "Svenja lacht. „Ich mach dir keinen Punk, versprochen. Nur ganz leichte Stufen. Man sieht sie kaum.“", "„Okay. Ganz leicht.“", "Zuerst geht es zum Waschbecken. Das Wasser ist angenehm warm, und Svenja massiert die Kopfhaut so gut, dass Zeynep fast einschläft.", "„Ist die Temperatur okay?“", "„Perfekt. Können Sie … kannst du das bitte eine Stunde lang machen?“", "„Dann wird es aber teuer“, sagt Svenja und grinst.", "Zurück am Spiegel beginnt Svenja zu schneiden. Die Schere klappert schnell. Zeynep schaut nicht hin. Sie hört nur, wie Haare auf den Boden fallen.", "„Und? Machst du was Schönes am Wochenende?“, fragt Svenja.", "„Meine Schwester heiratet nächste Woche. Deshalb bin ich hier.“", "„Oh, wie schön! Dann machen wir das besonders gut. Brauchst du für die Hochzeit auch eine Frisur? Hochstecken oder so?“", "„Ich glaube, ich mache das selbst. Oder meine Cousine.“", "„Wenn du willst, kannst du am Samstag früh vorbeikommen. Wir machen Hochsteckfrisuren ab acht Uhr. Das kostet fünfunddreißig Euro.“", "„Das überlege ich mir. Danke.“", "Nach einer Weile hört die Schere auf. Svenja föhnt die Haare und bürstet sie glatt. Dann dreht sie den Stuhl ein Stück zur Seite.", "„So, schau mal.“", "Zeynep öffnet die Augen. Ihre Haare glänzen. Sie fallen weich auf die Schultern – auf die Schultern, nicht mehr bis zur Mitte des Rückens.", "„Oh. Das ist … kürzer, als ich dachte.“", "Svenja wird ein bisschen blass. „Gefällt es dir nicht? Ich habe wirklich nur fünf Zentimeter geschnitten. Aber durch die Stufen und das Föhnen sieht es kürzer aus. Nasse Haare sind immer länger.“", "Zeynep dreht den Kopf nach links und nach rechts. Svenja holt einen kleinen Spiegel und zeigt ihr den Hinterkopf.", "„Hinten ist es noch lang“, sagt sie. „Siehst du? Es fällt nur anders.“", "Zeynep schaut lange in den Spiegel. Dann lächelt sie langsam.", "„Weißt du was? Ich sehe aus wie ich. Nur ausgeschlafener.“", "„Das ist das schönste Kompliment für einen Friseur“, sagt Svenja erleichtert.", "„Was soll ich zu Hause machen, damit es so bleibt?“", "„Einmal pro Woche eine Kur. Und nicht so heiß föhnen. Und bitte nicht wieder acht Monate warten.“", "„Versprochen.“", "An der Kasse bezahlt Zeynep achtundvierzig Euro: Waschen, Schneiden, Föhnen. Sie legt zwei Euro extra in ein kleines Glas mit der Aufschrift „Trinkgeld – danke!“", "„Und“, sagt sie, die Hand schon an der Tür, „trag mich doch für Samstag um acht ein. Für die Hochzeit.“", "„Mach ich. Und bring ein Foto mit, wie du es haben willst.“", "„Ein Foto? Gute Idee. Dann gibt es diesmal kein Missverständnis.“", "Am Abend schickt Zeynep ein Selfie an ihre Schwester. Die Antwort kommt nach zehn Sekunden: „WOW. Wer hat dich so schön gemacht? Ich will auch zu der!“"], "gl": [["der Friseur / der Friseursalon", "hairdresser / hair salon"], ["die Spitzen", "the (hair) ends"], ["auf den Namen …", "under the name …"], ["der Umhang", "cape"], ["die Strähne", "strand (of hair)"], ["pflegen", "to care for"], ["vernünftig", "sensible"], ["der Stufenschnitt", "layered cut"], ["die Steuerkanzlei", "tax consultancy"], ["das Waschbecken", "washbasin"], ["die Kopfhaut", "scalp"], ["die Schere", "scissors"], ["klappern", "to clatter"], ["hochstecken", "to put up (hair)"], ["föhnen", "to blow-dry"], ["glatt", "straight / smooth"], ["blass werden", "to turn pale"], ["ausgeschlafen", "well-rested"], ["die Kur (Haarkur)", "hair treatment"], ["das Trinkgeld", "tip"]], "q": [["Was möchte Zeynep am Anfang?", "Nur die Spitzen schneiden lassen.", "„Ein bisschen kürzer“ – das ist aber ungenau."], ["Warum schneidet Svenja nicht zehn Zentimeter?", "Zeynep will lieber in kleinen Schritten vorgehen.", "Svenja schneidet vier bis fünf Zentimeter."], ["Warum sehen die Haare kürzer aus als gedacht?", "Wegen der Stufen und des Föhnens.", "Nasse Haare wirken immer länger."], ["Wozu braucht Zeynep die Frisur?", "Für die Hochzeit ihrer Schwester.", "Sie bucht danach eine Hochsteckfrisur."], ["Wie will Zeynep Missverständnisse beim nächsten Mal vermeiden?", "Sie bringt ein Foto mit.", "Svenja hat das vorgeschlagen."]], "say": ["Ich habe einen Termin auf den Namen Yilmaz.", "Nur die Spitzen, bitte.", "Geht nicht auch weniger?", "Das ist kürzer, als ich dachte.", "Was soll ich zu Hause machen, damit es so bleibt?"]}, {"id": 34, "title": "Die Mülltrennung", "level": "B1", "topic": "Wohnen & Umwelt", "rt": "ca. 6 Min.", "teaser": "Familie Chen ist neu im Haus. Fünf Tonnen, vier Farben, ein Glascontainer – und ein Nachbar, der Geduld hat.", "body": ["Familie Chen wohnt erst seit zwei Wochen in dem Mehrfamilienhaus in der Ahornstraße. Die Kisten sind fast ausgepackt, aber in der Küche steht ein großes Problem: drei volle Müllbeutel.", "„Hao, wann kommt eigentlich die Müllabfuhr?“, fragt Lin.", "„Ich weiß es nicht. In Shanghai haben wir den Müll einfach in den Raum im Erdgeschoss gebracht.“", "„Das war vor zehn Jahren. Jetzt trennen sie in Shanghai auch.“", "„Aber sicher nicht so wie hier. Unten stehen fünf Tonnen in vier Farben. Ich habe Angst, etwas falsch zu machen.“", "Ihr Sohn Luca, neun Jahre alt, schaut von seinen Hausaufgaben hoch. „Wir haben das in der Schule gelernt. Ich kann es euch erklären.“", "„Dann komm“, sagt Hao. „Du bist heute der Chef.“", "Zu dritt tragen sie die Beutel in den Hinterhof. Dort stehen die Tonnen nebeneinander: eine schwarze, eine blaue, eine braune und zwei gelbe. Gerade stellt ein älterer Mann mit Strickjacke einen Eimer ab.", "„Guten Tag“, sagt er. „Sie sind die Neuen aus dem dritten Stock, oder? Gerber, ich wohne im Erdgeschoss.“", "„Guten Tag, Herr Gerber. Chen. Wir versuchen gerade, den Müll richtig zu trennen.“", "„Ah, die große deutsche Wissenschaft“, sagt Herr Gerber lächelnd. „Brauchen Sie Hilfe?“", "„Unser Sohn will es uns erklären. Aber vielleicht können Sie aufpassen, dass er keinen Fehler macht.“", "Luca stellt sich vor die Tonnen wie ein Lehrer vor die Tafel.", "„Also. Die blaue Tonne ist für Papier. Zeitungen, Kartons, Schulhefte.“", "„Richtig“, sagt Herr Gerber. „Aber die Kartons bitte klein machen. Sonst ist die Tonne nach einem Tag voll.“", "Hao nimmt einen großen Karton aus dem Beutel und tritt ihn flach. „So?“", "„Perfekt. Weiter, junger Mann.“", "„Die gelbe Tonne ist für Verpackungen aus Plastik und Metall. Joghurtbecher, Dosen, Folie.“", "„Muss man die Joghurtbecher waschen?“, fragt Lin.", "„Nein, nicht waschen“, sagt Herr Gerber. „Nur löffelleer. Das heißt, so leer, wie es mit einem Löffel geht. Waschen kostet nur Wasser.“", "„Löffelleer. Was für ein Wort“, sagt Lin und lacht.", "„Die braune Tonne ist die Biotonne“, macht Luca weiter. „Für Essensreste, Obstschalen, Kaffeesatz.“", "„Und Teebeutel?“, fragt Hao.", "„Teebeutel auch. Aber keine Plastiktüten, auch keine angeblich kompostierbaren. Die mag unser Abfallbetrieb nicht“, erklärt Herr Gerber.", "„Und die schwarze Tonne ist für alles andere“, sagt Luca stolz. „Restmüll.“", "„Was ist alles andere?“", "„Windeln, Staubsaugerbeutel, kaputte Zahnbürsten, Kehricht“, zählt Herr Gerber auf. „Was nirgendwo sonst hinpasst.“", "Lin öffnet den dritten Beutel. Darin liegen leere Flaschen: Wein, Sojasoße, ein Marmeladenglas.", "„Und das Glas? Hier gibt es keine Glastonne.“", "„Das Glas bringen Sie zum Container an der Ecke, beim Spielplatz. Weißglas, Grünglas, Braunglas – getrennt.“", "„Und blaues Glas?“, fragt Luca. „Mama hat eine blaue Flasche.“", "„Blaues Glas kommt zum Grünglas. Das ist die Regel.“", "„Warum?“", "„Weil es so ist“, sagt Herr Gerber und zuckt mit den Schultern. „Manche Dinge in Deutschland muss man einfach akzeptieren.“", "Alle lachen.", "„Aber eine wichtige Sache noch“, sagt Herr Gerber und hebt den Zeigefinger. „Den Container nur werktags benutzen. Von acht bis zwanzig Uhr. Am Sonntag nicht, und abends auch nicht.“", "„Warum nicht?“, fragt Hao.", "„Wegen dem Lärm. Glas macht viel Krach. Die Nachbarn am Spielplatz möchten am Sonntag ihre Ruhe.“", "„Und was ist mit großen Sachen? Wir haben noch einen alten Schrank vom Vormieter im Keller.“", "„Das ist Sperrmüll. Den melden Sie bei der Stadt an, online oder per Telefon. Dann bekommen Sie einen Termin, und Sie stellen den Schrank am Abend vorher an die Straße.“", "„Kostet das etwas?“", "„Bei uns zweimal im Jahr kostenlos. Und manchmal ist der Schrank schon weg, bevor die Müllabfuhr kommt. Dann hat ihn jemand mitgenommen, der ihn noch braucht.“", "Lin schreibt alles in ihr Handy. Herr Gerber geht kurz in seine Wohnung und kommt mit einem Blatt Papier zurück.", "„Hier. Der Abfallkalender für dieses Jahr. Da steht, wann welche Tonne geleert wird. Den hänge ich immer an den Kühlschrank.“", "„Das ist sehr nett von Ihnen. Vielen Dank.“", "„Gern geschehen. Und wenn Sie mal unsicher sind, klingeln Sie einfach. Ich bin seit vierzig Jahren hier. Ich habe alle Müllreformen überlebt.“", "Als sie wieder oben sind, hängt Luca den Kalender an den Kühlschrank. Daneben klebt er einen Zettel, auf den er mit Filzstift geschrieben hat: „Löffelleer!!!“", "Zwei Tage später findet Hao im Briefkasten eine Karte. Darauf steht in alter Handschrift: „Gelbe Tonne morgen früh. Gruß, Gerber.“", "„Weißt du was?“, sagt Hao zu Lin. „Ich glaube, die Mülltrennung ist hier gar nicht das Schwierigste. Das Schwierigste ist, die Nachbarn kennenzulernen. Und das haben wir schon geschafft.“"], "gl": [["die Mülltrennung", "waste separation"], ["das Mehrfamilienhaus", "apartment building"], ["die Müllabfuhr", "refuse collection"], ["die Tonne", "bin"], ["der Hinterhof", "backyard / courtyard"], ["die Verpackung", "packaging"], ["die Dose", "can / tin"], ["löffelleer", "spoon-empty (scraped clean)"], ["die Biotonne", "organic waste bin"], ["die Schale", "peel"], ["der Kaffeesatz", "coffee grounds"], ["kompostierbar", "compostable"], ["der Restmüll", "residual waste"], ["die Windel", "nappy / diaper"], ["der Kehricht", "sweepings"], ["der Container", "(bottle) bank"], ["werktags", "on working days"], ["der Krach", "noise / racket"], ["der Sperrmüll", "bulky waste"], ["der Abfallkalender", "waste collection calendar"]], "q": [["Wofür ist die blaue Tonne?", "Für Papier und Karton.", "Kartons soll man klein machen."], ["Was bedeutet „löffelleer“?", "So leer, wie es mit einem Löffel geht.", "Man muss Verpackungen nicht waschen."], ["Wohin kommt eine blaue Glasflasche?", "Zum Grünglas.", "Das ist die Regel, sagt Herr Gerber."], ["Wann darf man den Glascontainer nicht benutzen?", "Sonntags und abends.", "Nur werktags von 8 bis 20 Uhr, wegen des Lärms."], ["Was macht man mit einem alten Schrank?", "Man meldet Sperrmüll bei der Stadt an.", "Dann stellt man ihn am Abend vorher an die Straße."]], "say": ["Wann kommt eigentlich die Müllabfuhr?", "Muss man die Becher waschen?", "Wohin gehört das?", "Wir haben noch einen alten Schrank im Keller.", "Wenn Sie unsicher sind, klingeln Sie einfach."]}, {"id": 35, "title": "Montagmorgen im Großraumbüro", "level": "B2", "topic": "Arbeitswelt & Kommunikation", "rt": "ca. 6 Min.", "teaser": "Natalia braucht Ruhe für eine wichtige Präsentation. Ihr Tischnachbar Dirk telefoniert laut. Wie sagt man das, ohne einen Streit anzufangen?", "body": ["Montag, 8:47 Uhr. Natalia stellt ihren Laptop auf einen der freien Schreibtische im dritten Stock. Seit dem Umbau gibt es im Marketing keine festen Plätze mehr. Desk-Sharing nennt die Geschäftsleitung das. Wer zuerst kommt, sucht sich aus, wo er sitzt.", "Heute hat Natalia Pech gehabt. Der einzige Platz am Fenster war schon weg, und so sitzt sie direkt neben Dirk aus dem Vertrieb. Dirk ist nett, hilfsbereit und hat eine Stimme, die man vermutlich bis in die Kantine hört.", "„Morgen, Natalia! Na, gut ins Wochenende gekommen? Und wieder raus?“", "„Morgen, Dirk. Ja, danke. Und du?“", "„Super! Wir waren am Bodensee. Segeln. Ich zeig dir nachher mal die Fotos.“", "„Gern, aber vielleicht erst nach der Mittagspause. Ich muss um elf eine Präsentation vor der Geschäftsführung halten und bin noch nicht ganz fertig.“", "„Ah, die große Kampagne? Viel Erfolg! Ich bin ganz leise, versprochen.“", "Natalia setzt ihre Kopfhörer auf und öffnet die Folien. Zwei Minuten später klingelt Dirks Telefon.", "„Hallo, Herr Brenner! Schön, von Ihnen zu hören! Ja … ja … Nein, das sehe ich genauso! Hahaha!“", "Die Geräuschunterdrückung ihrer Kopfhörer ist gut, aber nicht gegen Dirk. Natalia liest denselben Satz zum dritten Mal. Sie spürt, wie Ärger in ihr aufsteigt. Am liebsten würde sie ihm einen Zettel hinlegen: RUHE BITTE. Aber sie weiß, dass das die Stimmung für Wochen verderben würde.", "Sie steht auf und geht in die Teeküche. Dort trifft sie Nadine aus der Personalabteilung.", "„Du siehst aus, als wolltest du jemanden umbringen“, sagt Nadine.", "„Nicht umbringen. Nur leiser stellen. Ich sitze neben Dirk.“", "„Ach je. Der telefoniert, als gäbe es kein Telefon.“", "„Genau. Und ich muss in zwei Stunden präsentieren. Ich will ihn auch nicht vor allen anderen bloßstellen. Er meint es ja nicht böse.“", "„Dann sprich ihn direkt an, aber freundlich und konkret. Sag, was du brauchst, nicht, was er falsch macht. Und biete ihm eine Lösung an.“", "„Das klingt wie aus einem Kommunikationsseminar.“", "„Ist es auch“, lacht Nadine. „Ich gebe das Seminar. Aber es funktioniert.“", "Natalia atmet tief durch und geht zurück. Dirk hat gerade aufgelegt und tippt eine E-Mail.", "„Dirk, hast du kurz eine Minute?“", "„Klar. Was gibt's?“", "„Ich hätte eine Bitte. Ich muss mich für die Präsentation gerade sehr konzentrieren, und wenn neben mir telefoniert wird, fällt mir das schwer. Wäre es für dich in Ordnung, deine Telefonate in den nächsten zwei Stunden in einer der Telefonboxen zu führen? Oder ich suche mir einen anderen Platz, falls dir das lieber ist.“", "Dirk schaut sie überrascht an. Dann wird er ein bisschen rot.", "„Oh Mann. War ich so laut? Meine Frau sagt das auch immer. Ich merke das gar nicht.“", "„Ein bisschen“, sagt Natalia vorsichtig. „Aber ich weiß ja, dass du im Vertrieb viel telefonieren musst.“", "„Muss ich, ja. Aber du hast völlig recht. Die Telefonboxen stehen ja nicht umsonst da. Ich gehe da rein. Und wenn ich wieder laut werde, gib mir einfach ein Zeichen. Zum Beispiel so.“ Er macht mit der Hand eine Bewegung, als würde er einen Lautstärkeregler herunterdrehen.", "„Abgemacht“, sagt Natalia und muss lachen. „Danke, Dirk. Das ist wirklich nett.“", "„Kein Ding. Und viel Glück um elf!“", "Die nächsten neunzig Minuten sind ruhig. Natalia schafft die letzten Folien und probt ihren Vortrag zweimal leise vor sich hin. Um 10:55 Uhr klappt sie den Laptop zu.", "Die Präsentation läuft besser, als sie gehofft hat. Die Geschäftsführerin stellt viele Fragen, aber Natalia hat auf alle eine Antwort. Am Ende sagt sie: „Überzeugend. Setzen Sie das so um.“", "Als Natalia zurück an ihren Platz kommt, liegt dort ein Schokoriegel mit einem gelben Post-it: „Für die Heldin der Kampagne. Gruß aus der Telefonbox, D.“", "In der Mittagspause sitzt sie mit Dirk und Nadine in der Kantine. Dirk zeigt die Segelfotos vom Bodensee. Es sind ungefähr zweihundert.", "„Weißt du“, sagt Dirk zwischen zwei Fotos, „ich finde es gut, dass du was gesagt hast. Im alten Büro hatten wir einen Kollegen, der hat nie was gesagt. Und nach einem Jahr hat er sich einfach versetzen lassen. Ich habe erst später erfahren, dass es wegen mir war.“", "„Echt? Das tut mir leid.“", "„Mir auch. Deshalb: lieber gleich sagen. Auch wenn's unangenehm ist.“", "Nadine nickt zufrieden. „Seht ihr? Ich sollte mehr Geld für mein Seminar verlangen.“", "Am Nachmittag schlägt Natalia beim Teamleiter etwas vor: eine kleine Regel für das Großraumbüro. Längere Telefonate und Videocalls in den Boxen, ein Handzeichen, wenn es zu laut wird, und eine „stille Zone“ am Fenster für konzentriertes Arbeiten.", "„Gute Idee“, sagt der Teamleiter. „Aber wer muss sich in die stille Zone setzen?“", "Natalia lächelt. „Wer zuerst kommt. Ich stelle mir ab morgen den Wecker zehn Minuten früher.“"], "gl": [["das Großraumbüro", "open-plan office"], ["der Umbau", "renovation / restructuring"], ["das Desk-Sharing", "hot-desking"], ["Pech haben", "to be unlucky"], ["der Vertrieb", "sales department"], ["die Folie", "slide"], ["die Geräuschunterdrückung", "noise cancellation"], ["der Ärger steigt auf", "anger rises"], ["die Stimmung verderben", "to spoil the atmosphere"], ["die Personalabteilung", "HR department"], ["jemanden bloßstellen", "to show someone up"], ["tief durchatmen", "to take a deep breath"], ["die Telefonbox", "phone booth"], ["nicht umsonst", "not for nothing"], ["der Lautstärkeregler", "volume control"], ["Kein Ding.", "No problem. (colloquial)"], ["proben", "to rehearse"], ["überzeugend", "convincing"], ["sich versetzen lassen", "to request a transfer"], ["unangenehm", "awkward / unpleasant"]], "q": [["Warum sitzt Natalia neben Dirk?", "Wegen Desk-Sharing gibt es keine festen Plätze.", "Der Fensterplatz war schon belegt."], ["Welchen Rat gibt Nadine?", "Direkt, freundlich und konkret sprechen.", "Sagen, was man braucht, und eine Lösung anbieten."], ["Wie formuliert Natalia ihre Bitte?", "Höflich, mit Konjunktiv II („Wäre es in Ordnung …?“).", "Sie bietet auch an, selbst den Platz zu wechseln."], ["Warum findet Dirk es gut, dass sie etwas gesagt hat?", "Ein früherer Kollege hat geschwiegen und sich versetzen lassen.", "Dirk hat erst später erfahren, dass es seinetwegen war."], ["Was schlägt Natalia am Ende vor?", "Regeln für das Großraumbüro.", "Telefonboxen, ein Handzeichen und eine stille Zone."]], "say": ["Hast du kurz eine Minute?", "Ich hätte eine Bitte.", "Wäre es für dich in Ordnung, …?", "Gib mir einfach ein Zeichen.", "Lieber gleich sagen, auch wenn's unangenehm ist."]}, {"id": 36, "title": "Homeoffice oder nicht", "level": "B2", "topic": "Arbeitswelt & Diskussion", "rt": "ca. 6 Min.", "teaser": "Die Geschäftsleitung will drei Bürotage pro Woche. Im Team von Stefanie Kraus prallen Meinungen aufeinander – und am Ende steht ein Kompromiss.", "body": ["Die E-Mail kam am Freitagnachmittag, und sie war kurz: Ab dem nächsten Quartal sollen alle Mitarbeitenden mindestens drei Tage pro Woche im Büro arbeiten. Die Teams sollten selbst festlegen, welche Tage das sind. Am Montag lädt Stefanie Kraus, Leiterin der Buchhaltung, ihr Team zu einer Besprechung ein.", "„Guten Morgen zusammen. Ihr habt die Mail alle gelesen, nehme ich an. Ich möchte heute keine Entscheidung von oben treffen, sondern mit euch eine Lösung finden, mit der alle leben können. Wer möchte anfangen?“", "Yusuf hebt sofort die Hand. Er wohnt fünfzig Kilometer entfernt und hat zwei kleine Kinder.", "„Ich sage es ganz offen: Für mich ist das ein Rückschritt. Ich fahre pro Strecke eine Stunde und zehn Minuten. Drei Bürotage bedeuten sieben Stunden Pendeln pro Woche. Im Homeoffice nutze ich diese Zeit zum Arbeiten. Meine Ergebnisse sind seit Corona nicht schlechter geworden, eher besser.“", "„Das bestreitet auch niemand“, sagt Stefanie. „Marlene, du siehst so aus, als hättest du eine andere Meinung.“", "Marlene ist seit sechs Monaten im Team, frisch nach dem Studium.", "„Ehrlich gesagt freue ich mich darüber. Ich verstehe Yusuf, aber für mich ist das Homeoffice ziemlich einsam. Ich wohne allein, und manchmal rede ich den ganzen Tag mit niemandem außer mit Teams. Wenn ich eine Frage habe, schreibe ich eine Nachricht und warte eine Stunde auf eine Antwort. Im Büro könnte ich mich einfach umdrehen und fragen.“", "„Das ist ein wichtiger Punkt“, sagt Stefanie. „Gerade für neue Kolleginnen und Kollegen ist die Einarbeitung remote schwieriger.“", "Piet, der älteste im Team, lehnt sich zurück und verschränkt die Arme.", "„Ich sehe das pragmatisch. Mir ist es egal, wo ich sitze. Aber ich finde, wenn wir schon ins Büro kommen, dann sollten wir alle an denselben Tagen kommen. Es bringt nichts, wenn ich am Dienstag im Büro bin und alle anderen zu Hause. Dann sitze ich allein im Büro und mache Videocalls – das kann ich auch von meinem Küchentisch aus.“", "„Genau das ist auch mein Problem“, sagt Yusuf. „Wenn ich schon pendle, dann soll es sich wenigstens lohnen.“", "„Also seid ihr euch in einem Punkt einig“, fasst Stefanie zusammen. „Die Bürotage sollten gemeinsame Tage sein. Gut. Welche Tage wären das?“", "„Montag auf keinen Fall“, sagt Yusuf. „Montags bringe ich die Kinder in die Kita. Meine Frau hat Frühdienst.“", "„Und Freitag ist schlecht“, ergänzt Piet. „Freitags ist das Büro sowieso leer. Da wäre ich wieder allein.“", "„Bleiben Dienstag, Mittwoch und Donnerstag“, sagt Marlene. „Das wäre doch logisch.“", "„Logisch schon“, sagt Yusuf, „aber hat jemand mal auf die Parkplatzsituation geschaut? Wenn die ganze Firma diese drei Tage wählt, finde ich um neun keinen Parkplatz mehr. Dann komme ich um sieben und gehe um vier, und die Kinder sehe ich nur noch abends.“", "Kurz ist es still. Stefanie schreibt etwas auf das Whiteboard.", "„Darf ich einen Vorschlag machen? Nach meinem Verständnis gibt die Regel drei Tage im Büro vor, aber sie sagt nicht, dass es drei volle Tage sein müssen. Ich habe am Freitag mit der Personalabteilung telefoniert. Kernarbeitszeit im Büro ist von zehn bis fünfzehn Uhr. Wer früher anfängt, kann die erste Stunde auch zu Hause arbeiten.“", "Yusuf richtet sich auf. „Das heißt, ich könnte von acht bis neun zu Hause arbeiten, dann nach dem Berufsverkehr fahren und um zehn im Büro sein?“", "„Genau. Und der Parkplatz ist um zehn auch kein Problem mehr, weil viele dann schon da sind – oder im Homeoffice.“", "„Das ändert einiges“, gibt Yusuf zu. „Es ist nicht ideal, aber damit kann ich leben.“", "„Und für Marlene“, fährt Stefanie fort, „schlage ich vor, dass wir an den Bürotagen bewusst Zeit für Austausch einplanen. Zum Beispiel ein gemeinsames Mittagessen am Mittwoch. Und Piet, hättest du Lust, Marlenes Pate zu werden? Du kennst die Prozesse hier am besten.“", "Piet hebt die Augenbrauen. „Pate? Klingt nach Mafia.“", "„Klingt nach Erfahrung“, sagt Marlene und lächelt. „Ich hätte wirklich viele Fragen.“", "„Na gut“, brummt Piet, aber man sieht, dass er sich geschmeichelt fühlt. „Aber nur, wenn du mir im Gegenzug erklärst, wie diese neue Software funktioniert.“", "„Deal.“", "Stefanie schreibt die Ergebnisse auf: Bürotage Dienstag bis Donnerstag, Kernzeit zehn bis fünfzehn Uhr, Mittwoch gemeinsames Mittagessen, Patenschaft für Neue.", "„Eine letzte Sache noch“, sagt sie. „Wir probieren das drei Monate aus. Danach setzen wir uns wieder zusammen und schauen, was funktioniert und was nicht. Wenn es für jemanden gar nicht geht, sprechen wir einzeln darüber. Einverstanden?“", "Alle nicken. Yusuf wirkt immer noch nicht begeistert, aber deutlich entspannter.", "„Darf ich noch was sagen?“, fragt er. „Ich war heute Morgen ziemlich sauer. Ich dachte, das wird wieder so eine Entscheidung, bei der wir nichts zu sagen haben. Aber das hier war fair. Danke.“", "„Danke für die Offenheit“, sagt Stefanie. „Genau darum ging es mir.“", "Nach der Besprechung schreibt Stefanie eine kurze Mail an die Geschäftsleitung: Das Team habe sich auf eine Lösung geeinigt, die die Vorgaben erfülle und gleichzeitig Rücksicht auf die persönliche Situation der Einzelnen nehme. Sie schlage vor, das Modell nach drei Monaten zu bewerten.", "Dann klappt sie den Laptop zu. Es ist Montag – und Montag ist, zumindest für die nächsten drei Monate, ein Homeoffice-Tag."], "gl": [["das Quartal", "quarter"], ["festlegen", "to determine / fix"], ["die Buchhaltung", "accounting"], ["der Rückschritt", "step backwards"], ["pendeln", "to commute"], ["bestreiten", "to dispute"], ["einsam", "lonely"], ["die Einarbeitung", "onboarding / training"], ["pragmatisch", "pragmatic"], ["sich lohnen", "to be worthwhile"], ["zusammenfassen", "to summarise"], ["die Kernarbeitszeit", "core working hours"], ["der Berufsverkehr", "rush-hour traffic"], ["zugeben", "to admit"], ["der Austausch", "exchange"], ["der Pate / die Patenschaft", "mentor / mentoring (lit. godfather)"], ["sich geschmeichelt fühlen", "to feel flattered"], ["im Gegenzug", "in return"], ["die Vorgabe", "requirement / guideline"], ["Rücksicht nehmen auf", "to take into consideration"]], "q": [["Was verlangt die Geschäftsleitung?", "Mindestens drei Bürotage pro Woche.", "Die Teams legen die Tage selbst fest."], ["Warum ist Marlene für mehr Bürotage?", "Das Homeoffice ist für sie einsam.", "Fragen kann sie im Büro direkt stellen."], ["Worin sind sich Yusuf und Piet einig?", "Bürotage sollten gemeinsame Tage sein.", "Sonst sitzt man allein im Büro und macht Videocalls."], ["Wie löst Stefanie Yusufs Problem?", "Mit der Kernzeit von 10 bis 15 Uhr.", "Er kann früh zu Hause arbeiten und nach dem Berufsverkehr fahren."], ["Warum bedankt sich Yusuf am Ende?", "Weil das Team mitentscheiden durfte.", "Er hatte eine Entscheidung von oben erwartet."]], "say": ["Ich sage es ganz offen.", "Das bestreitet auch niemand.", "Darf ich einen Vorschlag machen?", "Es ist nicht ideal, aber damit kann ich leben.", "Wir probieren das drei Monate aus."]}, {"id": 37, "title": "Der Betriebsausflug", "level": "B2", "topic": "Arbeitswelt & Freizeit", "rt": "ca. 6 Min.", "teaser": "Kanutour auf dem Neckar statt Workshop im Konferenzraum. Tarek muss ausgerechnet mit seiner Chefin in ein Boot – und das Wasser ist kälter als gedacht.", "body": ["Als im Mai die Einladung zum Betriebsausflug kam, war Tarek nicht gerade begeistert. Kanufahren auf dem Neckar, danach Grillen am Bootshaus. Anwesenheit „ausdrücklich erwünscht“. Tarek arbeitet seit einem Jahr als Softwareentwickler bei einer mittelgroßen Firma in Rottenburg, und sein letztes Paddel hat er im Schullandheim in der Hand gehabt.", "Am Freitagmorgen stehen dreißig Kolleginnen und Kollegen in Funktionskleidung am Ufer. Ein braungebrannter Guide namens Ingo erklärt die Regeln.", "„Leute, hört mal zu! Schwimmwesten bleiben die ganze Zeit an, keine Diskussion. Immer zwei Personen pro Kanadier. Wer hinten sitzt, lenkt. Wer vorne sitzt, gibt das Tempo vor. Und das Wichtigste: Wenn ihr kentert, bleibt beim Boot.“", "„Kentert man denn oft?“, fragt jemand nervös.", "„Nur, wenn man sich streitet“, grinst Ingo. „Also: Die Teams sind ausgelost.“", "Er liest die Namen von einer Liste ab. Bei Tarek stockt er kurz.", "„Tarek Haddad … mit Brigitte Roth.“", "Ein leises Raunen geht durch die Gruppe. Brigitte Roth ist die Bereichsleiterin, also die Chefin von Tareks Chef. Tarek hat bisher genau zweimal mit ihr gesprochen, beide Male in Meetings, beide Male über Budgets.", "„Na, dann wollen wir mal“, sagt Brigitte und reicht ihm ein Paddel. „Sitzen Sie lieber vorne oder hinten?“", "„Ehrlich gesagt habe ich keine Ahnung, was weniger gefährlich ist.“", "„Dann setze ich mich nach hinten. Ich bin früher viel gepaddelt. Und heute sagen wir bitte du, oder? Im Boot gibt es keine Hierarchie.“", "„Gern. Tarek.“", "„Brigitte.“", "„Und wie oft bist du schon gekentert?“, fragt Tarek vorsichtig.", "„Ehrlich? Seit fünfundzwanzig Jahren nicht mehr. Also mach dir keine Sorgen. Und wenn doch: Die Schwimmweste hält uns beide.“", "Die ersten Minuten sind chaotisch. Tarek paddelt links, Brigitte lenkt rechts, und das Kanu dreht sich langsam im Kreis. Vom Nachbarboot ruft jemand: „Bitte nicht die Chefin versenken!“", "„Nicht so viel Kraft“, sagt Brigitte ruhig. „Gleichmäßig. Eins … zwei … eins … zwei. Ich passe mich deinem Rhythmus an.“", "Nach einer Viertelstunde gleitet das Boot gerade über das Wasser. Tarek denkt zum ersten Mal seit Wochen nicht an offene Tickets.", "„Darf ich dich was fragen?“, sagt Brigitte nach einer Weile. „Wie gefällt es dir eigentlich bei uns? Ehrlich. Nicht die Antwort fürs Mitarbeitergespräch.“", "Tarek zögert. Dann denkt er: Im Boot gibt es keine Hierarchie.", "„Die Arbeit macht mir Spaß. Die Kollegen sind super. Aber manchmal habe ich das Gefühl, dass wir Entwickler zu spät gefragt werden. Die Anforderungen kommen fertig vom Vertrieb, und wir müssen dann erklären, warum etwas technisch nicht in zwei Wochen geht.“", "Hinter ihm ist es kurz still. Tarek fragt sich, ob er zu weit gegangen ist.", "„Das höre ich nicht zum ersten Mal“, sagt Brigitte schließlich. „Aber ehrlich gesagt bisher nur über drei Ecken. Danke, dass du es direkt sagst. Hättest du eine Idee, wie man das besser machen könnte?“", "„Vielleicht ein kurzes Treffen ganz am Anfang. Vertrieb und Entwicklung zusammen, bevor dem Kunden etwas versprochen wird. Eine halbe Stunde würde reichen.“", "„Das klingt vernünftig. Schreib mir das am Montag in zwei, drei Sätzen auf. Dann bringe ich es in die nächste Leitungsrunde.“", "Tarek ist so überrascht, dass er vergisst zu paddeln. Genau in diesem Moment kommt die einzige Stromschnelle der ganzen Strecke.", "„Tarek! Paddeln! Rechts!“", "Zu spät. Das Kanu stellt sich quer, kippt zur Seite, und mit einem lauten Platschen landen beide im Neckar.", "Das Wasser ist eiskalt. Tarek taucht prustend auf, die Schwimmweste zieht ihn nach oben. Neben ihm erscheint Brigitte, die Haare im Gesicht, die Sonnenbrille verschwunden.", "„Beim Boot bleiben!“, ruft Ingo von irgendwo.", "„Alles okay?“, keucht Tarek. „Es tut mir so leid! Das war meine Schuld!“", "Brigitte hält sich am umgedrehten Kanu fest. Einen Moment lang sieht sie sehr ernst aus. Dann fängt sie an zu lachen – so laut, dass es über das ganze Wasser hallt.", "„Weißt du, wie lange ich nicht mehr gekentert bin? Fünfundzwanzig Jahre! Das war großartig!“", "Mit Ingos Hilfe klettern sie tropfnass wieder ins Boot. Jemand klatscht. Jemand macht Fotos.", "„Diese Fotos“, ruft Brigitte in die Runde, „erscheinen bitte nicht im Intranet!“", "„Zu spät!“, antwortet eine Kollegin aus der Personalabteilung.", "Den Rest der Strecke paddeln sie ohne Probleme. Am Bootshaus gibt es Handtücher und heißen Tee.", "„Du bist jetzt berühmt“, sagt sein Teamkollege Matteo. „Der Mann, der die Chefin versenkt hat.“", "„Ich hätte lieber für etwas anderes berühmt sein wollen.“", "„Glaub mir, das hier ist besser. Die Leute erinnern sich an so was.“", "„Und was hat sie gesagt? Ist sie sauer?“, fragt Matteo leise.", "„Im Gegenteil. Sie will nächstes Jahr wieder mit mir fahren.“", "Am Abend, als alle schon gehen, kommt Brigitte noch einmal zu ihm, in einem geliehenen Firmen-T-Shirt.", "„Nicht vergessen: Montag, zwei, drei Sätze. Ich meine das ernst.“", "„Mache ich. Und … danke. Für das Gespräch. Und dafür, dass du nicht sauer bist.“", "„Sauer? Das war der beste Betriebsausflug seit Jahren. Nächstes Jahr fahren wir wieder zusammen. Aber dann sitzt du hinten.“", "Am Montag schickt Tarek eine Mail mit drei Sätzen. Zwei Wochen später gibt es das erste gemeinsame Kick-off-Meeting von Vertrieb und Entwicklung. Und im Intranet hängt, trotz aller Bitten, ein Foto von zwei nassen Köpfen neben einem umgedrehten Kanu."], "gl": [["der Betriebsausflug", "company outing"], ["ausdrücklich erwünscht", "explicitly requested"], ["das Paddel / paddeln", "paddle / to paddle"], ["das Ufer", "riverbank"], ["die Schwimmweste", "life jacket"], ["der Kanadier", "Canadian canoe"], ["lenken", "to steer"], ["kentern", "to capsize"], ["auslosen", "to draw lots"], ["das Raunen", "murmur"], ["die Bereichsleiterin", "division head (f.)"], ["gleichmäßig", "evenly / steadily"], ["gleiten", "to glide"], ["über drei Ecken", "indirectly / second-hand"], ["die Leitungsrunde", "management meeting"], ["die Stromschnelle", "rapid(s)"], ["prusten", "to splutter"], ["keuchen", "to gasp / pant"], ["hallen", "to echo"], ["tropfnass", "dripping wet"]], "q": [["Warum ist Tarek anfangs nicht begeistert?", "Er kann kaum paddeln.", "Sein letztes Paddel hatte er im Schullandheim."], ["Warum ist es besonders, dass er mit Brigitte fährt?", "Sie ist die Chefin seines Chefs.", "Er kennt sie nur aus Meetings über Budgets."], ["Welches Problem spricht Tarek an?", "Die Entwicklung wird zu spät gefragt.", "Er schlägt ein gemeinsames Treffen mit dem Vertrieb vor."], ["Warum kentert das Boot?", "Tarek vergisst vor Überraschung zu paddeln.", "Genau dann kommt eine Stromschnelle."], ["Was ist die Folge des Gesprächs?", "Ein gemeinsames Kick-off von Vertrieb und Entwicklung.", "Tarek schickt am Montag drei Sätze an Brigitte."]], "say": ["Sitzen Sie lieber vorne oder hinten?", "Im Boot gibt es keine Hierarchie.", "Darf ich dich was fragen?", "Hättest du eine Idee, wie man das besser machen könnte?", "Das war meine Schuld!"]}, {"id": 38, "title": "Die E-Mail an alle", "level": "B2", "topic": "Arbeitswelt & Kommunikation", "rt": "ca. 6 Min.", "teaser": "Tamara wollte nur ihrer Kollegin schreiben, was sie vom neuen Projektplan hält. Leider ging die Mail an 340 Leute – inklusive Geschäftsführung.", "body": ["Es ist Donnerstag, 16:52 Uhr. Tamara arbeitet seit drei Jahren im Einkauf eines Maschinenbauunternehmens bei Reutlingen. Gerade hat ihr Abteilungsleiter, Herr Lorenz, den neuen Projektplan für das nächste Jahr verschickt. Zwölf Seiten, vier neue Prozesse, keine zusätzlichen Stellen.", "Tamara liest die Mail zweimal. Dann klickt sie auf „Antworten“ und schreibt schnell, was sie denkt. An ihre Kollegin Aylin, mit der sie seit Jahren das Büro teilt.", "„Hast du das gesehen? Vier neue Prozesse und null neue Leute. Lorenz lebt echt in einer anderen Welt. Wer hat sich das ausgedacht, ein Praktikant nach drei Bier? Ich kündige. Spaß. Halb. Kaffee morgen um neun?“", "Sie klickt auf „Senden“, klappt den Laptop zu und fährt nach Hause.", "Um 17:40 Uhr klingelt ihr Handy. Es ist Aylin.", "„Tamara. Bist du gerade am Fahren?“", "„Ich stehe im Stau auf der B27. Warum? Du klingst komisch.“", "„Hast du heute Nachmittag eine Mail geschrieben? Über den Projektplan?“", "„Ja, an dich. Hast du sie nicht bekommen?“", "„Doch. Ich und ungefähr dreihundertvierzig andere Leute. Du hast auf ‚Allen antworten‘ geklickt.“", "Tamara wird schlecht. Sie fährt auf den nächsten Parkplatz und öffnet die Mail auf dem Handy. Im Feld „An“ steht nicht Aylin. Dort steht: „Alle Mitarbeitenden Standort Reutlingen“.", "„Oh nein. Oh nein, nein, nein. Kann ich sie zurückrufen? Es gibt doch diese Funktion.“", "„Hab ich schon für dich probiert, im Kopf. Die Funktion klappt nur, wenn die Leute die Mail noch nicht geöffnet haben. Und ehrlich gesagt hat die schon jeder geöffnet. Im Teams-Kanal vom Vertrieb gibt es schon Memes.“", "„Memes?“", "„Ein Praktikant mit drei Bierflaschen vor einem Flipchart. Es ist ehrlich gesagt ziemlich lustig. Aber ich glaube, Lorenz findet es nicht lustig.“", "Tamara schließt die Augen. „Was soll ich jetzt machen? Krank werden? Auswandern?“", "„Weder noch. Du entschuldigst dich. Morgen früh, persönlich, als Erste. Bevor er zu dir kommt.“", "„Und was sage ich?“", "„Die Wahrheit. Ohne Ausreden. Und dann sagst du, was du inhaltlich eigentlich meinst. Weil – mal ehrlich – du hast ja nicht ganz unrecht.“", "In der Nacht schläft Tamara schlecht. Um halb acht steht sie vor dem Büro von Herrn Lorenz. Die Tür ist offen. Er sitzt am Schreibtisch, einen Kaffee in der Hand, und schaut auf.", "„Frau Schuster. Ich habe Sie schon erwartet.“", "„Guten Morgen, Herr Lorenz. Haben Sie fünf Minuten?“", "„Für Sie heute sogar zehn. Setzen Sie sich.“", "Tamara setzt sich und legt die Hände in den Schoß.", "„Ich möchte mich bei Ihnen entschuldigen. Die Mail von gestern war für eine Kollegin bestimmt, und ich habe versehentlich an alle geantwortet. Aber das ist nicht der eigentliche Punkt. Der Ton war respektlos, und das hätte ich auch privat nicht so schreiben sollen. Das tut mir aufrichtig leid.“", "Herr Lorenz stellt die Tasse ab. Er schweigt einen Moment.", "„Danke, dass Sie gekommen sind. Ich will ehrlich sein: Das mit dem Praktikanten hat mich getroffen. Ich habe an dem Plan drei Wochen gearbeitet.“", "„Das glaube ich Ihnen. Und es war unfair, das so abzuwerten.“", "„Aber“, sagt er und lehnt sich zurück, „ich habe heute Nacht auch nachgedacht. Und ich habe mich gefragt, warum Sie das nicht in der Teamsitzung gesagt haben. Also nicht das mit dem Bier. Den Inhalt.“", "Tamara zögert. „Weil die Sitzungen meistens so laufen, dass der Plan schon fertig ist. Man hat das Gefühl, dass Fragen eher stören.“", "„Hm.“ Er nickt langsam. „Das ist eine unangenehme Antwort. Aber vermutlich eine richtige. Was genau ist denn Ihr Problem mit dem Plan?“", "„Die Prozesse an sich sind sinnvoll. Aber wenn wir alle vier gleichzeitig einführen, ohne zusätzliche Leute, bleibt das Tagesgeschäft liegen. Ich würde vorschlagen, sie gestaffelt einzuführen. Zwei im ersten Halbjahr, zwei im zweiten. Und nach dem ersten Quartal prüfen, ob wir Unterstützung brauchen.“", "Herr Lorenz macht sich eine Notiz.", "„Das ist ein vernünftiger Vorschlag. Warum steht der nicht in Ihrer Mail?“", "„Weil ich um 16:52 Uhr nicht vernünftig war“, sagt Tamara und muss trotz allem lächeln.", "Zum ersten Mal an diesem Morgen lächelt auch Herr Lorenz.", "„Gut. Dann machen wir Folgendes. Sie stellen diesen Vorschlag in der Sitzung am Montag vor. Und ich schreibe heute eine kurze Mail an alle, dass wir den Plan im Team diskutieren werden. Damit ist das Thema für die anderen 340 Leute hoffentlich erledigt.“", "„Das ist sehr fair von Ihnen. Danke.“", "„Eine Bitte noch“, sagt er, als sie schon an der Tür steht. „Falls Sie wieder einmal eine Meinung über meine Pläne haben – sagen Sie sie mir direkt. Dann muss ich sie nicht im Teams-Kanal vom Vertrieb lesen.“", "„Versprochen.“", "Um neun sitzt Tamara mit Aylin in der Teeküche.", "„Und? Lebst du noch?“", "„Ich lebe. Und ich habe am Montag eine Präsentation.“", "„Siehst du. Manchmal ist eine peinliche Mail das Beste, was einem passieren kann.“", "„Das war sie nicht. Das Beste war, dass ich hingegangen bin.“", "Am Nachmittag ändert Tamara eine Einstellung in Outlook: Bei „Allen antworten“ erscheint jetzt eine Warnung. Und Aylin bekommt ab sofort keine Mails mehr über Chefs. Nur noch Kaffee-Einladungen – und die schickt Tamara inzwischen per Teams."], "gl": [["der Einkauf", "purchasing (department)"], ["der Abteilungsleiter", "head of department"], ["die Stelle", "position / job"], ["sich etwas ausdenken", "to come up with sth"], ["Allen antworten", "Reply all"], ["die Mail zurückrufen", "to recall an email"], ["auswandern", "to emigrate"], ["weder noch", "neither"], ["die Ausrede", "excuse"], ["versehentlich", "accidentally"], ["respektlos", "disrespectful"], ["aufrichtig", "sincerely"], ["jemanden treffen (fig.)", "to hurt someone"], ["abwerten", "to belittle"], ["sinnvoll", "sensible / meaningful"], ["das Tagesgeschäft", "day-to-day business"], ["liegen bleiben", "to be left undone"], ["gestaffelt", "staggered / in stages"], ["peinlich", "embarrassing"], ["die Einstellung", "setting"]], "q": [["An wen wollte Tamara die Mail schicken?", "Nur an ihre Kollegin Aylin.", "Sie hat aber auf „Allen antworten“ geklickt."], ["Warum hilft das Zurückrufen der Mail nicht?", "Fast alle haben sie schon geöffnet.", "Im Vertrieb gibt es sogar schon Memes."], ["Wie entschuldigt sich Tamara?", "Persönlich, früh und ohne Ausreden.", "Sie entschuldigt sich vor allem für den respektlosen Ton."], ["Was schlägt Tamara inhaltlich vor?", "Die Prozesse gestaffelt einzuführen.", "Zwei pro Halbjahr und nach dem ersten Quartal prüfen."], ["Worum bittet Herr Lorenz am Ende?", "Kritik künftig direkt an ihn zu richten.", "Nicht über Umwege oder Teams-Kanäle."]], "say": ["Haben Sie fünf Minuten?", "Das war versehentlich an alle.", "Der Ton war respektlos, das tut mir aufrichtig leid.", "Ich würde vorschlagen, es gestaffelt einzuführen.", "Sagen Sie es mir das nächste Mal direkt."]}, {"id": 39, "title": "Der Serverausfall", "level": "B2", "topic": "Arbeit & IT", "rt": "ca. 6 Min.", "teaser": "Montag, 7:58 Uhr: Nichts geht mehr. Kein Login, keine Mails, kein ERP. Benedikt und Oksana aus der IT haben genau eine Stunde, bevor die Produktion stillsteht.", "body": ["Montag, 7:58 Uhr. Benedikt hat gerade seine Jacke ausgezogen, als das Telefon im IT-Büro zum ersten Mal klingelt. Um 8:01 Uhr klingelt es zum zehnten Mal. Um 8:03 Uhr hört er auf zu zählen.", "„IT-Service, Benedikt, guten Morgen.“", "„Hier ist Fischer aus dem Lager. Ich komme nicht ins System. Und die Scanner zeigen alle ‚Verbindung fehlgeschlagen‘. Wir haben um neun einen Lkw, der beladen werden muss!“", "„Danke, Herr Fischer. Wir sind dran. Sie sind nicht der Einzige.“", "Oksana stürmt ins Büro, das Handy noch am Ohr. Sie ist seit vier Jahren Systemadministratorin und normalerweise die Ruhe selbst.", "„Benedikt, der Datenbankserver antwortet nicht. Keine Pings, nichts. Das ERP ist komplett weg. Und damit hängen Lager, Einkauf und Buchhaltung.“", "„Das Monitoring? Hat das nichts gemeldet?“", "„Doch. Um 3:12 Uhr. An eine Mailadresse, die seit dem Umzug ins neue Rechenzentrum niemand mehr liest.“", "Benedikt reibt sich die Augen. „Gut. Eins nach dem anderen. Erst Kommunikation, dann Technik. Sonst klingelt das Telefon, bis wir verrückt werden.“", "Er öffnet das Intranet und schreibt eine kurze Störungsmeldung: Das ERP-System ist derzeit nicht erreichbar. Wir arbeiten mit Hochdruck an der Lösung. Nächstes Update um 8:30 Uhr. Bitte keine Einzelmeldungen an die Hotline.", "„So“, sagt er. „Jetzt du. Was wissen wir?“", "„Ich habe mich über die Fernwartung auf den Host verbunden. Die virtuelle Maschine läuft, aber das Betriebssystem meldet, dass die Festplatte voll ist. Komplett. Null Byte frei.“", "„Voll? Die hat doch zwei Terabyte.“", "„Hatte. Irgendetwas hat übers Wochenende Logdateien geschrieben. Eine einzige Datei ist neunhundert Gigabyte groß.“", "„Welcher Prozess?“", "Oksana tippt. „Der neue Schnittstellendienst zum Versanddienstleister. Der wurde am Freitagnachmittag installiert. Debug-Modus. Er protokolliert jede Millisekunde.“", "„Wer installiert denn am Freitagnachmittag etwas auf einem Produktivsystem?“", "Oksana schaut ihn an. Benedikt erinnert sich plötzlich an Freitag, 16:30 Uhr, an eine Mail vom Dienstleister und an ein „Machen Sie ruhig, ist ja nur ein kleiner Dienst“.", "„Ich“, sagt er leise. „Ich habe es freigegeben.“", "„Okay. Darüber reden wir nachher. Jetzt lösen wir das Problem.“", "Um 8:14 Uhr steht der Werksleiter, Henrik Vollmer, in der Tür. Er ist groß, spricht schnell und hat wenig Geduld.", "„Wie lange noch? Der Lkw nach Lyon muss um neun raus, sonst zahlen wir eine Vertragsstrafe.“", "„Herr Vollmer, wir haben die Ursache gefunden“, sagt Benedikt. „Eine Festplatte ist vollgelaufen. Wir schaffen jetzt Platz und starten die Datenbank neu. Realistisch sind wir in zwanzig bis dreißig Minuten wieder da.“", "„Und wenn nicht?“", "„Dann gibt es einen Plan B. Das Lager kann die Lieferscheine für Lyon aus dem Backup von Freitagabend drucken. Die Aufträge waren da schon fertig. Oksana bereitet das parallel vor.“", "Herr Vollmer nickt knapp. „Gut. Halten Sie mich auf dem Laufenden.“", "Oksana arbeitet konzentriert. Sie stoppt den Schnittstellendienst, verschiebt die riesige Logdatei auf einen Archivspeicher und löscht die Kopie.", "„Achtzig Prozent frei. Ich starte jetzt die Datenbank.“", "„Warte. Bevor du startest: Hast du den Dienst deaktiviert? Nicht nur gestoppt? Sonst startet er beim nächsten Neustart wieder.“", "„Gute Frage.“ Sie tippt. „Jetzt ist er deaktiviert. Okay. Daumen drücken.“", "Zwei Minuten lang starren beide auf den Bildschirm. Die Zeilen laufen durch. Dann erscheint: Datenbank bereit.", "„8:37 Uhr“, sagt Oksana. „Wir sind wieder da.“", "Benedikt ruft im Lager an. „Herr Fischer, probieren Sie es bitte noch einmal.“", "„… Ja! Es geht! Die Scanner auch! Sie sind meine Helden!“", "Um 8:56 Uhr fährt der Lkw nach Lyon vom Hof. Benedikt schreibt das letzte Update ins Intranet: Störung behoben. Vielen Dank für Ihre Geduld.", "Um zehn Uhr sitzen Benedikt, Oksana und Herr Vollmer im Besprechungsraum.", "„Also“, sagt Herr Vollmer. „Was ist passiert, und wie verhindern wir das in Zukunft?“", "Benedikt atmet tief durch. „Ehrlich gesagt war es mein Fehler. Ich habe am Freitagnachmittag eine Installation ohne Test freigegeben. Das hätte ich nicht tun dürfen.“", "Herr Vollmer schaut ihn lange an. „Ich schätze, dass Sie das so offen sagen. Das tut nicht jeder. Und was ändern wir?“", "„Drei Dinge“, sagt Oksana. „Erstens: Keine Änderungen an Produktivsystemen mehr am Freitag nach zwölf. Zweitens: Alle Alarme gehen an ein Bereitschaftshandy, nicht an ein altes Postfach. Drittens: Neue Dienste laufen erst eine Woche auf dem Testsystem.“", "„Und viertens“, ergänzt Benedikt, „schreiben wir nach jeder großen Störung einen kurzen Bericht. Ohne Schuldzuweisung. Damit alle daraus lernen.“", "„Einverstanden“, sagt Herr Vollmer und steht auf. „Und Freitagnachmittag wird ab sofort gefeiert, nicht installiert.“", "Als er weg ist, stellt Oksana Benedikt einen Kaffee hin.", "„Für dich. Weil du es zugegeben hast.“", "„Danke. Und danke, dass du vorhin nicht ‚Hab ich doch gesagt‘ gesagt hast.“", "„Hab ich mir für heute Nachmittag aufgehoben“, sagt Oksana und grinst."], "gl": [["der Serverausfall", "server outage"], ["das ERP (-System)", "ERP system"], ["Verbindung fehlgeschlagen", "connection failed"], ["beladen", "to load"], ["das Rechenzentrum", "data centre"], ["die Störungsmeldung", "outage notice"], ["mit Hochdruck", "at full speed"], ["die Fernwartung", "remote maintenance"], ["die Logdatei / protokollieren", "log file / to log"], ["der Versanddienstleister", "shipping provider"], ["freigeben", "to approve / release"], ["der Werksleiter", "plant manager"], ["die Vertragsstrafe", "contractual penalty"], ["die Ursache", "cause"], ["vollgelaufen", "filled up (completely)"], ["der Lieferschein", "delivery note"], ["auf dem Laufenden halten", "to keep informed"], ["deaktivieren", "to disable"], ["das Bereitschaftshandy", "on-call phone"], ["die Schuldzuweisung", "blame / assigning blame"]], "q": [["Warum hat niemand den Alarm um 3:12 Uhr bemerkt?", "Er ging an ein altes Postfach.", "Seit dem Umzug ins neue Rechenzentrum liest es niemand."], ["Was war die technische Ursache?", "Die Festplatte war voll.", "Ein Dienst im Debug-Modus hat riesige Logdateien geschrieben."], ["Warum schreibt Benedikt zuerst eine Meldung im Intranet?", "Damit nicht alle einzeln anrufen.", "Erst Kommunikation, dann Technik."], ["Was ist Plan B für den Lkw?", "Lieferscheine aus dem Backup von Freitag drucken.", "Die Aufträge für Lyon waren schon fertig."], ["Welche Regeln führen sie ein?", "Kein Freitag-Deployment, Bereitschaftshandy, Testphase, Bericht.", "Der Bericht soll ohne Schuldzuweisung sein."]], "say": ["Wir sind dran, Sie sind nicht der Einzige.", "Eins nach dem anderen.", "Wir haben die Ursache gefunden.", "Halten Sie mich auf dem Laufenden.", "Ehrlich gesagt war es mein Fehler."]}, {"id": 40, "title": "Beim Finanzamt", "level": "B2", "topic": "Behörden & Finanzen", "rt": "ca. 6 Min.", "teaser": "Nach der Hochzeit hat Chidi plötzlich weniger Netto. Ein Besuch beim Finanzamt bringt Klarheit über Steuerklassen – und über deutsche Behördensprache.", "body": ["Chidi Okafor ist seit drei Monaten verheiratet. Er liebt seine Frau Anja, er liebt ihre gemeinsame Wohnung in Ludwigsburg, und bis letzte Woche liebte er auch seine Gehaltsabrechnung. Dann kam die für Oktober.", "„Anja, schau mal. Ich habe fast dreihundert Euro weniger netto als im September. Hat meine Firma einen Feh
